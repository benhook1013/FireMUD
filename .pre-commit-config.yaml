repos:
  - repo: local
    hooks:
      - id: spotless
        name: Spotless (apply)
        entry: ./gradlew spotlessApply
        language: system
        pass_filenames: false

      - id: markdownlint-fix
        name: markdownlint --fix
        entry: ./gradlew lintMarkdownFix
        language: system
        files: \.md$

      - id: hadolint
        name: Dockerfile Lint
        entry: hadolint
        language: system
        files: (?i)^Dockerfile$|\.Dockerfile$
        args: ["-c", "config/hadolint/hadolint.yaml"]

      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        files: ^(dev-tools/.*\.sh|scripts/.*\.sh|config/git-hooks/.*)$
