[versions]
spring-boot = "3.5.10"
flyway = "12.0.0"
mapstruct = "1.6.3"
lombok = "1.18.42"
lombok-mapstruct-binding = "0.2.0"
grpc = "1.79.0"
protobuf = "4.33.5"
opentelemetry = "1.58.0"
micrometer = "1.16.2"
jjwt = "0.13.0"
aws-sdk = "2.41.23"
argon2 = "2.12"
h2 = "2.4.240"
testcontainers = "1.21.4"

[libraries]
# Spring Boot Starters
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version = "4.0.3" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version = "4.0.3" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version = "4.0.3" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis", version = "4.0.3" }
spring-boot-starter-data-redis-reactive = { module = "org.springframework.boot:spring-boot-starter-data-redis-reactive", version = "4.0.3" }
spring-boot-starter-aop = { module = "org.springframework.boot:spring-boot-starter-aop", version = "4.0.3" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail", version = "4.0.3" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version = "4.0.3" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version = "4.0.3" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc", version = "4.0.3" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache", version = "4.0.3" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version = "4.0.3" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket", version = "4.0.3" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux", version = "4.0.3" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version = "4.0.3" }

flyway-core = { module = "org.flywaydb:flyway-core", version = "12.0.3" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version = "12.0.3" }

mapstruct = { module = "org.mapstruct:mapstruct", version = "1.6.3" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version = "1.6.3" }

lombok = { module = "org.projectlombok:lombok", version = "1.18.42" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version = "0.2.0" }

grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version = "1.79.0" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version = "1.79.0" }
grpc-stub = { module = "io.grpc:grpc-stub", version = "1.79.0" }
protoc-gen-grpc-java = { module = "io.grpc:protoc-gen-grpc-java", version = "1.79.0" }

protobuf-java = { module = "com.google.protobuf:protobuf-java", version = "4.34.0" }
protoc = { module = "com.google.protobuf:protoc", version = "4.34.0" }

opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version = "1.60.1" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version = "1.60.1" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version = "1.60.1" }

micrometer-core = { module = "io.micrometer:micrometer-core", version = "1.16.3" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version = "1.16.3" }

jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version = "0.13.0" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version = "0.13.0" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version = "0.13.0" }
argon2 = { module = "de.mkammerer:argon2-jvm", version = "2.12" }

grpc-spring-boot-starter = { module = "io.github.lognet:grpc-spring-boot-starter", version = "5.2.0" }
postgresql = { module = "org.postgresql:postgresql", version = "42.7.10" }
aws-sdk-s3 = { module = "software.amazon.awssdk:s3", version = "2.42.13" }
h2 = { module = "com.h2database:h2", version = "2.4.240" }

# Keep Springdoc on 2.x until we migrate to Spring Boot 4.x. Springdoc 3.x depends on Spring Boot 4.x artifacts,
# which causes classpath skew and breaks Spring Boot 3.x test slices (e.g., @WebMvcTest / spring-boot-test-autoconfigure).
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version = "3.0.2" }
stripe-java = { module = "com.stripe:stripe-java", version = "31.4.1" }
otp-java = { module = "com.github.bastiaanjansen:otp-java", version = "2.1.0" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.17" }
spring-cloud-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway", version = "4.3.3" }

testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version = "1.21.4" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version = "1.21.4" }

[plugins]
spring-boot = { id = "org.springframework.boot", version = "4.0.3" }
flyway = { id = "org.flywaydb.flyway", version = "12.0.3" }
protobuf = { id = "com.google.protobuf", version = "0.9.6" }
