codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "50...90"
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, files"
  behavior: default
  require_changes: true

ignore:
  - "buildSrc/**"
  - "config/**"
  - "design/**"
  - "dev-tools/**"
  - "docker/**"
  - "k8s/**"
  - "protos/**"
