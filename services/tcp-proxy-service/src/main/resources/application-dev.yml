# Development overrides for tcp-proxy-service
spring:
  application:
    name: tcp-proxy-service
  flyway:
    enabled: false
  ssl:
    bundle:
      pem:
        firemud-grpc:
          keystore:
            certificate: ${FIREMUD_GRPC_CERT_CHAIN_PATH:classpath:certs/dev-cert.pem}
            private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:classpath:certs/dev-key.pem}
          truststore:
            certificate: ${FIREMUD_GRPC_CA_CERT_PATH:classpath:certs/dev-ca.pem}
  grpc:
    server:
      ssl:
        enabled: ${GRPC_SERVER_TLS_ENABLED:false}
        bundle: firemud-grpc
        client-auth: ${GRPC_SERVER_CLIENT_AUTH:NONE}

GATEWAY_WS_URL: ${TCP_PROXY_GATEWAY_WS_URL_DEV:ws://localhost:8080/dev/echo}

firemud:
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:classpath:certs/dev-cert.pem}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:classpath:certs/dev-key.pem}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:classpath:certs/dev-ca.pem}
  database:
    enabled: false
