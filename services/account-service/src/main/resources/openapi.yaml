openapi: 3.0.3
info:
  title: Account Service API
  description: >-
    API for user accounts and authentication. The obsolete caller-asserted
    POST /accounts/{accountId}/external route is removed and denied at the
    public edge; no provider-linking route is available until the
    server-verified global-account flow and its proof converge. Account's
    POST /auth/bootstrap/join facade and local operation are implemented;
    external Gateway exposure remains blocked pending JOIN recovery and
    reconciliation (#2848), PostgreSQL runtime proof, and direct text-client
    end-to-end proof.
  version: 1.0.0
  license:
    name: PolyForm Noncommercial License 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0
servers:
  - url: https://api.firemud.com
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AccountUuidPathSelector:
      name: accountId
      in: path
      required: true
      description: >-
        Canonical lowercase non-nil persisted Account UUID. Numeric Account storage IDs and
        noncanonical UUID text are rejected.
      schema:
        $ref: '#/components/schemas/AccountUuidSelector'
  responses:
    RetryableAuthenticationUnavailable:
      description: Retryable authority outage; error code is AUTH_UNAVAILABLE or ENTITLEMENT_UNAVAILABLE
      content:
        application/json:
          schema:
            type: object
            required: [status, error]
            properties:
              status:
                type: string
                enum: [ERROR]
              error:
                $ref: '#/components/schemas/ErrorDetail'
  schemas:
    AccountUuidSelector:
      type: string
      format: uuid
      pattern: '^(?!00000000-0000-0000-0000-000000000000$)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    CreateAccountRequest:
      type: object
      description: Creates a global account. Tenant membership and profiles are established separately.
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
      required: [username, email, password]
    AccountDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Canonical non-nil Account UUID; never the numeric database primary key.
        username:
          type: string
        email:
          type: string
        role:
          type: string
    AccountLoginAuthModesDto:
      type: object
      required: [loginAuthModes]
      properties:
        loginAuthModes:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
            enum: [PASSWORD, EMAIL_OTP]
    UpdateAccountLoginAuthModesRequest:
      type: object
      required: [loginAuthModes]
      properties:
        loginAuthModes:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
            enum: [PASSWORD, EMAIL_OTP]
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
        password:
          type: string
          minLength: 1
          maxLength: 100
      required: [username, password]
    PlayerBootstrapRequest:
      type: object
      properties:
        accountIdentifier:
          type: string
          minLength: 1
          maxLength: 254
          pattern: '.*\S.*'
        secret:
          type: string
          minLength: 6
          maxLength: 100
          pattern: '.*\S.*'
      required: [accountIdentifier, secret]
    AuthenticationResult:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
          description: Canonical non-nil Account UUID read back from the authenticated source row; never the numeric database primary key.
        authToken:
          type: string
      required: [accountId, authToken]
    PlayerBootstrapResult:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
          description: Canonical lowercase non-nil persisted Account UUID; never the private numeric database primary key.
        bootstrapToken:
          type: string
        issuedAt:
          type: string
        expiresAt:
          type: string
    ConnectTokenRequest:
      type: object
      properties:
        connectScopeId:
          type: string
          description: Opaque signed scope with canonical UUID Account identity; obtain fresh scope through discovery rather than interpreting its payload.
        requestId:
          type: string
      required: [connectScopeId, requestId]
    ConnectTokenResponse:
      type: object
      properties:
        accountId:
          type: integer
        tenantId:
          type: integer
        gameInstanceId:
          type: integer
        realmSlug:
          type: string
        connectScopeId:
          type: string
          description: Opaque signed scope with canonical UUID Account identity; obtain fresh scope through discovery rather than interpreting its payload.
        jti:
          type: string
        requestId:
          type: string
        issuedAt:
          type: string
        expiresAt:
          type: string
        replayed:
          type: boolean
    BootstrapWorldDto:
      type: object
      description: Tenant-qualified world selector; worldSlug is not globally unique.
      required: [tenantSlug, worldSlug, displayName]
      properties:
        tenantSlug:
          type: string
        worldSlug:
          type: string
        displayName:
          type: string
    BootstrapRealmDto:
      type: object
      description: Public realm selector evidence; the retained scope does not grant entry or character access.
      required:
        [worldSlug, realmSlug, realmId, tenantId, gameInstanceId, catalogRevision, playableStateNamespaceId, playableStateScope]
      properties:
        worldSlug:
          type: string
        realmSlug:
          type: string
        realmId:
          type: string
          format: uuid
        displayName:
          type: string
        tenantId:
          type: string
          format: uuid
        gameInstanceId:
          type: string
          format: uuid
        pointerVersion:
          type: integer
        catalogRevision:
          type: integer
          format: int64
          minimum: 1
        playableStateNamespaceId:
          type: string
          format: uuid
        playableStateScope:
          type: string
          enum: [PLAYABLE_STATE_SCOPE_SHARED, PLAYABLE_STATE_SCOPE_ISOLATED]
        stateScope:
          type: string
          enum: [SHARED, ISOLATED]
        characterCreationPolicy:
          type: string
        evaluatedAt:
          type: string
        connectScopeExpiresAt:
          type: string
        connectScopeId:
          type: string
          description: Opaque signed scope with canonical UUID Account identity; obtain fresh scope through discovery rather than interpreting its payload.
    BootstrapCharacterDto:
      type: object
      description: Persisted, non-admitting actor discovery for the current public SHARED PRESEEDED_ONLY target.
      required: [characterId, characterName, level, stateScope, characterCreationPolicy]
      properties:
        characterId:
          type: string
          format: uuid
        characterName:
          type: string
          minLength: 1
          maxLength: 100
        level:
          type: integer
          format: int32
          minimum: 0
          description: Actual persisted Entity level from the same eligible actor row.
        stateScope:
          type: string
          enum: [SHARED]
        characterCreationPolicy:
          type: string
          enum: [PRESEEDED_ONLY]
    ResultStatus:
      type: string
      enum: [SUCCESS, ERROR]
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    ProfileDto:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
          format: int64
        accountId:
          type: string
          format: uuid
          description: Canonical non-nil Account UUID; never a private database row ID.
        displayName:
          type: string
        bio:
          type: string
        presenceVisibilityPolicy:
          type: string
          enum: [PUBLIC, FRIENDS_ONLY, PRIVATE]
    UpdateProfileRestRequest:
      type: object
      description: >-
        REST selector is a canonical lowercase non-nil Account UUID and must match the path accountId.
      properties:
        tenantId:
          type: integer
          format: int64
        accountId:
          $ref: '#/components/schemas/AccountUuidSelector'
        displayName:
          type: string
        bio:
          type: string
        presenceVisibilityPolicy:
          type: string
          enum: [PUBLIC, FRIENDS_ONLY, PRIVATE]
      required: [tenantId, accountId, presenceVisibilityPolicy]
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
      required: [email]
    CompletePasswordResetRequest:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
      required: [token, newPassword]
    UsernameRecoveryRequest:
      type: object
      properties:
        email:
          type: string
      required: [email]
    EmailVerificationRequest:
      type: object
      properties:
        email:
          type: string
      required: [email]
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
      required: [token]
paths:
  /billing/hosting/webhook:
    post:
      operationId: receiveHostingFirstInvoiceSignedEvent
      x-runtime-status: isolated_only_default_off
      summary: Receive an exact raw provider-signed first-invoice event
      description: Actual HTTPS only. Single bounded signature and exact raw UTF-8 body; provider signature is independent of user authentication. This handler is default-off and registered only for controlled-fixture source integration. Actual provider/customer data intake requires separate live-provider and customer-data qualification plus the applicable retention, custody and deployment prerequisites; production registration remains closed.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: {type: string, maxLength: 4096}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'JSON object; signature verification uses exact original raw UTF-8 bytes, at most 262144 bytes'
      responses:
        '200': {description: Original Account completion state; no-store}
        '400': {description: 'Missing, ambiguous, malformed or invalid signed event'}
        '401': {description: Actual HTTPS required}
        '409': {description: Exact retained event or billing evidence refused}
        '413': {description: Event body exceeds the bound}
        '502': {description: Provider outcome remains uncertain}
        '503': {description: Retained completion is still reconciling; same signed event may be redelivered}
  /billing/hosting/subscriptions/{subscriptionId}/first-invoice:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Retrieve the exact retained first invoice for its current billing owner
      operationId: getHostingFirstInvoice
      x-runtime-status: isolated_only_default_off
      description: Current HTTPS control-ui billing owner only. No-store exact existing first invoice; never a client secret.
      responses:
        '200':
          description: Existing invoice and non-authorizing payment or independently committed state
          content:
            application/json:
              schema:
                type: object
                required: [subscriptionId, invoiceId, paymentIntentId, paymentInstrumentId, amount, currency, tupleDigest, expectedRowVersion, state, expiresAt, confirmationRequestId, preRowOriginalRequestId, authorizationVersion]
                properties:
                  subscriptionId: {type: string, format: uuid}
                  invoiceId: {type: string}
                  paymentIntentId: {type: string}
                  paymentInstrumentId: {type: string, format: uuid}
                  amount: {type: string, pattern: '^[1-9][0-9]*$', description: Exact integer Stripe minor units}
                  currency: {type: string, pattern: '^[a-z]{3}$'}
                  tupleDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                  expectedRowVersion: {type: integer, format: int64, minimum: 1}
                  state: {type: string, enum: [AWAITING_PAYMENT, COMMITTED, CANCELED]}
                  expiresAt: {type: string, format: date-time}
                  confirmationRequestId: {type: string, format: uuid, nullable: true}
                  preRowOriginalRequestId: {type: string, format: uuid, nullable: true, description: Server-verified original operation identity before a confirmation row exists. Observational only; requires fresh explicit consent and PRE_ROW_RENEWAL authentication. Null once a confirmation exists.}
                  authorizationVersion: {type: integer, format: int64, minimum: 0}
        '401': {description: Protected current control-ui owner authentication required}
        '409': {description: Exact evidence refused; prior provider outcome may remain uncertain}
  /billing/hosting/subscriptions/{subscriptionId}/first-invoice/reauthenticate:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Reauthenticate the current billing owner for first-invoice payment
      operationId: reauthenticateHostingFirstInvoice
      x-runtime-status: isolated_only_default_off
      description: Actual ordinary primary authentication for HOSTING_FIRST_INVOICE_PAYMENT. A new billing proof requires an exact billingBinding. Omitting billingBinding only replays an exact previously retained unbound historical request; a fresh unbound billing request returns 409 without creating evidence, and historical unbound evidence cannot authorize consent. No gameplay or game-creation proof accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, confirmationRequestId, billingBinding, email, secret]
              properties:
                requestId: {type: string, format: uuid}
                confirmationRequestId: {type: string, format: uuid}
                email: {type: string, format: email}
                secret: {type: string, format: password, writeOnly: true}
                billingBinding:
                  type: object
                  additionalProperties: false
                  description: Required for a new billing proof. Bind the exact retained invoice and original operation. Omission permits only exact replay of a previously retained unbound historical request and cannot create new evidence or authorize consent.
                  required: [originalRequestId, expectedRowVersion, expectedAuthorizationVersion, acceptedTupleDigest, invoiceExpiresAt, authorizationPurpose]
                  properties:
                    originalRequestId: {type: string, format: uuid}
                    expectedRowVersion: {type: integer, format: int64, minimum: 1}
                    expectedAuthorizationVersion: {type: integer, format: int64, minimum: 0}
                    acceptedTupleDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                    invoiceExpiresAt: {type: string, format: date-time}
                    authorizationPurpose: {type: string, enum: [INITIAL_CONFIRMATION, PRE_ROW_RENEWAL, FOLLOWUP_RENEWAL]}
      responses:
        '200':
          description: Retained purpose-specific ordinary reauthentication evidence
          content:
            application/json:
              schema:
                type: object
                required: [evidenceId]
                properties:
                  evidenceId: {type: string, format: uuid}
        '401': {description: Current owner authentication or ordinary secret refused}
        '409':
          description: Fresh unbound billing request without evidence creation, exact binding refused, or exact current evidence unavailable
  /billing/hosting/subscriptions/{subscriptionId}/first-invoice/confirm:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Confirm explicit consent for the retained first-invoice payment
      operationId: confirmHostingFirstInvoice
      x-runtime-status: isolated_only_default_off
      description: Exact explicit consent and one durable existing-intent command; repeat requests reconcile read-only and never create or confirm another payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, expectedRowVersion, reauthenticationEvidenceId, acceptedTupleDigest, acceptCharge]
              properties:
                requestId: {type: string, format: uuid}
                expectedRowVersion: {type: integer, format: int64, minimum: 1}
                reauthenticationEvidenceId: {type: string, format: uuid}
                acceptedTupleDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                acceptCharge: {type: boolean, enum: [true]}
      responses:
        '200':
          description: No-store provider status; browser success is not Account fulfillment
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [requires_action, processing, succeeded, requires_confirmation, requires_payment_method, AUTHORIZED_NOT_CONFIRMED]}
                  clientSecret: {type: string, nullable: true, description: Present only for current owner requires_action handoff; never persisted or logged}
        '400': {description: Missing explicit charge consent}
        '401': {description: Protected current control-ui owner authentication required}
        '409': {description: Exact evidence refused; preserve the original operation and uncertain outcome}
        '502': {description: FIRST_INVOICE_PROVIDER_UNCERTAIN; preserve original operation and poll status}
  /billing/hosting/subscriptions/{subscriptionId}/first-invoice/renew:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Renew authorization for the same first-invoice payment operation
      operationId: renewHostingFirstInvoiceAuthorization
      x-runtime-status: isolated_only_default_off
      description: Fresh primary reauthentication and explicit unchanged consent renew authorization on the original operation. Use expectedAuthorizationVersion zero for PRE_ROW_RENEWAL before a confirmation exists. A prior durable command claim is never resent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, authorizationRequestId, expectedAuthorizationVersion, expectedRowVersion, reauthenticationEvidenceId, acceptedTupleDigest, acceptCharge]
              properties:
                requestId: {type: string, format: uuid}
                authorizationRequestId: {type: string, format: uuid}
                expectedAuthorizationVersion: {type: integer, format: int64, minimum: 0}
                expectedRowVersion: {type: integer, format: int64, minimum: 1}
                reauthenticationEvidenceId: {type: string, format: uuid}
                acceptedTupleDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                acceptCharge: {type: boolean, enum: [true]}
      responses:
        '200':
          description: No-store provider status; browser success is not Account fulfillment
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [requires_action, processing, succeeded, requires_confirmation, requires_payment_method, AUTHORIZED_NOT_CONFIRMED]}
                  clientSecret: {type: string, nullable: true, description: Present only for current owner requires_action handoff; never persisted or logged}
        '400': {description: Missing explicit charge consent}
        '401': {description: Protected current control-ui owner authentication required}
        '409': {description: Exact evidence refused; preserve the original operation and uncertain outcome}
        '502': {description: FIRST_INVOICE_PROVIDER_UNCERTAIN; preserve original operation and poll status}
  /ping:
    get:
      summary: Health check endpoint
      operationId: ping
      security: []
      responses:
        '200':
          description: Pong response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
              example:
                data: pong
        '400':
          description: Bad request
  /auth/login:
    post:
      summary: Legacy Account HTTP login outside isolated checkout receiving
      description: Isolated checkout receiving rejects this direct handler. Its canonical Gateway login uses verified mTLS Account issuance, with no HMAC checkout fallback.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/ResultStatus'
                  data:
                    $ref: '#/components/schemas/AuthenticationResult'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Invalid credentials
  /auth/player-bootstrap:
    post:
      summary: Authenticate and return a short-lived first-party bootstrap token
      operationId: playerBootstrap
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerBootstrapRequest'
      responses:
        '200':
          description: Bootstrap result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/ResultStatus'
                  data:
                    $ref: '#/components/schemas/PlayerBootstrapResult'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Invalid credentials
  /auth/bootstrap/worlds:
    get:
      summary: List caller-visible worlds for first-party gameplay bootstrap
      operationId: listBootstrapWorlds
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visible worlds
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/ResultStatus'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BootstrapWorldDto'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Invalid or expired bootstrap token
        '503':
          $ref: '#/components/responses/RetryableAuthenticationUnavailable'
  /auth/bootstrap/worlds/{worldSlug}/realms:
    get:
      summary: List caller-visible realms for a tenant-qualified world
      operationId: listBootstrapRealms
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: worldSlug
          required: true
          schema:
            type: string
        - in: query
          name: tenantSlug
          required: true
          description: Tenant selector from the selected BootstrapWorldDto; required because worldSlug is tenant-scoped.
          schema:
            type: string
      responses:
        '200':
          description: Visible realms
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/ResultStatus'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BootstrapRealmDto'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Invalid or expired bootstrap token
        '503':
          $ref: '#/components/responses/RetryableAuthenticationUnavailable'
  /auth/bootstrap/worlds/{worldSlug}/realms/{realmSlug}/characters:
    get:
      summary: List caller-visible characters for a selected world and realm
      operationId: listBootstrapCharacters
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: worldSlug
          required: true
          schema:
            type: string
        - in: path
          name: realmSlug
          required: true
          schema:
            type: string
        - in: query
          name: connectScopeId
          required: true
          description: Opaque signed target proof returned by realm discovery
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Visible characters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/ResultStatus'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BootstrapCharacterDto'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Invalid or expired bootstrap token
        '403':
          description: Gameplay admission denied for this authenticated account or selected realm
        '409':
          description: Admission routing evidence is invalid or stale; rediscover realms and obtain a fresh connectScopeId before retrying
        '503':
          $ref: '#/components/responses/RetryableAuthenticationUnavailable'
  /auth/connect-token:
    post:
      summary: Mint a short-lived gameplay connect token from a valid player-bootstrap token
      operationId: connectToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectTokenRequest'
      responses:
        '200':
          description: Connect token metadata; the token is carried only by the HttpOnly cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/ResultStatus'
                  data:
                    $ref: '#/components/schemas/ConnectTokenResponse'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Invalid or expired bootstrap token
        '403':
          description: Gameplay admission denied for this authenticated account or selected realm
        '409':
          description: Admission routing evidence is invalid or stale; rediscover realms and obtain a fresh connectScopeId before retrying
        '503':
          $ref: '#/components/responses/RetryableAuthenticationUnavailable'
  /auth/request-password-reset:
    post:
      summary: Request password reset
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Request accepted
        '400':
          description: Invalid request
  /auth/complete-password-reset:
    post:
      summary: Complete password reset
      operationId: completePasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletePasswordResetRequest'
      responses:
        '200':
          description: Password updated
        '400':
          description: Invalid token
  /auth/request-email-verification:
    post:
      summary: Request email verification
      operationId: requestEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '200':
          description: Request accepted
        '400':
          description: Invalid request
  /auth/verify-email:
    post:
      summary: Verify email token
      operationId: verifyEmail
      description: >-
        The public POST verifies an account-scoped email token without bearer
        authentication. The configured verification email still links to
        GET /auth/verify-email, which has no controller mapping; browser
        handoff to the public POST remains unavailable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified
        '400':
          description: Invalid verification token
  /auth/recover-username:
    post:
      summary: Send username reminder
      operationId: recoverUsername
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameRecoveryRequest'
      responses:
        '200':
          description: Email sent
        '400':
          description: Invalid request
  /accounts:
    post:
      summary: Create a new global account
      operationId: createAccount
      description: Registration creates global account and security state only; it does not join a tenant or create a profile.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '200':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        '400':
          description: Invalid account data
        '409':
          description: Username or canonical email already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/ResultStatus'
                  data:
                    type: object
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
  /accounts/{accountId}/export:
    get:
      summary: Export Account and profile-local data across tenants
      operationId: exportAccount
      parameters:
        - $ref: '#/components/parameters/AccountUuidPathSelector'
      responses:
        '200':
          description: Exported data
        '400':
          description: Invalid account ID
        '403':
          description: Account access required
        '503':
          description: Account UUID owner evidence is unavailable
  /accounts/{accountId}/login-auth-modes:
    get:
      summary: Get allowed primary login mechanisms for an account
      operationId: getLoginAuthModes
      parameters:
        - $ref: '#/components/parameters/AccountUuidPathSelector'
      responses:
        '200':
          description: Allowed login mechanisms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLoginAuthModesDto'
        '400':
          description: Invalid account ID or authentication-mode data
        '403':
          description: Account access required
        '503':
          description: Account UUID owner evidence is unavailable
    put:
      summary: Replace allowed primary login mechanisms for an account (currently unavailable)
      operationId: updateLoginAuthModes
      parameters:
        - $ref: '#/components/parameters/AccountUuidPathSelector'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountLoginAuthModesRequest'
      responses:
        '400':
          description: Invalid account ID, login mechanism set, or unverified email-OTP selection
        '403':
          description: Account access required
        '501':
          description: Recent ordinary reauthentication is required, but this mutation is unavailable until Account implements its evidence mechanism
        '503':
          description: Account UUID owner evidence is unavailable
  /accounts/{accountId}/tenant-export:
    get:
      summary: Export tenant-scoped account data
      operationId: exportTenantData
      parameters:
        - $ref: '#/components/parameters/AccountUuidPathSelector'
        - name: tenantId
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Exported tenant data
        '400':
          description: Invalid account or tenant ID
        '403':
          description: Account access required
        '503':
          description: Account UUID owner evidence is unavailable
  /accounts/{accountId}:
    delete:
      summary: Refuse account deletion until retention-safe deletion is available
      operationId: deleteAccount
      parameters:
        - $ref: '#/components/parameters/AccountUuidPathSelector'
      responses:
        '400':
          description: Invalid account ID
        '403':
          description: Account access required
        '409':
          description: Account deletion is blocked or unavailable
        '503':
          description: Account UUID owner evidence is unavailable
  /profiles/{accountId}:
    get:
      summary: Get the caller's tenant profile
      operationId: getProfile
      parameters:
        - $ref: '#/components/parameters/AccountUuidPathSelector'
        - name: tenantId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDto'
        '400':
          description: Invalid Account UUID selector or tenant ID
        '403':
          description: The authenticated Account does not own the selected profile
        '503':
          description: Account UUID owner evidence is unavailable or inconsistent
    put:
      summary: Update the caller's tenant profile
      operationId: updateProfile
      parameters:
        - $ref: '#/components/parameters/AccountUuidPathSelector'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRestRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDto'
        '400':
          description: >-
            Invalid Account UUID selector, tenant ID, or profile data; the body Account UUID must match
            the path.
        '403':
          description: The authenticated Account does not own the selected profile
        '503':
          description: Account UUID owner evidence is unavailable or inconsistent
  /.well-known/jwks.json:
    get:
      summary: JWKS public keys
      operationId: jwks
      security: []
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
