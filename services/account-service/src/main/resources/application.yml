spring:
  application:
    name: account-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public}
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}
    table: ${SPRING_FLYWAY_TABLE:flyway_schema_history_${SERVICE_SCHEMA:public}}
    placeholders:
      serviceSchema: ${SERVICE_SCHEMA:public}
  ssl:
    bundle:
      pem:
        firemud-grpc:
          keystore:
            certificate: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
            private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
          truststore:
            certificate: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  grpc:
    server:
      port: 6565
      shutdown-grace-period: 30s
      keep-alive:
        time: 30s
        timeout: 5s
        permit-without-calls: true
      ssl:
        enabled: ${GRPC_SERVER_TLS_ENABLED:true}
        bundle: firemud-grpc
        client-auth: REQUIRE
  mail:
    host: localhost
    port: 1025
    username: ''
    password: ''
firemud:
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  account:
    credentials:
      cleanup:
        batch-size: ${FIREMUD_ACCOUNT_CREDENTIAL_CLEANUP_BATCH_SIZE:100}
        interval-ms: ${FIREMUD_ACCOUNT_CREDENTIAL_CLEANUP_INTERVAL_MS:60000}
    join-reconciliation:
      batch-size: ${FIREMUD_ACCOUNT_JOIN_RECONCILIATION_BATCH_SIZE:50}
      max-attempts: ${FIREMUD_ACCOUNT_JOIN_RECONCILIATION_MAX_ATTEMPTS:12}
      interval-ms: ${FIREMUD_ACCOUNT_JOIN_RECONCILIATION_INTERVAL_MS:30000}
      backoff-ms: ${FIREMUD_ACCOUNT_JOIN_RECONCILIATION_BACKOFF_MS:30000}
    connect-scopes:
      cleanup:
        batch-size: ${FIREMUD_ACCOUNT_CONNECT_SCOPE_CLEANUP_BATCH_SIZE:100}
        interval-ms: ${FIREMUD_ACCOUNT_CONNECT_SCOPE_CLEANUP_INTERVAL_MS:60000}
    platform-auth-abuse:
      cache-redis:
        url: ${FIREMUD_REDIS_CACHE_URL:}
        host: ${FIREMUD_REDIS_CACHE_HOST:redis-cache}
        port: ${FIREMUD_REDIS_CACHE_PORT:6379}
        database: ${FIREMUD_ACCOUNT_AUTH_ABUSE_CACHE_REDIS_DATABASE:0}
        command-timeout-millis: ${FIREMUD_ACCOUNT_AUTH_ABUSE_CACHE_COMMAND_TIMEOUT_MS:1000}
        username: ${FIREMUD_REDIS_CACHE_USERNAME:}
        password: ${FIREMUD_REDIS_CACHE_PASSWORD:}
        use-ssl: ${FIREMUD_REDIS_CACHE_USE_SSL:false}
        start-tls: ${FIREMUD_REDIS_CACHE_START_TLS:false}
        verify-peer: ${FIREMUD_REDIS_CACHE_VERIFY_PEER:true}
      hmac-key-id: ${FIREMUD_ACCOUNT_AUTH_ABUSE_HMAC_KEY_ID:}
      hmac-key-base64: ${FIREMUD_ACCOUNT_AUTH_ABUSE_HMAC_KEY_BASE64:}
      subject-window-seconds: ${FIREMUD_ACCOUNT_AUTH_ABUSE_SUBJECT_WINDOW_SECONDS:300}
      global-window-seconds: ${FIREMUD_ACCOUNT_AUTH_ABUSE_GLOBAL_WINDOW_SECONDS:60}
      global-admissions-per-window: ${FIREMUD_ACCOUNT_AUTH_ABUSE_GLOBAL_ADMISSIONS_PER_WINDOW:1000}
      source-attempts-per-window: ${FIREMUD_ACCOUNT_AUTH_ABUSE_SOURCE_ATTEMPTS_PER_WINDOW:60}
      candidate-attempts-per-window: ${FIREMUD_ACCOUNT_AUTH_ABUSE_CANDIDATE_ATTEMPTS_PER_WINDOW:20}
      source-failures-per-window: ${FIREMUD_ACCOUNT_AUTH_ABUSE_SOURCE_FAILURES_PER_WINDOW:20}
      candidate-failures-per-window: ${FIREMUD_ACCOUNT_AUTH_ABUSE_CANDIDATE_FAILURES_PER_WINDOW:5}
      source-retry-base-seconds: ${FIREMUD_ACCOUNT_AUTH_ABUSE_SOURCE_RETRY_BASE_SECONDS:5}
      candidate-retry-base-seconds: ${FIREMUD_ACCOUNT_AUTH_ABUSE_CANDIDATE_RETRY_BASE_SECONDS:15}
      global-retry-base-seconds: ${FIREMUD_ACCOUNT_AUTH_ABUSE_GLOBAL_RETRY_BASE_SECONDS:5}
      max-retry-seconds: ${FIREMUD_ACCOUNT_AUTH_ABUSE_MAX_RETRY_SECONDS:300}
      max-counter-value: ${FIREMUD_ACCOUNT_AUTH_ABUSE_MAX_COUNTER_VALUE:1000000}
    tokens:
      session-expiration-ms: 3600000
      player-bootstrap-expiration-ms: 300000
      connect-scope-expiration-ms: 120000
      connect-token-expiration-ms: 30000
  mail:
    from: no-reply@firemud.local
    verification-url: http://localhost:5173/verify-email#token=%s
    reset-url: http://localhost:5173/reset-password#token=%s
  payment:
    stripe-api-key: test-key
    platform-fee-percent: 5
  auth:
    http:
      enabled: true
      role-requirement: AUTHENTICATED
      public-routes:
        - method: POST
          path-pattern: /auth/login
        - method: POST
          path-pattern: /auth/player-bootstrap
        - method: GET
          path-pattern: /auth/bootstrap/**
        - method: POST
          path-pattern: /auth/connect-token
        - method: POST
          path-pattern: /auth/request-password-reset
        - method: POST
          path-pattern: /auth/complete-password-reset
        - method: POST
          path-pattern: /auth/request-email-verification
        - method: POST
          path-pattern: /auth/verify-email
        - method: POST
          path-pattern: /auth/recover-username
        - method: POST
          path-pattern: /accounts
        - method: POST
          path-pattern: /accounts/
        - method: GET
          path-pattern: /ping
        - method: GET
          path-pattern: /.well-known/**
    grpc:
      public-methods:
        - account.v1.AccountService/Authenticate
        - account.v1.AccountService/RequestEmailLoginOtp
        - account.v1.AccountService/VerifyEmailLoginOtp
        - account.v1.AccountService/Ping
        - account.v1.AccountService/IssueDirectTextConnectScope
        - account.v1.AccountService/JoinPublicProductionMembership

management:
  endpoints:
    access:
      default: read-only
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
