spring:
  profiles:
    active: dev
  application:
    name: account-service
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 1025
    username: ''
    password: ''
grpc:
  server:
    port: 6565

firemud:
  auth:
    jwt-expiration-ms: 3600000
    session-expiration-ms: 3600000
  mail:
    from: no-reply@firemud.local
    verification-url: http://localhost:8080/auth/verify-email?token=%s
    reset-url: http://localhost:8080/reset-password?token=%s
  payment:
    stripe-api-key: test-key
    platform-fee-percent: 5

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

