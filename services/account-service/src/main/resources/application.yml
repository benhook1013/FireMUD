spring:
  mvc:
    throw-exception-if-no-handler-found: true
  application:
    name: account-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public}
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}
    table: ${SPRING_FLYWAY_TABLE:flyway_schema_history_${SERVICE_SCHEMA:public}}
    placeholders:
      serviceSchema: ${SERVICE_SCHEMA:public}
  ssl:
    bundle:
      pem:
        firemud-grpc:
          keystore:
            certificate: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
            private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
          truststore:
            certificate: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  grpc:
    server:
      port: 6565
      shutdown-grace-period: 30s
      keep-alive:
        time: 30s
        timeout: 5s
        permit-without-calls: true
      ssl:
        enabled: ${GRPC_SERVER_TLS_ENABLED:true}
        bundle: firemud-grpc
        client-auth: REQUIRE
  mail:
    host: localhost
    port: 1025
    username: ''
    password: ''
firemud:
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  account:
    tokens:
      session-expiration-ms: 3600000
      player-bootstrap-expiration-ms: 300000
      connect-scope-expiration-ms: 120000
      connect-token-expiration-ms: 30000
  mail:
    from: no-reply@firemud.local
    verification-url: http://localhost:8080/auth/verify-email?token=%s
    reset-url: http://localhost:8080/reset-password?token=%s
  payment:
    stripe-api-key: test-key
    platform-fee-percent: 5
  auth:
    http:
      enabled: true
      role-requirement: AUTHENTICATED
      public-routes:
        - method: POST
          path-pattern: /auth/login
        - method: POST
          path-pattern: /auth/player-bootstrap
        - method: GET
          path-pattern: /auth/bootstrap/**
        - method: POST
          path-pattern: /auth/connect-token
        - method: POST
          path-pattern: /auth/request-password-reset
        - method: POST
          path-pattern: /auth/complete-password-reset
        - method: POST
          path-pattern: /auth/request-email-verification
        - method: GET
          path-pattern: /auth/verify-email
        - method: POST
          path-pattern: /auth/recover-username
        - method: POST
          path-pattern: /accounts
        - method: POST
          path-pattern: /accounts/
        - method: GET
          path-pattern: /ping
        - method: GET
          path-pattern: /.well-known/**
    grpc:
      public-methods:
        - account.v1.AccountService/Authenticate
        - account.v1.AccountService/RequestEmailLoginOtp
        - account.v1.AccountService/VerifyEmailLoginOtp
        - account.v1.AccountService/Ping
        - account.v1.AccountService/GetTenantMembershipForRuntime
        - account.v1.AccountService/EnsurePublicProductionPlayerMembership
        - account.v1.AccountService/GetTenantEntitlementsForRuntime

management:
  endpoints:
    access:
      default: read-only
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
