# Production configuration for account-service
spring:
  application:
    name: account-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public},saga
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
grpc:
  shutdownGrace: 30
  server:
    port: 6565
    enableKeepAlive: true
    keepAliveTime: 30s
    keepAliveTimeout: 5s
    permitKeepAliveWithoutCalls: true
    compression: gzip
    security:
      enabled: true
      certificateChainPath: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
      privateKeyPath: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
      trustCertCollectionPath: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
      clientAuth: REQUIRE

firemud:
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  auth:
    jwt-secret-path: ${FIREMUD_AUTH_JWT_SECRET_PATH:}
    jwt-secret: ${FIREMUD_AUTH_JWT_SECRET}
    jwt-expiration-ms: ${FIREMUD_AUTH_JWT_EXPIRATION_MS:3600000}
    session-expiration-ms: ${FIREMUD_AUTH_SESSION_EXPIRATION_MS:3600000}
  mail:
    from: ${SMTP_FROM:no-reply@firemud.com}
    verification-url: ${FIREMUD_MAIL_VERIFICATION_URL:https://firemud.com/auth/verify-email?token=%s}
    reset-url: ${FIREMUD_MAIL_RESET_URL:https://firemud.com/reset-password?token=%s}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
