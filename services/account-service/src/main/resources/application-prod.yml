# Production configuration for account-service
spring:
  application:
    name: account-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public}
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}
    placeholders:
      serviceSchema: ${SERVICE_SCHEMA:public}
  jpa:
    properties:
      hibernate:
        default_schema: ${SERVICE_SCHEMA:public}
  ssl:
    bundle:
      pem:
        firemud-grpc:
          keystore:
            certificate: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
            private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
          truststore:
            certificate: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  grpc:
    server:
      port: 6565
      shutdown-grace-period: 30s
      keep-alive:
        time: 30s
        timeout: 5s
        permit-without-calls: true
      ssl:
        bundle: firemud-grpc
        client-auth: REQUIRE
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
firemud:
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  account:
    tokens:
      session-expiration-ms: ${FIREMUD_ACCOUNT_TOKENS_SESSION_EXPIRATION_MS:3600000}
      player-bootstrap-expiration-ms: ${FIREMUD_ACCOUNT_TOKENS_PLAYER_BOOTSTRAP_EXPIRATION_MS:300000}
      connect-scope-expiration-ms: ${FIREMUD_ACCOUNT_TOKENS_CONNECT_SCOPE_EXPIRATION_MS:120000}
      connect-token-expiration-ms: ${FIREMUD_ACCOUNT_TOKENS_CONNECT_TOKEN_EXPIRATION_MS:30000}
  mail:
    from: ${SMTP_FROM:no-reply@firemud.com}
    verification-url: ${FIREMUD_MAIL_VERIFICATION_URL:https://firemud.com/auth/verify-email?token=%s}
    reset-url: ${FIREMUD_MAIL_RESET_URL:https://firemud.com/reset-password?token=%s}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
