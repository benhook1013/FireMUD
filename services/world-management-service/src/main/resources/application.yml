spring:
  profiles:
    active: dev
  application:
    name: world-management-service
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

world:
  local-shard-id: 0
  room:
    cache-ttl-seconds: 60
  instance:
    expiration-hours: 24

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
