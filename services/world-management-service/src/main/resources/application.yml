spring:
  application:
    name: world-management-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public}
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}
    table: ${SPRING_FLYWAY_TABLE:flyway_schema_history_${SERVICE_SCHEMA:public}}
    placeholders:
      serviceSchema: ${SERVICE_SCHEMA:public}
  ssl:
    bundle:
      pem:
        firemud-grpc:
          keystore:
            certificate: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
            private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
          truststore:
            certificate: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  grpc:
    server:
      port: 6565
      shutdown-grace-period: 30s
      keep-alive:
        time: 30s
        timeout: 5s
        permit-without-calls: true
      ssl:
        enabled: ${GRPC_SERVER_TLS_ENABLED:true}
        bundle: firemud-grpc
        client-auth: REQUIRE

management:
  endpoints:
    access:
      default: read-only
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

world:
  local-shard-id: 0
  room:
    cache-ttl-seconds: 60
  instance:
    expiration-hours: 24

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

firemud:
  authored-world-source:
    # Intake stays off until protected creator authorization and readiness proof are complete.
    enabled: false
  smoke:
    seed-demo-runtime:
      targets:
        - tenant-id: ${FIREMUD_BOOTSTRAP_DEMO_TENANT_ID:1}
          game-instance-id: ${FIREMUD_BOOTSTRAP_DEMO_GAME_INSTANCE_ID:1}
        - tenant-id: ${FIREMUD_BOOTSTRAP_SANDBOX_TENANT_ID:1}
          game-instance-id: ${FIREMUD_BOOTSTRAP_SANDBOX_GAME_INSTANCE_ID:2}
  auth:
    http:
      enabled: true
      public-routes:
        - method: GET
          path-pattern: /actuator/**
        - method: GET
          path-pattern: /ping
        - method: GET
          path-pattern: /ping/
        - method: GET
          path-pattern: /.well-known/**
    grpc:
      public-methods:
        - world_management.v1.WorldManagementService/Ping
        # This bypasses bearer JWT only; the digest handler still requires the exact
        # Game Design mTLS peer.
        - world_management.v1.WorldManagementService/GetDraftDesignDigest
        # These bypass bearer JWT only; the intake adapter still requires the exact same-namespace
        # Game Design mTLS peer before it reaches World-owned durable intake/readback.
        - world_management.v1.WorldAuthoredSourceIntakeService/IntakeAuthoredWorldSource
        - world_management.v1.WorldAuthoredSourceIntakeService/ReadAuthoredWorldSourceIntake
        # JWT bypass is exact-method only; canonical first-admission handlers authenticate
        # the same-namespace Game Session mTLS peer. Runtime composition is default-disabled.
        - world_management.v1.WorldCanonicalInitialAdmissionHoldService/AcquireCanonicalInitialAdmissionHold
        - world_management.v1.WorldCanonicalInitialAdmissionHoldService/ReadCanonicalInitialAdmissionHoldIdentity
        - world_management.v1.WorldCanonicalInstanceLifecycleReadService/ReadWorldCanonicalInstanceLifecycle
        - world_management.v1.WorldCanonicalInitialAdmissionHoldTerminalService/FinalizeCanonicalInitialAdmissionHold
  grpc:
    workload-namespace: ${FIREMUD_GRPC_WORKLOAD_NAMESPACE:}
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
