spring:
  profiles:
    active: dev
  application:
    name: world-management-service
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

world:
  local-shard-id: 0
  instance:
    expiration-hours: 24
