spring:
  profiles:
    active: dev
  application:
    name: entity-management-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public},saga
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

grpc:
  shutdownGrace: 30
  server:
    port: 6565
    enableKeepAlive: true
    keepAliveTime: 30s
    keepAliveTimeout: 5s
    permitKeepAliveWithoutCalls: true
    compression: gzip
    security:
      enabled: true
      certificateChainPath: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
      privateKeyPath: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
      trustCertCollectionPath: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
      clientAuth: REQUIRE

firemud:
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  conflict:
    ttlSeconds: 300
  look:
    rooms:
      "1:R-1021":
        entities:
          - entity-id: "P-1183"
            display-name: "Sora"
            entity-type: PLAYER
            role: "Adventurer"
            state-flags:
              - isVisible
            vision-priority: 10
            reload-hint: STABLE
            visible: true
          - entity-id: "NPC-09"
            display-name: "Kobold Scout"
            entity-type: NPC
            role: "Guard"
            state-flags:
              - isAlert
            vision-priority: 8
            reload-hint: STABLE
            visible: true
      "1:R-2045":
        entities:
          - entity-id: "NPC-42"
            display-name: "Master Smith Torga"
            entity-type: NPC
            role: "Guildmaster"
            state-flags:
              - isFocused
            vision-priority: 7
            reload-hint: STABLE
            visible: true
          - entity-id: "P-1183"
            display-name: "Sora"
            entity-type: PLAYER
            role: "Engineer"
            state-flags:
              - isWaving
            vision-priority: 10
            reload-hint: STABLE
            visible: true
entity:
  cache:
    character-graph-ttl-seconds: 60
