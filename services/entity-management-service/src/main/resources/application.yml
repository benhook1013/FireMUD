spring:
  application:
    name: entity-management-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public}
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}
    placeholders:
      serviceSchema: ${SERVICE_SCHEMA:public}
  jpa:
    properties:
      hibernate:
        default_schema: ${SERVICE_SCHEMA:public}
  ssl:
    bundle:
      pem:
        firemud-grpc:
          keystore:
            certificate: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
            private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
          truststore:
            certificate: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  grpc:
    server:
      port: 6565
      shutdown-grace-period: 30s
      keep-alive:
        time: 30s
        timeout: 5s
        permit-without-calls: true
      ssl:
        enabled: ${GRPC_SERVER_TLS_ENABLED:true}
        bundle: firemud-grpc
        client-auth: REQUIRE

management:
  endpoints:
    access:
      default: read-only
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

firemud:
  auth:
    http:
      enabled: true
      public-path-patterns:
        - /actuator/**
        - /ping
        - /ping/
        - /.well-known/**
    grpc:
      public-methods:
        - entity_management.v1.EntityManagementService/Ping
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  conflict:
    ttlSeconds: 300
  look:
    rooms:
      "1:R-1021":
        entities:
          - entity-id: "P-1183"
            display-name: "Sora"
            entity-type: PLAYER
            role: "Adventurer"
            state-flags:
              - isVisible
            vision-priority: 10
            reload-hint: STABLE
            visible: true
          - entity-id: "NPC-09"
            display-name: "Kobold Scout"
            entity-type: NPC
            role: "Guard"
            state-flags:
              - isAlert
            vision-priority: 8
            reload-hint: STABLE
            visible: true
      "1:R-2045":
        entities:
          - entity-id: "NPC-42"
            display-name: "Master Smith Torga"
            entity-type: NPC
            role: "Guildmaster"
            state-flags:
              - isFocused
            vision-priority: 7
            reload-hint: STABLE
            visible: true
          - entity-id: "P-1183"
            display-name: "Sora"
            entity-type: PLAYER
            role: "Engineer"
            state-flags:
              - isWaving
            vision-priority: 10
            reload-hint: STABLE
            visible: true
entity:
  cache:
    character-graph-ttl-seconds: 60
