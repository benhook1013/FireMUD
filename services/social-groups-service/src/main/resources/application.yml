spring:
  profiles:
    active: dev
  application:
    name: social-groups-service
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

loggingAdmin:
  host: logging-admin-service
  port: 6565

firemud:
  services:
    logging-admin-service: "logging-admin-service:6565"
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:classpath:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:classpath:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:classpath:certs/ca.crt}
  auth:
    jwt-secret: changemechangemechangeme123456
    jwt-expiration-ms: 3600000
  voice:
    token-expiration-ms: 300000
  chat:
    says:
      history-ttl-seconds: 7200
      max-messages: 50
    tells:
      history-ttl-seconds: 172800
      max-messages: 50
    guild:
      history-ttl-seconds: 172800
      max-messages: 50
    city:
      history-ttl-seconds: 172800
      max-messages: 50
    account:
      history-ttl-seconds: 172800
      max-messages: 50

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
grpc:
  server:
    port: 6565
    enableKeepAlive: true
    keepAliveTime: 30s
    keepAliveTimeout: 5s
    permitKeepAliveWithoutCalls: true
    compression: gzip
