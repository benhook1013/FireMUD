spring:
  application:
    name: social-groups-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public},saga
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}

management:
  endpoints:
    access:
      default: read-only
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

firemud:
  services:
    logging-admin-service: "logging-admin-service:6565"
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  auth:
    jwt-expiration-ms: 3600000
  voice:
    token-expiration-ms: 300000
  chat:
    says:
      history-ttl-seconds: 7200
      max-messages: 50
    whispers:
      history-ttl-seconds: 7200
      max-messages: 50
    tells:
      history-ttl-seconds: 172800
      max-messages: 50
    guild:
      history-ttl-seconds: 172800
      max-messages: 50
    city:
      history-ttl-seconds: 172800
      max-messages: 50
    account:
      history-ttl-seconds: 172800
      max-messages: 50

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
grpc:
  shutdownGrace: 30
  server:
    port: 6565
    enableKeepAlive: true
    keepAliveTime: 30s
    keepAliveTimeout: 5s
    permitKeepAliveWithoutCalls: true
    compression: gzip
