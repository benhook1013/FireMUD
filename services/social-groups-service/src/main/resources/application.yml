spring:
  profiles:
    active: dev
  application:
    name: social-groups-service
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

firemud:
  services:
    logging-admin-service: "logging-admin-service:6565"
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:classpath:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:classpath:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:classpath:certs/ca.crt}
  auth:
    jwt-secret: changemechangemechangeme123456
    jwt-expiration-ms: 3600000
  voice:
    token-expiration-ms: 300000
