# Production configuration for social-groups-service
spring:
  application:
    name: social-groups-service
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

firemud:
  services:
    logging-admin-service: ${FIREMUD_SERVICES_LOGGING_ADMIN_SERVICE}
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:classpath:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:classpath:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:classpath:certs/ca.crt}
  auth:
    jwt-secret: ${FIREMUD_AUTH_JWT_SECRET}
    jwt-expiration-ms: ${FIREMUD_AUTH_JWT_EXPIRATION_MS:3600000}
  voice:
    token-expiration-ms: ${FIREMUD_VOICE_TOKEN_EXPIRATION_MS:300000}
