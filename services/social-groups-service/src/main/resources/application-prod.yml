# Production configuration for social-groups-service
spring:
  application:
    name: social-groups-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public},saga
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

firemud:
  services:
    logging-admin-service: ${FIREMUD_SERVICES_LOGGING_ADMIN_SERVICE}
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  auth:
    jwt-secret-path: ${FIREMUD_AUTH_JWT_SECRET_PATH:}
    jwt-secret: ${FIREMUD_AUTH_JWT_SECRET}
    jwt-expiration-ms: ${FIREMUD_AUTH_JWT_EXPIRATION_MS:3600000}
  voice:
    token-expiration-ms: ${FIREMUD_VOICE_TOKEN_EXPIRATION_MS:300000}
  chat:
    says:
      history-ttl-seconds: ${FIREMUD_CHAT_SAYS_TTL_SECONDS:7200}
      max-messages: ${FIREMUD_CHAT_SAYS_MAX_MESSAGES:50}
    whispers:
      history-ttl-seconds: ${FIREMUD_CHAT_WHISPERS_TTL_SECONDS:7200}
      max-messages: ${FIREMUD_CHAT_WHISPERS_MAX_MESSAGES:50}
    tells:
      history-ttl-seconds: ${FIREMUD_CHAT_TELLS_TTL_SECONDS:172800}
      max-messages: ${FIREMUD_CHAT_TELLS_MAX_MESSAGES:50}
    guild:
      history-ttl-seconds: ${FIREMUD_CHAT_GUILD_TTL_SECONDS:172800}
      max-messages: ${FIREMUD_CHAT_GUILD_MAX_MESSAGES:50}
    city:
      history-ttl-seconds: ${FIREMUD_CHAT_CITY_TTL_SECONDS:172800}
      max-messages: ${FIREMUD_CHAT_CITY_MAX_MESSAGES:50}
    account:
      history-ttl-seconds: ${FIREMUD_CHAT_ACCOUNT_TTL_SECONDS:172800}
      max-messages: ${FIREMUD_CHAT_ACCOUNT_MAX_MESSAGES:50}

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
grpc:
  shutdownGrace: 30
  server:
    port: 6565
    enableKeepAlive: true
    keepAliveTime: 30s
    keepAliveTimeout: 5s
    permitKeepAliveWithoutCalls: true
    compression: gzip
