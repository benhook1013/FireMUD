spring:
  application:
    name: spring-cloud-gateway
  main:
    web-application-type: reactive
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public},saga
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}
  config:
    import: "optional:classpath:routes-${spring.profiles.active}.yml"
grpc:
  server:
    port: 6565
    enableKeepAlive: true
    keepAliveTime: 30s
    keepAliveTimeout: 5s
    permitKeepAliveWithoutCalls: true
    compression: gzip
    security:
      enabled: true
      certificateChainPath: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
      privateKeyPath: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
      trustCertCollectionPath: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
      clientAuth: REQUIRE

firemud:
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  gateway:
    gameplay:
      bridge:
        reconnect-attempts: 3
        reconnect-delay-ms: 250

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,gameplayRouteReadiness

---

spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: ${FIREMUD_REDIS_CACHE_HOST:redis}
      port: ${FIREMUD_REDIS_CACHE_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          default-filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                series: SERVER_ERROR
                methods: GET,POST
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
          httpclient:
            pool:
              type: fixed
              maxConnections: 500
              acquireTimeout: 5000

firemud:
  gateway:
    gameplay:
      bridge:
        upstream-url: ws://game-session-service.default.svc.cluster.local:8080/ws/game
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
---

spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      host: ${FIREMUD_REDIS_CACHE_HOST:redis}
      port: ${FIREMUD_REDIS_CACHE_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                series: SERVER_ERROR
                methods: GET,POST
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
          httpclient:
            pool:
              type: fixed
              maxConnections: 500
              acquireTimeout: 5000
firemud:
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}

---

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
spring:
  web:
    resources:
      cache:
        period: 3600
