spring:
  application:
    name: spring-cloud-gateway
  main:
    web-application-type: reactive
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public}
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}
    placeholders:
      serviceSchema: ${SERVICE_SCHEMA:public}
  jpa:
    properties:
      hibernate:
        default_schema: ${SERVICE_SCHEMA:public}
  ssl:
    bundle:
      pem:
        firemud-grpc:
          keystore:
            certificate: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
            private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
          truststore:
            certificate: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  grpc:
    server:
      port: 6565
      shutdown-grace-period: 30s
      keep-alive:
        time: 30s
        timeout: 5s
        permit-without-calls: true
      ssl:
        enabled: ${GRPC_SERVER_TLS_ENABLED:true}
        bundle: firemud-grpc
        client-auth: REQUIRE

firemud:
  auth:
    jwt-secret-path: ${FIREMUD_AUTH_JWT_SECRET_PATH:}
    jwt-secret: ${FIREMUD_AUTH_JWT_SECRET:}
    jwt-expiration-ms: ${FIREMUD_AUTH_JWT_EXPIRATION_MS:3600000}
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  gateway:
    gameplay:
      bridge:
        reconnect-attempts: 40
        reconnect-delay-ms: 250

management:
  endpoints:
    access:
      default: read-only
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,gameplayRouteReadiness

---

spring:
  config:
    activate:
      on-profile: dev
    import: "optional:classpath:routes-dev.yml"
  data:
    redis:
      host: ${FIREMUD_REDIS_CACHE_HOST:redis}
      port: ${FIREMUD_REDIS_CACHE_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          default-filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                series: SERVER_ERROR
                methods: GET,POST
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
          httpclient:
            pool:
              type: fixed
              maxConnections: 500
              acquireTimeout: 5000

firemud:
  gateway:
    gameplay:
      bridge:
        upstream-url: ws://game-session-service.default.svc.cluster.local:8080/ws/game
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
---

spring:
  config:
    activate:
      on-profile: prod
    import: "optional:classpath:routes-prod.yml"
  data:
    redis:
      host: ${FIREMUD_REDIS_CACHE_HOST:redis}
      port: ${FIREMUD_REDIS_CACHE_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                series: SERVER_ERROR
                methods: GET,POST
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
          httpclient:
            pool:
              type: fixed
              maxConnections: 500
              acquireTimeout: 5000
firemud:
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}

---

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
spring:
  web:
    resources:
      cache:
        period: 3600
