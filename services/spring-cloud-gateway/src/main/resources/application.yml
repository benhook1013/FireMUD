spring:
  profiles:
    active: dev
  application:
    name: spring-cloud-gateway

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:firemud}
    username: ${POSTGRES_USER:firemud}
    password: ${POSTGRES_PASSWORD:firemud}
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: session
          uri: http://game-session-service:8080
          predicates:
            - Path=/api/session/**
        - id: admin
          uri: http://logging-admin-service:8080
          predicates:
            - Path=/api/admin/**
        - id: design
          uri: http://game-design-service:8080
          predicates:
            - Path=/api/design/**

---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
  cloud:
    gateway:
      routes:
        - id: session
          uri: http://game-session-service.default.svc.cluster.local:8080
          predicates:
            - Path=/api/session/**
        - id: admin
          uri: http://logging-admin-service.default.svc.cluster.local:8080
          predicates:
            - Path=/api/admin/**
        - id: design
          uri: http://game-design-service.default.svc.cluster.local:8080
          predicates:
            - Path=/api/design/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
