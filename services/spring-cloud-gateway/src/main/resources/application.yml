spring:
  profiles:
    active: dev
  application:
    name: spring-cloud-gateway
  flyway:
    enabled: true
  config:
    import: "optional:classpath:routes-${spring.profiles.active}.yml"
grpc:
  server:
    port: 6565

firemud:
  auth:
    jwt-expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---

spring:
  config:
    activate:
      on-profile: dev
  redis:
    host: ${FIREMUD_REDIS_HOST:redis}
    port: ${FIREMUD_REDIS_PORT:6379}
  cloud:
    gateway:
      metrics:
        enabled: true
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
            series: SERVER_ERROR
            methods: GET,POST
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false

firemud:
  auth:
    jwt-secret: changeit-changeit-changeit-changeit

---

spring:
  config:
    activate:
      on-profile: prod
  redis:
    host: ${FIREMUD_REDIS_HOST:redis}
    port: ${FIREMUD_REDIS_PORT:6379}
  cloud:
    gateway:
      metrics:
        enabled: true
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
            series: SERVER_ERROR
            methods: GET,POST
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false
firemud:
  auth:
    jwt-secret: ${FIREMUD_AUTH_JWT_SECRET}
