spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: session
              uri: ws://game-session-service:8080
              predicates:
                - Path=/api/session/**
            - id: admin
              uri: http://logging-admin-service:8080
              predicates:
                - Path=/api/admin/**
            - id: design
              uri: http://game-design-service:8080
              predicates:
                - Path=/api/design/**
            - id: account
              uri: http://account-service:8080
              predicates:
                - Path=/api/account/**
            - id: social
              uri: http://social-groups-service:8080
              predicates:
                - Path=/api/social/**
            - id: asset-store
              uri: http://minio:9000
              predicates:
                - Path=/assets/**
              filters:
                - StripPrefix=1 # remove /assets before forwarding
