# Production configuration for game-session-service
spring:
  application:
    name: game-session-service
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

game:
  tick-duration-ms: ${GAME_TICK_DURATION_MS:1000}

firemud:
  services:
    game-logic-service: ${FIREMUD_SERVICES_GAME_LOGIC_SERVICE}
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:classpath:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:classpath:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:classpath:certs/ca.crt}

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
