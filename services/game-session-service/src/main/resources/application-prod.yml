# Production configuration for game-session-service
spring:
  application:
    name: game-session-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public}
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}
    placeholders:
      serviceSchema: ${SERVICE_SCHEMA:public}
  ssl:
    bundle:
      pem:
        firemud-grpc:
          keystore:
            certificate: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
            private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
          truststore:
            certificate: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  grpc:
    server:
      port: 6565
      shutdown-grace-period: 30s
      keep-alive:
        time: 30s
        timeout: 5s
        permit-without-calls: true
      ssl:
        bundle: firemud-grpc
        client-auth: REQUIRE

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

game:
  tick-duration-ms: ${GAME_TICK_DURATION_MS:1000}
  tick-max-commands: ${GAME_TICK_MAX_COMMANDS:50}

firemud:
  services:
    automation-scripting-service: ${FIREMUD_SERVICES_AUTOMATION_SCRIPTING_SERVICE}
    game-logic-service: ${FIREMUD_SERVICES_GAME_LOGIC_SERVICE}
  conflict:
    ttlSeconds: ${FIREMUD_CONFLICT_TTL_SECONDS:300}
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  auth:
    grpc:
      force-internal-service-outbound: true

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
