# Production configuration for game-session-service
spring:
  application:
    name: game-session-service
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

game:
  tick-duration-ms: ${GAME_TICK_DURATION_MS:1000}

firemud:
  services:
    game-logic-service: ${FIREMUD_SERVICES_GAME_LOGIC_SERVICE}
  grpc:
    cert-chain: classpath:certs/client.crt
    private-key: classpath:certs/client.key
    ca-cert: classpath:certs/ca.crt
