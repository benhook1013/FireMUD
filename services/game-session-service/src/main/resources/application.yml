spring:
  application:
    name: game-session-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public}
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}
    table: ${SPRING_FLYWAY_TABLE:flyway_schema_history_${SERVICE_SCHEMA:public}}
    postgresql:
      transactional-lock: false
    placeholders:
      serviceSchema: ${SERVICE_SCHEMA:public}
  ssl:
    bundle:
      pem:
        firemud-grpc:
          keystore:
            certificate: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
            private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
          truststore:
            certificate: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  grpc:
    server:
      port: 6565
      shutdown-grace-period: 30s
      keep-alive:
        time: 30s
        timeout: 5s
        permit-without-calls: true
      ssl:
        enabled: ${GRPC_SERVER_TLS_ENABLED:true}
        bundle: firemud-grpc
        client-auth: REQUIRE
management:
  endpoints:
    access:
      default: read-only
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,gameplayPathReadiness
game:
  tick-duration-ms: 1000
  tick-max-commands: 50
  logic:
    default-room-id: "R-1021"
firemud:
  gameplay:
    pointer-bootstrap:
      pointers:
        - world-slug: demo
          world-display-name: Demo World
          realm-slug: production
          realm-display-name: Live Realm
          tenant-id: ${FIREMUD_BOOTSTRAP_DEMO_TENANT_ID:1}
          game-instance-id: ${FIREMUD_BOOTSTRAP_DEMO_GAME_INSTANCE_ID:1}
          visible: true
          public-production-realm: true
          requires-character-selection: false
          state-scope: SHARED
          character-creation-policy: ALLOW_NEW
        - world-slug: sandbox
          world-display-name: Builder Sandbox
          realm-slug: production
          realm-display-name: Live Realm
          tenant-id: ${FIREMUD_BOOTSTRAP_SANDBOX_TENANT_ID:1}
          game-instance-id: ${FIREMUD_BOOTSTRAP_SANDBOX_GAME_INSTANCE_ID:2}
          visible: true
          public-production-realm: true
          requires-character-selection: true
          state-scope: SHARED
          character-creation-policy: ALLOW_NEW
  services:
    automation-scripting-service: automation-scripting-service:6565
    game-logic-service: game-logic-service:6565
  conflict:
    ttlSeconds: 300
  presentation:
    default-locale-tag: en-NZ
    default-color-mode: NONE
    brief-enabled-by-default: false
    prompt:
      enabled: true
      emit-after-reconnect-restore: true
      coalesce-window-ms: 150
  reconnection:
    policy:
      resume-window-ms: 180000
      stale-resume-falls-through-to-fresh-entry: true
    buffer:
      ttl-ms: 1800000
      max-entries: 256
      min-messages: 8
      min-lines: 24
      soft-max-bytes: 16384
      hard-max-bytes: 65536
  command-history:
    max-entries: 10
  command-capabilities:
    social-enabled: true
    presence-enabled: true
    inventory-enabled: true
    command-history-enabled: true
  movement:
    post-move-look-enabled: true
  world-topology:
    scope-model: MAP_ONLY
    regions-enabled: false
  auth:
    http:
      enabled: true
      role-requirement: PRIVILEGED
      public-routes:
        - method: GET
          path-pattern: /ping
    grpc:
      force-internal-service-outbound: true
      public-methods:
        - game_session.v1.GameSessionService/Ping
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
