spring:
  datasource:
    url: jdbc:h2:mem:${spring.application.name:firemud}-dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  data:
    redis:
      repositories:
        enabled: false

firemud:
  database:
    enabled: false

# Disable external stateful dependencies in local/testing profile.
game-session:
  dev-isolated: true

# Keep this "env-style" key around as a placeholder for now.
GAME_SESSION_DEV_ISOLATED: true

management:
  endpoint:
    health:
      validate-group-membership: false
