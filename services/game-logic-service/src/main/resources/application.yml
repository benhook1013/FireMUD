spring:
  application:
    name: game-logic-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public}
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}
    table: ${SPRING_FLYWAY_TABLE:flyway_schema_history_${SERVICE_SCHEMA:public}}
    placeholders:
      serviceSchema: ${SERVICE_SCHEMA:public}
  ssl:
    bundle:
      pem:
        firemud-grpc:
          keystore:
            certificate: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
            private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
          truststore:
            certificate: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  grpc:
    server:
      port: 6565
      shutdown-grace-period: 30s
      keep-alive:
        time: 30s
        timeout: 5s
        permit-without-calls: true
      ssl:
        enabled: ${GRPC_SERVER_TLS_ENABLED:true}
        bundle: firemud-grpc
        client-auth: REQUIRE

management:
  endpoints:
    access:
      default: read-only
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,lookDependencyReadiness

firemud:
  services:
    world-management-service: world-management-service:6565
    entity-management-service: entity-management-service:6565
    social-groups-service: social-groups-service:6565
  communication:
    max-message-length: 512
    whisper-observer-metadata-enabled: true
  command-capabilities:
    social-enabled: true
    presence-enabled: true
    inventory-enabled: true
    command-history-enabled: true
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  auth:
    grpc:
      force-internal-service-outbound: true

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
