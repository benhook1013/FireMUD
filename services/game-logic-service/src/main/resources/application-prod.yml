# Production configuration for game-logic-service
spring:
  application:
    name: game-logic-service
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

firemud:
  auth:
    jwt-secret: ${FIREMUD_AUTH_JWT_SECRET}
    jwt-expiration-ms: ${FIREMUD_AUTH_JWT_EXPIRATION_MS:3600000}
