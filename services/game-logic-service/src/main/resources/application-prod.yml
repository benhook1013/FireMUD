# Production configuration for game-logic-service
spring:
  application:
    name: game-logic-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public},saga
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

grpc:
  shutdownGrace: 30
  server:
    port: 6565
    enableKeepAlive: true
    keepAliveTime: 30s
    keepAliveTimeout: 5s
    permitKeepAliveWithoutCalls: true
    compression: gzip
    security:
      enabled: true
      certificateChainPath: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
      privateKeyPath: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
      trustCertCollectionPath: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
      clientAuth: REQUIRE

firemud:
  services:
    world-management-service: ${FIREMUD_SERVICES_WORLD_MANAGEMENT_SERVICE:world-management-service:6565}
    entity-management-service: ${FIREMUD_SERVICES_ENTITY_MANAGEMENT_SERVICE:entity-management-service:6565}
    social-groups-service: ${FIREMUD_SERVICES_SOCIAL_GROUPS_SERVICE:social-groups-service:6565}
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  auth:
    jwt-secret-path: ${FIREMUD_AUTH_JWT_SECRET_PATH:}
    jwt-secret: ${FIREMUD_AUTH_JWT_SECRET}
    jwt-expiration-ms: ${FIREMUD_AUTH_JWT_EXPIRATION_MS:3600000}

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
