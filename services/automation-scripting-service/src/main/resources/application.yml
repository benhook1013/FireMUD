spring:
  application:
    name: automation-scripting-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public}
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}
    placeholders:
      serviceSchema: ${SERVICE_SCHEMA:public}
  jpa:
    properties:
      hibernate:
        default_schema: ${SERVICE_SCHEMA:public}
  ssl:
    bundle:
      pem:
        firemud-grpc:
          keystore:
            certificate: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
            private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
          truststore:
            certificate: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  grpc:
    server:
      port: 6565
      shutdown-grace-period: 30s
      keep-alive:
        time: 30s
        timeout: 5s
        permit-without-calls: true
      ssl:
        enabled: ${GRPC_SERVER_TLS_ENABLED:true}
        bundle: firemud-grpc
        client-auth: REQUIRE

management:
  endpoints:
    access:
      default: read-only
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

script:
  quota:
    limit: ${SCRIPT_QUOTA_LIMIT:50}
    window-seconds: ${SCRIPT_QUOTA_WINDOW_SECONDS:60}
  tenant-budget:
    high-runs-per-minute: ${SCRIPT_TENANT_BUDGET_HIGH_RUNS_PER_MINUTE:120}
    normal-runs-per-minute: ${SCRIPT_TENANT_BUDGET_NORMAL_RUNS_PER_MINUTE:60}
    background-runs-per-minute: ${SCRIPT_TENANT_BUDGET_BACKGROUND_RUNS_PER_MINUTE:30}
  test:
    max-runs-per-minute: ${SCRIPT_TEST_MAX_RUNS_PER_MINUTE:60}
    max-runs-per-minute-per-principal: ${SCRIPT_TEST_MAX_RUNS_PER_MINUTE_PER_PRINCIPAL:30}
    max-concurrency: ${SCRIPT_TEST_MAX_CONCURRENCY:10}
  output:
    max-commands-per-run: ${SCRIPT_OUTPUT_MAX_COMMANDS_PER_RUN:64}
    max-commands-per-entity-per-trigger: ${SCRIPT_OUTPUT_MAX_COMMANDS_PER_ENTITY_PER_TRIGGER:8}
    max-serialized-work-item-bytes: ${SCRIPT_OUTPUT_MAX_SERIALIZED_WORK_ITEM_BYTES:32768}
  runtime:
    pin-projection-stale-threshold-ms: ${SCRIPT_PIN_PROJECTION_STALE_THRESHOLD_MS:5000}
  outbox:
    handed-off-retention-days: ${SCRIPT_OUTBOX_HANDED_OFF_RETENTION_DAYS:7}
    canceled-retention-days: ${SCRIPT_OUTBOX_CANCELED_RETENTION_DAYS:7}
    terminal-cleanup-interval-seconds: ${SCRIPT_OUTBOX_TERMINAL_CLEANUP_INTERVAL_SECONDS:300}
    queue-rebuild-interval-seconds: ${SCRIPT_OUTBOX_QUEUE_REBUILD_INTERVAL_SECONDS:60}
    queue-rebuild-batch-size: ${SCRIPT_OUTBOX_QUEUE_REBUILD_BATCH_SIZE:200}
    dead-letter-max-rows: ${SCRIPT_DEAD_LETTER_MAX_ROWS:100000}
    dead-letter-max-age-seconds: ${SCRIPT_DEAD_LETTER_MAX_AGE_SECONDS:604800}
automation:
  tick-duration-ms: 1000
  tick-max-events: 50

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

firemud:
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  conflict:
    ttlSeconds: 300
