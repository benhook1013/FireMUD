# Production configuration for automation-scripting-service
spring:
  application:
    name: automation-scripting-service
  flyway:
    enabled: true
    schemas: ${SERVICE_SCHEMA:public}
    locations: classpath:db/migration,classpath:db/migration/saga
    defaultSchema: ${SERVICE_SCHEMA:public}
    placeholders:
      serviceSchema: ${SERVICE_SCHEMA:public}
  jpa:
    properties:
      hibernate:
        default_schema: ${SERVICE_SCHEMA:public}
  ssl:
    bundle:
      pem:
        firemud-grpc:
          keystore:
            certificate: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
            private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
          truststore:
            certificate: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  grpc:
    server:
      port: 6565
      shutdown-grace-period: 30s
      keep-alive:
        time: 30s
        timeout: 5s
        permit-without-calls: true
      ssl:
        bundle: firemud-grpc
        client-auth: REQUIRE

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

script:
  quota:
    limit: ${SCRIPT_QUOTA_LIMIT:50}
    window-seconds: ${SCRIPT_QUOTA_WINDOW_SECONDS:60}
  tenant-budget:
    high-runs-per-minute: ${SCRIPT_TENANT_BUDGET_HIGH_RUNS_PER_MINUTE:120}
    normal-runs-per-minute: ${SCRIPT_TENANT_BUDGET_NORMAL_RUNS_PER_MINUTE:60}
    background-runs-per-minute: ${SCRIPT_TENANT_BUDGET_BACKGROUND_RUNS_PER_MINUTE:30}
  test:
    max-runs-per-minute: ${SCRIPT_TEST_MAX_RUNS_PER_MINUTE:60}
    max-runs-per-minute-per-principal: ${SCRIPT_TEST_MAX_RUNS_PER_MINUTE_PER_PRINCIPAL:30}
    max-concurrency: ${SCRIPT_TEST_MAX_CONCURRENCY:10}
    max-cluster-concurrency: ${SCRIPT_TEST_MAX_CLUSTER_CONCURRENCY:50}
  runtime:
    plugin-policy-reconcile-interval-seconds: ${SCRIPT_PLUGIN_POLICY_RECONCILE_INTERVAL_SECONDS:60}
    plugin-policy-reconcile-batch-size: ${SCRIPT_PLUGIN_POLICY_RECONCILE_BATCH_SIZE:100}
    plugin-policy-stale-threshold-seconds: ${SCRIPT_PLUGIN_POLICY_STALE_THRESHOLD_SECONDS:300}
automation:
  tick-duration-ms: ${AUTOMATION_TICK_DURATION_MS:1000}
  tick-max-events: ${AUTOMATION_TICK_MAX_EVENTS:50}

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

firemud:
  grpc:
    cert-chain: ${FIREMUD_GRPC_CERT_CHAIN_PATH:certs/client.crt}
    private-key: ${FIREMUD_GRPC_PRIVATE_KEY_PATH:certs/client.key}
    ca-cert: ${FIREMUD_GRPC_CA_CERT_PATH:certs/ca.crt}
  conflict:
    ttlSeconds: ${FIREMUD_CONFLICT_TTL_SECONDS:300}
