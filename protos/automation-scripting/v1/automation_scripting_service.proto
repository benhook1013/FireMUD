syntax = "proto3";

package automation_scripting.v1;

import "shared/v1/errors.proto";

option java_package = "net.firedevops.firemud.automationscripting.v1";
option java_multiple_files = true;

service AutomationScriptingService {
  // Simple ping used by health checks
  rpc Ping(PingRequest) returns (PingResponse);

  // Deliver a script trigger for evaluation. This RPC is idempotent with respect
  // to Trigger Identity (including script_event_id) and must not evaluate the
  // DSL body more than once for the same identity.
  rpc TriggerScriptEvent(TriggerScriptEventRequest) returns (TriggerScriptEventResponse);

  // Creates a new NPC formation
  rpc CreateFormation(CreateFormationRequest) returns (CreateFormationResponse);

  // Adds an NPC to an existing formation
  rpc AddFormationMember(AddFormationMemberRequest) returns (AddFormationMemberResponse);

  // Lists all NPCs belonging to a formation
  rpc ListFormationMembers(ListFormationMembersRequest) returns (ListFormationMembersResponse);

  // Uploads or replaces a script definition
  rpc UpdateScript(UpdateScriptRequest) returns (UpdateScriptResponse);

  // Checks if a script is queued or currently running
  rpc GetScriptStatus(GetScriptStatusRequest) returns (GetScriptStatusResponse);

  // Signals that a new script patch version is available
  rpc NotifyScriptVersionUpdate(NotifyScriptVersionUpdateRequest)
      returns (NotifyScriptVersionUpdateResponse);

  // Returns the canonical design-time digest for script definitions that participate in one
  // script-patch version.
  rpc GetDraftDesignDigest(GetDraftDesignDigestRequest) returns (GetDraftDesignDigestResponse);
}

// Operator/control-plane surface for patch lifecycle visibility and rollback support.
service AutomationScriptingControlPlaneService {
  rpc GetScriptPatchStatus(GetScriptPatchStatusRequest) returns (GetScriptPatchStatusResponse);
  rpc ListScriptPatchStatuses(ListScriptPatchStatusesRequest) returns (ListScriptPatchStatusesResponse);
  rpc SetAutomationAdmissionMode(SetAutomationAdmissionModeRequest)
      returns (SetAutomationAdmissionModeResponse);
  rpc GetAutomationDrainStatus(GetAutomationDrainStatusRequest)
      returns (GetAutomationDrainStatusResponse);
  rpc GetAutomationPinConvergence(GetAutomationPinConvergenceRequest)
      returns (GetAutomationPinConvergenceResponse);
  rpc GetScriptPatchInstanceRolloutStatus(GetScriptPatchInstanceRolloutStatusRequest)
      returns (GetScriptPatchInstanceRolloutStatusResponse);
  rpc ListScriptPatchInstanceRollouts(ListScriptPatchInstanceRolloutsRequest)
      returns (ListScriptPatchInstanceRolloutsResponse);
  rpc ListScriptPatchInstanceRolloutEvents(ListScriptPatchInstanceRolloutEventsRequest)
      returns (ListScriptPatchInstanceRolloutEventsResponse);
  rpc ListScriptDeadLetters(ListScriptDeadLettersRequest) returns (ListScriptDeadLettersResponse);
  rpc ReplayDeadLetteredWorkItems(ReplayDeadLetteredWorkItemsRequest)
      returns (ReplayDeadLetteredWorkItemsResponse);

  // Cancel pending durable work items for a patch so they are never handed off again.
  rpc CancelPendingWorkItemsForPatch(CancelPendingWorkItemsForPatchRequest)
      returns (CancelPendingWorkItemsForPatchResponse);
  rpc CancelPendingWorkItemsForPluginVersion(CancelPendingWorkItemsForPluginVersionRequest)
      returns (CancelPendingWorkItemsForPluginVersionResponse);

  rpc GetScriptEventDefinition(GetScriptEventDefinitionRequest)
      returns (GetScriptEventDefinitionResponse);
  rpc ListScriptEventDefinitions(ListScriptEventDefinitionsRequest)
      returns (ListScriptEventDefinitionsResponse);

  // Plugin lifecycle/control-plane APIs.
  rpc GetPluginStatus(GetPluginStatusRequest) returns (GetPluginStatusResponse);
  rpc GetPluginPolicyConvergence(GetPluginPolicyConvergenceRequest)
      returns (GetPluginPolicyConvergenceResponse);
  rpc SetPluginActiveVersion(SetPluginActiveVersionRequest)
      returns (SetPluginActiveVersionResponse);
  rpc DisablePlugin(DisablePluginRequest) returns (DisablePluginResponse);
  rpc DrainPlugin(DrainPluginRequest) returns (DrainPluginResponse);
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}

message CreateFormationRequest {
  string tenant_id = 1;
  string name = 2;
  string leader_npc_id = 3;
  string formation_type = 4; // LINE, WEDGE, CIRCLE
}

message CreateFormationResponse {
  string formation_id = 1;
  shared.v1.ErrorDetail error = 2;
}

message AddFormationMemberRequest {
  string tenant_id = 1;
  string formation_id = 2;
  string npc_id = 3;
}

message AddFormationMemberResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListFormationMembersRequest {
  string tenant_id = 1;
  string formation_id = 2;
}

message ListFormationMembersResponse {
  repeated string npc_ids = 1;
  shared.v1.ErrorDetail error = 2;
}

message UpdateScriptRequest {
  string tenant_id = 1;
  string name = 2;
  string version = 3;
  string definition = 4;
  repeated ScriptEventBinding event_bindings = 5;
}

message UpdateScriptResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message ScriptEventBinding {
  string event_type = 1;
  string event_schema_version = 2;
  string target_scope_type = 3;
  string target_scope_id = 4;
  int32 priority = 5;
  bool requires_exclusive_event = 6;
  string priority_tag = 7;
}

message ScriptEventDefinition {
  string event_type = 1;
  string event_schema_version = 2;
  string owner_service = 3;
  repeated string allowed_producer_principals = 4;
  repeated string required_trigger_identity_fields = 5;
  string snapshot_authority = 6;
  string consistency_class = 7;
  string quota_class = 8;
  string replay_semantics = 9;
  repeated string allowed_binding_scopes = 10;
  bool dry_run_support = 11;
  string deprecation_status = 12;
  string payload_schema_ref = 13;
}

message GetScriptEventDefinitionRequest {
  string event_type = 1;
  string event_schema_version = 2;
}

message GetScriptEventDefinitionResponse {
  ScriptEventDefinition definition = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListScriptEventDefinitionsRequest {
  string owner_service = 1;
}

message ListScriptEventDefinitionsResponse {
  repeated ScriptEventDefinition definitions = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetScriptStatusRequest {
  string tenant_id = 1;
  string script_name = 2;
}

message GetScriptStatusResponse {
  bool queued = 1;
  bool running = 2;
  shared.v1.ErrorDetail error = 3;
}

message NotifyScriptVersionUpdateRequest {
  string tenant_id = 1;
  string script_patch_version = 2;
  repeated string affected_scripts = 3;
}

message NotifyScriptVersionUpdateResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetDraftDesignDigestRequest {
  string tenant_id = 1;
  oneof scope {
    string version_id = 2;
    string script_patch_version = 3;
  }
}

message GetDraftDesignDigestResponse {
  string tenant_id = 1;
  string scope_value = 2;
  string applied_commit_id = 3;
  string content_digest = 4;
  int32 digest_schema_version = 5;
  shared.v1.ErrorDetail error = 6;
}

message ListScriptDeadLettersRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string script_patch_version = 3;
  int32 limit = 4;
}

message ScriptDeadLetterEntry {
  string work_item_id = 1;
  string tenant_id = 2;
  string game_instance_id = 3;
  string region_id = 4;
  int64 region_epoch = 5;
  string entity_id = 6;
  string script_id = 7;
  string event_type = 8;
  string script_patch_version = 9;
  string script_event_id = 10;
  string status = 11;
  string reason = 12;
  int64 created_at_ms = 13;
  int64 updated_at_ms = 14;
}

message ListScriptDeadLettersResponse {
  repeated ScriptDeadLetterEntry dead_letters = 1;
  shared.v1.ErrorDetail error = 2;
}

message ReplayDeadLetteredWorkItemsRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string region_id = 3;
  repeated string work_item_ids = 4;
  string script_patch_version = 5;
  int64 created_after_ms = 6;
  int64 created_before_ms = 7;
  int32 limit = 8;
  string control_plane_request_id = 9;
  string actor_principal = 10;
  string reason = 11;
}

message ReplayDeadLetteredWorkItemsResponse {
  int64 replayed_count = 1;
  int64 rejected_count = 2;
  shared.v1.ErrorDetail error = 3;
}

enum TriggerMode {
  TRIGGER_MODE_UNSPECIFIED = 0;
  TRIGGER_MODE_NORMAL = 1;
  TRIGGER_MODE_CATCH_UP = 2;
}

enum TriggerAdmissionOutcome {
  TRIGGER_ADMISSION_OUTCOME_UNSPECIFIED = 0;
  TRIGGER_ADMISSION_OUTCOME_ADMITTED = 1;
  TRIGGER_ADMISSION_OUTCOME_BACKPRESSURE_RELOADING = 2;
  reserved 3 to 7;
  reserved "TRIGGER_ADMISSION_OUTCOME_DENIED_QUOTA",
      "TRIGGER_ADMISSION_OUTCOME_DENIED_TENANT_BUDGET",
      "TRIGGER_ADMISSION_OUTCOME_DENIED_DISABLED",
      "TRIGGER_ADMISSION_OUTCOME_DENIED_VERSION_UNAVAILABLE",
      "TRIGGER_ADMISSION_OUTCOME_DENIED_POLICY";
  TRIGGER_ADMISSION_OUTCOME_BACKPRESSURE_ROLLBACK = 11;
  TRIGGER_ADMISSION_OUTCOME_INFRASTRUCTURE_ERROR = 8;
  TRIGGER_ADMISSION_OUTCOME_EVENT_REGISTRY_REJECTED = 9;
  TRIGGER_ADMISSION_OUTCOME_OUTPUT_BUDGET_EXCEEDED = 10;
  TRIGGER_ADMISSION_OUTCOME_VERSION_UNAVAILABLE = 12;
  TRIGGER_ADMISSION_OUTCOME_PIN_STATE_UNAVAILABLE = 13;
  TRIGGER_ADMISSION_OUTCOME_SIGNER_POLICY_UNAVAILABLE = 14;
  TRIGGER_ADMISSION_OUTCOME_QUOTA_DENIED = 15;
}

enum AutomationAdmissionMode {
  AUTOMATION_ADMISSION_MODE_UNSPECIFIED = 0;
  AUTOMATION_ADMISSION_MODE_NORMAL = 1;
  AUTOMATION_ADMISSION_MODE_PAUSED_FOR_ROLLBACK = 2;
}

message TriggerScriptEventRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string region_id = 3;

  // Required for gameplay/runtime triggers and scheduler triggers so triggers are fenced
  // across scoped coordination resets. External/out-of-band triggers that omit region_epoch
  // must define their own consistency model explicitly.
  int64 region_epoch = 4;

  string entity_id = 5;
  string script_id = 6;

  // Plugin identity (required for plugin triggers). For core script triggers, these
  // fields must be absent.
  string plugin_id = 15;
  string plugin_version_id = 16;

  string event_type = 7;
  string script_patch_version = 8;
  string script_event_id = 9;

  bool is_dry_run = 10;
  TriggerMode trigger_mode = 11;

  // Scheduling context (when applicable).
  int64 due_tick_id = 12;
  int64 due_at_ms = 13;

  // Event payload envelope (implementation-specific).
  string payload_json = 14;

  // Registry-controlled schema selector for custom and service-specific events.
  // Built-in events may default to "v1" when omitted.
  string event_schema_version = 17;

  // Required when the event registry marks the event as producer-supplied
  // authoritative snapshot. The token format is registry/event-specific.
  string read_snapshot_token = 18;
}

message TriggerScriptEventResponse {
  // Indicates whether the trigger was admitted into the scripting pipeline.
  // This does not imply that commands have been accepted into tick queues; that
  // end-to-end handoff is observable via script_event_audit.
  bool admitted = 1;

  TriggerAdmissionOutcome admission_outcome = 2;
  string admission_reason = 3;
  shared.v1.ErrorDetail error = 4;
  int32 resolved_handler_count = 5;
}

enum ScriptPatchStatus {
  SCRIPT_PATCH_STATUS_UNSPECIFIED = 0;
  SCRIPT_PATCH_STATUS_READY = 1;
  SCRIPT_PATCH_STATUS_FAILED = 2;
  SCRIPT_PATCH_STATUS_ROLLED_BACK = 3;
  SCRIPT_PATCH_STATUS_PENDING_VALIDATION = 4;
  SCRIPT_PATCH_STATUS_ONLOAD_RUNNING = 5;
}

message GetScriptPatchStatusRequest {
  string tenant_id = 1;
  string script_patch_version = 2;
}

message GetScriptPatchStatusResponse {
  ScriptPatchStatus status = 1;
  string status_reason = 2;
  int64 last_changed_at_ms = 3;
  shared.v1.ErrorDetail error = 4;
}

message ListScriptPatchStatusesRequest {
  string tenant_id = 1;
  ScriptPatchStatus status = 2;
  int64 changed_after_ms = 3;
  int64 changed_before_ms = 4;
}

message ScriptPatchStatusEntry {
  string script_patch_version = 1;
  ScriptPatchStatus status = 2;
  string status_reason = 3;
  int64 last_changed_at_ms = 4;
}

message ListScriptPatchStatusesResponse {
  repeated ScriptPatchStatusEntry patches = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetAutomationDrainStatusRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string region_id = 3;
}

message SetAutomationAdmissionModeRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string region_id = 3;
  AutomationAdmissionMode mode = 4;
  string control_plane_request_id = 5;
  string actor_principal = 6;
  string reason = 7;
}

message SetAutomationAdmissionModeResponse {
  string tenant_id = 1;
  string game_instance_id = 2;
  string region_id = 3;
  AutomationAdmissionMode mode = 4;
  int64 admission_epoch = 5;
  int64 updated_at_ms = 6;
  shared.v1.ErrorDetail error = 7;
}

message GetAutomationDrainStatusResponse {
  string tenant_id = 1;
  string game_instance_id = 2;
  string region_id = 3;
  AutomationAdmissionMode admission_mode = 4;
  int64 admission_epoch = 5;
  int64 active_execution_count = 6;
  int64 oldest_active_execution_started_at_ms = 7;
  int64 pending_cancelable_work_item_count = 8;
  int64 observed_at_ms = 9;
  shared.v1.ErrorDetail error = 10;
}

message GetAutomationPinConvergenceRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
}

message GetAutomationPinConvergenceResponse {
  string tenant_id = 1;
  string game_instance_id = 2;
  string observed_pinned_script_patch_version = 3;
  string last_observed_control_plane_request_id = 4;
  int64 observed_at_ms = 5;
  shared.v1.ErrorDetail error = 6;
  int64 projection_as_of_ms = 7;
  int64 projection_lag_ms = 8;
  bool is_projection_stale = 9;
}

enum ScriptPatchInstanceRolloutStatus {
  SCRIPT_PATCH_INSTANCE_ROLLOUT_STATUS_UNSPECIFIED = 0;
  SCRIPT_PATCH_INSTANCE_ROLLOUT_STATUS_PINNED = 1;
  SCRIPT_PATCH_INSTANCE_ROLLOUT_STATUS_ROLLED_BACK = 2;
  SCRIPT_PATCH_INSTANCE_ROLLOUT_STATUS_REPINNED = 3;
}

message GetScriptPatchInstanceRolloutStatusRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string script_patch_version = 3;
}

message GetScriptPatchInstanceRolloutStatusResponse {
  string tenant_id = 1;
  string game_instance_id = 2;
  string script_patch_version = 3;
  ScriptPatchInstanceRolloutStatus rollout_status = 4;
  string status_reason = 5;
  int64 last_changed_at_ms = 6;
  int64 projection_as_of_ms = 7;
  int64 projection_lag_ms = 8;
  bool is_projection_stale = 9;
  shared.v1.ErrorDetail error = 10;
}

message ListScriptPatchInstanceRolloutsRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string script_patch_version = 3;
  ScriptPatchInstanceRolloutStatus rollout_status = 4;
  int64 changed_after_ms = 5;
  int64 changed_before_ms = 6;
}

message ScriptPatchInstanceRolloutEntry {
  string tenant_id = 1;
  string game_instance_id = 2;
  string script_patch_version = 3;
  ScriptPatchInstanceRolloutStatus rollout_status = 4;
  string status_reason = 5;
  int64 last_changed_at_ms = 6;
  int64 projection_as_of_ms = 7;
  int64 projection_lag_ms = 8;
  bool is_projection_stale = 9;
}

message ListScriptPatchInstanceRolloutsResponse {
  repeated ScriptPatchInstanceRolloutEntry rollouts = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListScriptPatchInstanceRolloutEventsRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string script_patch_version = 3;
  ScriptPatchInstanceRolloutStatus rollout_status = 4;
  int64 changed_after_ms = 5;
  int64 changed_before_ms = 6;
  int32 limit = 7;
}

message ScriptPatchInstanceRolloutEventEntry {
  string event_id = 1;
  string tenant_id = 2;
  string game_instance_id = 3;
  string script_patch_version = 4;
  ScriptPatchInstanceRolloutStatus rollout_status = 5;
  string status_reason = 6;
  int64 observed_at_ms = 7;
  int64 projection_as_of_ms = 8;
}

message ListScriptPatchInstanceRolloutEventsResponse {
  repeated ScriptPatchInstanceRolloutEventEntry events = 1;
  shared.v1.ErrorDetail error = 2;
}

message CancelPendingWorkItemsForPatchRequest {
  string tenant_id = 1;
  string script_patch_version = 2;
  string game_instance_id = 3;
  string region_id = 4;
  string control_plane_request_id = 5;
  string actor_principal = 6;
  string reason = 7;
}

message CancelPendingWorkItemsForPatchResponse {
  int64 canceled_count = 1;
  shared.v1.ErrorDetail error = 2;
}

message CancelPendingWorkItemsForPluginVersionRequest {
  string tenant_id = 1;
  string plugin_id = 2;
  string plugin_version_id = 3;
  string game_instance_id = 4;
  string region_id = 5;
  string control_plane_request_id = 6;
  string actor_principal = 7;
  string reason = 8;
}

message CancelPendingWorkItemsForPluginVersionResponse {
  int64 canceled_count = 1;
  shared.v1.ErrorDetail error = 2;
}

enum PluginState {
  PLUGIN_STATE_UNSPECIFIED = 0;
  PLUGIN_STATE_ENABLED = 1;
  PLUGIN_STATE_DISABLED = 2;
  PLUGIN_STATE_DRAINING = 3;
  PLUGIN_STATE_RELOADING = 4;
  PLUGIN_STATE_FAILED = 5;
}

message GetPluginStatusRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string plugin_id = 3;
}

message GetPluginStatusResponse {
  string active_plugin_version_id = 1;
  string pending_plugin_version_id = 2;
  PluginState plugin_state = 3;
  string status_reason = 4;
  int64 last_changed_at_ms = 5;
  string control_plane_request_id = 6;
  string actor_principal = 7;
  int64 last_policy_checked_at_ms = 8;
  bool policy_check_stale = 9;
  shared.v1.ErrorDetail error = 10;
}

message GetPluginPolicyConvergenceRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  int32 max_results = 3;
}

message PluginPolicyViolation {
  string game_instance_id = 1;
  string plugin_id = 2;
  string active_plugin_version_id = 3;
  string reason = 4;
  int64 last_changed_at_ms = 5;
}

message GetPluginPolicyConvergenceResponse {
  int32 inspected_count = 1;
  int32 fail_closed_count = 2;
  bool converged = 3;
  int64 evaluated_at_ms = 4;
  repeated PluginPolicyViolation violations = 5;
  shared.v1.ErrorDetail error = 6;
}

message SetPluginActiveVersionRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string plugin_id = 3;
  string target_plugin_version_id = 4;
  string control_plane_request_id = 5;
  string actor_principal = 6;
  string reason = 7;
}

message SetPluginActiveVersionResponse {
  string previous_plugin_version_id = 1;
  string active_plugin_version_id = 2;
  string control_plane_request_id = 3;
  shared.v1.ErrorDetail error = 4;
}

message DisablePluginRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string plugin_id = 3;
  string control_plane_request_id = 4;
  string actor_principal = 5;
  string reason = 6;
}

message DisablePluginResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message DrainPluginRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string plugin_id = 3;
  string control_plane_request_id = 4;
  string actor_principal = 5;
  string reason = 6;
}

message DrainPluginResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}
