syntax = "proto3";

package automation_scripting.v1;

import "shared/v1/errors.proto";

option java_package = "net.firedevops.firemud.automationscripting.v1";
option java_multiple_files = true;

service AutomationScriptingService {
  // Simple ping used by health checks
  rpc Ping(PingRequest) returns (PingResponse);

  // Deliver a script trigger for evaluation. This RPC is idempotent with respect
  // to Trigger Identity (including script_event_id) and must not evaluate the
  // DSL body more than once for the same identity.
  rpc TriggerScriptEvent(TriggerScriptEventRequest) returns (TriggerScriptEventResponse);

  // Creates a new NPC formation
  rpc CreateFormation(CreateFormationRequest) returns (CreateFormationResponse);

  // Adds an NPC to an existing formation
  rpc AddFormationMember(AddFormationMemberRequest) returns (AddFormationMemberResponse);

  // Lists all NPCs belonging to a formation
  rpc ListFormationMembers(ListFormationMembersRequest) returns (ListFormationMembersResponse);

  // Uploads or replaces a script definition
  rpc UpdateScript(UpdateScriptRequest) returns (UpdateScriptResponse);

  // Checks if a script is queued or currently running
  rpc GetScriptStatus(GetScriptStatusRequest) returns (GetScriptStatusResponse);

  // Signals that a new script patch version is available
  rpc NotifyScriptVersionUpdate(NotifyScriptVersionUpdateRequest)
      returns (NotifyScriptVersionUpdateResponse);

  // Returns the canonical design-time digest for script definitions that participate in one
  // script-patch version.
  rpc GetDraftDesignDigest(GetDraftDesignDigestRequest) returns (GetDraftDesignDigestResponse);
}

// Operator/control-plane surface for patch lifecycle visibility and rollback support.
service AutomationScriptingControlPlaneService {
  rpc GetScriptPatchStatus(GetScriptPatchStatusRequest) returns (GetScriptPatchStatusResponse);
  rpc ListScriptPatchStatuses(ListScriptPatchStatusesRequest) returns (ListScriptPatchStatusesResponse);

  // Cancel pending durable work items for a patch so they are never handed off again.
  rpc CancelPendingWorkItemsForPatch(CancelPendingWorkItemsForPatchRequest)
      returns (CancelPendingWorkItemsForPatchResponse);

  // Plugin lifecycle/control-plane APIs.
  rpc GetPluginStatus(GetPluginStatusRequest) returns (GetPluginStatusResponse);
  rpc SetPluginActiveVersion(SetPluginActiveVersionRequest)
      returns (SetPluginActiveVersionResponse);
  rpc DisablePlugin(DisablePluginRequest) returns (DisablePluginResponse);
  rpc DrainPlugin(DrainPluginRequest) returns (DrainPluginResponse);
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}

message CreateFormationRequest {
  string tenant_id = 1;
  string name = 2;
  string leader_npc_id = 3;
  string formation_type = 4; // LINE, WEDGE, CIRCLE
}

message CreateFormationResponse {
  string formation_id = 1;
  shared.v1.ErrorDetail error = 2;
}

message AddFormationMemberRequest {
  string tenant_id = 1;
  string formation_id = 2;
  string npc_id = 3;
}

message AddFormationMemberResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListFormationMembersRequest {
  string tenant_id = 1;
  string formation_id = 2;
}

message ListFormationMembersResponse {
  repeated string npc_ids = 1;
  shared.v1.ErrorDetail error = 2;
}

message UpdateScriptRequest {
  string tenant_id = 1;
  string name = 2;
  string version = 3;
  string definition = 4;
}

message UpdateScriptResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetScriptStatusRequest {
  string tenant_id = 1;
  string script_name = 2;
}

message GetScriptStatusResponse {
  bool queued = 1;
  bool running = 2;
  shared.v1.ErrorDetail error = 3;
}

message NotifyScriptVersionUpdateRequest {
  string tenant_id = 1;
  string script_patch_version = 2;
  repeated string affected_scripts = 3;
}

message NotifyScriptVersionUpdateResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetDraftDesignDigestRequest {
  string tenant_id = 1;
  string script_patch_version = 2;
}

message GetDraftDesignDigestResponse {
  string tenant_id = 1;
  string script_patch_version = 2;
  string applied_commit_id = 3;
  string content_digest = 4;
  int32 digest_schema_version = 5;
  shared.v1.ErrorDetail error = 6;
}

enum TriggerMode {
  TRIGGER_MODE_UNSPECIFIED = 0;
  TRIGGER_MODE_NORMAL = 1;
  TRIGGER_MODE_CATCH_UP = 2;
}

enum TriggerAdmissionOutcome {
  TRIGGER_ADMISSION_OUTCOME_UNSPECIFIED = 0;
  TRIGGER_ADMISSION_OUTCOME_ADMITTED = 1;
  TRIGGER_ADMISSION_OUTCOME_BACKPRESSURE_RELOADING = 2;
  TRIGGER_ADMISSION_OUTCOME_DENIED_QUOTA = 3;
  TRIGGER_ADMISSION_OUTCOME_DENIED_TENANT_BUDGET = 4;
  TRIGGER_ADMISSION_OUTCOME_DENIED_DISABLED = 5;
  TRIGGER_ADMISSION_OUTCOME_DENIED_VERSION_UNAVAILABLE = 6;
  TRIGGER_ADMISSION_OUTCOME_DENIED_POLICY = 7;
  TRIGGER_ADMISSION_OUTCOME_INFRASTRUCTURE_ERROR = 8;
}

message TriggerScriptEventRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string region_id = 3;

  // Required for gameplay/runtime triggers and scheduler triggers so triggers are fenced
  // across scoped coordination resets. External/out-of-band triggers that omit region_epoch
  // must define their own consistency model explicitly.
  int64 region_epoch = 4;

  string entity_id = 5;
  string script_id = 6;

  // Plugin identity (required for plugin triggers). For core script triggers, these
  // fields must be absent.
  string plugin_id = 15;
  string plugin_version_id = 16;

  string event_type = 7;
  string script_patch_version = 8;
  string script_event_id = 9;

  bool is_dry_run = 10;
  TriggerMode trigger_mode = 11;

  // Scheduling context (when applicable).
  int64 due_tick_id = 12;
  int64 due_at_ms = 13;

  // Event payload envelope (implementation-specific).
  string payload_json = 14;
}

message TriggerScriptEventResponse {
  // Indicates whether the trigger was admitted into the scripting pipeline.
  // This does not imply that commands have been accepted into tick queues; that
  // end-to-end handoff is observable via script_event_audit.
  bool admitted = 1;

  TriggerAdmissionOutcome admission_outcome = 2;
  string admission_reason = 3;
  shared.v1.ErrorDetail error = 4;
}

enum ScriptPatchStatus {
  SCRIPT_PATCH_STATUS_UNSPECIFIED = 0;
  SCRIPT_PATCH_STATUS_READY = 1;
  SCRIPT_PATCH_STATUS_FAILED = 2;
  SCRIPT_PATCH_STATUS_ROLLED_BACK = 3;
  SCRIPT_PATCH_STATUS_PENDING_VALIDATION = 4;
  SCRIPT_PATCH_STATUS_ONLOAD_RUNNING = 5;
}

message GetScriptPatchStatusRequest {
  string tenant_id = 1;
  string script_patch_version = 2;
}

message GetScriptPatchStatusResponse {
  ScriptPatchStatus status = 1;
  string status_reason = 2;
  int64 last_changed_at_ms = 3;
  shared.v1.ErrorDetail error = 4;
}

message ListScriptPatchStatusesRequest {
  string tenant_id = 1;
  ScriptPatchStatus status = 2;
  int64 changed_after_ms = 3;
  int64 changed_before_ms = 4;
}

message ScriptPatchStatusEntry {
  string script_patch_version = 1;
  ScriptPatchStatus status = 2;
  string status_reason = 3;
  int64 last_changed_at_ms = 4;
}

message ListScriptPatchStatusesResponse {
  repeated ScriptPatchStatusEntry patches = 1;
  shared.v1.ErrorDetail error = 2;
}

message CancelPendingWorkItemsForPatchRequest {
  string tenant_id = 1;
  string script_patch_version = 2;
  string game_instance_id = 3;
  string region_id = 4;
  string control_plane_request_id = 5;
  string actor_principal = 6;
  string reason = 7;
}

message CancelPendingWorkItemsForPatchResponse {
  int64 canceled_count = 1;
  shared.v1.ErrorDetail error = 2;
}

enum PluginState {
  PLUGIN_STATE_UNSPECIFIED = 0;
  PLUGIN_STATE_ENABLED = 1;
  PLUGIN_STATE_DISABLED = 2;
  PLUGIN_STATE_DRAINING = 3;
  PLUGIN_STATE_RELOADING = 4;
  PLUGIN_STATE_FAILED = 5;
}

message GetPluginStatusRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string plugin_id = 3;
}

message GetPluginStatusResponse {
  string active_plugin_version_id = 1;
  string pending_plugin_version_id = 2;
  PluginState plugin_state = 3;
  string status_reason = 4;
  int64 last_changed_at_ms = 5;
  shared.v1.ErrorDetail error = 6;
}

message SetPluginActiveVersionRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string plugin_id = 3;
  string target_plugin_version_id = 4;
  string control_plane_request_id = 5;
  string actor_principal = 6;
  string reason = 7;
}

message SetPluginActiveVersionResponse {
  string previous_plugin_version_id = 1;
  string active_plugin_version_id = 2;
  string control_plane_request_id = 3;
  shared.v1.ErrorDetail error = 4;
}

message DisablePluginRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string plugin_id = 3;
  string control_plane_request_id = 4;
  string actor_principal = 5;
  string reason = 6;
}

message DisablePluginResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message DrainPluginRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string plugin_id = 3;
  string control_plane_request_id = 4;
  string actor_principal = 5;
  string reason = 6;
}

message DrainPluginResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}
