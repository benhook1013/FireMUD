syntax = "proto3";

package automation_scripting.v1;

import "shared/v1/errors.proto";

option java_package = "net.firedevops.firemud.automationscripting.v1";
option java_multiple_files = true;

service AutomationScriptingService {
  // Simple ping used by health checks
  rpc Ping(PingRequest) returns (PingResponse);

  // Creates a new NPC formation
  rpc CreateFormation(CreateFormationRequest) returns (CreateFormationResponse);

  // Adds an NPC to an existing formation
  rpc AddFormationMember(AddFormationMemberRequest) returns (AddFormationMemberResponse);

  // Lists all NPCs belonging to a formation
  rpc ListFormationMembers(ListFormationMembersRequest) returns (ListFormationMembersResponse);

  // Uploads or replaces a script definition
  rpc UpdateScript(UpdateScriptRequest) returns (UpdateScriptResponse);

  // Checks if a script is queued or currently running
  rpc GetScriptStatus(GetScriptStatusRequest) returns (GetScriptStatusResponse);

  // Signals that a new script patch version is available
  rpc NotifyScriptVersionUpdate(NotifyScriptVersionUpdateRequest)
      returns (NotifyScriptVersionUpdateResponse);
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}

message CreateFormationRequest {
  string tenant_id = 1;
  string name = 2;
  string leader_npc_id = 3;
  string formation_type = 4; // LINE, WEDGE, CIRCLE
}

message CreateFormationResponse {
  string formation_id = 1;
  shared.v1.ErrorDetail error = 2;
}

message AddFormationMemberRequest {
  string tenant_id = 1;
  string formation_id = 2;
  string npc_id = 3;
}

message AddFormationMemberResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListFormationMembersRequest {
  string tenant_id = 1;
  string formation_id = 2;
}

message ListFormationMembersResponse {
  repeated string npc_ids = 1;
  shared.v1.ErrorDetail error = 2;
}

message UpdateScriptRequest {
  string tenant_id = 1;
  string name = 2;
  string version = 3;
  string definition = 4;
}

message UpdateScriptResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetScriptStatusRequest {
  string tenant_id = 1;
  string script_name = 2;
}

message GetScriptStatusResponse {
  bool queued = 1;
  bool running = 2;
  shared.v1.ErrorDetail error = 3;
}

message NotifyScriptVersionUpdateRequest {
  int64 tenant_id = 1;
  string script_patch_version = 2;
  repeated string affected_scripts = 3;
}

message NotifyScriptVersionUpdateResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}
