syntax = "proto3";

package gamedesign.v1;

import "shared/v1/errors.proto";
import "world-management/v1/world_management_service.proto";

option java_package = "net.firedevops.firemud.gamedesign.v1";
option java_multiple_files = true;

service GameDesignService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc SaveRevision(SaveRevisionRequest) returns (SaveRevisionResponse);
  rpc PublishVersion(PublishVersionRequest) returns (PublishVersionResponse);
  rpc PublishScriptPatchVersion(PublishScriptPatchVersionRequest)
      returns (PublishScriptPatchVersionResponse);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc GetDesignControlPlaneDigest(GetDesignControlPlaneDigestRequest)
      returns (GetDesignControlPlaneDigestResponse);
  rpc GetPublishedReleaseBundle(GetPublishedReleaseBundleRequest)
      returns (GetPublishedReleaseBundleResponse);
  rpc GetVersionState(GetVersionStateRequest) returns (GetVersionStateResponse);
  rpc CompareAndSetVersionState(CompareAndSetVersionStateRequest)
      returns (CompareAndSetVersionStateResponse);
  rpc ResolveLaunchDescriptor(ResolveLaunchDescriptorRequest)
      returns (ResolveLaunchDescriptorResponse);
  rpc CreateTemplateRemapSet(CreateTemplateRemapSetRequest)
      returns (CreateTemplateRemapSetResponse);
  rpc ApproveTemplateRemapSet(ApproveTemplateRemapSetRequest)
      returns (ApproveTemplateRemapSetResponse);
  rpc GetTemplateRemapSet(GetTemplateRemapSetRequest)
      returns (GetTemplateRemapSetResponse);
  rpc GetVersionAssetArtifactState(GetVersionAssetArtifactStateRequest)
      returns (GetVersionAssetArtifactStateResponse);
  rpc TombstoneVersionAssets(TombstoneVersionAssetsRequest)
      returns (TombstoneVersionAssetsResponse);
  rpc CanDeleteVersionAssets(CanDeleteVersionAssetsRequest)
      returns (CanDeleteVersionAssetsResponse);
  rpc BeginPurgeVersionAssets(BeginPurgeVersionAssetsRequest)
      returns (BeginPurgeVersionAssetsResponse);
  rpc FinalizePurgeVersionAssets(FinalizePurgeVersionAssetsRequest)
      returns (FinalizePurgeVersionAssetsResponse);
  rpc GetVersionAssetPurgeStatus(GetVersionAssetPurgeStatusRequest)
      returns (GetVersionAssetPurgeStatusResponse);
  rpc RepairPublishedVersionAssets(RepairPublishedVersionAssetsRequest)
      returns (RepairPublishedVersionAssetsResponse);
  rpc GetScopedSettingsOverrides(GetScopedSettingsOverridesRequest)
      returns (GetScopedSettingsOverridesResponse);
  rpc PutSettingsDomainOverride(PutSettingsDomainOverrideRequest)
      returns (PutSettingsDomainOverrideResponse);
  rpc DeleteSettingsDomainOverride(DeleteSettingsDomainOverrideRequest)
      returns (DeleteSettingsDomainOverrideResponse);
}

message SaveRevisionRequest {
  string data = 1;
  string tenant_id = 2;
  int64 author_account_id = 3;
  int64 version_id = 4;
  string revision_kind = 5;
  WorldDesignMutationRevision world_design_mutation = 6;
}

message SaveRevisionResponse {
  int64 revision_id = 1;
  shared.v1.ErrorDetail error = 2;
  AppliedWorldDesignMutation applied_world_design_mutation = 3;
}

message WorldDesignMutationRevision {
  string logical_revision_id = 1;
  string commit_id = 2;
  world_management.v1.WorldDesignMutationOperation operation = 3;
  world_management.v1.WorldDesignAggregateType aggregate_type = 4;
  string aggregate_id = 5;
  int64 expected_draft_revision_epoch = 6;
  string scope_type = 7;
  string scope_id = 8;
  int64 expected_draft_scope_revision_epoch = 9;
  world_management.v1.WorldDesignScopeMutationPolicy scope_mutation_policy = 10;
  oneof payload {
    world_management.v1.RegionDesignMutation region = 20;
    world_management.v1.ZoneDesignMutation zone = 21;
    world_management.v1.RoomDesignMutation room = 22;
    world_management.v1.RoomExitDesignMutation room_exit = 23;
    world_management.v1.GenerationRuleDesignMutation generation_rule = 24;
    world_management.v1.WorldEntitySpawnBindingDesignMutation world_entity_spawn_binding = 25;
  }
}

message AppliedWorldDesignMutation {
  world_management.v1.WorldDesignMutationResult result = 1;
  string aggregate_id = 2;
  int64 draft_revision_epoch = 3;
  int64 draft_scope_revision_epoch = 4;
}

message PublishVersionRequest {
  string tenant_id = 1;
  string notes = 2;
}

message PublishVersionResponse {
  int64 version_id = 1;
  shared.v1.ErrorDetail error = 2;
}

message PublishScriptPatchVersionRequest {
  string tenant_id = 1;
  int64 base_version_id = 2;
  string script_patch_version = 3;
  string notes = 4;
}

message PublishScriptPatchVersionResponse {
  int64 version_id = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListVersionsRequest {
  string tenant_id = 1;
}

message ListVersionsResponse {
  repeated Version versions = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetDesignControlPlaneDigestRequest {
  string tenant_id = 1;
  oneof scope {
    int64 version_id = 2;
    string script_patch_version = 3;
  }
}

message GetDesignControlPlaneDigestResponse {
  DesignControlPlaneDigest digest = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetPublishedReleaseBundleRequest {
  string tenant_id = 1;
  int64 version_id = 2;
}

message GetPublishedReleaseBundleResponse {
  PublishedReleaseBundle bundle = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetVersionStateRequest {
  string tenant_id = 1;
  int64 version_id = 2;
}

message GetVersionStateResponse {
  VersionStateSnapshot version_state = 1;
  shared.v1.ErrorDetail error = 2;
}

message CompareAndSetVersionStateRequest {
  string tenant_id = 1;
  int64 version_id = 2;
  int64 expected_version_state_epoch = 3;
  VersionLifecycleState new_state = 4;
  string reason = 5;
}

message CompareAndSetVersionStateResponse {
  VersionStateSnapshot version_state = 1;
  bool updated = 2;
  shared.v1.ErrorDetail error = 3;
}

message ResolveLaunchDescriptorRequest {
  string tenant_id = 1;
  int64 game_template_id = 2;
  string control_plane_request_id = 3;
  optional string requested_script_patch_version = 4;
  optional int64 source_version_id = 5;
  optional int64 target_version_id = 6;
  optional string requested_runtime_flags_json = 7;
}

message ResolveLaunchDescriptorResponse {
  LaunchDescriptor launch_descriptor = 1;
  shared.v1.ErrorDetail error = 2;
}

message CreateTemplateRemapSetRequest {
  string tenant_id = 1;
  int64 source_version_id = 2;
  int64 target_version_id = 3;
  string created_reason = 4;
  repeated TemplateRemapEntry remap_entries = 5;
}

message CreateTemplateRemapSetResponse {
  TemplateRemapSet remap_set = 1;
  shared.v1.ErrorDetail error = 2;
}

message ApproveTemplateRemapSetRequest {
  string tenant_id = 1;
  string remap_set_id = 2;
  string approval_reason = 3;
}

message ApproveTemplateRemapSetResponse {
  TemplateRemapSet remap_set = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetTemplateRemapSetRequest {
  string tenant_id = 1;
  string remap_set_id = 2;
}

message GetTemplateRemapSetResponse {
  TemplateRemapSet remap_set = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetVersionAssetArtifactStateRequest {
  string tenant_id = 1;
  int64 version_id = 2;
}

message GetVersionAssetArtifactStateResponse {
  VersionAssetArtifactState artifact_state = 1;
  shared.v1.ErrorDetail error = 2;
}

message TombstoneVersionAssetsRequest {
  string tenant_id = 1;
  int64 version_id = 2;
  int64 expected_artifact_state_epoch = 3;
  string tombstone_workflow_id = 4;
}

message TombstoneVersionAssetsResponse {
  VersionAssetArtifactState artifact_state = 1;
  shared.v1.ErrorDetail error = 2;
}

message CanDeleteVersionAssetsRequest {
  string tenant_id = 1;
  int64 version_id = 2;
}

message CanDeleteVersionAssetsResponse {
  VersionAssetDeletionEligibility eligibility = 1;
  shared.v1.ErrorDetail error = 2;
}

message BeginPurgeVersionAssetsRequest {
  string tenant_id = 1;
  int64 version_id = 2;
  int64 expected_artifact_state_epoch = 3;
}

message BeginPurgeVersionAssetsResponse {
  VersionAssetArtifactState artifact_state = 1;
  VersionAssetPurgeWorkflowStatus purge_status = 2;
  shared.v1.ErrorDetail error = 3;
}

message FinalizePurgeVersionAssetsRequest {
  string tenant_id = 1;
  int64 version_id = 2;
  string purge_workflow_id = 3;
  int64 expected_artifact_state_epoch = 4;
}

message FinalizePurgeVersionAssetsResponse {
  VersionAssetArtifactState artifact_state = 1;
  VersionAssetPurgeWorkflowStatus purge_status = 2;
  shared.v1.ErrorDetail error = 3;
}

message GetVersionAssetPurgeStatusRequest {
  string tenant_id = 1;
  int64 version_id = 2;
  string purge_workflow_id = 3;
}

message GetVersionAssetPurgeStatusResponse {
  VersionAssetArtifactState artifact_state = 1;
  VersionAssetPurgeWorkflowStatus purge_status = 2;
  shared.v1.ErrorDetail error = 3;
}

message RepairPublishedVersionAssetsRequest {
  string tenant_id = 1;
  int64 version_id = 2;
  int64 expected_artifact_state_epoch = 3;
  string repair_workflow_id = 4;
}

message RepairPublishedVersionAssetsResponse {
  VersionAssetArtifactState artifact_state = 1;
  shared.v1.ErrorDetail error = 2;
}

message Version {
  int64 id = 1;
  int32 version_number = 2;
  string script_patch_version = 3;
  bool is_script_only = 4;
  string notes = 5;
}

message PublishedReleaseBundle {
  int64 id = 1;
  int64 version_id = 2;
  int32 version_number = 3;
  string attestation_schema_version = 4;
  string publish_workflow_id = 5;
  string manifest_hash = 6;
  repeated string required_manifest_asset_keys = 7;
  bool is_script_only = 8;
  string script_patch_version = 9;
  string published_at = 10;
  repeated ParticipantDigest participant_digests = 11;
  string generation_config_revision = 12;
}

message LaunchDescriptor {
  string launch_descriptor_id = 1;
  string tenant_id = 2;
  int64 game_template_id = 3;
  string control_plane_request_id = 4;
  int64 version_id = 5;
  string script_patch_version = 6;
  string runtime_flags_json = 7;
  string generation_config_revision = 8;
  int64 version_state_epoch = 9;
  int64 release_bundle_id = 10;
  string published_release_bundle_ref = 11;
  string remap_set_id = 12;
}

message TemplateRemapSet {
  string remap_set_id = 1;
  string tenant_id = 2;
  int64 source_version_id = 3;
  int64 target_version_id = 4;
  TemplateRemapSetStatus status = 5;
  string created_reason = 6;
  string approval_reason = 7;
  string created_at = 8;
  string approved_at = 9;
  repeated TemplateRemapEntry remap_entries = 10;
}

message TemplateRemapEntry {
  string mapping_domain = 1;
  string mapping_type = 2;
  string source_template_key = 3;
  string target_template_key = 4;
}

enum TemplateRemapSetStatus {
  TEMPLATE_REMAP_SET_STATUS_UNSPECIFIED = 0;
  TEMPLATE_REMAP_SET_STATUS_DRAFT = 1;
  TEMPLATE_REMAP_SET_STATUS_APPROVED = 2;
}

message DesignControlPlaneDigest {
  string tenant_id = 1;
  string scope_value = 2;
  string applied_commit_id = 3;
  string content_digest = 4;
  int32 digest_schema_version = 5;
}

message VersionStateSnapshot {
  string tenant_id = 1;
  int64 version_id = 2;
  VersionLifecycleState version_state = 3;
  int64 version_state_epoch = 4;
  string updated_at = 5;
}

message ParticipantDigest {
  string participant_key = 1;
  string scope_value = 2;
  string applied_commit_id = 3;
  string content_digest = 4;
  int32 digest_schema_version = 5;
}

enum VersionLifecycleState {
  VERSION_LIFECYCLE_STATE_UNSPECIFIED = 0;
  VERSION_LIFECYCLE_STATE_DRAFT = 1;
  VERSION_LIFECYCLE_STATE_PUBLISHED = 2;
  VERSION_LIFECYCLE_STATE_ACTIVE = 3;
  VERSION_LIFECYCLE_STATE_FAILED = 4;
  VERSION_LIFECYCLE_STATE_RETIRED = 5;
}

enum ArtifactState {
  ARTIFACT_STATE_UNSPECIFIED = 0;
  ARTIFACT_STATE_STAGED = 1;
  ARTIFACT_STATE_EXPORTED_UNATTESTED = 2;
  ARTIFACT_STATE_PUBLISHED = 3;
  ARTIFACT_STATE_FAILED = 4;
  ARTIFACT_STATE_TOMBSTONED = 5;
  ARTIFACT_STATE_PURGE_IN_PROGRESS = 6;
  ARTIFACT_STATE_PURGE_FAILED = 7;
  ARTIFACT_STATE_PURGED = 8;
}

message VersionAssetArtifactState {
  string tenant_id = 1;
  int64 version_id = 2;
  ArtifactState artifact_state = 3;
  int64 state_epoch = 4;
  string manifest_hash = 5;
  string last_workflow_id = 6;
  string last_error_code = 7;
  string last_error_message = 8;
  string updated_at = 9;
  repeated string exported_manifest_asset_keys = 10;
  int32 exported_version_number = 11;
}

message VersionAssetDeletionEligibility {
  string tenant_id = 1;
  int64 version_id = 2;
  bool deletable = 3;
  ArtifactState current_artifact_state = 4;
  int64 current_state_epoch = 5;
  string failure_code = 6;
  string failure_message = 7;
}

message VersionAssetPurgeWorkflowStatus {
  string tenant_id = 1;
  int64 version_id = 2;
  string purge_workflow_id = 3;
  string workflow_status = 4;
  int64 started_from_state_epoch = 5;
  string requested_at = 6;
  string updated_at = 7;
  string completed_at = 8;
  string last_error_code = 9;
  string last_error_message = 10;
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetScopedSettingsOverridesRequest {
  string tenant_id = 1;
  optional int64 game_instance_id = 2;
}

message GetScopedSettingsOverridesResponse {
  SettingsOverrides tenant_overrides = 1;
  SettingsOverrides game_instance_overrides = 2;
  shared.v1.ErrorDetail error = 3;
}

message PutSettingsDomainOverrideRequest {
  string tenant_id = 1;
  optional int64 game_instance_id = 2;
  SettingsDomain domain = 3;
  SettingsOverrides overrides = 4;
}

message PutSettingsDomainOverrideResponse {
  shared.v1.ErrorDetail error = 1;
}

message DeleteSettingsDomainOverrideRequest {
  string tenant_id = 1;
  optional int64 game_instance_id = 2;
  SettingsDomain domain = 3;
}

message DeleteSettingsDomainOverrideResponse {
  shared.v1.ErrorDetail error = 1;
}

enum SettingsDomain {
  SETTINGS_DOMAIN_UNSPECIFIED = 0;
  SETTINGS_DOMAIN_RECONNECTION = 1;
  SETTINGS_DOMAIN_COMMUNICATION = 2;
  SETTINGS_DOMAIN_PRESENTATION = 3;
  SETTINGS_DOMAIN_MOVEMENT = 4;
  SETTINGS_DOMAIN_WORLD_TOPOLOGY = 5;
}

message SettingsOverrides {
  ReconnectionSettingsOverride reconnection = 1;
  CommunicationSettingsOverride communication = 2;
  PresentationSettingsOverride presentation = 3;
  MovementSettingsOverride movement = 4;
  WorldTopologySettingsOverride world_topology = 5;
}

message ReconnectionSettingsOverride {
  ReconnectionPolicyOverride policy = 1;
  ReconnectionBufferOverride buffer = 2;
}

message ReconnectionPolicyOverride {
  optional int64 resume_window_ms = 1;
  optional bool stale_resume_falls_through_to_fresh_entry = 2;
}

message ReconnectionBufferOverride {
  optional int64 ttl_ms = 1;
  optional int32 min_messages = 2;
  optional int32 min_lines = 3;
  optional int32 soft_max_bytes = 4;
  optional int32 hard_max_bytes = 5;
}

message CommunicationSettingsOverride {
  optional int32 max_message_length = 1;
  CommunicationDefaultsOverride defaults = 2;
}

message CommunicationDefaultsOverride {
  optional bool say_enabled = 1;
  optional bool whisper_enabled = 2;
  optional bool tell_enabled = 3;
  optional bool whisper_observer_metadata_enabled = 4;
}

message PresentationSettingsOverride {
  optional string default_locale_tag = 1;
  optional PresentationColorMode default_color_mode = 2;
  optional bool brief_enabled_by_default = 3;
  PresentationPromptOverride prompt = 4;
}

enum PresentationColorMode {
  PRESENTATION_COLOR_MODE_UNSPECIFIED = 0;
  PRESENTATION_COLOR_MODE_NONE = 1;
  PRESENTATION_COLOR_MODE_BASIC = 2;
  PRESENTATION_COLOR_MODE_RICH = 3;
}

message PresentationPromptOverride {
  optional bool enabled = 1;
  optional bool emit_after_reconnect_restore = 2;
  optional int64 coalesce_window_ms = 3;
}

message MovementSettingsOverride {
  optional bool post_move_look_enabled = 1;
}

message WorldTopologySettingsOverride {
  optional WorldTopologyScopeModel scope_model = 1;
  optional bool regions_enabled = 2;
}

enum WorldTopologyScopeModel {
  WORLD_TOPOLOGY_SCOPE_MODEL_UNSPECIFIED = 0;
  WORLD_TOPOLOGY_SCOPE_MODEL_MAP_ONLY = 1;
  WORLD_TOPOLOGY_SCOPE_MODEL_AREA_AND_MAP = 2;
  WORLD_TOPOLOGY_SCOPE_MODEL_REGION_AREA_AND_MAP = 3;
}
