syntax = "proto3";

package gamedesign.v1;

option java_package = "net.firedevops.firemud.gamedesign.v1";
option java_multiple_files = true;

// Owner-local legacy source read. This does not attest an Account numeric tenant key.
service TenantIdentityService {
  rpc ResolveLegacyGameTenantIdentity(ResolveLegacyGameTenantIdentityRequest)
      returns (ResolveLegacyGameTenantIdentityResponse);
  // Owner-approved cross-service legacy association; Account is the sole caller.
  rpc ResolveLegacyAccountTenantAssociation(ResolveLegacyAccountTenantAssociationRequest)
      returns (ResolveLegacyAccountTenantAssociationResponse);
  // Exact immutable readback of a newly created tenant operation for Account.
  rpc ResolveFreshTenantCreation(ResolveFreshTenantCreationRequest)
      returns (ResolveFreshTenantCreationResponse);
  // Same-namespace Account mTLS read only, without forwarded caller context.
  rpc ResolveFreshTenantCreatorQualification(ResolveFreshTenantCreatorQualificationRequest)
      returns (ResolveFreshTenantCreatorQualificationResponse);
  // Exact owner-local read of one persisted runtime tenant identity for Game Session.
  rpc ResolveRuntimeTenantIdentity(ResolveRuntimeTenantIdentityRequest)
      returns (ResolveRuntimeTenantIdentityResponse);
  // Exact immutable authored-selector source for Game Session; not catalog enrollment.
  rpc ResolveAuthoredWorldSource(ResolveAuthoredWorldSourceRequest)
      returns (ResolveAuthoredWorldSourceResponse);
  // Exact audited retained Game Session association; never an Account manifest or admission.
  rpc ResolveLegacyGameSessionTenantAssociation(ResolveLegacyGameSessionTenantAssociationRequest)
      returns (ResolveLegacyGameSessionTenantAssociationResponse);
}

message ResolveLegacyGameSessionTenantAssociationRequest {
  string request_id = 1;
  string operation_id = 2;
  string canonical_tenant_id = 3;
  // Canonical positive decimal BIGINT provenance, not a public tenant identifier.
  string legacy_game_session_tenant_id = 4;
}

message GameSessionTenantAssociationManifestEvidence {
  int32 schema_version = 1;
  string operation_id = 2;
  string target_namespace = 3;
  string signer_key_id = 4;
  string approved_by = 5;
  string approval_reference = 6;
  string signed_at = 7;
  string legacy_game_session_tenant_id = 8;
  string canonical_tenant_id = 9;
  string source_game_row_id = 10;
  string source_game_tenant_key = 11;
  string provenance_kind = 12;
  string game_session_evidence_digest = 13;
}

message ResolveLegacyGameSessionTenantAssociationResponse {
  string request_id = 1;
  GameSessionTenantAssociationManifestEvidence manifest = 2;
  string manifest_digest = 3;
  string ed25519_signature = 4;
}

message ResolveLegacyGameTenantIdentityRequest {
  string legacy_game_tenant_id = 1;
}

message ResolveLegacyGameTenantIdentityResponse {
  string canonical_tenant_id = 1;
  string source_legacy_game_tenant_id = 2;
  int64 source_game_row_id = 3;
  string provenance_kind = 4;
}

message ResolveLegacyAccountTenantAssociationRequest {
  int64 legacy_account_tenant_id = 1;
}

message ResolveLegacyAccountTenantAssociationResponse {
  int64 legacy_account_tenant_id = 1;
  string source_legacy_game_tenant_id = 2;
  string canonical_tenant_id = 3;
  int64 source_game_row_id = 4;
  string account_evidence_digest = 5;
  string operation_id = 6;
  string manifest_digest = 7;
  string target_namespace = 8;
  string signer_key_id = 9;
  string approved_by = 10;
  string approval_reference = 11;
  string signed_at = 12;
  int32 operation_entry_count = 13;
  string manifest_signature = 14;
  int32 manifest_schema_version = 15;
}

message ResolveFreshTenantCreationRequest {
  string creation_request_id = 1;
  string expected_request_digest = 2;
}

message ResolveFreshTenantCreationResponse {
  int32 schema_version = 1;
  string target_namespace = 2;
  string creation_request_id = 3;
  string operation_id = 4;
  string request_digest = 5;
  string canonical_tenant_id = 6;
  int64 source_game_row_id = 7;
  string source_game_tenant_key = 8;
  string provenance_kind = 9;
  string evidence_digest = 10;
}

message ResolveFreshTenantCreatorQualificationRequest {
  // Distinct Account read identity; it does not replace the creation request identity.
  string read_request_id = 1;
  string creation_request_id = 2;
  string expected_request_digest = 3;
  string expected_evidence_digest = 4;
  string initiating_account_id = 5;
  string account_authorization_operation_id = 6;
  string account_authorization_digest = 7;
  string expected_creator_evidence_digest = 8;
}

message FreshTenantCreatorQualificationEvidence {
  int32 schema_version = 1;
  string initiating_account_id = 2;
  string account_authorization_operation_id = 3;
  string account_authorization_digest = 4;
  string evidence_digest = 5;
}

message ResolveFreshTenantCreatorQualificationResponse {
  string read_request_id = 1;
  // Original source identity evidence remains byte-for-byte and digest-for-digest unchanged.
  ResolveFreshTenantCreationResponse creation_evidence = 2;
  FreshTenantCreatorQualificationEvidence creator_qualification = 3;
}

message ResolveRuntimeTenantIdentityRequest {
  string canonical_tenant_id = 1;
  string request_id = 2;
}

message ResolveRuntimeTenantIdentityResponse {
  int32 schema_version = 1;
  string target_namespace = 2;
  string request_id = 3;
  string canonical_tenant_id = 4;
  int64 source_game_row_id = 5;
  string source_game_tenant_key = 6;
  string provenance_kind = 7;
}

message ResolveAuthoredWorldSourceRequest {
  string request_id = 1;
  string operation_id = 2;
  string canonical_tenant_id = 3;
  string world_slug = 4;
}

message ResolveAuthoredWorldSourceResponse {
  int32 schema_version = 1;
  string target_namespace = 2;
  string request_id = 3;
  string registration_request_id = 4;
  string operation_id = 5;
  string request_digest = 6;
  string canonical_tenant_id = 7;
  string tenant_slug = 8;
  string world_slug = 9;
  string world_display_name = 10;
  int64 source_game_row_id = 11;
  string source_game_tenant_key = 12;
  string provenance_kind = 13;
  string evidence_digest = 14;
}
