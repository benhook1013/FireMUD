syntax = "proto3";

package gamedesign.v1;

import "google/protobuf/empty.proto";

option java_package = "net.firedevops.firemud.gamedesign.v1";
option java_multiple_files = true;

// Read-only exact Account/Game Session workload handoff for owner-created tenant evidence.
service TenantIdentityService {
  rpc ResolveFreshTenantCreation(ResolveFreshTenantCreationRequest)
      returns (ResolveFreshTenantCreationResponse);
}

// Standalone, unregistered read of one committed terminal Account-bound creation outcome.
service OriginalTenantCreationOutcomeReadService {
  rpc ResolveOriginalTenantCreationOutcome(ResolveOriginalTenantCreationOutcomeRequest)
      returns (ResolveOriginalTenantCreationOutcomeResponse);
}

// Standalone private Account-only dispatch for an exact, currently authorized original.
service TenantCreationService {
  rpc CreateAuthorizedTenant(CreateAuthorizedTenantRequest)
      returns (CreateAuthorizedTenantResponse);
  // Explicit terminal exclusion of future creation. Acknowledgment is not outcome evidence.
  rpc CloseOriginalTenantCreation(ResolveOriginalTenantCreationOutcomeRequest)
      returns (google.protobuf.Empty);
}

// Standalone, unregistered exact authored-world source read; no mutation or admission permission.
service AuthoredWorldSourceReadService {
  rpc ResolveAuthoredWorldSource(ResolveAuthoredWorldSourceRequest)
      returns (ResolveAuthoredWorldSourceResponse);
}

message ResolveFreshTenantCreationRequest {
  string creation_request_id = 1;
  string expected_request_digest = 2;
}

message ResolveFreshTenantCreationResponse {
  int32 schema_version = 1;
  string target_namespace = 2;
  string creation_request_id = 3;
  string operation_id = 4;
  string request_digest = 5;
  string canonical_tenant_id = 6;
  int64 source_game_row_id = 7;
  string source_game_tenant_key = 8;
  string provenance_kind = 9;
  string evidence_digest = 10;
}

message ResolveOriginalTenantCreationOutcomeRequest {
  int32 schema_version = 1;
  string read_request_id = 2;
  string target_namespace = 3;
  string creation_request_id = 4;
  string account_authorization_operation_id = 5;
  string initiating_account_id = 6;
  string creation_request_digest = 7;
  string account_authorization_digest = 8;
}

enum OriginalTenantCreationOutcome {
  ORIGINAL_TENANT_CREATION_OUTCOME_UNSPECIFIED = 0;
  ORIGINAL_TENANT_CREATION_OUTCOME_CREATED = 1;
  ORIGINAL_TENANT_CREATION_OUTCOME_NOT_CREATED = 2;
}

message ResolveOriginalTenantCreationOutcomeResponse {
  int32 schema_version = 1;
  string read_request_id = 2;
  string target_namespace = 3;
  string creation_request_id = 4;
  string account_authorization_operation_id = 5;
  string initiating_account_id = 6;
  string creation_request_digest = 7;
  string account_authorization_digest = 8;
  OriginalTenantCreationOutcome outcome = 9;
  ResolveFreshTenantCreationResponse created_receipt = 10;
  string evidence_digest = 11;
}

message CreateAuthorizedTenantRequest {
  int32 schema_version = 1;
  string create_request_id = 2;
  string target_namespace = 3;
  string creation_request_id = 4;
  string account_authorization_operation_id = 5;
  string initiating_account_id = 6;
  string creation_request_digest = 7;
  string account_authorization_digest = 8;
  string source_game_tenant_key = 9;
  string name = 10;
  optional string description = 11;
}

message CreateAuthorizedTenantResponse {
  int32 schema_version = 1;
  string create_request_id = 2;
  string target_namespace = 3;
  string creation_request_id = 4;
  string account_authorization_operation_id = 5;
  string initiating_account_id = 6;
  string creation_request_digest = 7;
  string account_authorization_digest = 8;
  OriginalTenantCreationOutcome status = 9;
  ResolveFreshTenantCreationResponse created_receipt = 10;
}

message ResolveAuthoredWorldSourceRequest {
  string request_id = 1;
  string operation_id = 2;
  string canonical_tenant_id = 3;
  string world_slug = 4;
}

message ResolveAuthoredWorldSourceResponse {
  int32 schema_version = 1;
  string target_namespace = 2;
  string request_id = 3;
  string registration_request_id = 4;
  string operation_id = 5;
  string request_digest = 6;
  string canonical_tenant_id = 7;
  string tenant_slug = 8;
  string world_slug = 9;
  string world_display_name = 10;
  int64 source_game_row_id = 11;
  string source_game_tenant_key = 12;
  string provenance_kind = 13;
  string evidence_digest = 14;
}
