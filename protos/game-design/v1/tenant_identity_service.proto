syntax = "proto3";

package gamedesign.v1;

option java_package = "net.firedevops.firemud.gamedesign.v1";
option java_multiple_files = true;

// Authenticated owner-local reads of persisted runtime and fresh-creation tenant evidence.
service TenantIdentityService {
  // Exact same-namespace Account/Game Session read of owner-created tenant evidence.
  rpc ResolveFreshTenantCreation(ResolveFreshTenantCreationRequest)
      returns (ResolveFreshTenantCreationResponse);
  rpc ResolveRuntimeTenantIdentity(ResolveRuntimeTenantIdentityRequest)
      returns (ResolveRuntimeTenantIdentityResponse);
  // Exact audited retained Game Session association; never an Account manifest or admission.
  rpc ResolveLegacyGameSessionTenantAssociation(ResolveLegacyGameSessionTenantAssociationRequest)
      returns (ResolveLegacyGameSessionTenantAssociationResponse);
  // Same-namespace Game Session read of immutable, version-scoped Game Design policy evidence.
  rpc ResolvePublishedRealmEntryPolicy(ResolvePublishedRealmEntryPolicyRequest)
      returns (ResolvePublishedRealmEntryPolicyResponse);
  // Complete bounded policy set; required for catalog cardinality and public-production proof.
  rpc ListPublishedRealmEntryPolicies(ListPublishedRealmEntryPoliciesRequest)
      returns (ListPublishedRealmEntryPoliciesResponse);
}

message ResolveRuntimeTenantIdentityRequest {
  string canonical_tenant_id = 1;
  string request_id = 2;
}

message ResolveRuntimeTenantIdentityResponse {
  int32 schema_version = 1;
  string target_namespace = 2;
  string request_id = 3;
  string canonical_tenant_id = 4;
  int64 source_game_row_id = 5;
  string source_game_tenant_key = 6;
  string provenance_kind = 7;
}

message ResolveLegacyGameSessionTenantAssociationRequest {
  string request_id = 1;
  string operation_id = 2;
  string canonical_tenant_id = 3;
  // Canonical positive decimal BIGINT provenance, not a public tenant identifier.
  string legacy_game_session_tenant_id = 4;
}

message GameSessionTenantAssociationManifestEvidence {
  int32 schema_version = 1;
  string operation_id = 2;
  string target_namespace = 3;
  string signer_key_id = 4;
  string approved_by = 5;
  string approval_reference = 6;
  string signed_at = 7;
  // Database-generated time of the closed Game Session source snapshot.
  string source_captured_at = 14;
  string legacy_game_session_tenant_id = 8;
  string canonical_tenant_id = 9;
  string source_game_row_id = 10;
  string source_game_tenant_key = 11;
  string provenance_kind = 12;
  string game_session_evidence_digest = 13;
  string game_session_projection_digest = 15;
}

message ResolveLegacyGameSessionTenantAssociationResponse {
  string request_id = 1;
  GameSessionTenantAssociationManifestEvidence manifest = 2;
  string manifest_digest = 3;
  string ed25519_signature = 4;
}

message ResolvePublishedRealmEntryPolicyRequest {
  string canonical_tenant_id = 1;
  int64 version_id = 2;
  string world_slug = 3;
  string realm_slug = 4;
}

enum PublishedRealmEntryStateScope {
  PUBLISHED_REALM_ENTRY_STATE_SCOPE_UNSPECIFIED = 0;
  PUBLISHED_REALM_ENTRY_STATE_SCOPE_SHARED = 1;
  PUBLISHED_REALM_ENTRY_STATE_SCOPE_ISOLATED = 2;
}

enum PublishedRealmEntryPolicyKind {
  PUBLISHED_REALM_ENTRY_POLICY_KIND_UNSPECIFIED = 0;
  PUBLISHED_REALM_ENTRY_POLICY_KIND_PRESEEDED_ONLY = 1;
}

message ResolvePublishedRealmEntryPolicyResponse {
  int32 schema_version = 1;
  string target_namespace = 2;
  string canonical_tenant_id = 3;
  int64 version_id = 4;
  int32 version_number = 5;
  string policy_id = 6;
  int64 source_revision_id = 7;
  int64 source_game_row_id = 8;
  string source_game_tenant_key = 9;
  string tenant_identity_provenance_kind = 10;
  string release_bundle_identity = 11;
  string publish_workflow_id = 12;
  string manifest_hash = 13;
  string world_slug = 14;
  string world_display_name = 15;
  string realm_slug = 16;
  string realm_display_name = 17;
  bool visible = 18;
  bool public_production = 19;
  PublishedRealmEntryStateScope state_scope = 20;
  PublishedRealmEntryPolicyKind entry_policy = 21;
  string policy_json = 22;
  string policy_digest = 23;
}

message ListPublishedRealmEntryPoliciesRequest {
  string canonical_tenant_id = 1;
  int64 version_id = 2;
}

message ListPublishedRealmEntryPoliciesResponse {
  int32 schema_version = 1;
  string target_namespace = 2;
  string canonical_tenant_id = 3;
  int64 version_id = 4;
  int32 version_number = 5;
  string release_bundle_identity = 6;
  string publish_workflow_id = 7;
  string manifest_hash = 8;
  uint32 policy_count = 9;
  string policy_set_digest = 10;
  repeated ResolvePublishedRealmEntryPolicyResponse policies = 11;
}

message ResolveFreshTenantCreationRequest {
  string creation_request_id = 1;
  string expected_request_digest = 2;
}

message ResolveFreshTenantCreationResponse {
  int32 schema_version = 1;
  string target_namespace = 2;
  string creation_request_id = 3;
  string operation_id = 4;
  string request_digest = 5;
  string canonical_tenant_id = 6;
  int64 source_game_row_id = 7;
  string source_game_tenant_key = 8;
  string provenance_kind = 9;
  string evidence_digest = 10;
}
