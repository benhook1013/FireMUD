syntax = "proto3";
package game_design.v1;
option java_package = "net.firedevops.firemud.gamedesign.v1";
option java_multiple_files = true;

// Unregistered exact immutable synchronized source read, allowlisted to Account and GL.
service GameDesignGameplayRuleSourceReadService {
  rpc ReadSelectedGameplayRuleSource(ReadSelectedGameplayRuleSourceRequest)
      returns (ReadSelectedGameplayRuleSourceResponse);
}
message ReadSelectedGameplayRuleSourceRequest {
  int32 schema_version = 1;
  string target_namespace = 2;
  string read_request_id = 3;
  string game_design_binding_json = 4;
  string game_design_binding_digest = 5;
}
message ReadSelectedGameplayRuleSourceResponse {
  ReadSelectedGameplayRuleSourceRequest request = 1;
  string complete_source_snapshot_json = 2;
  string complete_source_snapshot_digest = 3;
}
