syntax = "proto3";

package tcp_proxy.v1;

option java_package = "net.firedevops.firemud.tcpproxy.v1";
option java_multiple_files = true;

import "shared/v1/errors.proto";

// TcpProxyService defines internal-only gRPC endpoints used by the TCP Proxy and Game Session services.
//
// Directionality and ownership:
// - Ping is implemented and served by the TCP Proxy Service itself for operator tooling and tests.
// - NotifyDisconnect is implemented and served by the Game Session Service as an internal-only event sink
//   that the TCP Proxy calls when Telnet connections close.
//
// Even though both RPCs live on the same logical TcpProxyService definition for schema/versioning purposes,
// they are hosted by different microservices. Callers must treat Ping and NotifyDisconnect as separate
// deployment targets following the ownership rules described in the TCP Proxy and Game Session design docs.
//
// These RPCs are not exposed through Spring Cloud Gateway and are intended for use by backend services and tooling only.
service TcpProxyService {
  // Simple connectivity check used by operators and tests.
  rpc Ping(PingRequest) returns (PingResponse);

  // Emits a best-effort, at-least-once lifecycle event whenever a Telnet
  // connection closes.
  //
  // Semantics and failure expectations:
  // - Events may be delivered more than once; the Game Session Service must treat them as idempotent.
  // - The primary idempotency key is {proxy_connection_id, disconnect_sequence}.
  // - session_id and tenant_id may be omitted when a client does not provide a SESSION envelope.
  // - The proxy does not buffer or replay gameplay commands; it only signals
  //   disconnects. Command queues remain owned by Game Session and Redis.
  // - Transport-level failures surface as standard gRPC statuses; logical
  //   failures are reported via the ErrorDetail in NotifyDisconnectResponse.
  // - Lost or delayed events must not cause stuck or "ghost" sessions: Game Session is responsible for
  //   independently detecting liveness via its own mechanisms (for example, WebSocket/TCP close and Redis
  //   timeouts). In the worst case, losing a NotifyDisconnect should only slow down cleanup, not leave
  //   players incorrectly logged in or unable to resume.
  rpc NotifyDisconnect(NotifyDisconnectRequest) returns (NotifyDisconnectResponse);
}

message PingRequest {}

message PingResponse {
  string message = 1;
}

// Identifies a Telnet connection that has closed, along with enough context for the Game Session Service
// to treat the signal as an advisory hint.
message NotifyDisconnectRequest {
  // Optional, client-provided SESSION envelope values (when present on the Telnet connection).
  // These are advisory only; Game Session must validate any tenant/session claims against its own state.
  //
  // session_id is kept for backwards compatibility with earlier implementations; in the target
  // gameplay architecture this value corresponds to a game instance identifier.
  string session_id = 1;
  string tenant_id = 2;

  // Required, server-generated identifier for the Telnet connection. This value is generated by the TCP Proxy
  // on accept and is propagated to the Gateway/Game Session layer as a WebSocket handshake header
  // (for example, X-Proxy-Connection-Id) so Game Session can associate it with an authenticated session.
  string proxy_connection_id = 3;

  // Required, monotonically increasing sequence number scoped to proxy_connection_id. This allows Game Session
  // to deduplicate at-least-once delivery (including retries and out-of-order arrivals).
  uint64 disconnect_sequence = 4;

  // Optional, explicit game instance identifier. When present, consumers should prefer this over session_id.
  // This is the canonical identifier carried by the Telnet SESSION envelope in the target-state edge contract.
  string game_instance_id = 5;
}

// Error is empty on success. When populated, it contains a logical failure
// (for example, unknown session) while the transport status remains OK.
message NotifyDisconnectResponse {
  shared.v1.ErrorDetail error = 1;
}
