syntax = "proto3";

package account.v1;

import "shared/v1/errors.proto";
import "shared/v1/player_execution_context.proto";

option java_package = "net.firedevops.firemud.account.v1";
option java_multiple_files = true;

service AccountService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  // Exact original Game Session mTLS caller; lifecycle disposal only, never credential recovery.
  rpc RetireInitialGameplayLogin(RetireInitialGameplayLoginRequest) returns (RetireInitialGameplayLoginResponse);
  rpc RequestEmailLoginOtp(RequestEmailLoginOtpRequest) returns (RequestEmailLoginOtpResponse);
  rpc VerifyEmailLoginOtp(VerifyEmailLoginOtpRequest) returns (AuthenticateResponse);
  rpc GetTenantMembershipForRuntime(GetTenantMembershipForRuntimeRequest) returns (GetTenantMembershipForRuntimeResponse);
  rpc GetRealmAccessGrantForRuntime(GetRealmAccessGrantForRuntimeRequest) returns (GetRealmAccessGrantForRuntimeResponse);
  rpc GetTenantEntitlementsForRuntime(GetTenantEntitlementsForRuntimeRequest) returns (GetTenantEntitlementsForRuntimeResponse);
  rpc IssueDirectTextConnectScope(IssueDirectTextConnectScopeRequest) returns (IssueDirectTextConnectScopeResponse);
  rpc JoinPublicProductionMembership(JoinPublicProductionMembershipRequest) returns (JoinPublicProductionMembershipResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc ListPresenceVisibilityPolicies(ListPresenceVisibilityPoliciesRequest)
      returns (ListPresenceVisibilityPoliciesResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ExportAccount(ExportAccountRequest) returns (ExportAccountResponse);
  rpc ExportTenantData(ExportTenantDataRequest) returns (ExportTenantDataResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc CompletePasswordReset(CompletePasswordResetRequest) returns (CompletePasswordResetResponse);
  rpc LinkExternalAccount(LinkExternalAccountRequest) returns (LinkExternalAccountResponse);
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (RequestEmailVerificationResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
}

// Game Session supplies its authenticated, transport-local player context and
// exact catalog/pointer evidence. Account re-resolves the target before issuance.
message IssueDirectTextConnectScopeRequest {
  shared.v1.PlayerExecutionContext player_context = 1;
  string tenant_id = 2;
  string world_slug = 3;
  string realm_slug = 4;
  string realm_id = 5;
  string playable_state_namespace_id = 6;
  string playable_state_scope = 7;
  string game_instance_id = 8;
  int64 catalog_revision = 9;
  int64 pointer_version = 10;
}

message IssueDirectTextConnectScopeResponse {
  string connect_scope_id = 1;
  string connect_scope_expires_at = 2;
  shared.v1.ErrorDetail error = 3;
  // Account's immutable evaluation time from the exact retained scope snapshot.
  string evaluated_at = 4;
}

message JoinPublicProductionMembershipRequest {
  shared.v1.PlayerExecutionContext player_context = 1;
  string connect_scope_id = 2;
  string request_id = 3;
}

message JoinPublicProductionMembershipResponse {
  bool success = 1;
  string outcome_code = 2;
  string account_id = 3;
  string tenant_id = 4;
  string membership_id = 5;
  uint64 membership_version = 6;
  uint64 membership_authority_generation = 7;
  bool replayed = 8;
  shared.v1.ErrorDetail error = 9;
}

// Empty request used to verify that the service is reachable.
message PingRequest {}

// Basic ping response containing a greeting and optional error details.
message PingResponse {
  // Message describing the current status of the service.
  string message = 1;
  // Populated on application-level failure conditions.
  shared.v1.ErrorDetail error = 2;
}

// Parameters required to register a new account.
message CreateAccountRequest {
  reserved 1;
  reserved "tenant_id";
  // Desired username for login and display.
  string username = 2;
  // Email address used for notifications and password recovery.
  string email = 3;
  // Raw password that the server hashes before storage.
  string password = 4;
}

// Result of a CreateAccount call.
message CreateAccountResponse {
  // Canonical non-nil Account UUID of the newly created account.
  string account_id = 1;
  // Details about why the creation failed, if applicable.
  shared.v1.ErrorDetail error = 2;
}

message InitialGameplayLoginTokenWitness {
  string token_jti = 1;
  string token_sha256 = 2;
  int64 token_generation = 3;
  int64 issuance_fence = 4;
}

message RetireInitialGameplayLoginRequest {
  string request_id = 1;
  string caller_context_id = 2;
  // Optional, but if present all fields must match Account's original stored identity.
  InitialGameplayLoginTokenWitness token_witness = 3;
}

enum InitialGameplayLoginDisposalDisposition {
  INITIAL_GAMEPLAY_LOGIN_DISPOSAL_DISPOSITION_UNSPECIFIED = 0;
  INITIAL_GAMEPLAY_LOGIN_DISPOSAL_DISPOSITION_PENDING = 1;
  INITIAL_GAMEPLAY_LOGIN_DISPOSAL_DISPOSITION_RETIRED = 2;
  // No registry-bound/exposed usable issuance exists or can later be created for this attempt.
  // This does not claim that transient token bytes were never signed.
  INITIAL_GAMEPLAY_LOGIN_DISPOSAL_DISPOSITION_NO_TOKEN = 3;
}

enum InitialGameplayLoginDisposalProofKind {
  INITIAL_GAMEPLAY_LOGIN_DISPOSAL_PROOF_KIND_UNSPECIFIED = 0;
  INITIAL_GAMEPLAY_LOGIN_DISPOSAL_PROOF_KIND_PHYSICAL_TOKEN_DENIAL = 1;
  INITIAL_GAMEPLAY_LOGIN_DISPOSAL_PROOF_KIND_NO_ISSUANCE_BINDING = 2;
}

message RetireInitialGameplayLoginResponse {
  string request_id = 1;
  string caller_context_id = 2;
  string disposal_operation_id = 3;
  InitialGameplayLoginDisposalDisposition disposition = 4;
  // PENDING uses UNSPECIFIED; each terminal disposition requires its exact proof variant.
  InitialGameplayLoginDisposalProofKind proof_kind = 5;
}

message AuthenticateRequest {
  reserved 1;
  reserved "tenant_id";
  reserved 2;
  reserved "username";
  string password = 3;
  string email = 4;
  string request_id = 5;
  GameplayLoginSourceContext source_context = 6;
}

// Credential-bearing LOGIN accepts only the authenticated TCP Proxy branch.
// FIRST_PARTY_WEB remains bootstrap-backed and cannot present credentials here.
enum GameplayLoginTransportClass {
  GAMEPLAY_LOGIN_TRANSPORT_CLASS_UNSPECIFIED = 0;
  GAMEPLAY_LOGIN_TRANSPORT_CLASS_TRUSTED_TCP_PROXY = 1;
  GAMEPLAY_LOGIN_TRANSPORT_CLASS_FIRST_PARTY_WEB = 2;
}

message GameplayLoginSourceContext {
  string caller_context_id = 1;
  string canonical_client_address = 2;
  GameplayLoginTransportClass transport_class = 3;
}

message AuthenticateResponse {
  string auth_token = 1;
  string account_id = 2;
  shared.v1.ErrorDetail error = 3;
  string request_id = 4;
  string caller_context_id = 5;
  string token_jti = 6;
  string token_sha256 = 7;
  string token_profile = 8;
  int64 issued_at_epoch_seconds = 9;
  int64 not_before_epoch_seconds = 10;
  int64 expires_at_epoch_seconds = 11;
  string token_generation = 12;
  string issuance_fence = 13;
  bytes authority_tuple_canonical_json = 14;
  bytes outbox_checkpoints_canonical_json = 15;
  bytes outbox_source_event_evidence_canonical_json = 16;
}

message RequestEmailLoginOtpRequest {
  reserved 1;
  reserved "tenant_id";
  string email = 2;
}

message RequestEmailLoginOtpResponse {
  bool accepted = 1;
  shared.v1.ErrorDetail error = 2;
}

message VerifyEmailLoginOtpRequest {
  reserved 1;
  reserved "tenant_id";
  string email = 2;
  string code = 3;
}

message GetTenantMembershipForRuntimeRequest {
  string account_id = 1;
  string tenant_id = 2;
  string request_id = 3;
}

message GetTenantMembershipForRuntimeResponse {
  string account_id = 1;
  string tenant_id = 2;
  bool gameplay_admission_allowed = 3;
  uint64 membership_version = 4;
  string evaluated_at = 5;
  shared.v1.ErrorDetail error = 6;
  bool membership_exists = 7;
  string membership_lifecycle_state = 8;
  uint64 membership_authority_generation = 9;
}

message GetRealmAccessGrantForRuntimeRequest {
  string account_id = 1;
  string tenant_id = 2;
  string world_slug = 3;
  string realm_slug = 4;
  string request_id = 5;
}

message GetRealmAccessGrantForRuntimeResponse {
  string account_id = 1;
  string tenant_id = 2;
  string world_slug = 3;
  string realm_slug = 4;
  bool granted = 5;
  uint64 grant_version = 6;
  string evaluated_at = 7;
  shared.v1.ErrorDetail error = 8;
}

message GetTenantEntitlementsForRuntimeRequest {
  string tenant_id = 1;
  string request_id = 2;
}

message GetTenantEntitlementsForRuntimeResponse {
  string tenant_id = 1;
  bool gameplay_available = 2;
  uint64 entitlement_version = 3;
  uint64 tenant_billing_sequence = 4;
  string evaluated_at = 5;
  shared.v1.ErrorDetail error = 6;
  bool allow_public_join = 7;
}

message GetProfileRequest {
  string tenant_id = 1;
  string account_id = 2;
}

message GetProfileResponse {
  string profile_json = 1;
  shared.v1.ErrorDetail error = 2;
}

// Internal bounded bulk read used by Social Groups when projecting friend presence.
message ListPresenceVisibilityPoliciesRequest {
  string tenant_id = 1;
  repeated string account_ids = 2;
}

message PresenceVisibilityPolicyEntry {
  string account_id = 1;
  string policy = 2;
}

message ListPresenceVisibilityPoliciesResponse {
  repeated PresenceVisibilityPolicyEntry policies = 1;
  shared.v1.ErrorDetail error = 2;
}

message UpdateProfileRequest {
  string tenant_id = 1;
  string account_id = 2;
  string profile_json = 3;
}

message UpdateProfileResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message ExportAccountRequest {
  string account_id = 1;
}

message ExportAccountResponse {
  string account_json = 1;
  string profiles_json = 2;
  shared.v1.ErrorDetail error = 3;
}

message ExportTenantDataRequest {
  string tenant_id = 1;
  string account_id = 2;
}

message ExportTenantDataResponse {
  string tenant_id = 1;
  string account_json = 2;
  string profile_json = 3;
  shared.v1.ErrorDetail error = 4;
}

message DeleteAccountRequest {
  string account_id = 1;
}

message DeleteAccountResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message CompletePasswordResetRequest {
  string token = 1;
  string new_password = 2;
}

message CompletePasswordResetResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message LinkExternalAccountRequest {
  string tenant_id = 1;
  string account_id = 2;
  string provider = 3;
  string external_id = 4;
}

message LinkExternalAccountResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message RequestEmailVerificationRequest {
  string account_id = 1;
}

message RequestEmailVerificationResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}
