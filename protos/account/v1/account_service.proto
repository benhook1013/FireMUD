syntax = "proto3";

package account.v1;

import "shared/v1/errors.proto";

option java_package = "net.firedevops.firemud.account.v1";
option java_multiple_files = true;

service AccountService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc GetTenantMembershipForRuntime(GetTenantMembershipForRuntimeRequest) returns (GetTenantMembershipForRuntimeResponse);
  rpc GetTenantEntitlementsForRuntime(GetTenantEntitlementsForRuntimeRequest) returns (GetTenantEntitlementsForRuntimeResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ExportAccount(ExportAccountRequest) returns (ExportAccountResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc CompletePasswordReset(CompletePasswordResetRequest) returns (CompletePasswordResetResponse);
  rpc LinkExternalAccount(LinkExternalAccountRequest) returns (LinkExternalAccountResponse);
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (RequestEmailVerificationResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
}

// Empty request used to verify that the service is reachable.
message PingRequest {}

// Basic ping response containing a greeting and optional error details.
message PingResponse {
  // Message describing the current status of the service.
  string message = 1;
  // Populated on application-level failure conditions.
  shared.v1.ErrorDetail error = 2;
}

// Parameters required to register a new account.
message CreateAccountRequest {
  // Tenant that owns the new account.
  string tenant_id = 1;
  // Desired username for login and display.
  string username = 2;
  // Email address used for notifications and password recovery.
  string email = 3;
  // Raw password that the server hashes before storage.
  string password = 4;
}

// Result of a CreateAccount call.
message CreateAccountResponse {
  // Unique identifier of the newly created account.
  string account_id = 1;
  // Details about why the creation failed, if applicable.
  shared.v1.ErrorDetail error = 2;
}

message AuthenticateRequest {
  string tenant_id = 1;
  string username = 2;
  string password = 3;
  string otp = 4;
}

message AuthenticateResponse {
  string auth_token = 1;
  string account_id = 2;
  shared.v1.ErrorDetail error = 3;
}

message GetTenantMembershipForRuntimeRequest {
  string account_id = 1;
  string tenant_id = 2;
  string request_id = 3;
}

message GetTenantMembershipForRuntimeResponse {
  string account_id = 1;
  string tenant_id = 2;
  bool gameplay_admission_allowed = 3;
  uint64 membership_version = 4;
  string evaluated_at = 5;
  shared.v1.ErrorDetail error = 6;
}

message GetTenantEntitlementsForRuntimeRequest {
  string tenant_id = 1;
  string request_id = 2;
}

message GetTenantEntitlementsForRuntimeResponse {
  string tenant_id = 1;
  bool gameplay_available = 2;
  uint64 entitlement_version = 3;
  uint64 tenant_billing_sequence = 4;
  string evaluated_at = 5;
  shared.v1.ErrorDetail error = 6;
}

message GetProfileRequest {
  string tenant_id = 1;
  string account_id = 2;
}

message GetProfileResponse {
  string profile_json = 1;
  shared.v1.ErrorDetail error = 2;
}

message UpdateProfileRequest {
  string tenant_id = 1;
  string account_id = 2;
  string profile_json = 3;
}

message UpdateProfileResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message ExportAccountRequest {
  string tenant_id = 1;
  string account_id = 2;
}

message ExportAccountResponse {
  string account_json = 1;
  string profile_json = 2;
  shared.v1.ErrorDetail error = 3;
}

message DeleteAccountRequest {
  string tenant_id = 1;
  string account_id = 2;
}

message DeleteAccountResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message RequestPasswordResetRequest {
  string tenant_id = 1;
  string email = 2;
}

message RequestPasswordResetResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message CompletePasswordResetRequest {
  string tenant_id = 1;
  string token = 2;
  string new_password = 3;
}

message CompletePasswordResetResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message LinkExternalAccountRequest {
  string tenant_id = 1;
  string account_id = 2;
  string provider = 3;
  string external_id = 4;
}

message LinkExternalAccountResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message RequestEmailVerificationRequest {
  string tenant_id = 1;
  string account_id = 2;
}

message RequestEmailVerificationResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message VerifyEmailRequest {
  string tenant_id = 1;
  string token = 2;
}

message VerifyEmailResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}
