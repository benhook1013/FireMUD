syntax = "proto3";

package account.v1;

option java_package = "net.firedevops.firemud.account.v1";
option java_multiple_files = true;

// Private, read-only same-namespace Game Session workload boundary. No key selector, signing,
// registry, rotation/readiness-plan, or admission authority is accepted or returned.
service AccountPublicJwksReadService {
  rpc GetCurrentPublicJwks(GetCurrentAccountPublicJwksRequest)
      returns (GetCurrentAccountPublicJwksResponse);
}

message GetCurrentAccountPublicJwksRequest {
  int32 schema_version = 1;
}

// Exact identity derived by Account's protected receipt-backed current publication source.
message AccountPublicJwksSourceIdentity {
  string environment_id = 1;
  string cluster_id = 2;
  string cluster_incarnation_uid = 3;
  string namespace = 4;
  string namespace_uid = 5;
  string config_map_uid = 6;
  string binding_revision = 7;
  string api_server_origin = 8;
  string serving_ca_sha256 = 9;
}

message GetCurrentAccountPublicJwksResponse {
  enum Disposition {
    UNSPECIFIED = 0;
    SNAPSHOT = 1;
    PREPARED_DENY = 2;
  }
  int32 schema_version = 1;
  AccountPublicJwksSourceIdentity source_identity = 2;
  bytes public_jwks = 3;
  Disposition disposition = 4;
  // Presence is mandatory on SNAPSHOT and forbidden on PREPARED_DENY.
  optional bool committed_recovery_eligible = 5;
}
