syntax = "proto3";

package account.v1;

option java_package = "net.firedevops.firemud.account.v1";
option java_multiple_files = true;

// Standalone exact held-COMMIT_ORDER read. It is intentionally not runtime-registered here.
service AccountDraftCommitOrderReadService {
  rpc ReadHeldOriginalCommitOrder(ReadHeldOriginalCommitOrderRequest)
      returns (ReadHeldOriginalCommitOrderResponse);
}

message ReadHeldOriginalCommitOrderRequest {
  int32 schema_version = 1;
  string target_namespace = 2;
  string read_request_id = 3;
  // Complete canonical original Account fence bytes; this is identity, not permission.
  bytes original_account_binding = 4;
}

enum HeldOriginalCommitOrderStatus {
  HELD_ORIGINAL_COMMIT_ORDER_STATUS_UNSPECIFIED = 0;
  HELD_ORIGINAL_COMMIT_ORDER_STATUS_HELD = 1;
}

message ReadHeldOriginalCommitOrderResponse {
  // The complete request tuple is echoed exactly. Only HELD is a successful response.
  int32 schema_version = 1;
  string target_namespace = 2;
  string read_request_id = 3;
  bytes original_account_binding = 4;
  HeldOriginalCommitOrderStatus status = 5;
}
