syntax = "proto3";

package account.v1;

option java_package = "net.firedevops.firemud.account.v1";
option java_multiple_files = true;

// Private Account owner read for exact same-namespace World Management over workload mTLS.
// Explicit eligibility source selection creates neither capacity nor player admission authority.
service AccountTenantOperationEntitlementReadService {
  rpc ReadTenantOperationEntitlement(ReadTenantOperationEntitlementRequest)
      returns (ReadTenantOperationEntitlementResponse);
}

// Repeated transport members must each have exactly one value. This preserves duplicate scalar
// occurrences for closed-schema validation instead of protobuf's singular last-value-wins parsing.
message ReadTenantOperationEntitlementRequest {
  repeated int32 schema_version = 1;
  repeated string target_namespace = 2;
  repeated string tenant_id = 3;
  repeated string request_id = 4;
  // Exactly PAID_HOSTING or NON_PAID_DEMO. No default, inference, or fallback.
  repeated string source_kind = 5;
}

message ReadTenantOperationEntitlementResponse {
  repeated ReadTenantOperationEntitlementRequest request = 1;
  // Exactly one existing strict canonical TENANT_OPERATION value, bounded to 64 KiB.
  // Its callerWorkload is derived from the authenticated peer, never request data.
  repeated bytes canonical_evidence = 2;
}
