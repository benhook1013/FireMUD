syntax = "proto3";
package account.v1;
option java_package = "net.firedevops.firemud.account.v1";
option java_multiple_files = true;

// Distinct immutable intake order. No original Draft/publication order or settlement is accepted.
service AccountGameLogicIntakeAuthorizationReadService {
  rpc ReadHeldGameLogicIntakeAuthorization(ReadHeldGameLogicIntakeAuthorizationRequest)
      returns (ReadHeldGameLogicIntakeAuthorizationResponse);
}
message ReadHeldGameLogicIntakeAuthorizationRequest {
  int32 schema_version = 1;
  string target_namespace = 2;
  string read_request_id = 3;
  bytes original_intake_authorization = 4;
  string intake_authorization_digest = 5;
}
message ReadHeldGameLogicIntakeAuthorizationResponse {
  ReadHeldGameLogicIntakeAuthorizationRequest request = 1;
  bool held = 2;
}
