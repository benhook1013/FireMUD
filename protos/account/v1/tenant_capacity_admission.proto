syntax = "proto3";
package account.v1;
option java_package = "net.firedevops.firemud.account.v1";
option java_multiple_files = true;

// Singleton repeated envelopes preserve multiplicity for the strict bounded codec.
message TenantCapacityShape {
  repeated int64 active_sessions = 1;
  repeated int64 concurrent_game_instances = 2;
  repeated int64 storage_bytes = 3;
}
// Exact PlayerExecutionContext content with strict singleton multiplicity preserved on this wire.
message TenantCapacityPlayerContext {
  repeated string account_id = 1;
  repeated string tenant_id = 2;
  repeated string playable_state_namespace_id = 3;
  repeated string game_instance_id = 4;
  repeated string character_id = 5;
  repeated string session_id = 6;
  repeated string realm_id = 7;
  repeated string request_id = 8;
  repeated string playable_state_scope = 9;
}
message TenantCapacityWorldContext {
  repeated string tenant_id = 1;
  repeated string operation_id = 2;
  repeated string lifecycle_id = 3;
  repeated string game_instance_id = 4;
  repeated string owner_id = 5;
  repeated int64 owner_fence = 6;
}
message TenantCapacityAdmissionAttempt {
  repeated string tenant_id = 1;
  repeated string request_id = 2;
  repeated string admission_id = 3;
  repeated string admission_attempt_id = 4;
  repeated int64 capacity_rearm_fence = 5;
  repeated string target_namespace = 6;
  // Exactly one typed alternative, never a caller-supplied workload identity.
  repeated TenantCapacityPlayerContext player_context = 7;
  repeated TenantCapacityWorldContext world_context = 8;
  repeated string operation = 9;
  repeated TenantCapacityShape prior_shape = 10;
  repeated TenantCapacityShape requested_shape = 11;
  // Exact existing Account canonical bundle; content parsing cannot register its authority.
  repeated bytes canonical_account_evidence = 12;
  repeated string mutation_digest = 13;
}
message CommitTenantCapacityAdmissionRequest {
  repeated TenantCapacityAdmissionAttempt attempt = 1;
  // Mandatory presence. Proto JSON is a canonical base-10 decimal string, not a JSON number.
  optional int64 capacity_delta = 2;
}
message TenantCapacityAdmissionCommitment {
  repeated string tenant_id = 1;
  repeated string request_id = 2;
  repeated string admission_id = 3;
  repeated string admission_attempt_id = 4;
  repeated int64 capacity_rearm_fence = 5;
  repeated string mutation_digest = 6;
  repeated string reservation_id = 7;
  repeated int64 reservation_fence = 8;
  repeated string expires_at = 9;
  repeated string state = 10;
  repeated string snapshot_identity = 11;
  repeated string evaluation_identity = 12;
}
message CommitTenantCapacityAdmissionResponse {
  repeated TenantCapacityAdmissionCommitment commitment = 1;
}
