syntax = "proto3";

package account.v1;

option java_package = "net.firedevops.firemud.account.v1";
option java_multiple_files = true;

// Owner-local issuer evidence handoffs only; this service is not wired for runtime use.
// Caller and response workload identities must both be verified from mTLS.
service IssuerAuthorityService {
  rpc ReadIssuerAuthorityForRuntime(ReadIssuerAuthorityForRuntimeRequest)
      returns (ReadIssuerAuthorityForRuntimeResponse);
  rpc CaptureIssuerProjectionForRuntime(CaptureIssuerProjectionForRuntimeRequest)
      returns (CaptureIssuerProjectionForRuntimeResponse);
  rpc AcknowledgeIssuerProjectionForRuntime(AcknowledgeIssuerProjectionForRuntimeRequest)
      returns (AcknowledgeIssuerProjectionForRuntimeResponse);
}

message ReadIssuerAuthorityForRuntimeRequest {
  string issuer_id = 1;
  string request_id = 2;
  // Omit for current source evidence; when present, must be canonical positive.
  optional string requested_outbox_sequence = 3;
}

message IssuerAuthoritySourceSnapshot {
  string issuer_id = 1;
  string source_scope = 2;
  string outbox_stream_key = 3;
  string issuer_auth_generation = 4;
  string source_version = 5;
  string outbox_sequence = 6;
  // Must be absent at sequence zero, present and exact at positive sequence.
  optional string latest_event_canonical_json = 7;
}

message ReadIssuerAuthorityForRuntimeResponse {
  string schema_version = 1;
  string target_namespace = 2;
  string request_id = 3;
  IssuerAuthoritySourceSnapshot source_snapshot = 4;
  // Present exactly when the request selected a positive historical sequence.
  optional string requested_event_canonical_json = 5;
}

message CaptureIssuerProjectionForRuntimeRequest {
  string issuer_id = 1;
  string request_id = 2;
}

message CaptureIssuerProjectionForRuntimeResponse {
  string schema_version = 1;
  string target_namespace = 2;
  string operation_id = 3;
  string request_id = 4;
  string issuer_id = 5;
  string caller_workload_identity = 6;
  string projection_key = 7;
  uint32 request_digest_version = 8;
  string request_digest = 9;
  IssuerAuthoritySourceSnapshot captured_source_snapshot = 10;
}

message AcknowledgeIssuerProjectionForRuntimeRequest {
  string issuer_id = 1;
  string capture_operation_id = 2;
  string capture_request_id = 3;
  uint32 capture_request_digest_version = 4;
  string capture_request_digest = 5;
  string projection_key = 6;
  string installed_projection_json = 7;
}

message AcknowledgeIssuerProjectionForRuntimeResponse {
  string schema_version = 1;
  string target_namespace = 2;
  string acknowledgment_id = 3;
  string issuer_id = 4;
  string caller_workload_identity = 5;
  string projection_key = 6;
  string capture_operation_id = 7;
  string capture_request_id = 8;
  uint32 capture_request_digest_version = 9;
  string capture_request_digest = 10;
  uint32 request_digest_version = 11;
  string request_digest = 12;
  string installed_projection_json = 13;
  string installed_projection_sha256 = 14;
}
