syntax = "proto3";

package account.v1;

import "game-session/v1/canonical_gameplay_admission_decision_read.proto";

option java_package = "net.firedevops.firemud.account.v1";
option java_multiple_files = true;

// Manually composed Account read for exact same-namespace Game Session over workload mTLS.
// This point-in-time PLAYER_ADMISSION value supplies neither capacity nor a later World hold.
service AccountPlayerAdmissionEntitlementReadService {
  rpc ReadPlayerAdmissionEntitlement(ReadPlayerAdmissionEntitlementRequest)
      returns (ReadPlayerAdmissionEntitlementResponse);
}

// Comparison selectors only. Account verifies the credential subject and retained scope, and
// selects the current paid/demo source itself. Repeated members each require exactly one value.
message PlayerAdmissionEntitlementReadSelectors {
  repeated uint32 schema_version = 1;
  repeated game_session.v1.ResolvePublishedRealmAdmissionTargetRequest target = 2;
  repeated string connect_scope_id = 3;
}

// Credential travels only on this exact trusted mTLS method and must never be logged or persisted.
message ReadPlayerAdmissionEntitlementRequest {
  repeated PlayerAdmissionEntitlementReadSelectors selectors = 1;
  repeated string initial_login_jwt = 2;
}

// Echo only selectors, never the presented credential. Evidence is exact bounded RFC 8785 UTF-8.
message ReadPlayerAdmissionEntitlementResponse {
  repeated PlayerAdmissionEntitlementReadSelectors request = 1;
  repeated bytes canonical_evidence = 2;
}
