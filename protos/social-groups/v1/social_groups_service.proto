syntax = "proto3";

package social_groups.v1;

import "shared/v1/errors.proto";
option java_package = "net.firedevops.firemud.socialgroups.v1";
option java_multiple_files = true;

service SocialGroupsService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc CreateGuild(CreateGuildRequest) returns (CreateGuildResponse);
  rpc AddFriend(AddFriendRequest) returns (AddFriendResponse);
  rpc ListFriendPresence(ListFriendPresenceRequest) returns (ListFriendPresenceResponse);
  rpc SendMail(SendMailRequest) returns (SendMailResponse);
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}

message SendMessageRequest {
  string tenant_id = 1;
  string sender_id = 2;
  string channel_id = 3;
  string content = 4;
  ChatType type = 5;
  string recipient_id = 6;
  string guild_id = 7;
  string city_id = 8;
}

message SendMessageResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message CreateGuildRequest {
  string tenant_id = 1;
  string owner_account_id = 2;
  string name = 3;
}

message CreateGuildResponse {
  string guild_id = 1;
  shared.v1.ErrorDetail error = 2;
}

message AddFriendRequest {
  string tenant_id = 1;
  string account_id = 2;
  string friend_account_id = 3;
  bool account_level = 4;
}

message AddFriendResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListFriendPresenceRequest {
  string tenant_id = 1;
  string account_id = 2;
}

enum FriendPresenceActivityState {
  FRIEND_PRESENCE_ACTIVITY_STATE_UNSPECIFIED = 0;
  FRIEND_PRESENCE_ACTIVITY_STATE_ACTIVE = 1;
  FRIEND_PRESENCE_ACTIVITY_STATE_AUTO_AFK = 2;
  FRIEND_PRESENCE_ACTIVITY_STATE_EXPLICIT_AFK = 3;
}

message FriendPresenceEntry {
  string friend_account_id = 1;
  bool online = 2;
  string game_instance_id = 3;
  string character_id = 4;
  string character_name = 5;
  FriendPresenceActivityState activity_state = 6;
}

message ListFriendPresenceResponse {
  repeated FriendPresenceEntry presences = 1;
  shared.v1.ErrorDetail error = 2;
}

message SendMailRequest {
  string tenant_id = 1;
  string sender_account_id = 2;
  string recipient_account_id = 3;
  string subject = 4;
  string content = 5;
}

message SendMailResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

enum ChatType {
  CHAT_TYPE_UNSPECIFIED = 0;
  CHAT_TYPE_SAY = 1;
  CHAT_TYPE_TELL = 2;
  CHAT_TYPE_WHISPER = 3;
  CHAT_TYPE_GUILD = 4;
  CHAT_TYPE_CITY = 5;
  CHAT_TYPE_ACCOUNT = 6;
}
