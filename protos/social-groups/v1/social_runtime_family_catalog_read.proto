syntax = "proto3";

package social_groups.v1;

option java_package = "net.firedevops.firemud.socialgroups.v1";
option java_multiple_files = true;

// Manually composed only. As-of Social-local schema/classification evidence, never a FRESH
// manifest, owner registry, row inventory, materialization or admission result.
service SocialRuntimeFamilyCatalogReadService {
  rpc ReadSocialRuntimeFamilyCatalog(ReadSocialRuntimeFamilyCatalogRequest)
      returns (ReadSocialRuntimeFamilyCatalogResponse);
}

message ReadSocialRuntimeFamilyCatalogRequest {
  // Exactly one value; repeated so duplicate wire values remain observable.
  repeated bytes canonical_request_bytes = 1;
}

message ReadSocialRuntimeFamilyCatalogResponse {
  // Exactly one complete closed frame. No partial, empty or paginated success.
  repeated bytes canonical_response_bytes = 1;
}
