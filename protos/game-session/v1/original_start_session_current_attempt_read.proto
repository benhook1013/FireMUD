syntax = "proto3";

package game_session.v1;

import "google/protobuf/timestamp.proto";

option java_package = "net.firedevops.firemud.gamesession.v1";
option java_multiple_files = true;

// Unregistered, observation-only read of one exact live original StartSession owner attempt.
// It exposes no claimant credential and grants no mutation, renewal, redemption, or admission authority.
service OriginalStartSessionCurrentAttemptReadService {
  rpc ReadOriginalStartSessionCurrentAttempt(
      ReadOriginalStartSessionCurrentAttemptRequest)
      returns (ReadOriginalStartSessionCurrentAttemptResponse);
}

message ReadOriginalStartSessionCurrentAttemptRequest {
  int32 schema_version = 1;
  // Fresh correlation UUID for this observation; it is not a durable mutation identity.
  string read_request_id = 2;
  string target_namespace = 3;
  bytes canonical_post_authorization_tuple = 4;
  string expected_owner_attempt_id = 5;
  string expected_owner_mutation_id = 6;
  int64 expected_owner_fence = 7;
}

message ReadOriginalStartSessionCurrentAttemptResponse {
  ReadOriginalStartSessionCurrentAttemptRequest request = 1;
  string phase_state = 2;
  google.protobuf.Timestamp original_lease_expires_at = 3;
  bytes account_redemption_projection = 4;
  // Raw lowercase SHA-256 of account_redemption_projection.
  string account_redemption_projection_digest = 5;
}
