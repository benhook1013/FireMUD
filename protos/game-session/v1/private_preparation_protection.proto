syntax = "proto3";

package game_session.v1;

option java_package = "net.firedevops.firemud.gamesession.v1";
option java_multiple_files = true;
option java_outer_classname = "PrivatePreparationProtectionProto";

// Unregistered World-only source protection. No actor, expiry extension, release or admission.
service PrivatePreparationProtectionService {
  rpc AcquirePrivatePreparationProtection(AcquirePrivatePreparationProtectionRequest)
      returns (PrivatePreparationProtectionResponse);
  rpc ReadCurrentPrivatePreparationProtection(ReadCurrentPrivatePreparationProtectionRequest)
      returns (PrivatePreparationProtectionResponse);
}

message AcquirePrivatePreparationProtectionRequest {
  bytes canonical_evidence = 1;
}

message ReadCurrentPrivatePreparationProtectionRequest {
  bytes canonical_evidence = 1;
}

message PrivatePreparationProtectionResponse {
  bytes canonical_evidence = 1;
}
