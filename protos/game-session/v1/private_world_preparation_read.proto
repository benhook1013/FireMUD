syntax = "proto3";

package game_session.v1;

option java_package = "net.firedevops.firemud.gamesession.v1";
option java_multiple_files = true;
option java_outer_classname = "PrivateWorldPreparationReadProto";

// Distinct, manually composed World-only source read. No runtime allocation or admission.
service PrivateWorldPreparationReadService {
  rpc ReadPrivateWorldPreparation(ReadPrivateWorldPreparationRequest)
      returns (ReadPrivateWorldPreparationResponse);
  // Exact retained publication selector; still no materialization or actor authority.
  rpc ReadPrivateWorldPreparationBuild(ReadPrivateWorldPreparationRequest)
      returns (ReadPrivateWorldPreparationBuildResponse);
}

message ReadPrivateWorldPreparationRequest {
  bytes canonical_evidence = 1;
}

// Complete current preparation/source/allocated-target facts; absence is a refusal, never success.
message ReadPrivateWorldPreparationResponse {
  bytes canonical_evidence = 1;
}

message ReadPrivateWorldPreparationBuildResponse {
  bytes canonical_evidence = 1;
}
