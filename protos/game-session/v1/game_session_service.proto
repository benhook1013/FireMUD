syntax = "proto3";

package game_session.v1;

import "shared/v1/errors.proto";

option java_package = "net.firedevops.firemud.gamesession.v1";
option java_multiple_files = true;

service GameSessionService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  rpc RestartSession(RestartSessionRequest) returns (RestartSessionResponse);
  rpc EnqueueCommand(EnqueueCommandRequest) returns (EnqueueCommandResponse);
  rpc QueryState(QueryStateRequest) returns (QueryStateResponse);
  rpc QueryAccountPresence(QueryAccountPresenceRequest) returns (QueryAccountPresenceResponse);
  rpc ListGameplayWorlds(ListGameplayWorldsRequest) returns (ListGameplayWorldsResponse);
  rpc ListGameplayRealms(ListGameplayRealmsRequest) returns (ListGameplayRealmsResponse);
  rpc GetAdmissionPointer(GetAdmissionPointerRequest) returns (GetAdmissionPointerResponse);
  rpc ToggleFeatureFlag(ToggleFeatureFlagRequest) returns (ToggleFeatureFlagResponse);
  // Pause tick execution so a consistent pg_dump can be taken.
  rpc PauseTicks(PauseTicksRequest) returns (PauseTicksResponse);
  // Resume tick execution after a backup.
  rpc ResumeTicks(ResumeTicksRequest) returns (ResumeTicksResponse);
  // Report whether ticks are currently paused.
  rpc GetTickStatus(GetTickStatusRequest) returns (GetTickStatusResponse);
}

// Operator/control-plane surface for pinning and rollback of script patch versions,
// plus scoped tick pause/resume used for rollback safety.
service GameSessionControlPlaneService {
  rpc GetPinnedScriptPatchVersion(GetPinnedScriptPatchVersionRequest)
      returns (GetPinnedScriptPatchVersionResponse);
  rpc ListAdmissionPointers(ListAdmissionPointersRequest)
      returns (ListAdmissionPointersResponse);
  rpc SetAdmissionPointer(SetAdmissionPointerRequest)
      returns (SetAdmissionPointerResponse);
  rpc SetPinnedScriptPatchVersion(SetPinnedScriptPatchVersionRequest)
      returns (SetPinnedScriptPatchVersionResponse);
  rpc RollbackScriptPatchVersion(RollbackScriptPatchVersionRequest)
      returns (RollbackScriptPatchVersionResponse);

  rpc PauseTicksForScope(PauseTicksForScopeRequest) returns (PauseTicksForScopeResponse);
  rpc ResumeTicksForScope(ResumeTicksForScopeRequest) returns (ResumeTicksForScopeResponse);
  rpc PurgeQueuedTickCommandsForScriptPatch(PurgeQueuedTickCommandsForScriptPatchRequest)
      returns (PurgeQueuedTickCommandsForScriptPatchResponse);
  rpc PurgeQueuedTickCommandsForPluginVersion(PurgeQueuedTickCommandsForPluginVersionRequest)
      returns (PurgeQueuedTickCommandsForPluginVersionResponse);
}

message StartSessionRequest {
  string tenant_id = 1;
  string game_template_id = 2;
  string control_plane_request_id = 3;
  string client_ip = 4;
  string owner_account_id = 6;
}

message StartSessionResponse {
  string session_id = 1;
  shared.v1.ErrorDetail error = 2;
}

message StopSessionRequest {
  string session_id = 1;
}

message StopSessionResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message RestartSessionRequest {
  string session_id = 1;
}

message RestartSessionResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message EnqueueCommandRequest {
  string session_id = 1;
  string command = 2;
  bool requires_solo_tick = 3;
}

message EnqueueCommandResponse {
  bool accepted = 1;
  shared.v1.ErrorDetail error = 2;
}

message QueryStateRequest {
  string session_id = 1;
}

message QueryStateResponse {
  string state_json = 1;
  shared.v1.ErrorDetail error = 2;
}

message QueryAccountPresenceRequest {
  string tenant_id = 1;
  string viewer_account_id = 2;
  repeated string account_ids = 3;
}

enum AccountPresenceActivityState {
  ACCOUNT_PRESENCE_ACTIVITY_STATE_UNSPECIFIED = 0;
  ACCOUNT_PRESENCE_ACTIVITY_STATE_ACTIVE = 1;
  ACCOUNT_PRESENCE_ACTIVITY_STATE_AUTO_AFK = 2;
  ACCOUNT_PRESENCE_ACTIVITY_STATE_EXPLICIT_AFK = 3;
}

enum AccountPresenceVisibilityPolicy {
  ACCOUNT_PRESENCE_VISIBILITY_POLICY_UNSPECIFIED = 0;
  ACCOUNT_PRESENCE_VISIBILITY_POLICY_PUBLIC = 1;
  ACCOUNT_PRESENCE_VISIBILITY_POLICY_FRIENDS_ONLY = 2;
  ACCOUNT_PRESENCE_VISIBILITY_POLICY_PRIVATE = 3;
  ACCOUNT_PRESENCE_VISIBILITY_POLICY_HIDDEN_STAFF = 4;
}

message AccountPresenceEntry {
  string account_id = 1;
  bool online = 2;
  string game_instance_id = 3;
  string character_id = 4;
  string character_name = 5;
  AccountPresenceActivityState activity_state = 6;
  int64 last_seen_at_ms = 7;
  AccountPresenceVisibilityPolicy visibility_policy = 8;
  string world_slug = 9;
  string world_display_name = 10;
  string realm_slug = 11;
  string realm_display_name = 12;
}

message QueryAccountPresenceResponse {
  repeated AccountPresenceEntry presences = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListGameplayWorldsRequest {}

message GameplayWorld {
  string world_slug = 1;
  string display_name = 2;
}

message ListGameplayWorldsResponse {
  repeated GameplayWorld worlds = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListGameplayRealmsRequest {
  string world_slug = 1;
}

message GameplayRealm {
  string world_slug = 1;
  string realm_slug = 2;
  string display_name = 3;
  string tenant_id = 4;
  string game_instance_id = 5;
  int64 pointer_version = 6;
  bool requires_character_selection = 7;
  string state_scope = 8;
  string character_creation_policy = 9;
}

message ListGameplayRealmsResponse {
  repeated GameplayRealm realms = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetAdmissionPointerRequest {
  string world_slug = 1;
  string realm_slug = 2;
}

message GameplayAdmissionPointer {
  string world_slug = 1;
  string world_display_name = 2;
  string realm_slug = 3;
  string realm_display_name = 4;
  string tenant_id = 5;
  string game_instance_id = 6;
  int64 pointer_version = 7;
  bool requires_character_selection = 8;
  string state_scope = 9;
  string character_creation_policy = 10;
}

message GetAdmissionPointerResponse {
  GameplayAdmissionPointer admission_pointer = 1;
  shared.v1.ErrorDetail error = 2;
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}

message ToggleFeatureFlagRequest {
  string tenant_id = 1;
  string name = 2;
  bool enabled = 3;
}

message ToggleFeatureFlagResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

// Administrative request to pause tick execution.
message PauseTicksRequest {
  string reason = 1;
}

message PauseTicksResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

// Resume ticks after a backup has started.
message ResumeTicksRequest {
  string reason = 1;
}

message ResumeTicksResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetTickStatusRequest {}

enum TickStatus {
  TICK_STATUS_UNSPECIFIED = 0;
  TICK_STATUS_RUNNING = 1;
  TICK_STATUS_PAUSED = 2;
}

message GetTickStatusResponse {
  TickStatus status = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetPinnedScriptPatchVersionRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
}

message GetPinnedScriptPatchVersionResponse {
  string pinned_script_patch_version = 1;
  int64 pinned_at_ms = 2;
  string pinned_by = 3;
  shared.v1.ErrorDetail error = 4;
}

message AdmissionPointerControlPlaneEntry {
  string world_slug = 1;
  string world_display_name = 2;
  string realm_slug = 3;
  string realm_display_name = 4;
  string tenant_id = 5;
  string game_instance_id = 6;
  int64 pointer_version = 7;
  bool visible = 8;
  bool requires_character_selection = 9;
  string state_scope = 10;
  string character_creation_policy = 11;
  string actor_principal = 12;
  string reason = 13;
  string control_plane_request_id = 14;
  int64 occurred_at_ms = 15;
}

message ListAdmissionPointersRequest {}

message ListAdmissionPointersResponse {
  repeated AdmissionPointerControlPlaneEntry pointers = 1;
  shared.v1.ErrorDetail error = 2;
}

message SetAdmissionPointerRequest {
  string world_slug = 1;
  string world_display_name = 2;
  string realm_slug = 3;
  string realm_display_name = 4;
  string tenant_id = 5;
  string game_instance_id = 6;
  bool visible = 7;
  bool requires_character_selection = 8;
  string state_scope = 9;
  string character_creation_policy = 10;
  string actor_principal = 11;
  string reason = 12;
  string control_plane_request_id = 13;
}

message SetAdmissionPointerResponse {
  AdmissionPointerControlPlaneEntry pointer = 1;
  shared.v1.ErrorDetail error = 2;
}

message SetPinnedScriptPatchVersionRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string target_script_patch_version = 3;
  string control_plane_request_id = 4;
  string actor_principal = 5;
  string reason = 6;
}

message SetPinnedScriptPatchVersionResponse {
  string previous_script_patch_version = 1;
  string pinned_script_patch_version = 2;
  string control_plane_request_id = 3;
  shared.v1.ErrorDetail error = 4;
}

message RollbackScriptPatchVersionRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string target_script_patch_version = 3;
  string control_plane_request_id = 4;
  string actor_principal = 5;
  string reason = 6;
}

message RollbackScriptPatchVersionResponse {
  string previous_script_patch_version = 1;
  string pinned_script_patch_version = 2;
  string control_plane_request_id = 3;
  shared.v1.ErrorDetail error = 4;
}

message PauseTicksForScopeRequest {
  // Scope rules (normative):
  // - tenant_id is required.
  // - Exactly one scope must be set via the `scope` oneof.
  // - region_id is the canonical tick scope (preferred).
  // - game_instance_id is allowed when tooling is instance-scoped.
  string tenant_id = 1;
  oneof scope {
    string game_instance_id = 2;
    string region_id = 3;
  }
  string control_plane_request_id = 4;
  string actor_principal = 5;
  string reason = 6;
}

message PauseTicksForScopeResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message ResumeTicksForScopeRequest {
  // Scope rules (normative):
  // - tenant_id is required.
  // - Exactly one scope must be set via the `scope` oneof.
  // - region_id is the canonical tick scope (preferred).
  // - game_instance_id is allowed when tooling is instance-scoped.
  string tenant_id = 1;
  oneof scope {
    string game_instance_id = 2;
    string region_id = 3;
  }
  string control_plane_request_id = 4;
  string actor_principal = 5;
  string reason = 6;
}

message ResumeTicksForScopeResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message PurgeQueuedTickCommandsForScriptPatchRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string region_id = 3;
  string script_patch_version = 4;
  string control_plane_request_id = 5;
  string actor_principal = 6;
  string reason = 7;
}

message PurgeQueuedTickCommandsForScriptPatchResponse {
  int64 purged_count = 1;
  shared.v1.ErrorDetail error = 2;
}

message PurgeQueuedTickCommandsForPluginVersionRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string region_id = 3;
  string plugin_id = 4;
  string plugin_version_id = 5;
  string control_plane_request_id = 6;
  string actor_principal = 7;
  string reason = 8;
}

message PurgeQueuedTickCommandsForPluginVersionResponse {
  int64 purged_count = 1;
  shared.v1.ErrorDetail error = 2;
}
