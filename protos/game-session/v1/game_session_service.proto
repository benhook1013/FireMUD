syntax = "proto3";

package game_session.v1;

import "shared/v1/errors.proto";

option java_package = "net.firedevops.firemud.gamesession.v1";
option java_multiple_files = true;

service GameSessionService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  rpc RestartSession(RestartSessionRequest) returns (RestartSessionResponse);
  rpc EnqueueCommand(EnqueueCommandRequest) returns (EnqueueCommandResponse);
  rpc QueryState(QueryStateRequest) returns (QueryStateResponse);
  rpc QueryAccountPresence(QueryAccountPresenceRequest) returns (QueryAccountPresenceResponse);
  rpc ListGameplayWorlds(ListGameplayWorldsRequest) returns (ListGameplayWorldsResponse);
  rpc ListGameplayRealms(ListGameplayRealmsRequest) returns (ListGameplayRealmsResponse);
  rpc GetAdmissionPointer(GetAdmissionPointerRequest) returns (GetAdmissionPointerResponse);
  rpc ToggleFeatureFlag(ToggleFeatureFlagRequest) returns (ToggleFeatureFlagResponse);
  // Pause tick execution so a consistent pg_dump can be taken.
  rpc PauseTicks(PauseTicksRequest) returns (PauseTicksResponse);
  // Resume tick execution after a backup.
  rpc ResumeTicks(ResumeTicksRequest) returns (ResumeTicksResponse);
  // Report whether ticks are currently paused.
  rpc GetTickStatus(GetTickStatusRequest) returns (GetTickStatusResponse);
}

// Operator/control-plane surface for pinning and rollback of script patch versions,
// plus scoped tick pause/resume used for rollback safety.
service GameSessionControlPlaneService {
  rpc GetPinnedScriptPatchVersion(GetPinnedScriptPatchVersionRequest)
      returns (GetPinnedScriptPatchVersionResponse);
  rpc GetGameSessionPinConvergence(GetGameSessionPinConvergenceRequest)
      returns (GetGameSessionPinConvergenceResponse);
  rpc GetGameInstanceRuntimeState(GetGameInstanceRuntimeStateRequest)
      returns (GetGameInstanceRuntimeStateResponse);
  rpc ListAdmissionPointers(ListAdmissionPointersRequest)
      returns (ListAdmissionPointersResponse);
  rpc ListAdmissionPointerAudit(ListAdmissionPointerAuditRequest)
      returns (ListAdmissionPointerAuditResponse);
  rpc GetGameplayCommandStatus(GetGameplayCommandStatusRequest)
      returns (GetGameplayCommandStatusResponse);
  rpc GetRuntimeOwnershipStatus(GetRuntimeOwnershipStatusRequest)
      returns (GetRuntimeOwnershipStatusResponse);
  rpc SetAdmissionPointer(SetAdmissionPointerRequest)
      returns (SetAdmissionPointerResponse);
  rpc ExecutePreparedVersionCutover(ExecutePreparedVersionCutoverRequest)
      returns (ExecutePreparedVersionCutoverResponse);
  rpc SetPinnedScriptPatchVersion(SetPinnedScriptPatchVersionRequest)
      returns (SetPinnedScriptPatchVersionResponse);
  rpc RollbackScriptPatchVersion(RollbackScriptPatchVersionRequest)
      returns (RollbackScriptPatchVersionResponse);

  rpc PauseTicksForScope(PauseTicksForScopeRequest) returns (PauseTicksForScopeResponse);
  rpc ResumeTicksForScope(ResumeTicksForScopeRequest) returns (ResumeTicksForScopeResponse);
  rpc ValidateInstanceCutoverCompatibility(ValidateInstanceCutoverCompatibilityRequest)
      returns (ValidateInstanceCutoverCompatibilityResponse);
  rpc PrepareVersionUpgrade(PrepareVersionUpgradeRequest) returns (PrepareVersionUpgradeResponse);
  rpc GetPreparedVersionUpgrade(GetPreparedVersionUpgradeRequest)
      returns (GetPreparedVersionUpgradeResponse);
  rpc EnqueueAutomationCommandIfAbsent(EnqueueAutomationCommandIfAbsentRequest)
      returns (EnqueueAutomationCommandIfAbsentResponse);
  rpc PurgeQueuedTickCommandsForScriptPatch(PurgeQueuedTickCommandsForScriptPatchRequest)
      returns (PurgeQueuedTickCommandsForScriptPatchResponse);
  rpc PurgeQueuedTickCommandsForPluginVersion(PurgeQueuedTickCommandsForPluginVersionRequest)
      returns (PurgeQueuedTickCommandsForPluginVersionResponse);
}

message StartSessionRequest {
  string tenant_id = 1;
  string game_template_id = 2;
  string control_plane_request_id = 3;
  string client_ip = 4;
  string owner_account_id = 6;
}

message StartSessionResponse {
  string session_id = 1;
  shared.v1.ErrorDetail error = 2;
}

message StopSessionRequest {
  string session_id = 1;
}

message StopSessionResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message RestartSessionRequest {
  string session_id = 1;
}

message RestartSessionResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message EnqueueCommandRequest {
  string session_id = 1;
  string command = 2;
  bool requires_solo_tick = 3;
}

message EnqueueCommandResponse {
  bool accepted = 1;
  shared.v1.ErrorDetail error = 2;
  string command_id = 3;
}

message QueryStateRequest {
  string session_id = 1;
}

message QueryStateResponse {
  string state_json = 1;
  shared.v1.ErrorDetail error = 2;
}

message QueryAccountPresenceRequest {
  string tenant_id = 1;
  string viewer_account_id = 2;
  repeated string account_ids = 3;
}

enum AccountPresenceActivityState {
  ACCOUNT_PRESENCE_ACTIVITY_STATE_UNSPECIFIED = 0;
  ACCOUNT_PRESENCE_ACTIVITY_STATE_ACTIVE = 1;
  ACCOUNT_PRESENCE_ACTIVITY_STATE_AUTO_AFK = 2;
  ACCOUNT_PRESENCE_ACTIVITY_STATE_EXPLICIT_AFK = 3;
}

enum AccountPresenceVisibilityPolicy {
  ACCOUNT_PRESENCE_VISIBILITY_POLICY_UNSPECIFIED = 0;
  ACCOUNT_PRESENCE_VISIBILITY_POLICY_PUBLIC = 1;
  ACCOUNT_PRESENCE_VISIBILITY_POLICY_FRIENDS_ONLY = 2;
  ACCOUNT_PRESENCE_VISIBILITY_POLICY_PRIVATE = 3;
  ACCOUNT_PRESENCE_VISIBILITY_POLICY_HIDDEN_STAFF = 4;
}

enum AccountRecentPresenceDisposition {
  ACCOUNT_RECENT_PRESENCE_DISPOSITION_UNSPECIFIED = 0;
  ACCOUNT_RECENT_PRESENCE_DISPOSITION_TRANSPORT_LOSS = 1;
  ACCOUNT_RECENT_PRESENCE_DISPOSITION_LOGOUT = 2;
  ACCOUNT_RECENT_PRESENCE_DISPOSITION_TAKEOVER = 3;
}

message AccountPresenceEntry {
  string account_id = 1;
  bool online = 2;
  string game_instance_id = 3;
  string character_id = 4;
  string character_name = 5;
  AccountPresenceActivityState activity_state = 6;
  int64 last_seen_at_ms = 7;
  AccountPresenceVisibilityPolicy visibility_policy = 8;
  string world_slug = 9;
  string world_display_name = 10;
  string realm_slug = 11;
  string realm_display_name = 12;
  AccountRecentPresenceDisposition recent_disposition = 13;
}

message QueryAccountPresenceResponse {
  repeated AccountPresenceEntry presences = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListGameplayWorldsRequest {}

message GameplayWorld {
  string world_slug = 1;
  string display_name = 2;
}

message ListGameplayWorldsResponse {
  repeated GameplayWorld worlds = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListGameplayRealmsRequest {
  string world_slug = 1;
}

message GameplayRealm {
  string world_slug = 1;
  string realm_slug = 2;
  string display_name = 3;
  string tenant_id = 4;
  string game_instance_id = 5;
  int64 pointer_version = 6;
  bool requires_character_selection = 7;
  bool visible = 8;
  string state_scope = 9;
  string character_creation_policy = 10;
}

message ListGameplayRealmsResponse {
  repeated GameplayRealm realms = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetAdmissionPointerRequest {
  string world_slug = 1;
  string realm_slug = 2;
}

message GameplayAdmissionPointer {
  string world_slug = 1;
  string world_display_name = 2;
  string realm_slug = 3;
  string realm_display_name = 4;
  string tenant_id = 5;
  string game_instance_id = 6;
  int64 pointer_version = 7;
  bool requires_character_selection = 8;
  bool visible = 9;
  string state_scope = 10;
  string character_creation_policy = 11;
}

message GetAdmissionPointerResponse {
  GameplayAdmissionPointer admission_pointer = 1;
  shared.v1.ErrorDetail error = 2;
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}

message ToggleFeatureFlagRequest {
  string tenant_id = 1;
  string name = 2;
  bool enabled = 3;
}

message ToggleFeatureFlagResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

// Administrative request to pause tick execution.
message PauseTicksRequest {
  string reason = 1;
}

message PauseTicksResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

// Resume ticks after a backup has started.
message ResumeTicksRequest {
  string reason = 1;
}

message ResumeTicksResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetTickStatusRequest {}

enum TickStatus {
  TICK_STATUS_UNSPECIFIED = 0;
  TICK_STATUS_RUNNING = 1;
  TICK_STATUS_PAUSED = 2;
}

message GetTickStatusResponse {
  TickStatus status = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetPinnedScriptPatchVersionRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
}

message GetPinnedScriptPatchVersionResponse {
  string pinned_script_patch_version = 1;
  int64 pinned_at_ms = 2;
  string pinned_by = 3;
  string control_plane_request_id = 4;
  shared.v1.ErrorDetail error = 5;
}

message GetGameSessionPinConvergenceRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
}

message GetGameSessionPinConvergenceResponse {
  string tenant_id = 1;
  string game_instance_id = 2;
  string observed_pinned_script_patch_version = 3;
  string last_observed_control_plane_request_id = 4;
  int64 observed_at_ms = 5;
  shared.v1.ErrorDetail error = 6;
}

message GetGameInstanceRuntimeStateRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
}

message GameInstanceRuntimeState {
  string tenant_id = 1;
  string game_instance_id = 2;
  string runtime_version_id = 3;
  string pinned_script_patch_version = 4;
  string launch_descriptor_id = 5;
  string status = 6;
  string version_id = 7;
  string release_bundle_id = 8;
  int64 version_state_epoch = 9;
  int64 script_patch_pinned_at_ms = 10;
  string script_patch_pinned_by = 11;
  string script_patch_pinned_reason = 12;
  string script_patch_pinned_control_plane_request_id = 13;
}

message GetGameInstanceRuntimeStateResponse {
  GameInstanceRuntimeState runtime_state = 1;
  shared.v1.ErrorDetail error = 2;
}

message AdmissionPointerControlPlaneEntry {
  string world_slug = 1;
  string world_display_name = 2;
  string realm_slug = 3;
  string realm_display_name = 4;
  string tenant_id = 5;
  string game_instance_id = 6;
  int64 pointer_version = 7;
  bool visible = 8;
  bool requires_character_selection = 9;
  string state_scope = 10;
  string character_creation_policy = 11;
  string actor_principal = 12;
  string reason = 13;
  string control_plane_request_id = 14;
  int64 occurred_at_ms = 15;
  string prepared_version_upgrade_id = 16;
}

message ListAdmissionPointersRequest {}

message ListAdmissionPointersResponse {
  repeated AdmissionPointerControlPlaneEntry pointers = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListAdmissionPointerAuditRequest {
  string world_slug = 1;
  string realm_slug = 2;
}

message ListAdmissionPointerAuditResponse {
  repeated AdmissionPointerControlPlaneEntry audit = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetGameplayCommandStatusRequest {
  string command_id = 1;
  string tenant_id = 2;
  string game_instance_id = 3;
  string region_id = 4;
  int64 region_epoch = 5;
  string automation_dispatch_id = 6;
}

message GameplayCommandStatus {
  string command_id = 1;
  string tenant_id = 2;
  string game_instance_id = 3;
  string session_id = 4;
  string account_id = 5;
  string character_id = 6;
  string command_name = 7;
  string sanitized_command_text = 8;
  bool requires_solo_tick = 9;
  string execution_outcome = 10;
  string gameplay_result = 11;
  int64 accepted_at_ms = 12;
  int64 staged_at_ms = 13;
  int64 completed_at_ms = 14;
  int64 last_attempt_at_ms = 15;
  int32 attempt_count = 16;
  string failure_code = 17;
  string failure_message = 18;
  string source_type = 19;
  string automation_dispatch_id = 20;
  string automation_work_item_id = 21;
  string script_id = 22;
  string script_patch_version = 23;
  string target_entity_id = 24;
  string region_id = 25;
  int64 region_epoch = 26;
  int64 due_tick_id = 27;
}

message GetGameplayCommandStatusResponse {
  GameplayCommandStatus command = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetRuntimeOwnershipStatusRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
}

message RuntimeOwnershipStatus {
  string tenant_id = 1;
  string game_instance_id = 2;
  int64 region_epoch = 3;
  string executor_fence = 4;
  string owner_service = 5;
  string owner_instance_id = 6;
  bool paused = 7;
  string last_committed_tick_batch_id = 8;
  int64 updated_at_ms = 9;
}

message GetRuntimeOwnershipStatusResponse {
  RuntimeOwnershipStatus ownership = 1;
  shared.v1.ErrorDetail error = 2;
}

message SetAdmissionPointerRequest {
  string world_slug = 1;
  string world_display_name = 2;
  string realm_slug = 3;
  string realm_display_name = 4;
  string tenant_id = 5;
  string game_instance_id = 6;
  bool visible = 7;
  bool requires_character_selection = 8;
  string state_scope = 9;
  string character_creation_policy = 10;
  string actor_principal = 11;
  string reason = 12;
  string control_plane_request_id = 13;
  optional int64 expected_pointer_version = 14;
  string prepared_version_upgrade_id = 15;
}

message SetAdmissionPointerResponse {
  AdmissionPointerControlPlaneEntry pointer = 1;
  shared.v1.ErrorDetail error = 2;
}

message ExecutePreparedVersionCutoverRequest {
  string world_slug = 1;
  string realm_slug = 2;
  string tenant_id = 3;
  string target_game_instance_id = 4;
  string prepared_version_upgrade_id = 5;
  string actor_principal = 6;
  string reason = 7;
  string control_plane_request_id = 8;
  optional int64 expected_pointer_version = 9;
}

message ExecutePreparedVersionCutoverResponse {
  AdmissionPointerControlPlaneEntry pointer = 1;
  shared.v1.ErrorDetail error = 2;
}

message SetPinnedScriptPatchVersionRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string target_script_patch_version = 3;
  string control_plane_request_id = 4;
  string actor_principal = 5;
  string reason = 6;
}

message SetPinnedScriptPatchVersionResponse {
  string previous_script_patch_version = 1;
  string pinned_script_patch_version = 2;
  string control_plane_request_id = 3;
  shared.v1.ErrorDetail error = 4;
}

message RollbackScriptPatchVersionRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string target_script_patch_version = 3;
  string control_plane_request_id = 4;
  string actor_principal = 5;
  string reason = 6;
}

message RollbackScriptPatchVersionResponse {
  string previous_script_patch_version = 1;
  string pinned_script_patch_version = 2;
  string control_plane_request_id = 3;
  shared.v1.ErrorDetail error = 4;
}

message PauseTicksForScopeRequest {
  // Scope rules (normative):
  // - tenant_id is required.
  // - Exactly one scope must be set via the `scope` oneof.
  // - region_id is the canonical tick scope (preferred).
  // - game_instance_id is allowed when tooling is instance-scoped.
  string tenant_id = 1;
  oneof scope {
    string game_instance_id = 2;
    string region_id = 3;
  }
  string control_plane_request_id = 4;
  string actor_principal = 5;
  string reason = 6;
}

message PauseTicksForScopeResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message ResumeTicksForScopeRequest {
  // Scope rules (normative):
  // - tenant_id is required.
  // - Exactly one scope must be set via the `scope` oneof.
  // - region_id is the canonical tick scope (preferred).
  // - game_instance_id is allowed when tooling is instance-scoped.
  string tenant_id = 1;
  oneof scope {
    string game_instance_id = 2;
    string region_id = 3;
  }
  string control_plane_request_id = 4;
  string actor_principal = 5;
  string reason = 6;
}

message ResumeTicksForScopeResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

enum CutoverCompatibilityResult {
  CUTOVER_COMPATIBILITY_RESULT_UNSPECIFIED = 0;
  CUTOVER_COMPATIBILITY_RESULT_COMPATIBLE = 1;
  CUTOVER_COMPATIBILITY_RESULT_INCOMPATIBLE = 2;
  CUTOVER_COMPATIBILITY_RESULT_UNAVAILABLE = 3;
}

message ValidateInstanceCutoverCompatibilityRequest {
  string tenant_id = 1;
  string source_game_instance_id = 2;
  string target_version_id = 3;
}

message CutoverParticipantResult {
  string participant = 1;
  repeated string state_classes_checked = 2;
  repeated string checked_families = 3;
  bool has_s2_rows = 4;
  CutoverCompatibilityResult result = 5;
  repeated string reasons = 6;
}

message ValidateInstanceCutoverCompatibilityResponse {
  CutoverCompatibilityResult result = 1;
  repeated string reasons = 2;
  repeated string checked_participants = 3;
  int64 checked_at_ms = 4;
  string remap_set_id = 5;
  repeated CutoverParticipantResult participant_results = 6;
  shared.v1.ErrorDetail error = 7;
}

message PrepareVersionUpgradeRequest {
  string tenant_id = 1;
  string source_game_instance_id = 2;
  string target_version_id = 3;
  string control_plane_request_id = 4;
}

message PreparedVersionUpgrade {
  string preparation_id = 1;
  string tenant_id = 2;
  string source_game_instance_id = 3;
  string source_version_id = 4;
  string target_version_id = 5;
  string target_launch_descriptor_id = 6;
  string remap_set_id = 7;
  CutoverCompatibilityResult result = 8;
  repeated string reasons = 9;
  repeated string checked_participants = 10;
  int64 checked_at_ms = 11;
  repeated CutoverParticipantResult participant_results = 12;
  string control_plane_request_id = 13;
  string executed_target_game_instance_id = 14;
  int64 executed_pointer_version = 15;
  int64 executed_at_ms = 16;
  string execution_control_plane_request_id = 17;
}

message PrepareVersionUpgradeResponse {
  PreparedVersionUpgrade preparation = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetPreparedVersionUpgradeRequest {
  string tenant_id = 1;
  string preparation_id = 2;
}

message GetPreparedVersionUpgradeResponse {
  PreparedVersionUpgrade preparation = 1;
  shared.v1.ErrorDetail error = 2;
}

message EnqueueAutomationCommandIfAbsentRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string region_id = 3;
  int64 region_epoch = 4;
  int64 due_tick_id = 5;
  string automation_dispatch_id = 6;
  string automation_work_item_id = 7;
  string script_id = 8;
  string script_patch_version = 9;
  string target_entity_id = 10;
  string command = 11;
  bool requires_solo_tick = 12;
  string plugin_id = 13;
  string plugin_version_id = 14;
}

message EnqueueAutomationCommandIfAbsentResponse {
  bool accepted = 1;
  string admission_outcome = 2;
  string command_id = 3;
  shared.v1.ErrorDetail error = 4;
}

message PurgeQueuedTickCommandsForScriptPatchRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string region_id = 3;
  string script_patch_version = 4;
  string control_plane_request_id = 5;
  string actor_principal = 6;
  string reason = 7;
}

message PurgeQueuedTickCommandsForScriptPatchResponse {
  int64 purged_count = 1;
  shared.v1.ErrorDetail error = 2;
}

message PurgeQueuedTickCommandsForPluginVersionRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string region_id = 3;
  string plugin_id = 4;
  string plugin_version_id = 5;
  string control_plane_request_id = 6;
  string actor_principal = 7;
  string reason = 8;
}

message PurgeQueuedTickCommandsForPluginVersionResponse {
  int64 purged_count = 1;
  shared.v1.ErrorDetail error = 2;
}
