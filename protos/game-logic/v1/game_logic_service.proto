syntax = "proto3";

package game_logic.v1;

import "shared/v1/errors.proto";
import "shared/v1/instance_refs.proto";

option java_package = "net.firedevops.firemud.gamelogic.v1";
option java_multiple_files = true;

service GameLogicService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc ResolveLook(LookRequest) returns (LookResult);
  rpc BroadcastSay(BroadcastSayRequest) returns (BroadcastSayResponse);
  rpc ResolveMove(MoveRequest) returns (MoveResult);
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}

message ExecuteCommandRequest {
  string tenant_id = 1;
  string session_id = 2;
  string command = 3;
}

message ExecuteCommandResponse {
  string result = 1;
  shared.v1.ErrorDetail error = 2;
}

message LookRequest {
  string tenant_id = 1;
  string session_id = 2;
  string character_id = 3;
  shared.v1.RoomInstanceRef room_instance = 4;
}

message LookResult {
  string room_name = 1;
  string short_description = 2;
  string long_description = 3;
  repeated LookExit exits = 4;
  repeated RoomEntity entities = 5;
  repeated string room_flags = 6;
  shared.v1.RoomInstanceRef room_instance = 7;
  string world_snapshot_id = 8;
  string entity_snapshot_id = 9;
  string look_snapshot_id = 10;
  RoomAmbientState ambient_state = 11;
}

message BroadcastSayRequest {
  string tenant_id = 1;
  string session_id = 2;
  string character_id = 3;
  ChatAlias alias = 4;
  string text = 5;
  shared.v1.RoomInstanceRef room_instance = 6;
}

message BroadcastSayResponse {
  bool success = 1;
  string message = 2;
  repeated string delivered_to = 3;
  repeated string npc_echoes = 4;
  shared.v1.ErrorDetail error = 5;
}

message MoveRequest {
  string tenant_id = 1;
  string session_id = 2;
  string character_id = 3;
  shared.v1.RoomInstanceRef room_instance = 4;
  string direction = 5;
}

message MoveResult {
  bool success = 1;
  LookResult destination_look = 2;
  shared.v1.ErrorDetail error = 3;
}

enum ChatAlias {
  CHAT_ALIAS_UNSPECIFIED = 0;
  SAY = 1;
  YELL = 2;
  WHISPER = 3;
}

message LookExit {
  string label = 1;
  string description = 2;
  string target_room_instance_id = 3;
}

message RoomEntity {
  string entity_id = 1;
  string display_name = 2;
  EntityType entity_type = 3;
  string role = 4;
  repeated string state_flags = 5;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  PLAYER = 1;
  NPC = 2;
  ITEM = 3;
}

message RoomAmbientState {
  int32 schema_version = 1;
  string weather = 2;
  repeated DoorAmbientState doors = 3;
  repeated HazardAmbientState hazards = 4;
}

enum DoorState {
  DOOR_STATE_UNSPECIFIED = 0;
  OPEN = 1;
  CLOSED = 2;
  LOCKED = 3;
}

message DoorAmbientState {
  string door_id = 1;
  DoorState state = 2;
}

enum HazardState {
  HAZARD_STATE_UNSPECIFIED = 0;
  ACTIVE = 1;
  INACTIVE = 2;
}

message HazardAmbientState {
  string hazard_id = 1;
  HazardState state = 2;
}
