syntax = "proto3";

package game_logic.v1;

import "shared/v1/errors.proto";
import "shared/v1/instance_refs.proto";

option java_package = "net.firedevops.firemud.gamelogic.v1";
option java_multiple_files = true;

service GameLogicService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc ResolveLook(LookRequest) returns (LookResult);
  rpc SendCommunication(SendCommunicationRequest) returns (SendCommunicationResponse);
  rpc ResolveMove(MoveRequest) returns (MoveResult);
  rpc GetDraftDesignDigest(GetDraftDesignDigestRequest) returns (GetDraftDesignDigestResponse);
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}

message ExecuteCommandRequest {
  string tenant_id = 1;
  string session_id = 2;
  string command = 3;
}

message ExecuteCommandResponse {
  string result = 1;
  shared.v1.ErrorDetail error = 2;
}

message LookRequest {
  string tenant_id = 1;
  string session_id = 2;
  string character_id = 3;
  shared.v1.RoomInstanceRef room_instance = 4;
  string preferred_locale = 5;
  string session_attestation = 6;
}

message LookResult {
  string room_name = 1;
  string short_description = 2;
  string long_description = 3;
  repeated LookExit exits = 4;
  repeated RoomEntity entities = 5;
  repeated string room_flags = 6;
  shared.v1.RoomInstanceRef room_instance = 7;
  string world_snapshot_id = 8;
  string entity_snapshot_id = 9;
  string look_snapshot_id = 10;
  RoomAmbientState ambient_state = 11;
  shared.v1.ErrorDetail error = 12;
}

message SendCommunicationRequest {
  string tenant_id = 1;
  string session_id = 2;
  string character_id = 3;
  string account_id = 4;
  CommunicationType type = 5;
  string text = 6;
  shared.v1.RoomInstanceRef room_instance = 7;
  CommunicationTargetKind target_kind = 8;
  string target_character_id = 9;
  string target_character_name = 10;
  string game_instance_id = 11;
  string speaker_name = 12;
  string session_attestation = 13;
}

message SendCommunicationResponse {
  bool success = 1;
  CommunicationType type = 2;
  string message = 3;
  string speaker_name = 4;
  repeated string delivered_to = 5;
  repeated string npc_echoes = 6;
  shared.v1.ErrorDetail error = 7;
  repeated CommunicationRecipientView recipient_views = 8;
}

message MoveRequest {
  string tenant_id = 1;
  string session_id = 2;
  string character_id = 3;
  shared.v1.RoomInstanceRef room_instance = 4;
  string direction = 5;
  string preferred_locale = 6;
  string session_attestation = 7;
}

message MoveResult {
  bool success = 1;
  LookResult destination_look = 2;
  shared.v1.ErrorDetail error = 3;
}

enum CommunicationType {
  COMMUNICATION_TYPE_UNSPECIFIED = 0;
  SAY = 1;
  WHISPER = 2;
  TELL = 3;
}

enum CommunicationTargetKind {
  COMMUNICATION_TARGET_KIND_UNSPECIFIED = 0;
  COMMUNICATION_TARGET_KIND_ROOM = 1;
  COMMUNICATION_TARGET_KIND_DIRECT_CHARACTER_IN_ROOM = 2;
  COMMUNICATION_TARGET_KIND_DIRECT_CHARACTER = 3;
}

enum CommunicationRecipientRole {
  COMMUNICATION_RECIPIENT_ROLE_UNSPECIFIED = 0;
  COMMUNICATION_RECIPIENT_ROLE_ACTOR = 1;
  COMMUNICATION_RECIPIENT_ROLE_TARGET = 2;
  COMMUNICATION_RECIPIENT_ROLE_OBSERVER = 3;
}

enum CommunicationPerception {
  COMMUNICATION_PERCEPTION_UNSPECIFIED = 0;
  COMMUNICATION_PERCEPTION_FULL_CONTENT = 1;
  COMMUNICATION_PERCEPTION_METADATA_ONLY = 2;
}

message CommunicationRecipientView {
  string recipient_id = 1;
  string recipient_name = 2;
  CommunicationRecipientRole role = 3;
  CommunicationPerception perception = 4;
  string speaker_name = 5;
  string target_name = 6;
}

message LookExit {
  string label = 1;
  string description = 2;
  string target_room_instance_id = 3;
}

message RoomEntity {
  string entity_id = 1;
  string display_name = 2;
  EntityType entity_type = 3;
  string role = 4;
  repeated string state_flags = 5;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  PLAYER = 1;
  NPC = 2;
  ITEM = 3;
}

message RoomAmbientState {
  int32 schema_version = 1;
  string weather = 2;
  repeated DoorAmbientState doors = 3;
  repeated HazardAmbientState hazards = 4;
}

enum DoorState {
  DOOR_STATE_UNSPECIFIED = 0;
  OPEN = 1;
  CLOSED = 2;
  LOCKED = 3;
}

message DoorAmbientState {
  string door_id = 1;
  DoorState state = 2;
}

enum HazardState {
  HAZARD_STATE_UNSPECIFIED = 0;
  ACTIVE = 1;
  INACTIVE = 2;
}

message HazardAmbientState {
  string hazard_id = 1;
  HazardState state = 2;
}

message GetDraftDesignDigestRequest {
  string tenant_id = 1;
  oneof scope {
    string version_id = 2;
    string script_patch_version = 3;
  }
}

message GetDraftDesignDigestResponse {
  string tenant_id = 1;
  string scope_value = 2;
  string applied_commit_id = 3;
  string content_digest = 4;
  int32 digest_schema_version = 5;
  shared.v1.ErrorDetail error = 6;
}
