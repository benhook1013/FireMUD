syntax = "proto3";

package game_logic.v1;

import "shared/v1/errors.proto";

option java_package = "net.firedevops.firemud.gamelogic.v1";
option java_multiple_files = true;

service GameLogicService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc ResolveLook(LookRequest) returns (LookResult);
  rpc BroadcastSay(BroadcastSayRequest) returns (BroadcastSayResponse);
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}

message ExecuteCommandRequest {
  string tenant_id = 1;
  string session_id = 2;
  string command = 3;
}

message ExecuteCommandResponse {
  string result = 1;
  shared.v1.ErrorDetail error = 2;
}

message LookRequest {
  string tenant_id = 1;
  string session_id = 2;
  string player_id = 3;
  string room_id = 4;
}

message LookResult {
  string room_id = 1;
  string room_name = 2;
  string short_description = 3;
  string long_description = 4;
  repeated LookExit exits = 5;
  repeated RoomEntity entities = 6;
  map<string, string> ambient_state = 7;
  repeated string room_flags = 8;
}

message BroadcastSayRequest {
  string tenant_id = 1;
  string session_id = 2;
  string player_id = 3;
  string room_id = 4;
  ChatAlias alias = 5;
  string text = 6;
}

message BroadcastSayResponse {
  bool success = 1;
  string message = 2;
  repeated string delivered_to = 3;
  repeated string npc_echoes = 4;
  shared.v1.ErrorDetail error = 5;
}

enum ChatAlias {
  CHAT_ALIAS_UNSPECIFIED = 0;
  SAY = 1;
  YELL = 2;
  WHISPER = 3;
}

message LookExit {
  string label = 1;
  string target_room_id = 2;
  string description = 3;
}

message RoomEntity {
  string entity_id = 1;
  string display_name = 2;
  EntityType entity_type = 3;
  string role = 4;
  repeated string state_flags = 5;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  PLAYER = 1;
  NPC = 2;
  ITEM = 3;
}
