syntax = "proto3";

package logging_admin.v1;

import "shared/v1/errors.proto";
import "google/protobuf/timestamp.proto";

option java_package = "net.firedevops.firemud.loggingadmin.v1";
option java_multiple_files = true;

service LoggingAdminService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc QueryLogs(QueryLogsRequest) returns (QueryLogsResponse);
  rpc CreateLogEvent(CreateLogEventRequest) returns (CreateLogEventResponse);
  rpc ReadLogEventReceipt(ReadLogEventReceiptRequest) returns (ReadLogEventReceiptResponse);
  rpc ApplyModerationAction(ApplyModerationActionRequest) returns (ApplyModerationActionResponse);
  rpc EvaluateModerationPolicy(EvaluateModerationPolicyRequest)
      returns (EvaluateModerationPolicyResponse);
  rpc ToggleFeatureFlag(ToggleFeatureFlagRequest) returns (ToggleFeatureFlagResponse);
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}

message QueryLogsRequest {
  string tenant_id = 1;
  string filter = 2;
}

message QueryLogsResponse {
  repeated string entries = 1;
  shared.v1.ErrorDetail error = 2;
}

message CreateLogEventRequest {
  AccountAuditScope scope = 1;
  string tenant_id = 2;
  string audit_event_id = 3;
  string producer_service = 4;
  string event_type = 5;
  google.protobuf.Timestamp occurred_at = 6;
  int32 schema_version = 7;
  bytes payload = 8;
  int32 payload_digest_version = 9;
  string payload_digest = 10;
}

message CreateLogEventResponse {
  AccountAuditScope scope = 1;
  string tenant_id = 2;
  string audit_event_id = 3;
  string receipt_id = 4;
  string log_event_id = 5;
  int32 schema_version = 6;
  int32 payload_digest_version = 7;
  string payload_digest = 8;
  AccountAuditReceiptStatus status = 9;
  AccountAuditReceiptOutcome outcome = 10;
}

message ReadLogEventReceiptRequest {
  AccountAuditScope scope = 1;
  string tenant_id = 2;
  string audit_event_id = 3;
  string producer_service = 4;
  string event_type = 5;
  google.protobuf.Timestamp occurred_at = 6;
  int32 schema_version = 7;
  bytes payload = 8;
  int32 payload_digest_version = 9;
  string payload_digest = 10;
}

message ReadLogEventReceiptResponse {
  AccountAuditScope scope = 1;
  string tenant_id = 2;
  string audit_event_id = 3;
  string receipt_id = 4;
  string log_event_id = 5;
  int32 schema_version = 6;
  int32 payload_digest_version = 7;
  string payload_digest = 8;
  AccountAuditReceiptStatus status = 9;
  AccountAuditReceiptOutcome outcome = 10;
}

enum AccountAuditScope {
  ACCOUNT_AUDIT_SCOPE_UNSPECIFIED = 0;
  ACCOUNT_AUDIT_SCOPE_PLATFORM = 1;
  ACCOUNT_AUDIT_SCOPE_TENANT = 2;
}

enum AccountAuditReceiptStatus {
  ACCOUNT_AUDIT_RECEIPT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_AUDIT_RECEIPT_STATUS_COMMITTED = 1;
  ACCOUNT_AUDIT_RECEIPT_STATUS_MINIMIZED = 2;
  ACCOUNT_AUDIT_RECEIPT_STATUS_CONFLICT = 3;
}

enum AccountAuditReceiptOutcome {
  ACCOUNT_AUDIT_RECEIPT_OUTCOME_UNSPECIFIED = 0;
  ACCOUNT_AUDIT_RECEIPT_OUTCOME_ACCEPTED = 1;
  ACCOUNT_AUDIT_RECEIPT_OUTCOME_DUPLICATE = 2;
  ACCOUNT_AUDIT_RECEIPT_OUTCOME_NON_REPLAYABLE = 3;
  ACCOUNT_AUDIT_RECEIPT_OUTCOME_IDEMPOTENCY_CONFLICT = 4;
}

message ApplyModerationActionRequest {
  string tenant_id = 1;
  string account_id = 2;
  string session_id = 3;
  string action = 4;
  string reason = 5;
}

message ApplyModerationActionResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message EvaluateModerationPolicyRequest {
  string tenant_id = 1;
  string account_id = 2;
  string scope = 3;
}

message EvaluateModerationPolicyResponse {
  bool allowed = 1;
  string action = 2;
  string reason = 3;
  int64 expires_at_epoch_seconds = 4;
  shared.v1.ErrorDetail error = 5;
}

message ToggleFeatureFlagRequest {
  string tenant_id = 1;
  string name = 2;
  bool enabled = 3;
}

message ToggleFeatureFlagResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}
