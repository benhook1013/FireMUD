syntax = "proto3";

package logging_admin.v1;

import "shared/v1/errors.proto";
import "google/protobuf/timestamp.proto";

option java_package = "net.firedevops.firemud.loggingadmin.v1";
option java_multiple_files = true;

service LoggingAdminService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc QueryLogs(QueryLogsRequest) returns (QueryLogsResponse);
  rpc CreateLogEvent(CreateLogEventRequest) returns (CreateLogEventResponse);
  rpc ReadLogEventReceipt(ReadLogEventReceiptRequest) returns (ReadLogEventReceiptResponse);
  rpc ApplyModerationAction(ApplyModerationActionRequest) returns (ApplyModerationActionResponse);
  rpc EvaluateModerationPolicy(EvaluateModerationPolicyRequest)
      returns (EvaluateModerationPolicyResponse);
  rpc ToggleFeatureFlag(ToggleFeatureFlagRequest) returns (ToggleFeatureFlagResponse);
}

// Read-only Account evidence for the current Logging/Admin StartSession reservation claim.
service StartSessionReservationEvidenceService {
  rpc ReadCurrentClaimEvidence(ReadCurrentClaimEvidenceRequest)
      returns (ReadCurrentClaimEvidenceResponse);
}

enum StartSessionReservationEvidencePurpose {
  START_SESSION_RESERVATION_EVIDENCE_PURPOSE_UNSPECIFIED = 0;
  START_SESSION_RESERVATION_EVIDENCE_PURPOSE_ISSUE = 1;
  START_SESSION_RESERVATION_EVIDENCE_PURPOSE_RECOVER = 2;
}

message ReadCurrentClaimEvidenceRequest {
  string control_plane_request_id = 1;
  bytes pre_authorization_tuple_json = 2;
  string reservation_owner_id = 3;
  int64 reservation_claim_fence = 4;
  string claim_owner_id = 5;
  int64 claim_fence = 6;
  StartSessionReservationEvidencePurpose purpose = 7;
}

message ReadCurrentClaimEvidenceResponse {
  string control_plane_request_id = 1;
  bytes pre_authorization_tuple_json = 2;
  string mutation_digest = 3;
  string reservation_owner_id = 4;
  int64 reservation_claim_fence = 5;
  string claim_owner_id = 6;
  int64 claim_fence = 7;
  int64 claim_expires_at_epoch_millis = 8;
  int64 observed_at_epoch_millis = 9;
  StartSessionReservationEvidencePurpose purpose = 10;
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}

message QueryLogsRequest {
  string tenant_id = 1;
  string filter = 2;
}

message QueryLogsResponse {
  repeated string entries = 1;
  shared.v1.ErrorDetail error = 2;
}

message CreateLogEventRequest {
  reserved 2 to 4;
  reserved "account_id", "type", "message";

  string tenant_id = 1;
  AccountAuditScope scope = 5;
  string audit_event_id = 6;
  string producer_service = 7;
  string event_type = 8;
  google.protobuf.Timestamp occurred_at = 9;
  int32 schema_version = 10;
  bytes payload = 11;
  int32 payload_digest_version = 12;
  string payload_digest = 13;
}

message CreateLogEventResponse {
  string log_event_id = 1;
  shared.v1.ErrorDetail error = 2;
  AccountAuditScope scope = 3;
  string tenant_id = 4;
  string audit_event_id = 5;
  string receipt_id = 6;
  int32 schema_version = 7;
  int32 payload_digest_version = 8;
  string payload_digest = 9;
  AccountAuditReceiptStatus status = 10;
  AccountAuditReceiptOutcome outcome = 11;
}

message ReadLogEventReceiptRequest {
  AccountAuditScope scope = 1;
  string tenant_id = 2;
  string audit_event_id = 3;
  string producer_service = 4;
  string event_type = 5;
  google.protobuf.Timestamp occurred_at = 6;
  int32 schema_version = 7;
  bytes payload = 8;
  int32 payload_digest_version = 9;
  string payload_digest = 10;
}

message ReadLogEventReceiptResponse {
  AccountAuditScope scope = 1;
  string tenant_id = 2;
  string audit_event_id = 3;
  string receipt_id = 4;
  string log_event_id = 5;
  int32 schema_version = 6;
  int32 payload_digest_version = 7;
  string payload_digest = 8;
  AccountAuditReceiptStatus status = 9;
  AccountAuditReceiptOutcome outcome = 10;
  shared.v1.ErrorDetail error = 11;
}

enum AccountAuditScope {
  ACCOUNT_AUDIT_SCOPE_UNSPECIFIED = 0;
  ACCOUNT_AUDIT_SCOPE_PLATFORM = 1;
  ACCOUNT_AUDIT_SCOPE_TENANT = 2;
}

enum AccountAuditReceiptStatus {
  ACCOUNT_AUDIT_RECEIPT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_AUDIT_RECEIPT_STATUS_COMMITTED = 1;
  ACCOUNT_AUDIT_RECEIPT_STATUS_MINIMIZED = 2;
  ACCOUNT_AUDIT_RECEIPT_STATUS_CONFLICT = 3;
}

enum AccountAuditReceiptOutcome {
  ACCOUNT_AUDIT_RECEIPT_OUTCOME_UNSPECIFIED = 0;
  ACCOUNT_AUDIT_RECEIPT_OUTCOME_ACCEPTED = 1;
  ACCOUNT_AUDIT_RECEIPT_OUTCOME_DUPLICATE = 2;
  ACCOUNT_AUDIT_RECEIPT_OUTCOME_NON_REPLAYABLE = 3;
  ACCOUNT_AUDIT_RECEIPT_OUTCOME_IDEMPOTENCY_CONFLICT = 4;
}

message ApplyModerationActionRequest {
  string tenant_id = 1;
  string account_id = 2;
  string session_id = 3;
  string action = 4;
  string reason = 5;
}

message ApplyModerationActionResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message EvaluateModerationPolicyRequest {
  string tenant_id = 1;
  string account_id = 2;
  string scope = 3;
}

message EvaluateModerationPolicyResponse {
  bool allowed = 1;
  string action = 2;
  string reason = 3;
  int64 expires_at_epoch_seconds = 4;
  shared.v1.ErrorDetail error = 5;
}

message ToggleFeatureFlagRequest {
  string tenant_id = 1;
  string name = 2;
  bool enabled = 3;
}

message ToggleFeatureFlagResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}
