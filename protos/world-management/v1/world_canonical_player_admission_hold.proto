syntax = "proto3";

package world_management.v1;

option java_package = "net.firedevops.firemud.worldmanagement.v1";
option java_multiple_files = true;

// Distinct Account-to-World player-admission hold; neither binding admission nor hold release.
service WorldCanonicalPlayerAdmissionHoldService {
  rpc AcquireCanonicalPlayerAdmissionHold(AcquireCanonicalPlayerAdmissionHoldRequest)
      returns (AcquireCanonicalPlayerAdmissionHoldResponse);
  rpc ReadCanonicalPlayerAdmissionHold(ReadCanonicalPlayerAdmissionHoldRequest)
      returns (ReadCanonicalPlayerAdmissionHoldResponse);
}

message AcquireCanonicalPlayerAdmissionHoldRequest {
  // Fresh read correlation, echoed only; never the durable Account lease/attempt identity.
  string request_id = 1;
  bytes original_lease_json = 2;
  string original_lease_sha256 = 3;
  string expected_lifecycle_epoch = 4;
  string expected_row_version = 5;
}

message AcquireCanonicalPlayerAdmissionHoldResponse {
  string request_id = 1;
  string original_lease_sha256 = 2;
  bytes hold_evidence_json = 3;
  string hold_evidence_sha256 = 4;
}

message ReadCanonicalPlayerAdmissionHoldRequest {
  string request_id = 1;
  bytes original_lease_json = 2;
  string original_lease_sha256 = 3;
  string expected_lifecycle_epoch = 4;
  string expected_row_version = 5;
}

message ReadCanonicalPlayerAdmissionHoldResponse {
  string request_id = 1;
  string original_lease_sha256 = 2;
  bytes hold_evidence_json = 3;
  string hold_evidence_sha256 = 4;
}
