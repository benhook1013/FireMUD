syntax = "proto3";

package world_management.v1;

option java_package = "net.firedevops.firemud.worldmanagement.v1";
option java_multiple_files = true;

// Manually composed only. As-of World-local catalog evidence, never a FRESH manifest,
// global owner registry, materialization, actor authorization or admission result.
service WorldRuntimeFamilyCatalogReadService {
  rpc ReadWorldRuntimeFamilyCatalog(ReadWorldRuntimeFamilyCatalogRequest)
      returns (ReadWorldRuntimeFamilyCatalogResponse);
}

message ReadWorldRuntimeFamilyCatalogRequest {
  // Exactly one value; repeated so duplicate wire values remain observable.
  repeated bytes canonical_request_bytes = 1;
}

message ReadWorldRuntimeFamilyCatalogResponse {
  // Exactly one complete closed frame. No partial, empty or paginated success.
  repeated bytes canonical_response_bytes = 1;
}
