syntax = "proto3";

package world_management.v1;

import "shared/v1/errors.proto";
import "shared/v1/instance_refs.proto";

option java_package = "net.firedevops.firemud.worldmanagement.v1";
option java_multiple_files = true;

service WorldManagementService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc PrepareWorldInstance(PrepareWorldInstanceRequest)
      returns (PrepareWorldInstanceResponse);
  rpc ActivatePreparedWorldInstance(ActivatePreparedWorldInstanceRequest)
      returns (ActivatePreparedWorldInstanceResponse);
  rpc FailPreparedWorldInstance(FailPreparedWorldInstanceRequest)
      returns (FailPreparedWorldInstanceResponse);
  rpc GetWorldInstanceLifecycle(GetWorldInstanceLifecycleRequest)
      returns (GetWorldInstanceLifecycleResponse);
  rpc TerminateWorldInstance(TerminateWorldInstanceRequest)
      returns (TerminateWorldInstanceResponse);
  rpc GetRoom(GetRoomRequest) returns (GetRoomResponse);
  rpc GetRoomSnapshot(GetRoomSnapshotRequest) returns (GetRoomSnapshotResponse);
  rpc GetDraftDesignDigest(GetDraftDesignDigestRequest) returns (GetDraftDesignDigestResponse);
  rpc ApplyWorldDesignMutation(ApplyWorldDesignMutationRequest)
      returns (ApplyWorldDesignMutationResponse);
  rpc ValidateWorldUpgradeMappings(ValidateWorldUpgradeMappingsRequest)
      returns (ValidateWorldUpgradeMappingsResponse);
  rpc ListRoomOccupants(ListRoomOccupantsRequest) returns (ListRoomOccupantsResponse);
  rpc ApplyRoomAmbientStatePatch(ApplyRoomAmbientStatePatchRequest) returns (ApplyRoomAmbientStatePatchResponse);
}

enum WorldInstanceLifecycleStatus {
  WORLD_INSTANCE_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  WORLD_INSTANCE_LIFECYCLE_STATUS_PREPARING = 1;
  WORLD_INSTANCE_LIFECYCLE_STATUS_ACTIVE = 2;
  WORLD_INSTANCE_LIFECYCLE_STATUS_FAILED_PRE_ACTIVATION = 3;
  WORLD_INSTANCE_LIFECYCLE_STATUS_TERMINATING = 4;
  WORLD_INSTANCE_LIFECYCLE_STATUS_TERMINATED = 5;
}

message WorldInstanceLifecycleSnapshot {
  string tenant_id = 1;
  string game_instance_id = 2;
  string game_template_id = 3;
  string control_plane_request_id = 4;
  string launch_descriptor_id = 5;
  string version_id = 6;
  string release_bundle_id = 7;
  string generation_config_revision = 8;
  string published_release_bundle_ref = 9;
  int64 version_state_epoch = 10;
  int64 lifecycle_epoch = 11;
  WorldInstanceLifecycleStatus status = 12;
  string remap_set_id = 13;
}

message PrepareWorldInstanceRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string game_template_id = 3;
  string control_plane_request_id = 4;
  string launch_descriptor_id = 5;
  string version_id = 6;
  string script_patch_version = 7;
  string runtime_flags_json = 8;
  string generation_config_revision = 9;
  string release_bundle_id = 10;
  string published_release_bundle_ref = 11;
  int64 version_state_epoch = 12;
  string remap_set_id = 13;
}

message PrepareWorldInstanceResponse {
  WorldInstanceLifecycleSnapshot world_instance = 1;
  shared.v1.ErrorDetail error = 2;
}

message ActivatePreparedWorldInstanceRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  int64 expected_lifecycle_epoch = 3;
}

message ActivatePreparedWorldInstanceResponse {
  WorldInstanceLifecycleSnapshot world_instance = 1;
  shared.v1.ErrorDetail error = 2;
}

message FailPreparedWorldInstanceRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  int64 expected_lifecycle_epoch = 3;
  string reason = 4;
}

message FailPreparedWorldInstanceResponse {
  WorldInstanceLifecycleSnapshot world_instance = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetWorldInstanceLifecycleRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
}

message GetWorldInstanceLifecycleResponse {
  WorldInstanceLifecycleSnapshot world_instance = 1;
  shared.v1.ErrorDetail error = 2;
}

message TerminateWorldInstanceRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  int64 expected_lifecycle_epoch = 3;
  string termination_request_id = 4;
  string reason = 5;
}

message TerminateWorldInstanceResponse {
  WorldInstanceLifecycleSnapshot world_instance = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetRoomRequest {
  string tenant_id = 1;
  shared.v1.RoomInstanceRef room_instance = 2;
  string session_attestation = 3;
}

message GetRoomResponse {
  string room_json = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetRoomSnapshotRequest {
  string tenant_id = 1;
  shared.v1.RoomInstanceRef room_instance = 2;
  string preferred_locale = 3;
  string session_attestation = 4;
}

message GetRoomSnapshotResponse {
  RoomSnapshot snapshot = 1;
  shared.v1.ErrorDetail error = 2;
}

message RoomSnapshot {
  string tenant_id = 1;
  string room_name = 2;
  string short_description = 3;
  string long_description = 4;
  repeated RoomExitSnapshot exits = 5;
  repeated string room_flags = 6;
  string game_instance_id = 7;
  string room_instance_id = 8;
  string world_snapshot_id = 9;
  RoomAmbientState ambient_state = 10;
}

message RoomExitSnapshot {
  string exit_id = 1;
  string target_room_name = 2;
  string direction = 3;
  string label = 4;
  string description = 5;
  int32 cost = 6;
  string target_room_instance_id = 7;
}

message ListRoomOccupantsRequest {
  shared.v1.RoomInstanceRef room_instance = 1;
  string session_attestation = 2;
}

message ListRoomOccupantsResponse {
  shared.v1.RoomInstanceRef room_instance = 1;
  string occupant_snapshot_id = 2;
  shared.v1.ErrorDetail error = 3;
  repeated RoomOccupant occupants = 4;
}

message ApplyRoomAmbientStatePatchRequest {
  shared.v1.RoomInstanceRef room_instance = 1;
  string effect_id = 2;
  RoomAmbientStatePatch ambient_state_patch = 3;
  string session_attestation = 4;
}

message ApplyRoomAmbientStatePatchResponse {
  shared.v1.RoomInstanceRef room_instance = 1;
  bool success = 2;
  string world_snapshot_id = 3;
  shared.v1.ErrorDetail error = 4;
}

enum RoomOccupantType {
  ROOM_OCCUPANT_TYPE_UNSPECIFIED = 0;
  PLAYER = 1;
  NPC = 2;
}

message RoomOccupant {
  string entity_id = 1;
  RoomOccupantType occupant_type = 2;
}

message RoomAmbientState {
  int32 schema_version = 1;
  string weather = 2;
  repeated DoorAmbientState doors = 3;
  repeated HazardAmbientState hazards = 4;
}

enum DoorState {
  DOOR_STATE_UNSPECIFIED = 0;
  OPEN = 1;
  CLOSED = 2;
  LOCKED = 3;
}

message DoorAmbientState {
  string door_id = 1;
  DoorState state = 2;
}

enum HazardState {
  HAZARD_STATE_UNSPECIFIED = 0;
  ACTIVE = 1;
  INACTIVE = 2;
}

message HazardAmbientState {
  string hazard_id = 1;
  HazardState state = 2;
}

message RoomAmbientStatePatch {
  int32 schema_version = 1;
  optional string weather = 2;
  repeated DoorAmbientState doors = 3;
  repeated HazardAmbientState hazards = 4;
}

message GetDraftDesignDigestRequest {
  string tenant_id = 1;
  oneof scope {
    string version_id = 2;
    string script_patch_version = 3;
  }
}

message GetDraftDesignDigestResponse {
  string tenant_id = 1;
  string scope_value = 2;
  string applied_commit_id = 3;
  string content_digest = 4;
  int32 digest_schema_version = 5;
  shared.v1.ErrorDetail error = 6;
}

enum WorldDesignMutationOperation {
  WORLD_DESIGN_MUTATION_OPERATION_UNSPECIFIED = 0;
  WORLD_DESIGN_MUTATION_OPERATION_UPSERT = 1;
  WORLD_DESIGN_MUTATION_OPERATION_DELETE = 2;
}

enum WorldDesignAggregateType {
  WORLD_DESIGN_AGGREGATE_TYPE_UNSPECIFIED = 0;
  WORLD_DESIGN_AGGREGATE_TYPE_REGION = 1;
  WORLD_DESIGN_AGGREGATE_TYPE_ZONE = 2;
  WORLD_DESIGN_AGGREGATE_TYPE_ROOM = 3;
  WORLD_DESIGN_AGGREGATE_TYPE_ROOM_EXIT = 4;
  WORLD_DESIGN_AGGREGATE_TYPE_GENERATION_RULE = 5;
  WORLD_DESIGN_AGGREGATE_TYPE_WORLD_ENTITY_SPAWN_BINDING = 6;
  WORLD_DESIGN_AGGREGATE_TYPE_WORLD_GENERATION_SUBTREE = 7;
}

enum WorldDesignMutationResult {
  WORLD_DESIGN_MUTATION_RESULT_UNSPECIFIED = 0;
  WORLD_DESIGN_MUTATION_RESULT_APPLIED = 1;
  WORLD_DESIGN_MUTATION_RESULT_NO_OP_ALREADY_APPLIED = 2;
}

enum WorldDesignScopeMutationPolicy {
  WORLD_DESIGN_SCOPE_MUTATION_POLICY_UNSPECIFIED = 0;
  WORLD_DESIGN_SCOPE_MUTATION_POLICY_REPLACE_SCOPE = 1;
  WORLD_DESIGN_SCOPE_MUTATION_POLICY_SEED_APPEND_ONLY = 2;
}

enum WorldDesignScopeType {
  WORLD_DESIGN_SCOPE_TYPE_UNSPECIFIED = 0;
  WORLD_DESIGN_SCOPE_TYPE_REGION_SUBTREE = 1;
  WORLD_DESIGN_SCOPE_TYPE_ZONE_SUBTREE = 2;
  WORLD_DESIGN_SCOPE_TYPE_NEW_EMPTY_REGION = 3;
}

message ApplyWorldDesignMutationRequest {
  string tenant_id = 1;
  string version_id = 2;
  string commit_id = 3;
  string revision_id = 4;
  WorldDesignMutationOperation operation = 5;
  WorldDesignAggregateType aggregate_type = 6;
  string aggregate_id = 7;
  int64 expected_draft_revision_epoch = 8;
  WorldDesignScopeType scope_type = 9;
  string scope_id = 10;
  int64 expected_draft_scope_revision_epoch = 11;
  WorldDesignScopeMutationPolicy scope_mutation_policy = 12;
  oneof payload {
    RegionDesignMutation region = 20;
    ZoneDesignMutation zone = 21;
    RoomDesignMutation room = 22;
    RoomExitDesignMutation room_exit = 23;
    GenerationRuleDesignMutation generation_rule = 24;
    WorldEntitySpawnBindingDesignMutation world_entity_spawn_binding = 25;
    WorldGenerationSubtreeDesignMutation world_generation_subtree = 26;
  }
}

message RegionDesignMutation {
  string name = 1;
  string weather = 2;
  int32 shard_id = 3;
  int64 generation_seed = 4;
  string generator_type = 5;
  string generator_params = 6;
  double spacing_multiplier = 7;
}

message ZoneDesignMutation {
  string name = 1;
  string region_id = 2;
}

message RoomDesignMutation {
  string name = 1;
  string description = 2;
  string zone_id = 3;
  string name_localized_variants_json = 4;
  string description_localized_variants_json = 5;
}

message RoomExitDesignMutation {
  string from_room_id = 1;
  string to_room_id = 2;
  string direction = 3;
  int32 cost = 4;
}

message GenerationRuleDesignMutation {
  string name = 1;
  string value = 2;
}

enum EntityTemplateReferenceType {
  ENTITY_TEMPLATE_REFERENCE_TYPE_UNSPECIFIED = 0;
  ENTITY_TEMPLATE_REFERENCE_TYPE_ITEM = 1;
  ENTITY_TEMPLATE_REFERENCE_TYPE_NPC = 2;
}

message WorldEntitySpawnBindingDesignMutation {
  string room_id = 1;
  EntityTemplateReferenceType entity_template_type = 2;
  string entity_template_id = 3;
  int32 spawn_count = 4;
  int32 respawn_delay_seconds = 5;
}

message WorldGenerationSubtreeDesignMutation {
  repeated GenerationRuleDesignMutation generation_rules = 1;
  repeated GeneratedRoomDesignMutation rooms = 2;
  repeated GeneratedRoomExitDesignMutation room_exits = 3;
  repeated GeneratedWorldEntitySpawnBindingDesignMutation world_entity_spawn_bindings = 4;
}

message GeneratedRoomDesignMutation {
  string client_ref = 1;
  string name = 2;
  string description = 3;
  string zone_id = 4;
  string name_localized_variants_json = 5;
  string description_localized_variants_json = 6;
}

message GeneratedRoomExitDesignMutation {
  string from_room_ref = 1;
  string to_room_ref = 2;
  string direction = 3;
  int32 cost = 4;
}

message GeneratedWorldEntitySpawnBindingDesignMutation {
  string room_ref = 1;
  EntityTemplateReferenceType entity_template_type = 2;
  string entity_template_id = 3;
  int32 spawn_count = 4;
  int32 respawn_delay_seconds = 5;
}

message ApplyWorldDesignMutationResponse {
  WorldDesignMutationResult result = 1;
  string tenant_id = 2;
  string version_id = 3;
  string aggregate_id = 4;
  int64 draft_revision_epoch = 5;
  int64 draft_scope_revision_epoch = 6;
  shared.v1.ErrorDetail error = 7;
}

enum UpgradeValidationResult {
  UPGRADE_VALIDATION_RESULT_UNSPECIFIED = 0;
  UPGRADE_VALIDATION_RESULT_COMPATIBLE = 1;
  UPGRADE_VALIDATION_RESULT_REQUIRES_MAPPING = 2;
  UPGRADE_VALIDATION_RESULT_INCOMPATIBLE = 3;
  UPGRADE_VALIDATION_RESULT_UNAVAILABLE = 4;
}

message ValidateWorldUpgradeMappingsRequest {
  string tenant_id = 1;
  string source_game_instance_id = 2;
  string target_version_id = 3;
  string remap_set_id = 4;
}

message ValidateWorldUpgradeMappingsResponse {
  repeated string state_classes_checked = 1;
  repeated string checked_families = 2;
  bool has_s2_rows = 3;
  UpgradeValidationResult result = 4;
  bool remap_set_required = 5;
  repeated string reasons = 6;
  string remap_set_id = 7;
  shared.v1.ErrorDetail error = 8;
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}
