syntax = "proto3";

package world_management.v1;

import "shared/v1/errors.proto";
import "shared/v1/instance_refs.proto";

option java_package = "net.firedevops.firemud.worldmanagement.v1";
option java_multiple_files = true;

service WorldManagementService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GetRoom(GetRoomRequest) returns (GetRoomResponse);
  rpc GetRoomSnapshot(GetRoomSnapshotRequest) returns (GetRoomSnapshotResponse);
  rpc GetDraftDesignDigest(GetDraftDesignDigestRequest) returns (GetDraftDesignDigestResponse);
  rpc ListRoomOccupants(ListRoomOccupantsRequest) returns (ListRoomOccupantsResponse);
  rpc ApplyRoomAmbientStatePatch(ApplyRoomAmbientStatePatchRequest) returns (ApplyRoomAmbientStatePatchResponse);
}

message GetRoomRequest {
  string tenant_id = 1;
  shared.v1.RoomInstanceRef room_instance = 2;
}

message GetRoomResponse {
  string room_json = 1;
  shared.v1.ErrorDetail error = 2;
}

message GetRoomSnapshotRequest {
  string tenant_id = 1;
  shared.v1.RoomInstanceRef room_instance = 2;
}

message GetRoomSnapshotResponse {
  RoomSnapshot snapshot = 1;
  shared.v1.ErrorDetail error = 2;
}

message RoomSnapshot {
  string tenant_id = 1;
  string room_name = 2;
  string short_description = 3;
  string long_description = 4;
  repeated RoomExitSnapshot exits = 5;
  repeated string room_flags = 6;
  string game_instance_id = 7;
  string room_instance_id = 8;
  string world_snapshot_id = 9;
  RoomAmbientState ambient_state = 10;
}

message RoomExitSnapshot {
  string exit_id = 1;
  string target_room_name = 2;
  string direction = 3;
  string label = 4;
  string description = 5;
  int32 cost = 6;
  string target_room_instance_id = 7;
}

message ListRoomOccupantsRequest {
  shared.v1.RoomInstanceRef room_instance = 1;
}

message ListRoomOccupantsResponse {
  shared.v1.RoomInstanceRef room_instance = 1;
  string occupant_snapshot_id = 2;
  shared.v1.ErrorDetail error = 3;
  repeated RoomOccupant occupants = 4;
}

message ApplyRoomAmbientStatePatchRequest {
  shared.v1.RoomInstanceRef room_instance = 1;
  string effect_id = 2;
  RoomAmbientStatePatch ambient_state_patch = 3;
}

message ApplyRoomAmbientStatePatchResponse {
  shared.v1.RoomInstanceRef room_instance = 1;
  bool success = 2;
  string world_snapshot_id = 3;
  shared.v1.ErrorDetail error = 4;
}

enum RoomOccupantType {
  ROOM_OCCUPANT_TYPE_UNSPECIFIED = 0;
  PLAYER = 1;
  NPC = 2;
}

message RoomOccupant {
  string entity_id = 1;
  RoomOccupantType occupant_type = 2;
}

message RoomAmbientState {
  int32 schema_version = 1;
  string weather = 2;
  repeated DoorAmbientState doors = 3;
  repeated HazardAmbientState hazards = 4;
}

enum DoorState {
  DOOR_STATE_UNSPECIFIED = 0;
  OPEN = 1;
  CLOSED = 2;
  LOCKED = 3;
}

message DoorAmbientState {
  string door_id = 1;
  DoorState state = 2;
}

enum HazardState {
  HAZARD_STATE_UNSPECIFIED = 0;
  ACTIVE = 1;
  INACTIVE = 2;
}

message HazardAmbientState {
  string hazard_id = 1;
  HazardState state = 2;
}

message RoomAmbientStatePatch {
  int32 schema_version = 1;
  optional string weather = 2;
  repeated DoorAmbientState doors = 3;
  repeated HazardAmbientState hazards = 4;
}

message GetDraftDesignDigestRequest {
  string tenant_id = 1;
  string version_id = 2;
}

message GetDraftDesignDigestResponse {
  string tenant_id = 1;
  string version_id = 2;
  string applied_commit_id = 3;
  string content_digest = 4;
  int32 digest_schema_version = 5;
  shared.v1.ErrorDetail error = 6;
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}
