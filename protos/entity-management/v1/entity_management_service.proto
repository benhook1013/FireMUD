syntax = "proto3";

package entity_management.v1;

import "shared/v1/errors.proto";
import "shared/v1/instance_refs.proto";

option java_package = "net.firedevops.firemud.entitymanagement.v1";
option java_multiple_files = true;

service EntityManagementService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);
  rpc UpdateEntity(UpdateEntityRequest) returns (UpdateEntityResponse);
  rpc QueryInventory(QueryInventoryRequest) returns (QueryInventoryResponse);
  rpc ListEquipment(ListEquipmentRequest) returns (ListEquipmentResponse);
  rpc WearEquipment(WearEquipmentItemRequest) returns (WearEquipmentItemResponse);
  rpc RemoveEquipment(RemoveEquipmentRequest) returns (RemoveEquipmentResponse);
  rpc ListContainerContents(ListContainerContentsRequest) returns (ListContainerContentsResponse);
  rpc PutItemIntoContainer(PutItemIntoContainerRequest) returns (PutItemIntoContainerResponse);
  rpc TakeItemFromContainer(TakeItemFromContainerRequest) returns (TakeItemFromContainerResponse);
  rpc ListRoomGroundInventory(ListRoomGroundInventoryRequest)
      returns (ListRoomGroundInventoryResponse);
  rpc PickupItemFromRoom(PickupItemFromRoomRequest) returns (PickupItemFromRoomResponse);
  rpc DropItemToRoom(DropItemToRoomRequest) returns (DropItemToRoomResponse);
  rpc ListCharactersByAccount(ListCharactersByAccountRequest) returns (ListCharactersByAccountResponse);
  rpc FindCharacterByName(FindCharacterByNameRequest) returns (FindCharacterByNameResponse);
  rpc ListRoomEntities(ListRoomEntitiesRequest) returns (ListRoomEntitiesResponse);
  rpc CleanupRuntimeInstance(CleanupRuntimeInstanceRequest) returns (CleanupRuntimeInstanceResponse);
  rpc GetDraftDesignDigest(GetDraftDesignDigestRequest) returns (GetDraftDesignDigestResponse);
  rpc ValidateEntityUpgradeMappings(ValidateEntityUpgradeMappingsRequest)
      returns (ValidateEntityUpgradeMappingsResponse);
}

message CreateCharacterRequest {
  string tenant_id = 1;
  string account_id = 2;
  string name = 3;
  string game_instance_id = 4;
  PlayableStateScope playable_state_scope = 5;
}

message CreateCharacterResponse {
  string character_id = 1;
  shared.v1.ErrorDetail error = 2;
}

message UpdateEntityRequest {
  string entity_id = 1;
}

message UpdateEntityResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message QueryInventoryRequest {
  string tenant_id = 1;
  string character_id = 2;
  string session_attestation = 3;
}

message QueryInventoryResponse {
  repeated InventoryItem items = 1;
  shared.v1.ErrorDetail error = 2;
}

message InventoryItem {
  string item_id = 1;
  string item_name = 2;
  string item_description = 3;
  int32 quantity = 4;
  string container_instance_id = 5;
  string item_instance_id = 6;
  string visible_ref = 7;
}

message EquipmentItem {
  string tenant_id = 1;
  string character_id = 2;
  string slot = 3;
  string item_id = 4;
  string item_name = 5;
  string item_description = 6;
  string container_instance_id = 7;
  string item_instance_id = 8;
  string visible_ref = 9;
}

message ListEquipmentRequest {
  string tenant_id = 1;
  string character_id = 2;
  string session_attestation = 3;
}

message ListEquipmentResponse {
  repeated EquipmentItem items = 1;
  shared.v1.ErrorDetail error = 2;
}

message WearEquipmentItemRequest {
  string tenant_id = 1;
  string character_id = 2;
  string item_id = 3;
  string item_instance_id = 4;
  string session_attestation = 5;
  string effect_id = 6;
}

message WearEquipmentItemResponse {
  EquipmentItem equipment_item = 1;
  shared.v1.ErrorDetail error = 2;
}

message RemoveEquipmentRequest {
  string tenant_id = 1;
  string character_id = 2;
  string slot = 3;
  string session_attestation = 4;
  string effect_id = 5;
}

message RemoveEquipmentResponse {
  EquipmentItem equipment_item = 1;
  shared.v1.ErrorDetail error = 2;
}

message ContainerItem {
  string tenant_id = 1;
  string character_id = 2;
  string container_instance_id = 3;
  string item_id = 4;
  string item_name = 5;
  string item_description = 6;
  int32 quantity = 7;
  string item_instance_id = 8;
  string visible_ref = 9;
}

message ListContainerContentsRequest {
  string tenant_id = 1;
  string character_id = 2;
  string container_instance_id = 3;
  string session_attestation = 4;
}

message ListContainerContentsResponse {
  repeated ContainerItem items = 1;
  shared.v1.ErrorDetail error = 2;
}

message PutItemIntoContainerRequest {
  string tenant_id = 1;
  string character_id = 2;
  string container_instance_id = 3;
  string item_id = 4;
  int32 quantity = 5;
  string item_instance_id = 6;
  string stack_family_key = 7;
  string session_attestation = 8;
  string effect_id = 9;
}

message PutItemIntoContainerResponse {
  ContainerItem container_item = 1;
  shared.v1.ErrorDetail error = 2;
}

message TakeItemFromContainerRequest {
  string tenant_id = 1;
  string character_id = 2;
  string container_instance_id = 3;
  string item_id = 4;
  int32 quantity = 5;
  string item_instance_id = 6;
  string stack_family_key = 7;
  string session_attestation = 8;
  string effect_id = 9;
}

message TakeItemFromContainerResponse {
  InventoryItem inventory_item = 1;
  shared.v1.ErrorDetail error = 2;
}

message RoomGroundInventoryItem {
  string tenant_id = 1;
  string game_instance_id = 2;
  string room_instance_id = 3;
  string item_id = 4;
  string item_name = 5;
  string item_description = 6;
  int32 quantity = 7;
  string container_instance_id = 8;
  string item_instance_id = 9;
  string visible_ref = 10;
}

message ListRoomGroundInventoryRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string room_instance_id = 3;
  string session_attestation = 4;
}

message ListRoomGroundInventoryResponse {
  repeated RoomGroundInventoryItem items = 1;
  shared.v1.ErrorDetail error = 2;
}

message PickupItemFromRoomRequest {
  string tenant_id = 1;
  string character_id = 2;
  string game_instance_id = 3;
  string room_instance_id = 4;
  string item_id = 5;
  int32 quantity = 6;
  string container_instance_id = 7;
  string item_instance_id = 8;
  string stack_family_key = 9;
  string session_attestation = 10;
  string effect_id = 11;
}

message PickupItemFromRoomResponse {
  InventoryItem inventory_item = 1;
  RoomGroundInventoryItem room_ground_item = 2;
  shared.v1.ErrorDetail error = 3;
}

message DropItemToRoomRequest {
  string tenant_id = 1;
  string character_id = 2;
  string game_instance_id = 3;
  string room_instance_id = 4;
  string item_id = 5;
  int32 quantity = 6;
  string container_instance_id = 7;
  string item_instance_id = 8;
  string stack_family_key = 9;
  string session_attestation = 10;
  string effect_id = 11;
}

message DropItemToRoomResponse {
  InventoryItem inventory_item = 1;
  RoomGroundInventoryItem room_ground_item = 2;
  shared.v1.ErrorDetail error = 3;
}

enum PlayableStateScope {
  PLAYABLE_STATE_SCOPE_UNSPECIFIED = 0;
  PLAYABLE_STATE_SCOPE_SHARED = 1;
  PLAYABLE_STATE_SCOPE_ISOLATED = 2;
}

message ListCharactersByAccountRequest {
  string tenant_id = 1;
  string account_id = 2;
  string game_instance_id = 3;
  PlayableStateScope playable_state_scope = 4;
}

message Character {
  string id = 1;
  string tenant_id = 2;
  string account_id = 3;
  string name = 4;
  int32 level = 5;
  int32 experience = 6;
  int32 strength = 7;
  int32 agility = 8;
  int32 intelligence = 9;
  int32 stamina = 10;
  int32 health = 11;
  int32 mana = 12;
}

message ListCharactersByAccountResponse {
  repeated Character characters = 1;
  shared.v1.ErrorDetail error = 2;
}

message FindCharacterByNameRequest {
  string tenant_id = 1;
  string name = 2;
  string game_instance_id = 3;
  PlayableStateScope playable_state_scope = 4;
  string session_attestation = 5;
}

message FindCharacterByNameResponse {
  Character character = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListRoomEntitiesRequest {
  string tenant_id = 1;
  shared.v1.RoomInstanceRef room_instance = 2;
  string session_attestation = 3;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  PLAYER = 1;
  NPC = 2;
  ITEM = 3;
}

enum ReloadHint {
  RELOAD_HINT_UNSPECIFIED = 0;
  STABLE = 1;
  PLAYER_ENTERED = 2;
  PLAYER_LEFT = 3;
}

message RoomEntity {
  string entity_id = 1;
  string display_name = 2;
  EntityType entity_type = 3;
  string role = 4;
  repeated string state_flags = 5;
  int32 vision_priority = 6;
  ReloadHint reload_hint = 7;
  bool visible = 8;
  string visible_ref = 9;
}

message ListRoomEntitiesResponse {
  repeated RoomEntity entities = 1;
  shared.v1.ErrorDetail error = 2;
  string entity_snapshot_id = 3;
  string tenant_id = 4;
  string game_instance_id = 5;
  string room_instance_id = 6;
}

message CleanupRuntimeInstanceRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string termination_request_id = 3;
}

message CleanupRuntimeInstanceResponse {
  int64 deleted_room_ground_entries = 1;
  int64 deleted_item_stacks = 2;
  int64 deleted_item_instances = 3;
  int64 deleted_container_instances = 4;
  shared.v1.ErrorDetail error = 5;
}

message GetDraftDesignDigestRequest {
  string tenant_id = 1;
  oneof scope {
    string version_id = 2;
    string script_patch_version = 3;
  }
}

message GetDraftDesignDigestResponse {
  string tenant_id = 1;
  string scope_value = 2;
  string applied_commit_id = 3;
  string content_digest = 4;
  int32 digest_schema_version = 5;
  shared.v1.ErrorDetail error = 6;
}

enum UpgradeValidationResult {
  UPGRADE_VALIDATION_RESULT_UNSPECIFIED = 0;
  UPGRADE_VALIDATION_RESULT_COMPATIBLE = 1;
  UPGRADE_VALIDATION_RESULT_REQUIRES_MAPPING = 2;
  UPGRADE_VALIDATION_RESULT_INCOMPATIBLE = 3;
  UPGRADE_VALIDATION_RESULT_UNAVAILABLE = 4;
}

message ValidateEntityUpgradeMappingsRequest {
  string tenant_id = 1;
  string source_game_instance_id = 2;
  string target_version_id = 3;
  string remap_set_id = 4;
}

message ValidateEntityUpgradeMappingsResponse {
  repeated string state_classes_checked = 1;
  repeated string checked_families = 2;
  bool has_s2_rows = 3;
  UpgradeValidationResult result = 4;
  bool remap_set_required = 5;
  repeated string reasons = 6;
  string remap_set_id = 7;
  shared.v1.ErrorDetail error = 8;
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}
