  PLAYABLE_STATE_SCOPE_SHARED = 1;
  PLAYABLE_STATE_SCOPE_ISOLATED = 2;
}

message ListCharactersByAccountRequest {
  string tenant_id = 1;
  string account_id = 2;
  string game_instance_id = 3;
  PlayableStateScope playable_state_scope = 4;
}

message Character {
  string id = 1;
  string tenant_id = 2;
  string account_id = 3;
  string name = 4;
  int32 level = 5;
  int32 experience = 6;
  int32 strength = 7;
  int32 agility = 8;
  int32 intelligence = 9;
  int32 stamina = 10;
  int32 health = 11;
  int32 mana = 12;
  PlayableStateScope playable_state_scope = 13;
}

message ListCharactersByAccountResponse {
  repeated Character characters = 1;
  shared.v1.ErrorDetail error = 2;
}

message FindCharacterByNameRequest {
  string tenant_id = 1;
  string name = 2;
  string game_instance_id = 3;
  PlayableStateScope playable_state_scope = 4;
  string session_attestation = 5;
}

message FindCharacterByNameResponse {
  Character character = 1;
  shared.v1.ErrorDetail error = 2;
}

message QueryActorStateRequest {
  string tenant_id = 1;
  string character_id = 2;
  string game_instance_id = 3;
  PlayableStateScope playable_state_scope = 4;
  string session_attestation = 5;
}

message ActorResourceValue {
  string stat_key = 1;
  int64 current_value = 2;
  optional int64 max_value = 3;
  optional int64 base_value = 4;
  string primitive_kind = 5;
  string source_type = 6;
  string source_id = 7;
}

message ActorConditionState {
  string condition_key = 1;
  int32 stack_count = 2;
  string source_type = 3;
  string source_id = 4;
  string started_at = 5;
  string expires_at = 6;
  string effect_payload_json = 7;
}

message QueryActorStateResponse {
  string tenant_id = 1;
  string game_instance_id = 2;
  string character_id = 3;
  repeated ActorResourceValue resources = 4;
  repeated ActorConditionState active_conditions = 5;
  shared.v1.ErrorDetail error = 6;
}

message ApplyActorConditionRequest {
  string tenant_id = 1;
  string character_id = 2;
  string game_instance_id = 3;
  PlayableStateScope playable_state_scope = 4;
  string session_attestation = 5;
  string condition_key = 6;
  int32 stack_count = 7;
  string source_type = 8;
  string source_id = 9;
  string expires_at = 10;
  string effect_payload_json = 11;
}

message ApplyActorConditionResponse {
  ActorConditionState active_condition = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListRoomEntitiesRequest {
  string tenant_id = 1;
  shared.v1.RoomInstanceRef room_instance = 2;
  string session_attestation = 3;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  PLAYER = 1;
  NPC = 2;
  ITEM = 3;
}

enum ReloadHint {
  RELOAD_HINT_UNSPECIFIED = 0;
  STABLE = 1;
  PLAYER_ENTERED = 2;
  PLAYER_LEFT = 3;
}

message RoomEntity {
  string entity_id = 1;
  string display_name = 2;
  EntityType entity_type = 3;
  string role = 4;
  repeated string state_flags = 5;
  int32 vision_priority = 6;
  ReloadHint reload_hint = 7;
  bool visible = 8;
  string visible_ref = 9;
}

message ListRoomEntitiesResponse {
  repeated RoomEntity entities = 1;
  shared.v1.ErrorDetail error = 2;
  string entity_snapshot_id = 3;
  string tenant_id = 4;
  string game_instance_id = 5;
  string room_instance_id = 6;
}

message CleanupRuntimeInstanceRequest {
  string tenant_id = 1;
  string game_instance_id = 2;
  string termination_request_id = 3;
}

message CleanupRuntimeInstanceResponse {
  int64 deleted_room_ground_entries = 1;
  int64 deleted_item_stacks = 2;
  int64 deleted_item_instances = 3;
  int64 deleted_container_instances = 4;
  shared.v1.ErrorDetail error = 5;
}

message GetDraftDesignDigestRequest {
  string tenant_id = 1;
  oneof scope {
    string version_id = 2;
    string script_patch_version = 3;
  }
  string base_version_id = 4;
  string publish_request_id = 5;
  string derived_workflow_identity = 6;
  string request_digest = 7;
}

message GetDraftDesignDigestResponse {
  string tenant_id = 1;
  reserved 2;
  reserved "scope_value";
  string applied_commit_id = 3;
  string content_digest = 4;
  int32 digest_schema_version = 5;
  shared.v1.ErrorDetail error = 6;
  oneof scope {
    string version_id = 7;
    string script_patch_version = 8;
  }
  string base_version_id = 9;
}

enum EntityTemplateReferenceType {
  ENTITY_TEMPLATE_REFERENCE_TYPE_UNSPECIFIED = 0;
  ENTITY_TEMPLATE_REFERENCE_TYPE_ITEM = 1;
  ENTITY_TEMPLATE_REFERENCE_TYPE_NPC = 2;
}

message ValidateEntityTemplateReferenceRequest {
  string tenant_id = 1;
  string version_id = 2;
  EntityTemplateReferenceType template_type = 3;
  string template_id = 4;
}

message ValidateEntityTemplateReferenceResponse {
  bool exists = 1;
  shared.v1.ErrorDetail error = 2;
}

enum UpgradeValidationResult {
  UPGRADE_VALIDATION_RESULT_UNSPECIFIED = 0;
  UPGRADE_VALIDATION_RESULT_COMPATIBLE = 1;
  UPGRADE_VALIDATION_RESULT_REQUIRES_MAPPING = 2;
  UPGRADE_VALIDATION_RESULT_INCOMPATIBLE = 3;
  UPGRADE_VALIDATION_RESULT_UNAVAILABLE = 4;
}

message ValidateEntityUpgradeMappingsRequest {
  string tenant_id = 1;
  string source_game_instance_id = 2;
  string target_version_id = 3;
  string remap_set_id = 4;
}

message ValidateEntityUpgradeMappingsResponse {
  repeated string state_classes_checked = 1;
  repeated string checked_families = 2;
  bool has_s2_rows = 3;
  UpgradeValidationResult result = 4;
  bool remap_set_required = 5;
  repeated string reasons = 6;
  string remap_set_id = 7;
  shared.v1.ErrorDetail error = 8;
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}
