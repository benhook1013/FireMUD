syntax = "proto3";

package entity_management.v1;

import "shared/v1/errors.proto";
import "shared/v1/instance_refs.proto";

option java_package = "net.firedevops.firemud.entitymanagement.v1";
option java_multiple_files = true;

service EntityManagementService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);
  rpc UpdateEntity(UpdateEntityRequest) returns (UpdateEntityResponse);
  rpc QueryInventory(QueryInventoryRequest) returns (QueryInventoryResponse);
  rpc ListCharactersByAccount(ListCharactersByAccountRequest) returns (ListCharactersByAccountResponse);
  rpc FindCharacterByName(FindCharacterByNameRequest) returns (FindCharacterByNameResponse);
  rpc ListRoomEntities(ListRoomEntitiesRequest) returns (ListRoomEntitiesResponse);
  rpc GetDraftDesignDigest(GetDraftDesignDigestRequest) returns (GetDraftDesignDigestResponse);
}

message CreateCharacterRequest {
  string tenant_id = 1;
  string account_id = 2;
  string name = 3;
}

message CreateCharacterResponse {
  string character_id = 1;
  shared.v1.ErrorDetail error = 2;
}

message UpdateEntityRequest {
  string entity_id = 1;
}

message UpdateEntityResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message QueryInventoryRequest {
  string entity_id = 1;
}

message QueryInventoryResponse {
  repeated string item_ids = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListCharactersByAccountRequest {
  string account_id = 1;
}

message Character {
  string id = 1;
  string tenant_id = 2;
  string account_id = 3;
  string name = 4;
  int32 level = 5;
  int32 experience = 6;
  int32 strength = 7;
  int32 agility = 8;
  int32 intelligence = 9;
  int32 stamina = 10;
  int32 health = 11;
  int32 mana = 12;
}

message ListCharactersByAccountResponse {
  repeated Character characters = 1;
  shared.v1.ErrorDetail error = 2;
}

message FindCharacterByNameRequest {
  string tenant_id = 1;
  string name = 2;
}

message FindCharacterByNameResponse {
  Character character = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListRoomEntitiesRequest {
  string tenant_id = 1;
  shared.v1.RoomInstanceRef room_instance = 2;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  PLAYER = 1;
  NPC = 2;
  ITEM = 3;
}

enum ReloadHint {
  RELOAD_HINT_UNSPECIFIED = 0;
  STABLE = 1;
  PLAYER_ENTERED = 2;
  PLAYER_LEFT = 3;
}

message RoomEntity {
  string entity_id = 1;
  string display_name = 2;
  EntityType entity_type = 3;
  string role = 4;
  repeated string state_flags = 5;
  int32 vision_priority = 6;
  ReloadHint reload_hint = 7;
  bool visible = 8;
}

message ListRoomEntitiesResponse {
  repeated RoomEntity entities = 1;
  shared.v1.ErrorDetail error = 2;
  string entity_snapshot_id = 3;
  string tenant_id = 4;
  string game_instance_id = 5;
  string room_instance_id = 6;
}

message GetDraftDesignDigestRequest {
  string tenant_id = 1;
  string version_id = 2;
}

message GetDraftDesignDigestResponse {
  string tenant_id = 1;
  string version_id = 2;
  string applied_commit_id = 3;
  string content_digest = 4;
  int32 digest_schema_version = 5;
  shared.v1.ErrorDetail error = 6;
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}
