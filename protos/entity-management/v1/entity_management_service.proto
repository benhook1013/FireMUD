syntax = "proto3";

package entity_management.v1;

import "shared/v1/errors.proto";

option java_package = "net.firedevops.firemud.entitymanagement.v1";
option java_multiple_files = true;

service EntityManagementService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);
  rpc UpdateEntity(UpdateEntityRequest) returns (UpdateEntityResponse);
  rpc QueryInventory(QueryInventoryRequest) returns (QueryInventoryResponse);
  rpc ListCharactersByAccount(ListCharactersRequest) returns (ListCharactersResponse);
}

message CreateCharacterRequest {
  string tenant_id = 1;
  string account_id = 2;
  string name = 3;
}

message CreateCharacterResponse {
  string character_id = 1;
  shared.v1.ErrorDetail error = 2;
}

message UpdateEntityRequest {
  string entity_id = 1;
}

message UpdateEntityResponse {
  bool success = 1;
  shared.v1.ErrorDetail error = 2;
}

message QueryInventoryRequest {
  string entity_id = 1;
}

message QueryInventoryResponse {
  repeated string item_ids = 1;
  shared.v1.ErrorDetail error = 2;
}

message ListCharactersRequest {
  string account_id = 1;
}

message Character {
  string id = 1;
  string tenant_id = 2;
  string account_id = 3;
  string name = 4;
  int32 level = 5;
  int32 experience = 6;
  int32 strength = 7;
  int32 agility = 8;
  int32 intelligence = 9;
  int32 stamina = 10;
  int32 health = 11;
  int32 mana = 12;
}

message ListCharactersResponse {
  repeated Character characters = 1;
  shared.v1.ErrorDetail error = 2;
}

message PingRequest {}

message PingResponse {
  string message = 1;
  shared.v1.ErrorDetail error = 2;
}
