syntax = "proto3";

package entity_management.v1;

import "entity-management/v1/entity_management_service.proto";

option java_package = "net.firedevops.firemud.entitymanagement.v1";
option java_multiple_files = true;

// Manually composed and unregistered non-admitting Account discovery. This transient
// projection creates no original selection, roster snapshot, retention or session.
service AccountBootstrapRosterReadService {
  // Exact same-workload-namespace Account mTLS is required before request decoding.
  // Only independently current public-production SHARED PRESEEDED_ONLY targets are
  // supported. A valid empty persisted roster succeeds; unsupported, stale and
  // unavailable sources never become an empty success. Failures use non-OK status.
  rpc ReadAccountBootstrapRoster(AccountBootstrapRosterReadRequest)
      returns (AccountBootstrapRosterReadResponse);
}

message AccountBootstrapRosterReadRequest {
  string request_uuid = 1;
  string canonical_account_uuid = 2;
  string target_namespace = 3;
  CanonicalGameplayRosterTarget expected_target = 4;
}

message AccountBootstrapRosterReadResponse {
  // Complete exact request echo, including every source digest and target counter.
  AccountBootstrapRosterReadRequest request = 1;
  // At most 100 persisted eligible actors, ordered by canonical UUID text.
  repeated AccountBootstrapRosterActor actors = 2;
}

message AccountBootstrapRosterActor {
  string character_uuid = 1;
  string display_name = 2;
  // Existing Entity-owned persisted level from the same eligible actor row, including real zero.
  optional int32 level = 3;
}
