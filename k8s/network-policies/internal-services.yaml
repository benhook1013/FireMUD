apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: firemud
  name: internal-services
# Ensure Helm release names for PostgreSQL and Redis match the labels below.
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values:
          - spring-cloud-gateway
          - tcp-proxy-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 6565
        - protocol: TCP
          port: 4317
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: firemud-postgresql
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: firemud-redis
      ports:
        - protocol: TCP
          port: 6379
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: NotIn
                values:
                  - spring-cloud-gateway
                  - tcp-proxy-service
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 6565
        - protocol: TCP
          port: 4317
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: firemud-postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: firemud-redis
      ports:
        - protocol: TCP
          port: 6379
