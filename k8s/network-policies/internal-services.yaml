apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-services
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values:
          - spring-cloud-gateway
          - tcp-proxy-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 6565
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: firemud-postgresql
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: firemud-redis
      ports:
        - protocol: TCP
          port: 6379
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 6565
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: firemud-postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: firemud-redis
      ports:
        - protocol: TCP
          port: 6379
