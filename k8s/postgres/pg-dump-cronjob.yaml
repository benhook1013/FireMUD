apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firemud-pg-dumps
  namespace: firemud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: firemud-pg-dump
  namespace: firemud
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16
              envFrom:
                - configMapRef:
                    name: firemud-config
                - secretRef:
                    name: postgres-credentials
              command: ["/bin/bash", "/scripts/pg-dump.sh"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: script
                  mountPath: /scripts
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: firemud-pg-dumps
            - name: script
              configMap:
                name: pg-dump-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-dump-script
  namespace: firemud
data:
  pg-dump.sh: |
    #!/usr/bin/env bash
    # Create a plain-SQL pg_dump, enforce retention, and optionally upload to
    # S3/MinIO. The scheduled hosted artifact is gzip-compressed SQL and is
    # restored with psql.
    set -euo pipefail

    BACKUP_DIR=${BACKUP_DIR:-/backups}
    BUCKET=${PG_DUMP_BUCKET:-}
    ENDPOINT=${PG_DUMP_ENDPOINT:-}
    PREFIX=firemud

    mkdir -p "$BACKUP_DIR/15min" "$BACKUP_DIR/daily" "$BACKUP_DIR/weekly" "$BACKUP_DIR/monthly"
    TS=$(date +%Y%m%d%H%M%S)
    DUMP="$BACKUP_DIR/15min/${PREFIX}_${TS}.sql.gz"

    # Install awscli if bucket upload is enabled and aws command missing
    if [ -n "$BUCKET" ] && ! command -v aws >/dev/null 2>&1; then
      apt-get update -y >/dev/null && apt-get install -y awscli >/dev/null
    fi

    pg_dump -Fp \
      -h "$FIREMUD_POSTGRES_HOST" \
      -U "$FIREMUD_POSTGRES_USER" \
      -d "$FIREMUD_POSTGRES_DB" | gzip > "$DUMP"

    HOUR=$(date +%H)
    # keep last 96 15min dumps
    cd "$BACKUP_DIR/15min"
    ls -1t ${PREFIX}_*.sql.gz | tail -n +97 | xargs -r rm --

    DOW=$(date +%u) # 1-7 (Mon-Sun)
    DOM=$(date +%d)

    if [ "$HOUR" = "00" ]; then
      DAILY_DEST="$BACKUP_DIR/daily/${PREFIX}_${TS}.sql.gz"
      cp "$DUMP" "$DAILY_DEST"
      cd "$BACKUP_DIR/daily"
      ls -1t ${PREFIX}_*.sql.gz | tail -n +11 | xargs -r rm --
    fi

    if [ "$DOW" = "7" ]; then
      WEEKLY_DEST="$BACKUP_DIR/weekly/${PREFIX}_${TS}.sql.gz"
      cp "$DUMP" "$WEEKLY_DEST"
      cd "$BACKUP_DIR/weekly"
      ls -1t ${PREFIX}_*.sql.gz | tail -n +4 | xargs -r rm --
    fi

    if [ "$DOM" = "01" ]; then
      MONTHLY_DEST="$BACKUP_DIR/monthly/${PREFIX}_${TS}.sql.gz"
      cp "$DUMP" "$MONTHLY_DEST"
      cd "$BACKUP_DIR/monthly"
      ls -1t ${PREFIX}_*.sql.gz | tail -n +4 | xargs -r rm --
    fi

    if [ -n "$BUCKET" ]; then
      AWS_ENDPOINT_ARGS=()
      if [ -n "$ENDPOINT" ]; then
        AWS_ENDPOINT_ARGS=(--endpoint-url "$ENDPOINT")
      fi
      echo "Uploading $DUMP to s3://$BUCKET"
      if ! aws s3 cp "$DUMP" "s3://$BUCKET/15min/" "${AWS_ENDPOINT_ARGS[@]}"; then
        echo "Failed to upload 15min dump" >&2
        exit 1
      fi
      if [ "$HOUR" = "00" ]; then
        if ! aws s3 cp "$DUMP" "s3://$BUCKET/daily/" "${AWS_ENDPOINT_ARGS[@]}"; then
          echo "Failed to upload daily dump" >&2
          exit 1
        fi
      fi
      if [ "$DOW" = "7" ]; then
        if ! aws s3 cp "$DUMP" "s3://$BUCKET/weekly/" "${AWS_ENDPOINT_ARGS[@]}"; then
          echo "Failed to upload weekly dump" >&2
          exit 1
        fi
      fi
      if [ "$DOM" = "01" ]; then
        if ! aws s3 cp "$DUMP" "s3://$BUCKET/monthly/" "${AWS_ENDPOINT_ARGS[@]}"; then
          echo "Failed to upload monthly dump" >&2
          exit 1
        fi
      fi
    fi
