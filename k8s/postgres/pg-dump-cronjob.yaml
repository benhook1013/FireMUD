apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firemud-pg-dumps
  namespace: firemud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: firemud-pg-dump
  namespace: firemud
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16
              envFrom:
                - configMapRef:
                    name: firemud-config
                - secretRef:
                    name: postgres-credentials
              command: ["/bin/bash", "/scripts/pg-dump.sh"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: script
                  mountPath: /scripts
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: firemud-pg-dumps
            - name: script
              configMap:
                name: pg-dump-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-dump-script
  namespace: firemud
data:
  pg-dump.sh: |
    #!/usr/bin/env bash
    # shellcheck disable=SC2012 # Retention names are canonical generated artifact names.
    # Create a pg_dump, enforce retention, and optionally upload to S3/MinIO
    set -euo pipefail

    BACKUP_DIR=${BACKUP_DIR:-/backups}
    BUCKET=${PG_DUMP_BUCKET:-}
    ENDPOINT=${PG_DUMP_ENDPOINT:-}
    ENDPOINT_IF_NONE_MATCH_CONFIRMED=${PG_DUMP_ENDPOINT_IF_NONE_MATCH_CONFIRMED:-false}

    if [ -n "$BUCKET" ] && [ -n "$ENDPOINT" ] && [ "$ENDPOINT_IF_NONE_MATCH_CONFIRMED" != "true" ]; then
      echo "Refusing custom pg_dump endpoint without PG_DUMP_ENDPOINT_IF_NONE_MATCH_CONFIRMED=true" >&2
      exit 1
    fi

    PREFIX=firemud

    mkdir -p "$BACKUP_DIR/15min" "$BACKUP_DIR/daily" "$BACKUP_DIR/weekly" "$BACKUP_DIR/monthly"
    TS=$(date -u +%Y%m%d%H%M%S)
    DUMP="$BACKUP_DIR/15min/${PREFIX}_${TS}.sql.gz"

    # Install awscli if bucket upload is enabled and aws command missing
    if [ -n "$BUCKET" ] && ! command -v aws >/dev/null 2>&1; then
      apt-get update -y >/dev/null && apt-get install -y awscli >/dev/null
    fi

    pg_dump -h "$FIREMUD_POSTGRES_HOST" -U "$FIREMUD_POSTGRES_USER" -d "$FIREMUD_POSTGRES_DB" | gzip > "$DUMP"

    HOUR=$(date -u +%H)
    # keep last 96 15min dumps
    cd "$BACKUP_DIR/15min"
    ls -1t ${PREFIX}_*.sql.gz | tail -n +97 | xargs -r rm --

    DOW=$(date -u +%u) # 1-7 (Mon-Sun)
    DOM=$(date -u +%d)

    if [ "$HOUR" = "00" ]; then
      DAILY_DEST="$BACKUP_DIR/daily/${PREFIX}_${TS}.sql.gz"
      cp "$DUMP" "$DAILY_DEST"
      cd "$BACKUP_DIR/daily"
      ls -1t ${PREFIX}_*.sql.gz | tail -n +11 | xargs -r rm --
    fi

    if [ "$DOW" = "7" ]; then
      WEEKLY_DEST="$BACKUP_DIR/weekly/${PREFIX}_${TS}.sql.gz"
      cp "$DUMP" "$WEEKLY_DEST"
      cd "$BACKUP_DIR/weekly"
      ls -1t ${PREFIX}_*.sql.gz | tail -n +4 | xargs -r rm --
    fi

    if [ "$DOM" = "01" ]; then
      MONTHLY_DEST="$BACKUP_DIR/monthly/${PREFIX}_${TS}.sql.gz"
      cp "$DUMP" "$MONTHLY_DEST"
      cd "$BACKUP_DIR/monthly"
      ls -1t ${PREFIX}_*.sql.gz | tail -n +4 | xargs -r rm --
    fi

    if [ -n "$BUCKET" ]; then
      AWS_ENDPOINT_ARGS=()
      if [ -n "$ENDPOINT" ]; then
        AWS_ENDPOINT_ARGS=(--endpoint-url "$ENDPOINT")
      fi

      upload_object() {
        local category=$1
        local key="$category/${PREFIX}_${TS}.sql.gz"

        echo "Uploading $DUMP to s3://$BUCKET/$key"
        if ! aws s3api put-object \
          --bucket "$BUCKET" \
          --key "$key" \
          --body "$DUMP" \
          --if-none-match '*' \
          "${AWS_ENDPOINT_ARGS[@]}"; then
          echo "Failed to upload $category dump; an existing object was kept" >&2
          return 1
        fi
      }

      if ! upload_object 15min; then
        exit 1
      fi
      if [ "$HOUR" = "00" ]; then
        if ! upload_object daily; then
          exit 1
        fi
      fi
      if [ "$DOW" = "7" ]; then
        if ! upload_object weekly; then
          exit 1
        fi
      fi
      if [ "$DOM" = "01" ]; then
        if ! upload_object monthly; then
          exit 1
        fi
      fi
    fi
