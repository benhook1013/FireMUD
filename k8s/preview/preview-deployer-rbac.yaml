apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-deployer
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: firemud
    app.kubernetes.io/component: runtime-deployer
    firemud.dev/managed-by: hosted-runtime-lifecycle
    firemud.dev/controller-authority: excluded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preview-deployer
  labels:
    app.kubernetes.io/part-of: firemud
    app.kubernetes.io/component: runtime-deployer
    firemud.dev/managed-by: hosted-runtime-lifecycle
    firemud.dev/controller-authority: excluded
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - configmaps
      - secrets
      - services
      - serviceaccounts
      - persistentvolumeclaims
      - pods
      - pods/log
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The dev-demo account bootstrap uses a loopback-only Gateway port-forward.
  # Keep that subresource grant explicit and limited to its create operation;
  # the runtime deployer has no retained identity or certificate authority.
  - apiGroups: [""]
    resources:
      - pods/portforward
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
      - ingressclasses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]
  # The runtime deployer deliberately has no certificate API authority.  The
  # hosted identity controller owns Certificate lifecycles, and the
  # fail-closed admission policy rejects its managed Secret names from this
  # ServiceAccount even though ordinary application Secret access remains for
  # legacy runtime bootstrap.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preview-deployer
  labels:
    app.kubernetes.io/part-of: firemud
    app.kubernetes.io/component: runtime-deployer
    firemud.dev/managed-by: hosted-runtime-lifecycle
    firemud.dev/controller-authority: excluded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-deployer
subjects:
  - kind: ServiceAccount
    name: preview-deployer
    namespace: kube-system
