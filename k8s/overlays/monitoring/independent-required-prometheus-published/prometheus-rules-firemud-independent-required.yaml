apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: firemud-independent-required-observability
  labels:
    app.kubernetes.io/name: firemud
    app.kubernetes.io/component: observability
spec:
  groups:
    - name: firemud.alerts.independent_required
      rules:
        - alert: ObservabilityDeadmanHeartbeatStale
          expr: observability_deadman_stale{profile="independent-required"} == 1
          for: 0m
          labels:
            service: external-monitoring
            component: deadman
            severity: P0
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#deadman-freshness-contract
          annotations:
            summary: Independent observability deadman heartbeat stale
            description: The profile-aware external deadman mirror has applied its configured stale threshold and evaluation window; confirm the authoritative external monitor and paging path immediately.
        - alert: ObservabilityDeadmanHeartbeatMissing
          expr: absent(observability_deadman_stale{profile="independent-required"})
          # A missing mirror is debounced locally, while a published stale value pages immediately.
          for: 1m
          labels:
            service: external-monitoring
            component: deadman
            severity: P0
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#deadman-freshness-contract
          annotations:
            summary: Independent observability deadman heartbeat missing
            description: The required-profile external deadman mirror is absent for one minute; confirm the authoritative external monitor and paging path.
        - alert: WebSocketEntryPathBlackboxUnavailable
          # An absent non-exposed path is not_applicable; missing evidence for an
          # exposed path is unknown/degraded rather than not_applicable.
          # A two-minute rule hold confirms continuous failure before paging.
          expr: entrypath_blackbox_probe_success{path="websocket"} == 0
          for: 2m
          labels:
            service: spring-cloud-gateway
            component: entrypath
            severity: P0
            owner: platform
            runbook: design/architecture/system-architecture-player-experience-incident-runbook.md#telnet-and-websocket-path-availability-below-slo
          annotations:
            summary: WebSocket entry path unreachable from external probe
            description: Independent blackbox probes cannot reach the public WebSocket gameplay path; this may be an LB, DNS, TLS, or ingress failure before requests reach Gateway.
        - alert: WebSocketEntryPathBlackboxMetricsAbsent
          # Missing required-path evidence is unknown/degraded, not an observed outage.
          # Use the same two-minute hold as the zero-value path alert.
          expr: absent(entrypath_blackbox_probe_success{path="websocket"})
          for: 2m
          labels:
            service: spring-cloud-gateway
            component: entrypath
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-player-experience-incident-runbook.md#telnet-and-websocket-path-availability-below-slo
          annotations:
            summary: WebSocket entry-path blackbox evidence is absent
            description: The required external WebSocket probe mirror has no series, so entry-path availability is unknown or degraded rather than an observed outage; restore the external monitor or Prometheus mirror.
        - alert: TelnetEntryPathBlackboxUnavailable
          # An absent non-exposed path is not_applicable; missing evidence for an
          # exposed path is unknown/degraded rather than not_applicable.
          # A two-minute rule hold confirms continuous failure before paging.
          expr: entrypath_blackbox_probe_success{path="telnet"} == 0
          for: 2m
          labels:
            service: tcp-proxy-service
            component: entrypath
            severity: P0
            owner: platform
            runbook: design/architecture/system-architecture-player-experience-incident-runbook.md#telnet-and-websocket-path-availability-below-slo
          annotations:
            summary: Telnet entry path unreachable from external probe
            description: Independent blackbox probes cannot reach the public Telnet gameplay path; this may be an LB, DNS, TLS, or ingress failure before requests reach TCP Proxy.
        - alert: TelnetEntryPathBlackboxMetricsAbsent
          # Missing required-path evidence is unknown/degraded, not an observed outage.
          # Use the same two-minute hold as the zero-value path alert.
          expr: absent(entrypath_blackbox_probe_success{path="telnet"})
          for: 2m
          labels:
            service: tcp-proxy-service
            component: entrypath
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-player-experience-incident-runbook.md#telnet-and-websocket-path-availability-below-slo
          annotations:
            summary: Telnet entry-path blackbox evidence is absent
            description: The required external Telnet probe mirror has no series, so entry-path availability is unknown or degraded rather than an observed outage; restore the external monitor or Prometheus mirror.
