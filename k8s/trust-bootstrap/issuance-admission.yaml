apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: firemud-trust-bootstrap-ca-issuers
  labels:
    app.kubernetes.io/name: firemud-trust-bootstrap
