apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: firemud-trust-ca-secret-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets]
        scope: Namespaced
  matchConditions:
    - name: reserved-ca-secret-or-recovery-caller
      expression: >-
        request.userInfo.username == 'system:serviceaccount:firemud-system:firemud-preview-ca-recovery' ||
        (request.operation == 'DELETE' ? request.name : object.metadata.name) == 'firemud-grpc-ca'
  validations:
    - expression: >-
        request.userInfo.groups.exists(group, group == 'system:masters') ||
        (request.namespace in ['firemud-system', 'cert-manager'] &&
         (request.operation == 'DELETE' ? request.name : object.metadata.name) == 'firemud-grpc-ca' &&
         request.userInfo.username == 'system:serviceaccount:firemud-system:firemud-preview-ca-recovery' &&
         request.operation in ['CREATE', 'UPDATE'] && request.subResource == '')
      message: only the protected recovery identity or system:masters may write the fixed CA Secret
      reason: Forbidden
    - expression: >-
        request.operation == 'DELETE' ||
        !(request.namespace in ['firemud-system', 'cert-manager']) ||
        (object.type == (request.namespace == 'firemud-system' ? 'Opaque' : 'kubernetes.io/tls') &&
         has(object.data) && object.data.size() == 2 &&
         (request.namespace == 'firemud-system' ?
           ('ca.crt' in object.data && 'ca.key' in object.data &&
            object.data['ca.crt'].size() > 0 && object.data['ca.key'].size() > 0) :
           ('tls.crt' in object.data && 'tls.key' in object.data &&
            object.data['tls.crt'].size() > 0 && object.data['tls.key'].size() > 0)))
      message: the fixed CA Secret must have its exact namespace-specific type and two nonempty data keys
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: firemud-trust-ca-secret-boundary
spec:
  policyName: firemud-trust-ca-secret-boundary
  validationActions: [Deny]
