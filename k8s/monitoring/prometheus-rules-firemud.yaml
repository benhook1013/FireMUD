apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: firemud-core-observability
  labels:
    app.kubernetes.io/name: firemud
    app.kubernetes.io/component: observability
spec:
  groups:
    - name: firemud.recording.backup
      rules:
        - record: backup_pipeline_recent_backup_slo_breached
          expr: |
            time() - backup_last_success_timestamp_seconds > 90 * 60
        - record: backup_pipeline_recent_verification_slo_breached
          expr: |
            time() - backup_verify_last_success_timestamp_seconds > 36 * 60 * 60
        - record: backup_pipeline_recent_restore_drill_slo_breached
          expr: |
            time() - backup_restore_drill_last_success_timestamp_seconds > 30 * 24 * 60 * 60
        - record: backup_artifact_lineage_invalid
          expr: |
            1 - backup_artifact_lineage_valid
        - record: backup_artifact_restore_unreadable
          expr: |
            1 - backup_artifact_restore_readable
        - record: recovery_participant_convergence_coverage_missing
          expr: |
            (
              (
                recovery_required_participant_inventory == 1
                and on (environment)
                recovery_required_participant_inventory_complete == 1
              )
              unless on (environment, participant)
              (
                count by (environment, participant) (
                  recovery_participant_convergence_coverage
                ) > 0
              )
            )
            or
            label_replace(
              recovery_required_participant_inventory_complete != bool 1,
              "participant", "__environment__", "", ""
            )
            or
            label_replace(
              (
                count by (environment) (
                  recovery_required_participant_inventory
                )
                unless on (environment)
                (
                  recovery_required_participant_inventory_complete == 1
                )
              ),
              "participant", "__environment__", "", ""
            )
            or
            label_replace(
              (
                recovery_required_participant_inventory_complete == 1
                unless on (environment)
                (
                  count by (environment) (
                    recovery_required_participant_inventory
                  ) > 0
                )
              ),
              "participant", "__environment__", "", ""
            )
        - record: recovery_participant_convergence_blocked
          expr: |
            (
              recovery_participant_convergence_state{state="blocked"} == 1
              and on (environment)
              recovery_required_participant_inventory_complete == 1
            )
            or on (environment, participant)
            (
              recovery_participant_convergence_coverage_missing > 0
            )
        - record: recovery_environment_convergence_blocked
          expr: |
            max by (environment) (recovery_participant_convergence_blocked)
        - record: recovery_participant_convergence_source_missing
          expr: |
            label_replace(
              absent(recovery_required_participant_inventory_complete),
              "source_family", "inventory_complete", "", ""
            )
            or
            label_replace(
              absent(recovery_required_participant_inventory),
              "source_family", "participant_inventory", "", ""
            )
            or
            label_replace(
              absent(recovery_participant_convergence_coverage),
              "source_family", "participant_coverage", "", ""
            )

    - name: firemud.alerts.backup
      rules:
        - alert: BackupPipelineNoRecentBackup
          expr: backup_pipeline_recent_backup_slo_breached > 0
          for: 5m
          labels:
            service: postgres-backup
            severity: P1
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery.md#backup-verification--restoration-testing
          annotations:
            summary: PostgreSQL backups have not succeeded recently
            description: No successful pg_dump backup has been recorded in the last 90 minutes. Investigate backup Jobs and storage endpoints.
        - alert: BackupLastSuccessMetricsAbsent
          expr: absent(backup_last_success_timestamp_seconds)
          for: 5m
          labels:
            service: postgres-backup
            severity: P1
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery-evidence-and-compliance.md#backup-observability-and-alerts
          annotations:
            summary: Backup success-timestamp metrics are absent
            description: No backup_last_success_timestamp_seconds series are present. This is a global monitoring gap; keep backup-readiness decisions blocked until the source is restored.
        - alert: BackupPipelineNoRecentVerification
          expr: backup_pipeline_recent_verification_slo_breached > 0
          for: 30m
          labels:
            service: postgres-backup
            severity: P1
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery.md#backup-verification--restoration-testing
          annotations:
            summary: Backup verification has not succeeded recently
            description: No successful backup verification run has been recorded in the last 36 hours. Investigate the verify-backups CronJob and storage configuration.
        - alert: BackupVerificationLastSuccessMetricsAbsent
          expr: absent(backup_verify_last_success_timestamp_seconds)
          for: 5m
          labels:
            service: postgres-backup
            severity: P1
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery-evidence-and-compliance.md#backup-observability-and-alerts
          annotations:
            summary: Backup verification success-timestamp metrics are absent
            description: No backup_verify_last_success_timestamp_seconds series are present. This is a global monitoring gap; keep backup-readiness decisions blocked until the source is restored.
        - alert: BackupPipelineNoRecentRestoreDrill
          expr: backup_pipeline_recent_restore_drill_slo_breached > 0
          for: 30m
          labels:
            service: postgres-backup
            severity: P1
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery.md#backup-verification--restoration-testing
          annotations:
            summary: Restore drill proof is stale
            description: No successful restore drill has been recorded within the required restore-proof freshness window. Investigate drill cadence and recovery evidence before traffic reopen decisions.
        - alert: BackupRestoreDrillLastSuccessMetricsAbsent
          expr: absent(backup_restore_drill_last_success_timestamp_seconds)
          for: 5m
          labels:
            service: postgres-backup
            severity: P1
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery-evidence-and-compliance.md#backup-observability-and-alerts
          annotations:
            summary: Restore-drill success-timestamp metrics are absent
            description: No backup_restore_drill_last_success_timestamp_seconds series are present. This is a global monitoring gap; keep recovery-readiness decisions blocked until the source is restored.
        - alert: BackupArtifactLineageInvalid
          expr: backup_artifact_lineage_invalid > 0
          for: 5m
          labels:
            service: postgres-backup
            severity: P1
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery.md#backup-verification--restoration-testing
          annotations:
            summary: Backup artifact lineage is invalid
            description: The latest backup artifact does not match the expected environment, database, schema, service, tool, or object-storage lineage. Block recovery-readiness decisions until lineage is repaired.
        - alert: BackupArtifactLineageMetricsAbsent
          expr: absent(backup_artifact_lineage_valid)
          for: 5m
          labels:
            service: postgres-backup
            severity: P1
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery-evidence-and-compliance.md#backup-observability-and-alerts
          annotations:
            summary: Backup artifact lineage metrics are absent
            description: No backup_artifact_lineage_valid series are present. This is a global monitoring gap, not environment-specific readiness evidence; keep recovery-readiness decisions blocked until the source is restored.
        - alert: BackupArtifactRestoreUnreadable
          expr: backup_artifact_restore_unreadable > 0
          for: 5m
          labels:
            service: postgres-backup
            severity: P1
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery.md#backup-verification--restoration-testing
          annotations:
            summary: Backup artifact cannot be restored or read
            description: The latest backup artifact failed restore-readability validation. Block recovery-readiness decisions until a readable artifact is verified.
        - alert: BackupArtifactRestoreReadabilityMetricsAbsent
          expr: absent(backup_artifact_restore_readable)
          for: 5m
          labels:
            service: postgres-backup
            severity: P1
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery-evidence-and-compliance.md#backup-observability-and-alerts
          annotations:
            summary: Backup artifact restore-readability metrics are absent
            description: No backup_artifact_restore_readable series are present. This is a global monitoring gap, not environment-specific readiness evidence; keep recovery-readiness decisions blocked until the source is restored.
        - alert: RecoveryParticipantConvergenceBlocked
          expr: recovery_participant_convergence_blocked > 0
          for: 5m
          labels:
            service: postgres-backup
            severity: P1
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery.md#recovery-controller-continuation
          annotations:
            summary: Recovery participant convergence is blocked
            description: One or more environment recovery participants have not reached a safe disposition. Keep the recovery quarantined and resolve the participant-specific blocker before reopening traffic.
        - alert: RecoveryParticipantConvergenceCoverageMissing
          expr: recovery_participant_convergence_coverage_missing > 0
          for: 5m
          labels:
            service: postgres-backup
            severity: P1
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery-evidence-and-compliance.md#backup-observability-and-alerts
          annotations:
            summary: Recovery participant convergence coverage is incomplete
            description: At least one required participant is absent from the current convergence-coverage projection, or an environment inventory projection is incomplete. Keep that environment's recovery-readiness decisions blocked.
        - alert: RecoveryParticipantConvergenceMetricsAbsent
          expr: recovery_participant_convergence_source_missing > 0
          for: 5m
          labels:
            service: postgres-backup
            severity: P1
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery-evidence-and-compliance.md#backup-observability-and-alerts
          annotations:
            summary: Recovery participant convergence source metrics are absent
            description: An entire required recovery inventory or coverage source family is absent globally. This is a monitoring gap, not environment controller state; do not use the affected telemetry as readiness evidence until the source is restored.
        - alert: RecoveryReopenAttemptBlocked
          expr: increase(recovery_reopen_attempt_total{result="blocked",reason="incomplete_convergence"}[5m]) > 0
          for: 0m
          labels:
            service: postgres-backup
            severity: P0
            owner: infra
            runbook: design/architecture/system-architecture-backup-recovery.md#recovery-controller-continuation
          annotations:
            summary: Player-facing reopen was attempted without complete convergence
            description: A controller-authoritative recovery release was attempted before cold-start convergence completed. Keep traffic quarantined and investigate the operation evidence and participant dispositions immediately.

    - name: firemud.alerts.observability
      rules:
        - alert: AlertmanagerServiceUnavailable
          expr: up{job="alertmanager"} == 0
          for: 5m
          labels:
            service: alertmanager
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#alertmanager-down-or-not-routing
          annotations:
            summary: Alertmanager service unavailable
            description: Alertmanager is unreachable from Prometheus, so notifications and alert-state visibility are impaired even if rule evaluation continues.
        - alert: AlertmanagerNotificationsFailing
          expr: rate(alertmanager_notifications_failed_total[5m]) > 0
          for: 10m
          labels:
            service: alertmanager
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#alertmanager-down-or-not-routing
          annotations:
            summary: Alertmanager notifications are failing
            description: Alertmanager is evaluating alerts but cannot deliver notifications reliably.
        - alert: AlertmanagerConfigReloadFailed
          expr: alertmanager_config_last_reload_successful == 0
          for: 5m
          labels:
            service: alertmanager
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#alertmanager-down-or-not-routing
          annotations:
            summary: Alertmanager configuration reload failed
            description: Alertmanager is running with stale or invalid routing configuration.
        - alert: PrometheusRuleEvaluationsFailing
          expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
          for: 10m
          labels:
            service: prometheus
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#prometheus-down-or-stale
          annotations:
            summary: Prometheus rule evaluations are failing
            description: Prometheus cannot evaluate one or more rules; alerting and fallback recordings may be stale.
        - alert: PrometheusServiceDiscoveryFailures
          expr: increase(prometheus_sd_refresh_failures_total[5m]) > 0
          for: 10m
          labels:
            service: prometheus
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#prometheus-down-or-stale
          annotations:
            summary: Prometheus service discovery or scrape refresh is failing
            description: Prometheus cannot refresh one or more scrape target pools, so metrics may go stale without the server being fully down.
        - alert: ElasticsearchClusterHealthRed
          expr: elasticsearch_cluster_health_status{color="red"} == 1
          for: 10m
          labels:
            service: elasticsearch
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#indexed-log-query-path-down-or-ingest-stalled
          annotations:
            summary: Elasticsearch cluster health is red
            description: Elasticsearch cluster health is red, which can break log ingest, search, and Kibana-backed incident triage.
        - alert: ElasticsearchIndexingFailuresHigh
          expr: rate(elasticsearch_indices_indexing_index_failed_total[5m]) > 0
          for: 10m
          labels:
            service: elasticsearch
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#indexed-log-query-path-down-or-ingest-stalled
          annotations:
            summary: Elasticsearch indexing failures detected
            description: Elasticsearch is failing to index a non-zero stream of documents, so recent logs may be missing or incomplete.
        - alert: OTelCollectorExportFailures
          expr: rate(otelcol_exporter_send_failed_spans[5m]) > 0
          for: 10m
          labels:
            service: otel-collector
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#jaeger--opentelemetry-collector-down
          annotations:
            summary: OpenTelemetry Collector is failing to export spans
            description: Distributed tracing data is being dropped before it reaches Jaeger or the configured backend.
        - alert: OTelCollectorUnavailable
          expr: up{job="otel-collector"} == 0
          for: 5m
          labels:
            service: otel-collector
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#jaeger--opentelemetry-collector-down
          annotations:
            summary: OpenTelemetry Collector unavailable
            description: The collector is unreachable, so new traces cannot be received even before downstream export/storage is considered.
        - alert: JaegerQueryUnavailable
          expr: up{job="jaeger-query"} == 0
          for: 10m
          labels:
            service: jaeger
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#jaeger--opentelemetry-collector-down
          annotations:
            summary: Jaeger query service unavailable
            description: Jaeger query is unavailable, so operators cannot search or inspect traces even if spans are still being ingested.
        - alert: JaegerStorageFailuresHigh
          expr: increase(jaeger_collector_spans_dropped_total[5m]) > 0
          for: 10m
          labels:
            service: jaeger
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#jaeger--opentelemetry-collector-down
          annotations:
            summary: Jaeger is dropping spans
            description: Jaeger storage or collector paths are dropping spans, so trace data is incomplete even when services still export successfully.
        - alert: FluentBitOutputErrorsHigh
          expr: rate(fluentbit_output_errors_total[5m]) > 0
          for: 10m
          labels:
            service: fluent-bit
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#indexed-log-query-path-down-or-ingest-stalled
          annotations:
            summary: Fluent Bit output errors detected
            description: Log shipping is failing or backpressured; Kibana may lose recent log visibility.
        - alert: GrafanaDatasourceUnavailable
          expr: grafana_datasource_up == 0
          for: 10m
          labels:
            service: grafana
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#grafana-down
          annotations:
            summary: Grafana datasource unavailable
            description: Grafana cannot query one or more configured datasources, so dashboards may render incomplete or misleading incident views.
        - alert: GrafanaServiceUnavailable
          expr: up{job="grafana"} == 0
          for: 10m
          labels:
            service: grafana
            severity: P1
            owner: platform
            runbook: design/architecture/system-architecture-observability-incident-runbook.md#grafana-down
          annotations:
            summary: Grafana service unavailable
            description: Grafana itself is unreachable, so dashboard-based triage is unavailable even if Prometheus and other backends are healthy.
