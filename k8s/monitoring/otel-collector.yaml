# Local/demo reference fixture only. The plaintext receiver/exporter below must
# not carry ADR-0167-controlled attributes and is not valid evidence for a
# shared or player-facing environment. Target deployments must configure
# TLS/mTLS on every telemetry hop, or redact those attributes before any
# unavoidable plaintext hop, with environment-scoped credentials supplied by
# the deployment (never embedded in this fixture).
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: firemud
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:latest
          args: ["--config=/etc/otel/config.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          ports:
            - containerPort: 4317
              name: otlp-grpc
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  namespace: firemud
  name: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - port: 4317
      targetPort: 4317
      protocol: TCP
      name: otlp-grpc
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: firemud
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
    processors:
      batch:
    exporters:
      jaeger:
        # Plaintext is retained only for local/demo compatibility. It is not
        # permitted for sensitive attributes or shared/player-facing traffic.
        endpoint: http://jaeger:14250
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger]
