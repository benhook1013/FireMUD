apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: firemud
  name: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: bitnami/redis-exporter:latest@sha256:3f7b56049e58e0784680c3e8d1e16fb1bc58aa5b145afbdae3ba7af5a6b250e5
          args:
            - '--redis.addr=redis:6379'
          ports:
            - containerPort: 9121
---
apiVersion: v1
kind: Service
metadata:
  namespace: firemud
  name: redis-exporter
spec:
  selector:
    app: redis-exporter
  ports:
    - port: 9121
      targetPort: 9121
      protocol: TCP
  type: ClusterIP
