apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: firemud
  name: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: bitnami/redis-exporter:latest@sha256:42eed2b84af8d21e78cc61e886352a23371ec3bf0df21da9fc81f2a493c3d0c2
          args:
            - '--redis.addr=redis:6379'
          ports:
            - containerPort: 9121
---
apiVersion: v1
kind: Service
metadata:
  namespace: firemud
  name: redis-exporter
spec:
  selector:
    app: redis-exporter
  ports:
    - port: 9121
      targetPort: 9121
      protocol: TCP
  type: ClusterIP
