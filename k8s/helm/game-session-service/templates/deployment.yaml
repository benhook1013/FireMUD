apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-session-service
spec:
  selector:
    matchLabels:
{{ include "firemud.labels" . | indent 6 }}
  template:
    metadata:
      labels:
{{ include "firemud.labels" . | indent 8 }}
    spec:
      containers:
        - name: game-session-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
          resources:
{{ include "firemud.resources" . | indent 12 }}
