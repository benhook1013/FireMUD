previewStack:
  enabled: false
  # JVM footprint for the hosted dev and preview stacks, applied to every app
  # service. C1-only JIT, a smaller code cache and thread stacks, and two glibc
  # malloc arenas cut idle RSS by about 13% with heap sizing unchanged.
  jvm:
    javaToolOptions: "-XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=64m -Xss512k"
    mallocArenaMax: "2"
  # Hosted environments use the HostedEnvironmentIdentity controller for
  # certificate identity. Local installs retain standalone cert-manager mode.
  certificateIdentity:
    mode: standalone
  networkPolicies:
    enabled: true
  gatewayWsTls:
    enabled: false
    servicePort: 443
    targetPort: 8443
    # ClusterIssuer for standalone internal bridge Certificates; this is not the public Telnet issuer.
    clusterIssuer: firemud-ca-issuer
    # Hosted preview and dev-demo values must select their canonical trust environment explicitly.
    trustEnvironment: pr-preview
