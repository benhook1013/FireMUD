previewStack:
  enabled: false
  entityDigestBaselineMigration:
    # This is an operator-invoked protected maintenance Job. Keep it disabled
    # in ordinary chart releases; no Helm hook is used to trigger execution.
    enabled: false
    mode: ""
    targetNamespace: ""
    operationId: ""
    tenantId: ""
    versionId: ""
    afterBaselineId: "0"
    limit: 100
    actorIdentity: ""
    image: ""
    expectedSource:
      kind: ""
      name: ""
      key: expected-source.json
    # A dedicated identity Secret must be provisioned by the environment's
    # trust owner. The chart never falls back to a service certificate.
    grpcIdentitySecretName: firemud-grpc-game-design-baseline-migrator
  # Hosted environments use the HostedEnvironmentIdentity controller for
  # certificate identity. Local installs retain standalone cert-manager mode.
  certificateIdentity:
    mode: standalone
  networkPolicies:
    enabled: true
  gatewayWsTls:
    enabled: false
    servicePort: 443
    targetPort: 8443
    # ClusterIssuer for standalone internal bridge Certificates; this is not the public Telnet issuer.
    clusterIssuer: firemud-ca-issuer
    # Hosted preview and dev-demo values must select their canonical trust environment explicitly.
    trustEnvironment: pr-preview
  # Keep the static host and its public routes disabled until its image is
  # published and the hosted preview values select that immutable release.
  frontend:
    enabled: false
    image:
      repository: ""
      tag: ""
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
