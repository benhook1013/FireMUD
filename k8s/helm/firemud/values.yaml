previewStack:
  enabled: false
  # Hosted environments use the HostedEnvironmentIdentity controller for
  # certificate identity. Local installs retain standalone cert-manager mode.
  certificateIdentity:
    mode: standalone
  networkPolicies:
    enabled: true
  gatewayWsTls:
    enabled: false
    servicePort: 443
    targetPort: 8443
    # Empty infers pr-preview or dev-demo-cluster from preview.prNumber; otherwise use a canonical runtime environment.
    trustEnvironment: ""
