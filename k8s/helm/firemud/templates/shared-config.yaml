{{- if .Values.previewStack.enabled }}
{{- $previewJwt := .Values.previewStack.jwt | default (dict) }}
{{- if hasKey $previewJwt "jwksResourceKind" }}
{{- fail "previewStack.jwt.jwksResourceKind is unsupported; public jwt-jwks is always a ConfigMap" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: firemud-config
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
data:
{{- range $key, $value := .Values.previewStack.sharedConfig }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: firemud-secret
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
type: Opaque
stringData:
{{- range $key, $value := .Values.previewStack.sharedSecret }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-signing-keys
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
type: Opaque
stringData:
  current.key: {{ $previewJwt.signingKey | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jwt-jwks
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
data:
  jwks.json: {{ $previewJwt.jwksJson | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
type: Opaque
stringData:
  accessKey: {{ .Values.previewStack.minio.accessKey | quote }}
  secretKey: {{ .Values.previewStack.minio.secretKey | quote }}
{{- if .Values.previewStack.grpcTls.createSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "firemud.grpcSecretName" . }}
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
type: Opaque
stringData:
  client.crt: |
{{ .Values.previewStack.grpcTls.clientCrt | indent 4 }}
  client.key: |
{{ .Values.previewStack.grpcTls.clientKey | indent 4 }}
  ca.crt: |
{{ .Values.previewStack.grpcTls.caCrt | indent 4 }}
{{- end }}
{{- end }}
