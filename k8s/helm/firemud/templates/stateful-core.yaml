{{- if .Values.previewStack.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.previewStack.persistence.postgres.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.previewStack.persistence.postgres.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: postgres-data-layout-check
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          image: {{ .Values.previewStack.postgres.image | quote }}
          command:
            - sh
            - -ec
          args:
            - |
              refuse() {
                echo "refusing to start PostgreSQL: $1" >&2
                exit 1
              }
              has_entries() {
                directory="$1"
                for entry in "$directory"/* "$directory"/.[!.]* "$directory"/..?*; do
                  if [ -e "$entry" ] || [ -L "$entry" ]; then
                    return 0
                  fi
                done
                return 1
              }
              require_only_entry() {
                directory="$1"
                expected="$2"
                for entry in "$directory"/* "$directory"/.[!.]* "$directory"/..?*; do
                  if [ -e "$entry" ] || [ -L "$entry" ]; then
                    [ "$entry" = "$expected" ] || refuse "unrecognized nonempty data layout at ${directory}; preserve it and restore a logical backup into a separate PostgreSQL 18 volume"
                  fi
                done
              }
              data_root="/var/lib/postgresql"
              if [ ! -d "$data_root" ] || [ ! -r "$data_root" ] || [ ! -x "$data_root" ]; then
                echo "refusing to start PostgreSQL: cannot inspect mounted data directory ${data_root}" >&2
                exit 1
              fi
              if [ -e "${data_root}/PG_VERSION" ] || [ -L "${data_root}/PG_VERSION" ]; then
                refuse "legacy root PG_VERSION found at ${data_root}/PG_VERSION; preserve this PVC and restore a logical backup into a separate PostgreSQL 18 volume"
              fi
              if [ -e "${data_root}/pgdata/PG_VERSION" ] || [ -L "${data_root}/pgdata/PG_VERSION" ]; then
                refuse "legacy nested PG_VERSION found at ${data_root}/pgdata/PG_VERSION; preserve this PVC and restore a logical backup into a separate PostgreSQL 18 volume"
              fi
              major_root="${data_root}/18"
              data_directory="${major_root}/docker"
              if [ -e "$major_root" ] || [ -L "$major_root" ]; then
                [ -d "$major_root" ] && [ ! -L "$major_root" ] || refuse "PostgreSQL 18 data root ${major_root} is not a directory"
                [ -d "$data_directory" ] && [ ! -L "$data_directory" ] || refuse "PostgreSQL 18 data directory ${data_directory} is missing or unsafe"
                [ -f "${data_directory}/PG_VERSION" ] && [ ! -L "${data_directory}/PG_VERSION" ] || refuse "PostgreSQL 18 data directory ${data_directory} has no regular PG_VERSION file"
                version=$(cat "${data_directory}/PG_VERSION") || refuse "cannot read ${data_directory}/PG_VERSION"
                [ "$version" = "18" ] || refuse "expected PostgreSQL major 18 at ${data_directory}/PG_VERSION"
                [ -d "${data_directory}/base" ] && [ -f "${data_directory}/global/pg_control" ] || refuse "PostgreSQL 18 data directory ${data_directory} is incomplete"
                [ ! -L "${data_directory}/base" ] && [ ! -L "${data_directory}/global/pg_control" ] || refuse "PostgreSQL 18 data directory ${data_directory} has unsafe cluster markers"
                require_only_entry "$data_root" "$major_root"
                require_only_entry "$major_root" "$data_directory"
              elif has_entries "$data_root"; then
                refuse "unrecognized nonempty data layout at ${data_root}; preserve it and restore a logical backup into a separate PostgreSQL 18 volume"
              fi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
              readOnly: true
      containers:
        - name: postgres
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          image: {{ .Values.previewStack.postgres.image | quote }}
          args:
            - postgres
            - -c
            - max_connections=200
          env:
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
            - name: POSTGRES_DB
              value: {{ .Values.previewStack.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: firemud-secret
                  key: FIREMUD_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firemud-secret
                  key: FIREMUD_POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
