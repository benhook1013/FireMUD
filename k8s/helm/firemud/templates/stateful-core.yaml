apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.previewStack.persistence.minio.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.previewStack.persistence.minio.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.previewStack.minio.image | quote }}
          args: ["server", "/data"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accessKey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretKey
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
{{- end }}
