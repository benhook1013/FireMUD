{{- if .Values.previewStack.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.previewStack.persistence.postgres.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.previewStack.persistence.postgres.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.previewStack.postgres.image | quote }}
          args:
            - postgres
            - -c
            - max_connections=200
          env:
            - name: POSTGRES_DB
              value: {{ .Values.previewStack.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: firemud-secret
                  key: FIREMUD_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firemud-secret
                  key: FIREMUD_POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
