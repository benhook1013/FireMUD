{{- if and .Values.previewStack.enabled (.Values.previewStack.networkPolicies.enabled) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-services
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - account-service
          - automation-scripting-service
          - entity-management-service
          - game-design-service
          - game-logic-service
          - game-session-service
          - logging-admin-service
          - social-groups-service
          - world-management-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 6565
        - protocol: TCP
          port: 4317
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - account-service
                  - automation-scripting-service
                  - entity-management-service
                  - game-design-service
                  - game-logic-service
                  - game-session-service
                  - logging-admin-service
                  - social-groups-service
                  - world-management-service
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 6565
        - protocol: TCP
          port: 4317
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis-coord
        - podSelector:
            matchLabels:
              app: redis-cache
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-services-egress
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - account-service
          - automation-scripting-service
          - entity-management-service
          - game-design-service
          - game-logic-service
          - game-session-service
          - logging-admin-service
          - social-groups-service
          - world-management-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - account-service
                  - automation-scripting-service
                  - entity-management-service
                  - game-design-service
                  - game-logic-service
                  - game-session-service
                  - logging-admin-service
                  - social-groups-service
                  - world-management-service
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 6565
        - protocol: TCP
          port: 4317
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis-coord
        - podSelector:
            matchLabels:
              app: redis-cache
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
{{- $gatewayWsTls := .Values.previewStack.gatewayWsTls | default (dict) }}
{{- $gatewayWsTlsTargetPort := "" }}
{{- $gatewayPlaintextTargetPort := "" }}
{{- $gatewayPlaintextTargetPortSet := false }}
{{- $gatewayServiceCount := 0 }}
{{- $gatewayPlaintextServicePortCount := 0 }}
{{- if not $gatewayWsTls.enabled }}
{{- range $service := .Values.previewStack.services }}
{{- if eq $service.name "spring-cloud-gateway" }}
{{- $gatewayServiceCount = add1 $gatewayServiceCount }}
{{- range $port := $service.ports }}
{{- if eq (toString $port.port) "80" }}
{{- $gatewayPlaintextServicePortCount = add1 $gatewayPlaintextServicePortCount }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if ne $gatewayServiceCount 1 }}
{{- fail "previewStack.services must include exactly one spring-cloud-gateway for Gateway egress NetworkPolicy" }}
{{- end }}
{{- if ne $gatewayPlaintextServicePortCount 1 }}
{{- fail "previewStack.services.spring-cloud-gateway must declare exactly one port: 80 for plaintext Gateway egress" }}
{{- end }}
{{- range $service := .Values.previewStack.services }}
{{- if eq $service.name "spring-cloud-gateway" }}
{{- range $port := $service.ports }}
{{- if eq (toString $port.port) "80" }}
{{- $gatewayPlaintextTargetPort = required "previewStack.services.spring-cloud-gateway port: 80 must declare a targetPort for plaintext Gateway egress" $port.targetPort }}
{{- $gatewayPlaintextTargetPortSet = true }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $gatewayPlaintextTargetPortSet }}
{{- fail "previewStack.services.spring-cloud-gateway port: 80 must declare a targetPort for plaintext Gateway egress" }}
{{- end }}
{{- end }}
{{- if $gatewayWsTls.enabled }}
{{- $gatewayWsTlsTargetPort = required "previewStack.gatewayWsTls.targetPort is required when Gateway WebSocket TLS is enabled" $gatewayWsTls.targetPort }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spring-cloud-gateway-ingress
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  podSelector:
    matchLabels:
      app: spring-cloud-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tcp-proxy-service
      ports:
        - protocol: TCP
          port: {{ if $gatewayWsTls.enabled }}{{ $gatewayWsTlsTargetPort }}{{ else }}{{ $gatewayPlaintextTargetPort }}{{ end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 6565
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tcp-proxy-service-egress
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  podSelector:
    matchLabels:
      app: tcp-proxy-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if $gatewayWsTls.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app: spring-cloud-gateway
      ports:
        - protocol: TCP
          port: {{ $gatewayWsTlsTargetPort }}
    {{- else }}
    - to:
        - podSelector:
            matchLabels:
              app: spring-cloud-gateway
      ports:
        - protocol: TCP
          port: {{ $gatewayPlaintextTargetPort }}
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              app: game-session-service
      ports:
        - protocol: TCP
          port: 6565
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4317
{{- end }}
