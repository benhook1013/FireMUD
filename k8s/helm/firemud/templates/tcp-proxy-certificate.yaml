{{- if and .Values.previewStack.enabled .Values.previewStack.telnetTls.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.previewStack.telnetTls.secretName }}
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  secretName: {{ .Values.previewStack.telnetTls.secretName }}
  dnsNames:
    - {{ .Values.preview.hostname | quote }}
  issuerRef:
    name: {{ .Values.previewStack.telnetTls.clusterIssuer | quote }}
    kind: ClusterIssuer
{{- end }}
