{{- $telnetTls := .Values.previewStack.telnetTls | default (dict) }}
{{- if and .Values.previewStack.enabled $telnetTls.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $telnetTls.secretName }}
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  secretName: {{ $telnetTls.secretName }}
  privateKey:
    algorithm: RSA
    encoding: PKCS8
  dnsNames:
    - {{ .Values.preview.hostname | quote }}
  issuerRef:
    name: {{ $telnetTls.clusterIssuer | quote }}
    kind: ClusterIssuer
{{- end }}
