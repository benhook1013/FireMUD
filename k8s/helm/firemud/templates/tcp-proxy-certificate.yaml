{{- if and .Values.previewStack.enabled .Values.previewStack.telnetTls.enabled }}
{{- $hostedControllerMode := include "firemud.hostedControllerMode" . | trim }}
{{- if ne $hostedControllerMode "true" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "firemud.telnetTlsSecretName" . }}
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  secretName: {{ include "firemud.telnetTlsSecretName" . }}
  privateKey:
    algorithm: RSA
    encoding: PKCS8
  dnsNames:
    - {{ .Values.preview.hostname | quote }}
  issuerRef:
    name: {{ .Values.previewStack.telnetTls.clusterIssuer | quote }}
    kind: ClusterIssuer
{{- end }}
{{- end }}
