{{- if and .Values.previewStack.enabled .Values.previewStack.telnetTls.enabled (ne (default "standalone" .Values.previewStack.certificateIdentity.mode) "hosted-controller") }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.previewStack.telnetTls.secretName }}
  labels:
{{ include "firemud.commonLabels" . | indent 4 }}
spec:
  secretName: {{ .Values.previewStack.telnetTls.secretName }}
  privateKey:
    algorithm: RSA
    encoding: PKCS8
  dnsNames:
    - {{ .Values.preview.hostname | quote }}
  issuerRef:
    name: {{ .Values.previewStack.telnetTls.clusterIssuer | quote }}
    kind: ClusterIssuer
{{- end }}
