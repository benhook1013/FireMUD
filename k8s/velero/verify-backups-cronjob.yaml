apiVersion: batch/v1
kind: CronJob
metadata:
  name: verify-velero-backups
  namespace: firemud
spec:
  schedule: "0 4 * * *" # daily at 04:00
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: check
            image: velero/velero:v1.12.3
            command: ["/bin/sh", "-c", "/scripts/verify-backups.sh"]
            volumeMounts:
            - name: script
              mountPath: /scripts
          restartPolicy: OnFailure
          volumes:
          - name: script
            configMap:
              name: verify-backups-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verify-backups-script
  namespace: firemud
data:
  verify-backups.sh: |
    #!/usr/bin/env bash
    # Verify that Velero backups exist and the object store is reachable.
    # Intended for periodic checks via CI or a Kubernetes CronJob.
    set -euo pipefail
    
    NAMESPACE=${FIREMUD_K8S_NAMESPACE:-firemud}
    
    # Ensure Velero CLI is available
    command -v velero >/dev/null 2>&1 || {
      echo "Velero CLI not found" >&2
      exit 1
    }
    
    # List backups and ensure at least one exists
    BACKUP_COUNT=$(velero backup get -n "$NAMESPACE" --no-headers | wc -l || true)
    if [ "$BACKUP_COUNT" -eq 0 ]; then
      echo "No Velero backups found in namespace $NAMESPACE" >&2
      exit 1
    fi
    
    echo "Found $BACKUP_COUNT Velero backups in $NAMESPACE"

    if [ -n "${PG_DUMP_BUCKET:-}" ]; then
      command -v aws >/dev/null 2>&1 || {
        echo "aws CLI not found" >&2
        exit 1
      }
      AWS_ENDPOINT_ARGS=()
      if [ -n "${PG_DUMP_ENDPOINT:-}" ]; then
        AWS_ENDPOINT_ARGS=(--endpoint-url "$PG_DUMP_ENDPOINT")
      fi
      KEY=$(aws s3api list-objects-v2 --bucket "$PG_DUMP_BUCKET" \
            --prefix "15min/" \
            "${AWS_ENDPOINT_ARGS[@]}" \
            --query 'sort_by(Contents,&LastModified)[-1].Key' --output text 2>/dev/null || echo None)
      if [ "$KEY" = "None" ]; then
        echo "No pg_dump files found in bucket $PG_DUMP_BUCKET" >&2
        exit 1
      fi
      echo "Latest pg_dump: $KEY"
    fi
