apiVersion: v1
kind: ServiceAccount
metadata:
  name: verify-velero-backups
  namespace: firemud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: verify-velero-backups-reader
  namespace: velero
rules:
  - apiGroups: ["velero.io"]
    resources: ["backups"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: verify-velero-backups-reader
  namespace: velero
subjects:
  - kind: ServiceAccount
    name: verify-velero-backups
    namespace: firemud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: verify-velero-backups-reader
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verify-velero-backups
  namespace: firemud
spec:
  schedule: "0 4 * * *" # daily at 04:00
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: verify-velero-backups
          containers:
            - name: check
              image: ghcr.io/benhook1013/backup-verifier:9c41b19b3417a004d5a70de70468de94b97805f2@sha256:f92597ca04dbd8a1821813965a95cf237c85de78db40fe91b6b539513605c60f
              env:
                - name: VELERO_NAMESPACE
                  value: velero
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          restartPolicy: OnFailure
