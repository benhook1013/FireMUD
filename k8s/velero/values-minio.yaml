image:
  repository: velero/velero
  tag: v1.19.0
  digest: sha256:da94e0de154f837db0ada37ea0c168428943dab2c872efc10481189925de395f

snapshotsEnabled: false

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.15.0@sha256:cb8fdbefc54e2d99b124f6611bc8cad31a1e546689dfb2a32c9307339c492750
    volumeMounts:
      - name: plugins
        mountPath: /target

configuration:
  defaultVolumesToFsBackup: false
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: firemud-backups
      config:
        region: minio
        s3Url: http://minio.minio.svc.cluster.local:9000
        s3ForcePathStyle: "true"
        insecureSkipTLSVerify: true
credentials:
  useSecret: true
  existingSecret: velero-minio-creds
