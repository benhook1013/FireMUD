configuration:
  defaultVolumesToFsBackup: false
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: firemud-backups
      config:
        region: minio
        s3Url: http://minio.minio.svc.cluster.local:9000
        insecureSkipTLSVerify: true
credentials:
  useSecret: true
  existingSecret: velero-minio-creds
