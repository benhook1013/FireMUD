image:
  repository: velero/velero
  tag: v1.18.4
  digest: sha256:c89fb5b6d1fd6afd368e0f483e6f5555fd62851a1eada8ac5c72482e674ca17b

snapshotsEnabled: false

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
    volumeMounts:
      - name: plugins
        mountPath: /target

configuration:
  defaultVolumesToFsBackup: false
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: firemud-backups
      config:
        region: minio
        s3Url: http://minio.minio.svc.cluster.local:9000
        s3ForcePathStyle: "true"
        insecureSkipTLSVerify: true
credentials:
  useSecret: true
  existingSecret: velero-minio-creds
