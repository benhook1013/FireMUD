---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-admin-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logging-admin-service
  template:
    metadata:
      labels:
        app: logging-admin-service
    spec:
      containers:
        - name: logging-admin-service
          image: logging-admin-service:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: FIREMUD_GRPC_CERT_CHAIN_PATH
              value: /tls/client.crt
            - name: FIREMUD_GRPC_PRIVATE_KEY_PATH
              value: /tls/client.key
            - name: FIREMUD_GRPC_CA_CERT_PATH
              value: /tls/ca.crt
          envFrom:
            - configMapRef:
                name: firemud-config
            - secretRef:
                name: firemud-secret
          volumeMounts:
            - name: grpc-tls
              mountPath: /tls
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: fluent-bit
          image: fluent/fluent-bit:2.2.2
          args: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: grpc-tls
          secret:
            secretName: firemud-grpc-tls
        - name: varlog
          hostPath:
            path: /var/log
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
---
apiVersion: v1
kind: Service
metadata:
  name: logging-admin-service
spec:
  selector:
    app: logging-admin-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
