---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: firemud
  name: spring-cloud-gateway
spec:
  replicas: 2

  selector:
    matchLabels:
      app: spring-cloud-gateway
  template:
    metadata:
      labels:
        app: spring-cloud-gateway
    spec:
      serviceAccountName: firemud-app
      securityContext:
        fsGroup: 1000
      containers:
        - name: spring-cloud-gateway
          image: ghcr.io/benhook1013/spring-cloud-gateway:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: FIREMUD_GRPC_CERT_CHAIN_PATH
              value: /tls/client.crt
            - name: FIREMUD_GRPC_PRIVATE_KEY_PATH
              value: /tls/client.key
            - name: FIREMUD_GRPC_CA_CERT_PATH
              value: /tls/ca.crt
            - name: FIREMUD_GATEWAY_TCP_PROXY_TLS_ENABLED
              value: "true"
            - name: FIREMUD_GATEWAY_TCP_PROXY_TLS_BIND_ADDRESS
              value: "0.0.0.0"
            - name: FIREMUD_GATEWAY_TCP_PROXY_TLS_PORT
              value: "8443"
            - name: FIREMUD_GATEWAY_TCP_PROXY_TLS_CERT_CHAIN_PATH
              value: /gateway-ws-server-tls/tls.crt
            - name: FIREMUD_GATEWAY_TCP_PROXY_TLS_PRIVATE_KEY_PATH
              value: /gateway-ws-server-tls/tls.key
            - name: FIREMUD_GATEWAY_TCP_PROXY_TLS_CLIENT_CA_PATH
              value: /gateway-ws-server-tls/ca.crt
            - name: FIREMUD_GATEWAY_TCP_PROXY_TRUST_ENVIRONMENT
              value: production
            - name: FIREMUD_GATEWAY_TCP_PROXY_TRUST_PROFILE
              value: production_uri
            - name: FIREMUD_GATEWAY_TCP_PROXY_TRUST_URI_SAN
              value: spiffe://firemud/ns/firemud/sa/tcp-proxy-service
          volumeMounts:
            - name: grpc-tls
              mountPath: /tls
              readOnly: true
            - name: gateway-ws-server-tls
              mountPath: /gateway-ws-server-tls
              readOnly: true
            - name: jwt-signing-keys
              mountPath: /var/run/secrets/firemud/jwt
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          ports:
            - containerPort: 8080
            - containerPort: 6565
            - containerPort: 8443
              name: gateway-ws-mtls
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
        - name: fluent-bit
          image: fluent/fluent-bit:2.2.2
          imagePullPolicy: Always
          args: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
          env:
            - name: FLUENT_ELASTICSEARCH_HOST
              valueFrom:
                configMapKeyRef:
                  name: firemud-config
                  key: FLUENT_ELASTICSEARCH_HOST
            - name: FLUENT_ELASTICSEARCH_PORT
              valueFrom:
                configMapKeyRef:
                  name: firemud-config
                  key: FLUENT_ELASTICSEARCH_PORT
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: grpc-tls
          secret:
            secretName: firemud-grpc-tls
        - name: gateway-ws-server-tls
          secret:
            secretName: production-gateway-internal-ws
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
        - name: jwt-signing-keys
          secret:
            secretName: jwt-signing-keys
        - name: varlog
          hostPath:
            path: /var/log
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
---
apiVersion: v1
kind: Service
metadata:
  namespace: firemud
  name: spring-cloud-gateway-mtls
spec:
  selector:
    app: spring-cloud-gateway
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  namespace: firemud
  name: spring-cloud-gateway
spec:
  selector:
    app: spring-cloud-gateway
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
    - port: 6565
      targetPort: 6565
      protocol: TCP
  type: LoadBalancer
