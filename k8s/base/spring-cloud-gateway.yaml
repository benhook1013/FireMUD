---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-cloud-gateway
spec:
  replicas: 2

  selector:
    matchLabels:
      app: spring-cloud-gateway
  template:
    metadata:
      labels:
        app: spring-cloud-gateway
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: spring-cloud-gateway
          image: ghcr.io/benhook1013/spring-cloud-gateway:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: FIREMUD_GRPC_CERT_CHAIN_PATH
              value: /tls/client.crt
            - name: FIREMUD_GRPC_PRIVATE_KEY_PATH
              value: /tls/client.key
            - name: FIREMUD_GRPC_CA_CERT_PATH
              value: /tls/ca.crt
          volumeMounts:
            - name: grpc-tls
              mountPath: /tls
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          ports:
            - containerPort: 8080
            - containerPort: 6565
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: grpc-tls
          secret:
            secretName: firemud-grpc-tls
---
apiVersion: v1
kind: Service
metadata:
  name: spring-cloud-gateway
spec:
  selector:
    app: spring-cloud-gateway
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
    - port: 6565
      targetPort: 6565
      protocol: TCP
  type: LoadBalancer
