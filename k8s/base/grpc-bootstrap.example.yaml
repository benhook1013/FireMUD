apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  namespace: firemud
  name: firemud-grpc-tls
spec:
  secretName: firemud-grpc-tls
  dnsNames:
    - "firemud.example.com"
  issuerRef:
    name: firemud-ca-issuer
    kind: ClusterIssuer
---
apiVersion: v1
kind: Secret
metadata:
  namespace: firemud
  name: firemud-grpc-tls
type: Opaque
stringData:
  client.crt: |
    replace-with-real-client-crt
  client.key: |
    replace-with-real-client-key
  ca.crt: |
    replace-with-real-ca-crt
