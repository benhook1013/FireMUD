# This example only provisions the shared transport/trust Secret. Account Service, Game Session,
# Social Groups, and the five publication workloads also require their separate cert-manager-issued
# leaf Secrets: firemud-grpc-account-service, firemud-grpc-game-session-service,
# firemud-grpc-social-groups-service, and one firemud-grpc-<workload> Secret for each publication
# workload. The shared Secret alone is not sufficient to start them.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  namespace: firemud
  name: firemud-grpc-tls
spec:
  secretName: firemud-grpc-tls
  dnsNames:
    - "firemud.example.com"
  issuerRef:
    name: firemud-ca-issuer
    kind: ClusterIssuer
---
apiVersion: v1
kind: Secret
metadata:
  namespace: firemud
  name: firemud-grpc-tls
type: Opaque
stringData:
  client.crt: |
    replace-with-real-client-crt
  client.key: |
    replace-with-real-client-key
  ca.crt: |
    replace-with-real-ca-crt
