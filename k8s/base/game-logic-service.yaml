apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-logic-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-logic-service
  template:
    metadata:
      labels:
        app: game-logic-service
    spec:
      containers:
        - name: game-logic-service
          image: game-logic-service:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: game-logic-service
spec:
  selector:
    app: game-logic-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
