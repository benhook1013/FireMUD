apiVersion: v1
kind: Secret
metadata:
  namespace: firemud
  name: postgres-credentials
type: Opaque
stringData:
  FIREMUD_POSTGRES_USER: replace-me
  FIREMUD_POSTGRES_PASSWORD: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  namespace: firemud
  name: jwt-signing-keys
type: Opaque
stringData:
  current.key: replace-with-environment-owned-signing-key
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: firemud
  name: jwt-jwks
data:
  jwks.json: '{"keys":[]}'
