---
apiVersion: v1
kind: ConfigMap
metadata:
  name: firemud-config
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: firemud
  REDIS_HOST: redis
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: firemud-secret
stringData:
  POSTGRES_USER: firemud
  POSTGRES_PASSWORD: firemud

