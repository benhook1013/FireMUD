apiVersion: apps/v1
kind: Deployment
metadata:
  name: entity-management-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: entity-management-service
  template:
    metadata:
      labels:
        app: entity-management-service
    spec:
      containers:
        - name: entity-management-service
          image: entity-management-service:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: entity-management-service
spec:
  selector:
    app: entity-management-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
