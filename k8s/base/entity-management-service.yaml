apiVersion: apps/v1
kind: Deployment
metadata:
  name: entity-management-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: entity-management-service
  template:
    metadata:
      labels:
        app: entity-management-service
    spec:
      containers:
        - name: entity-management-service
          image: entity-management-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: entity-management-service
spec:
  selector:
    app: entity-management-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
