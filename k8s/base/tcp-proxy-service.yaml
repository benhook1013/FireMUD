---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-proxy-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tcp-proxy-service
  template:
    metadata:
      labels:
        app: tcp-proxy-service
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: tcp-proxy-service
          image: ghcr.io/firemud/tcp-proxy-service:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          ports:
            - containerPort: 2323
          readinessProbe:
            tcpSocket:
              port: 2323
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 2323
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: fluent-bit
          image: fluent/fluent-bit:2.2.2
          imagePullPolicy: Always
          args: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
          env:
            - name: FLUENT_ELASTICSEARCH_HOST
              valueFrom:
                configMapKeyRef:
                  name: firemud-config
                  key: FLUENT_ELASTICSEARCH_HOST
            - name: FLUENT_ELASTICSEARCH_PORT
              valueFrom:
                configMapKeyRef:
                  name: firemud-config
                  key: FLUENT_ELASTICSEARCH_PORT
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
---
apiVersion: v1
kind: Service
metadata:
  name: tcp-proxy-service
spec:
  selector:
    app: tcp-proxy-service
  ports:
    - port: 2323
      targetPort: 2323
      protocol: TCP
  type: LoadBalancer
