apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-design-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-design-service
  template:
    metadata:
      labels:
        app: game-design-service
    spec:
      containers:
        - name: game-design-service
          image: game-design-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: game-design-service
spec:
  selector:
    app: game-design-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
