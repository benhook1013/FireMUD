---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-design-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-design-service
  template:
    metadata:
      labels:
        app: game-design-service
    spec:
      containers:
        - name: game-design-service
          image: game-design-service:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          envFrom:
            - configMapRef:
                name: firemud-config
            - secretRef:
                name: firemud-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: game-design-service
spec:
  selector:
    app: game-design-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
