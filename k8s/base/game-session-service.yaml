apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-session-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-session-service
  template:
    metadata:
      labels:
        app: game-session-service
    spec:
      containers:
        - name: game-session-service
          image: game-session-service:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: game-session-service
spec:
  selector:
    app: game-session-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
