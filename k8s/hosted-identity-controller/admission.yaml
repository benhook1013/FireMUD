---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: firemud-hosted-system-namespace-guard
  labels:
    app.kubernetes.io/name: hosted-environment-identity-controller
    app.kubernetes.io/part-of: firemud
    firemud.dev/managed-by: hosted-identity-controller
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - PATCH
          - DELETE
        resources:
          - namespaces
        scope: Cluster
  matchConditions:
    - name: hosted-system-namespace-only
      expression: >-
        request.userInfo.username == 'system:serviceaccount:firemud-system:firemud-hosted-identity-controller' ||
        (request.operation in ['UPDATE', 'PATCH'] && request.name == 'firemud-system') ||
        (request.operation == 'DELETE' &&
         (request.name == 'firemud-system' || request.name == 'dev-identity' || request.name.matches('^pr-[1-9][0-9]*-identity$'))) ||
        (request.operation != 'DELETE' &&
         (object.metadata.name == 'firemud-system' || object.metadata.name == 'dev-identity' || object.metadata.name.matches('^pr-[1-9][0-9]*-identity$')))
  validations:
    - expression: >-
        (request.userInfo.groups.exists(group, group == 'system:masters') &&
         request.operation in ['CREATE', 'DELETE'] &&
         ((request.operation == 'DELETE' && request.name == 'firemud-system') ||
          (request.operation == 'CREATE' && object.metadata.name == 'firemud-system'))) ||
        (request.operation in ['UPDATE', 'PATCH'] &&
         request.name == 'firemud-system' &&
         object.metadata.name == 'firemud-system' &&
         oldObject.metadata.name == 'firemud-system' &&
         object.metadata.labels == oldObject.metadata.labels &&
         object.metadata.annotations == oldObject.metadata.annotations &&
         object.metadata.ownerReferences == oldObject.metadata.ownerReferences &&
         object.metadata.finalizers == oldObject.metadata.finalizers &&
         object.spec == oldObject.spec) ||
        (request.userInfo.username == 'system:serviceaccount:firemud-system:firemud-hosted-identity-controller' &&
         ((request.operation == 'DELETE' && request.name.matches('^(dev-identity|pr-[1-9][0-9]*-identity)$') &&
           (!has(oldObject.metadata.ownerReferences) || oldObject.metadata.ownerReferences.size() == 0) &&
           (!has(oldObject.metadata.finalizers) || oldObject.metadata.finalizers.size() == 0) &&
           (!has(oldObject.metadata.annotations) || oldObject.metadata.annotations.size() == 0) &&
           has(oldObject.metadata.labels) &&
           (oldObject.metadata.labels.size() == 4 ||
            (oldObject.metadata.labels.size() == 5 &&
             oldObject.metadata.labels['kubernetes.io/metadata.name'] == request.name)) &&
           oldObject.metadata.labels['firemud.dev/managed-by'] == 'hosted-identity-controller' &&
           oldObject.metadata.labels['firemud.dev/identity-name'] == (request.name == 'dev-identity' ? 'dev-demo' : request.name.substring(0, request.name.size() - 9)) &&
           oldObject.metadata.labels['firemud.dev/environment-class'] == (request.name == 'dev-identity' ? 'dev-demo-cluster' : 'pr-preview') &&
           oldObject.metadata.labels['firemud.dev/retention'] == 'retained') ||
          (request.operation != 'DELETE' &&
           object.metadata.name.matches('^(dev-identity|pr-[1-9][0-9]*-identity)$') &&
           (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
           (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) &&
           (!has(object.metadata.annotations) || object.metadata.annotations.size() == 0) &&
           has(object.metadata.labels) &&
           (object.metadata.labels.size() == 4 ||
            (object.metadata.labels.size() == 5 &&
             object.metadata.labels['kubernetes.io/metadata.name'] == object.metadata.name)) &&
           object.metadata.labels['firemud.dev/managed-by'] == 'hosted-identity-controller' &&
           object.metadata.labels['firemud.dev/identity-name'] == (object.metadata.name == 'dev-identity' ? 'dev-demo' : object.metadata.name.substring(0, object.metadata.name.size() - 9)) &&
           object.metadata.labels['firemud.dev/environment-class'] == (object.metadata.name == 'dev-identity' ? 'dev-demo-cluster' : 'pr-preview') &&
           object.metadata.labels['firemud.dev/retention'] == 'retained')))
      message: firemud-system CREATE/DELETE requires system:masters; updates are no-op only and retained identity Namespaces are controller-managed
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: firemud-hosted-identity-main
  labels:
