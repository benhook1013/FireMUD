            request.name.matches('^(dev|pr-[1-9][0-9]*)-(tls|telnet-tls)$') ||
            ((request.namespace == 'dev-identity' || request.namespace.matches('^pr-[1-9][0-9]*-identity$')) &&
             (request.name == 'firemud-grpc-tls-previous' ||
              request.name.matches('^(dev|pr-[1-9][0-9]*)-(tls|telnet-tls)-previous$'))))) ||
          (request.operation != 'DELETE' &&
           has(object.metadata.labels) &&
