# Admission is deliberately fail-closed.  RBAC limits what the controller and
# requester can call; these policies also stop a different service account with
# broad legacy runtime permissions from writing an identity object by name.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: firemud-hosted-identity-main
  labels:
    app.kubernetes.io/name: hosted-environment-identity-controller
    app.kubernetes.io/part-of: firemud
    firemud.dev/managed-by: hosted-identity-controller
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups:
          - platform.firemud.dev
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
          - PATCH
          - DELETE
        resources:
          - hostedenvironmentidentities
        scope: Namespaced
  validations:
    - expression: "request.subResource == '' && request.namespace == 'firemud-system' && (request.operation == 'DELETE' || object.metadata.namespace == 'firemud-system')"
      message: HostedEnvironmentIdentity is accepted only in firemud-system
      reason: Forbidden
    - expression: "(request.operation == 'DELETE' ? request.name : object.metadata.name).matches('^(dev-demo|pr-[1-9][0-9]*)$')"
      message: HostedEnvironmentIdentity name must be dev-demo or pr-N
      reason: Invalid
    - expression: "request.userInfo.username == 'system:serviceaccount:firemud-system:firemud-hosted-identity-requester'"
      message: only the fixed hosted-identity requester may change the desired state
      reason: Forbidden
    - expression: "request.operation == 'DELETE' || object.spec.desiredState in ['Active', 'Retired']"
      message: spec contains only desiredState Active or Retired
      reason: Invalid
    - expression: "!(request.operation in ['UPDATE', 'PATCH']) || object.spec.desiredState == oldObject.spec.desiredState || (oldObject.spec.desiredState == 'Active' && object.spec.desiredState == 'Retired')"
      message: desiredState is monotonic; Active may transition only to Retired
      reason: Invalid
    - expression: "request.operation != 'DELETE' || (oldObject.spec.desiredState == 'Retired' && oldObject.status.phase == 'Retired')"
      message: an identity may be deleted only after the controller reports Retired
      reason: Forbidden
    - expression: "request.operation == 'DELETE' || ((!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) && ((request.operation == 'UPDATE' && (!has(object.metadata.finalizers) || object.metadata.finalizers.all(f, f == 'platform.firemud.dev/hosted-environment-identity'))) || (request.operation != 'UPDATE' && (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0))) && (!has(object.metadata.labels) || object.metadata.labels.all(k, !k.startsWith('firemud.dev/') && !k.startsWith('firemud.io/'))) && (!has(object.metadata.annotations) || object.metadata.annotations.all(k, !k.startsWith('firemud.dev/') && !k.startsWith('firemud.io/'))))"
