apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: firemud-hosted-identity-controller-egress
  namespace: firemud-system
  labels:
    app.kubernetes.io/name: hosted-environment-identity-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: firemud
    firemud.dev/managed-by: hosted-identity-controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hosted-environment-identity-controller
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress
    - Egress
  # No pod-originated ingress is accepted. Kubernetes node traffic remains
  # outside NetworkPolicy isolation, so kubelet actuator probes still work.
  ingress: []
  egress:
    # Cluster DNS is the only in-cluster name-resolution dependency.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # NetworkPolicy cannot identify an API server or public hostname. The
    # trusted bootstrap replaces these required markers with observed IPv4
    # /32 CIDRs in a private render. No broad destination CIDR is permitted.
    # kubernetes.default is exposed on its ClusterIP :443 and DNATs to the
    # hosted node API endpoint :6443; kube-router's post-DNAT behavior must be
    # proven live before this policy is treated as an operational boundary.
    - to:
        - ipBlock:
            cidr: __API_SERVICE_IPV4_CIDR_REQUIRED__
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: __API_ENDPOINT_IPV4_CIDR_REQUIRED__
      ports:
        - protocol: TCP
          port: 6443
    # The fixed public probe address carries HTTPS and the preview allocator's
    # NodePorts 32000-32015 plus fixed dev-demo port 32016. Keep each NodePort
    # explicit because support for NetworkPolicy endPort ranges is not assumed.
    - to:
        - ipBlock:
            cidr: __PUBLIC_PROBE_IPV4_CIDR_REQUIRED__
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 32000
        - protocol: TCP
          port: 32001
        - protocol: TCP
          port: 32002
        - protocol: TCP
          port: 32003
        - protocol: TCP
          port: 32004
        - protocol: TCP
          port: 32005
        - protocol: TCP
          port: 32006
        - protocol: TCP
          port: 32007
        - protocol: TCP
          port: 32008
        - protocol: TCP
          port: 32009
        - protocol: TCP
          port: 32010
        - protocol: TCP
          port: 32011
        - protocol: TCP
          port: 32012
        - protocol: TCP
          port: 32013
        - protocol: TCP
          port: 32014
        - protocol: TCP
          port: 32015
        - protocol: TCP
          port: 32016
    # The hosted k3s LoadBalancer path DNATs public HTTPS to the kube-system
    # Traefik target port. Select only the observed Traefik pods rather than
    # reopening controller egress to the node or the kube-system namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kube-system
      ports:
        - protocol: TCP
          port: 8443
    # The Gateway identity probe is in-cluster. Select only Gateway pods in
    # externally owned canonical preview and dev-demo namespaces, and allow
    # the Service/target ports used by the private bridge probe.
    - to:
        - namespaceSelector:
            matchLabels:
              firemud.dev/preview: "true"
          podSelector:
            matchLabels:
              app: spring-cloud-gateway
        - namespaceSelector:
            matchLabels:
              firemud.dev/dev-demo: "true"
          podSelector:
            matchLabels:
              app: spring-cloud-gateway
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
    # Public TCP Proxy NodePorts are DNATed to the selected runtime pod's
    # listener. Keep this target-port rule scoped to the canonical preview and
    # dev-demo namespaces and the TCP Proxy workload label.
    - to:
        - namespaceSelector:
            matchLabels:
              firemud.dev/preview: "true"
          podSelector:
            matchLabels:
              app: tcp-proxy-service
        - namespaceSelector:
            matchLabels:
              firemud.dev/dev-demo: "true"
          podSelector:
            matchLabels:
              app: tcp-proxy-service
      ports:
        - protocol: TCP
          port: 2323
    # Ready additionally requires an mTLS handshake to the fixed Account gRPC
    # Service using the current projected leaf. Runtime Namespace labels are
    # externally owned and validated before the controller reaches this probe.
    - to:
        - namespaceSelector:
            matchLabels:
              firemud.dev/preview: "true"
          podSelector:
            matchLabels:
              app: account-service
        - namespaceSelector:
            matchLabels:
              firemud.dev/dev-demo: "true"
          podSelector:
            matchLabels:
              app: account-service
      ports:
        - protocol: TCP
          port: 6565
