x-local-java-env: &local-java-env
  BPL_JAVA_NMT_ENABLED: "false"
  BPL_JVM_THREAD_COUNT: "20"
  FIREMUD_GRPC_PLAINTEXT: "false"
  GRPC_SERVER_TLS_ENABLED: "true"

x-local-runtime-volumes: &local-runtime-volumes
  - ../dev-tools/certs/local-runtime/default:/app/certs:ro

services:
  account-service:
    build: null
    image: account-service:0.1.0
    pull_policy: never
    mem_limit: 768m
    environment:
      <<: *local-java-env
      FIREMUD_GRPC_CERT_CHAIN_PATH: /app/certs/workloads/account-service.crt
      FIREMUD_GRPC_PRIVATE_KEY_PATH: /app/certs/workloads/account-service.key
      FIREMUD_GRPC_CA_CERT_PATH: /app/certs/ca.crt
      FIREMUD_GRPC_WORKLOAD_NAMESPACE: local
    volumes:
      - ../dev-tools/certs/local-runtime/account-service:/app/certs:ro

  gateway:
    build: null
    image: spring-cloud-gateway:0.1.0
    pull_policy: never
    mem_limit: 768m
    environment:
      <<: *local-java-env
      FIREMUD_GATEWAY_HEADER_TRUST_TCP_PROXY_ALLOW_INSECURE_HEADERS_FROM_TRUSTED_CIDRS: "true"
      FIREMUD_GATEWAY_HEADER_TRUST_TCP_PROXY_INSECURE_TRUSTED_CIDRS_0: 172.16.0.0/12
    volumes: *local-runtime-volumes

  automation-scripting-service:
    build: null
    image: automation-scripting-service:0.1.0
    pull_policy: never
    mem_limit: 768m
    environment:
      <<: *local-java-env
    volumes: *local-runtime-volumes

  entity-management-service:
    build: null
    image: entity-management-service:0.1.0
    pull_policy: never
    mem_limit: 768m
    environment:
      <<: *local-java-env
    volumes: *local-runtime-volumes

  game-design-service:
    build: null
    image: game-design-service:0.1.0
    pull_policy: never
    mem_limit: 768m
    environment:
      <<: *local-java-env
    volumes: *local-runtime-volumes

  game-logic-service:
    build: null
    image: game-logic-service:0.1.0
    pull_policy: never
    mem_limit: 768m
    environment:
      <<: *local-java-env
    volumes: *local-runtime-volumes

  game-session-service:
    build: null
    image: game-session-service:0.1.0
    pull_policy: never
    mem_limit: 768m
    environment:
      <<: *local-java-env
      GAME_LOGIC_DEFAULT_ROOM_ID: "1"
      FIREMUD_GRPC_CERT_CHAIN_PATH: /app/certs/workloads/game-session-service.crt
      FIREMUD_GRPC_PRIVATE_KEY_PATH: /app/certs/workloads/game-session-service.key
      FIREMUD_GRPC_CA_CERT_PATH: /app/certs/ca.crt
    volumes:
      - ../dev-tools/certs/local-runtime/game-session-service:/app/certs:ro

  logging-admin-service:
    build: null
    image: logging-admin-service:0.1.0
    pull_policy: never
    mem_limit: 768m
    environment:
      <<: *local-java-env
      FIREMUD_GRPC_WORKLOAD_NAMESPACE: local
    volumes: *local-runtime-volumes

  social-groups-service:
    build: null
    image: social-groups-service:0.1.0
    pull_policy: never
    mem_limit: 768m
    environment:
      <<: *local-java-env
      FIREMUD_GRPC_CERT_CHAIN_PATH: /app/certs/workloads/social-groups-service.crt
      FIREMUD_GRPC_PRIVATE_KEY_PATH: /app/certs/workloads/social-groups-service.key
      FIREMUD_GRPC_CA_CERT_PATH: /app/certs/ca.crt
    volumes:
      - ../dev-tools/certs/local-runtime/social-groups-service:/app/certs:ro

  tcp-proxy-service:
    build: null
    image: tcp-proxy-service:0.1.0
    pull_policy: never
    mem_limit: 768m
    environment:
      <<: *local-java-env
      GATEWAY_WS_URL: ws://gateway:8080/ws/game
    volumes: *local-runtime-volumes

  world-management-service:
    build: null
    image: world-management-service:0.1.0
    pull_policy: never
    mem_limit: 768m
    environment:
      <<: *local-java-env
    volumes: *local-runtime-volumes

  pg-dump-cron:
    build: null
    image: pg-dump-cron:0.1.0
    pull_policy: never
