x-local-java-env: &local-java-env
  FIREMUD_GRPC_PLAINTEXT: "true"
  GRPC_SERVER_SECURITY_ENABLED: "false"
  GRPC_SERVER_TLS_ENABLED: "false"

services:
  account-service:
    environment:
      <<: *local-java-env

  gateway:
    environment:
      <<: *local-java-env
      FIREMUD_GATEWAY_HEADER_TRUST_TCP_PROXY_ALLOW_INSECURE_HEADERS_FROM_TRUSTED_CIDRS: "true"
      FIREMUD_GATEWAY_HEADER_TRUST_TCP_PROXY_INSECURE_TRUSTED_CIDRS_0: 172.16.0.0/12

  automation-scripting-service:
    environment:
      <<: *local-java-env

  entity-management-service:
    environment:
      <<: *local-java-env

  game-design-service:
    environment:
      <<: *local-java-env

  game-logic-service:
    environment:
      <<: *local-java-env

  game-session-service:
    environment:
      <<: *local-java-env
      GAME_LOGIC_DEFAULT_ROOM_ID: "1"

  logging-admin-service:
    environment:
      <<: *local-java-env

  social-groups-service:
    environment:
      <<: *local-java-env

  tcp-proxy-service:
    environment:
      <<: *local-java-env
      TCP_PROXY_GATEWAY_WS_URL_DEV: ws://gateway:8080/ws/game
      TCP_PROXY_DEFAULT_GAME_INSTANCE_ID: ${TCP_PROXY_DEFAULT_GAME_INSTANCE_ID:-1}
      TCP_PROXY_DEFAULT_TENANT_ID: ${TCP_PROXY_DEFAULT_TENANT_ID:-1}

  world-management-service:
    environment:
      <<: *local-java-env

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "8001:8001"
    environment:
      - REDISINSIGHT_HOST=0.0.0.0
    restart: unless-stopped
    depends_on:
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
