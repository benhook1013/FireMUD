# Local override for the development Compose stack. Do not reuse these settings
# as a template for preview or other production-like environments.
x-local-java-env: &local-java-env
  FIREMUD_GRPC_PLAINTEXT: "false"
  GRPC_SERVER_TLS_ENABLED: "true"

x-local-runtime-volumes: &local-runtime-volumes
  - ../dev-tools/certs/local-runtime/default:/app/certs:ro

services:
  account-service:
    environment:
      <<: *local-java-env
      FIREMUD_GRPC_CERT_CHAIN_PATH: /app/certs/workloads/account-service.crt
      FIREMUD_GRPC_PRIVATE_KEY_PATH: /app/certs/workloads/account-service.key
      FIREMUD_GRPC_CA_CERT_PATH: /app/certs/ca.crt
      FIREMUD_GRPC_WORKLOAD_NAMESPACE: local
    volumes:
      - ../dev-tools/certs/local-runtime/account-service:/app/certs:ro

  gateway:
    environment:
      <<: *local-java-env
      FIREMUD_GATEWAY_HEADER_TRUST_TCP_PROXY_ALLOW_INSECURE_HEADERS_FROM_TRUSTED_CIDRS: "true"
      FIREMUD_GATEWAY_HEADER_TRUST_TCP_PROXY_INSECURE_TRUSTED_CIDRS_0: 172.16.0.0/12
    volumes: *local-runtime-volumes

  automation-scripting-service:
    environment:
      <<: *local-java-env
    volumes: *local-runtime-volumes

  entity-management-service:
    environment:
      <<: *local-java-env
    volumes: *local-runtime-volumes

  game-design-service:
    environment:
      <<: *local-java-env
    volumes: *local-runtime-volumes

  game-logic-service:
    environment:
      <<: *local-java-env
    volumes: *local-runtime-volumes

  game-session-service:
    environment:
      <<: *local-java-env
      FIREMUD_GRPC_CERT_CHAIN_PATH: /app/certs/workloads/game-session-service.crt
      FIREMUD_GRPC_PRIVATE_KEY_PATH: /app/certs/workloads/game-session-service.key
      FIREMUD_GRPC_CA_CERT_PATH: /app/certs/ca.crt
    volumes:
      - ../dev-tools/certs/local-runtime/game-session-service:/app/certs:ro

  logging-admin-service:
    environment:
      <<: *local-java-env
      FIREMUD_GRPC_WORKLOAD_NAMESPACE: local
    volumes: *local-runtime-volumes

  social-groups-service:
    environment:
      <<: *local-java-env
      FIREMUD_GRPC_CERT_CHAIN_PATH: /app/certs/workloads/social-groups-service.crt
      FIREMUD_GRPC_PRIVATE_KEY_PATH: /app/certs/workloads/social-groups-service.key
      FIREMUD_GRPC_CA_CERT_PATH: /app/certs/ca.crt
    volumes:
      - ../dev-tools/certs/local-runtime/social-groups-service:/app/certs:ro

  tcp-proxy-service:
    environment:
      <<: *local-java-env
      GATEWAY_WS_URL: ws://gateway:8080/ws/game
      TCP_PROXY_DEFAULT_WORLD_SLUG: ${TCP_PROXY_DEFAULT_WORLD_SLUG:-demo}
      TCP_PROXY_DEFAULT_REALM_SLUG: ${TCP_PROXY_DEFAULT_REALM_SLUG:-production}
      TCP_PROXY_DEFAULT_POINTER_VERSION: ${TCP_PROXY_DEFAULT_POINTER_VERSION:-1}
      TCP_PROXY_DEFAULT_GAME_INSTANCE_ID: ${TCP_PROXY_DEFAULT_GAME_INSTANCE_ID:-1}
      TCP_PROXY_DEFAULT_TENANT_ID: ${TCP_PROXY_DEFAULT_TENANT_ID:-1}
    volumes: *local-runtime-volumes

  world-management-service:
    environment:
      <<: *local-java-env
    volumes: *local-runtime-volumes

  redisinsight:
    image: redis/redisinsight:2.70
    mem_limit: 256m
    ports:
      - "8001:8001"
    environment:
      - REDISINSIGHT_HOST=0.0.0.0
    restart: unless-stopped
    depends_on:
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
