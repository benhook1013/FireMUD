version: '3.9'

x-service-environment: &service-env
  FIREMUD_POSTGRES_HOST: ${FIREMUD_POSTGRES_HOST:-postgres}
  FIREMUD_POSTGRES_PORT: ${FIREMUD_POSTGRES_PORT:-5432}
  FIREMUD_POSTGRES_DB: ${FIREMUD_POSTGRES_DB:-firemud}
  FIREMUD_POSTGRES_USER: ${FIREMUD_POSTGRES_USER:-firemud}
  FIREMUD_POSTGRES_PASSWORD: ${FIREMUD_POSTGRES_PASSWORD:-firemud}
  FIREMUD_REDIS_COORD_HOST: ${FIREMUD_REDIS_COORD_HOST:-redis-coord}
  FIREMUD_REDIS_COORD_PORT: ${FIREMUD_REDIS_COORD_PORT:-6379}
  FIREMUD_REDIS_CACHE_HOST: ${FIREMUD_REDIS_CACHE_HOST:-redis-cache}
  FIREMUD_REDIS_CACHE_PORT: ${FIREMUD_REDIS_CACHE_PORT:-6379}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
  FLUENT_ELASTICSEARCH_HOST: ${FLUENT_ELASTICSEARCH_HOST:-elasticsearch}
  FLUENT_ELASTICSEARCH_PORT: ${FLUENT_ELASTICSEARCH_PORT:-9200}
  ASSET_STORE_ENDPOINT: ${ASSET_STORE_ENDPOINT:-http://minio:9000}
  ASSET_STORE_BUCKET: ${ASSET_STORE_BUCKET:-firemud-assets}
  ASSET_STORE_REGION: ${ASSET_STORE_REGION:-ap-southeast-2}
  ASSET_STORE_ACCESS_KEY: ${ASSET_STORE_ACCESS_KEY:-minio}
  ASSET_STORE_SECRET_KEY: ${ASSET_STORE_SECRET_KEY:-minio123}

x-service-healthcheck: &service-health
  test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
  interval: 10s
  timeout: 5s
  retries: 5

x-service-volumes: &service-vols
  - ../dev-tools/certs:/app/certs:ro

x-service-resources: &service-resources
  cpus: "0.5"
  mem_limit: 512m

x-service-env-file: &service-env-file
  - ../.env

services:
  account-service:
    build: ../services/account-service
    ports:
      - "8081:8080"
    <<: *service-resources
    environment:
      <<: *service-env
    env_file: *service-env-file
    volumes: *service-vols
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      <<: *service-health
  gateway:
    build: ../services/spring-cloud-gateway
    ports:
      - "8080:8080"
    <<: *service-resources
    environment:
      <<: *service-env
    env_file: *service-env-file
    volumes: *service-vols
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      <<: *service-health
  automation-scripting-service:
    build: ../services/automation-scripting-service
    ports:
      - "8082:8080"
    <<: *service-resources
    environment:
      <<: *service-env
    env_file: *service-env-file
    volumes: *service-vols
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      <<: *service-health
  entity-management-service:
    build: ../services/entity-management-service
    ports:
      - "8083:8080"
    <<: *service-resources
    environment:
      <<: *service-env
    env_file: *service-env-file
    volumes: *service-vols
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      <<: *service-health
  game-design-service:
    build: ../services/game-design-service
    ports:
      - "8084:8080"
    <<: *service-resources
    environment:
      <<: *service-env
    env_file: *service-env-file
    volumes: *service-vols
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      <<: *service-health
  game-logic-service:
    build: ../services/game-logic-service
    ports:
      - "8085:8080"
    <<: *service-resources
    environment:
      <<: *service-env
    env_file: *service-env-file
    volumes: *service-vols
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      <<: *service-health
  game-session-service:
    build: ../services/game-session-service
    ports:
      - "8086:8080"
    <<: *service-resources
    environment:
      <<: *service-env
    env_file: *service-env-file
    volumes: *service-vols
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      <<: *service-health
  logging-admin-service:
    build: ../services/logging-admin-service
    ports:
      - "8087:8080"
    <<: *service-resources
    environment:
      <<: *service-env
    env_file: *service-env-file
    volumes: *service-vols
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      <<: *service-health
  social-groups-service:
    build: ../services/social-groups-service
    ports:
      - "8088:8080"
    <<: *service-resources
    environment:
      <<: *service-env
    env_file: *service-env-file
    volumes: *service-vols
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      <<: *service-health
  tcp-proxy-service:
    build: ../services/tcp-proxy-service
    ports:
      - "2323:2323"
    <<: *service-resources
    environment:
      <<: *service-env
    env_file: *service-env-file
    volumes: *service-vols
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      <<: *service-health
  world-management-service:
    build: ../services/world-management-service
    ports:
      - "8089:8080"
    <<: *service-resources
    environment:
      <<: *service-env
    env_file: *service-env-file
    volumes: *service-vols
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      <<: *service-health

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: *service-env-file
    environment:
      POSTGRES_USER: ${FIREMUD_POSTGRES_USER:-firemud}
      POSTGRES_PASSWORD: ${FIREMUD_POSTGRES_PASSWORD:-firemud}
      POSTGRES_DB: ${FIREMUD_POSTGRES_DB:-firemud}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${FIREMUD_POSTGRES_USER:-firemud}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-coord:
    image: redis:7.4.3
    restart: unless-stopped
    env_file: *service-env-file
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-coord-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7.4.3
    restart: unless-stopped
    env_file: *service-env-file
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./config/redis/redis-cache.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${ASSET_STORE_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${ASSET_STORE_SECRET_KEY:-minio123}
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 $ASSET_STORE_ACCESS_KEY $ASSET_STORE_SECRET_KEY &&
        mc mb --ignore-existing local/$ASSET_STORE_BUCKET &&
        mc anonymous set download local/$ASSET_STORE_BUCKET &&
        printf '[{"AllowedMethods":["GET"],"AllowedOrigins":["%s"],"AllowedHeaders":["*"]}]' "$ASSET_STORE_CORS_ORIGIN" > /tmp/cors.json &&
        mc cors set local/$ASSET_STORE_BUCKET /tmp/cors.json
    environment:
      ASSET_STORE_ACCESS_KEY: ${ASSET_STORE_ACCESS_KEY:-minio}
      ASSET_STORE_SECRET_KEY: ${ASSET_STORE_SECRET_KEY:-minio123}
      ASSET_STORE_BUCKET: ${ASSET_STORE_BUCKET:-firemud-assets}
      ASSET_STORE_CORS_ORIGIN: ${ASSET_STORE_CORS_ORIGIN:-http://localhost:8080}

  pg-dump-cron:
    build:
      context: ..
      dockerfile: docker/pg-dump-cron.Dockerfile
    cpus: "0.5"
    mem_limit: 256m
    env_file: *service-env-file
    environment:
      <<: *service-env
      PG_DUMP_BUCKET: ${PG_DUMP_BUCKET:-}
      PG_DUMP_ENDPOINT: ${PG_DUMP_ENDPOINT:-}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  postgres-data:
  redis-coord-data:
  minio-data:
