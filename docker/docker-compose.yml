  world-management-service:
    build:
      context: ../services/world-management-service/build/libs
      dockerfile: ../../Dockerfile
      additional_contexts: *repo-root-context
    ports:
      - "8090:8080"
    <<: *service-resources
    environment:
      <<: *service-env
      SERVICE_SCHEMA: world_management_service
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: world_management_service
      SPRING_FLYWAY_TABLE: flyway_schema_history_world_management_service
    env_file: *service-env-file
    volumes: *service-vols
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      <<: *service-health

  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=200"]
    mem_limit: 1g
    restart: unless-stopped
    env_file: *service-env-file
    environment:
      POSTGRES_USER: ${FIREMUD_POSTGRES_USER:-firemud}
      POSTGRES_PASSWORD: ${FIREMUD_POSTGRES_PASSWORD:-firemud}
      POSTGRES_DB: ${FIREMUD_POSTGRES_DB:-firemud}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${FIREMUD_POSTGRES_USER:-firemud}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-coord:
    image: redis:7.4.3
    mem_limit: 512m
    restart: unless-stopped
    env_file: *service-env-file
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-coord-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7.4.3
    mem_limit: 256m
    restart: unless-stopped
    env_file: *service-env-file
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./config/redis/redis-cache.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: ["server", "/data"]
    mem_limit: 512m
    environment:
      MINIO_ROOT_USER: ${ASSET_STORE_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${ASSET_STORE_SECRET_KEY:-minio123}
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    mem_limit: 128m
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 $$ASSET_STORE_ACCESS_KEY $$ASSET_STORE_SECRET_KEY &&
        mc mb --ignore-existing local/$$ASSET_STORE_BUCKET &&
        mc anonymous set download local/$$ASSET_STORE_BUCKET &&
        printf '<CORSConfiguration><CORSRule><AllowedOrigin>%s</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedHeader>*</AllowedHeader></CORSRule></CORSConfiguration>' "$$ASSET_STORE_CORS_ORIGIN" > /tmp/cors.xml &&
        mc cors set local/$$ASSET_STORE_BUCKET /tmp/cors.xml || echo "Skipping MinIO CORS setup in compose bootstrap"
    environment:
      ASSET_STORE_ACCESS_KEY: ${ASSET_STORE_ACCESS_KEY:-minio}
      ASSET_STORE_SECRET_KEY: ${ASSET_STORE_SECRET_KEY:-minio123}
      ASSET_STORE_BUCKET: ${ASSET_STORE_BUCKET:-firemud-assets}
      ASSET_STORE_CORS_ORIGIN: ${ASSET_STORE_CORS_ORIGIN:-http://localhost:8080}

  pg-dump-cron:
    build:
      context: ..
      dockerfile: docker/pg-dump-cron.Dockerfile
    cpus: "0.5"
    mem_limit: 256m
    env_file: *service-env-file
    environment:
      <<: *service-env
      PG_DUMP_BUCKET: ${PG_DUMP_BUCKET:-}
      PG_DUMP_ENDPOINT: ${PG_DUMP_ENDPOINT:-}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  postgres-data:
  redis-coord-data:
  minio-data:
