x-service-environment: &service-env
  FIREMUD_POSTGRES_HOST: ${FIREMUD_POSTGRES_HOST:-postgres}
  FIREMUD_POSTGRES_PORT: ${FIREMUD_POSTGRES_PORT:-5432}
  FIREMUD_POSTGRES_DB: ${FIREMUD_POSTGRES_DB:-firemud}
  FIREMUD_POSTGRES_USER: ${FIREMUD_POSTGRES_USER:-firemud}
  FIREMUD_POSTGRES_PASSWORD: ${FIREMUD_POSTGRES_PASSWORD:-firemud}
  FIREMUD_AUTH_JWT_SECRET: ${FIREMUD_AUTH_JWT_SECRET:-dev-smoke-jwt-secret-dev-smoke-jwt-secret-1234567890}
  FIREMUD_GATEWAY_CONNECT_CONTEXT_JWT_SECRET: ${FIREMUD_GATEWAY_CONNECT_CONTEXT_JWT_SECRET:-dev-smoke-jwt-secret-dev-smoke-jwt-secret-1234567890}
  FIREMUD_REDIS_HOST: ${FIREMUD_REDIS_HOST:-redis-cache}
  FIREMUD_REDIS_PORT: ${FIREMUD_REDIS_PORT:-6379}
  FIREMUD_REDIS_COORD_HOST: ${FIREMUD_REDIS_COORD_HOST:-redis-coord}
  FIREMUD_REDIS_COORD_PORT: ${FIREMUD_REDIS_COORD_PORT:-6379}
  FIREMUD_REDIS_CACHE_HOST: ${FIREMUD_REDIS_CACHE_HOST:-redis-cache}
  FIREMUD_REDIS_CACHE_PORT: ${FIREMUD_REDIS_CACHE_PORT:-6379}
  OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
  FLUENT_ELASTICSEARCH_HOST: ${FLUENT_ELASTICSEARCH_HOST:-elasticsearch}
  FLUENT_ELASTICSEARCH_PORT: ${FLUENT_ELASTICSEARCH_PORT:-9200}
  ASSET_STORE_ENDPOINT: ${ASSET_STORE_ENDPOINT:-http://minio:9000}
  ASSET_STORE_BUCKET: ${ASSET_STORE_BUCKET:-firemud-assets}
  ASSET_STORE_REGION: ${ASSET_STORE_REGION:-ap-southeast-2}
  ASSET_STORE_ACCESS_KEY: ${ASSET_STORE_ACCESS_KEY:-minio}
  ASSET_STORE_SECRET_KEY: ${ASSET_STORE_SECRET_KEY:-minio123}
  FIREMUD_SMOKE_SEED_DEMO_RUNTIME_ENABLED: "true"
  SPRING_FLYWAY_ENABLED: "true"
  SPRING_GRPC_SERVER_PORT: "6565"
  SPRING_JPA_HIBERNATE_DDL_AUTO: none

x-service-healthcheck: &service-health
  test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
  start_period: 90s
  interval: 10s
  timeout: 5s
  retries: 5

x-service-volumes: &service-vols
  - ../dev-tools/certs:/app/certs:ro

x-service-resources: &service-resources
  cpus: "0.5"
  mem_limit: 512m

x-service-env-file: &service-env-file
  - ../.env

x-repo-root-context: &repo-root-context
  repo_root: ..

services:
  account-service:
    build:
      context: ../services/account-service/build/libs
      dockerfile: ../../Dockerfile
      additional_contexts: *repo-root-context
    ports:
      - "8081:8080"
    <<: *service-resources
    environment:
      <<: *service-env
      SERVICE_SCHEMA: account_service
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: account_service
      SPRING_FLYWAY_TABLE: flyway_schema_history_account_service
      FIREMUD_DATABASE_ENABLED: "true"
      FIREMUD_SMOKE_SEED_DEMO_ACCOUNT_ENABLED: "true"
    env_file: *service-env-file
    volumes: *service-vols
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-coord:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      <<: *service-health
  gateway:
