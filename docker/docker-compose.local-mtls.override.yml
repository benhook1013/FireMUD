        source: ${FIREMUD_LOCAL_COMPOSE_MTLS_CERT_ROOT:?devUp must set the local Compose mTLS certificate root}/workloads/game-design-service
        target: /app/certs
        read_only: true
        bind:
          create_host_path: false

  game-logic-service:
