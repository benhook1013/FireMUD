    volumes:
      - type: bind
        source: ${FIREMUD_LOCAL_COMPOSE_MTLS_CERT_ROOT:?devUp must set the local Compose mTLS certificate root}/workloads/game-logic-service
        target: /app/certs
        read_only: true
        bind:
          create_host_path: false

  game-session-service:
