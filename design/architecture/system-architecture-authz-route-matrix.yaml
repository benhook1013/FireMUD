    key: [control_plane_request_id, action_family_schema_id, action_family_schema_version, mutation_digest, exact_scope, authority_path_binding]
    exact_retry: same_reference_or_same_terminal_outcome
    changed_tuple: IDEMPOTENCY_CONFLICT
    ambiguous_response: read_only_reconcile_same_request_without_replacement_reference
    raw_reference_persistence: encrypted_bounded_response_only
