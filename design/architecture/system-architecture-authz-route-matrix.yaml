version: 3
updated_by: "platform-security+account-service"
default_action: deny
default_action_scope: declared_route_entries_only
unlisted_route_status: drift
default_deny_generation:
  enabled: false
  blocked_until: source_stable_openapi_protobuf_coverage_complete_and_validated
inheritance:
  mode: none
  rule: route_entries_do_not_inherit_authentication_or_authorization_fields
token_profiles:
  - profile: control-ui
    audience: control-ui
    kind: control_plane_user
  - profile: player-bootstrap
    audience: player-bootstrap
    kind: gameplay_bootstrap_user
  - profile: gameplay-connect
    audience: gameplay-connect
    kind: gameplay_handshake
  - profile: game-session-account-delegation
    audience: account-service
    kind: private_player_delegation
internal_workload_rules:
  caller_constraints: all_declared_constraints_must_pass
  caller_policy_alternatives: disjunctive
  allowed_callers_and_mtls_callers: conjunctive
classifications:
  - public
  - account_scoped
  - caller_membership_scoped
  - player_bootstrap_tenant
  - pre_tenant_discovery
  - public_production_onboarding
  - tenant_regular
  - billing_safe_tenant
  - cross_tenant_support_safe
  - cross_tenant_billing_safe
  - cross_tenant_data_bearing
  - internal_workload
routes:
  - service: game-session-service
    route: LOGIN
    scope: public
    classification: public
  - service: game-session-service
    route: LOGON
    scope: public
    classification: public
  - service: game-session-service
    route: WORLDS_PUBLIC
    transport_command: WORLDS
    scope: public
    classification: public
    response_profile: public_production_catalog_only
    required_live_checks: [public_production_visibility, runtime_entitlements]
  - service: game-session-service
    route: WORLDS_AUTHENTICATED
    transport_command: WORLDS
    scope: account
    classification: pre_tenant_discovery
    auth_path: game_session_authenticated_context
    accepted_token_profiles: []
    delegated_subject: authenticated_session_account
    visibility_contract: membership_or_public_production_visibility
    required_live_checks: [runtime_entitlements]
  - service: game-session-service
    route: REALMS
    scope: tenant
    classification: public_production_onboarding
    visibility_contract: membership_or_public_production_or_realm_access_grant
    required_live_checks: [realm_visibility, runtime_entitlements]
  - service: game-session-service
    route: CHARS
    scope: tenant
    classification: public_production_onboarding
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    required_live_checks: [membership, conditional_realm_access_grant, runtime_entitlements]
  - service: game-session-service
    route: JOIN
    scope: tenant
    classification: public_production_onboarding
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: false
    required_live_checks: [public_production_admission, runtime_entitlements, admission_pointer]
    mutation_contract: explicit_public_membership_atomic
  - service: game-session-service
    route: PLAY
    scope: tenant
    classification: public_production_onboarding
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    required_live_checks: [membership, conditional_realm_access_grant, runtime_entitlements, admission_pointer]
    canonical_errors:
      any_of: [JOIN_REQUIRED, WORLD_ACCESS_DENIED, CONNECT_CONTEXT_INVALID, CONNECT_SCOPE_MISMATCH, ADMISSION_POINTER_UNAVAILABLE]
  - service: account-service
    route: POST /auth/bootstrap/worlds/{worldSlug}/realms/{realmSlug}/characters
    scope: tenant
    classification: public_production_onboarding
    auth_path: player_bootstrap
    accepted_token_profiles: [player-bootstrap]
    subject_binding: caller_account_id
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    required_live_checks: [membership, conditional_realm_access_grant, runtime_entitlements]
    delegates_to: entity-management-service/CreateCharacter
  - service: game-session-service
    route: StartSession
    scope: tenant
    classification: tenant_regular
    tenant_billing_authority_generation_applies: true
    membership_authority_generation_applies: true
    required_live_checks: [runtime_entitlements]
    accepted_token_profiles: [control-ui]
    roles:
      any_of: [tenantAdmin, platformAdmin]
  - service: game-session-service
    route: RestartSession
    scope: tenant
    classification: tenant_regular
    tenant_billing_authority_generation_applies: true
    membership_authority_generation_applies: true
    required_live_checks: [runtime_entitlements]
    accepted_token_profiles: [control-ui]
    roles:
      any_of: [tenantAdmin, platformAdmin]
  - service: game-session-service
    route: StopSession
    scope: tenant
    classification: tenant_regular
    tenant_billing_authority_generation_applies: true
    membership_authority_generation_applies: true
    required_live_checks: [runtime_entitlements]
    accepted_token_profiles: [control-ui]
    roles:
      any_of: [tenantAdmin, platformAdmin]
  - service: game-session-service
    route: RefreshRoles
    scope: tenant
    classification: tenant_regular
    tenant_billing_authority_generation_applies: true
    membership_authority_generation_applies: true
    accepted_token_profiles: [control-ui]
    roles:
      any_of: [tenantAdmin, platformAdmin]
  - service: account-service
    route: AuthLogin
    scope: public
    classification: public
    issued_token_profile: control-ui
    issued_token_audience: control-ui
  - service: account-service
    route: PlayerBootstrapLogin
    scope: public
    classification: public
    issued_token_profile: player-bootstrap
    issued_token_audience: player-bootstrap
  - service: account-service
    route: EnsurePublicProductionPlayerMembership
    scope: tenant
    classification: public_production_onboarding
    auth_path: player_bootstrap
    accepted_token_profiles: [player-bootstrap]
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: false
    required_live_checks: [public_production_admission, runtime_entitlements, admission_pointer]
    mutation_contract: explicit_public_membership_atomic
  - service: account-service
    route: DELETE /tenants/{tenantId}/memberships/me
    scope: tenant
    classification: caller_membership_scoped
    subject_binding: caller_account_id
    accepted_token_profiles: [control-ui]
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    required_live_checks: [membership]
    mutation_contract: caller_bound_membership_delete_generation_advance
  - service: account-service
    route: AuthLogout
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id
    accepted_token_profiles: [control-ui, player-bootstrap]
    idempotent_retry_contract: absent_exact_token_record_noop_after_local_validation
  - service: account-service
    route: AuthLogoutAll
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id
    accepted_token_profiles: [control-ui, player-bootstrap]
    idempotent_retry_contract: superseded_token_noop_after_durable_logout_all_proof
  - service: account-service
    route: GetProfile
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id_or_platform_admin
    accepted_token_profiles: [control-ui]
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin, billingAdmin, support]
  - service: account-service
    route: UpdateProfile
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id_or_platform_admin
    accepted_token_profiles: [control-ui]
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin, billingAdmin, support]
  - service: account-service
    route: ExportAccount
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id_or_platform_admin
    accepted_token_profiles: [control-ui]
    response_profile: full_account_export
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin, billingAdmin, support]
  - service: account-service
    route: DeleteAccount
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id_or_platform_admin
    accepted_token_profiles: [control-ui]
    mutation_contract: account_delete_requires_no_nonterminal_owned_subscriptions
    canonical_errors:
      any_of: [ACCOUNT_DELETE_ACTIVE_BILLING_OWNER]
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin, billingAdmin, support]
  - service: account-service
    route: LinkExternalAccount
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id_or_platform_admin
    accepted_token_profiles: [control-ui]
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin, billingAdmin, support]
  - service: account-service
    route: IssueConnectToken
    scope: tenant
    classification: player_bootstrap_tenant
    auth_path: player_bootstrap
    accepted_token_profiles: [player-bootstrap]
    issued_token_profile: gameplay-connect
    issued_token_audience: gameplay-connect
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    required_live_checks: [membership, membership_generation, conditional_realm_access_grant, runtime_entitlements, admission_pointer]
    canonical_errors:
      any_of: [ADMISSION_POINTER_UNAVAILABLE, CONNECT_SCOPE_MISMATCH, ENTITLEMENT_UNAVAILABLE]
    subject_binding: caller_account_id
  - service: account-service
    route: Authenticate
    scope: account
    classification: internal_workload
    auth_path: mtls_workload
    issued_token_state: none
    accepted_token_profiles: []
    token_audience: none
    issued_token_profile: game-session-account-delegation
    issued_token_audience: account-service
    allowed_callers:
      any_of: [game-session-service]
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/game-session-service"]
    credential_source_context: required_trusted_server_derived
    delegated_subject: none_before_authentication
  - service: account-service
    route: RefreshGameplayServiceToken
    scope: tenant
    classification: internal_workload
    auth_path: exact_mtls_workload_plus_caller_specific_context
    issued_token_state: current_exact_private_delegation_when_player_scoped
    accepted_token_profiles: [game-session-account-delegation]
    token_audience: account-service
    issued_token_profile: game-session-account-delegation
    issued_token_audience: account-service
    allowed_callers:
      any_of: [game-session-service]
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/game-session-service"]
    delegated_subject: gameplay_binding_subject
    required_live_checks: [issuer_generation, current_token_generation, account_generation, tenant_generation, membership_generation, membership, runtime_entitlements, conditional_realm_grant, grant_version]
    realm_grant_authority: conditional_account_owned
    realm_grant_version: required_when_grant_gated
  - service: account-service
    route: GetTenantMembershipForRuntime
    scope: tenant
    classification: internal_workload
    auth_path: mtls_workload
    issued_token_state: none
    accepted_token_profiles: []
    token_audience: none
    allowed_callers:
      any_of: [game-session-service]
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/game-session-service"]
    delegated_subject: typed_player_execution_context
    required_live_checks: [membership]
  - service: account-service
    route: GetRealmAccessGrant
    scope: tenant
    classification: internal_workload
    auth_path: mtls_workload
    issued_token_state: none
    accepted_token_profiles: []
    token_audience: none
    allowed_callers:
      any_of: [game-session-service]
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/game-session-service"]
    delegated_subject: typed_player_execution_context
    required_live_checks: [conditional_realm_access_grant]
  - service: account-service
    route: ListRealmAccessGrantsForAccount
    scope: tenant
    classification: internal_workload
    auth_path: mtls_workload
    issued_token_state: none
    accepted_token_profiles: []
    token_audience: none
    allowed_callers:
      any_of: [game-session-service]
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/game-session-service"]
    delegated_subject: typed_player_execution_context
  - service: account-service
    route: GetTenantEntitlementsForRuntime
    scope: tenant
    classification: internal_workload
    tenant_billing_authority_generation_applies: true
    membership_authority_generation_applies: true
    response_profile: runtime_admission
    caller_policies:
      - caller: game-session-service
        auth_path: mtls_workload_plus_current_token_generation
        issued_token_state: current_exact_private_delegation
        accepted_token_profiles: [game-session-account-delegation]
        token_audience: account-service
        mtls_identity: "spiffe://firemud/ns/{namespace}/sa/game-session-service"
        delegated_subject: typed_player_execution_context
      - caller: world-management-service
        auth_path: mtls_workload
        issued_token_state: none
        accepted_token_profiles: []
        token_audience: none
        mtls_identity: "spiffe://firemud/ns/{namespace}/sa/world-management-service"
        caller_context: tenant_and_operation_bound_instance_lifecycle_context
        delegated_subject: instance_lifecycle_context
  - service: account-service
    route: GetTenantEntitlementsTenant
    scope: tenant
    classification: billing_safe_tenant
    accepted_token_profiles: [control-ui]
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    required_live_checks: [membership]
    response_profile: high_level_only
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: GetTenantEntitlementsCrossTenantSupportSafe
    scope: cross_tenant
    classification: cross_tenant_support_safe
    accepted_token_profiles: [control-ui]
    response_profile: high_level_only
    roles:
      any_of: [support, platformAdmin]
  - service: account-service
    route: GetSubscriptionTenantHighLevel
    scope: tenant
    classification: billing_safe_tenant
    accepted_token_profiles: [control-ui]
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    required_live_checks: [membership]
    response_profile: high_level_only
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: ExportTenantData
    scope: tenant
    classification: billing_safe_tenant
    accepted_token_profiles: [control-ui]
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    required_live_checks: [membership]
    response_profile: tenant_export_only
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: GetSubscriptionCrossTenantSupportSafe
    scope: cross_tenant
    classification: cross_tenant_support_safe
    accepted_token_profiles: [control-ui]
    response_profile: high_level_only
    roles:
      any_of: [support, platformAdmin]
  - service: account-service
    route: ListSubscriptionsTenantHighLevel
    scope: tenant
    classification: billing_safe_tenant
    accepted_token_profiles: [control-ui]
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    required_live_checks: [membership]
    response_profile: high_level_only
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: ListSubscriptionsCrossTenantSupportSafe
    scope: cross_tenant
    classification: cross_tenant_support_safe
    accepted_token_profiles: [control-ui]
    response_profile: high_level_only
    roles:
      any_of: [support, platformAdmin]
  - service: account-service
    route: ListSubscriptionsCrossTenantBillingSafeReports
    scope: cross_tenant
    classification: cross_tenant_billing_safe
    accepted_token_profiles: [control-ui]
    response_profile: billing_reporting
    roles:
      any_of: [billingAdmin, platformAdmin]
  - service: account-service
    route: GetCallerTenantMembershipTenant
    scope: tenant
    classification: billing_safe_tenant
    accepted_token_profiles: [control-ui]
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    required_live_checks: [membership]
    response_profile: membership_self_only
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: GetTenantMembershipForAccountCrossTenant
    scope: cross_tenant
    classification: cross_tenant_billing_safe
    accepted_token_profiles: [control-ui]
    response_profile: membership_reporting
    roles:
      any_of: [billingAdmin, platformAdmin]
  - service: account-service
    route: BillingArtifactsTenant
    scope: tenant
    classification: billing_safe_tenant
    accepted_token_profiles: [control-ui]
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    required_live_checks: [membership]
    mutation_contract: shared_instrument_ack_required
    canonical_errors:
      any_of: [BILLING_SHARED_INSTRUMENT_ACK_REQUIRED, MEMBERSHIP_AUTH_UNAVAILABLE]
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: BillingArtifactsCrossTenant
    scope: cross_tenant
    classification: cross_tenant_billing_safe
    accepted_token_profiles: [control-ui]
    roles:
      any_of: [billingAdmin, platformAdmin]
