version: 9
updated_by: "platform-security+account-service"
default_action: deny
default_action_scope: declared_route_entries_only
unlisted_route_status: drift
route_status_vocabulary:
  - current_openapi_operator_surface
  - target_not_currently_routable
route_status_override_vocabulary:
  - gate_wins_for_applies_to
operator_mutation_support_gate:
  status: target_not_currently_routable
  route_status_override: gate_wins_for_applies_to
  required_before_enablement:
    - published_action_family_schema
    - shared_cross_language_mutationDigest_v1_golden_vectors
    - account_issued_authorization_reference_issuance_and_owner_redemption
  applies_to:
    - logging-admin-service/POST /feature-flags/toggle
    - logging-admin-service/POST /moderation/actions
    - logging-admin-service/ApplyModerationAction
    - logging-admin-service/POST /tick-remediation/pause
    - logging-admin-service/POST /tick-remediation/resume
    - logging-admin-service/POST /admission-pointers
    - logging-admin-service/POST /admission-pointers/cutover
    - logging-admin-service/POST /admission-pointers/version-upgrades
    - game-session-service/ToggleFeatureFlag
    - game-session-service/PauseTicksForScope
    - game-session-service/ResumeTicksForScope
    - game-session-service/SetAdmissionPointer
    - game-session-service/PrepareVersionUpgrade
    - game-session-service/ExecutePreparedVersionCutover
    - game-session-service/StartSession
    - game-session-service/RestartSession
    - game-session-service/StopSession
    - game-session-service/POST /sessions
    - game-session-service/POST /sessions/{sessionId}/stop
    - game-session-service/POST /sessions/{sessionId}/restart
  live_exceptions:
    - logging-admin-service/GET /admission-pointers
    - logging-admin-service/GET /admission-pointers/{tenantId}/{worldSlug}/{realmSlug}/audit
    - logging-admin-service/GET /admission-pointers/version-upgrades/{tenantId}/{preparationId}
    - logging-admin-service/EvaluateModerationPolicy
  coverage_drift:
    - identity: logging-admin-service/ApplyModerationAction
      status: drift-found
      note: The gRPC action is documented but unavailable/gated and has no current route entry until its mutation schema and Account authorization-reference flow converge.
    - identity: logging-admin-service/GET /admission-pointers
      status: drift-found
      note: This live read is documented and implemented, but its source-stable route inventory is not yet represented in the matrix.
    - identity: logging-admin-service/GET /admission-pointers/{tenantId}/{worldSlug}/{realmSlug}/audit
      status: drift-found
      note: This live audit read is documented and implemented, but its source-stable route inventory is not yet represented in the matrix.
    - identity: logging-admin-service/GET /admission-pointers/version-upgrades/{tenantId}/{preparationId}
      status: drift-found
      note: This live prepared-upgrade proof read is documented and implemented, but its source-stable route inventory is not yet represented in the matrix.
    - identity: logging-admin-service/EvaluateModerationPolicy
      status: drift-found
      note: This live internal policy-evaluation read is documented and consumed by enforcement owners, but its source-stable route inventory is not yet represented in the matrix.
default_deny_generation:
  enabled: false
  blocked_until: source_stable_openapi_protobuf_coverage_complete_and_validated
inheritance:
  mode: none
  rule: route_entries_do_not_inherit_authentication_or_authorization_fields
token_profiles:
  - profile: control-ui
    type: control_plane_user
    issuer: firemud-account-service
    audience: control-ui
  - profile: player-bootstrap
    type: gameplay_bootstrap_user
    issuer: firemud-account-service
    audience: player-bootstrap
  - profile: gameplay-connect
    type: gameplay_handshake
    issuer: firemud-account-service
    audience: gameplay-connect
  - profile: game-session-account-delegation
    type: private_player_delegation
    issuer: firemud-account-service
    audience: account-service
auth_path_vocabulary:
  - control_ui
  - control_ui_plus_current_role_and_role_appropriate_assurance
  - control_ui_plus_current_tenant_role
  - control_ui_plus_recent_reauthentication_and_independent_totp
  - exact_mtls_workload
  - exact_mtls_workload_plus_caller_specific_context
  - exact_mtls_workload_plus_current_token_generation
  - exact_mtls_workload_plus_forwarded_control_ui
  - exact_mtls_workload_plus_account_operator_authorization_reference
  - exact_mtls_workload_plus_versioned_automation_policy
  - game_session_authenticated_context
  - gameplay_connect
  - gameplay_connect_cookie_revoke
  - pending_deletion_access
  - player_bootstrap
  - security_lock_export
internal_workload_rules:
  caller_constraints: all_declared_constraints_must_pass
  caller_policy_alternatives: disjunctive
  allowed_callers_and_mtls_callers: conjunctive
  caller_policies_schema:
    identity_fields:
      caller: method_caller_identity
      mtls_identity: certificate_identity
    identity_relation: conjunctive
route_authentication_rules:
  accepted_token_profile_audiences:
    multi_profile_routes: exact_profile_to_audience_map_required
    audience_source: token_profiles
  gameplay_websocket_entrypoint:
    canonical_route: /ws/game/**
    supported_variants: [first_party_cookie, trusted_tcp_proxy]
    future_variants:
      non_first_party_public_header:
        route: /ws/game/**
        carrier: X-Firemud-Connect-Token
        applicability: explicit_non_first_party_public_classification_only
        status: unavailable_until_dedicated_route_variant_and_proof
        rejection_until_available: CONNECT_TOKEN_REJECTED
    fail_closed_rules: [no_alternate_gameplay_websocket_entrypoint, no_header_fallback, no_carrier_precedence]
  differing_profile_predicates:
    multi_profile_routes: exact_profile_to_type_and_issuer_maps_required
    type_source: token_profiles
    issuer_source: token_profiles
receiver_predicate_contract:
  token_profile: exact_registered_profile_or_none
  token_type: exact_registered_type_or_none
  token_issuer: exact_account_issuer_or_none
  token_audience: exact_registered_audience_or_none
  mtls_caller: concrete_certificate_identity_for_internal_methods
  method_policy_rule: exact_declared_route_and_caller_policy
tenant_generation_policy:
  applies_by_default: true
  required_authority_semantics: class_metadata_for_conditional_route_or_token_authority
  exception_allowlist:
    billing_safe_tenant:
      target_tenant_generation: false
      required_authority: [issuer_generation, account_generation, membership_generation, membership, current_operator_roles]
    cross_tenant_support_safe:
      target_tenant_generation: false
      required_authority: [issuer_generation, account_generation, current_global_role, role_appropriate_assurance]
      role_assurance_policy: privileged_control_when_global_role
    cross_tenant_billing_safe:
      target_tenant_generation: false
      required_authority: [issuer_generation, account_generation, current_global_role, role_appropriate_assurance]
      role_assurance_policy: privileged_control_when_global_role
  no_target_tenant_classifications:
    public:
      target_tenant_generation: false
      generation_behavior: no_tenant_authority
      required_authority: []
      contract_justification: Public routes do not authorize a target tenant; unauthenticated routes accept no JWT, and token-issuing routes issue only the exact registered profile declared by the route.
      target_tenant_generation_advance_behavior: remains_valid
    account_scoped:
      target_tenant_generation: false
      generation_behavior: issuer_and_account_authority_only
      required_authority: [issuer_generation, account_generation]
      contract_justification: Account-scoped routes bind authority to the caller account and never authorize a target tenant; target-tenant generation is therefore not an input to these account-owned operations.
      target_tenant_generation_advance_behavior: remains_valid
    caller_membership_scoped:
      target_tenant_generation: false
      generation_behavior: caller_membership_authority_only
      required_authority: [membership, membership_generation]
      contract_justification: Caller-membership routes authorize only the caller's existing account-to-tenant relationship; membership authority is live and target-tenant generation is not an authority input.
      target_tenant_generation_advance_behavior: remains_valid
    player_bootstrap_tenant:
      target_tenant_generation: false
      generation_behavior: membership_authority_when_route_requires_existing_membership
      required_authority: [membership, membership_generation]
      contract_justification: Player-bootstrap routes use caller-bound membership and gameplay admission evidence where required; the explicit IssueConnectToken route additionally binds one selected tenant authority generation and does not make that exception implicit for other bootstrap routes.
      target_tenant_generation_advance_behavior: route_declared
    pre_tenant_discovery:
      target_tenant_generation: false
      generation_behavior: no_tenant_or_membership_authority
      required_authority: []
      contract_justification: Pre-tenant discovery runs before a single tenant is selected and derives visibility from the authenticated account context and public or entitlement evidence, so no tenant authority generation applies.
      target_tenant_generation_advance_behavior: remains_valid
    public_production_onboarding:
      target_tenant_generation: false
      generation_behavior: membership_authority_after_membership_exists
      required_authority: [membership, membership_generation]
      contract_justification: Public-production onboarding may validate or create caller-bound membership before normal gameplay admission, but it never authorizes through target-tenant generation; post-join actions use their declared membership authority.
      target_tenant_generation_advance_behavior: remains_valid
    gameplay_admission:
      target_tenant_generation: false
      generation_behavior: mode_selected_membership_and_grant_authority
      required_authority: []
      contract_justification: Post-transport gameplay admission, including PLAY, selects exactly one current Account-backed admission mode and then applies that mode's explicit membership, generation, grant, entitlement, routing, and binding checks; PLAY separately binds the selected target tenant generation and no mode inherits another mode's authority.
      target_tenant_generation_advance_behavior: route_declared
    internal_workload:
      target_tenant_generation: false
      generation_behavior: route_declared_caller_and_target_authority
      required_authority: []
      contract_justification: Internal workload routes have no inherited tenant authority; each exact mTLS and delegated-authority route declares whether caller, tenant, membership, or target-tenant generations apply.
      target_tenant_generation_advance_behavior: route_declared
    pending_deletion_scoped:
      target_tenant_generation: false
      generation_behavior: pending_deletion_credential_only
      issuer_authority_generation_applies: false
      account_authority_generation_applies: false
      tenant_billing_authority_generation_applies: false
      membership_authority_generation_applies: false
      required_authority: [pending_deletion_state, pending_deletion_credential_registry]
      contract_justification: Dedicated Account-issued opaque pending-deletion credentials are bound to the account and deletion workflow; issuer, account, tenant, and membership generations are not authority inputs for these account-owned recovery actions.
      target_tenant_generation_advance_behavior: denied_by_pending_deletion_credential_contract
      negative_proof:
        required:
          - pending_deletion_route_denied_after_target_tenant_generation_advance
    security_lock_export_scoped:
      target_tenant_generation: false
      generation_behavior: security_lock_export_credential_only
      issuer_authority_generation_applies: false
      account_authority_generation_applies: false
      tenant_billing_authority_generation_applies: false
      membership_authority_generation_applies: false
      required_authority: [security_lock_export_credential_registry, security_lock_recovery_state, security_lock_export_action_family]
      contract_justification: The Account-issued security-lock-export credential is bound to one recovered global account and export lifecycle; ordinary issuer, account, tenant, and membership generations are not authority inputs while the account remains security-locked.
      target_tenant_generation_advance_behavior: remains_bound_to_exact_recovery_export_lifecycle
      negative_proof:
        required:
          - security_lock_export_recovery_case_mismatch_denied
          - security_lock_export_export_job_mismatch_denied
          - security_lock_export_action_family_mismatch_denied
  negative_proof:
    tenant_authority_classifications: [tenant_regular, cross_tenant_data_bearing]
    required:
      - non_allowlisted_route_denied_after_target_tenant_generation_advance
      - billing_safe_tenant_denied_without_exact_membership_generation_and_live_tenant_admin
      - support_safe_denied_without_live_support_or_platform_admin_and_global_scope
      - support_safe_denied_without_role_appropriate_assurance
      - support_safe_support_branch_does_not_require_privileged_control
      - support_safe_platform_admin_branch_denied_without_privileged_control
      - billing_safe_denied_without_live_billing_admin_or_platform_admin_and_privileged_control
      - new_route_class_does_not_inherit_exception
tenant_membership_policy:
  tenant_owned_writes_require_existing_membership: true
  public_production_join_exception:
    classification: public_production_onboarding
    membership_creation: caller_bound_after_validation
    required_pre_membership_checks:
      [public_production_visibility, public_production_admission, runtime_entitlements, admission_pointer, idempotency]
    routes:
      - [game-session-service, JOIN]
      - [account-service, POST /auth/bootstrap/join]
      - [account-service, JoinPublicProductionMembership]
authority_evidence_policy:
  fail_closed_fresh_evidence:
    applies_to: [admission, play, renewal, reconnect, resume, protected_control_plane_mutation]
    unreachable_or_timeout: AUTH_UNAVAILABLE
    reachable_invalid_or_ambiguous: AUTH_SESSION_REVOKED
    route_specific_canonical_errors_precedence: true
  bound_ordinary_gameplay:
    applies_to: already_bound_instance_runtime
    strict_registry_middleware: false
    authority_generation_reread: false
    pointer_authority_reread: false
    required_fences: [bound_game_instance, runtime_fence]
    continuity: existing_validated_bounded_lease_only
