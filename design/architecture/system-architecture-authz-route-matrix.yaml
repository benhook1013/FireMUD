    schema_pair: [action_family_schema_id, action_family_schema_version]
    digest: mutationDigest/v1
    bounded_input_layers: [raw, normalized]
    validation_before_issuance_or_forwarding:
      - typed_scope_target_expected_version_mutation_and_audit_reason
      - explicit_presence_or_absence
      - published_schema_and_cross_language_golden_vectors
      - raw_and_normalized_limits
