version: 9
updated_by: "platform-security+account-service"
default_action: deny
default_action_scope: declared_route_entries_only
unlisted_route_status: drift
route_status_vocabulary:
  - current_openapi_operator_surface
  - target_not_currently_routable
default_deny_generation:
  enabled: false
  blocked_until: source_stable_openapi_protobuf_coverage_complete_and_validated
inheritance:
  mode: none
  rule: route_entries_do_not_inherit_authentication_or_authorization_fields
token_profiles:
  - profile: control-ui
    type: control_plane_user
    issuer: firemud-account-service
    audience: control-ui
  - profile: player-bootstrap
    type: gameplay_bootstrap_user
    issuer: firemud-account-service
    audience: player-bootstrap
  - profile: gameplay-connect
    type: gameplay_handshake
    issuer: firemud-account-service
    audience: gameplay-connect
  - profile: game-session-account-delegation
    type: private_player_delegation
    issuer: firemud-account-service
    audience: account-service
auth_path_vocabulary:
  - control_ui_plus_current_role_and_role_appropriate_assurance
  - control_ui_plus_recent_reauthentication_and_independent_totp
  - exact_mtls_workload
  - exact_mtls_workload_plus_caller_specific_context
  - exact_mtls_workload_plus_current_token_generation
  - exact_mtls_workload_plus_forwarded_control_ui
  - exact_mtls_workload_plus_account_operator_authorization_reference
  - exact_mtls_workload_plus_versioned_automation_policy
  - game_session_authenticated_context
  - gameplay_connect
  - gameplay_connect_cookie_revoke
  - pending_deletion_access
  - player_bootstrap
internal_workload_rules:
  caller_constraints: all_declared_constraints_must_pass
  caller_policy_alternatives: disjunctive
  allowed_callers_and_mtls_callers: conjunctive
  caller_policies_schema:
    identity_fields:
      caller: method_caller_identity
      mtls_identity: certificate_identity
    identity_relation: conjunctive
route_authentication_rules:
  accepted_token_profile_audiences:
    multi_profile_routes: exact_profile_to_audience_map_required
    audience_source: token_profiles
receiver_predicate_contract:
  token_profile: exact_registered_profile_or_none
  token_type: exact_registered_type_or_none
  issuer: exact_account_issuer_or_none
  audience: exact_registered_audience_or_none
  mtls_caller: concrete_certificate_identity_for_internal_methods
  method_policy: exact_declared_route_and_caller_policy
tenant_generation_policy:
  applies_by_default: true
  exception_allowlist:
    billing_safe_tenant:
      target_tenant_generation: false
      required_authority: [issuer_generation, account_generation, membership_generation, membership]
    cross_tenant_support_safe:
      target_tenant_generation: false
      required_authority: [issuer_generation, account_generation, current_global_role, role_appropriate_assurance]
      role_assurance:
        support: none
        platformAdmin: privileged_control
    cross_tenant_billing_safe:
      target_tenant_generation: false
      required_authority: [issuer_generation, account_generation, current_global_role, role_appropriate_assurance]
  negative_proof:
    required:
      - non_allowlisted_route_denied_after_target_tenant_generation_advance
      - billing_safe_tenant_denied_without_exact_membership_generation_and_live_tenant_admin
      - support_safe_denied_without_live_support_or_platform_admin_and_global_scope
      - support_safe_denied_without_role_appropriate_assurance
      - billing_safe_denied_without_live_billing_admin_or_platform_admin_and_privileged_control
      - new_route_class_does_not_inherit_exception
entitlement_contract:
  owner: account-service
  binding: exact_tenant_id
  response_authority: tenant_bound_entitlement_version
  cross_tenant_inheritance: forbidden
  account_wide_fallback: forbidden
required_live_check_vocabulary:
  # Captured in a private delegation and compared by the receiving owner.
  - account_generation
  - account_state_bootstrap_eligible
  - account_state_login_eligible
  - admission_pointer
  - browser_origin
  - cancellation_window
  - conditional_realm_access_grant
  - connect_scope_match
  - connect_token_single_use_consume
  - csrf
  # Live Account-owned generation reread for control-plane authority.
  - current_account_generation
  - current_account_roles
  - current_automation_policy
  - current_global_role
  - current_operator_authorization
  - current_operator_roles
  - current_session
  - current_token_generation
  - expected_pointer_version
  - explicit_deletion_confirmation
  - export_availability
  - grant_version
  - independent_totp
  - issuer_generation
  - membership
  - membership_generation
  - membership_when_tenant_role
  - moderation_report_policy
  - no_nonterminal_owned_subscriptions
  - pending_deletion_credential_registry
  - pending_deletion_state
  - prepared_version_upgrade
  - prepared_version_upgrade_when_target_changes
  - public_production_admission
  - public_production_visibility
  - realm_visibility
  - recent_account_authentication
  - recovery_resume_gate
  - replay_admission_fence_match
  - replay_protection_available
  - role_appropriate_assurance
  - runtime_entitlements
  - runtime_ownership
  - settlement_scope
  - subscription_binding_integrity
  - target_tenant_generation
  - tenant_generation
  - trusted_proxy_identity
  - workload_action_scope
implementation_status:
  known_drift:
    - public_production_membership_is_created_implicitly_by_connect_token_or_play_in_current_runtime; this violates the explicit_join_security_contract and affected admission must fail closed in the target state
classifications:
  - public
  - account_scoped
  - caller_membership_scoped
  - player_bootstrap_tenant
  - pre_tenant_discovery
  - public_production_onboarding
  - tenant_regular
  - billing_safe_tenant
  - cross_tenant_support_safe
  - cross_tenant_billing_safe
  - cross_tenant_data_bearing
  - internal_workload
  - pending_deletion_scoped
role_assurance:
  vocabulary:
    privileged_control_when_global_role:
      elevation_contract: privileged_control
      applies_when: caller_authorizes_via_global_role
  privileged_control_when_global_role:
    resolution: role_specific_global_role_assurance
    requirements:
      platformAdmin:
        role_check: current_global_role
        elevation_contract: privileged_control
        applies_to:
          route_classifications: [account_scoped, tenant_regular, cross_tenant_support_safe, cross_tenant_billing_safe, cross_tenant_data_bearing]
      billingAdmin:
        role_check: current_global_role
        elevation_contract: privileged_control
        applies_to:
          route_classifications: [cross_tenant_billing_safe]
      support:
        role_check: current_global_role
        elevation_contract: none
        applies_to:
          route_classifications: [cross_tenant_support_safe]
elevation_contracts:
  privileged_control:
    entry_route: account-service/EnterPrivilegedControlWindow
    accepted_token_profile: control-ui
    factor: independent_totp
    state: server_side_role_scoped_window
    required_bindings: [account_id, token_jti, account_generation, requested_global_role, issued_at, expires_at]
    invalidated_by: [token_revocation, account_generation_change, role_loss, expiry]
pending_deletion_contract:
  validator: account_service_pending_deletion_credential_validator
  credential: pending-deletion-access
  registry: account-owned_server-side_pending_deletion_credential_registry
  binding: [account_id, deletion_workflow_id, deletion_workflow_generation, action_family, issued_at, expires_at]
  allowed_actions: [status, cancel, export, necessary_billing_settlement]
  normal_authority: rejected
  rejection:
    invalid_expired_or_revoked: AUTH_SESSION_REVOKED
    unavailable: AUTH_UNAVAILABLE
    account_state_disclosure: prohibited
operator_delegation:
  issuer_service: account-service
  credential: opaque_bounded_operator_authorization_reference
  registry: account-owned_server-side_operator_authorization_registry
  issuance_paths:
    human:
      auth_path: exact_mtls_workload_plus_forwarded_control_ui
      bindings:
        [actor_account_id, control_ui_jti, account_generation, role, tenant_scope, action_family, control_plane_request_id, issued_at, expires_at]
    unattended_automation:
      auth_path: exact_mtls_workload_plus_versioned_automation_policy
      bindings:
        [workload_identity, automation_policy_id, automation_policy_version, tenant_scope, action_family, control_plane_request_id, issued_at, expires_at]
      user_impersonation_forbidden: true
  forwarded_by: logging-admin-service
  redeemed_by: owner_service_with_account_validation
  assertions_alone_are_not_authority: true
coverage_drift:
  - family: quota-override
    status: drift-found
    current_routes: []
    target_ingress: logging-admin-service
    target_owner: account-service
    note: No current OpenAPI or owner-side quota-override route exists; do not add an executable route entry until the Account contract exists.
  - family: moderation-enforcement-owner-call
    status: drift-found
    current_routes: []
    target_ingress: logging-admin-service
    target_owner: account-service_or_gameplay_policy_owner
    note: Current ApplyModerationAction records policy input in Logging and Admin, but no current owner-side enforcement RPC is exposed.
  - family: commerce-payment-instrument
    status: drift-found
    current_routes: []
    linked_decision: ADR-0044
    target_owner: account-service
    absent_contracts:
      [account_owned_wallet_customer_mapping, explicit_per_subscription_binding, safe_instrument_detachment, billing_ownership_transfer]
    target_routes:
      - route: PaymentInstrumentWalletAccount
        scope: account
        classification: account_scoped
        accepted_token_profiles: [control-ui]
        subject_binding: current_billing_owner_account_id
        required_live_checks: [recent_account_authentication, subscription_binding_integrity]
        mutation_contract: billing_owner_authorized_per_subscription_binding_replacement_before_detach_and_audited_ownership_transfer
      - route: PaymentInstrumentWalletCrossTenant
        scope: cross_tenant
        classification: cross_tenant_billing_safe
        accepted_token_profiles: [control-ui]
        roles: [billingAdmin, platformAdmin]
        audit_contract: required_cross_tenant_actor_scope_reason_and_outcome
        mutation_contract: audited_cross_tenant_billing_intervention
    note: Payment/subscription foundations exist, but the ADR-0044 wallet and payment-instrument contract is not currently routable.
routes:
  - service: game-session-service
    route: LOGIN
    scope: public
    classification: public
  - service: game-session-service
    route: LOGON
    scope: public
    classification: public
  - service: game-session-service
    route: WORLDS_PUBLIC
    transport_command: WORLDS
    scope: public
    classification: public
    applicability:
      all_of:
        - authentication_state: unauthenticated
    response_profile: public_production_catalog_only
    required_live_checks: [public_production_visibility, runtime_entitlements]
  - service: game-session-service
    route: WORLDS_AUTHENTICATED
    transport_command: WORLDS
    scope: account
    classification: pre_tenant_discovery
    applicability:
      all_of:
        - authentication_state: authenticated
    auth_path: game_session_authenticated_context
    accepted_token_profiles: []
    delegated_subject: authenticated_session_account
    visibility_contract: membership_or_public_production_visibility
    required_live_checks: [public_production_visibility, runtime_entitlements]
  - service: game-session-service
    route: REALMS
    scope: tenant
    classification: public_production_onboarding
    auth_path: game_session_authenticated_context
    accepted_token_profiles: []
    delegated_subject: authenticated_session_account
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: false
    visibility_contract: membership_or_public_production_or_realm_access_grant
    realm_grant_authority: account_owned_when_non_public
    realm_grant_version: required_when_grant_gated
    required_live_checks: [realm_visibility, runtime_entitlements]
  - service: game-session-service
    route: CHARS
    scope: tenant
    classification: public_production_onboarding
    auth_path: game_session_authenticated_context
    accepted_token_profiles: []
    delegated_subject: authenticated_session_account
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    realm_grant_authority: account_owned_when_non_public
    realm_grant_version: required_when_grant_gated
    required_live_checks: [membership, conditional_realm_access_grant, runtime_entitlements]
    canonical_errors:
      any_of: [JOIN_REQUIRED, WORLD_ACCESS_DENIED, TENANT_BILLING_BLOCKED]
  - service: game-session-service
    route: JOIN
    scope: tenant
    classification: public_production_onboarding
    auth_path: game_session_authenticated_context
    accepted_token_profiles: []
    delegated_subject: authenticated_session_account
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: false
    required_live_checks: [public_production_admission, runtime_entitlements, admission_pointer]
    canonical_errors:
      any_of: [PUBLIC_PRODUCTION_ADMISSION_DENIED, ADMISSION_POINTER_UNAVAILABLE, TENANT_BILLING_BLOCKED]
    mutation_contract: explicit_public_membership_atomic
  - service: game-session-service
    route: PLAY
    scope: tenant
    classification: public_production_onboarding
    auth_path: game_session_authenticated_context
    accepted_token_profiles: []
    delegated_subject: authenticated_session_account
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    realm_grant_authority: account_owned_when_non_public
    realm_grant_version: required_when_grant_gated
    required_live_checks: [membership, conditional_realm_access_grant, runtime_entitlements, admission_pointer]
    canonical_errors:
      any_of: [JOIN_REQUIRED, WORLD_ACCESS_DENIED, CONNECT_CONTEXT_INVALID, CONNECT_SCOPE_MISMATCH, ADMISSION_POINTER_UNAVAILABLE, REALM_UNAVAILABLE]
    canonical_target:
      membership: existing_caller_bound_membership_required
      membership_creation: play_never_creates_membership
      missing_membership_error: JOIN_REQUIRED
    implementation_status:
      known_drift:
        - connect_token_and_play_may_still_invoke_ensure_public_production_player_membership_in_current_runtime; this is a live security_contract_violation and affected admission must fail closed until existing membership is required
  - service: spring-cloud-gateway
    route: /ws/game/**
    scope: tenant
    classification: public_production_onboarding
    applicability:
      all_of:
        - connection_mode: first_party_web
        - operation: websocket_upgrade
        - admission_flow: connect_token_bootstrap
    auth_path: gameplay_connect
    accepted_token_profiles: [gameplay-connect]
    accepted_token_profile_audiences:
      gameplay-connect: gameplay-connect
    accepted_carriers: [first_party_cookie, classified_non_browser_header]
    edge_consumer: spring_cloud_gateway_public_non_proxy_websocket
    connect_context_output: signed_connect_context
    required_live_checks: [connect_token_single_use_consume, replay_protection_available, replay_admission_fence_match, connect_scope_match]
    handshake_error_classes:
      any_of:
        - CONNECT_TOKEN_MISSING
        - CONNECT_TOKEN_EXPIRED
        - CONNECT_TOKEN_REPLAYED
        - CONNECT_SCOPE_MISMATCH
        - CONNECT_REPLAY_PROTECTION_UNAVAILABLE
        - CONNECT_TOKEN_REJECTED
        - POLICY_DENY
        - POLICY_PRESSURE
        - BACKEND_UNAVAILABLE
        - PROTOCOL_MISMATCH
        - INTERNAL_ERROR
  - service: spring-cloud-gateway
    route: /ws/game/**
    scope: tenant
    classification: public_production_onboarding
    applicability:
      all_of:
        - connection_mode: trusted_tcp_proxy
        - listener: internal_mtls
    auth_path: exact_mtls_workload
    accepted_token_profiles: []
    accepted_carriers: []
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/tcp-proxy-service"]
    edge_consumer: spring_cloud_gateway_internal_mtls_websocket
    connect_context_output: trusted_tcp_proxy_mode
    required_live_checks: [trusted_proxy_identity]
    handshake_error_classes:
      any_of: [POLICY_DENY, BACKEND_UNAVAILABLE, PROTOCOL_MISMATCH, INTERNAL_ERROR]
  - service: spring-cloud-gateway
    route: POST /ws/game/connect-token/revoke
    scope: tenant
    classification: public_production_onboarding
    applicability:
      all_of:
        - connection_mode: first_party_web
        - operation: connect_token_cookie_revoke
    auth_path: gameplay_connect_cookie_revoke
    accepted_token_profiles: [gameplay-connect]
    accepted_token_profile_audiences:
      gameplay-connect: gameplay-connect
    accepted_carriers: [first_party_cookie]
    cookie_absence_outcome: idempotent_success
    edge_consumer: spring_cloud_gateway_http
    required_live_checks: [browser_origin, csrf]
    canonical_errors:
      any_of: [CONNECT_TOKEN_REJECTED, POLICY_DENY, INTERNAL_ERROR]
    route_status: target_not_currently_routable
  - service: account-service
    route: GET /auth/bootstrap/worlds
    scope: account
    classification: pre_tenant_discovery
    auth_path: player_bootstrap
    accepted_token_profiles: [player-bootstrap]
    subject_binding: caller_account_id
    visibility_contract: membership_or_public_production_visibility
    required_live_checks: [public_production_visibility, runtime_entitlements]
  - service: account-service
    route: GET /auth/bootstrap/worlds/{worldSlug}/realms
    scope: tenant
    classification: public_production_onboarding
    auth_path: player_bootstrap
    accepted_token_profiles: [player-bootstrap]
    subject_binding: caller_account_id
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: false
    visibility_contract: membership_or_public_production_or_realm_access_grant
    realm_grant_authority: account_owned_when_non_public
    realm_grant_version: required_when_grant_gated
    required_live_checks: [realm_visibility, runtime_entitlements]
  - service: account-service
    route: GET /auth/bootstrap/worlds/{worldSlug}/realms/{realmSlug}/characters
    scope: tenant
    classification: public_production_onboarding
    auth_path: player_bootstrap
    accepted_token_profiles: [player-bootstrap]
    subject_binding: caller_account_id
    target_binding: opaque_server_issued_connect_scope_id_matches_route
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    realm_grant_authority: account_owned_when_non_public
    realm_grant_version: required_when_grant_gated
    required_live_checks: [membership, conditional_realm_access_grant, runtime_entitlements, admission_pointer, connect_scope_match]
    canonical_errors:
      any_of: [JOIN_REQUIRED, WORLD_ACCESS_DENIED, TENANT_BILLING_BLOCKED, ADMISSION_POINTER_UNAVAILABLE, CONNECT_SCOPE_MISMATCH]
  - service: account-service
    route: POST /auth/bootstrap/worlds/{worldSlug}/realms/{realmSlug}/characters
    scope: tenant
    classification: public_production_onboarding
    auth_path: player_bootstrap
    accepted_token_profiles: [player-bootstrap]
    subject_binding: caller_account_id
    target_binding: opaque_server_issued_connect_scope_id_matches_route
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    realm_grant_authority: account_owned_when_non_public
    realm_grant_version: required_when_grant_gated
    required_live_checks: [membership, conditional_realm_access_grant, runtime_entitlements, admission_pointer, connect_scope_match]
    canonical_errors:
      any_of: [JOIN_REQUIRED, WORLD_ACCESS_DENIED, TENANT_BILLING_BLOCKED, ADMISSION_POINTER_UNAVAILABLE, CONNECT_SCOPE_MISMATCH]
    delegates_to: entity-management-service/CreateCharacter
  - service: game-session-service
    route: StartSession
    transport: grpc
    scope: tenant
    classification: internal_workload
    auth_path: exact_mtls_workload_plus_account_operator_authorization_reference
    accepted_token_profiles: []
    token_type: none
    token_issuer: none
    token_audience: none
    method_policy: exact_declared_route
    allowed_callers:
      any_of: [logging-admin-service]
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/logging-admin-service"]
    end_user_token_required: false
    delegated_subject: operator_authorization_reference
    operator_authorization_reference: required_and_redeemed_with_account
    required_live_checks: [current_operator_authorization, runtime_entitlements]
    mutation_contract: owner_atomic_idempotent_mutation_with_durable_result
    required_fields: [control_plane_request_id, actor, reason, tenant_id, mutation_digest]
    canonical_errors:
      any_of: [IDEMPOTENCY_CONFLICT]
  - service: game-session-service
    route: RestartSession
    transport: grpc
    scope: tenant
    classification: internal_workload
    auth_path: exact_mtls_workload_plus_account_operator_authorization_reference
    accepted_token_profiles: []
    token_type: none
    token_issuer: none
    token_audience: none
    method_policy: exact_declared_route
    allowed_callers:
      any_of: [logging-admin-service]
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/logging-admin-service"]
    end_user_token_required: false
    delegated_subject: operator_authorization_reference
    operator_authorization_reference: required_and_redeemed_with_account
    required_live_checks: [current_operator_authorization, runtime_entitlements]
    mutation_contract: owner_atomic_idempotent_mutation_with_durable_result
    required_fields: [control_plane_request_id, actor, reason, session_id, mutation_digest]
    canonical_errors:
      any_of: [IDEMPOTENCY_CONFLICT]
  - service: game-session-service
    route: StopSession
    transport: grpc
    scope: tenant
    classification: internal_workload
    auth_path: exact_mtls_workload_plus_account_operator_authorization_reference
    accepted_token_profiles: []
    token_type: none
    token_issuer: none
    token_audience: none
    method_policy: exact_declared_route
    allowed_callers:
      any_of: [logging-admin-service]
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/logging-admin-service"]
    end_user_token_required: false
    delegated_subject: operator_authorization_reference
    operator_authorization_reference: required_and_redeemed_with_account
    required_live_checks: [current_operator_authorization, runtime_ownership]
    mutation_contract: owner_atomic_idempotent_mutation_with_durable_result
    required_fields: [control_plane_request_id, actor, reason, session_id, mutation_digest]
    canonical_errors:
      any_of: [IDEMPOTENCY_CONFLICT]
  - service: game-session-service
    route: RefreshRoles
    transport: grpc
    scope: tenant
    classification: internal_workload
    auth_path: exact_mtls_workload
    accepted_token_profiles: []
    token_type: none
    token_issuer: none
    token_audience: none
    method_policy: exact_declared_route
    allowed_callers:
      any_of: [logging-admin-service]
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/logging-admin-service"]
    end_user_token_required: false
    delegated_subject: none
    required_live_checks: [current_session, current_account_roles]
    mutation_contract: owner_atomic_idempotent_role_refresh
  - service: game-session-service
    route: POST /sessions
    transport: http
    scope: tenant
    classification: tenant_regular
    auth_path: control_ui_plus_current_role_and_role_appropriate_assurance
    route_status: current_openapi_operator_surface
    tenant_billing_authority_generation_applies: true
    membership_authority_generation_applies: conditional_by_operator_role
    membership_authority_generation_condition:
      tenant_role: true
      platformAdmin_global: false
    accepted_token_profiles: [control-ui]
    role_assurance: privileged_control_when_global_role
    subject_binding: authenticated_operator
    canonical_external_ingress: logging-admin-service
    direct_owner_route_policy: deny_at_edge_and_migrate_to_logging_admin
    required_live_checks: [membership_when_tenant_role, membership_generation, current_operator_roles, target_tenant_generation, runtime_entitlements]
    global_platform_admin_membership_required: false
    global_platform_admin_reference_generation_binding: target_tenant_generation
    mutation_contract: durable_intent_then_account_redeemed_owner_idempotent_mutation
    required_fields: [control_plane_request_id, actor_from_session, reason, tenant_id]
    roles:
      any_of: [tenantAdmin, platformAdmin]
  - service: game-session-service
    route: POST /sessions/{sessionId}/stop
    transport: http
    scope: tenant
