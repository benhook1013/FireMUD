  - security_lock_export_scoped
classification_rules:
  security_lock_export_scoped:
    required_credential:
      kind: opaque
      profile: security-lock-export
      registry: account_security_lock_export_registry
      state: ACTIVE
    subject_binding: [accountId, recoveryCaseId]
    export_operation_binding:
      required: [accountId, recoveryCaseId, exportId]
      comparison: exact
    action_family_binding: exact_route_action_family
    authority_generations:
      issuer: false
      account: false
      tenant: false
      membership: false
    required_live_checks: [security_lock_export_credential_registry, security_lock_recovery_state, security_lock_export_action_family]
    allowed_route_actions: [export_initiate, export_status, export_content]
    forbidden_route_actions: [login, bootstrap, connect_token, tenant, purchase, gameplay, deletion_status, deletion_cancel, billing_settlement]
    invalid_or_revoked_outcome: AUTH_SESSION_REVOKED
    dependency_unavailable_outcome: AUTH_UNAVAILABLE
    failure_mapping:
      credential_account_or_recovery_binding_mismatch: AUTH_SESSION_REVOKED
      export_operation_or_job_binding_mismatch: PERMISSION_DENIED
      changed_request_or_export_scope: IDEMPOTENCY_CONFLICT
    fallback: forbidden
    issuance_constraint:
      issuer: account-service
      source: verified_account_security_lock_recovery
      credential: security-lock-export
      no_other_issuance_paths: true
  pending_deletion_scoped:
    required_credential:
      kind: opaque
      profile: pending-deletion-access
      registry: account_pending_deletion_registry
      state: ACTIVE
    subject_binding: [accountId, deletionWorkflowId, deletionWorkflowGeneration]
    action_family_binding: exact_route_action_family
    authority_generations:
      issuer: false
      account: false
      tenant: false
      membership: false
    required_live_checks: [pending_deletion_credential_registry, pending_deletion_workflow_state, pending_deletion_action_family]
    allowed_route_actions: [deletion_status, deletion_cancel, export_initiate, export_status, export_content, billing_settlement]
    forbidden_route_actions: [login, bootstrap, connect_token, tenant, purchase, gameplay]
    invalid_or_revoked_outcome: AUTH_SESSION_REVOKED
    dependency_unavailable_outcome: AUTH_UNAVAILABLE
    recovery_constraint: public_recovery_may_issue_only_pending_deletion_access
route_class_branch_table:
  - classification: account_scoped
    branch: platformAdmin_global
    scope: account
    role: platformAdmin
    generations:
      issuer: required
      account: required
      tenant: omitted
      membership: omitted
    privileged_control: required
  - classification: tenant_regular
    branch: tenant_role
    scope: tenant
    role: route_declared_tenant_role
    generations:
      issuer: required
      account: required
      tenant: required
      membership: required
    privileged_control: not_required
  - classification: tenant_regular
    branch: platformAdmin_global
    scope: tenant
    role: platformAdmin
    generations:
      issuer: required
      account: required
      tenant: target_tenant_generation
      membership: omitted
    privileged_control: required
  - classification: cross_tenant_data_bearing
    branch: platformAdmin_global
    scope: cross_tenant
    role: platformAdmin
    generations:
      issuer: required
      account: required
      tenant: target_tenant_generation
      membership: omitted
    privileged_control: required
  - classification: billing_safe_tenant
    branch: tenantAdmin
    scope: tenant
    role: tenantAdmin
    generations:
      issuer: required
      account: required
      tenant: omitted
      membership: required
    privileged_control: not_required
  - classification: cross_tenant_support_safe
    branch: support_global
    scope: cross_tenant
    role: support
    generations:
      issuer: required
      account: required
      tenant: omitted
      membership: omitted
    privileged_control: not_required
  - classification: cross_tenant_support_safe
    branch: platformAdmin_global
    scope: cross_tenant
    role: platformAdmin
    generations:
      issuer: required
      account: required
      tenant: omitted
      membership: omitted
    privileged_control: required
  - classification: cross_tenant_billing_safe
    branch: billingAdmin_global
    scope: cross_tenant
    role: billingAdmin
    generations:
      issuer: required
      account: required
      tenant: omitted
      membership: omitted
    privileged_control: required
  - classification: cross_tenant_billing_safe
    branch: platformAdmin_global
    scope: cross_tenant
    role: platformAdmin
    generations:
      issuer: required
      account: required
      tenant: omitted
      membership: omitted
    privileged_control: required
role_assurance:
  privileged_control_when_global_role:
    resolution: role_specific_global_role_assurance
    applies_when: caller_authorizes_via_global_role
    requirements:
      platformAdmin:
        role_check: current_global_role
        elevation_contract: privileged_control
        applies_to:
          route_classifications: [account_scoped, tenant_regular, cross_tenant_support_safe, cross_tenant_billing_safe, cross_tenant_data_bearing]
          route_identities:
            - account-service/IssueHumanOperatorAuthorizationReference
      billingAdmin:
        role_check: current_global_role
        elevation_contract: privileged_control
        applies_to:
          route_classifications: [cross_tenant_billing_safe]
      support:
        role_check: current_global_role
        elevation_contract: none
        applies_to:
          route_classifications: [cross_tenant_support_safe]
elevation_contracts:
  privileged_control:
    entry_route: account-service/EnterPrivilegedControlWindow
    accepted_token_profile: control-ui
    factor: independent_totp
    state: server_side_role_scoped_window
    required_bindings: [account_id, token_jti, account_generation, requested_global_role, issued_at, expires_at]
    invalidated_by: [token_revocation, account_generation_change, role_loss, expiry]
    bootstrap_exemption:
      route: account-service/EnterPrivilegedControlWindow
      privileged_control: establishes_window
      requires_existing_window: false
    implementation_status:
      known_drift:
        - EnterPrivilegedControlWindow is not currently routable or implemented; route branches requiring the window fail closed, and platformAdmin cannot currently obtain it.
pending_deletion_contract:
  validator: account_service_pending_deletion_credential_validator
  credential: pending-deletion-access
  registry: account-owned_server-side_pending_deletion_credential_registry
  binding: [account_id, deletion_workflow_id, deletion_workflow_generation, action_family, issued_at, expires_at]
  allowed_actions: [deletion_status, deletion_cancel, export_initiate, export_status, export_content, billing_settlement]
  normal_authority: rejected
  rejection:
    invalid_expired_or_revoked: AUTH_SESSION_REVOKED
    binding_mismatch_or_wrong_workflow_state: AUTH_SESSION_REVOKED
    unavailable_credential_or_workflow_authority: AUTH_UNAVAILABLE
    account_state_disclosure: prohibited
unauthenticated_recovery_contract:
  account_state_disclosure: prohibited
  state_or_credential_rejection: uniform_response_without_auth_error
  authority_unavailable: AUTH_UNAVAILABLE
operator_delegation:
  issuer_service: account-service
  credential: opaque_bounded_operator_authorization_reference
  registry: account-owned_server-side_operator_authorization_registry
  issuance_paths:
    human:
      auth_path: exact_mtls_workload_plus_forwarded_control_ui
      issued_token_state: current_exact_active_control_ui_registry_record
      bindings:
        [actor_account_id, control_ui_jti, account_generation, role, tenant_scope, action_family, action_family_schema_id, action_family_schema_version, mutation_digest, membership_version_when_applicable, issuance_fence, authority_evidence_bundle, control_plane_request_id, issued_at, expires_at]
    unattended_automation:
      auth_path: exact_mtls_workload_plus_versioned_automation_policy
      bindings:
