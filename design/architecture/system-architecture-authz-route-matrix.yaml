version: 1
updated_by: "platform-security+account-service"
default_classification: tenant_regular
classifications:
  - public
  - tenant_regular
  - billing_safe_tenant
  - cross_tenant_support_safe
  - cross_tenant_billing_safe
  - cross_tenant_data_bearing
routes:
  - service: account-service
    route: GetTenantEntitlementsTenant
    scope: tenant
    classification: billing_safe_tenant
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: GetTenantEntitlementsCrossTenant
    scope: cross_tenant
    classification: cross_tenant_support_safe
    roles:
      any_of: [support, platformAdmin]
  - service: account-service
    route: GetSubscriptionTenant
    scope: tenant
    classification: billing_safe_tenant
    response_profile: high_level_only
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: GetSubscriptionCrossTenant
    scope: cross_tenant
    classification: cross_tenant_support_safe
    response_profile: high_level_only
    roles:
      any_of: [support, platformAdmin]
  - service: account-service
    route: ListSubscriptionsTenantHighLevel
    scope: tenant
    classification: billing_safe_tenant
    response_profile: high_level_only
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: ListSubscriptionsSupportSafeCrossTenant
    scope: cross_tenant
    classification: cross_tenant_support_safe
    response_profile: high_level_only
    roles:
      any_of: [support, platformAdmin]
  - service: account-service
    route: ListSubscriptionsBillingReportsCrossTenant
    scope: cross_tenant
    classification: cross_tenant_billing_safe
    response_profile: billing_reporting
    roles:
      any_of: [billingAdmin, platformAdmin]
  - service: account-service
    route: IssueConnectToken
    scope: tenant
    classification: tenant_regular
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin]
  - service: account-service
    route: BillingArtifactsTenant
    scope: tenant
    classification: billing_safe_tenant
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: BillingArtifactsCrossTenant
    scope: cross_tenant
    classification: cross_tenant_billing_safe
    roles:
      any_of: [billingAdmin, platformAdmin]
  - service: account-service
    route: GetTenantMembershipTenant
    scope: tenant
    classification: billing_safe_tenant
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: GetTenantMembershipCrossTenant
    scope: cross_tenant
    classification: cross_tenant_billing_safe
    roles:
      any_of: [billingAdmin, platformAdmin]
  - service: game-session-service
    route: PLAY
    scope: tenant
    classification: tenant_regular
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin]
  - service: game-session-service
    route: StartSession
    scope: tenant
    classification: tenant_regular
    roles:
      any_of: [tenantAdmin, platformAdmin]
