version: 3
updated_by: "platform-security+account-service"
default_action: deny
default_action_scope: declared_route_entries_only
unlisted_route_status: drift
default_deny_generation:
  enabled: false
  blocked_until: source_stable_openapi_protobuf_coverage_complete_and_validated
inheritance:
  mode: none
  rule: route_entries_do_not_inherit_authentication_or_authorization_fields
token_profiles:
  - profile: control-ui
    audience: control-ui
    kind: control_plane_user
  - profile: player-bootstrap
    audience: player-bootstrap
    kind: gameplay_bootstrap_user
  - profile: gameplay-connect
    audience: gameplay-connect
    kind: gameplay_handshake
  - profile: game-session-account-delegation
    audience: account-service
    kind: private_player_delegation
auth_path_vocabulary:
  - exact_mtls_workload
  - exact_mtls_workload_plus_caller_specific_context
  - exact_mtls_workload_plus_current_token_generation
  - game_session_authenticated_context
  - gameplay_connect
  - gameplay_connect_cookie_revoke
  - player_bootstrap
internal_workload_rules:
  caller_constraints: all_declared_constraints_must_pass
  caller_policy_alternatives: disjunctive
  allowed_callers_and_mtls_callers: conjunctive
  caller_policies_schema:
    identity_fields:
      caller: method_caller_identity
      mtls_identity: certificate_identity
    identity_relation: conjunctive
route_authentication_rules:
  accepted_token_profile_audiences:
    multi_profile_routes: exact_profile_to_audience_map_required
    audience_source: token_profiles
  gameplay_websocket_entrypoint:
    canonical_route: /ws/game/**
    supported_variants: [first_party_cookie, trusted_tcp_proxy]
    future_variants:
      non_first_party_public_header:
        route: /ws/game/**
        carrier: X-Firemud-Connect-Token
        applicability: explicit_non_first_party_public_classification_only
        status: unavailable_until_dedicated_route_variant_and_proof
        rejection_until_available: CONNECT_TOKEN_REJECTED
    fail_closed_rules: [no_alternate_gameplay_websocket_entrypoint, no_header_fallback, no_carrier_precedence]
required_live_check_vocabulary:
  - account_generation
  - account_authority_tuple
  - account_outbox_checkpoint
  - admission_pointer
  - browser_origin
  - conditional_realm_access_grant
  - connect_scope_match
  - connect_token_single_use_consume
  - csrf
  - current_token_generation
  - exact_binding_admission_lease
  - binding_fence
  - binding_ownership
  - grant_version
  - issuer_generation
  - membership
  - membership_generation
  - membership_version
  - public_production_admission
  - public_production_visibility
  - realm_visibility
  - replay_admission_fence_match
  - replay_protection_available
  - runtime_entitlements
  - tenant_generation
  - target_tenant_generation
  - trusted_proxy_identity
  - pending_deletion_credential_registry
  - pending_deletion_workflow_state
  - pending_deletion_action_family
implementation_status:
  known_drift:
    - public_production_membership_may_be_created_implicitly_by_connect_token_or_play
classifications:
  - public
  - account_scoped
  - caller_membership_scoped
  - player_bootstrap_tenant
  - pre_tenant_discovery
  - public_production_onboarding
  - gameplay_admission
  - tenant_regular
  - billing_safe_tenant
  - cross_tenant_support_safe
  - cross_tenant_billing_safe
  - cross_tenant_data_bearing
  - internal_workload
  - pending_deletion_scoped
classification_rules:
  pending_deletion_scoped:
    required_credential:
      kind: opaque
      profile: pending-deletion-access
      registry: account_pending_deletion_registry
      state: ACTIVE
    subject_binding: [accountId, deletionWorkflowId, deletionWorkflowGeneration]
    action_family_binding: exact_route_action_family
    authority_generations:
      issuer: false
      account: false
      tenant: false
      membership: false
    required_live_checks: [pending_deletion_credential_registry, pending_deletion_workflow_state, pending_deletion_action_family]
    allowed_route_actions: [status, cancel, full_subject_export, billing_settlement]
    forbidden_route_actions: [login, bootstrap, connect_token, tenant, purchase, gameplay]
    invalid_or_revoked_outcome: AUTH_SESSION_REVOKED
    dependency_unavailable_outcome: AUTH_UNAVAILABLE
    recovery_constraint: public_recovery_may_issue_only_pending_deletion_access
routes:
  - service: game-session-service
    route: LOGIN
    scope: public
    classification: public
  - service: game-session-service
    route: LOGON
    scope: public
    classification: public
  - service: game-session-service
    route: WORLDS_PUBLIC
    transport_command: WORLDS
    scope: public
    classification: public
    applicability:
      all_of:
        - authentication_state: unauthenticated
    response_profile: public_production_catalog_only
    required_live_checks: [public_production_visibility, runtime_entitlements]
  - service: game-session-service
    route: WORLDS_AUTHENTICATED
    transport_command: WORLDS
    scope: account
    classification: pre_tenant_discovery
    applicability:
      all_of:
        - authentication_state: authenticated
    auth_path: game_session_authenticated_context
    accepted_token_profiles: []
    delegated_subject: authenticated_session_account
    visibility_contract: membership_or_public_production_visibility
    required_live_checks: [public_production_visibility, runtime_entitlements]
  - service: game-session-service
    route: REALMS
    scope: tenant
    classification: public_production_onboarding
    auth_path: game_session_authenticated_context
    accepted_token_profiles: []
    delegated_subject: authenticated_session_account
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: false
    visibility_contract: membership_or_public_production_or_realm_access_grant
    realm_grant_authority: account_owned_when_non_public
    realm_grant_version: required_when_grant_gated
    required_live_checks: [realm_visibility, runtime_entitlements]
    branch_selector: exactly_one_realm_mode
    conditional_branch_precedence:
      branch_fields_override_top_level: true
    canonical_errors:
      any_of: [NON_PUBLIC_ENROLLMENT_REQUIRED, REALM_ACCESS_DENIED, WORLD_ACCESS_DENIED, ADMISSION_POINTER_UNAVAILABLE, REALM_UNAVAILABLE, ENTITLEMENT_UNAVAILABLE, AUTH_UNAVAILABLE]
    conditional_branches:
      public_production:
        selector: realm_mode=public_production
        membership: pre_membership_discovery_allowed
        required_live_checks: [realm_visibility, runtime_entitlements]
      private_or_playtest:
        selector: realm_mode=private_or_playtest
        membership: active_caller_bound_membership_required
        membership_authority_generation_applies: true
        membership_version_applies: true
        realm_grant_authority: account_owned
        realm_grant_version: required
        required_live_checks: [realm_visibility, membership, membership_generation, membership_version, conditional_realm_access_grant, grant_version, runtime_entitlements]
        canonical_errors:
          any_of: [NON_PUBLIC_ENROLLMENT_REQUIRED, REALM_ACCESS_DENIED, WORLD_ACCESS_DENIED, ADMISSION_POINTER_UNAVAILABLE, REALM_UNAVAILABLE, ENTITLEMENT_UNAVAILABLE, AUTH_UNAVAILABLE]
  - service: game-session-service
    route: CHARS
    scope: tenant
    classification: public_production_onboarding
    auth_path: game_session_authenticated_context
    accepted_token_profiles: []
    delegated_subject: authenticated_session_account
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    realm_grant_authority: account_owned_when_non_public
    realm_grant_version: required_when_grant_gated
    required_live_checks: [membership, conditional_realm_access_grant, runtime_entitlements]
    canonical_errors:
      any_of: [JOIN_REQUIRED, NON_PUBLIC_ENROLLMENT_REQUIRED, REALM_ACCESS_DENIED, WORLD_ACCESS_DENIED, TENANT_BILLING_BLOCKED, ENTITLEMENT_UNAVAILABLE, AUTH_UNAVAILABLE]
  - service: game-session-service
    route: JOIN
    scope: tenant
    classification: public_production_onboarding
    auth_path: game_session_authenticated_context
    accepted_token_profiles: []
    delegated_subject: authenticated_session_account
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: false
    required_live_checks: [public_production_admission, runtime_entitlements, admission_pointer]
    canonical_errors:
      any_of: [PUBLIC_PRODUCTION_ADMISSION_DENIED, ADMISSION_POINTER_UNAVAILABLE, TENANT_BILLING_BLOCKED]
    mutation_contract: explicit_public_membership_atomic
  - service: game-session-service
    route: PLAY
    scope: tenant
    classification: gameplay_admission
    auth_path: game_session_authenticated_context
    accepted_token_profiles: []
    delegated_subject: authenticated_session_account
    tenant_billing_authority_generation_applies: false
    tenant_authority_generation_applies: true
    membership_authority_generation_applies: true
    membership_version_applies: true
    realm_grant_authority: account_owned_when_non_public
    realm_grant_version: required_when_grant_gated
    required_live_checks: [membership, target_tenant_generation, membership_generation, membership_version, conditional_realm_access_grant, runtime_entitlements, admission_pointer, account_authority_tuple, account_outbox_checkpoint, exact_binding_admission_lease, binding_fence, binding_ownership]
    canonical_errors:
      any_of: [JOIN_REQUIRED, NON_PUBLIC_ENROLLMENT_REQUIRED, REALM_ACCESS_DENIED, WORLD_ACCESS_DENIED, CONNECT_CONTEXT_INVALID, CONNECT_SCOPE_MISMATCH, ADMISSION_POINTER_UNAVAILABLE, REALM_UNAVAILABLE, TENANT_BILLING_BLOCKED, ENTITLEMENT_UNAVAILABLE, AUTH_UNAVAILABLE, AUTH_SESSION_REVOKED, OWNERSHIP_UNAVAILABLE, STALE_TIMELINE]
    account_checkpoint_tuple_evidence:
      source: account-auth-evidence-bundle/v1
      required: [authorityTuple, membershipVersion, outboxCheckpoints]
      comparison: exact_target_tenant_and_caller_membership_scope
    exact_binding_admission_lease: required
    binding_fence: required
    binding_ownership_checks: [gameplay_binding_identity, character_identity, runtime_owner]
    canonical_target:
      membership: existing_caller_bound_membership_required
      membership_creation: play_never_creates_membership
      missing_membership_error: JOIN_REQUIRED
    implementation_status:
      known_drift:
        - connect_token_and_play_may_still_invoke_ensure_public_production_player_membership
  - service: spring-cloud-gateway
    route: /ws/game/**
    scope: tenant
    classification: gameplay_admission
    applicability:
      all_of:
        - connection_mode: first_party_web
        - operation: websocket_upgrade
        - admission_flow: connect_token_bootstrap
        - client_scope: first_party_protected_cookie_clients
    auth_path: gameplay_connect
    accepted_token_profiles: [gameplay-connect]
    accepted_token_profile_audiences:
      gameplay-connect: gameplay-connect
    accepted_carriers: [first_party_cookie]
    edge_consumer: spring_cloud_gateway_public_non_proxy_websocket
    connect_context_output: signed_connect_context
    required_live_checks: [connect_token_single_use_consume, replay_protection_available, replay_admission_fence_match, connect_scope_match]
    handshake_error_classes:
      any_of:
        - CONNECT_TOKEN_MISSING
        - CONNECT_TOKEN_EXPIRED
        - CONNECT_TOKEN_REPLAYED
        - CONNECT_SCOPE_MISMATCH
        - CONNECT_REPLAY_PROTECTION_UNAVAILABLE
        - CONNECT_TOKEN_REJECTED
        - POLICY_DENY
        - POLICY_PRESSURE
        - BACKEND_UNAVAILABLE
        - PROTOCOL_MISMATCH
        - INTERNAL_ERROR
  - service: spring-cloud-gateway
    route: /ws/game/**
    scope: tenant
    classification: gameplay_admission
    applicability:
      all_of:
        - connection_mode: trusted_tcp_proxy
        - listener: internal_mtls
    auth_path: exact_mtls_workload
    accepted_token_profiles: []
    accepted_carriers: []
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/tcp-proxy-service"]
    edge_consumer: spring_cloud_gateway_internal_mtls_websocket
    connect_context_output: trusted_tcp_proxy_mode
    required_live_checks: [trusted_proxy_identity]
    handshake_error_classes:
      any_of: [POLICY_DENY, BACKEND_UNAVAILABLE, PROTOCOL_MISMATCH, INTERNAL_ERROR]
  - service: spring-cloud-gateway
    route: POST /ws/game/connect-token/revoke
    scope: tenant
    classification: public_production_onboarding
    applicability:
      all_of:
        - connection_mode: first_party_web
        - operation: connect_token_cookie_revoke
    auth_path: gameplay_connect_cookie_revoke
    accepted_token_profiles: [gameplay-connect]
    accepted_token_profile_audiences:
      gameplay-connect: gameplay-connect
    accepted_carriers: [first_party_cookie]
    cookie_absence_outcome: idempotent_success
    edge_consumer: spring_cloud_gateway_http
    required_live_checks: [browser_origin, csrf]
    canonical_errors:
      any_of: [CONNECT_TOKEN_REJECTED, POLICY_DENY, INTERNAL_ERROR]
    implementation_status:
      target_only: true
  - service: account-service
    route: GET /auth/bootstrap/worlds
    scope: account
    classification: pre_tenant_discovery
    auth_path: player_bootstrap
    accepted_token_profiles: [player-bootstrap]
    subject_binding: caller_account_id
    visibility_contract: membership_or_public_production_visibility
    required_live_checks: [public_production_visibility, runtime_entitlements]
  - service: account-service
    route: GET /auth/bootstrap/worlds/{worldSlug}/realms
    scope: tenant
    classification: public_production_onboarding
    auth_path: player_bootstrap
    accepted_token_profiles: [player-bootstrap]
    subject_binding: caller_account_id
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: false
    visibility_contract: membership_or_public_production_or_realm_access_grant
    realm_grant_authority: account_owned_when_non_public
    realm_grant_version: required_when_grant_gated
    required_live_checks: [realm_visibility, runtime_entitlements]
  - service: account-service
    route: GET /auth/bootstrap/worlds/{worldSlug}/realms/{realmSlug}/characters
    scope: tenant
    classification: public_production_onboarding
    auth_path: player_bootstrap
    accepted_token_profiles: [player-bootstrap]
    subject_binding: caller_account_id
    target_binding: opaque_server_issued_connect_scope_id_matches_route
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    realm_grant_authority: account_owned_when_non_public
    realm_grant_version: required_when_grant_gated
    required_live_checks: [membership, conditional_realm_access_grant, runtime_entitlements, admission_pointer, connect_scope_match]
    canonical_errors:
      any_of: [JOIN_REQUIRED, NON_PUBLIC_ENROLLMENT_REQUIRED, REALM_ACCESS_DENIED, WORLD_ACCESS_DENIED, TENANT_BILLING_BLOCKED, ENTITLEMENT_UNAVAILABLE, AUTH_UNAVAILABLE, ADMISSION_POINTER_UNAVAILABLE, REALM_UNAVAILABLE, CONNECT_SCOPE_MISMATCH]
  - service: account-service
    route: POST /auth/bootstrap/worlds/{worldSlug}/realms/{realmSlug}/characters
    scope: tenant
    classification: public_production_onboarding
    auth_path: player_bootstrap
    accepted_token_profiles: [player-bootstrap]
    subject_binding: caller_account_id
    target_binding: opaque_server_issued_connect_scope_id_matches_route
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    realm_grant_authority: account_owned_when_non_public
    realm_grant_version: required_when_grant_gated
    required_live_checks: [membership, conditional_realm_access_grant, runtime_entitlements, admission_pointer, connect_scope_match]
    canonical_errors:
      any_of: [JOIN_REQUIRED, NON_PUBLIC_ENROLLMENT_REQUIRED, REALM_ACCESS_DENIED, WORLD_ACCESS_DENIED, TENANT_BILLING_BLOCKED, ENTITLEMENT_UNAVAILABLE, AUTH_UNAVAILABLE, ADMISSION_POINTER_UNAVAILABLE, REALM_UNAVAILABLE, CONNECT_SCOPE_MISMATCH]
    delegates_to: entity-management-service/CreateCharacter
  - service: game-session-service
    route: StartSession
    scope: tenant
    classification: tenant_regular
    tenant_billing_authority_generation_applies: true
    membership_authority_generation_applies: true
    required_live_checks: [runtime_entitlements]
    accepted_token_profiles: [control-ui]
    roles:
      any_of: [tenantAdmin, platformAdmin]
  - service: game-session-service
    route: RestartSession
    scope: tenant
    classification: tenant_regular
    tenant_billing_authority_generation_applies: true
    membership_authority_generation_applies: true
    required_live_checks: [runtime_entitlements]
    accepted_token_profiles: [control-ui]
    roles:
      any_of: [tenantAdmin, platformAdmin]
  - service: game-session-service
    route: StopSession
    scope: tenant
    classification: tenant_regular
    tenant_billing_authority_generation_applies: true
    membership_authority_generation_applies: true
    required_live_checks: [runtime_entitlements]
    accepted_token_profiles: [control-ui]
    roles:
      any_of: [tenantAdmin, platformAdmin]
  - service: game-session-service
    route: RefreshRoles
    scope: tenant
    classification: tenant_regular
    tenant_billing_authority_generation_applies: true
    membership_authority_generation_applies: true
    # Refreshes security/role state only; it does not admit gameplay or expand runtime capacity.
    required_live_checks: []
    accepted_token_profiles: [control-ui]
    roles:
      any_of: [tenantAdmin, platformAdmin]
  - service: account-service
    route: AuthLogin
    scope: public
    classification: public
    issued_token_profile: control-ui
    issued_token_audience: control-ui
    implementation_status:
      known_drift:
        - current_issuance_uses_legacy_scope_duplicated_session_keys_instead_of_single_token_registry
  - service: account-service
    route: PlayerBootstrapLogin
    scope: public
    classification: public
    issued_token_profile: player-bootstrap
    issued_token_audience: player-bootstrap
    implementation_status:
      known_drift:
        - current_issuance_uses_legacy_scope_duplicated_session_keys_instead_of_single_token_registry
  - service: account-service
    route: POST /auth/bootstrap/join
    scope: tenant
    classification: public_production_onboarding
    auth_path: player_bootstrap
    accepted_token_profiles: [player-bootstrap]
    subject_binding: caller_account_id
    target_binding: opaque_server_issued_connect_scope_id_matches_route
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: false
    required_live_checks: [public_production_admission, runtime_entitlements, admission_pointer, connect_scope_match]
    canonical_errors:
      any_of: [PUBLIC_PRODUCTION_ADMISSION_DENIED, ADMISSION_POINTER_UNAVAILABLE, CONNECT_SCOPE_MISMATCH, TENANT_BILLING_BLOCKED]
    mutation_contract: explicit_public_membership_atomic
    implementation_status:
      target_only: true
  - service: account-service
    route: JoinPublicProductionMembership
    scope: tenant
    classification: internal_workload
    auth_path: exact_mtls_workload
    issued_token_state: none
    accepted_token_profiles: []
    token_audience: none
    allowed_callers:
      any_of: [game-session-service]
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/game-session-service"]
    delegated_subject: typed_player_execution_context
    target_binding: verified_connectScopeId_exact_target
    request_binding: requestId_and_caller_target_digest
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: false
    required_live_checks: [public_production_admission, runtime_entitlements, admission_pointer, connect_scope_match]
    canonical_errors:
      any_of: [PUBLIC_PRODUCTION_ADMISSION_DENIED, ADMISSION_POINTER_UNAVAILABLE, CONNECT_SCOPE_MISMATCH, TENANT_BILLING_BLOCKED, ENTITLEMENT_UNAVAILABLE, AUTH_UNAVAILABLE, IDEMPOTENCY_CONFLICT]
    mutation_contract: explicit_public_membership_atomic
    exact_scope_revalidation:
      required: true
      fields: [connectScopeId, catalogRevision, pointerVersion, resolved_target]
      silent_retarget: forbidden
    idempotency_contract:
      key: requestId
      digest: canonical_caller_target_connect_scope_digest
      exact_retry: same_requestId_and_digest_returns_stored_outcome
      changed_digest: IDEMPOTENCY_CONFLICT
      changed_requestId: distinct_operation
    implementation_status:
      known_drift:
        - current_proto_and_internal_runtime_seam_is_named_ensure_public_production_player_membership
        - current_membership_seam_may_be_invoked_implicitly_by_connect_token_or_play
  - service: account-service
    route: DELETE /tenants/{tenantId}/memberships/me
    scope: tenant
    classification: caller_membership_scoped
    subject_binding: caller_account_id
    accepted_token_profiles: [control-ui]
    tenant_billing_authority_generation_applies: false
    membership_authority_generation_applies: true
    required_live_checks: [membership]
    mutation_contract: caller_bound_membership_delete_generation_advance
  - service: account-service
    route: AuthLogout
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id
    accepted_token_profiles: [control-ui, player-bootstrap]
    accepted_token_profile_audiences:
      control-ui: control-ui
      player-bootstrap: player-bootstrap
    idempotent_retry_contract: exact_token_noop_after_durable_committed_tombstone
    implementation_status:
      known_drift:
        - legacy_session_key_runtime_lacks_durable_logout_retry_proof
  - service: account-service
    route: AuthLogoutAll
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id
    accepted_token_profiles: [control-ui, player-bootstrap]
    accepted_token_profile_audiences:
      control-ui: control-ui
      player-bootstrap: player-bootstrap
    idempotent_retry_contract: superseded_token_noop_after_durable_logout_all_proof
    implementation_status:
      known_drift:
        - legacy_session_key_runtime_lacks_durable_logout_all_retry_proof
  - service: account-service
    route: GET /tenants/{tenantId}/profiles/{accountId}
    scope: tenant
    classification: tenant_regular
    subject_binding: caller_account_id
    accepted_token_profiles: [control-ui]
    tenant_billing_authority_generation_applies: true
    membership_authority_generation_applies: true
    membership_version_applies: true
    required_live_checks: [membership]
    roles:
      any_of: [player, moderator, designer, tenantAdmin]
    implementation_status:
      known_drift:
        - legacy_route_is_profiles_account_id
  - service: account-service
    route: PUT /tenants/{tenantId}/profiles/{accountId}
    scope: tenant
    classification: tenant_regular
    subject_binding: caller_account_id
    accepted_token_profiles: [control-ui]
    tenant_billing_authority_generation_applies: true
    membership_authority_generation_applies: true
    membership_version_applies: true
    required_live_checks: [membership]
    roles:
      any_of: [player, moderator, designer, tenantAdmin]
    implementation_status:
      known_drift:
        - legacy_route_is_profiles_account_id
  - service: account-service
    route: ExportAccount
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id_or_platform_admin
    accepted_token_profiles: [control-ui]
    response_profile: full_account_export
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin, billingAdmin, support]
  - service: account-service
    route: DeleteAccount
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id_or_platform_admin
    accepted_token_profiles: [control-ui]
    mutation_contract: account_delete_requires_no_nonterminal_owned_subscriptions
    canonical_errors:
      any_of: [ACCOUNT_DELETE_ACTIVE_BILLING_OWNER]
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin, billingAdmin, support]
  - service: account-service
    route: LinkExternalAccount
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id_or_platform_admin
    accepted_token_profiles: [control-ui]
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin, billingAdmin, support]
  - service: account-service
    route: IssueConnectToken
    scope: tenant
    classification: player_bootstrap_tenant
    auth_path: player_bootstrap
    accepted_token_profiles: [player-bootstrap]
    issued_token_profile: gameplay-connect
    issued_token_audience: gameplay-connect
    tenant_billing_authority_generation_applies: false
    tenant_authority_generation_applies: true
    membership_authority_generation_applies: true
    membership_version_applies: true
    target_binding: opaque_server_issued_connect_scope_id_matches_route
    realm_grant_authority: account_owned_when_non_public
    realm_grant_version: required_when_grant_gated
    required_live_checks: [membership, target_tenant_generation, membership_generation, membership_version, account_authority_tuple, account_outbox_checkpoint, conditional_realm_access_grant, grant_version, runtime_entitlements, admission_pointer, connect_scope_match, replay_protection_available, replay_admission_fence_match]
    canonical_errors:
      any_of: [JOIN_REQUIRED, NON_PUBLIC_ENROLLMENT_REQUIRED, REALM_ACCESS_DENIED, WORLD_ACCESS_DENIED, PUBLIC_PRODUCTION_ADMISSION_DENIED, TENANT_BILLING_BLOCKED, ENTITLEMENT_UNAVAILABLE, ADMISSION_POINTER_UNAVAILABLE, REALM_UNAVAILABLE, CONNECT_SCOPE_MISMATCH, CONNECT_REPLAY_PROTECTION_UNAVAILABLE, AUTH_UNAVAILABLE, AUTH_SESSION_REVOKED]
    subject_binding: caller_account_id
    canonical_target:
      membership: existing_caller_bound_membership_required
      membership_lifecycle_state: ACTIVE
      membership_creation: issue_connect_token_never_creates_membership
      authority_tuple: exact_bounded_selected_target_tuple_from_one_account_snapshot
      tenant_authority_generation: exactly_one_selected_tenant_entry
      membership_authority_generation: exactly_one_selected_tenant_entry
      membership_version: exactly_one_selected_tenant_entry_with_same_tenant_key
      private_realm_grant_versions: public_empty_or_exactly_one_selected_realm_entry
    issuance_evidence:
      schema: connect-token-issuance-evidence/v1
      account_boundary: account-auth-evidence-bundle/v1
      request_identity: [accountId, connectScopeId, requestId, requestDigest]
      selected_route_membership_evidence: [membershipLifecycleState, membershipAuthorityGeneration, membershipVersion]
      gameplay_connect_fields: [authorityTuple, membershipVersion, jti, iat, exp, replayAdmissionFence]
      required_references: [runtimeEntitlementAuthorityReference, admissionPointerAuthorityReference]
      postconditions:
        success:
          request_outcome: COMMITTED
          dedicated_gameplay_connect_record: COMMITTED
          required_record_fields: [accountId, tenantId, gameInstanceId, membershipLifecycleState, authorityTuple, membershipVersion, jti, issuedAt, replayAdmissionFence, runtimeEntitlementAuthorityReference, admissionPointerAuthorityReference]
        deterministic_failure:
          request_outcome: terminal_without_token
          dedicated_gameplay_connect_record: no_usable_record
      idempotency:
        key: requestId
        digest: requestDigest
        exact_retry: stored_success_or_deterministic_failure
        second_token_on_retry: forbidden
      ordinary_registry_contract:
        player_bootstrap_authorization: required
        gameplay_connect_registry_record: forbidden
        excluded_registry_only_fields: [tokenGeneration, issuanceFence]
    implementation_status:
      known_drift:
        - issue_connect_token_may_still_invoke_ensure_public_production_player_membership
        - issue_connect_token_does_not_reread_membership_authority_generation
