version: 3
updated_by: "platform-security+account-service"
default_action: deny
classifications:
  - public
  - account_scoped
  - player_bootstrap_tenant
  - pre_tenant_discovery
  - public_production_onboarding
  - tenant_regular
  - billing_safe_tenant
  - cross_tenant_support_safe
  - cross_tenant_billing_safe
  - cross_tenant_data_bearing
  - internal_workload
routes:
  - service: game-session-service
    route: LOGIN
    scope: public
    classification: public
  - service: game-session-service
    route: LOGON
    scope: public
    classification: public
  - service: game-session-service
    route: WORLDS_PUBLIC
    transport_command: WORLDS
    scope: public
    classification: public
    response_profile: public_production_catalog_only
    required_live_checks: [public_production_visibility, runtime_entitlements]
  - service: game-session-service
    route: WORLDS_AUTHENTICATED
    transport_command: WORLDS
    scope: account
    classification: pre_tenant_discovery
    visibility_contract: membership_or_public_production_visibility
    required_live_checks: [runtime_entitlements]
  - service: game-session-service
    route: REALMS
    scope: tenant
    classification: public_production_onboarding
    visibility_contract: membership_or_public_production_or_realm_access_grant
    required_live_checks: [realm_visibility, runtime_entitlements]
  - service: game-session-service
    route: CHARS
    scope: tenant
    classification: public_production_onboarding
    tenant_billing_watermark_applies: false
    membership_watermark_applies: true
    required_live_checks: [membership, conditional_realm_access_grant, runtime_entitlements]
  - service: game-session-service
    route: JOIN
    scope: tenant
    classification: public_production_onboarding
    tenant_billing_watermark_applies: false
    membership_watermark_applies: false
    required_live_checks: [public_production_admission, runtime_entitlements, admission_pointer]
    mutation_contract: explicit_public_membership_atomic
  - service: game-session-service
    route: PLAY
    scope: tenant
    classification: public_production_onboarding
    tenant_billing_watermark_applies: false
    membership_watermark_applies: true
    required_live_checks: [membership, conditional_realm_access_grant, runtime_entitlements]
    canonical_errors:
      any_of: [JOIN_REQUIRED, CONNECT_CONTEXT_INVALID, CONNECT_SCOPE_MISMATCH]
  - service: entity-management-service
    route: POST /characters
    scope: tenant
    classification: public_production_onboarding
    auth_path: player_bootstrap
    tenant_billing_watermark_applies: false
    membership_watermark_applies: true
    required_live_checks: [membership, conditional_realm_access_grant, runtime_entitlements]
  - service: game-session-service
    route: StartSession
    scope: tenant
    classification: tenant_regular
    tenant_billing_watermark_applies: true
    membership_watermark_applies: true
    required_live_checks: [runtime_entitlements]
    roles:
      any_of: [tenantAdmin, platformAdmin]
  - service: game-session-service
    route: RestartSession
    scope: tenant
    classification: tenant_regular
    tenant_billing_watermark_applies: true
    membership_watermark_applies: true
    required_live_checks: [runtime_entitlements]
    roles:
      any_of: [tenantAdmin, platformAdmin]
  - service: game-session-service
    route: StopSession
    scope: tenant
    classification: tenant_regular
    tenant_billing_watermark_applies: true
    membership_watermark_applies: true
    required_live_checks: [runtime_entitlements]
    roles:
      any_of: [tenantAdmin, platformAdmin]
  - service: game-session-service
    route: RefreshRoles
    scope: tenant
    classification: tenant_regular
    tenant_billing_watermark_applies: true
    membership_watermark_applies: true
    roles:
      any_of: [tenantAdmin, platformAdmin]
  - service: account-service
    route: AuthLogin
    scope: public
    classification: public
  - service: account-service
    route: PlayerBootstrapLogin
    scope: public
    classification: public
  - service: account-service
    route: JoinPublicProductionMembership
    scope: tenant
    classification: public_production_onboarding
    tenant_billing_watermark_applies: false
    membership_watermark_applies: false
    required_live_checks: [public_production_admission, runtime_entitlements, admission_pointer]
    mutation_contract: explicit_public_membership_atomic
  - service: account-service
    route: DELETE /tenants/{tenantId}/memberships/me
    scope: tenant
    classification: billing_safe_tenant
    subject_binding: caller_account_id
    tenant_billing_watermark_applies: false
    membership_watermark_applies: true
    required_live_checks: [membership]
    mutation_contract: caller_bound_membership_delete_generation_advance
  - service: account-service
    route: AuthLogout
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id
    accepted_token_profiles: [browser, player-bootstrap]
  - service: account-service
    route: AuthLogoutAll
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id
    accepted_token_profiles: [browser, player-bootstrap]
  - service: account-service
    route: GetProfile
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id_or_platform_admin
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin, billingAdmin, support]
  - service: account-service
    route: UpdateProfile
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id_or_platform_admin
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin, billingAdmin, support]
  - service: account-service
    route: ExportAccount
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id_or_platform_admin
    response_profile: full_account_export
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin, billingAdmin, support]
  - service: account-service
    route: DeleteAccount
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id_or_platform_admin
    mutation_contract: account_delete_requires_no_nonterminal_owned_subscriptions
    canonical_errors:
      any_of: [ACCOUNT_DELETE_ACTIVE_BILLING_OWNER]
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin, billingAdmin, support]
  - service: account-service
    route: LinkExternalAccount
    scope: account
    classification: account_scoped
    subject_binding: caller_account_id_or_platform_admin
    roles:
      any_of: [player, moderator, designer, tenantAdmin, platformAdmin, billingAdmin, support]
  - service: account-service
    route: IssueConnectToken
    scope: tenant
    classification: player_bootstrap_tenant
    auth_path: player_bootstrap
    tenant_billing_watermark_applies: false
    membership_watermark_applies: true
    required_live_checks: [membership, runtime_entitlements, admission_pointer]
    canonical_errors:
      any_of: [ADMISSION_POINTER_UNAVAILABLE, CONNECT_SCOPE_MISMATCH, ENTITLEMENT_UNAVAILABLE]
    subject_binding: caller_account_id
  - service: account-service
    route: Authenticate
    scope: account
    classification: internal_workload
    auth_path: mtls_workload
    issued_token_state: none
    accepted_token_profiles: []
    token_audience: none
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/game-session-service"]
    credential_source_context: required_trusted_server_derived
    delegated_subject: none_before_authentication
  - service: account-service
    route: RefreshGameplayServiceToken
    scope: tenant
    classification: internal_workload
    auth_path: mtls_workload_plus_current_token_generation
    issued_token_state: current_exact_private_delegation
    accepted_token_profiles: [game-session-account-delegation]
    token_audience: account-service
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/game-session-service"]
    delegated_subject: gameplay_binding_subject
    required_live_checks: [current_token_generation, account_generation, membership_generation, membership, runtime_entitlements]
  - service: account-service
    route: GetTenantMembershipForRuntime
    scope: tenant
    classification: internal_workload
    auth_path: mtls_workload
    issued_token_state: none
    accepted_token_profiles: []
    token_audience: none
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/game-session-service"]
    delegated_subject: typed_player_execution_context
    required_live_checks: [membership]
  - service: account-service
    route: GetRealmAccessGrant
    scope: tenant
    classification: internal_workload
    auth_path: mtls_workload
    issued_token_state: none
    accepted_token_profiles: []
    token_audience: none
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/game-session-service"]
    delegated_subject: typed_player_execution_context
    required_live_checks: [conditional_realm_access_grant]
  - service: account-service
    route: ListRealmAccessGrantsForAccount
    scope: tenant
    classification: internal_workload
    auth_path: mtls_workload
    issued_token_state: none
    accepted_token_profiles: []
    token_audience: none
    mtls_callers:
      any_of: ["spiffe://firemud/ns/{namespace}/sa/game-session-service"]
    delegated_subject: typed_player_execution_context
  - service: account-service
    route: GetTenantEntitlementsForRuntime
    scope: tenant
    classification: internal_workload
    auth_path: internal_service
    issued_token_state: route_variant
    accepted_token_profiles: [game-session-account-delegation, control-ui]
    token_audience: exact_receiver
    tenant_billing_watermark_applies: true
    membership_watermark_applies: true
    response_profile: runtime_admission
    allowed_callers:
      any_of: [game-session-service, logging-admin-service, platform-runtime]
    mtls_callers:
      any_of:
        - "spiffe://firemud/ns/{namespace}/sa/game-session-service"
        - "spiffe://firemud/ns/{namespace}/sa/logging-admin-service"
    delegated_subject: typed_player_execution_context_or_operator_request
  - service: account-service
    route: GetTenantEntitlementsTenant
    scope: tenant
    classification: billing_safe_tenant
    tenant_billing_watermark_applies: false
    membership_watermark_applies: true
    required_live_checks: [membership]
    response_profile: high_level_only
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: GetTenantEntitlementsCrossTenantSupportSafe
    scope: cross_tenant
    classification: cross_tenant_support_safe
    response_profile: high_level_only
    roles:
      any_of: [support, platformAdmin]
  - service: account-service
    route: GetSubscriptionTenantHighLevel
    scope: tenant
    classification: billing_safe_tenant
    tenant_billing_watermark_applies: false
    membership_watermark_applies: true
    required_live_checks: [membership]
    response_profile: high_level_only
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: ExportTenantData
    scope: tenant
    classification: billing_safe_tenant
    tenant_billing_watermark_applies: false
    membership_watermark_applies: true
    required_live_checks: [membership]
    response_profile: tenant_export_only
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: GetSubscriptionCrossTenantSupportSafe
    scope: cross_tenant
    classification: cross_tenant_support_safe
    response_profile: high_level_only
    roles:
      any_of: [support, platformAdmin]
  - service: account-service
    route: ListSubscriptionsTenantHighLevel
    scope: tenant
    classification: billing_safe_tenant
    tenant_billing_watermark_applies: false
    membership_watermark_applies: true
    required_live_checks: [membership]
    response_profile: high_level_only
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: ListSubscriptionsCrossTenantSupportSafe
    scope: cross_tenant
    classification: cross_tenant_support_safe
    response_profile: high_level_only
    roles:
      any_of: [support, platformAdmin]
  - service: account-service
    route: ListSubscriptionsCrossTenantBillingSafeReports
    scope: cross_tenant
    classification: cross_tenant_billing_safe
    response_profile: billing_reporting
    roles:
      any_of: [billingAdmin, platformAdmin]
  - service: account-service
    route: GetCallerTenantMembershipTenant
    scope: tenant
    classification: billing_safe_tenant
    tenant_billing_watermark_applies: false
    membership_watermark_applies: true
    required_live_checks: [membership]
    response_profile: membership_self_only
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: GetTenantMembershipForAccountCrossTenant
    scope: cross_tenant
    classification: cross_tenant_billing_safe
    response_profile: membership_reporting
    roles:
      any_of: [billingAdmin, platformAdmin]
  - service: account-service
    route: BillingArtifactsTenant
    scope: tenant
    classification: billing_safe_tenant
    tenant_billing_watermark_applies: false
    membership_watermark_applies: true
    required_live_checks: [membership]
    mutation_contract: shared_instrument_ack_required
    canonical_errors:
      any_of: [BILLING_SHARED_INSTRUMENT_ACK_REQUIRED, MEMBERSHIP_AUTH_UNAVAILABLE]
    roles:
      any_of: [tenantAdmin]
  - service: account-service
    route: BillingArtifactsCrossTenant
    scope: cross_tenant
    classification: cross_tenant_billing_safe
    roles:
      any_of: [billingAdmin, platformAdmin]
