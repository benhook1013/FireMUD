environment: production
internalBindings:
  postgres:
    endpoint: postgres.firemud.svc.cluster.local:5432
    credentialsRef: secret://firemud/postgres-credentials
  redis:
    coordination:
      endpoint: redis-coord.firemud.svc.cluster.local:6379
    cache:
      endpoint: redis-cache.firemud.svc.cluster.local:6379
  jwt:
    signingKeysRef: secret://firemud/jwt-signing-keys
    jwksRef: secret://firemud/jwt-jwks
  certificates:
    issuerRef: cert-manager://firemud/clusterissuers/firemud-production
  registry:
    imagePullSecretRef: secret://firemud/ghcr-pull-production
backupStorage:
  bucket: firemud-production-backups
assetStorage:
  bucket: firemud-production-assets
  endpoint: https://minio.production.internal
outboundComms:
  smtpHost: smtp.production.internal
  webhookTargets:
    accountNotifications: production-only
operatorCredentials:
  bindingRef: cert-manager://firemud/production-operator-client
serviceDiscovery:
  mode: kubernetes-dns-default
