syntax = "proto3";

package game_design.v1;

import "game-design/v1/publication_terminal_read_service.proto";

option java_package = "net.firedevops.firemud.gamedesign.v1";
option java_multiple_files = true;

// Explicit composition only; no runtime publication or lifecycle authority is enabled.
service GameDesignPublicationTerminalReadService {
  // Exact historical evidence; no source release, settlement, or admission authority.
  rpc ReadPublicationTerminal(ReadPublicationTerminalRequest)
      returns (ReadPublicationTerminalResponse);
  rpc ReadGameDesignPublicationTerminal(ReadGameDesignPublicationTerminalRequest)
      returns (ReadGameDesignPublicationTerminalResponse);
}

message ReadGameDesignPublicationTerminalRequest {
  // Closed schema-1 namespace/read UUID/complete original operation carrier.
  bytes canonical_request_bytes = 1;
}

message ReadGameDesignPublicationTerminalResponse {
  // Exact request echo plus UNKNOWN or the unchanged immutable terminal evidence.
  bytes canonical_response_bytes = 1;
}
