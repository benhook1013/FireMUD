version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Pacific/Auckland"
    groups:
      gradle-safe:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/config/openapi"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Pacific/Auckland"
    groups:
      openapi-safe:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web-client"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Pacific/Auckland"
    groups:
      web-client-safe:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Pacific/Auckland"
    groups:
      github-actions-safe:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
