version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Pacific/Auckland"

  - package-ecosystem: "npm"
    directory: "/config/openapi"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Pacific/Auckland"

  - package-ecosystem: "npm"
    directory: "/web-client"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Pacific/Auckland"
