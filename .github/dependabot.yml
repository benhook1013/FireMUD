version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"  # root where build.gradle exists
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Pacific/Auckland"

  - package-ecosystem: "npm"
    directory: "/frontend"  # adjust if your package.json is elsewhere
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Pacific/Auckland"
