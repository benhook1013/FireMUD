version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Pacific/Auckland"

  - package-ecosystem: "npm"
    directory: "/config/openapi"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Pacific/Auckland"

  - package-ecosystem: "npm"
    directory: "/web-client"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Pacific/Auckland"
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Pacific/Auckland"
