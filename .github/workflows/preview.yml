name: PR Preview Environment

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      action:
        description: Future hosted preview operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy
      pr_number:
        description: Pull request number to target
        required: true
        type: string
      image_tag:
        description: PR image tag to deploy (for example pr-123-deadbeef)
        required: false
        default: ""
        type: string
      preview_domain:
        description: Preview DNS suffix (for example preview.firedevops.net)
        required: false
        default: preview.firedevops.net
        type: string

permissions:
  contents: read
  packages: read
  issues: write
  pull-requests: write

jobs:
  preview-plan:
    name: Preview Plan
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      action: ${{ steps.derive.outputs.action }}
      pr_number: ${{ steps.derive.outputs.pr_number }}
      namespace: ${{ steps.derive.outputs.namespace }}
      release_name: ${{ steps.derive.outputs.release_name }}
      hostname: ${{ steps.derive.outputs.hostname }}
      image_tag: ${{ steps.derive.outputs.image_tag }}
    steps:
      - name: Derive preview identifiers
        id: derive
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PREVIEW_DOMAIN="preview.firedevops.net"
            if [ "${{ github.event.action }}" = "closed" ]; then
              ACTION="destroy"
            else
              ACTION="deploy"
            fi
            IMAGE_TAG="pr-${PR_NUMBER}-${GITHUB_SHA::8}"
          else
            PR_NUMBER="${{ inputs.pr_number }}"
            PREVIEW_DOMAIN="${{ inputs.preview_domain }}"
            ACTION="${{ inputs.action }}"
            IMAGE_TAG="${{ inputs.image_tag }}"
          fi
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="pr-${PR_NUMBER}-${GITHUB_SHA::8}"
          fi
          echo "action=${ACTION}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "namespace=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "release_name=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "hostname=pr-${PR_NUMBER}.${PREVIEW_DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Explain current state
        run: |
          cat <<'EOF'
          Hosted PR preview deployments are partially wired.

          The preview cluster, DNS, TLS, and CI credential model exist.
          Main CI still covers stack startup, smoke, and cross-service verification.
          This workflow currently prepares the target namespace, required secrets,
          and validates the preview manifests against the live cluster API.
          The final Helm apply is still gated because the application/database bootstrap
          and frontend delivery path are still under active implementation.

          Target preview contract:
          1. Build and push PR-tagged images to private GHCR.
          2. Authenticate a hosted single-node k3s preview cluster to pull those images.
          3. Deploy or upgrade Helm release pr-<PR_NUMBER> in namespace pr-<PR_NUMBER>.
          4. Seed PostgreSQL, MinIO, and other stateful preview components once on first create.
          5. Expose https://pr-<PR_NUMBER>.preview.<DOMAIN> through Traefik with TLS.
          6. Preserve mutable preview state for the life of the PR.
          7. Tear the namespace down when the PR closes or merges.

          Initial capacity target:
          - One full-stack preview should fit reliably on the preview node.
          - A second concurrent preview is best-effort and may fail if capacity is exhausted.
          - Capacity policy is enforced in CI via PREVIEW_MAX_ACTIVE (default 2).
          EOF

      - name: Show derived target
        env:
          PREVIEW_MAX_ACTIVE: ${{ vars.PREVIEW_MAX_ACTIVE }}
        run: |
          cat <<EOF
          event_name=${{ github.event_name }}
          derived_action=${{ steps.derive.outputs.action }}
          pr_number=${{ steps.derive.outputs.pr_number }}
          namespace=${{ steps.derive.outputs.namespace }}
          release_name=${{ steps.derive.outputs.release_name }}
          hostname=${{ steps.derive.outputs.hostname }}
          image_tag=${{ steps.derive.outputs.image_tag }}
          preview_max_active=${PREVIEW_MAX_ACTIVE:-2}
          EOF

  preview-access:
    name: Preview Cluster Access
    runs-on: ubuntu-latest
    needs: preview-plan
    if: ${{ needs.preview-plan.outputs.action == 'deploy' || needs.preview-plan.outputs.action == 'destroy' }}
    steps:
      - uses: actions/checkout@v6

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
        run: |
          KUBECONFIG_PATH="$(./dev-tools/preview/write-kubeconfig.sh)"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Verify preview cluster access
        run: |
          kubectl get namespace kube-system >/dev/null
          kubectl auth can-i get clusterissuers.cert-manager.io
          kubectl auth can-i list namespaces

  preview-prepare:
    name: Prepare Preview Namespace
    runs-on: ubuntu-latest
    needs:
      - preview-plan
      - preview-access
    if: ${{ needs.preview-plan.outputs.action == 'deploy' }}
    steps:
      - uses: actions/checkout@v6

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
        run: |
          KUBECONFIG_PATH="$(./dev-tools/preview/write-kubeconfig.sh)"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Enforce preview capacity
        env:
          PREVIEW_MAX_ACTIVE: ${{ vars.PREVIEW_MAX_ACTIVE }}
        run: |
          ./dev-tools/preview/check-preview-capacity.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${PREVIEW_MAX_ACTIVE:-2}"

      - name: Ensure preview namespace exists
        run: |
          ./dev-tools/preview/ensure-preview-namespace.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.pr_number }}"

      - name: Ensure GHCR pull secret exists
        env:
          PREVIEW_GHCR_USERNAME: ${{ secrets.PREVIEW_GHCR_USERNAME }}
          PREVIEW_GHCR_TOKEN: ${{ secrets.PREVIEW_GHCR_TOKEN }}
        run: |
          ./dev-tools/preview/ensure-ghcr-pull-secret.sh "${{ needs.preview-plan.outputs.namespace }}"

      - name: Ensure preview gRPC TLS secret exists
        run: |
          ./dev-tools/preview/ensure-grpc-tls-secret.sh "${{ needs.preview-plan.outputs.namespace }}"

      - name: Show namespace state
        run: |
          kubectl get namespace "${{ needs.preview-plan.outputs.namespace }}"
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get secret ghcr-preview-pull
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get secret firemud-grpc-tls

  preview-deploy-disabled:
    name: Deploy Preview Release
    runs-on: ubuntu-latest
    needs:
      - preview-plan
      - preview-prepare
    if: ${{ needs.preview-plan.outputs.action == 'deploy' }}
    environment: pr-preview
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
        run: |
          KUBECONFIG_PATH="$(./dev-tools/preview/write-kubeconfig.sh)"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Render preview values
        run: |
          ./dev-tools/preview/render-preview-values.sh \
            k8s/helm/firemud/values-preview.example.yaml \
            /tmp/preview-values.yaml \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.release_name }}" \
            "${{ needs.preview-plan.outputs.hostname }}" \
            "${{ needs.preview-plan.outputs.image_tag }}"

      - name: Validate preview chart render
        run: |
          helm template "${{ needs.preview-plan.outputs.release_name }}" k8s/helm/firemud \
            -f /tmp/preview-values.yaml \
            --namespace "${{ needs.preview-plan.outputs.namespace }}" \
            >/tmp/preview-rendered.yaml
          kubectl apply --dry-run=server -n "${{ needs.preview-plan.outputs.namespace }}" -f /tmp/preview-rendered.yaml
          wc -l /tmp/preview-rendered.yaml

      - name: Upload rendered preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-render-${{ needs.preview-plan.outputs.release_name }}
          path: |
            /tmp/preview-values.yaml
            /tmp/preview-rendered.yaml

      - name: Explain deployment gate
        run: |
          cat <<'EOF'
          Preview deployment is intentionally blocked at the final apply step.

          The workflow now proves:
          - cluster credentials work
          - the target namespace exists
          - the GHCR pull secret exists
          - the preview gRPC TLS secret exists
          - preview values can be generated from CI inputs
          - the current preview chart renders successfully
          - the rendered manifests pass server-side Kubernetes validation on the preview cluster

          The actual Helm apply remains gated until:
          - the preview frontend/runtime delivery path is ready
          - first-create data/bootstrap behavior moves beyond the current stub
          EOF

  preview-destroy:
    name: Destroy Preview Release
    runs-on: ubuntu-latest
    needs:
      - preview-plan
      - preview-access
    if: ${{ needs.preview-plan.outputs.action == 'destroy' }}
    environment: pr-preview
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
        run: |
          KUBECONFIG_PATH="$(./dev-tools/preview/write-kubeconfig.sh)"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Uninstall preview release if present
        run: |
          helm uninstall "${{ needs.preview-plan.outputs.release_name }}" \
            --namespace "${{ needs.preview-plan.outputs.namespace }}" \
            --ignore-not-found || true

      - name: Delete preview namespace if present
        run: |
          kubectl delete namespace "${{ needs.preview-plan.outputs.namespace }}" --ignore-not-found=true
