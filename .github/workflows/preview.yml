name: PR Preview Environment

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  preview-disabled:
    name: Preview Disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain current state
        run: |
          cat <<'EOF'
          PR preview deployments are intentionally disabled.

          Reason:
          - The main CI workflow already provides stack startup and smoke coverage.
          - This workflow should be reserved for a real reviewer-accessible preview deployment,
            not another CI-only Docker Compose boot path.

          Intended future design:
          1. Build PR-tagged service images.
          2. Push those images to a registry.
          3. Deploy them to an external preview host or platform.
          4. Emit a reviewer-accessible preview URL.
          5. Tear the preview down when the PR closes.

          Re-enable this workflow only after an external preview target is available.
          EOF
