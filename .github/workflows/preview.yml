name: PR Preview Environment

run-name: ${{ github.event_name == 'repository_dispatch' && format('Preview dispatch pr-{0}-base-{1}-head-{2}-merge-{3}', github.event.client_payload.pr_number, github.event.client_payload.base_sha || 'unknown', github.event.client_payload.head_sha, github.event.client_payload.merge_sha || 'unknown') || format('PR preview {0}', github.event.pull_request.number) }}

on:
  pull_request_target:
    paths-ignore:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'design/**'
      - 'dev-tools/docs/**'
      - 'dev-tools/validation/**/*.py'
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - edited
  repository_dispatch:
    types: [preview-deploy, preview-destroy]

permissions:
  contents: read
  pull-requests: read

jobs:
  preview-plan:
    name: Preview Plan
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository && (github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'preview:priority') && (github.event.action != 'edited' || github.event.changes.base != null)) }}
    concurrency:
      group: preview-plan-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.event.client_payload.pr_number || github.ref }}
      cancel-in-progress: true
    outputs:
      action: ${{ steps.derive.outputs.action }}
      pr_number: ${{ steps.derive.outputs.pr_number }}
      namespace: ${{ steps.derive.outputs.namespace }}
      release_name: ${{ steps.derive.outputs.release_name }}
      hostname: ${{ steps.derive.outputs.hostname }}
      image_tag: ${{ steps.derive.outputs.image_tag }}
      head_sha: ${{ steps.derive.outputs.head_sha }}
      base_ref: ${{ steps.derive.outputs.base_ref }}
      base_sha: ${{ steps.derive.outputs.base_sha }}
      merge_sha: ${{ steps.derive.outputs.merge_sha }}
      base_refresh_required: ${{ steps.derive.outputs.base_refresh_required }}
      eligible: ${{ steps.eligibility.outputs.eligible }}
      eligibility_reason: ${{ steps.eligibility.outputs.reason }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Check out trusted default branch for preview plan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up canonical Python
        uses: ./.github/actions/setup-python
        with:
          requirements: yaml

      - name: Set up canonical GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Derive preview identifiers
        id: derive
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          CLIENT_ACTION: ${{ github.event.client_payload.action }}
          CLIENT_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          CLIENT_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          CLIENT_BASE_REF: ${{ github.event.client_payload.base_ref }}
          CLIENT_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          CLIENT_MERGE_SHA: ${{ github.event.client_payload.merge_sha }}
          CLIENT_IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
          CLIENT_PREVIEW_DOMAIN: ${{ github.event.client_payload.preview_domain }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == repository_dispatch && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error title=Invalid preview dispatch ref::Manual preview source dispatches must run from the repository default branch." >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == pull_request_target ]]; then
            PR_NUMBER="$EVENT_PR_NUMBER"
            HEAD_SHA="$EVENT_HEAD_SHA"
            BASE_SHA=""
            MERGE_SHA=""
            ACTION=deploy
            PREVIEW_DOMAIN=preview.firedevops.net
            IMAGE_TAG=""
          elif [[ "$EVENT_NAME" == repository_dispatch ]]; then
            PR_NUMBER="$CLIENT_PR_NUMBER"
            HEAD_SHA="$CLIENT_HEAD_SHA"
            PREVIEW_DOMAIN="$CLIENT_PREVIEW_DOMAIN"
            PLANNED_BASE_REF="$CLIENT_BASE_REF"
            PLANNED_BASE_SHA="$CLIENT_BASE_SHA"
            PLANNED_MERGE_SHA="$CLIENT_MERGE_SHA"
            PLANNED_IMAGE_TAG="$CLIENT_IMAGE_TAG"
            BASE_SHA=""
            MERGE_SHA=""
            case "$EVENT_ACTION" in
              preview-deploy) ACTION=deploy ;;
              preview-destroy) ACTION=destroy ;;
              *)
                echo "::error title=Invalid preview dispatch type::Expected preview-deploy or preview-destroy." >&2
                exit 1
                ;;
            esac
            if [[ "$CLIENT_ACTION" != "$ACTION" ]]; then
              echo "::error title=Invalid preview dispatch action::Payload action does not match the typed dispatch event." >&2
              exit 1
            fi
            if [[ -z "$HEAD_SHA" ]]; then
              echo "::error title=Missing preview head SHA::Manual preview dispatches must supply the current PR head SHA." >&2
              exit 1
            fi
            if [[ "$HEAD_SHA" != "${HEAD_SHA,,}" ]]; then
              echo "::error title=Noncanonical preview head SHA::Expected lowercase hexadecimal input." >&2
              exit 1
            fi
            if [[ "$PREVIEW_DOMAIN" != preview.firedevops.net ]]; then
              echo "::error title=Invalid preview domain override::Only preview.firedevops.net is canonical." >&2
              exit 1
            fi
            for planned_sha in "$PLANNED_BASE_SHA" "$PLANNED_MERGE_SHA"; do
              if [[ -n "$planned_sha" && ! "$planned_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error title=Invalid preview dispatch tuple::Typed preview dispatches must use lowercase hexadecimal SHAs." >&2
                exit 1
              fi
            done
            if [[ -n "$PLANNED_BASE_REF" && ! "$PLANNED_BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error title=Invalid preview dispatch base ref::Typed preview dispatches must use a valid base branch ref." >&2
              exit 1
            fi
            if [[ "$ACTION" == deploy ]] &&
              { [[ -n "$PLANNED_BASE_REF" || -n "$PLANNED_BASE_SHA" || -n "$PLANNED_MERGE_SHA" ]] &&
                [[ -z "$PLANNED_BASE_REF" || -z "$PLANNED_BASE_SHA" || -z "$PLANNED_MERGE_SHA" ]]; }; then
              echo "::error title=Incomplete preview dispatch tuple::Typed preview deploys must carry base ref, base SHA, and merge SHA together." >&2
              exit 1
            fi
          fi

          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]{0,50}$ ]]; then
            echo "::error title=Invalid preview PR number::Expected a canonical positive decimal integer." >&2
            exit 1
          fi
          if [[ "$ACTION" != deploy && "$ACTION" != destroy ]]; then
            echo "::error title=Invalid preview action::Expected deploy or destroy." >&2
            exit 1
          fi
          if [[ ! "$PREVIEW_DOMAIN" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$ ]] ||
            (( ${#PREVIEW_DOMAIN} > 253 )); then
            echo "::error title=Invalid preview domain::Expected a lowercase DNS domain of at most 253 characters." >&2
            exit 1
          fi

          MERGE_RETRY_LIMIT=5
          MERGE_RETRY_DELAY_SECONDS="${PREVIEW_MERGE_RETRY_DELAY_SECONDS:-2}"
          if [[ ! "$MERGE_RETRY_DELAY_SECONDS" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid preview merge retry delay::Expected a non-negative integer number of seconds." >&2
            exit 1
          fi
          MERGE_ATTEMPT=0
          BASE_REFRESH_REQUIRED=false
          while :; do
            MERGE_ATTEMPT=$((MERGE_ATTEMPT + 1))
            PULL_REQUEST_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            if [[ "$(jq -r '.head.repo.full_name // empty' <<<"$PULL_REQUEST_JSON")" != "$GITHUB_REPOSITORY" ]] ||
              [[ "$(jq -r '.base.repo.full_name // empty' <<<"$PULL_REQUEST_JSON")" != "$GITHUB_REPOSITORY" ]]; then
              echo "::error title=Untrusted preview pull request::Preview operations require a pull request from this repository." >&2
              exit 1
            fi
            if ! CURRENT_HEAD_SHA="$(jq -er '.head.sha | select(type == "string")' <<<"$PULL_REQUEST_JSON")" ||
              ! CURRENT_BASE_REF="$(jq -er '.base.ref | select(type == "string" and length > 0)' <<<"$PULL_REQUEST_JSON")"; then
              echo "::error title=Invalid pull request metadata::Expected string current head SHA and base ref." >&2
              exit 1
            fi
            if [[ ! "$CURRENT_HEAD_SHA" =~ ^[0-9A-Fa-f]{40}$ ]] ||
              [[ ! "$CURRENT_BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error title=Invalid pull request metadata::Expected a 40-character hexadecimal current head SHA and a valid base ref." >&2
              exit 1
            fi
            CURRENT_HEAD_SHA="${CURRENT_HEAD_SHA,,}"
            CURRENT_BASE_SHA=""
            if CURRENT_BASE_REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CURRENT_BASE_REF}")" &&
              CURRENT_BASE_SHA="$(jq -er '.object.sha | select(type == "string")' <<<"$CURRENT_BASE_REF_JSON")" &&
              [[ "$CURRENT_BASE_SHA" =~ ^[0-9A-Fa-f]{40}$ ]]; then
              CURRENT_BASE_SHA="${CURRENT_BASE_SHA,,}"
            elif [[ "$ACTION" != destroy ]]; then
              echo "::error title=Invalid pull request base ref::Unable to read a 40-character hexadecimal SHA from the current base branch ref." >&2
              exit 1
            fi
            if [[ "${HEAD_SHA,,}" != "$CURRENT_HEAD_SHA" ]]; then
              echo "::error title=Stale preview head SHA::Supplied head SHA does not equal the current pull request head." >&2
              exit 1
            fi
            if [[ "$ACTION" == deploy && "$EVENT_NAME" == pull_request_target && "${EVENT_BASE_SHA,,}" != "$CURRENT_BASE_SHA" ]]; then
              BASE_REFRESH_REQUIRED=true
            fi
            HEAD_SHA="$CURRENT_HEAD_SHA"
            BASE_SHA="$CURRENT_BASE_SHA"

            if [[ "$EVENT_NAME" == pull_request_target && "$CURRENT_BASE_REF" != main && "$CURRENT_BASE_REF" != develop ]] ||
              [[ "$EVENT_NAME" == repository_dispatch && "$CURRENT_BASE_REF" != main && "$CURRENT_BASE_REF" != develop ]] ||
              [[ "$EVENT_NAME" == repository_dispatch && -n "$PLANNED_BASE_SHA" && -n "$PLANNED_IMAGE_TAG" ]]; then
              BASE_REFRESH_REQUIRED=true
            fi
            if [[ "$ACTION" != deploy ]]; then
              break
            fi

            MERGEABLE="$(jq -r 'if (.mergeable | type) == "boolean" then (.mergeable | tostring) elif .mergeable == null then "null" else "invalid" end' <<<"$PULL_REQUEST_JSON")"
            MERGEABLE_STATE="$(jq -r 'if .mergeable_state == null then "unknown" elif (.mergeable_state | type) == "string" then .mergeable_state else "invalid" end' <<<"$PULL_REQUEST_JSON")"
            if [[ "$MERGEABLE" == invalid || "$MERGEABLE_STATE" == invalid ]]; then
              echo "::error title=Invalid pull request merge metadata::Expected boolean mergeable and string mergeable_state fields." >&2
              exit 1
            fi
            if [[ "$MERGEABLE" == false || "$MERGEABLE_STATE" == dirty || "$MERGEABLE_STATE" == conflicting ]]; then
              echo "::error title=Preview merge conflict::The current pull request cannot be rendered because GitHub reports a conflicting test merge." >&2
              exit 1
            fi
            if [[ "$MERGEABLE" == null || "$MERGEABLE_STATE" == unknown ]]; then
              if (( MERGE_ATTEMPT >= MERGE_RETRY_LIMIT )); then
                echo "::error title=Preview merge computation unavailable::GitHub did not report a ready test merge after ${MERGE_RETRY_LIMIT} attempts." >&2
                exit 1
              fi
              sleep "$MERGE_RETRY_DELAY_SECONDS"
              continue
            fi
            if [[ "$MERGEABLE" != true ]]; then
              echo "::error title=Invalid pull request merge metadata::Expected mergeable to be true, false, or null." >&2
              exit 1
            fi
            if ! MERGE_SHA="$(jq -er '.merge_commit_sha | select(type == "string")' <<<"$PULL_REQUEST_JSON")"; then
              echo "::error title=Missing preview merge ref::GitHub reported a mergeable pull request without a computed test-merge commit." >&2
              exit 1
            fi
            if [[ ! "$MERGE_SHA" =~ ^[0-9A-Fa-f]{40}$ ]]; then
              echo "::error title=Invalid preview merge ref::Expected a 40-character hexadecimal test-merge SHA." >&2
              exit 1
            fi
            MERGE_SHA="${MERGE_SHA,,}"
            if ! MERGE_COMMIT_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}")" ||
              ! jq -e \
                --arg merge_sha "$MERGE_SHA" \
                --arg base_sha "$BASE_SHA" \
                --arg head_sha "$HEAD_SHA" \
                '.sha == $merge_sha and (.parents | type) == "array" and (.parents | length) == 2 and .parents[0].sha == $base_sha and .parents[1].sha == $head_sha' \
                <<<"$MERGE_COMMIT_JSON" >/dev/null; then
              if (( MERGE_ATTEMPT >= MERGE_RETRY_LIMIT )); then
                echo "::error title=Preview merge computation unavailable::The current test-merge commit does not have the exact current base and head parents after ${MERGE_RETRY_LIMIT} attempts." >&2
                exit 1
              fi
              sleep "$MERGE_RETRY_DELAY_SECONDS"
              continue
            fi
            break
          done

          if [[ "$EVENT_NAME" == repository_dispatch && -n "$PLANNED_BASE_SHA" ]] &&
            { [[ "$PLANNED_BASE_REF" != "$CURRENT_BASE_REF" ]] ||
              [[ "$PLANNED_BASE_SHA" != "$BASE_SHA" ]] ||
              [[ -n "$PLANNED_MERGE_SHA" && "$PLANNED_MERGE_SHA" != "$MERGE_SHA" ]]; }; then
            echo "::error title=Stale preview dispatch tuple::The live pull request no longer matches the reconciler's requested base tuple." >&2
            exit 1
          fi

          if [[ ! "$HEAD_SHA" =~ ^[0-9A-Fa-f]{40}$ ]] ||
            [[ "$ACTION" == deploy && ! "$BASE_SHA" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error title=Invalid preview SHA::Expected a 40-character hexadecimal head SHA and, for deploy, a base SHA." >&2
            exit 1
          fi
          if [[ "$ACTION" == deploy && ! "$MERGE_SHA" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error title=Invalid preview SHA::Expected a 40-character hexadecimal merge SHA for deploy." >&2
            exit 1
          fi
          HEAD_SHA="${HEAD_SHA,,}"
          BASE_SHA="${BASE_SHA,,}"
          MERGE_SHA="${MERGE_SHA,,}"

          IMAGE_TAG="$HEAD_SHA"
          if [[ "$ACTION" == deploy ]]; then
            IMAGE_TAG="$(bash ./dev-tools/hosted/preview/resolve-preview-image-tag.sh \
              "$MERGE_SHA" "$PR_NUMBER" "$BASE_SHA")"
            EXPECTED_MERGE_IMAGE_TAG="pr-merge-${MERGE_SHA}"
            if [[ "$IMAGE_TAG" != "$EXPECTED_MERGE_IMAGE_TAG" && "$IMAGE_TAG" != "$BASE_SHA" ]]; then
              echo "::error title=Invalid preview image resolution::Expected the tested PR merge tag or immutable base SHA." >&2
              exit 1
            fi
            if [[ -n "${PLANNED_IMAGE_TAG:-}" && "$PLANNED_IMAGE_TAG" != "$IMAGE_TAG" ]]; then
              echo "::error title=Stale preview image identity::The current PR image identity no longer matches the reconciler request." >&2
              exit 1
            fi
          fi

          PREVIEW_HOSTNAME="pr-${PR_NUMBER}.${PREVIEW_DOMAIN}"
          if (( ${#PREVIEW_HOSTNAME} > 253 )); then
            echo "::error title=Invalid preview domain::Derived preview hostname exceeds 253 characters." >&2
            exit 1
          fi
          {
            echo "action=${ACTION}"
            echo "pr_number=${PR_NUMBER}"
            echo "namespace=pr-${PR_NUMBER}"
            echo "release_name=pr-${PR_NUMBER}"
            echo "hostname=${PREVIEW_HOSTNAME}"
            echo "image_tag=${IMAGE_TAG}"
            echo "head_sha=${HEAD_SHA}"
            echo "base_ref=${CURRENT_BASE_REF}"
            echo "base_sha=${BASE_SHA}"
            echo "merge_sha=${MERGE_SHA}"
            echo "base_refresh_required=${BASE_REFRESH_REQUIRED}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve preview target metadata
        id: target-metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          DERIVED_PR_NUMBER: ${{ steps.derive.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request_target ]]; then
            PR_AUTHOR="$PR_USER_LOGIN"
            BASE_REF="$PR_BASE_REF"
            LABELS_JSON="$(jq -c 'if type == "array" then [.[] | {name: .name}] else . end' <<<"$PR_LABELS_JSON")"
            PR_STATE=open
          else
            PULL_REQUEST_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${DERIVED_PR_NUMBER}")"
            PR_AUTHOR="$(jq -r '.user.login' <<<"$PULL_REQUEST_JSON")"
            BASE_REF="$(jq -r '.base.ref' <<<"$PULL_REQUEST_JSON")"
            PR_STATE="$(jq -r '.state' <<<"$PULL_REQUEST_JSON")"
            LABELS_JSON="$(jq -c '.labels | if type == "array" then [.[] | {name: .name}] else . end' <<<"$PULL_REQUEST_JSON")"
          fi
          {
            echo "author=${PR_AUTHOR}"
            echo "base_ref=${BASE_REF}"
            echo "state=${PR_STATE}"
            echo "labels_json=${LABELS_JSON}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve preview eligibility
        id: eligibility
        env:
          DERIVED_ACTION: ${{ steps.derive.outputs.action }}
          TARGET_STATE: ${{ steps.target-metadata.outputs.state }}
          TARGET_BASE_REF: ${{ steps.target-metadata.outputs.base_ref }}
          TARGET_AUTHOR: ${{ steps.target-metadata.outputs.author }}
          TARGET_LABELS_JSON: ${{ steps.target-metadata.outputs.labels_json }}
        run: |
          python3 ./dev-tools/hosted/preview/preview-eligibility.py \
            --operation "$DERIVED_ACTION" \
            --state "$TARGET_STATE" \
            --base-ref "$TARGET_BASE_REF" \
            --author "$TARGET_AUTHOR" \
            --labels-json "$TARGET_LABELS_JSON" >> "$GITHUB_OUTPUT"

      - name: Explain preview skip
        if: ${{ steps.eligibility.outputs.eligible != 'true' }}
        run: |
          case "${{ steps.eligibility.outputs.reason }}" in
            dependency-bot)
              printf '%s\n' \
                'Preview orchestration is skipped for dependency bot PRs.' \
                '' \
                'Dependabot and Renovate updates do not get preview render or' \
                'trusted hosted preview lifecycle work.'
              ;;
            unsupported-base-branch)
              printf '%s\n' \
                'Preview orchestration is skipped for stacked PRs whose base branch' \
                'is not main or develop.'
              ;;
            pr-not-open)
              printf '%s\n' \
                'Preview orchestration is skipped because the PR is not open.'
              ;;
            *)
              echo 'Preview orchestration is skipped for this target.'
              ;;
          esac

      - name: Show derived target
        run: |
          cat <<EOF
          event_name=${{ github.event_name }}
          derived_action=${{ steps.derive.outputs.action }}
          pr_number=${{ steps.derive.outputs.pr_number }}
          namespace=${{ steps.derive.outputs.namespace }}
          release_name=${{ steps.derive.outputs.release_name }}
          hostname=${{ steps.derive.outputs.hostname }}
          image_tag=${{ steps.derive.outputs.image_tag }}
          head_sha=${{ steps.derive.outputs.head_sha }}
          base_sha=${{ steps.derive.outputs.base_sha }}
          merge_sha=${{ steps.derive.outputs.merge_sha }}
          base_refresh_required=${{ steps.derive.outputs.base_refresh_required }}
          EOF

  preview-runtime-base-refresh:
    name: Refresh PR Runtime Images For Current Base
    needs: preview-plan
    if: ${{ needs.preview-plan.outputs.eligible == 'true' && needs.preview-plan.outputs.action == 'deploy' && needs.preview-plan.outputs.base_refresh_required == 'true' && needs.preview-plan.outputs.image_tag != needs.preview-plan.outputs.base_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Dispatch exact current-base runtime refresh when event metadata is stale
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BASE_REFRESH_REQUIRED: ${{ needs.preview-plan.outputs.base_refresh_required }}
          PR_NUMBER: ${{ needs.preview-plan.outputs.pr_number }}
          BASE_REF: ${{ needs.preview-plan.outputs.base_ref }}
          BASE_SHA: ${{ needs.preview-plan.outputs.base_sha }}
          HEAD_SHA: ${{ needs.preview-plan.outputs.head_sha }}
          MERGE_SHA: ${{ needs.preview-plan.outputs.merge_sha }}
          IMAGE_TAG: ${{ needs.preview-plan.outputs.image_tag }}
        with:
          script: |
            if (process.env.BASE_REFRESH_REQUIRED !== "true") {
              core.info("Preview event already carried the current base branch SHA; no runtime refresh dispatch is required.");
              return;
            }

            const shaPattern = /^[0-9a-f]{40}$/;
            const {data: pullRequest} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const baseRef = pullRequest.base?.ref;
            const headRepository = pullRequest.head?.repo?.full_name;
            const baseRepository = pullRequest.base?.repo?.full_name;
            if (pullRequest.state !== "open" ||
              headRepository !== context.payload.repository.full_name ||
              baseRepository !== context.payload.repository.full_name ||
              baseRef !== process.env.BASE_REF ||
              pullRequest.head?.sha !== process.env.HEAD_SHA ||
              pullRequest.merge_commit_sha !== process.env.MERGE_SHA) {
              core.setFailed("Current pull-request metadata no longer matches the planned preview tuple.");
              return;
            }

            const {data: branchRef} = await github.rest.git.getRef({
              ...context.repo,
              ref: `heads/${baseRef}`,
            });
            if (branchRef.object?.sha !== process.env.BASE_SHA) {
              core.setFailed("Current base branch ref no longer matches the planned preview tuple.");
              return;
            }

            const {data: mergeCommit} = await github.rest.repos.getCommit({
              ...context.repo,
              ref: process.env.MERGE_SHA,
            });
            const parents = mergeCommit.parents?.map((parent) => parent.sha) || [];
            if (mergeCommit.sha !== process.env.MERGE_SHA ||
              parents.length !== 2 ||
              parents[0] !== process.env.BASE_SHA ||
              parents[1] !== process.env.HEAD_SHA) {
              core.setFailed("Current merge commit does not have the exact planned base/head parents.");
              return;
            }

            if (!shaPattern.test(process.env.BASE_SHA) ||
              !shaPattern.test(process.env.HEAD_SHA) ||
              !shaPattern.test(process.env.MERGE_SHA) ||
              process.env.IMAGE_TAG === process.env.BASE_SHA) {
              core.setFailed("Runtime refresh dispatch has an invalid PR image tuple.");
              return;
            }

            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: "pr-runtime-base-refresh",
              client_payload: {
                pr_number: process.env.PR_NUMBER,
                base_ref: baseRef,
                base_sha: process.env.BASE_SHA,
                head_sha: process.env.HEAD_SHA,
                merge_sha: process.env.MERGE_SHA,
                image_tag: process.env.IMAGE_TAG,
              },
            });
            core.info(`Dispatched current-base runtime refresh for PR #${process.env.PR_NUMBER}.`);

  preview-render:
    name: Render Sanitized Preview Artifact
    needs: [preview-plan, preview-runtime-base-refresh]
    if: ${{ always() && needs.preview-plan.outputs.eligible == 'true' && needs.preview-plan.outputs.action == 'deploy' && (needs.preview-runtime-base-refresh.result == 'success' || needs.preview-runtime-base-refresh.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: preview-render-${{ needs.preview-plan.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Check out exact PR merge ref for untrusted render
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ needs.preview-plan.outputs.pr_number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Set up canonical Helm
        uses: ./.github/actions/setup-helm

      - name: Set up canonical Python
        uses: ./.github/actions/setup-python
        with:
          requirements: yaml

      - name: Render and sanitize preview without credentials
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ needs.preview-plan.outputs.pr_number }}
          NAMESPACE: ${{ needs.preview-plan.outputs.namespace }}
          RELEASE_NAME: ${{ needs.preview-plan.outputs.release_name }}
          HOSTNAME: ${{ needs.preview-plan.outputs.hostname }}
          IMAGE_TAG: ${{ needs.preview-plan.outputs.image_tag }}
          BASE_SHA: ${{ needs.preview-plan.outputs.base_sha }}
          HEAD_SHA: ${{ needs.preview-plan.outputs.head_sha }}
          PLANNED_MERGE_SHA: ${{ needs.preview-plan.outputs.merge_sha }}
        run: |
          set -euo pipefail
          umask 077
          if ! MERGE_SHA="$(git rev-parse --verify 'HEAD^{commit}')"; then
            echo "::error title=Invalid preview merge ref::The checked-out pull request merge ref is not a commit." >&2
            exit 1
          fi
          if ! merge_parents="$(git rev-list --parents -n 1 "$MERGE_SHA")"; then
            echo "::error title=Invalid preview merge ref::Unable to read the checked-out merge commit parents." >&2
            exit 1
          fi
          expected_merge_parents="$MERGE_SHA $BASE_SHA $HEAD_SHA"
          if [[ "$MERGE_SHA" != "$PLANNED_MERGE_SHA" || "$merge_parents" != "$expected_merge_parents" ]]; then
            echo "::error title=Stale preview merge ref::The checked-out merge ref is not the planned two-parent merge of the planned base and head SHAs." >&2
            exit 1
          fi

          values="$RUNNER_TEMP/preview-values.yaml"
          rendered="$RUNNER_TEMP/preview-rendered.yaml"
          filtered="$RUNNER_TEMP/preview-rendered-artifact-input.yaml"
          sanitized="$RUNNER_TEMP/preview-rendered-sanitized.yaml"
          metadata="$RUNNER_TEMP/preview-metadata.json"
          python3 ./dev-tools/hosted/preview/render-preview-values.py \
            k8s/helm/firemud/values-hosted-shared.example.yaml \
            "$values" "$PR_NUMBER" "$NAMESPACE" "$RELEASE_NAME" "$HOSTNAME" "$IMAGE_TAG" 32000
          helm template "$RELEASE_NAME" k8s/helm/firemud \
            -f "$values" --namespace "$NAMESPACE" > "$rendered"

          # Only these chart-owned objects are intentionally absent from the
          # credential-free artifact. Every other forbidden object is rejected.
          python3 - "$rendered" "$filtered" <<'PY'
          import sys
          from pathlib import Path

          import yaml

          source, destination = map(Path, sys.argv[1:])
          excluded = {
              ("ServiceAccount", "firemud-app"),
              ("Secret", "firemud-secret"),
              ("Secret", "jwt-signing-keys"),
              ("Secret", "minio-credentials"),
              ("ConfigMap", "jwt-jwks"),
          }
          forbidden = {
              "Certificate", "CertificateRequest", "ClusterIssuer",
              "CustomResourceDefinition", "HostedEnvironmentIdentity", "Role",
              "RoleBinding", "ClusterRole", "ClusterRoleBinding",
              "ServiceAccount", "Secret",
          }
          documents = []
          for document in yaml.safe_load_all(source.read_text(encoding="utf-8")):
              if document is None:
                  continue
              if not isinstance(document, dict):
                  raise SystemExit("render contains a non-object document")
              identity = (document.get("kind"), (document.get("metadata") or {}).get("name"))
              if identity in excluded:
                  continue
              if document.get("kind") in forbidden:
                  raise SystemExit(
                      f"render contains forbidden object not in explicit exclusion allowlist: {identity}"
                  )
              documents.append(document)
          destination.write_text(
              "---\n".join(yaml.safe_dump(document, sort_keys=False) for document in documents),
              encoding="utf-8",
          )
          PY

          python3 ./dev-tools/hosted/preview/validate-preview-artifact.py \
            sanitize "$filtered" "$sanitized"
          manifest_sha256="$(sha256sum "$sanitized" | awk '{print $1}')"
          jq -n \
            --arg event "$EVENT_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceWorkflow '.github/workflows/preview.yml' \
            --argjson sourceRunId "$GITHUB_RUN_ID" \
            --argjson prNumber "$PR_NUMBER" \
            --arg baseSha "$BASE_SHA" \
            --arg headSha "$HEAD_SHA" \
            --arg mergeSha "$MERGE_SHA" \
            --arg imageTag "$IMAGE_TAG" \
            --arg hostname "$HOSTNAME" \
            --arg manifestSha256 "$manifest_sha256" \
            --arg action deploy \
            '{schemaVersion:1,event:$event,repository:$repository,sourceWorkflow:$sourceWorkflow,sourceRunId:$sourceRunId,prNumber:$prNumber,baseSha:$baseSha,headSha:$headSha,mergeSha:$mergeSha,imageTag:$imageTag,hostname:$hostname,manifestSha256:$manifestSha256} + (if $event == "repository_dispatch" then {action:$action} else {} end)' \
            > "$metadata"
          {
            echo '### Sanitized PR preview artifact'
            echo
            echo "- PR: #${PR_NUMBER}"
            echo "- Source event: ${EVENT_NAME}"
            echo "- Head SHA: \`${HEAD_SHA}\`"
            echo '- Artifact contains no cluster, runtime, identity, or repository write credential.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized render artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-render-pr-${{ needs.preview-plan.outputs.pr_number }}-${{ needs.preview-plan.outputs.head_sha }}
          path: |
            ${{ runner.temp }}/preview-rendered-sanitized.yaml
            ${{ runner.temp }}/preview-metadata.json
          if-no-files-found: error
          retention-days: 7

  preview-destroy-intent:
    name: Publish Preview Destroy Intent
    needs: preview-plan
    if: ${{ github.event_name == 'repository_dispatch' && needs.preview-plan.outputs.eligible == 'true' && needs.preview-plan.outputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Write destroy intent
        env:
          PR_NUMBER: ${{ needs.preview-plan.outputs.pr_number }}
          HEAD_SHA: ${{ needs.preview-plan.outputs.head_sha }}
        run: |
          set -euo pipefail
          umask 077
          jq -n \
            --arg event repository_dispatch \
            --arg action destroy \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceWorkflow '.github/workflows/preview.yml' \
            --argjson sourceRunId "$GITHUB_RUN_ID" \
            --argjson prNumber "$PR_NUMBER" \
            --arg headSha "$HEAD_SHA" \
            '{schemaVersion:1,event:$event,action:$action,repository:$repository,sourceWorkflow:$sourceWorkflow,sourceRunId:$sourceRunId,prNumber:$prNumber,headSha:$headSha}' \
            > "$RUNNER_TEMP/preview-intent.json"

      - name: Upload destroy intent
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-intent-pr-${{ needs.preview-plan.outputs.pr_number }}-${{ needs.preview-plan.outputs.head_sha }}
          path: ${{ runner.temp }}/preview-intent.json
          if-no-files-found: error
          retention-days: 7
