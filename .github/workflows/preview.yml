name: PR Preview Environment

on:
  pull_request:
    types:
      - opened
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      action:
        description: Future hosted preview operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy
      pr_number:
        description: Pull request number to target
        required: true
        type: string
      image_tag:
        description: PR image tag to deploy (for example pr-123-deadbeef)
        required: false
        default: ""
        type: string
      head_sha:
        description: PR head SHA to align the preview namespace with
        required: false
        default: ""
        type: string
      preview_domain:
        description: Preview DNS suffix (for example preview.firedevops.net)
        required: false
        default: preview.firedevops.net
        type: string

permissions:
  contents: read
  packages: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-plan:
    name: Preview Plan
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
      action: ${{ steps.derive.outputs.action }}
      pr_number: ${{ steps.derive.outputs.pr_number }}
      namespace: ${{ steps.derive.outputs.namespace }}
      release_name: ${{ steps.derive.outputs.release_name }}
      hostname: ${{ steps.derive.outputs.hostname }}
      image_tag: ${{ steps.derive.outputs.image_tag }}
      head_sha: ${{ steps.derive.outputs.head_sha }}
    steps:
      - name: Resolve preview eligibility
        id: eligibility
        uses: actions/github-script@v8
        with:
          script: |
            let prAuthor;
            if (context.eventName === "pull_request") {
              prAuthor = context.payload.pull_request.user.login;
            } else {
              const prNumber = Number("${{ inputs.pr_number }}");
              const { data: pull } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: prNumber,
              });
              prAuthor = pull.user.login;
            }

            const eligible = prAuthor !== "dependabot[bot]";
            core.setOutput("eligible", eligible ? "true" : "false");
            core.info(
              eligible
                ? `Preview target is eligible (author=${prAuthor}).`
                : `Skipping preview orchestration for Dependabot PR (author=${prAuthor}).`
            );

      - name: Derive preview identifiers
        id: derive
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            PREVIEW_DOMAIN="preview.firedevops.net"
            if [ "${{ github.event.action }}" = "closed" ]; then
              ACTION="destroy"
            else
              ACTION="deploy"
            fi
          else
            PR_NUMBER="${{ inputs.pr_number }}"
            HEAD_SHA="${{ inputs.head_sha }}"
            PREVIEW_DOMAIN="${{ inputs.preview_domain }}"
            ACTION="${{ inputs.action }}"
            IMAGE_TAG="${{ inputs.image_tag }}"
          fi
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="${GITHUB_SHA}"
          fi
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="pr-${PR_NUMBER}-${HEAD_SHA:0:8}"
          fi
          {
            echo "action=${ACTION}"
            echo "pr_number=${PR_NUMBER}"
            echo "namespace=pr-${PR_NUMBER}"
            echo "release_name=pr-${PR_NUMBER}"
            echo "hostname=pr-${PR_NUMBER}.${PREVIEW_DOMAIN}"
            echo "image_tag=${IMAGE_TAG}"
            echo "head_sha=${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Explain current state
        run: |
          cat <<'EOF'
          Hosted PR preview deployments are partially wired.

          The preview cluster, DNS, and TLS path exist.
          Main CI still covers stack startup, smoke, and cross-service verification.
          Preview orchestration now runs on GitHub-hosted CI and talks to the
          Hetzner preview cluster remotely through a kubeconfig secret.
          The workflow prepares the target namespace, required secrets,
          and validates the preview manifests against the live cluster API.
          The final Helm apply is still gated because the application/database bootstrap
          and frontend delivery path are still under active implementation.

          Target preview contract:
          1. Build and push PR-tagged images to private GHCR.
          2. Authenticate a hosted single-node k3s preview cluster to pull those images.
          3. Deploy or upgrade Helm release pr-<PR_NUMBER> in namespace pr-<PR_NUMBER>.
          4. Seed PostgreSQL, MinIO, and other stateful preview components once on first create.
          5. Expose https://pr-<PR_NUMBER>.preview.<DOMAIN> through Traefik with TLS.
          6. Preserve mutable preview state for the life of the PR.
          7. Tear the namespace down when the PR closes or merges.

          Initial capacity target:
          - One full-stack preview should fit reliably on the preview node.
          - A second concurrent preview is best-effort and may fail if capacity is exhausted.
          - Capacity policy is enforced in CI via PREVIEW_MAX_ACTIVE (default 2).
          EOF

      - name: Explain preview skip
        if: ${{ steps.eligibility.outputs.eligible != 'true' }}
        run: |
          cat <<'EOF'
          Preview orchestration is skipped for Dependabot PRs.

          Dependabot updates do not get preview namespace preparation, hosted
          preview reconciliation, or hosted preview validation work.
          EOF

      - name: Show derived target
        env:
          PREVIEW_MAX_ACTIVE: ${{ vars.PREVIEW_MAX_ACTIVE }}
        run: |
          cat <<EOF
          event_name=${{ github.event_name }}
          derived_action=${{ steps.derive.outputs.action }}
          pr_number=${{ steps.derive.outputs.pr_number }}
          namespace=${{ steps.derive.outputs.namespace }}
          release_name=${{ steps.derive.outputs.release_name }}
          hostname=${{ steps.derive.outputs.hostname }}
          image_tag=${{ steps.derive.outputs.image_tag }}
          head_sha=${{ steps.derive.outputs.head_sha }}
          preview_max_active=${PREVIEW_MAX_ACTIVE:-2}
          EOF

  preview-deploy-disabled:
    name: Deploy Preview Release
    runs-on: ubuntu-latest
    needs: preview-plan
    if: ${{ needs.preview-plan.outputs.eligible == 'true' && needs.preview-plan.outputs.action == 'deploy' }}
    environment: pr-preview
    steps:
      - uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.33.4

      - name: Set up Helm
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.20.1"
            INSTALL_DIR="$HOME/.local/bin"
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
            tar -xzf /tmp/helm.tgz -C /tmp
            install /tmp/linux-amd64/helm "$INSTALL_DIR/helm"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          helm version

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
        run: |
          KUBECONFIG_PATH="$(bash ./dev-tools/preview/write-kubeconfig.sh)"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Verify preview cluster access
        run: |
          kubectl get namespace kube-system >/dev/null
          kubectl auth can-i get clusterissuers.cert-manager.io --all-namespaces
          kubectl auth can-i list namespaces --all-namespaces

      - name: Prune stale preview namespaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./dev-tools/preview/prune-stale-preview-namespaces.sh --apply

      - name: Explain preview capacity gate
        env:
          PREVIEW_MAX_ACTIVE: ${{ vars.PREVIEW_MAX_ACTIVE }}
        run: |
          cat <<EOF
          Preview capacity enforcement is currently skipped in hosted CI because
          this workflow still stops before the final Helm apply step.

          The current preview job only prepares namespaces/secrets and validates
          manifests against the live cluster API; it does not yet create a full
          deployed preview release that should consume the PREVIEW_MAX_ACTIVE
          budget (${PREVIEW_MAX_ACTIVE:-2}).

          Namespace pruning still runs above so stale PR namespaces are cleaned
          up, but hard preview-capacity admission should return once the final
          apply gate is removed and previews become real running environments.
          EOF

      - name: Ensure preview namespace exists
        run: |
          bash ./dev-tools/preview/ensure-preview-namespace.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.pr_number }}"

      - name: Ensure GHCR pull secret exists
        env:
          PREVIEW_GHCR_USERNAME: ${{ secrets.PREVIEW_GHCR_USERNAME }}
          PREVIEW_GHCR_TOKEN: ${{ secrets.PREVIEW_GHCR_TOKEN }}
        run: |
          bash ./dev-tools/preview/ensure-ghcr-pull-secret.sh "${{ needs.preview-plan.outputs.namespace }}"

      - name: Ensure preview gRPC TLS secret exists
        run: |
          bash ./dev-tools/preview/ensure-grpc-tls-secret.sh "${{ needs.preview-plan.outputs.namespace }}"

      - name: Show namespace state
        run: |
          kubectl get namespace "${{ needs.preview-plan.outputs.namespace }}"
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get secret ghcr-preview-pull
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get secret firemud-grpc-tls

      - name: Render preview values
        run: |
          bash ./dev-tools/preview/render-preview-values.sh \
            k8s/helm/firemud/values-preview.example.yaml \
            /tmp/preview-values.yaml \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.release_name }}" \
            "${{ needs.preview-plan.outputs.hostname }}" \
            "${{ needs.preview-plan.outputs.image_tag }}"

      - name: Validate preview chart render
        run: |
          helm template "${{ needs.preview-plan.outputs.release_name }}" k8s/helm/firemud \
            -f /tmp/preview-values.yaml \
            --namespace "${{ needs.preview-plan.outputs.namespace }}" \
            >/tmp/preview-rendered.yaml
          kubectl apply --dry-run=server -n "${{ needs.preview-plan.outputs.namespace }}" -f /tmp/preview-rendered.yaml
          wc -l /tmp/preview-rendered.yaml

      - name: Upload rendered preview artifacts
        uses: actions/upload-artifact@v7
        with:
          name: preview-render-${{ needs.preview-plan.outputs.release_name }}
          path: |
            /tmp/preview-values.yaml
            /tmp/preview-rendered.yaml

      - name: Record reconciled preview target
        run: |
          bash ./dev-tools/preview/annotate-preview-namespace.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}" \
            "${{ needs.preview-plan.outputs.image_tag }}"

      - name: Explain deployment gate
        run: |
          cat <<'EOF'
          Preview deployment is intentionally blocked at the final apply step.

          The workflow now proves:
          - cluster credentials work
          - the target namespace exists
          - the GHCR pull secret exists
          - the preview gRPC TLS secret exists
          - cluster access is performed from GitHub-hosted CI over secret-backed kubeconfig
          - preview values can be generated from CI inputs
          - the current preview chart renders successfully
          - the rendered manifests pass server-side Kubernetes validation on the preview cluster

          The actual Helm apply remains gated until:
          - the preview frontend/runtime delivery path is ready
          - first-create data/bootstrap behavior moves beyond the current stub
          EOF

  preview-destroy:
    name: Destroy Preview Release
    runs-on: ubuntu-latest
    needs: preview-plan
    if: ${{ needs.preview-plan.outputs.eligible == 'true' && needs.preview-plan.outputs.action == 'destroy' }}
    environment: pr-preview
    steps:
      - uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.33.4

      - name: Set up Helm
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.20.1"
            INSTALL_DIR="$HOME/.local/bin"
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
            tar -xzf /tmp/helm.tgz -C /tmp
            install /tmp/linux-amd64/helm "$INSTALL_DIR/helm"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          helm version

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
        run: |
          KUBECONFIG_PATH="$(bash ./dev-tools/preview/write-kubeconfig.sh)"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Delete preview namespace and release
        run: |
          bash ./dev-tools/preview/delete-preview-namespace.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.release_name }}"
