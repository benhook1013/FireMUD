name: PR Preview Environment

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      action:
        description: Future hosted preview operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy
      pr_number:
        description: Pull request number to target
        required: true
        type: string
      image_tag:
        description: PR image tag to deploy (for example pr-123-deadbeef)
        required: false
        default: ""
        type: string
      head_sha:
        description: PR head SHA to align the preview namespace with
        required: false
        default: ""
        type: string
      preview_domain:
        description: Preview DNS suffix (for example preview.firedevops.net)
        required: false
        default: preview.firedevops.net
        type: string

permissions:
  contents: read
  packages: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-plan:
    name: Preview Plan
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
      action: ${{ steps.derive.outputs.action }}
      pr_number: ${{ steps.derive.outputs.pr_number }}
      namespace: ${{ steps.derive.outputs.namespace }}
      release_name: ${{ steps.derive.outputs.release_name }}
      hostname: ${{ steps.derive.outputs.hostname }}
      image_tag: ${{ steps.derive.outputs.image_tag }}
      head_sha: ${{ steps.derive.outputs.head_sha }}
    steps:
      - name: Resolve preview eligibility
        id: eligibility
        uses: actions/github-script@v9
        with:
          script: |
            let prAuthor;
            if (context.eventName === "pull_request") {
              prAuthor = context.payload.pull_request.user.login;
            } else {
              const prNumber = Number("${{ inputs.pr_number }}");
              const { data: pull } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: prNumber,
              });
              prAuthor = pull.user.login;
            }

            const eligible = prAuthor !== "dependabot[bot]";
            core.setOutput("eligible", eligible ? "true" : "false");
            core.info(
              eligible
                ? `Preview target is eligible (author=${prAuthor}).`
                : `Skipping preview orchestration for Dependabot PR (author=${prAuthor}).`
            );

      - name: Derive preview identifiers
        id: derive
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            PREVIEW_DOMAIN="preview.firedevops.net"
            if [ "${{ github.event.action }}" = "closed" ]; then
              ACTION="destroy"
            else
              ACTION="deploy"
            fi
          else
            PR_NUMBER="${{ inputs.pr_number }}"
            HEAD_SHA="${{ inputs.head_sha }}"
            PREVIEW_DOMAIN="${{ inputs.preview_domain }}"
            ACTION="${{ inputs.action }}"
            IMAGE_TAG="${{ inputs.image_tag }}"
          fi
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="${GITHUB_SHA}"
          fi
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="${HEAD_SHA}"
          fi
          {
            echo "action=${ACTION}"
            echo "pr_number=${PR_NUMBER}"
            echo "namespace=pr-${PR_NUMBER}"
            echo "release_name=pr-${PR_NUMBER}"
            echo "hostname=pr-${PR_NUMBER}.${PREVIEW_DOMAIN}"
            echo "image_tag=${IMAGE_TAG}"
            echo "head_sha=${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Explain preview skip
        if: ${{ steps.eligibility.outputs.eligible != 'true' }}
        run: |
          cat <<'EOF'
          Preview orchestration is skipped for Dependabot PRs.

          Dependabot updates do not get preview namespace preparation, hosted
          preview reconciliation, or hosted preview validation work.
          EOF

      - name: Show derived target
        env:
          PREVIEW_MAX_ACTIVE: ${{ vars.PREVIEW_MAX_ACTIVE }}
        run: |
          cat <<EOF
          event_name=${{ github.event_name }}
          derived_action=${{ steps.derive.outputs.action }}
          pr_number=${{ steps.derive.outputs.pr_number }}
          namespace=${{ steps.derive.outputs.namespace }}
          release_name=${{ steps.derive.outputs.release_name }}
          hostname=${{ steps.derive.outputs.hostname }}
          image_tag=${{ steps.derive.outputs.image_tag }}
          head_sha=${{ steps.derive.outputs.head_sha }}
          preview_max_active=${PREVIEW_MAX_ACTIVE:-1}
          EOF

  preview-deploy:
    name: Deploy Preview Release
    runs-on:
      - self-hosted
      - preview
    needs: preview-plan
    if: ${{ needs.preview-plan.outputs.eligible == 'true' && needs.preview-plan.outputs.action == 'deploy' }}
    environment: pr-preview
    steps:
      - uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.33.4

      - name: Set up Helm
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.20.1"
            INSTALL_DIR="$HOME/.local/bin"
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
            tar -xzf /tmp/helm.tgz -C /tmp
            install /tmp/linux-amd64/helm "$INSTALL_DIR/helm"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          helm version

      - name: Set up GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            GH_VERSION="2.76.2"
            INSTALL_DIR="$HOME/.local/bin"
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o /tmp/gh.tgz
            tar -xzf /tmp/gh.tgz -C /tmp
            install "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" "$INSTALL_DIR/gh"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          gh --version

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
          PREVIEW_KUBECONFIG_LOCAL_SERVER: https://127.0.0.1:6443
        run: |
          KUBECONFIG_PATH="$(bash ./dev-tools/preview/write-kubeconfig.sh)"
          bash ./dev-tools/preview/persist-runner-kubeconfig.sh "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Verify preview cluster access
        run: |
          kubectl get namespace kube-system >/dev/null
          kubectl auth can-i get clusterissuers.cert-manager.io --all-namespaces
          kubectl auth can-i list namespaces --all-namespaces

      - name: Prune stale preview namespaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./dev-tools/preview/prune-stale-preview-namespaces.sh --apply

      - name: Enforce preview capacity
        env:
          PREVIEW_MAX_ACTIVE: ${{ vars.PREVIEW_MAX_ACTIVE }}
        run: |
          bash ./dev-tools/preview/check-preview-capacity.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${PREVIEW_MAX_ACTIVE:-1}"

      - name: Reset preview namespace for clean deploy
        run: |
          bash ./dev-tools/preview/delete-preview-namespace.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.release_name }}"

      - name: Ensure preview namespace exists
        run: |
          bash ./dev-tools/preview/ensure-preview-namespace.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.pr_number }}"

      - name: Allocate preview telnet port
        id: telnet-port
        run: |
          TELNET_PORT="$(bash ./dev-tools/preview/allocate-preview-telnet-port.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.pr_number }}")"
          echo "telnet_port=${TELNET_PORT}" >> "$GITHUB_OUTPUT"

      - name: Ensure GHCR pull secret exists
        env:
          PREVIEW_GHCR_USERNAME: ${{ secrets.PREVIEW_GHCR_USERNAME }}
          PREVIEW_GHCR_TOKEN: ${{ secrets.PREVIEW_GHCR_TOKEN }}
        run: |
          bash ./dev-tools/preview/ensure-ghcr-pull-secret.sh "${{ needs.preview-plan.outputs.namespace }}"

      - name: Resolve exact preview image tag
        id: effective-image-tag
        run: |
          EFFECTIVE_IMAGE_TAG="$(bash ./dev-tools/preview/resolve-preview-image-tag.sh \
            "${{ needs.preview-plan.outputs.image_tag }}")"
          echo "image_tag=${EFFECTIVE_IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Cancel if preview target was superseded before image wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! bash ./dev-tools/preview/check-preview-head-current.sh \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}"; then
            status=$?
            if [ "$status" -eq 10 ]; then
              echo "Cancelling stale preview run before image wait."
              gh run cancel "${GITHUB_RUN_ID}"
              sleep 5
              exit 0
            fi
            exit "$status"
          fi

      - name: Wait for preview runtime images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "PREVIEW_STAGE=wait-for-images" >> "$GITHUB_ENV"
          bash ./dev-tools/preview/wait-for-preview-images.sh "${{ steps.effective-image-tag.outputs.image_tag }}"

      - name: Ensure preview gRPC TLS secret exists
        run: |
          bash ./dev-tools/preview/ensure-grpc-tls-secret.sh "${{ needs.preview-plan.outputs.namespace }}"

      - name: Show namespace state
        run: |
          kubectl get namespace "${{ needs.preview-plan.outputs.namespace }}"
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get secret ghcr-preview-pull
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get secret firemud-grpc-tls

      - name: Render preview values
        run: |
          bash ./dev-tools/preview/render-preview-values.sh \
            k8s/helm/firemud/values-preview.example.yaml \
            /tmp/preview-values.yaml \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.release_name }}" \
            "${{ needs.preview-plan.outputs.hostname }}" \
            "${{ steps.effective-image-tag.outputs.image_tag }}" \
            "${{ steps.telnet-port.outputs.telnet_port }}"

      - name: Validate preview chart render
        run: |
          helm template "${{ needs.preview-plan.outputs.release_name }}" k8s/helm/firemud \
            -f /tmp/preview-values.yaml \
            --namespace "${{ needs.preview-plan.outputs.namespace }}" \
            >/tmp/preview-rendered.yaml
          kubectl apply --dry-run=server -n "${{ needs.preview-plan.outputs.namespace }}" -f /tmp/preview-rendered.yaml
          wc -l /tmp/preview-rendered.yaml

      - name: Upload rendered preview artifacts
        uses: actions/upload-artifact@v7
        with:
          name: preview-render-${{ needs.preview-plan.outputs.release_name }}
          path: |
            /tmp/preview-values.yaml
            /tmp/preview-rendered.yaml

      - name: Record reconciled preview target
        run: |
          bash ./dev-tools/preview/annotate-preview-namespace.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}" \
            "${{ steps.effective-image-tag.outputs.image_tag }}" \
            "${{ steps.telnet-port.outputs.telnet_port }}"

      - name: Summarize preview target
        run: |
          bash ./dev-tools/preview/write-preview-summary.sh \
            target \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}" \
            "${{ steps.effective-image-tag.outputs.image_tag }}" \
            "${{ needs.preview-plan.outputs.hostname }}" \
            "${{ steps.telnet-port.outputs.telnet_port }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cancel if preview target was superseded before deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! bash ./dev-tools/preview/check-preview-head-current.sh \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}"; then
            status=$?
            if [ "$status" -eq 10 ]; then
              echo "Cancelling stale preview run before deploy."
              gh run cancel "${GITHUB_RUN_ID}"
              sleep 5
              exit 0
            fi
            exit "$status"
          fi

      - name: Deploy preview release
        id: deploy-release
        continue-on-error: true
        run: |
          echo "PREVIEW_STAGE=deploy" >> "$GITHUB_ENV"
          helm upgrade --install "${{ needs.preview-plan.outputs.release_name }}" k8s/helm/firemud \
            -f /tmp/preview-values.yaml \
            --namespace "${{ needs.preview-plan.outputs.namespace }}" \
            --wait \
            --timeout 15m

      - name: Show deployed preview services
        if: ${{ always() }}
        run: |
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get pods,svc,ingress

      - name: Show preview rollout diagnostics
        if: ${{ always() && steps.deploy-release.outcome == 'failure' }}
        run: |
          echo "=== pods ==="
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get pods -o wide || true
          echo
          echo "=== events ==="
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get events --sort-by=.lastTimestamp | tail -n 120 || true
          echo
          echo "=== pod describe ==="
          for pod in $(kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get pods --no-headers | awk '$2 != $3 || $3 != "Running" {print $1}'); do
            echo "--- ${pod} ---"
            kubectl -n "${{ needs.preview-plan.outputs.namespace }}" describe pod "${pod}" || true
            echo
          done
          echo "=== recent logs ==="
          for deployment in account-service automation-scripting-service entity-management-service game-design-service game-logic-service game-session-service logging-admin-service social-groups-service spring-cloud-gateway tcp-proxy-service world-management-service; do
            echo "--- ${deployment} ---"
            kubectl -n "${{ needs.preview-plan.outputs.namespace }}" logs "deploy/${deployment}" --tail=120 || true
            echo
          done

      - name: Fail if preview rollout did not complete
        if: ${{ always() && steps.deploy-release.outcome == 'failure' }}
        run: |
          echo "Preview rollout failed during helm upgrade/install."
          exit 1

      - name: Create preview smoke account
        if: ${{ steps.deploy-release.outcome == 'success' }}
        env:
          PREVIEW_NAMESPACE: ${{ needs.preview-plan.outputs.namespace }}
          PREVIEW_TENANT_ID: "1"
          PREVIEW_EMAIL: demo@example.com
          PREVIEW_PASSWORD: swordfish
        run: |
          echo "PREVIEW_STAGE=bootstrap" >> "$GITHUB_ENV"
          BOOTSTRAP_SCRIPT=/tmp/preview-smoke-bootstrap.py
          cat >"${BOOTSTRAP_SCRIPT}" <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          tenant_id = 1
          game_template_id = 1
          email = "demo@example.com"
          password = "swordfish"

          def readiness_ok(url):
            try:
              with urllib.request.urlopen(url, timeout=10) as response:
                body = response.read().decode("utf-8", errors="ignore")
                return response.status < 500 and "\"status\":\"UP\"" in body.replace(" ", "")
            except OSError:
              return False

          def wait_for_ready(name, url, timeout_seconds=60):
            deadline = time.time() + timeout_seconds
            while time.time() < deadline:
              if readiness_ok(url):
                return
              time.sleep(2)
            raise SystemExit(f"{name} readiness did not report UP at {url}")

          def post_json(url, payload):
            request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
            )
            try:
              with urllib.request.urlopen(request, timeout=30) as response:
                return response.status, response.read().decode("utf-8", errors="ignore")
            except urllib.error.HTTPError as exc:
              return exc.code, exc.read().decode("utf-8", errors="ignore")

          wait_for_ready("account-service", "http://account-service:8080/actuator/health/readiness")
          wait_for_ready("entity-management-service", "http://entity-management-service:8080/actuator/health/readiness")
          wait_for_ready("game-design-service", "http://game-design-service:8080/actuator/health/readiness")
          wait_for_ready("game-logic-service", "http://game-logic-service:8080/actuator/health/readiness")
          wait_for_ready("world-management-service", "http://world-management-service:8080/actuator/health/readiness")
          wait_for_ready("game-session-service", "http://game-session-service:8080/actuator/health/readiness")

          status, account_body = post_json(
            "http://account-service:8080/accounts",
            {
              "tenantId": tenant_id,
              "username": "demo",
              "email": email,
              "password": password,
            },
          )
          print(account_body)
          if status >= 400:
            raise SystemExit(f"Account bootstrap failed with status {status}: {account_body}")
          account_payload = json.loads(account_body or "{}")
          account_id = (((account_payload.get("data") or {}).get("id")))
          if not account_id:
            raise SystemExit(f"Preview smoke account response did not include account id: {account_body}")

          status, session_body = post_json(
            "http://game-session-service:8080/sessions",
            {
              "tenantId": tenant_id,
              "gameTemplateId": game_template_id,
              "controlPlaneRequestId": "preview-smoke-bootstrap",
              "ownerAccountId": account_id,
            },
          )
          print(session_body)
          if status >= 400:
            raise SystemExit(f"Preview smoke session bootstrap failed with status {status}: {session_body}")
          PY
          BOOTSTRAP_POD_LOG=/tmp/preview-bootstrap-pod.log
          trap 'kubectl -n "${PREVIEW_NAMESPACE}" delete pod preview-smoke-bootstrap --ignore-not-found >/dev/null 2>&1 || true; kubectl -n "${PREVIEW_NAMESPACE}" delete configmap preview-smoke-bootstrap-script --ignore-not-found >/dev/null 2>&1 || true' EXIT
          kubectl -n "${PREVIEW_NAMESPACE}" create configmap preview-smoke-bootstrap-script \
            --from-file=bootstrap.py="${BOOTSTRAP_SCRIPT}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "${PREVIEW_NAMESPACE}" delete pod preview-smoke-bootstrap --ignore-not-found >/dev/null 2>&1 || true
          cat <<'EOF' | kubectl -n "${PREVIEW_NAMESPACE}" apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: preview-smoke-bootstrap
          spec:
            restartPolicy: Never
            terminationGracePeriodSeconds: 0
            containers:
              - name: preview-smoke-bootstrap
                image: python:3.12-alpine
                command: ["python", "/tmp/bootstrap.py"]
                volumeMounts:
                  - name: bootstrap-script
                    mountPath: /tmp
            volumes:
              - name: bootstrap-script
                configMap:
                  name: preview-smoke-bootstrap-script
          EOF
          if ! kubectl -n "${PREVIEW_NAMESPACE}" wait --for=condition=Ready pod/preview-smoke-bootstrap --timeout=90s >/dev/null 2>&1; then
            :
          fi
          if ! kubectl -n "${PREVIEW_NAMESPACE}" wait --for=jsonpath='{.status.phase}'=Succeeded pod/preview-smoke-bootstrap --timeout=120s >/dev/null 2>&1; then
            echo "Preview smoke bootstrap pod did not succeed."
            kubectl -n "${PREVIEW_NAMESPACE}" logs preview-smoke-bootstrap || true
            kubectl -n "${PREVIEW_NAMESPACE}" describe pod preview-smoke-bootstrap || true
            exit 1
          fi
          kubectl -n "${PREVIEW_NAMESPACE}" logs preview-smoke-bootstrap | tee "${BOOTSTRAP_POD_LOG}"
          kubectl -n "${PREVIEW_NAMESPACE}" delete pod preview-smoke-bootstrap --ignore-not-found >/dev/null 2>&1 || true
          kubectl -n "${PREVIEW_NAMESPACE}" delete configmap preview-smoke-bootstrap-script --ignore-not-found >/dev/null 2>&1 || true

      - name: Smoke hosted preview over TCP
        if: ${{ steps.deploy-release.outcome == 'success' }}
        env:
          PREVIEW_BASE_URL: https://${{ needs.preview-plan.outputs.hostname }}
          SMOKE_TELNET_HOST: ${{ needs.preview-plan.outputs.hostname }}
          TCP_PORT: ${{ steps.telnet-port.outputs.telnet_port }}
          SMOKE_USERNAME: demo@example.com
          SMOKE_PASSWORD: swordfish
        run: |
          echo "PREVIEW_STAGE=smoke" >> "$GITHUB_ENV"
          set -o pipefail
          SMOKE_TRANSCRIPT=/tmp/preview-hosted-tcp-smoke.log
          if ! bash ./dev-tools/preview/preview-login-look-smoke.sh 2>&1 | tee "${SMOKE_TRANSCRIPT}"; then
            echo "=== Hosted preview TCP smoke transcript ==="
            cat "${SMOKE_TRANSCRIPT}"
            exit 1
          fi

      - name: Summarize preview access
        if: ${{ steps.deploy-release.outcome == 'success' }}
        run: |
          bash ./dev-tools/preview/write-preview-summary.sh \
            success \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}" \
            "${{ steps.effective-image-tag.outputs.image_tag }}" \
            "${{ needs.preview-plan.outputs.hostname }}" \
            "${{ steps.telnet-port.outputs.telnet_port }}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "- Demo login: demo@example.com / swordfish"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish preview summary comment
        if: ${{ always() }}
        uses: actions/github-script@v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.preview-plan.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.preview-plan.outputs.head_sha }}
          PREVIEW_IMAGE_TAG: ${{ steps.effective-image-tag.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.preview-plan.outputs.hostname }}
          PREVIEW_TELNET_PORT: ${{ steps.telnet-port.outputs.telnet_port }}
          PREVIEW_DEPLOY_OUTCOME: ${{ steps.deploy-release.outcome }}
          PREVIEW_FAILURE_STAGE: ${{ env.PREVIEW_STAGE }}
        with:
          script: |
            const { execFileSync } = require("child_process");

            const prNumber = Number(process.env.PREVIEW_PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.info("No PR number available for preview comment publishing.");
              return;
            }

            const mode =
              process.env.PREVIEW_DEPLOY_OUTCOME === "success" ? "success" : "failure";
            const failureStage =
              process.env.PREVIEW_FAILURE_STAGE && process.env.PREVIEW_FAILURE_STAGE.trim().length > 0
                ? process.env.PREVIEW_FAILURE_STAGE.trim()
                : "unknown";

            const args = [
              "./dev-tools/preview/write-preview-summary.sh",
              mode,
              String(prNumber),
              process.env.PREVIEW_HEAD_SHA || "",
              process.env.PREVIEW_IMAGE_TAG || "",
              process.env.PREVIEW_HOSTNAME || "",
              process.env.PREVIEW_TELNET_PORT || "",
            ];
            if (mode === "failure") {
              args.push(failureStage);
            }

            const summaryText = execFileSync("bash", args, { encoding: "utf8" });
            const bodyLines = ["### Preview Summary", "", summaryText.trimEnd()];
            if (mode === "success") {
              bodyLines.push("- Demo login: demo@example.com / swordfish");
            }
            const body = `${bodyLines.join("\n")}\n`;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });

            const existing = comments.find((comment) =>
              comment.body.startsWith("### Preview Summary")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Summarize preview failure
        if: ${{ always() && failure() }}
        run: |
          bash ./dev-tools/preview/write-preview-summary.sh \
            failure \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}" \
            "${{ steps.effective-image-tag.outputs.image_tag }}" \
            "${{ needs.preview-plan.outputs.hostname }}" \
            "${{ steps.telnet-port.outputs.telnet_port }}" \
            "${PREVIEW_STAGE:-unknown}" >> "$GITHUB_STEP_SUMMARY"

  preview-destroy:
    name: Destroy Preview Release
    runs-on:
      - self-hosted
      - preview
    needs: preview-plan
    if: ${{ needs.preview-plan.outputs.eligible == 'true' && needs.preview-plan.outputs.action == 'destroy' }}
    environment: pr-preview
    steps:
      - uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.33.4

      - name: Set up Helm
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.20.1"
            INSTALL_DIR="$HOME/.local/bin"
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
            tar -xzf /tmp/helm.tgz -C /tmp
            install /tmp/linux-amd64/helm "$INSTALL_DIR/helm"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          helm version

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
          PREVIEW_KUBECONFIG_LOCAL_SERVER: https://127.0.0.1:6443
        run: |
          KUBECONFIG_PATH="$(bash ./dev-tools/preview/write-kubeconfig.sh)"
          bash ./dev-tools/preview/persist-runner-kubeconfig.sh "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Delete preview namespace and release
        run: |
          bash ./dev-tools/preview/delete-preview-namespace.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.release_name }}"

      - name: Publish preview destroyed comment
        uses: actions/github-script@v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.preview-plan.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.preview-plan.outputs.head_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.preview-plan.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.preview-plan.outputs.hostname }}
          PREVIEW_TELNET_PORT: "destroyed"
        with:
          script: |
            const prNumber = Number(process.env.PREVIEW_PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.info("No PR number available for preview destroy comment publishing.");
              return;
            }

            const body = [
              "### Preview Summary",
              "⏭️ Preview environment destroyed",
              "",
              `- PR: #${prNumber}`,
              `- Head SHA: \`${process.env.PREVIEW_HEAD_SHA || "unknown"}\``,
              `- Previous host: https://${process.env.PREVIEW_HOSTNAME || "unknown"}`,
              "- TCP: unavailable",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });

            const existing = comments.find((comment) =>
              comment.body.startsWith("### Preview Summary")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              });
            }
