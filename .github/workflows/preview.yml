name: PR Preview Environment

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      action:
        description: Future hosted preview operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy
      pr_number:
        description: Pull request number to target
        required: true
        type: string
      image_tag:
        description: PR image tag to deploy (for example pr-123-deadbeef)
        required: false
        default: ""
        type: string
      head_sha:
        description: PR head SHA to align the preview namespace with
        required: false
        default: ""
        type: string
      preview_domain:
        description: Preview DNS suffix (for example preview.firedevops.net)
        required: false
        default: preview.firedevops.net
        type: string

permissions:
  contents: read
  packages: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-plan:
    name: Preview Plan
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
      action: ${{ steps.derive.outputs.action }}
      pr_number: ${{ steps.derive.outputs.pr_number }}
      namespace: ${{ steps.derive.outputs.namespace }}
      release_name: ${{ steps.derive.outputs.release_name }}
      hostname: ${{ steps.derive.outputs.hostname }}
      image_tag: ${{ steps.derive.outputs.image_tag }}
      head_sha: ${{ steps.derive.outputs.head_sha }}
      base_sha: ${{ steps.derive.outputs.base_sha }}
    steps:
      - name: Resolve preview eligibility
        id: eligibility
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            let prAuthor;
            if (context.eventName === "pull_request") {
              prAuthor = context.payload.pull_request.user.login;
            } else {
              const prNumber = Number("${{ inputs.pr_number }}");
              const { data: pull } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: prNumber,
              });
              prAuthor = pull.user.login;
            }

            const ineligibleAuthors = new Set([
              "app/dependabot",
              "dependabot[bot]",
              "app/renovate",
              "renovate[bot]",
            ]);
            const eligible = !ineligibleAuthors.has(prAuthor);
            core.setOutput("eligible", eligible ? "true" : "false");
            core.info(
              eligible
                ? `Preview target is eligible (author=${prAuthor}).`
                : `Skipping preview orchestration for dependency bot PR (author=${prAuthor}).`
            );

      - name: Derive preview identifiers
        id: derive
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            PREVIEW_DOMAIN="preview.firedevops.net"
            if [ "${{ github.event.action }}" = "closed" ]; then
              ACTION="destroy"
            else
              ACTION="deploy"
            fi
          else
            PR_NUMBER="${{ inputs.pr_number }}"
            HEAD_SHA="${{ inputs.head_sha }}"
            BASE_SHA=""
            PREVIEW_DOMAIN="${{ inputs.preview_domain }}"
            ACTION="${{ inputs.action }}"
            IMAGE_TAG="${{ inputs.image_tag }}"
          fi
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="${GITHUB_SHA}"
          fi
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="${HEAD_SHA}"
          fi
          {
            echo "action=${ACTION}"
            echo "pr_number=${PR_NUMBER}"
            echo "namespace=pr-${PR_NUMBER}"
            echo "release_name=pr-${PR_NUMBER}"
            echo "hostname=pr-${PR_NUMBER}.${PREVIEW_DOMAIN}"
            echo "image_tag=${IMAGE_TAG}"
            echo "head_sha=${HEAD_SHA}"
            echo "base_sha=${BASE_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Explain preview skip
        if: ${{ steps.eligibility.outputs.eligible != 'true' }}
        run: |
          cat <<'EOF'
          Preview orchestration is skipped for dependency bot PRs.

          Dependabot and Renovate updates do not get preview namespace
          preparation, hosted preview reconciliation, or hosted preview
          validation work.
          EOF

      - name: Show derived target
        env:
          PREVIEW_MAX_ACTIVE: ${{ vars.PREVIEW_MAX_ACTIVE }}
        run: |
          cat <<EOF
          event_name=${{ github.event_name }}
          derived_action=${{ steps.derive.outputs.action }}
          pr_number=${{ steps.derive.outputs.pr_number }}
          namespace=${{ steps.derive.outputs.namespace }}
          release_name=${{ steps.derive.outputs.release_name }}
          hostname=${{ steps.derive.outputs.hostname }}
          image_tag=${{ steps.derive.outputs.image_tag }}
          head_sha=${{ steps.derive.outputs.head_sha }}
          preview_max_active=${PREVIEW_MAX_ACTIVE:-1}
          EOF

      - name: Clear previous preview summary comments
        if: ${{ steps.eligibility.outputs.eligible == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ steps.derive.outputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PREVIEW_PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.info("No PR number available for preview summary cleanup.");
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });

            const previewComments = comments.filter((comment) =>
              comment.body.startsWith("### Preview Summary")
            );

            for (const comment of previewComments) {
              await github.rest.issues.deleteComment({
                ...context.repo,
                comment_id: comment.id,
              });
            }

            core.info(
              `Deleted ${previewComments.length} previous preview summary comment(s) for PR #${prNumber}.`
            );

  preview-deploy:
    name: Deploy Preview Release
    runs-on:
      - self-hosted
      - preview
    needs: preview-plan
    if: ${{ needs.preview-plan.outputs.eligible == 'true' && needs.preview-plan.outputs.action == 'deploy' }}
    environment: pr-preview
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.33.4

      - name: Set up Helm
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.20.1"
            INSTALL_DIR="$HOME/.local/bin"
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
            tar -xzf /tmp/helm.tgz -C /tmp
            install /tmp/linux-amd64/helm "$INSTALL_DIR/helm"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          helm version

      - name: Set up GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            GH_VERSION="2.76.2"
            INSTALL_DIR="$HOME/.local/bin"
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o /tmp/gh.tgz
            tar -xzf /tmp/gh.tgz -C /tmp
            install "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" "$INSTALL_DIR/gh"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          gh --version

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
          PREVIEW_KUBECONFIG_LOCAL_SERVER: https://127.0.0.1:6443
        run: |
          KUBECONFIG_PATH="$(bash ./dev-tools/hosted/shared/write-kubeconfig.sh)"
          bash ./dev-tools/hosted/shared/persist-runner-kubeconfig.sh "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Verify preview cluster access
        id: preview-access
        run: |
          set +e
          kubectl get namespace kube-system >/dev/null
          namespace_status=$?
          kubectl auth can-i get clusterissuers.cert-manager.io --all-namespaces >/dev/null
          cluster_issuer_status=$?
          kubectl auth can-i list namespaces --all-namespaces >/dev/null
          namespace_list_status=$?
          set -e

          if [ "$namespace_status" -eq 0 ] && [ "$cluster_issuer_status" -eq 0 ] && [ "$namespace_list_status" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Preview cluster access unavailable; skipping hosted preview deploy for this run."
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_STAGE=cluster-access" >> "$GITHUB_ENV"

      - name: Prune stale preview namespaces
        if: ${{ steps.preview-access.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./dev-tools/hosted/preview/prune-stale-preview-namespaces.sh --apply

      - name: Enforce preview capacity
        if: ${{ steps.preview-access.outputs.available == 'true' }}
        id: preview-capacity
        continue-on-error: true
        env:
          PREVIEW_MAX_ACTIVE: ${{ vars.PREVIEW_MAX_ACTIVE }}
        run: |
          echo "PREVIEW_STAGE=capacity" >> "$GITHUB_ENV"
          bash ./dev-tools/hosted/preview/check-preview-capacity.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${PREVIEW_MAX_ACTIVE:-1}"

      - name: Reset preview namespace for clean deploy
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        run: |
          bash ./dev-tools/hosted/shared/delete-hosted-namespace.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.release_name }}"

      - name: Ensure preview namespace exists
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        run: |
          bash ./dev-tools/hosted/preview/ensure-preview-namespace.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.pr_number }}"

      - name: Allocate preview telnet port
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        id: telnet-port
        run: |
          TELNET_PORT="$(bash ./dev-tools/hosted/preview/allocate-preview-telnet-port.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.pr_number }}")"
          echo "telnet_port=${TELNET_PORT}" >> "$GITHUB_OUTPUT"

      - name: Ensure GHCR pull secret exists
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        env:
          PREVIEW_GHCR_USERNAME: ${{ secrets.PREVIEW_GHCR_USERNAME }}
          PREVIEW_GHCR_TOKEN: ${{ secrets.PREVIEW_GHCR_TOKEN }}
        run: |
          bash ./dev-tools/hosted/shared/ensure-ghcr-pull-secret.sh "${{ needs.preview-plan.outputs.namespace }}"

      - name: Resolve exact preview image tag
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        id: effective-image-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EFFECTIVE_IMAGE_TAG="$(bash ./dev-tools/hosted/preview/resolve-preview-image-tag.sh \
            "${{ needs.preview-plan.outputs.image_tag }}" \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.base_sha }}")"
          echo "image_tag=${EFFECTIVE_IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Cancel if preview target was superseded before image wait
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! bash ./dev-tools/hosted/preview/check-preview-head-current.sh \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}"; then
            status=$?
            if [ "$status" -eq 10 ]; then
              echo "Cancelling stale preview run before image wait."
              gh run cancel "${GITHUB_RUN_ID}"
              sleep 5
              exit 0
            fi
            exit "$status"
          fi

      - name: Wait for preview runtime images
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "PREVIEW_STAGE=wait-for-images" >> "$GITHUB_ENV"
          bash ./dev-tools/hosted/shared/wait-for-runtime-images.sh "${{ steps.effective-image-tag.outputs.image_tag }}"

      - name: Ensure preview gRPC TLS secret exists
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        run: |
          bash ./dev-tools/hosted/shared/ensure-grpc-tls-secret.sh "${{ needs.preview-plan.outputs.namespace }}"

      - name: Show namespace state
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        run: |
          kubectl get namespace "${{ needs.preview-plan.outputs.namespace }}"
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get secret ghcr-preview-pull
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get secret firemud-grpc-tls

      - name: Render preview values
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        run: |
          python3 ./dev-tools/hosted/preview/render-preview-values.py \
            k8s/helm/firemud/values-preview.example.yaml \
            /tmp/preview-values.yaml \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.release_name }}" \
            "${{ needs.preview-plan.outputs.hostname }}" \
            "${{ steps.effective-image-tag.outputs.image_tag }}" \
            "${{ steps.telnet-port.outputs.telnet_port }}"

      - name: Validate preview chart render
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        run: |
          helm template "${{ needs.preview-plan.outputs.release_name }}" k8s/helm/firemud \
            -f /tmp/preview-values.yaml \
            --namespace "${{ needs.preview-plan.outputs.namespace }}" \
            >/tmp/preview-rendered.yaml
          kubectl apply --dry-run=server -n "${{ needs.preview-plan.outputs.namespace }}" -f /tmp/preview-rendered.yaml
          wc -l /tmp/preview-rendered.yaml

      - name: Upload rendered preview artifacts
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-render-${{ needs.preview-plan.outputs.release_name }}
          path: |
            /tmp/preview-values.yaml
            /tmp/preview-rendered.yaml

      - name: Record reconciled preview target
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        run: |
          bash ./dev-tools/hosted/preview/annotate-preview-namespace.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}" \
            "${{ steps.effective-image-tag.outputs.image_tag }}" \
            "${{ steps.telnet-port.outputs.telnet_port }}"

      - name: Summarize preview target
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        run: |
          bash ./dev-tools/hosted/preview/write-preview-summary.sh \
            target \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}" \
            "${{ steps.effective-image-tag.outputs.image_tag }}" \
            "${{ needs.preview-plan.outputs.hostname }}" \
            "${{ steps.telnet-port.outputs.telnet_port }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cancel if preview target was superseded before deploy
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! bash ./dev-tools/hosted/preview/check-preview-head-current.sh \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}"; then
            status=$?
            if [ "$status" -eq 10 ]; then
              echo "Cancelling stale preview run before deploy."
              gh run cancel "${GITHUB_RUN_ID}"
              sleep 5
              exit 0
            fi
            exit "$status"
          fi

      - name: Deploy preview release
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        id: deploy-release
        continue-on-error: true
        run: |
          echo "PREVIEW_STAGE=deploy" >> "$GITHUB_ENV"
          helm upgrade --install "${{ needs.preview-plan.outputs.release_name }}" k8s/helm/firemud \
            -f /tmp/preview-values.yaml \
            --namespace "${{ needs.preview-plan.outputs.namespace }}" \
            --wait \
            --timeout 15m

      - name: Show deployed preview services
        if: ${{ always() && steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        run: |
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get pods,svc,ingress

      - name: Show preview rollout diagnostics
        if: ${{ always() && steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' && steps.deploy-release.outcome == 'failure' }}
        run: |
          echo "=== pods ==="
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get pods -o wide || true
          echo
          echo "=== events ==="
          kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get events --sort-by=.lastTimestamp | tail -n 120 || true
          echo
          echo "=== pod describe ==="
          for pod in $(kubectl -n "${{ needs.preview-plan.outputs.namespace }}" get pods --no-headers | awk '$2 != $3 || $3 != "Running" {print $1}'); do
            echo "--- ${pod} ---"
            kubectl -n "${{ needs.preview-plan.outputs.namespace }}" describe pod "${pod}" || true
            echo
          done
          echo "=== recent logs ==="
          for deployment in account-service automation-scripting-service entity-management-service game-design-service game-logic-service game-session-service logging-admin-service social-groups-service spring-cloud-gateway tcp-proxy-service world-management-service; do
            echo "--- ${deployment} ---"
            kubectl -n "${{ needs.preview-plan.outputs.namespace }}" logs "deploy/${deployment}" --tail=120 || true
            echo
          done

      - name: Fail if preview rollout did not complete
        if: ${{ always() && steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' && steps.deploy-release.outcome == 'failure' }}
        run: |
          echo "Preview rollout failed during helm upgrade/install."
          exit 1

      - name: Wait for seeded preview login prerequisites
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' && steps.deploy-release.outcome == 'success' }}
        env:
          PREVIEW_NAMESPACE: ${{ needs.preview-plan.outputs.namespace }}
        run: |
          echo "PREVIEW_STAGE=bootstrap" >> "$GITHUB_ENV"
          for deployment in \
            account-service \
            entity-management-service \
            game-design-service \
            game-logic-service \
            world-management-service \
            game-session-service \
            spring-cloud-gateway
          do
            echo "Waiting for deployment/${deployment} in ${PREVIEW_NAMESPACE}"
            kubectl -n "${PREVIEW_NAMESPACE}" rollout status "deployment/${deployment}" --timeout=120s
          done

      - name: Smoke hosted preview over TCP
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' && steps.deploy-release.outcome == 'success' }}
        env:
          PREVIEW_BASE_URL: https://${{ needs.preview-plan.outputs.hostname }}
          SMOKE_TELNET_HOST: ${{ needs.preview-plan.outputs.hostname }}
          TCP_PORT: ${{ steps.telnet-port.outputs.telnet_port }}
          SMOKE_USERNAME: demo@example.com
          SMOKE_PASSWORD: swordfish
        run: |
          echo "PREVIEW_STAGE=smoke" >> "$GITHUB_ENV"
          set -o pipefail
          SMOKE_TRANSCRIPT=/tmp/preview-hosted-tcp-smoke.log
          if ! bash ./dev-tools/hosted/shared/hosted-login-look-smoke.sh 2>&1 | tee "${SMOKE_TRANSCRIPT}"; then
            echo "=== Hosted preview TCP smoke transcript ==="
            cat "${SMOKE_TRANSCRIPT}"
            exit 1
          fi

      - name: Summarize preview access
        if: ${{ steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' && steps.deploy-release.outcome == 'success' }}
        run: |
          bash ./dev-tools/hosted/preview/write-preview-summary.sh \
            success \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}" \
            "${{ steps.effective-image-tag.outputs.image_tag }}" \
            "${{ needs.preview-plan.outputs.hostname }}" \
            "${{ steps.telnet-port.outputs.telnet_port }}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "- Demo login: demo@example.com / swordfish"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize preview unavailability
        if: ${{ steps.preview-access.outputs.available != 'true' || steps.preview-capacity.outcome == 'failure' }}
        run: |
          bash ./dev-tools/hosted/preview/write-preview-summary.sh \
            unavailable \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}" \
            "${{ steps.effective-image-tag.outputs.image_tag || needs.preview-plan.outputs.image_tag }}" \
            "${{ needs.preview-plan.outputs.hostname }}" \
            "unavailable" \
            "${{ steps.preview-access.outputs.available != 'true' && 'cluster-access' || 'capacity' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish preview summary comment
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.preview-plan.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.preview-plan.outputs.head_sha }}
          PREVIEW_IMAGE_TAG: ${{ steps.effective-image-tag.outputs.image_tag || needs.preview-plan.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.preview-plan.outputs.hostname }}
          PREVIEW_TELNET_PORT: ${{ steps.telnet-port.outputs.telnet_port || 'unavailable' }}
          PREVIEW_DEPLOY_OUTCOME: ${{ steps.deploy-release.outcome }}
          PREVIEW_JOB_STATUS: ${{ job.status }}
          PREVIEW_FAILURE_STAGE: ${{ env.PREVIEW_STAGE }}
          PREVIEW_CLUSTER_AVAILABLE: ${{ steps.preview-access.outputs.available }}
          PREVIEW_CAPACITY_OUTCOME: ${{ steps.preview-capacity.outcome || 'skipped' }}
        with:
          script: |
            const { execFileSync } = require("child_process");

            const prNumber = Number(process.env.PREVIEW_PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.info("No PR number available for preview comment publishing.");
              return;
            }

            const clusterAvailable = process.env.PREVIEW_CLUSTER_AVAILABLE === "true";
            const capacityAvailable = process.env.PREVIEW_CAPACITY_OUTCOME !== "failure";
            const mode = !clusterAvailable || !capacityAvailable
              ? "unavailable"
              : process.env.PREVIEW_JOB_STATUS === "success"
                ? "success"
                : "failure";
            const failureStage =
              process.env.PREVIEW_FAILURE_STAGE && process.env.PREVIEW_FAILURE_STAGE.trim().length > 0
                ? process.env.PREVIEW_FAILURE_STAGE.trim()
                : "unknown";

            const args = [
              "./dev-tools/hosted/preview/write-preview-summary.sh",
              mode,
              String(prNumber),
              process.env.PREVIEW_HEAD_SHA || "",
              process.env.PREVIEW_IMAGE_TAG || "",
              process.env.PREVIEW_HOSTNAME || "",
              process.env.PREVIEW_TELNET_PORT || "",
            ];
            if (mode === "failure" || mode === "unavailable") {
              args.push(failureStage);
            }

            const summaryText = execFileSync("bash", args, { encoding: "utf8" });
            const bodyLines = ["### Preview Summary", "", summaryText.trimEnd()];
            if (mode === "success") {
              bodyLines.push("- Demo login: demo@example.com / swordfish");
            }
            const body = `${bodyLines.join("\n")}\n`;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });

            const previewComments = comments.filter((comment) =>
              comment.body.startsWith("### Preview Summary")
            );
            const existing = previewComments[0];

            if (previewComments.length > 1) {
              for (const comment of previewComments.slice(1)) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                });
              }
            }

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Summarize preview failure
        if: ${{ always() && failure() && steps.preview-access.outputs.available == 'true' && steps.preview-capacity.outcome == 'success' }}
        run: |
          bash ./dev-tools/hosted/preview/write-preview-summary.sh \
            failure \
            "${{ needs.preview-plan.outputs.pr_number }}" \
            "${{ needs.preview-plan.outputs.head_sha }}" \
            "${{ steps.effective-image-tag.outputs.image_tag }}" \
            "${{ needs.preview-plan.outputs.hostname }}" \
            "${{ steps.telnet-port.outputs.telnet_port }}" \
            "${PREVIEW_STAGE:-unknown}" >> "$GITHUB_STEP_SUMMARY"

  preview-destroy:
    name: Destroy Preview Release
    runs-on:
      - self-hosted
      - preview
    needs: preview-plan
    if: ${{ needs.preview-plan.outputs.eligible == 'true' && needs.preview-plan.outputs.action == 'destroy' }}
    environment: pr-preview
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.33.4

      - name: Set up Helm
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.20.1"
            INSTALL_DIR="$HOME/.local/bin"
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
            tar -xzf /tmp/helm.tgz -C /tmp
            install /tmp/linux-amd64/helm "$INSTALL_DIR/helm"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          helm version

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
          PREVIEW_KUBECONFIG_LOCAL_SERVER: https://127.0.0.1:6443
        run: |
          KUBECONFIG_PATH="$(bash ./dev-tools/hosted/shared/write-kubeconfig.sh)"
          bash ./dev-tools/hosted/shared/persist-runner-kubeconfig.sh "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Delete preview namespace and release
        run: |
          bash ./dev-tools/hosted/shared/delete-hosted-namespace.sh \
            "${{ needs.preview-plan.outputs.namespace }}" \
            "${{ needs.preview-plan.outputs.release_name }}"

      - name: Publish preview destroyed comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.preview-plan.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.preview-plan.outputs.head_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.preview-plan.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.preview-plan.outputs.hostname }}
          PREVIEW_TELNET_PORT: "destroyed"
        with:
          script: |
            const prNumber = Number(process.env.PREVIEW_PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.info("No PR number available for preview destroy comment publishing.");
              return;
            }

            const body = [
              "### Preview Summary",
              "⏭️ Preview environment destroyed",
              "",
              `- PR: #${prNumber}`,
              `- Head SHA: \`${process.env.PREVIEW_HEAD_SHA || "unknown"}\``,
              `- Previous host: https://${process.env.PREVIEW_HOSTNAME || "unknown"}`,
              "- TCP: unavailable",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });

            const previewComments = comments.filter((comment) =>
              comment.body.startsWith("### Preview Summary")
            );
            const existing = previewComments[0];

            if (previewComments.length > 1) {
              for (const comment of previewComments.slice(1)) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                });
              }
            }

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              });
            }
