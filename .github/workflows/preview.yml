name: PR Preview Environment

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'design/**'
      - 'dev-tools/docs/**'
      - 'dev-tools/validation/**/*.py'
    types: [opened, synchronize, reopened, labeled, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  preview-plan:
    name: Preview Render Plan
    if: ${{ github.event.action != 'closed' && (github.event.action != 'labeled' || github.event.label.name == 'preview:priority') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    concurrency:
      group: preview-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
      reason: ${{ steps.eligibility.outputs.reason }}
      pr_number: ${{ steps.target.outputs.pr_number }}
      base_sha: ${{ steps.target.outputs.base_sha }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      merge_sha: ${{ steps.target.outputs.merge_sha }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      namespace: ${{ steps.target.outputs.namespace }}
      hostname: ${{ steps.target.outputs.hostname }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout PR merge for render only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Derive immutable preview target
        id: target
        run: |
          set -euo pipefail
          PR_NUMBER='${{ github.event.pull_request.number }}'
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          MERGE_SHA='${{ github.event.pull_request.merge_commit_sha || github.sha }}'
          {
            echo "pr_number=${PR_NUMBER}"
            echo "base_sha=${BASE_SHA}"
            echo "head_sha=${HEAD_SHA}"
            echo "merge_sha=${MERGE_SHA}"
            echo "image_tag=${HEAD_SHA}"
            echo "namespace=pr-${PR_NUMBER}"
            echo "hostname=pr-${PR_NUMBER}.preview.firedevops.net"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve preview eligibility
        id: eligibility
        env:
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 ./dev-tools/hosted/preview/preview-eligibility.py \
            --operation deploy \
            --state "$PR_STATE" \
            --base-ref "$PR_BASE_REF" \
            --author "$PR_AUTHOR" >> "$GITHUB_OUTPUT"

  preview-deploy:
    name: Render Sanitized Preview Artifact
    needs: preview-plan
    if: ${{ needs.preview-plan.outputs.eligible == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: preview-allocation-lifecycle
      cancel-in-progress: false
      queue: max
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout PR merge for untrusted render
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preview-plan.outputs.merge_sha }}
          persist-credentials: false

      - name: Set up Helm
        run: |
          set -euo pipefail
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION='v3.20.1'
            INSTALL_DIR="$RUNNER_TEMP/bin"
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "$RUNNER_TEMP/helm.tgz"
            tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP"
            install "$RUNNER_TEMP/linux-amd64/helm" "$INSTALL_DIR/helm"
            echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          fi
          helm version

      - name: Install render validator dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Render chart without hosted credentials
        env:
          PR_NUMBER: ${{ needs.preview-plan.outputs.pr_number }}
          NAMESPACE: ${{ needs.preview-plan.outputs.namespace }}
          RELEASE_NAME: ${{ needs.preview-plan.outputs.namespace }}
          HOSTNAME: ${{ needs.preview-plan.outputs.hostname }}
          IMAGE_TAG: ${{ needs.preview-plan.outputs.image_tag }}
        run: |
          set -euo pipefail
          umask 077
          values="$RUNNER_TEMP/preview-values.yaml"
          rendered="$RUNNER_TEMP/preview-rendered.yaml"
          sanitized="$RUNNER_TEMP/preview-rendered-sanitized.yaml"
          metadata="$RUNNER_TEMP/preview-metadata.json"
          python3 ./dev-tools/hosted/preview/render-preview-values.py \
            k8s/helm/firemud/values-hosted-shared.example.yaml \
            "$values" "$PR_NUMBER" "$NAMESPACE" "$RELEASE_NAME" "$HOSTNAME" "$IMAGE_TAG" 0
          helm template "$RELEASE_NAME" k8s/helm/firemud \
            -f "$values" --namespace "$NAMESPACE" > "$rendered"
          python3 ./dev-tools/hosted/preview/validate-preview-artifact.py \
            sanitize "$rendered" "$sanitized"
          manifest_sha256="$(sha256sum "$sanitized" | awk '{print $1}')"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceWorkflow '.github/workflows/preview.yml' \
            --argjson sourceRunId "$GITHUB_RUN_ID" \
            --argjson prNumber "$PR_NUMBER" \
            --arg baseSha '${{ needs.preview-plan.outputs.base_sha }}' \
            --arg headSha '${{ needs.preview-plan.outputs.head_sha }}' \
            --arg mergeSha '${{ needs.preview-plan.outputs.merge_sha }}' \
            --arg hostname "$HOSTNAME" \
            --arg imageTag "$IMAGE_TAG" \
            --arg manifestSha256 "$manifest_sha256" \
            '{schemaVersion:1,event:"pull_request",repository:$repository,sourceWorkflow:$sourceWorkflow,sourceRunId:$sourceRunId,prNumber:$prNumber,baseSha:$baseSha,headSha:$headSha,mergeSha:$mergeSha,hostname:$hostname,imageTag:$imageTag,manifestSha256:$manifestSha256}' > "$metadata"
          {
            echo '### Sanitized PR preview artifact'
            echo
            echo "- PR: #${PR_NUMBER}"
            echo "- Head SHA: \`${IMAGE_TAG}\`"
            echo "- Artifact contains no cluster, runtime, identity, or repository write credential."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized render artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-render-pr-${{ needs.preview-plan.outputs.pr_number }}-${{ needs.preview-plan.outputs.head_sha }}
          path: |
            ${{ runner.temp }}/preview-rendered-sanitized.yaml
            ${{ runner.temp }}/preview-metadata.json
          if-no-files-found: error
          retention-days: 1

  preview-destroy:
    name: Hand Closed Preview To Trusted Cleanup
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    concurrency:
      group: preview-allocation-lifecycle
      cancel-in-progress: false
      queue: max
    steps:
      - name: Record trusted cleanup handoff
        run: echo 'Closed preview cleanup is performed by Trusted Hosted Identity Request.'

  # Lifecycle mutation is deliberately absent from this PR-controlled
  # workflow. The trusted default-branch consumer owns preview-deploy and
  # preview-destroy, validates this artifact, and then uses scoped credentials.
