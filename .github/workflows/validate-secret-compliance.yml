name: Secret Compliance Checks

on:
  workflow_call:
    inputs:
      enforcement_mode:
        description: "Validation mode: strict fails hard-gated stale/missing production records; advisory downgrades all findings to warnings."
        required: false
        default: strict
        type: string
      warning_window_days:
        description: "Emit a warning this many days before maxAgeDays is exceeded."
        required: false
        default: 7
        type: number
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-secret-compliance:
    name: Secret Compliance Validation
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install validator dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Validate secret compliance records
        env:
          SECRET_COMPLIANCE_ENFORCEMENT_MODE: ${{ inputs.enforcement_mode }}
          SECRET_COMPLIANCE_WARNING_WINDOW_DAYS: ${{ inputs.warning_window_days }}
        run: python3 dev-tools/validation/validate-secret-compliance.py
