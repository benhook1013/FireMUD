name: Secret Compliance Checks

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate-secret-compliance:
    name: Secret Compliance Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install validator dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Validate secret compliance records
        run: |
          python3 - << 'PY'
          import datetime as dt
          import pathlib
          import sys
          import yaml

          REQUIRED = {
              "jwt-signing-keys-jwks",
              "postgres-application-credentials",
              "backup-object-store-credentials",
              "operator-credentials",
          }
          ENV_FILES = {
              "production": pathlib.Path("design/operations/secret-compliance/production.yaml"),
              "staging": pathlib.Path("design/operations/secret-compliance/staging.yaml"),
              "hobby-self-hosted": pathlib.Path("design/operations/secret-compliance/hobby-self-hosted.yaml"),
          }

          today = dt.datetime.now(dt.timezone.utc)
          staging_hard_gate_date = dt.datetime(2026, 7, 1, tzinfo=dt.timezone.utc)

          def hard_gated(env: str) -> bool:
              if env == "production":
                  return True
              if env == "staging":
                  return today >= staging_hard_gate_date
              return False

          failures = []
          warnings = []

          for env, path in ENV_FILES.items():
              if not path.exists():
                  msg = f"{env}: missing compliance file at {path}"
                  if hard_gated(env):
                      failures.append(msg)
                  else:
                      warnings.append(msg)
                  continue

              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  msg = f"{env}: cannot parse {path} as YAML: {exc}"
                  if hard_gated(env):
                      failures.append(msg)
                  else:
                      warnings.append(msg)
                  continue

              classes = data.get("credentialClasses", {})
              missing = sorted(REQUIRED - set(classes.keys()))
              if missing:
                  msg = f"{env}: missing required credential classes: {', '.join(missing)}"
                  if hard_gated(env):
                      failures.append(msg)
                  else:
                      warnings.append(msg)

              for cls in sorted(REQUIRED & set(classes.keys())):
                  rec = classes.get(cls, {})
                  max_age = rec.get("maxAgeDays")
                  last_rotation = rec.get("lastRotationAt")
                  evidence_ref = rec.get("evidenceRef")
                  evidence_key = rec.get("evidenceKey")
                  if max_age is None or not last_rotation:
                      msg = f"{env}:{cls}: missing maxAgeDays/lastRotationAt"
                      if hard_gated(env):
                          failures.append(msg)
                      else:
                          warnings.append(msg)
                      continue
                  try:
                      rotated_at = dt.datetime.fromisoformat(last_rotation.replace("Z", "+00:00"))
                      age_days = (today - rotated_at).days
                  except Exception as exc:
                      msg = f"{env}:{cls}: invalid lastRotationAt '{last_rotation}': {exc}"
                      if hard_gated(env):
                          failures.append(msg)
                      else:
                          warnings.append(msg)
                      continue

                  if age_days > int(max_age):
                      msg = f"{env}:{cls}: stale credential age {age_days}d exceeds maxAgeDays={max_age}"
                      if hard_gated(env):
                          failures.append(msg)
                      else:
                          warnings.append(msg)

                  if not evidence_ref or not evidence_key:
                      msg = f"{env}:{cls}: missing evidenceRef/evidenceKey"
                      if hard_gated(env):
                          failures.append(msg)
                      else:
                          warnings.append(msg)
                      continue

                  evidence_path = pathlib.Path(evidence_ref)
                  if not evidence_path.exists():
                      msg = f"{env}:{cls}: evidence file not found: {evidence_ref}"
                      if hard_gated(env):
                          failures.append(msg)
                      else:
                          warnings.append(msg)
                      continue

                  try:
                      evidence = yaml.safe_load(evidence_path.read_text(encoding="utf-8"))
                  except Exception as exc:
                      msg = f"{env}:{cls}: evidence file unreadable: {exc}"
                      if hard_gated(env):
                          failures.append(msg)
                      else:
                          warnings.append(msg)
                      continue

                  records = (evidence or {}).get("records", {})
                  record = records.get(evidence_key)
                  if not record:
                      msg = f"{env}:{cls}: missing evidence record key '{evidence_key}' in {evidence_ref}"
                      if hard_gated(env):
                          failures.append(msg)
                      else:
                          warnings.append(msg)
                      continue

                  immutable_id = str(record.get("immutableArtifactId", ""))
                  if not immutable_id or "sha256:" not in immutable_id:
                      msg = f"{env}:{cls}: immutableArtifactId is missing or non-immutable in {evidence_ref}"
                      if hard_gated(env):
                          failures.append(msg)
                      else:
                          warnings.append(msg)

          for msg in warnings:
              print(f"::warning::{msg}")
          for msg in failures:
              print(f"::error::{msg}")

          if failures:
              print("Secret compliance validation failed")
              sys.exit(1)

          print("Secret compliance validation passed")
          PY
