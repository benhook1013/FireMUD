name: PR LOC Report

# Refreshes the generated LOC section in a same-repository PR body after
# "CI — Validation" finishes, so it never runs alongside that PR's CI and never
# appears as a check on the PR head. It runs the trusted default-branch copy of
# the script. The target PR, base, and head come from the CI run's canonical
# title, as in Validation Summary, and are rechecked before the edit. Body edits
# made with GITHUB_TOKEN start no other workflow runs. The edit is skipped while
# a CodeRabbit review is in progress. GitHub's body update has no atomic
# precondition, so the edit is best effort. The section is informational.
on:
  workflow_run:
    workflows: ['CI — Validation']
    types: [completed]

permissions:
  contents: read

# One group per source CI run, so callbacks for different runs (including
# metadata-only ones) never cancel each other. A rerun attempt of the same run
# shares its group and may replace a still-pending callback for that run.
# The script's final recheck orders edits.
concurrency:
  group: pr-loc-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  update-loc-report:
    name: Update PR LOC Report
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # Reads the source CI run's jobs to skip metadata-only runs.
      statuses: read
      checks: read
      pull-requests: write # Rewrites only the marked LOC section of the PR body.
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      CI_TITLE: ${{ github.event.workflow_run.display_title }}
      CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_PATH: ${{ github.event.workflow_run.path }}
      CI_PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: ⬇️ Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: Set up canonical GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Decide whether to update
        id: target
        run: |
          set -euo pipefail
          skip() { echo "Skipping: $1"; echo "update=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # Same canonical identity Validation Summary uses: PR number, base, and head from the run title.
          title_re='^CI — Validation pr-([1-9][0-9]*) base-([0-9a-f]{40}) head-([0-9a-f]{40})$'
          [[ "$CI_TITLE" =~ $title_re ]] || skip "CI run has no canonical PR identity"
          number="${BASH_REMATCH[1]}"; base="${BASH_REMATCH[2]}"; head="${BASH_REMATCH[3]}"
          [[ "$head" == "$CI_HEAD_SHA" ]] || skip "CI run title and head disagree"
          [[ "$CI_PATH" == .github/workflows/ci.yml || "$CI_PATH" == .github/workflows/ci.yml@?* ]] || skip "source run is not ci.yml"
          # GitHub's native association may be empty; when present it must name this exact PR, base, and head.
          [[ "$(jq --argjson n "$number" --arg b "$base" --arg h "$head" \
            'type == "array" and (length == 0 or (length == 1 and .[0].number == $n and .[0].base.sha == $b and .[0].head.sha == $h))' \
            <<<"$CI_PULL_REQUESTS")" == true ]] || skip "CI run's native PR association does not match its title"
          # Edit-only (metadata) CI runs skip change detection; they have nothing new to count.
          detector="$(gh api --paginate "repos/${REPOSITORY}/actions/runs/${CI_RUN_ID}/attempts/${CI_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "Detect CI-Relevant Changes") | .conclusion' | jq -R . | jq -s .)"
          [[ "$(jq 'length' <<<"$detector")" == 1 ]] || skip "CI run has no single change-detection job"
          [[ "$(jq -r '.[0]' <<<"$detector")" != "skipped" ]] || skip "metadata-only CI run"
          pr="$(gh api "repos/${REPOSITORY}/pulls/${number}" \
            --jq '{state, head: .head.sha, base: .base.sha, base_ref: .base.ref, head_repo: .head.repo.full_name, base_repo: .base.repo.full_name, author: .user.login, body: (.body // "")}')"
          [[ "$(jq -r '.state' <<<"$pr")" == open ]] || skip "PR #${number} is not open"
          [[ "$(jq -r '.head_repo' <<<"$pr")" == "$REPOSITORY" && "$(jq -r '.base_repo' <<<"$pr")" == "$REPOSITORY" ]] \
            || skip "PR #${number} is not a same-repository PR"
          [[ "$(jq -r '.head' <<<"$pr")" == "$head" && "$(jq -r '.base' <<<"$pr")" == "$base" ]] \
            || skip "PR #${number} head or base moved past this CI run; the section stays stale until PR CI runs for the current base and head"
          [[ "$(jq -r '.author' <<<"$pr")" != "renovate[bot]" ]] || skip "Renovate PR #${number}"
          # Skip when a complete marked section already counts this exact head and base.
          body="$(jq -r '.body' <<<"$pr" | tr -d '\r')"
          # Read metadata only from inside the first complete start/end marker pair.
          recorded="$(awk '$0 == "<!-- firemud:cloc-report:start -->" && !done { inside = 1; next }
            inside && $0 == "<!-- firemud:cloc-report:end -->" { done = 1; inside = 0; next }
            inside && sub(/^<!-- firemud:cloc-report:metadata /, "") && sub(/ -->$/, "") && !found { found = 1; meta = $0 }
            inside && $0 == "### FireMUD LOC impact" { table = 1 }
            END { if (done && found && table) print meta }' <<<"$body")"
          if [[ -n "$recorded" ]] \
            && [[ "$(jq -r '.head_oid // ""' <<<"$recorded" 2>/dev/null || true)" == "$head" ]] \
            && [[ "$(jq -r '.base_oid // ""' <<<"$recorded" 2>/dev/null || true)" == "$base" ]]; then
            skip "PR #${number} LOC section already matches this head and base"
          fi
          {
            echo "number=${number}"
            echo "base=${base}"
            echo "base_ref=$(jq -r '.base_ref' <<<"$pr")"
            echo "head=${head}"
            echo "update=true"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch full history
        if: ${{ steps.target.outputs.update == 'true' }}
        run: git -c core.hooksPath=/dev/null fetch --no-tags --unshallow origin

      - name: 🐍 Set Up Python
        if: ${{ steps.target.outputs.update == 'true' }}
        uses: ./.github/actions/setup-python

      - name: 📦 Install cloc
        if: ${{ steps.target.outputs.update == 'true' }}
        env:
          CLOC_VERSION: ${{ steps.workflow-tool-versions.outputs.cloc-version }}
          CLOC_SHA256: ${{ steps.workflow-tool-versions.outputs.cloc-source-sha256 }}
        run: |
          set -euo pipefail
          archive="cloc-${CLOC_VERSION}.pl"
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/AlDanial/cloc/releases/download/v${CLOC_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${CLOC_SHA256}  /tmp/${archive}" | sha256sum --check --status
          sudo install -m 0755 "/tmp/${archive}" /usr/local/bin/cloc
          cloc --version

      - name: Update LOC section in PR body
        if: ${{ steps.target.outputs.update == 'true' }}
        env:
          PR_NUMBER: ${{ steps.target.outputs.number }}
          PR_BASE: ${{ steps.target.outputs.base }}
          PR_HEAD: ${{ steps.target.outputs.head }}
          PR_BASE_REF: ${{ steps.target.outputs.base_ref }}
        run: |
          set -euo pipefail
          # The script rechecks the PR's head, base, body, and CodeRabbit activity
          # (status, check run, and "review in progress" comment) just before the edit.
          if python3 dev-tools/maintenance/cloc-report.py pr "${PR_NUMBER}" --update-pr \
            --expect-head "${PR_HEAD}" --expect-base "${PR_BASE}" --skip-while-hosted-review; then
            exit 0
          fi
          # The script refuses to write when the PR moved underneath it; treat that as a skip.
          current="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.state, .head.sha, .base.sha, .base.ref] | join(" ")')"
          if [[ "$current" != "open ${PR_HEAD} ${PR_BASE} ${PR_BASE_REF}" ]]; then
            echo "Skipping: PR #${PR_NUMBER} moved or was retargeted during the update; the section stays stale until PR CI runs for the current base and head."
            exit 0
          fi
          exit 1
