name: Dev Demo Reconciler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: dev-demo-reconciler-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  reconcile-dev-demo:
    name: Reconcile Develop Dev Demo
    timeout-minutes: 9
    runs-on:
      - self-hosted
      - preview
    environment: dev-demo-cluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.33.4

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
          PREVIEW_KUBECONFIG_LOCAL_SERVER: https://127.0.0.1:6443
        run: |
          KUBECONFIG_PATH="$(bash ./dev-tools/hosted/shared/write-kubeconfig.sh)"
          bash ./dev-tools/hosted/shared/persist-runner-kubeconfig.sh "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Verify cluster access
        run: |
          kubectl get namespace kube-system >/dev/null
          kubectl auth can-i list namespaces --all-namespaces

      - name: Ensure GitHub CLI is available
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          GH_VERSION="2.76.2"
          INSTALL_DIR="$HOME/.local/bin"
          mkdir -p "$INSTALL_DIR"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o /tmp/gh.tgz
          tar -xzf /tmp/gh.tgz -C /tmp
          install "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" "$INSTALL_DIR/gh"
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          gh --version

      - name: Dispatch dev-demo deploy when stale or missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./dev-tools/hosted/dev-demo/reconcile-dev-demo.sh
