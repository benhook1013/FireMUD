name: Dev Demo Reconciler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: dev-demo-reconciler-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  reconcile-dev-demo:
    name: Reconcile Develop Dev Demo
    timeout-minutes: 9
    runs-on:
      - self-hosted
      - preview
    environment: dev-demo-cluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up canonical Python dependencies
        uses: ./.github/actions/setup-python
        with:
          requirements: yaml

      - name: Set up kubectl
        uses: ./.github/actions/setup-kubectl

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
          PREVIEW_KUBECONFIG_LOCAL_SERVER: https://127.0.0.1:6443
        run: |
          KUBECONFIG_PATH="$(bash ./dev-tools/hosted/shared/write-kubeconfig.sh)"
          bash ./dev-tools/hosted/shared/persist-runner-kubeconfig.sh "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Verify cluster access
        run: |
          kubectl get namespace kube-system >/dev/null
          kubectl auth can-i list namespaces --all-namespaces

      - name: Ensure GitHub CLI is available
        uses: ./.github/actions/setup-gh

      - name: Dispatch dev-demo deploy when stale or missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./dev-tools/hosted/dev-demo/reconcile-dev-demo.sh
