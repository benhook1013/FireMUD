name: CodeQL Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays at 00:00 UTC
  workflow_dispatch:      # Enables manual trigger from GitHub Actions UI

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [ 'java', 'javascript-typescript' ]

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Java
        if: matrix.language == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        if: matrix.language == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: ⚙️ Build project for CodeQL
        if: matrix.language == 'java'
        run: ./gradlew codeqlClasses --no-daemon

      - name: 📊 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  codeql-gate:
    name: CodeQL Gate
    runs-on: ubuntu-latest
    needs: [analyze]
    if: always()
    steps:
      - name: Enforce successful CodeQL analysis
        run: |
          if [ "${{ needs.analyze.result }}" != "success" ]; then
            echo "CodeQL analysis did not complete successfully: ${{ needs.analyze.result }}"
            exit 1
          fi
