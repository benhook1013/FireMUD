name: CodeQL Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  CODEQL_ACTION_FILE_COVERAGE_ON_PRS: "true"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CodeQL-Relevant Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      should_run: ${{ steps.compute.outputs.should_run }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute CodeQL matrix
        id: compute
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("should_run", "true");
              core.setOutput(
                "matrix",
                JSON.stringify([
                  { language: "java" },
                  { language: "javascript-typescript" },
                ])
              );
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
              (response) => response.data.map((file) => file.filename)
            );

            const javaRelevantPrefixes = [
              "buildSrc/",
              "gradle/",
              "protos/",
              "docker/",
              "services/",
              "config/",
            ];
            const javaRelevantFiles = new Set([
              "build.gradle.kts",
              "settings.gradle.kts",
              "gradle.properties",
              ".github/workflows/codeql.yml",
            ]);

            const runJava = files.some(
              (file) =>
                javaRelevantFiles.has(file) ||
                javaRelevantPrefixes.some((prefix) => file.startsWith(prefix))
            );

            const jsRelevantPrefixes = ["web-client/"];
            const jsRelevantFiles = new Set([
              ".github/workflows/codeql.yml",
            ]);

            const runJavascript = files.some(
              (file) =>
                jsRelevantFiles.has(file) ||
                jsRelevantPrefixes.some((prefix) => file.startsWith(prefix))
            );

            const matrix = [];
            if (runJava) {
              matrix.push({ language: "java" });
            }
            if (runJavascript) {
              matrix.push({ language: "javascript-typescript" });
            }

            core.setOutput("matrix", JSON.stringify(matrix));
            core.setOutput("should_run", matrix.length > 0 ? "true" : "false");

  analyze:
    name: CodeQL Analysis (${{ matrix.language }})
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Set Up Java
        if: matrix.language == 'java'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        if: matrix.language == 'java'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'

      - name: 🔍 Initialize CodeQL (Java PR Fast Path)
        if: matrix.language == 'java' && github.event_name == 'pull_request'
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          dependency-caching: true
          build-mode: none

      - name: 🔍 Initialize CodeQL (Java Full Scan)
        if: matrix.language == 'java' && github.event_name != 'pull_request'
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          dependency-caching: true
          build-mode: manual

      - name: 🔍 Initialize CodeQL
        if: matrix.language != 'java'
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          dependency-caching: true

      - name: ⚙️ Build project for full Java CodeQL
        if: matrix.language == 'java' && github.event_name != 'pull_request'
        run: ./gradlew codeqlClasses

      - name: 📊 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

  codeql-gate:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'PR Metadata Edit (CodeQL Gate)' || 'CodeQL Gate' }}
    runs-on: ubuntu-latest
    needs: [changes, analyze]
    if: ${{ always() && github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main') && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Enforce successful CodeQL analysis
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "CodeQL change detection did not complete successfully: ${{ needs.changes.result }}" >&2
            exit 1
          fi
          if [ "${{ needs.changes.outputs.should_run }}" = "true" ] && [ "${{ needs.analyze.result }}" != "success" ]; then
            echo "Required CodeQL analysis did not complete successfully: ${{ needs.analyze.result }}" >&2
            exit 1
          fi
          if [ "${{ needs.changes.outputs.should_run }}" != "true" ] && [ "${{ needs.changes.outputs.should_run }}" != "false" ]; then
            echo "CodeQL change detection returned an invalid should_run value: ${{ needs.changes.outputs.should_run }}" >&2
            exit 1
          fi
