name: CodeQL Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CodeQL-Relevant Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    outputs:
      run_java_codeql: ${{ steps.filter.outputs.java }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Java CodeQL-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            java:
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'buildSrc/**'
              - 'gradle/**'
              - 'protos/**'
              - '.github/workflows/codeql.yml'
              - 'services/**'
              - 'docker/**'
              - 'config/**'

  analyze-java:
    name: CodeQL Analysis (java)
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_java_codeql == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: ⚙️ Build project for CodeQL
        run: ./gradlew codeqlClasses

      - name: 📊 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  analyze-javascript:
    name: CodeQL Analysis (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v6

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: 📊 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  codeql-gate:
    name: CodeQL Gate
    runs-on: ubuntu-latest
    needs: [analyze-java, analyze-javascript]
    if: always()
    steps:
      - name: Enforce successful CodeQL analysis
        run: |
          if [ "${{ needs.analyze-java.result }}" != "success" ] && [ "${{ needs.analyze-java.result }}" != "skipped" ]; then
            echo "Java CodeQL analysis did not complete successfully: ${{ needs.analyze-java.result }}"
            exit 1
          fi
          if [ "${{ needs.analyze-javascript.result }}" != "success" ]; then
            echo "JavaScript/TypeScript CodeQL analysis did not complete successfully: ${{ needs.analyze-javascript.result }}"
            exit 1
          fi
