name: CodeQL Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  CODEQL_ACTION_FILE_COVERAGE_ON_PRS: "true"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CodeQL-Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      should_run: ${{ steps.compute.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute CodeQL matrix
        id: compute
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("should_run", "true");
              core.setOutput(
                "matrix",
                JSON.stringify([
                  { language: "java" },
                  { language: "javascript-typescript" },
                ])
              );
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
              (response) => response.data.map((file) => file.filename)
            );

            const javaRelevantPrefixes = [
              "buildSrc/",
              "gradle/",
              "protos/",
              "docker/",
              "services/",
              "config/",
            ];
            const javaRelevantFiles = new Set([
              "build.gradle.kts",
              "settings.gradle.kts",
              "gradle.properties",
              ".github/workflows/codeql.yml",
            ]);

            const runJava = files.some(
              (file) =>
                javaRelevantFiles.has(file) ||
                javaRelevantPrefixes.some((prefix) => file.startsWith(prefix))
            );

            const jsRelevantPrefixes = ["web-client/"];
            const jsRelevantFiles = new Set([
              ".github/workflows/codeql.yml",
            ]);

            const runJavascript = files.some(
              (file) =>
                jsRelevantFiles.has(file) ||
                jsRelevantPrefixes.some((prefix) => file.startsWith(prefix))
            );

            const matrix = [];
            if (runJava) {
              matrix.push({ language: "java" });
            }
            if (runJavascript) {
              matrix.push({ language: "javascript-typescript" });
            }

            core.setOutput("matrix", JSON.stringify(matrix));
            core.setOutput("should_run", matrix.length > 0 ? "true" : "false");

  analyze:
    name: CodeQL Analysis (${{ matrix.language }})
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Java
        if: matrix.language == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        if: matrix.language == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'

      - name: 🔍 Initialize CodeQL (Java PR Fast Path)
        if: matrix.language == 'java' && github.event_name == 'pull_request'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          dependency-caching: true
          build-mode: none

      - name: 🔍 Initialize CodeQL (Java Full Scan)
        if: matrix.language == 'java' && github.event_name != 'pull_request'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          dependency-caching: true
          build-mode: manual

      - name: 🔍 Initialize CodeQL
        if: matrix.language != 'java'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          dependency-caching: true

      - name: ⚙️ Build project for full Java CodeQL
        if: matrix.language == 'java' && github.event_name != 'pull_request'
        run: ./gradlew codeqlClasses

      - name: 📊 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  codeql-gate:
    name: CodeQL Gate
    runs-on: ubuntu-latest
    needs: [analyze]
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Enforce successful CodeQL analysis
        run: |
          if [ "${{ needs.analyze.result }}" != "success" ] && [ "${{ needs.analyze.result }}" != "skipped" ]; then
            echo "CodeQL analysis did not complete successfully: ${{ needs.analyze.result }}"
            exit 1
          fi
