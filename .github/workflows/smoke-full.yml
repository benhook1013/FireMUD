name: Smoke Tests Full

on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      checkout_ref:
        required: false
        default: ""
        type: string
      image_tag:
        required: true
        type: string
      runtime_digests:
        description: Exact registry digest for each runtime service
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      action:
        description: Smoke workflow action
        required: true
        default: full
        type: choice
        options:
          - full
      head_sha:
        description: Commit SHA whose smoke-tagged images should be used
        required: true
        type: string
      checkout_ref:
        description: Exact ref or SHA to checkout for smoke workflow code
        required: false
        default: ""
        type: string
      image_tag:
        description: Runtime image tag to consume
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: smoke-full-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  smoke-full:
    name: Smoke Tests (Full Stack)
    if: ${{ inputs.action == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: smoke-full-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_TIMEOUT_SECONDS: 20
      SMOKE_IMAGE_TAG: ${{ inputs.image_tag }}
      CHECKOUT_REF: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || inputs.head_sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - name: Set up canonical Python
        uses: ./.github/actions/setup-python
        with:
          requirements: smoke

      - name: Checkout trusted smoke override source
        if: ${{ inputs.runtime_digests != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .trusted-runtime-workflow
          persist-credentials: false

      - name: Install the trusted digest-aware smoke override
        if: ${{ inputs.runtime_digests != '' }}
        run: |
          set -euo pipefail
          test "$(git -C .trusted-runtime-workflow rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          install -T .trusted-runtime-workflow/docker/docker-compose.smoke-images.override.yml \
            docker/docker-compose.smoke-images.override.yml

      - name: Validate exact runtime image digests
        if: ${{ inputs.runtime_digests != '' }}
        env:
          RUNTIME_DIGESTS: ${{ inputs.runtime_digests }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          runtime_services = {
              "account-service",
              "automation-scripting-service",
              "entity-management-service",
              "game-design-service",
              "game-logic-service",
              "game-session-service",
              "logging-admin-service",
              "social-groups-service",
              "spring-cloud-gateway",
              "tcp-proxy-service",
              "world-management-service",
          }

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("Duplicate key in runtime_digests")
                  result[key] = value
              return result

          try:
              digests = json.loads(os.environ["RUNTIME_DIGESTS"], object_pairs_hook=unique_object)
          except ValueError:
              raise SystemExit("runtime_digests must be valid JSON without duplicate keys")
          if not isinstance(digests, dict) or digests.keys() != runtime_services:
              raise SystemExit("runtime_digests must contain exactly the 11 runtime service names")
          for service, digest in digests.items():
              if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit(f"runtime_digests has an invalid digest for {service}")

          refs = {
              "SMOKE_IMAGE_REF_" + service.upper().replace("-", "_"): f"ghcr.io/benhook1013/{service}@{digest}"
              for service, digest in digests.items()
          }
          rendered = subprocess.run(
              ["docker", "compose", "-f", "docker/docker-compose.smoke-images.override.yml",
               "config", "--no-consistency", "--format", "json"],
              check=True,
              stdout=subprocess.PIPE,
              env={**os.environ, **refs},
          )
          services = json.loads(rendered.stdout)["services"]
          for service, digest in digests.items():
              compose_service = "gateway" if service == "spring-cloud-gateway" else service
              if services.get(compose_service, {}).get("image") != f"ghcr.io/benhook1013/{service}@{digest}":
                  raise SystemExit(f"Smoke Compose does not select the fixed digest for {service}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              for variable, image in refs.items():
                  environment.write(f"{variable}={image}\n")
          PY

      - name: Generate Dev Certificates
        run: ./dev-tools/certs/generate-dev-certs.sh

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧪 Run Canonical Image Smoke Proof
        run: bash ./dev-tools/verify-smoke-images.sh --keep-running

      - name: 📜 Dump Docker Compose Logs on Failure
        if: failure()
        run: |
          if [ -f docker/docker-compose.yml ]; then
            docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.override.yml \
              -f docker/docker-compose.smoke-images.override.yml \
              logs || true
          fi

      - name: 🧹 Stop Smoke Stack
        if: always()
        run: |
          source ./dev-tools/smoke/run-owned-compose.sh
          if ! stop_run_owned_compose_project \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.override.yml \
            -f docker/docker-compose.smoke-images.override.yml; then
            echo "Unable to prove or release the smoke Compose project; refusing unowned teardown." >&2
            exit 1
          fi
