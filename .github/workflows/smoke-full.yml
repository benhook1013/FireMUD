name: Smoke Tests Full

on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      checkout_ref:
        required: false
        default: ""
        type: string
      image_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      action:
        description: Smoke workflow action
        required: true
        default: full
        type: choice
        options:
          - full
      head_sha:
        description: Commit SHA whose smoke-tagged images should be used
        required: true
        type: string
      checkout_ref:
        description: Exact ref or SHA to checkout for smoke workflow code
        required: false
        default: ""
        type: string
      image_tag:
        description: Runtime image tag to consume
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: smoke-full-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  smoke-full:
    name: Smoke Tests (Full Stack)
    if: ${{ inputs.action == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: smoke-full-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_TIMEOUT_SECONDS: 20
      SMOKE_IMAGE_TAG: ${{ inputs.image_tag }}
      CHECKOUT_REF: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || inputs.head_sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - name: Generate Dev Certificates
        run: ./dev-tools/certs/generate-dev-certs.sh

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install WebSocket smoke dependency
        run: python3 -m pip install --disable-pip-version-check websocket-client

      - name: 🧪 Run Canonical Image Smoke Proof
        run: SMOKE_IMAGE_TAG="${{ inputs.image_tag }}" bash ./dev-tools/verify-smoke-images.sh

      - name: 📜 Dump Docker Compose Logs on Failure
        if: failure()
        run: |
          if [ -f docker/docker-compose.yml ]; then
            docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.override.yml \
              -f docker/docker-compose.smoke-images.override.yml \
              logs || true
          fi

      - name: 🧹 Stop Smoke Stack
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.override.yml \
            -f docker/docker-compose.smoke-images.override.yml \
            down \
            -v \
            --remove-orphans
