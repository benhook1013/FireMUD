              }
              if (callback) {
                const event = context.payload.workflow_run;
                if (!Number.isSafeInteger(event.id) || event.id !== sourceId ||
                    !Number.isSafeInteger(event.run_attempt) || event.run_attempt <= 0 ||
                    !isTrustedWorkflowPath(event.path)) throw new Error("publication callback path or run identity is not trusted");
                for (const field of ["id", "workflow_id", "run_attempt", "display_title", "event", "conclusion", "head_branch", "head_sha"]) {
                  if (run[field] !== event[field]) throw new Error(`source API ${field} differs from callback`);
                }
                for (const field of ["repository", "head_repository"]) {
                  if (run[field]?.full_name !== event[field]?.full_name) throw new Error(`source API ${field} differs from callback`);
                }
                // Native PR callbacks and run lookups may differ only in whether
                // this exact PR's canonical merge ref is included in the path.
                if (!sameSourcePath(run.path, event.path, run.event, title[1])) {
                  throw new Error("source API path differs from callback");
                }
              }
              if (run.status === "completed") {
                if (run.conclusion !== "success") throw new Error("publication source run did not succeed");
                const {data: attempt} = await github.rest.actions.getWorkflowRunAttempt(proofOptions({
                  ...context.repo, run_id: sourceId, attempt_number: run.run_attempt,
                }));
                // Run-wide creation/start timestamps are not rerun execution authority.
                // Only the exact native attempt may bound the producer's execution.
                for (const field of ["id", "workflow_id", "run_attempt", "display_title", "event",
                    "head_branch", "head_sha", "status", "conclusion"]) {
                  if (attempt?.[field] !== run[field]) throw new Error(`source attempt ${field} differs from selected run`);
                }
                if (!sameSourcePath(run.path, attempt.path, run.event, title[1])) {
                  throw new Error("source attempt path differs from selected run");
                }
                if (![workflow.name, run.display_title].includes(attempt.name) ||
                    attempt.repository?.full_name !== repository || attempt.head_repository?.full_name !== repository) {
                  throw new Error("publication source attempt provenance is not trusted");
                }
                const created = timestamp(attempt.created_at);
                const started = timestamp(attempt.run_started_at);
                const updated = timestamp(attempt.updated_at);
                // Native attempt and job timestamps can differ in subsecond precision;
                // permit only their boundary second, never an earlier execution second.
                const attemptStart = Math.floor(started / 1000) * 1000;
                const attemptEnd = Math.floor(updated / 1000) * 1000 + 999;
                if (created > started + 1000 || created > updated || started > attemptEnd) {
                  throw new Error("publication source attempt chronology is inconsistent");
                }
                const jobs = [], ids = new Set();
                let total;
                for (let page = 1; page <= 10; page++) {
                  const {data} = await github.rest.actions.listJobsForWorkflowRunAttempt(proofOptions({
                    ...context.repo, run_id: sourceId, attempt_number: run.run_attempt, per_page: 100, page,
                  }));
                  if (!Number.isSafeInteger(data?.total_count) || data.total_count < 0 || data.total_count > 1000 ||
                      (total !== undefined && data.total_count !== total) || !Array.isArray(data.jobs) ||
                      data.jobs.length !== Math.min(100, Math.max(0, data.total_count - (page - 1) * 100))) {
                    throw new Error("publication source attempt job inventory is incomplete or inconsistent");
                  }
                  total ??= data.total_count;
                  for (const job of data.jobs) {
                    if (!Number.isSafeInteger(job?.id) || job.id <= 0 || ids.has(job.id) ||
                        typeof job.name !== "string" || !job.name.trim() || job.run_id !== sourceId ||
                        (Object.hasOwn(job, "run_attempt") && job.run_attempt !== run.run_attempt) || job.head_sha !== run.head_sha ||
                        ![workflow.name, run.display_title].includes(job.workflow_name)) {
                      throw new Error("publication source attempt job inventory has duplicate or unattributable jobs");
                    }
                    ids.add(job.id);
                    jobs.push(job);
                  }
                  if (jobs.length === total) break;
                }
                if (jobs.length !== total) throw new Error("publication source attempt job inventory exceeds bounded pagination");
                const producers = jobs.filter(job => ["PR Full-Stack Smoke (runtime-required=true)",
                  "PR Full-Stack Smoke (runtime-required=false)"].includes(job.name));
                if (producers.length !== 1 || producers[0].status !== "completed" ||
                    producers[0].conclusion !== "success" || !Array.isArray(producers[0].steps)) {
                  throw new Error("publication requires one successful attributable artifact producer job");
                }
                const producer = producers[0];
                const jobStart = timestamp(producer.started_at), jobEnd = timestamp(producer.completed_at);
                if (jobStart < attemptStart || jobEnd < jobStart || jobEnd > attemptEnd) {
                  throw new Error("publication artifact producer did not execute within the selected native attempt");
                }
                if (producer.name === "PR Full-Stack Smoke (runtime-required=true)" &&
                    producer.steps.some(step =>
                      step?.name === "Known canonical transition PLAY failure with successful authenticated cleanup" &&
                      step.status === "completed" && step.conclusion === "success")) {
                  if (requalification) {
                    throw new Error("Runtime publication cannot be requalified: this attempt passed under the PLAY exception and has no publishable upload.");
                  }
                  core.notice("CI passed under the canonical PLAY transition exception; no runtime images are eligible for publication.");
                  return;
                }
                const uploads = producer.steps.filter(step => step?.name === "Upload preview image artifact");
                const upload = uploads[0];
                if (uploads.length !== 1 || upload.status !== "completed" || upload.conclusion !== "success" ||
                    !Number.isSafeInteger(upload.number) || upload.number <= 0 ||
                    producer.steps.filter(step => step?.number === upload.number).length !== 1) {
                  throw new Error("publication requires the producer's actual successful Upload preview image artifact step");
                }
                const uploadStart = timestamp(upload.started_at), uploadEnd = timestamp(upload.completed_at);
                if (uploadStart < jobStart || uploadEnd < uploadStart || uploadEnd > jobEnd) {
                  throw new Error("publication artifact upload did not execute within the selected producer job");
                }
                const artifactName = `pr-runtime-images-pr-merge-${title[4]}`;
                const {data: inventory} = await github.rest.actions.listWorkflowRunArtifacts(proofOptions({
                  ...context.repo, run_id: sourceId, name: artifactName, per_page: 100, page: 1,
                }));
                if (!Array.isArray(inventory?.artifacts) || inventory.artifacts.length > 100 ||
                    inventory.total_count !== inventory.artifacts.length ||
                    new Set(inventory.artifacts.map(artifact => artifact?.id)).size !== inventory.artifacts.length) {
                  throw new Error("publication requires a complete unique exact-name source inventory");
                }
                // Run artifacts lack attempt IDs. A rerun may retain an older
                // upload under the same name, outside this attempt's upload interval.
                const currentArtifacts = inventory.artifacts.filter(artifact => {
                  const created = timestamp(artifact?.created_at);
                  return created >= Math.floor(uploadStart / 1000) * 1000 &&
                    created <= Math.floor(uploadEnd / 1000) * 1000 + 999;
                });
                if (currentArtifacts.length !== 1) {
                  throw new Error("publication requires exactly one artifact created within the selected upload step");
                }
                const artifact = currentArtifacts[0];
                if (!Number.isSafeInteger(artifact?.id) || artifact.id <= 0 ||
                    artifact.name !== artifactName || typeof artifact.expired !== "boolean" ||
                    artifact.workflow_run?.id !== sourceId || artifact.workflow_run.head_sha !== run.head_sha ||
                    typeof artifact.digest !== "string" || !/^sha256:[0-9a-f]{64}$/.test(artifact.digest)) {
                  throw new Error("publication artifact identity, digest, or retention is not qualified");
                }
                if (Date.now() >= deadline) throw new Error("publication producer proof exceeded its bounded deadline");
                if (artifact.expired) {
                  core.setOutput("expired_artifact", `source-${sourceId}-${run.run_attempt} artifact-${artifact.id} ${artifact.digest}`);
                  return;
                }
                core.setOutput("source", JSON.stringify(run));
                core.setOutput("title", run.display_title);
                core.setOutput("artifact_name", artifactName);
                core.setOutput("artifact_id", String(artifact.id));
                core.setOutput("artifact_digest", artifact.digest);
                break;
              }
              if (callback || requalification || !["queued", "in_progress", "waiting", "pending", "requested"].includes(run.status) ||
                  run.conclusion != null || Date.now() >= deadline) {
                throw new Error("publication source did not reach a real terminal success within the bounded wait");
              }
              await new Promise(resolve => setTimeout(resolve, Math.min(2000, deadline - Date.now())));
            }

      - name: Exact runtime artifact expired ${{ steps.resolve.outputs.expired_artifact }}
        if: ${{ success() && steps.resolve.outputs.expired_artifact != '' }}
        run: exit 1

  publish:
    name: Publish Fixed PR Merge Image Tags
    needs: [source]
    if: ${{ needs.source.outputs.source != '' }}
    concurrency:
      group: publish-pr-merge-images-${{ needs.source.outputs.title }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      # This trusted default-branch workflow reads one successful run artifact and publishes immutable merge tags.
      actions: read
      contents: read
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up canonical Python
        uses: ./.github/actions/setup-python

      - name: Set up canonical GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Download successful PR image artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact_id }}
          digest-mismatch: error
          # The pinned action extracts a sole artifact directly into path.
          path: /tmp/pr-runtime-artifacts/${{ needs.source.outputs.artifact_name }}
          github-token: ${{ github.token }}
          run-id: ${{ fromJSON(needs.source.outputs.source).id }}

      - name: Validate exact PR source and artifact before registry login
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          PUBLICATION_TRIGGER: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'pr-runtime-image-requalification' && 'pr-runtime-image-requalification' || github.event_name }}
          SOURCE_RUN_ID: ${{ fromJSON(needs.source.outputs.source).id }}
          SOURCE_RUN_ATTEMPT: ${{ fromJSON(needs.source.outputs.source).run_attempt }}
          SOURCE_RUN_URL: ${{ fromJSON(needs.source.outputs.source).html_url }}
          SOURCE_RUN_TITLE: ${{ fromJSON(needs.source.outputs.source).display_title }}
          SOURCE_RUN_EVENT: ${{ fromJSON(needs.source.outputs.source).event }}
          SOURCE_RUN_CONCLUSION: ${{ fromJSON(needs.source.outputs.source).conclusion }}
          SOURCE_HEAD_BRANCH: ${{ fromJSON(needs.source.outputs.source).head_branch }}
          SOURCE_HEAD_SHA: ${{ fromJSON(needs.source.outputs.source).head_sha }}
          SOURCE_HEAD_REPOSITORY: ${{ fromJSON(needs.source.outputs.source).head_repository.full_name }}
          SOURCE_RUN_REPOSITORY: ${{ fromJSON(needs.source.outputs.source).repository.full_name }}
          SOURCE_WORKFLOW_ID: ${{ fromJSON(needs.source.outputs.source).workflow_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          import importlib.util

          eligibility_path = Path("dev-tools/hosted/preview/preview-eligibility.py").resolve()
          eligibility_spec = importlib.util.spec_from_file_location(
              "preview_eligibility", eligibility_path
          )
          if eligibility_spec is None or eligibility_spec.loader is None:
              raise SystemExit(f"unable to load preview eligibility policy: {eligibility_path}")
          eligibility_module = importlib.util.module_from_spec(eligibility_spec)
          eligibility_spec.loader.exec_module(eligibility_module)
          DEPENDENCY_BOT_AUTHORS = eligibility_module.DEPENDENCY_BOT_AUTHORS
          evaluate = eligibility_module.evaluate
          parse_labels = eligibility_module.parse_labels

          EXPECTED_SERVICES = [
              "account-service",
              "automation-scripting-service",
              "entity-management-service",
              "game-design-service",
              "game-logic-service",
              "game-session-service",
              "logging-admin-service",
              "social-groups-service",
              "spring-cloud-gateway",
              "tcp-proxy-service",
              "world-management-service",
              "backup-verifier",
          ]
          SHA_PATTERN = r"[0-9a-f]{40}"
          SOURCE_WORKFLOW_PATH = ".github/workflows/runtime-images.yml"
          TITLE_PATTERN = re.compile(
              rf"^Build Runtime Images secure-pr-artifact "
              rf"pr-([1-9][0-9]*) base-({SHA_PATTERN}) head-({SHA_PATTERN}) "
              rf"merge-({SHA_PATTERN}) mode-required$"
          )

          def fail(message):
              print(f"trusted PR runtime publication rejected: {message}", file=sys.stderr)
              raise SystemExit(1)

          def is_trusted_workflow_path(value):
              if value == SOURCE_WORKFLOW_PATH:
                  return True
              prefix = f"{SOURCE_WORKFLOW_PATH}@"
              if not isinstance(value, str) or not value.startswith(prefix):
                  return False
              ref = value[len(prefix):]
              if (
                  not ref or ref == "@" or ref.startswith("/") or ref.endswith("/") or
                  ref.endswith(".") or ".." in ref or "@{" in ref or "//" in ref or any(
                      ord(character) <= 32 or ord(character) == 127 or
                      character in "~^:?*[\\"
                      for character in ref
                  )
              ):
                  return False
              return all(
                  part and part not in {".", ".."} and
                  not part.startswith(".") and
                  not part.endswith(".lock")
                  for part in ref.split("/")
              )

          def required_environment(name):
              value = os.environ.get(name, "")
              if not value:
                  fail(f"{name} is missing")
              return value

          def gh_json(endpoint):
              result = subprocess.run(
                  ["gh", "api", endpoint],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  fail(f"GitHub API lookup failed for {endpoint}: {result.stderr.strip()}")
              try:
                  return json.loads(result.stdout)
              except json.JSONDecodeError as error:
                  fail(f"GitHub API returned malformed JSON for {endpoint}: {error}")

          def current_pull_request(endpoint):
              for attempt in range(3):
                  pull_request = gh_json(endpoint)
                  if pull_request.get("mergeable") is not None and \
                      pull_request.get("mergeable_state") != "unknown":
                      return pull_request
                  if attempt == 2:
                      fail("current pull request mergeability remained unknown after bounded retries")
                  time.sleep(2)
              fail("current pull request mergeability could not be resolved")

          repository = required_environment("CURRENT_REPOSITORY")
          source_run_id_text = required_environment("SOURCE_RUN_ID")
          if not source_run_id_text.isdigit() or int(source_run_id_text) <= 0:
              fail("source workflow run id is not a positive integer")
          source_run_id = int(source_run_id_text)
          source_run_attempt_text = required_environment("SOURCE_RUN_ATTEMPT")
          if not source_run_attempt_text.isdigit() or int(source_run_attempt_text) <= 0:
              fail("source workflow attempt is not a positive integer")
          source_run_attempt = int(source_run_attempt_text)
          source_title = required_environment("SOURCE_RUN_TITLE")
          title_match = TITLE_PATTERN.fullmatch(source_title)
          if title_match is None:
              fail("source run title does not contain exact PR/base/head/merge/mode metadata")
          pr_number, base_sha, head_sha, merge_sha = title_match.groups()
          pr_number_int = int(pr_number)
          source_head_sha = required_environment("SOURCE_HEAD_SHA")
          # runtime-images.yml admits only the typed pr-runtime-base-refresh
          # repository_dispatch for this source class; workflow_run exposes
          # that dispatch subtype as the generic repository_dispatch event.
          source_event = required_environment("SOURCE_RUN_EVENT")
          if source_event not in {"pull_request", "repository_dispatch"}:
              fail("source event is not an allowed PR image source")
          publication_trigger = required_environment("PUBLICATION_TRIGGER")
          if publication_trigger not in {"workflow_run", "repository_dispatch", "pr-runtime-image-requalification"}:
              fail("publication trigger is not allowed")
          if publication_trigger == "repository_dispatch" and source_event != "repository_dispatch":
              fail("typed publication requires a repository_dispatch source run")
          if publication_trigger == "pr-runtime-image-requalification" and source_event != "pull_request":
              fail("publication requalification requires an original pull_request source run")
          if required_environment("SOURCE_RUN_CONCLUSION") != "success":
              fail("source workflow did not succeed")
          if required_environment("SOURCE_HEAD_REPOSITORY") != repository:
              fail("source head repository is not the current repository")
          if required_environment("SOURCE_RUN_REPOSITORY") != repository:
              fail("source run repository is not the current repository")
          workflow_id_text = required_environment("SOURCE_WORKFLOW_ID")
          if not workflow_id_text.isdigit() or int(workflow_id_text) <= 0:
              fail("source workflow id is not a positive integer")

          source_run = gh_json(f"repos/{repository}/actions/runs/{source_run_id}")
          if source_run.get("id") != source_run_id:
              fail("source workflow run API id does not match the event")
          if type(source_run.get("run_attempt")) is not int or source_run["run_attempt"] != source_run_attempt:
              fail("source workflow attempt changed before artifact validation")
          if source_run.get("workflow_id") != int(workflow_id_text):
              fail("source workflow identity changed between event and API")
          if source_run.get("name") not in {"Build Runtime Images", source_title}:
              fail("source workflow API name is neither its owning name nor exact run title")
          if not is_trusted_workflow_path(source_run.get("path")):
              fail("source workflow API path is not the trusted runtime-images workflow")
          if source_run.get("event") != source_event:
              fail("source workflow API event differs from the event")
          if source_run.get("status") != "completed" or source_run.get("conclusion") != "success":
              fail("source workflow API run is not a completed success")
          if source_run.get("display_title") != source_title:
              fail("source workflow API title differs from the event")
          source_head_sha = required_environment("SOURCE_HEAD_SHA")
          if not re.fullmatch(SHA_PATTERN, source_head_sha):
              fail("source workflow head SHA is not a lowercase 40-character commit SHA")
          if source_run.get("head_sha") != source_head_sha:
              fail("source workflow API head SHA differs from the event")
          if source_run.get("head_branch") != required_environment("SOURCE_HEAD_BRANCH"):
              fail("source workflow API branch differs from the event")
          if (source_run.get("repository") or {}).get("full_name") != repository:
              fail("source workflow API repository is not the current repository")
          if (source_run.get("head_repository") or {}).get("full_name") != repository:
              fail("source workflow API head repository is not the current repository")

          source_head_branch = required_environment("SOURCE_HEAD_BRANCH")
          if source_event == "pull_request":
              if source_head_sha != head_sha:
                  fail("pull-request source head SHA disagrees with source run title")
          else:
              default_branch = required_environment("DEFAULT_BRANCH")
              if not default_branch or source_head_branch != default_branch:
                  fail("typed refresh source run is not on the repository default branch")

          pull_request = current_pull_request(f"repos/{repository}/pulls/{pr_number_int}")
          if pull_request.get("number") != pr_number_int or pull_request.get("state") != "open":
              fail("source pull request is not the current open pull request")
          if (pull_request.get("head") or {}).get("sha") != head_sha:
              fail("current pull request head SHA differs from source metadata")
          if source_event == "pull_request" and (pull_request.get("head") or {}).get("ref") != source_head_branch:
              fail("current pull request head branch differs from source metadata")
          if (pull_request.get("head", {}).get("repo") or {}).get("full_name") != repository:
              fail("current pull request head repository is not the current repository")
          base = pull_request.get("base") or {}
          if base.get("repo", {}).get("full_name") != repository:
              fail("current pull request base repository is not the current repository")
          base_ref = base.get("ref")
          if not isinstance(base_ref, str) or not base_ref:
              fail("current pull request base ref is missing")
          labels = pull_request.get("labels")
          labels_json = json.dumps(labels, separators=(",", ":"))
          labels_valid, is_priority = parse_labels(labels_json)
          if not labels_valid:
              fail("current pull request labels are malformed")
          author = (pull_request.get("user") or {}).get("login")
          if not isinstance(author, str) or not author:
              fail("current pull request author is missing")
          eligible, eligibility_reason, _ = evaluate(
              "deploy", "open", base_ref, author, labels_json
          )
          if not eligible:
              fail(f"current pull request is not preview-eligible: {eligibility_reason}")
          if author in DEPENDENCY_BOT_AUTHORS:
              fail("current pull request is authored by a dependency bot")
          if pull_request.get("mergeable") is not True:
              fail("current pull request is not currently mergeable")
          mergeable_state = pull_request.get("mergeable_state")
          if not isinstance(mergeable_state, str) or mergeable_state in {
              "dirty", "conflicting", "unknown"
          }:
              fail("current pull request mergeability state is not a usable non-conflicting value")
          current_base_ref = gh_json(f"repos/{repository}/git/ref/heads/{base_ref}")
          if (current_base_ref.get("object") or {}).get("sha") != base_sha:
              fail("current base branch ref SHA differs from source metadata")
          if pull_request.get("merge_commit_sha") != merge_sha:
              fail("current pull request merge SHA differs from source metadata")

          merge_commit = gh_json(f"repos/{repository}/commits/{merge_sha}")
          if merge_commit.get("sha") != merge_sha:
              fail("merge commit API SHA differs from source metadata")
          merge_parent_shas = [
              parent.get("sha")
              for parent in merge_commit.get("parents", [])
              if isinstance(parent, dict)
          ]
          if merge_parent_shas != [base_sha, head_sha]:
              fail("merge commit parents do not exactly match declared base and head SHAs")

          artifact_root = Path(os.environ.get("PR_RUNTIME_ARTIFACT_ROOT", "/tmp/pr-runtime-artifacts"))
          if not artifact_root.is_dir():
              fail("downloaded PR runtime artifact directory is missing")
          artifact_dirs = sorted(
              path for path in artifact_root.iterdir()
              if path.is_dir() and path.name.startswith("pr-runtime-images-")
          )
          image_tag = f"pr-merge-{merge_sha}"
          expected_artifact_name = f"pr-runtime-images-{image_tag}"
          if artifact_dirs != [artifact_root / expected_artifact_name]:
              fail("downloaded artifacts do not contain exactly the expected runtime image artifact")
          artifact_dir = artifact_dirs[0]
          if artifact_dir.is_symlink():
              fail("runtime image artifact directory must not be a symlink")
          manifest_path = artifact_dir / "pr-runtime-services.txt"
          provenance_path = artifact_dir / "pr-runtime-provenance.json"
          archive_path = artifact_dir / "pr-runtime-images.tar.gz"
          for path in (manifest_path, provenance_path, archive_path):
              if not path.is_file() or path.is_symlink():
                  fail(f"required artifact file is missing or is a symlink: {path.name}")

          manifest = manifest_path.read_text(encoding="utf-8").splitlines()
          if manifest != EXPECTED_SERVICES:
              fail("runtime service manifest is not the exact allowed service list")
          try:
              provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as error:
              fail(f"runtime provenance JSON is malformed: {error}")
          expected_provenance_keys = {
              "repository", "prNumber", "baseSha", "headSha", "mergeSha",
              "imageTag", "sourceRunId", "services",
          }
          if set(provenance) != expected_provenance_keys:
              fail("runtime provenance JSON schema contains missing or extra keys")
          if provenance != {
              "repository": repository,
              "prNumber": pr_number_int,
              "baseSha": base_sha,
              "headSha": head_sha,
              "mergeSha": merge_sha,
              "imageTag": image_tag,
              "sourceRunId": source_run_id,
              "services": EXPECTED_SERVICES,
          }:
              fail("runtime provenance does not exactly match the trusted source run and PR")

          github_env = required_environment("GITHUB_ENV")
          with open(github_env, "a", encoding="utf-8") as env_file:
              env_file.write(f"IMAGE_TAG={image_tag}\n")
              env_file.write(f"PR_RUNTIME_ARTIFACT_DIR={artifact_dir}\n")
              env_file.write(f"PR_NUMBER={pr_number}\n")
              env_file.write(f"PR_HEAD_BRANCH={pull_request['head']['ref']}\n")
              env_file.write(f"SOURCE_RUN_HEAD_SHA={source_head_sha}\n")
              env_file.write(f"BASE_SHA={base_sha}\n")
              env_file.write(f"HEAD_SHA={head_sha}\n")
              env_file.write(f"MERGE_SHA={merge_sha}\n")
          print(
              f"Validated source run {source_run_id}, PR #{pr_number}, "
              f"merge {merge_sha}, artifact {expected_artifact_name}; registry remains untouched."
          )
          PY

      - name: Summarize trusted publication source
        env:
          SOURCE_RUN_ATTEMPT: ${{ fromJSON(needs.source.outputs.source).run_attempt }}
          SOURCE_ARTIFACT_ID: ${{ needs.source.outputs.artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.source.outputs.artifact_digest }}
          SOURCE_RUN_ID: ${{ fromJSON(needs.source.outputs.source).id }}
          SOURCE_RUN_URL: ${{ fromJSON(needs.source.outputs.source).html_url }}
          SOURCE_RUN_TITLE: ${{ fromJSON(needs.source.outputs.source).display_title }}
          SOURCE_HEAD_BRANCH: ${{ fromJSON(needs.source.outputs.source).head_branch }}
          SOURCE_HEAD_SHA: ${{ fromJSON(needs.source.outputs.source).head_sha }}
          PR_HEAD_BRANCH: ${{ env.PR_HEAD_BRANCH }}
        run: |
          python3 - <<'PY'
          import os
          from html import escape

          def markdown_code(value):
              return escape(value.replace("\r", " ").replace("\n", " "), quote=False)

          summary = f"""### Trusted PR runtime image publication

          - Source workflow run: [{os.environ['SOURCE_RUN_ID']}]({os.environ['SOURCE_RUN_URL']}) (attempt `{os.environ['SOURCE_RUN_ATTEMPT']}`)
          - Source artifact ID and SHA-256: `{os.environ['SOURCE_ARTIFACT_ID']}` / `{os.environ['SOURCE_ARTIFACT_DIGEST']}`
          - Source run title: <code>{markdown_code(os.environ['SOURCE_RUN_TITLE'])}</code>
          - Source workflow branch/SHA: <code>{markdown_code(os.environ['SOURCE_HEAD_BRANCH'])}</code> / `{os.environ['SOURCE_HEAD_SHA']}`
          - Current PR head branch/SHA: <code>{markdown_code(os.environ.get('PR_HEAD_BRANCH', '<validated>'))}</code> / `{os.environ['HEAD_SHA']}`
          - Tested merge SHA and immutable image tag: `{os.environ['MERGE_SHA']}` / `{os.environ['IMAGE_TAG']}`

          GitHub displays this run in the default-branch context because completion callbacks and typed publication handoffs use the trusted workflow definition. It publishes only the successful source run's exact merge-SHA artifact after validating current PR identity and provenance, and does not check out PR source.
          """
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
              summary_file.write(summary)
          PY

      - name: Load fixed-tag images
        run: |
          set -o pipefail
          gzip -dc "$PR_RUNTIME_ARTIFACT_DIR/pr-runtime-images.tar.gz" | docker load

      - name: Confirm current source attempt before registry login
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ fromJSON(needs.source.outputs.source).id }}
          SOURCE_RUN_ATTEMPT: ${{ fromJSON(needs.source.outputs.source).run_attempt }}
          SOURCE_WORKFLOW_ID: ${{ fromJSON(needs.source.outputs.source).workflow_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! timeout 20s gh api "repos/$CURRENT_REPOSITORY/actions/runs/$SOURCE_RUN_ID" |
            jq -e --argjson id "$SOURCE_RUN_ID" --argjson attempt "$SOURCE_RUN_ATTEMPT" \
              --argjson workflow "$SOURCE_WORKFLOW_ID" '
                .id == $id and .run_attempt == $attempt and .workflow_id == $workflow
                and .status == "completed" and .conclusion == "success"
              ' >/dev/null; then
            echo "Could not confirm the selected current successful source attempt before registry login." >&2
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish fixed PR image tags
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          service_manifest="$PR_RUNTIME_ARTIFACT_DIR/pr-runtime-services.txt"
          if [[ ! -f "$service_manifest" ]]; then
            echo "Required PR runtime service inventory is missing from the downloaded artifact." >&2
            exit 1
          fi
          services=()
          declare -A seen_services=()
          while IFS= read -r image || [[ -n "$image" ]]; do
            service="$image"
            if [[ -z "$service" || ! "$service" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "Malformed PR runtime service inventory entry: $service." >&2
              exit 1
            fi
            if [[ -n "${seen_services[$service]+x}" ]]; then
              echo "Duplicate PR runtime service inventory entry: $service." >&2
              exit 1
            fi
            seen_services["$service"]=1
            services+=("$service")
          done < "$service_manifest"
          if (( ${#services[@]} == 0 )); then
            echo "PR runtime service inventory is empty; nothing was published." >&2
            exit 1
          fi

          declare -A registry_tokens=()
          registry_manifest_state() {
            local image="$1"
            local image_path="${image#ghcr.io/}"
            local repository_path="${image_path%:*}"
            local tag="${image_path##*:}"
            local manifest_url="https://ghcr.io/v2/${repository_path}/manifests/${tag}"
            local registry_token="${registry_tokens[$repository_path]:-}"
            local status

            [[ -n "${GHCR_USERNAME:-}" && -n "${GHCR_TOKEN:-}" ]] || {
              echo "GHCR credentials are unavailable for authenticated manifest preflight: $image" >&2
              return 1
            }
            if [[ -z "$registry_token" ]]; then
              if ! registry_token="$(curl --silent --show-error --location --fail \
                --connect-timeout 10 --max-time 30 \
                --user "${GHCR_USERNAME}:${GHCR_TOKEN}" \
                --get \
                --data-urlencode 'service=ghcr.io' \
                --data-urlencode "scope=repository:${repository_path}:pull" \
                --header 'Accept: application/json' \
                'https://ghcr.io/token' | jq -er '.token // .access_token // empty')"; then
                echo "GHCR bearer-token exchange failed for $image; refusing to infer absence." >&2
                return 1
              fi
              registry_tokens["$repository_path"]="$registry_token"
            fi
            # `docker manifest inspect "$image"` conflates a 404 with auth,
            # registry, and network failures, so it is never an absence check.
            if ! status="$(curl --silent --show-error --location --head \
              --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer ${registry_token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              --output /dev/null --write-out '%{http_code}' "$manifest_url")"; then
              echo "Authenticated OCI manifest HEAD failed for $image; refusing to infer absence." >&2
              return 1
            fi
            case "$status" in
              200) printf 'existing\n' ;;
              404) printf 'missing\n' ;;
              *)
                echo "Authenticated OCI manifest HEAD returned HTTP ${status} for $image; refusing to push." >&2
                return 1
                ;;
            esac
          }

          declare -A source_image_ids=()
          for service in "${services[@]}"; do
            image="ghcr.io/benhook1013/${service}:${IMAGE_TAG}"
            source_image_id="$(docker image inspect --format '{{.Id}}' "$image" 2>/dev/null || true)"
            if [[ -z "$source_image_id" ]]; then
              echo "Required source artifact image for $service has no inspectable image ID: $image." >&2
              exit 1
            fi
            source_image_ids["$service"]="$source_image_id"
          done

          verify_existing_target() {
            local service="$1"
            local image="ghcr.io/benhook1013/${service}:${IMAGE_TAG}"
            if ! docker pull "$image" >/dev/null; then
              echo "Existing fixed image tag could not be pulled for immutable comparison: $image" >&2
              exit 1
            fi
            local target_image_id
            target_image_id="$(docker image inspect --format '{{.Id}}' "$image" 2>/dev/null || true)"
            if [[ -z "$target_image_id" || "$target_image_id" != "${source_image_ids[$service]}" ]]; then
              echo "Existing fixed image tag does not match the validated source artifact: $image" >&2
              echo "Expected source image ID ${source_image_ids[$service]}, observed target image ID ${target_image_id:-<missing>}." >&2
              exit 1
            fi
            echo "Fixed image tag already exists with the validated source image ID; preserving first publication: $image"
          }

          # Resolve every target before the first push. A registry/auth/network
          # failure is not equivalent to an absent immutable tag.
          existing_services=()
          missing_services=()
          for service in "${services[@]}"; do
            image="ghcr.io/benhook1013/${service}:${IMAGE_TAG}"
            if ! state="$(registry_manifest_state "$image")"; then
              echo "Immutable target preflight failed for $image; nothing was published." >&2
              exit 1
            fi
            if [[ "$state" == existing ]]; then
              existing_services+=("$service")
            else
              missing_services+=("$service")
            fi
          done
          for service in "${existing_services[@]}"; do
            verify_existing_target "$service"
          done

          available_services=("${existing_services[@]}")
          for service in "${missing_services[@]}"; do
            image="ghcr.io/benhook1013/${service}:${IMAGE_TAG}"
            max_push_attempts=3
            push_attempt=1
            while true; do
              if docker push "$image"; then
                # A successful client push is not publication proof until the
                # authenticated target resolves to the exact source image ID.
                verify_existing_target "$service"
                break
              fi
              if ! state="$(registry_manifest_state "$image")"; then
                echo "Unable to classify $image after a failed push; refusing to infer absence." >&2
                exit 1
              fi
              if [[ "$state" == existing ]]; then
                verify_existing_target "$service"
                break
              fi
              if (( push_attempt >= max_push_attempts )); then
                echo "Failed to publish $image after ${push_attempt} attempts." >&2
                unpublished_services=()
                reached_failure=false
                for candidate_service in "${missing_services[@]}"; do
                  if [[ "$candidate_service" == "$service" ]]; then
                    reached_failure=true
                  fi
                  if [[ "$reached_failure" == true ]]; then
                    unpublished_services+=("$candidate_service")
                  fi
                done
                {
                  echo "### Partial PR runtime image publication"
                  echo
                  echo "Successfully available fixed tags:"
                  if ((${#available_services[@]} == 0)); then
                    echo "- None"
                  else
                    # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters.
                    printf -- '- `%s`\n' "${available_services[@]}"
                  fi
                  echo
                  echo "Unpublished fixed tags (not rechecked after the failed push):"
                  if ((${#unpublished_services[@]} == 0)); then
                    echo "- None"
                  else
                    # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters.
                    printf -- '- `%s`\n' "${unpublished_services[@]}"
                  fi
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              backoff_seconds=$((5 * 2 ** (push_attempt - 1)))
              echo "Transient push failure for $image; retrying in ${backoff_seconds}s (attempt $((push_attempt + 1))/${max_push_attempts})."
              sleep "$backoff_seconds"
              push_attempt=$((push_attempt + 1))
            done
            available_services+=("$service")
          done

      # Preserve the identity of the bytes just published in the native attempt
      # jobs record, independently of the short-lived source artifact.
      - name: PR runtime publication receipt v1 source-${{ fromJSON(needs.source.outputs.source).id }}-${{ fromJSON(needs.source.outputs.source).run_attempt }} publisher-${{ github.run_id }}-${{ github.run_attempt }} artifact-${{ needs.source.outputs.artifact_id }} ${{ needs.source.outputs.artifact_digest }}
        run: ':'
