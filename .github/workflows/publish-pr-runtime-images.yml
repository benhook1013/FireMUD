name: Publish PR Runtime Images

on:
  workflow_run:
    workflows: [Build Runtime Images]
    types: [completed]

run-name: Publish PR Runtime Images head-${{ github.event.workflow_run.head_sha }}

permissions: {}

concurrency:
  group: publish-pr-runtime-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Fixed PR Image Tags
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.display_title, 'Build Runtime Images secure-pr-artifact ') }}
    runs-on: ubuntu-latest
    permissions:
      # This trusted default-branch workflow reads one successful run artifact and publishes fixed SHA tags.
      actions: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Check out trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up canonical Python
        uses: ./.github/actions/setup-python

      - name: Summarize trusted publication source
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import os
          from html import escape

          def markdown_code(value):
              return escape(value.replace("\r", " ").replace("\n", " "), quote=False)

          summary = f"""### Trusted PR runtime image publication

          - Source workflow run: [{os.environ['SOURCE_RUN_ID']}]({os.environ['SOURCE_RUN_URL']})
          - Source run title: <code>{markdown_code(os.environ['SOURCE_RUN_TITLE'])}</code>
          - PR head branch: <code>{markdown_code(os.environ['SOURCE_HEAD_BRANCH'])}</code>
          - PR head SHA and fixed image tag: `{os.environ['SOURCE_HEAD_SHA']}`

          GitHub displays this run in the default-branch context because `workflow_run` uses the trusted workflow definition. It publishes only the successful source run's fixed PR head-SHA artifact and does not check out PR source.
          """
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
              summary_file.write(summary)
          PY

      - name: Download successful PR image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-runtime-images-${{ github.event.workflow_run.head_sha }}
          path: /tmp/pr-runtime-images
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Load fixed-tag images
        run: |
          set -o pipefail
          gzip -dc /tmp/pr-runtime-images/pr-runtime-images.tar.gz | docker load

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish fixed PR image tags
        run: |
          set -euo pipefail

          service_manifest=/tmp/pr-runtime-images/pr-runtime-services.txt
          if [[ ! -f "$service_manifest" ]]; then
            echo "Required PR runtime service inventory is missing from the downloaded artifact." >&2
            exit 1
          fi
          services=()
          declare -A seen_services=()
          while IFS= read -r image || [[ -n "$image" ]]; do
            service="$image"
            if [[ -z "$service" || ! "$service" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "Malformed PR runtime service inventory entry: $service." >&2
              exit 1
            fi
            if [[ -n "${seen_services[$service]+x}" ]]; then
              echo "Duplicate PR runtime service inventory entry: $service." >&2
              exit 1
            fi
            seen_services["$service"]=1
            services+=("$service")
          done < "$service_manifest"
          if (( ${#services[@]} == 0 )); then
            echo "PR runtime service inventory is empty; nothing was published." >&2
            exit 1
          fi

          missing_source_images=()
          for service in "${services[@]}"; do
            image="ghcr.io/benhook1013/${service}:${IMAGE_TAG}"
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              echo "Required source artifact image for $service is missing: $image." >&2
              missing_source_images+=("$image")
            fi
          done
          if (( ${#missing_source_images[@]} > 0 )); then
            echo "Required source artifact is incomplete; ${#missing_source_images[@]} runtime image(s) are missing. Nothing was published." >&2
            exit 1
          fi

          available_services=()
          for service in "${services[@]}"; do
            image="ghcr.io/benhook1013/${service}:${IMAGE_TAG}"
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "Fixed image tag already exists; preserving first publication: $image"
              available_services+=("$service")
              continue
            fi

            max_push_attempts=3
            push_attempt=1
            while true; do
              if docker push "$image"; then
                break
              fi
              if docker manifest inspect "$image" >/dev/null 2>&1; then
                echo "Fixed image tag became available; preserving first publication: $image"
                break
              fi
              if (( push_attempt >= max_push_attempts )); then
                echo "Failed to publish $image after ${push_attempt} attempts." >&2
                unpublished_services=()
                reached_failure=false
                for candidate_service in "${services[@]}"; do
                  if [[ "$candidate_service" == "$service" ]]; then
                    reached_failure=true
                  fi
                  if [[ "$reached_failure" == true ]]; then
                    candidate_image="ghcr.io/benhook1013/${candidate_service}:${IMAGE_TAG}"
                    if docker manifest inspect "$candidate_image" >/dev/null 2>&1; then
                      available_services+=("$candidate_service")
                    else
                      unpublished_services+=("$candidate_service")
                    fi
                  fi
                done
                {
                  echo "### Partial PR runtime image publication"
                  echo
                  echo "Successfully available fixed tags:"
                  if ((${#available_services[@]} == 0)); then
                    echo "- None"
                  else
                    # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters.
                    printf -- '- `%s`\n' "${available_services[@]}"
                  fi
                  echo
                  echo "Unpublished fixed tags:"
                  if ((${#unpublished_services[@]} == 0)); then
                    echo "- None"
                  else
                    # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters.
                    printf -- '- `%s`\n' "${unpublished_services[@]}"
                  fi
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              backoff_seconds=$((5 * 2 ** (push_attempt - 1)))
              echo "Transient push failure for $image; retrying in ${backoff_seconds}s (attempt $((push_attempt + 1))/${max_push_attempts})."
              sleep "$backoff_seconds"
              push_attempt=$((push_attempt + 1))
            done
            available_services+=("$service")
          done
