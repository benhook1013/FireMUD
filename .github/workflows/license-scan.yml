name: License Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  ORT_DOCKER_IMAGE: ghcr.io/oss-review-toolkit/ort:89.2.0

concurrency:
  group: license-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect License-Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      run_gradle_ort: ${{ steps.filter.outputs.gradle }}
      run_npm_ort: ${{ steps.filter.outputs.npm }}
      run_any_ort: ${{ steps.filter.outputs.gradle == 'true' || steps.filter.outputs.npm == 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Detect dependency-relevant changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            gradle:
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'buildSrc/**'
              - 'gradle/**'
              - '**/build.gradle.kts'
              - '**/settings.gradle.kts'
              - '**/gradle.properties'
              - '**/gradle-wrapper.properties'
              - '**/gradle-wrapper.jar'
              - '.github/workflows/license-scan.yml'
              - '.github/workflows/release-notes.yml'
              - '.github/workflows/ort-advisory.yml'
            npm:
              - 'package.json'
              - 'package-lock.json'
              - 'config/openapi/package.json'
              - 'config/openapi/package-lock.json'
              - 'web-client/package.json'
              - 'web-client/package-lock.json'
              - '.github/workflows/license-scan.yml'
              - '.github/workflows/release-notes.yml'
              - '.github/workflows/ort-advisory.yml'

  ort-gradle:
    name: License Gate (Gradle)
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_gradle_ort == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Use HTTPS for Git
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            config/openapi/package-lock.json
            web-client/package-lock.json

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Run ORT License Scan
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1
        with:
          image: ${{ env.ORT_DOCKER_IMAGE }}
          ort-cli-args: '-P ort.analyzer.enabledPackageManagers=Gradle'
          run: 'cache-dependencies,labels,analyzer,evaluator,reporter'
          fail-on: policy-violation
          report-formats: 'CycloneDx,WebApp'
          ort-cli-report-args: '-O CycloneDX=output.file.formats=json,xml'

      - name: Upload ORT results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ort-result-gradle-${{ github.sha }}
          path: ${{ steps.ort.outputs.results-path }}
      - name: Summarize ORT report
        if: github.event_name == 'pull_request'
        run: |
          SUMMARY_FILE=$(find "${{ steps.ort.outputs.results-path }}" -maxdepth 1 -name 'scan-summary-*.md' -print | head -n 1)
          if [ -f "$SUMMARY_FILE" ]; then
            {
              echo "### 📜 License Scan Summary (Gradle)"
              cat "$SUMMARY_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  ort-npm:
    name: License Gate (NPM)
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_npm_ort == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Use HTTPS for Git
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            config/openapi/package-lock.json
            web-client/package-lock.json

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Run ORT License Scan
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1
        with:
          image: ${{ env.ORT_DOCKER_IMAGE }}
          ort-cli-args: '-P ort.analyzer.enabledPackageManagers=NPM'
          run: 'cache-dependencies,labels,analyzer,evaluator,reporter'
          fail-on: policy-violation
          report-formats: 'CycloneDx,WebApp'
          ort-cli-report-args: '-O CycloneDX=output.file.formats=json,xml'

      - name: Upload ORT results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ort-result-npm-${{ github.sha }}
          path: ${{ steps.ort.outputs.results-path }}
      - name: Summarize ORT report
        if: github.event_name == 'pull_request'
        run: |
          SUMMARY_FILE=$(find "${{ steps.ort.outputs.results-path }}" -maxdepth 1 -name 'scan-summary-*.md' -print | head -n 1)
          if [ -f "$SUMMARY_FILE" ]; then
            {
              echo "### 📜 License Scan Summary (NPM)"
              cat "$SUMMARY_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  license-gate:
    name: License Gate
    needs: [changes, ort-gradle, ort-npm]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Verify ORT results
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ needs.changes.outputs.run_gradle_ort }}" = "true" ] && [ "${{ needs.ort-gradle.result }}" != "success" ]; then
              echo "Gradle ORT did not succeed: ${{ needs.ort-gradle.result }}" >&2
              exit 1
            fi
            if [ "${{ needs.changes.outputs.run_npm_ort }}" = "true" ] && [ "${{ needs.ort-npm.result }}" != "success" ]; then
              echo "NPM ORT did not succeed: ${{ needs.ort-npm.result }}" >&2
              exit 1
            fi
          else
            if [ "${{ needs.ort-gradle.result }}" != "success" ]; then
              echo "Gradle ORT did not succeed: ${{ needs.ort-gradle.result }}" >&2
              exit 1
            fi
            if [ "${{ needs.ort-npm.result }}" != "success" ]; then
              echo "NPM ORT did not succeed: ${{ needs.ort-npm.result }}" >&2
              exit 1
            fi
          fi
