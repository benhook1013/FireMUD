name: License Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

run-name: License Gate ${{ github.event_name == 'pull_request' && format('pr-{0} base-{1} head-{2}', github.event.pull_request.number, github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.ref_name }}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: license-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect License-Relevant Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
    outputs:
      run_gradle_ort: ${{ steps.filter.outputs.gradle == 'true' || steps.ort_authority.outputs.changed == 'true' }}
      run_npm_ort: ${{ steps.filter.outputs.npm == 'true' || steps.ort_authority.outputs.changed == 'true' }}
      run_any_ort: ${{ steps.filter.outputs.gradle == 'true' || steps.filter.outputs.npm == 'true' || steps.ort_authority.outputs.changed == 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect dependency-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            gradle:
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'buildSrc/**'
              - 'gradle/**'
              - '**/build.gradle.kts'
              - '**/settings.gradle.kts'
              - '**/gradle.properties'
              - '**/gradle-wrapper.properties'
              - '**/gradle-wrapper.jar'
              - '.node-version'
              - '.github/workflows/license-scan.yml'
              - '.github/workflows/release-notes.yml'
              - '.github/workflows/ort-advisory.yml'
            npm:
              - 'package.json'
              - 'package-lock.json'
              - 'config/openapi/package.json'
              - 'config/openapi/package-lock.json'
              - 'web-client/package.json'
              - 'web-client/package-lock.json'
              - '.node-version'
              - '.github/workflows/license-scan.yml'
              - '.github/workflows/release-notes.yml'
              - '.github/workflows/ort-advisory.yml'

      - name: Detect ORT image authority changes
        id: ort_authority
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --unified=0 "$BASE_SHA" "$GITHUB_SHA" -- config/workflow-tool-versions.env \
            | grep -Eq '^[+-](# renovate-image: datasource=docker depName=ghcr\.io/oss-review-toolkit/ort|ORT_VERSION=|ORT_DIGEST=)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  ort-gradle:
    name: License Gate (Gradle)
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (github.event_name != 'pull_request' || needs.changes.outputs.run_gradle_ort == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Use HTTPS for Git
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            config/openapi/package-lock.json
            web-client/package-lock.json

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: Run ORT License Scan
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1
        with:
          image: ${{ steps.workflow-tool-versions.outputs.ort-image }}
          ort-cli-args: '-P ort.analyzer.enabledPackageManagers=Gradle'
          run: 'cache-dependencies,labels,analyzer,evaluator,reporter'
          fail-on: 'violations'
          report-formats: 'CycloneDx,WebApp'
          ort-cli-report-args: '-O CycloneDX=output.file.formats=json,xml'

      - name: Require complete Gradle ORT analysis
        id: gradle_analyzer_guard
        shell: bash
        run: |
          if [[ "${ORT_CLI_ANALYZE_EXIT_CODE:-}" != "0" ]]; then
            echo 'ORT analyzer did not complete successfully.' >&2
            exit 1
          fi

      - name: Diagnose Maven Central access after Gradle ORT failure
        id: gradle_ort_diagnostic
        if: ${{ failure() && (steps.ort.outcome == 'failure' || steps.gradle_analyzer_guard.outcome == 'failure') }}
        continue-on-error: true
        shell: bash
        env:
          ORT_DIAGNOSTIC_IMAGE: ${{ steps.workflow-tool-versions.outputs.ort-image }}
          ORT_DIAGNOSTIC_DIRECTORY: ${{ runner.temp }}/ort-gradle-maven-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          MAVEN_POM_URL: https://repo.maven.apache.org/maven2/com/google/code/findbugs/jsr305/3.0.2/jsr305-3.0.2.pom
          MAVEN_TRACE_URL: https://repo.maven.apache.org/cdn-cgi/trace
        run: |
          set +e
          set -u -o pipefail

          raw_directory="${HOME}/.ort-maven-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_raw_directory="/home/ort/.ort-maven-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          summary_file="${ORT_DIAGNOSTIC_DIRECTORY}/summary.txt"

          cleanup_raw_directory() {
            for raw_file in "${raw_directory}"/*; do
              if [[ -f "${raw_file}" ]]; then
                rm -f -- "${raw_file}" || true
              fi
            done
            rmdir -- "${raw_directory}" 2>/dev/null || true
          }
          trap cleanup_raw_directory EXIT

          mkdir -p "${raw_directory}" "${ORT_DIAGNOSTIC_DIRECTORY}"
          setup_exit=$?
          if (( setup_exit != 0 )); then
            printf 'diagnostic_setup_exit=%s\n' "${setup_exit}"
            exit "${setup_exit}"
          fi

          printf 'Diagnostic only; these probes do not establish license compliance.\n' > "${summary_file}"

          probe_http() {
            local scope="$1"
            local label="$2"
            local url="$3"
            local header_file="${raw_directory}/${scope}-${label}.headers"
            local body_file="${raw_directory}/${scope}-${label}.body"
            local error_file="${raw_directory}/${scope}-${label}.stderr"
            local artifact_prefix="${ORT_DIAGNOSTIC_DIRECTORY}/${scope}-${label}"
            local status="000"
            local command_exit=0
            local header_bytes=0
            local body_bytes=0
            local error_bytes=0

            if [[ "${scope}" == "runner" ]]; then
              if status=$(curl --disable --silent --show-error \
                --connect-timeout 4 --max-time 10 --max-filesize 32768 \
                --dump-header "${header_file}" --output "${body_file}" \
                --write-out '%{http_code}' "${url}" 2>"${error_file}"); then
                command_exit=0
              else
                command_exit=$?
              fi
            elif [[ "${scope}" == "ort-container" ]]; then
              local container_header_file="${container_raw_directory}/${scope}-${label}.headers"
              local container_body_file="${container_raw_directory}/${scope}-${label}.body"
              if [[ "${ORT_DIAGNOSTIC_IMAGE}" != *@sha256:* ]]; then
                command_exit=90
                printf 'Refused unpinned ORT image reference.\n' > "${error_file}"
              elif status=$(timeout --signal=TERM --kill-after=5s 20s docker run --rm \
                --mount "type=bind,source=${HOME},target=/home/ort" \
                --user "$(id -u):$(id -g)" \
                -e "JDK_JAVA_OPTIONS=${ORT_JDK_JAVA_OPTIONS:-}" \
                -e "ORT_DATA_DIR=/home/ort/${ORT_HOME_PATH:-.ort}" \
                --entrypoint curl "${ORT_DIAGNOSTIC_IMAGE}" \
                --disable --silent --show-error \
                --connect-timeout 4 --max-time 10 --max-filesize 32768 \
                --dump-header "${container_header_file}" --output "${container_body_file}" \
                --write-out '%{http_code}' "${url}" 2>"${error_file}"); then
                command_exit=0
              else
                command_exit=$?
              fi
            else
              command_exit=90
              printf 'Unsupported diagnostic scope.\n' > "${error_file}"
            fi

            if [[ ! "${status}" =~ ^[0-9]{3}$ ]]; then
              status="000"
            fi

            if [[ -f "${header_file}" ]]; then
              sed -E 's/^(Set-Cookie|Authorization|Proxy-Authorization):.*/\1: <redacted>/I' \
                "${header_file}" | head -c 8192 > "${artifact_prefix}.headers.txt"
            else
              : > "${artifact_prefix}.headers.txt"
            fi
            if [[ -f "${body_file}" ]]; then
              head -c 8192 "${body_file}" > "${artifact_prefix}.body"
            else
              : > "${artifact_prefix}.body"
            fi
            if [[ -f "${error_file}" ]]; then
              head -c 1024 "${error_file}" > "${artifact_prefix}.error.txt"
            else
              : > "${artifact_prefix}.error.txt"
            fi

            header_bytes=$(wc -c < "${artifact_prefix}.headers.txt" | tr -d '[:space:]')
            body_bytes=$(wc -c < "${artifact_prefix}.body" | tr -d '[:space:]')
            error_bytes=$(wc -c < "${artifact_prefix}.error.txt" | tr -d '[:space:]')
            printf 'probe=%s-%s command_exit=%s http_status=%s header_bytes=%s body_bytes=%s error_bytes=%s\n' \
              "${scope}" "${label}" "${command_exit}" "${status}" \
              "${header_bytes}" "${body_bytes}" "${error_bytes}" | tee -a "${summary_file}"

            last_command_exit="${command_exit}"
            last_http_status="${status}"
          }

          probe_http runner jsr305 "${MAVEN_POM_URL}"
          runner_pom_exit="${last_command_exit}"
          runner_pom_status="${last_http_status}"
          probe_http ort-container jsr305 "${MAVEN_POM_URL}"
          container_pom_exit="${last_command_exit}"
          container_pom_status="${last_http_status}"

          if [[ "${runner_pom_exit}" != "0" || "${runner_pom_status}" != "200" || \
                "${container_pom_exit}" != "0" || "${container_pom_status}" != "200" ]]; then
            probe_http runner cdn-cgi-trace "${MAVEN_TRACE_URL}"
            probe_http ort-container cdn-cgi-trace "${MAVEN_TRACE_URL}"
          fi

      - name: Upload ORT results, including partial analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && steps.ort.outcome != 'skipped' }}
        with:
          name: ort-result-gradle-${{ github.sha }}
          path: ${{ steps.ort.outputs.results-path }}
          if-no-files-found: error
      - name: Upload Gradle ORT connectivity diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && (steps.ort.outcome == 'failure' || steps.gradle_analyzer_guard.outcome == 'failure') }}
        with:
          name: ort-gradle-maven-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ort-gradle-maven-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
      - name: Summarize ORT report
        if: github.event_name == 'pull_request'
        run: |
          SUMMARY_FILE=$(find "${{ steps.ort.outputs.results-path }}" -maxdepth 1 -name 'scan-summary-*.md' -print | head -n 1)
          if [ -f "$SUMMARY_FILE" ]; then
            {
              echo "### 📜 License Scan Summary (Gradle)"
              cat "$SUMMARY_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  ort-npm:
    name: License Gate (NPM)
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (github.event_name != 'pull_request' || needs.changes.outputs.run_npm_ort == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Use HTTPS for Git
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            config/openapi/package-lock.json
            web-client/package-lock.json

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: Run ORT License Scan
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1
        with:
          image: ${{ steps.workflow-tool-versions.outputs.ort-image }}
          ort-cli-args: '-P ort.analyzer.enabledPackageManagers=NPM'
          run: 'cache-dependencies,labels,analyzer,evaluator,reporter'
          fail-on: 'violations'
          report-formats: 'CycloneDx,WebApp'
          ort-cli-report-args: '-O CycloneDX=output.file.formats=json,xml'

      - name: Require complete NPM ORT analysis
        id: npm_analyzer_guard
        shell: bash
        run: |
          if [[ "${ORT_CLI_ANALYZE_EXIT_CODE:-}" != "0" ]]; then
            echo 'ORT analyzer did not complete successfully.' >&2
            exit 1
          fi

      - name: Upload ORT results, including partial analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && steps.ort.outcome != 'skipped' }}
        with:
          name: ort-result-npm-${{ github.sha }}
          path: ${{ steps.ort.outputs.results-path }}
          if-no-files-found: error
      - name: Summarize ORT report
        if: github.event_name == 'pull_request'
        run: |
          SUMMARY_FILE=$(find "${{ steps.ort.outputs.results-path }}" -maxdepth 1 -name 'scan-summary-*.md' -print | head -n 1)
          if [ -f "$SUMMARY_FILE" ]; then
            {
              echo "### 📜 License Scan Summary (NPM)"
              cat "$SUMMARY_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  license-gate:
    name: License Gate
    needs: [changes, ort-gradle, ort-npm]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      checks: read # Preserve a prior successful required context on metadata-only edits.
      contents: read # Check out the shared required-gate composite action.
      actions: read # Inspect the matching required-gate job's preservation step.
      statuses: write # Publish acknowledged supplementary metadata gate barriers.
      pull-requests: read # Re-read the current PR tuple before status publication.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out required-gate action
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Preserve successful required gate on metadata-only edit
        id: preserved_gate
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: ./.github/actions/preserve-required-gate
        with:
          gate-name: License Gate
          workflow-name: License Gate
          workflow-file: license-scan.yml
          workflow-path: .github/workflows/license-scan.yml

      - name: Publish pending required gate status
        id: publish-pending-status
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: ./.github/actions/publish-required-gate-status
        with:
          assessment: ${{ steps.preserved_gate.outputs.assessment }}
          gate-name: License Gate
          workflow-name: License Gate
          workflow-file: license-scan.yml
          workflow-path: .github/workflows/license-scan.yml

      - name: Report dependency-deferred required gate
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        env:
          PUBLISHER_OUTCOME: ${{ steps.publish-pending-status.outcome }}
          ASSESSMENT: ${{ steps.preserved_gate.outputs.assessment }}
          PUBLICATION: ${{ steps.publish-pending-status.outputs.publication }}
        run: |
          case "$PUBLISHER_OUTCOME/$ASSESSMENT/$PUBLICATION" in
            success/dependency-deferred/pending-acknowledged|success/success/unchanged|success/success/success-acknowledged|success/success/pending-acknowledged)
              ;;
            *)
              echo "Required-gate assessment or status acknowledgment is unavailable; dependency-deferred failure." >&2
              exit 1
              ;;
          esac

      - name: Verify ORT results
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_GRADLE_ORT: ${{ needs.changes.outputs.run_gradle_ort }}
          GRADLE_ORT_RESULT: ${{ needs['ort-gradle'].result }}
          RUN_NPM_ORT: ${{ needs.changes.outputs.run_npm_ort }}
          NPM_ORT_RESULT: ${{ needs['ort-npm'].result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "License change detection did not complete successfully: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$RUN_GRADLE_ORT" != "true" ] && [ "$RUN_GRADLE_ORT" != "false" ]; then
              echo "License change detection returned an invalid Gradle result: $RUN_GRADLE_ORT" >&2
              exit 1
            fi
            if [ "$RUN_NPM_ORT" != "true" ] && [ "$RUN_NPM_ORT" != "false" ]; then
              echo "License change detection returned an invalid NPM result: $RUN_NPM_ORT" >&2
              exit 1
            fi
            if [ "$RUN_GRADLE_ORT" = "true" ] && [ "$GRADLE_ORT_RESULT" != "success" ]; then
              echo "Gradle ORT did not succeed: $GRADLE_ORT_RESULT" >&2
              exit 1
            fi
            if [ "$RUN_NPM_ORT" = "true" ] && [ "$NPM_ORT_RESULT" != "success" ]; then
              echo "NPM ORT did not succeed: $NPM_ORT_RESULT" >&2
              exit 1
            fi
          else
            if [ "$GRADLE_ORT_RESULT" != "success" ]; then
              echo "Gradle ORT did not succeed: $GRADLE_ORT_RESULT" >&2
              exit 1
            fi
            if [ "$NPM_ORT_RESULT" != "success" ]; then
              echo "NPM ORT did not succeed: $NPM_ORT_RESULT" >&2
              exit 1
            fi
          fi
