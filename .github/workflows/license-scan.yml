name: License Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  ORT_DOCKER_IMAGE: ghcr.io/oss-review-toolkit/ort:89.2.0

concurrency:
  group: license-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect License-Relevant Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
    outputs:
      run_gradle_ort: ${{ steps.filter.outputs.gradle }}
      run_npm_ort: ${{ steps.filter.outputs.npm }}
      run_any_ort: ${{ steps.filter.outputs.gradle == 'true' || steps.filter.outputs.npm == 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect dependency-relevant changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            gradle:
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'buildSrc/**'
              - 'gradle/**'
              - '**/build.gradle.kts'
              - '**/settings.gradle.kts'
              - '**/gradle.properties'
              - '**/gradle-wrapper.properties'
              - '**/gradle-wrapper.jar'
              - '.github/workflows/license-scan.yml'
              - '.github/workflows/release-notes.yml'
              - '.github/workflows/ort-advisory.yml'
            npm:
              - 'package.json'
              - 'package-lock.json'
              - 'config/openapi/package.json'
              - 'config/openapi/package-lock.json'
              - 'web-client/package.json'
              - 'web-client/package-lock.json'
              - '.github/workflows/license-scan.yml'
              - '.github/workflows/release-notes.yml'
              - '.github/workflows/ort-advisory.yml'

  ort-gradle:
    name: License Gate (Gradle)
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (github.event_name != 'pull_request' || needs.changes.outputs.run_gradle_ort == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Use HTTPS for Git
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            config/openapi/package-lock.json
            web-client/package-lock.json

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Run ORT License Scan
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1
        with:
          image: ${{ env.ORT_DOCKER_IMAGE }}
          ort-cli-args: '-P ort.analyzer.enabledPackageManagers=Gradle'
          run: 'cache-dependencies,labels,analyzer,evaluator,reporter'
          fail-on: policy-violation
          report-formats: 'CycloneDx,WebApp'
          ort-cli-report-args: '-O CycloneDX=output.file.formats=json,xml'

      - name: Upload ORT results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ort-result-gradle-${{ github.sha }}
          path: ${{ steps.ort.outputs.results-path }}
      - name: Summarize ORT report
        if: github.event_name == 'pull_request'
        run: |
          SUMMARY_FILE=$(find "${{ steps.ort.outputs.results-path }}" -maxdepth 1 -name 'scan-summary-*.md' -print | head -n 1)
          if [ -f "$SUMMARY_FILE" ]; then
            {
              echo "### 📜 License Scan Summary (Gradle)"
              cat "$SUMMARY_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  ort-npm:
    name: License Gate (NPM)
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (github.event_name != 'pull_request' || needs.changes.outputs.run_npm_ort == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Use HTTPS for Git
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            config/openapi/package-lock.json
            web-client/package-lock.json

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Run ORT License Scan
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1
        with:
          image: ${{ env.ORT_DOCKER_IMAGE }}
          ort-cli-args: '-P ort.analyzer.enabledPackageManagers=NPM'
          run: 'cache-dependencies,labels,analyzer,evaluator,reporter'
          fail-on: policy-violation
          report-formats: 'CycloneDx,WebApp'
          ort-cli-report-args: '-O CycloneDX=output.file.formats=json,xml'

      - name: Upload ORT results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ort-result-npm-${{ github.sha }}
          path: ${{ steps.ort.outputs.results-path }}
      - name: Summarize ORT report
        if: github.event_name == 'pull_request'
        run: |
          SUMMARY_FILE=$(find "${{ steps.ort.outputs.results-path }}" -maxdepth 1 -name 'scan-summary-*.md' -print | head -n 1)
          if [ -f "$SUMMARY_FILE" ]; then
            {
              echo "### 📜 License Scan Summary (NPM)"
              cat "$SUMMARY_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  license-gate:
    name: License Gate
    needs: [changes, ort-gradle, ort-npm]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      checks: read
      contents: read
    steps:
      - name: Preserve successful required gate on metadata-only edit
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_GATE_NAME: License Gate
        run: |
          for attempt in $(seq 1 80); do
            prior_state=$(gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              -f check_name="${REQUIRED_GATE_NAME}" \
              -f filter=all \
              -f per_page=100 \
              --jq "[.check_runs[] | select(.app.slug == \"github-actions\" and (.details_url | contains(\"/actions/runs/${GITHUB_RUN_ID}/\") | not))] | sort_by(.started_at // .created_at) | last | [(.status // \"\"), (.conclusion // \"\")] | @tsv")
            IFS=$'\t' read -r prior_status prior_conclusion <<< "${prior_state}"
            if [ "${prior_status}" = "completed" ]; then
              if [ "${prior_conclusion}" = "success" ]; then
                exit 0
              fi
              echo "Latest prior ${REQUIRED_GATE_NAME} for unchanged head ${HEAD_SHA} concluded ${prior_conclusion:-unknown}." >&2
              exit 1
            fi
            if [ "${attempt}" -eq 80 ]; then
              echo "Timed out waiting for the prior ${REQUIRED_GATE_NAME} on unchanged head ${HEAD_SHA}." >&2
              exit 1
            fi
            sleep 15
          done

      - name: Harden runner
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Verify ORT results
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_GRADLE_ORT: ${{ needs.changes.outputs.run_gradle_ort }}
          GRADLE_ORT_RESULT: ${{ needs['ort-gradle'].result }}
          RUN_NPM_ORT: ${{ needs.changes.outputs.run_npm_ort }}
          NPM_ORT_RESULT: ${{ needs['ort-npm'].result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "License change detection did not complete successfully: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$RUN_GRADLE_ORT" != "true" ] && [ "$RUN_GRADLE_ORT" != "false" ]; then
              echo "License change detection returned an invalid Gradle result: $RUN_GRADLE_ORT" >&2
              exit 1
            fi
            if [ "$RUN_NPM_ORT" != "true" ] && [ "$RUN_NPM_ORT" != "false" ]; then
              echo "License change detection returned an invalid NPM result: $RUN_NPM_ORT" >&2
              exit 1
            fi
            if [ "$RUN_GRADLE_ORT" = "true" ] && [ "$GRADLE_ORT_RESULT" != "success" ]; then
              echo "Gradle ORT did not succeed: $GRADLE_ORT_RESULT" >&2
              exit 1
            fi
            if [ "$RUN_NPM_ORT" = "true" ] && [ "$NPM_ORT_RESULT" != "success" ]; then
              echo "NPM ORT did not succeed: $NPM_ORT_RESULT" >&2
              exit 1
            fi
          else
            if [ "$GRADLE_ORT_RESULT" != "success" ]; then
              echo "Gradle ORT did not succeed: $GRADLE_ORT_RESULT" >&2
              exit 1
            fi
            if [ "$NPM_ORT_RESULT" != "success" ]; then
              echo "NPM ORT did not succeed: $NPM_ORT_RESULT" >&2
              exit 1
            fi
          fi
