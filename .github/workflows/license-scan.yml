name: License Scan

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - '**/build.gradle*'
      - '**/pom.xml'
      - '**/package.json'
      - '**/yarn.lock'
      - '**/requirements.txt'
      - '**/setup.py'
      - '.github/workflows/license-scan.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ort-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Use HTTPS for Git
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run ORT License Scan
        uses: oss-review-toolkit/ort-ci-github-action@v1
        with:
          fail-on: policy-violation

      - name: Upload ORT results
        uses: actions/upload-artifact@v4
        with:
          name: ort-result-${{ github.sha }}
          path: |
            ort-results/*
      - name: Summarize ORT report
        if: github.event_name == 'pull_request'
        run: |
          SUMMARY_FILE=$(ls ort-results/scan-summary-*.md 2>/dev/null | head -n 1)
          if [ -f "$SUMMARY_FILE" ]; then
            echo "### 📜 License Scan Summary" >> $GITHUB_STEP_SUMMARY
            cat "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
          fi
