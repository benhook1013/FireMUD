name: Trusted Hosted Identity Request

on:
  workflow_run:
    workflows: [PR Preview Environment]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  actions: read # Inspect the completed source workflow and its artifacts.
  contents: read # Check out the trusted default-branch workflow implementation.

jobs:
  validate-target:
    name: Validate Trusted Preview Target
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.name == 'PR Preview Environment') || (github.event_name == 'pull_request_target' && github.event.action == 'closed') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # Inspect the completed source workflow and its artifacts.
      contents: read # Check out the trusted default-branch validation implementation.
      pull-requests: read # Read immutable pull-request target metadata.
    outputs:
      action: ${{ steps.target.outputs.action }}
      pr_number: ${{ steps.target.outputs.pr_number }}
      base_sha: ${{ steps.target.outputs.base_sha }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      merge_sha: ${{ steps.target.outputs.merge_sha }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      namespace: ${{ steps.target.outputs.namespace }}
      hostname: ${{ steps.target.outputs.hostname }}
      render_run_id: ${{ steps.source.outputs.render_run_id }}
      artifact_name: ${{ steps.source.outputs.artifact_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up GitHub CLI
        run: gh --version

      - name: Verify workflow source and immutable PR metadata
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            test -n "$WORKFLOW_RUN_ID"
            source_path="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}" --jq '.path')"
            test "$source_path" = '.github/workflows/preview.yml'
            PR_NUMBER="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}" --jq '.pull_requests[0].number // empty')"
            test -n "$PR_NUMBER"
            ACTION=deploy
            EXPECTED_HEAD_SHA="$WORKFLOW_RUN_HEAD_SHA"
          elif [[ "$EVENT_NAME" == pull_request_target ]]; then
            PR_NUMBER="$EVENT_PR_NUMBER"
            ACTION=destroy
            EXPECTED_HEAD_SHA="$EVENT_HEAD_SHA"
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$ACTION" == deploy || "$ACTION" == destroy ]]
          pull_request_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          repository="$(jq -r '.head.repo.full_name // empty' <<<"$pull_request_json")"
          base_ref="$(jq -r '.base.ref // empty' <<<"$pull_request_json")"
          state="$(jq -r '.state // empty' <<<"$pull_request_json")"
          current_head_sha="$(jq -r '.head.sha // empty' <<<"$pull_request_json")"
          base_sha="$(jq -r '.base.sha // empty' <<<"$pull_request_json")"
          merge_sha="$(jq -r '.merge_commit_sha // empty' <<<"$pull_request_json")"
          labels_json="$(jq -c '.labels // null' <<<"$pull_request_json")"
          label_metadata="$(python3 ./dev-tools/hosted/preview/preview-eligibility.py \
            --inspect-labels --labels-json "$labels_json")"
          labels_valid="$(sed -n 's/^labels_valid=//p' <<<"$label_metadata")"
          emit_no_action() {
            echo "$1"
            echo 'action=none' >> "$GITHUB_OUTPUT"
            exit 0
          }
          normalize_head_sha() {
            local head_sha="$1"
            [[ "$head_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
            printf '%s' "${head_sha,,}"
          }
          if ! EXPECTED_HEAD_SHA="$(normalize_head_sha "$EXPECTED_HEAD_SHA")"; then
            emit_no_action "Ignoring lifecycle event with an invalid expected head SHA."
          fi
          if ! current_head_sha="$(normalize_head_sha "$current_head_sha")"; then
            emit_no_action "Ignoring pull request metadata with an invalid current head SHA."
          fi
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            [[ "$state" == open ]] || emit_no_action \
              "Source render completed after PR closure; no preview activation is required."
            [[ "$repository" == "$GITHUB_REPOSITORY" ]] || emit_no_action \
              "Ignoring source render because the current PR head repository is not trusted."
            [[ "$base_ref" == main || "$base_ref" == develop ]] || emit_no_action \
              "Ignoring source render because the current PR base branch is unsupported."
            [[ "$current_head_sha" == "$EXPECTED_HEAD_SHA" ]] || emit_no_action \
              "Ignoring stale source render for an earlier PR head."
            [[ "$labels_valid" == true ]] || emit_no_action \
              "Refusing hosted preview lifecycle action: PR label metadata is missing or malformed."
            expected_artifact_name="preview-render-pr-${PR_NUMBER}-${EXPECTED_HEAD_SHA}"
            if ! artifacts_json="$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/artifacts?per_page=100")"; then
              emit_no_action "Ignoring source render because its artifacts could not be verified."
            fi
            artifact_count="$(jq --arg name "$expected_artifact_name" \
              '[.[].artifacts[] | select(.name == $name and .expired == false)] | length' \
              <<<"$artifacts_json")"
            [[ "$artifact_count" == 1 ]] || emit_no_action \
              "Ignoring source render without exactly one current ${expected_artifact_name} artifact."
            ACTION=deploy
          else
            [[ "$repository" == "$GITHUB_REPOSITORY" ]] || emit_no_action \
              "Ignoring closed pull request because its head repository is not trusted."
            [[ "$base_ref" == main || "$base_ref" == develop ]] || emit_no_action \
              "Ignoring closed pull request because its base branch is unsupported."
            [[ "$state" == closed ]] || emit_no_action \
              "Ignoring closed pull request because it has been reopened."
          fi
          [[ "$current_head_sha" == "$EXPECTED_HEAD_SHA" ]] || emit_no_action \
            "Ignoring stale closed pull request for an earlier PR head."
          {
            echo "action=${ACTION}"
            echo "pr_number=${PR_NUMBER}"
            echo "base_sha=${base_sha}"
            echo "head_sha=${current_head_sha}"
            echo "merge_sha=${merge_sha:-$current_head_sha}"
            echo "image_tag=${current_head_sha}"
            echo "namespace=pr-${PR_NUMBER}"
            echo "hostname=pr-${PR_NUMBER}.preview.firedevops.net"
          } >> "$GITHUB_OUTPUT"

      - name: Locate and validate source render run
        id: source
        if: ${{ steps.target.outputs.action == 'deploy' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail
          render_run_id="$SOURCE_RUN_ID"
          test -n "$render_run_id"
          source_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${render_run_id}")"
          test "$(jq -r '.conclusion' <<<"$source_json")" = success
          test "$(jq -r '.head_sha' <<<"$source_json")" = "$HEAD_SHA"
          test "$(jq -r '.path' <<<"$source_json")" = '.github/workflows/preview.yml'
          test "$(jq -r '.event' <<<"$source_json")" = pull_request
          test "$(jq -r '.repository.full_name' <<<"$source_json")" = "$GITHUB_REPOSITORY"
          {
            echo "render_run_id=${render_run_id}"
            echo "artifact_name=preview-render-pr-${PR_NUMBER}-${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"

  deploy-runtime:
    name: Prepare Validated Preview Runtime
    runs-on:
      - self-hosted
      - preview
    needs: validate-target
    if: ${{ needs.validate-target.outputs.action == 'deploy' }}
    environment: pr-preview
    concurrency:
      group: preview-allocation-lifecycle
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read # Download the validated source workflow artifact.
      contents: read # Check out the trusted default-branch deployment implementation.
      packages: read # Pull the trusted runtime images from GHCR.
      pull-requests: read # Revalidate the current pull-request target before deployment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.33.4

      - name: Set up Helm
        run: |
          set -euo pipefail
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION='v3.20.1'
            HELM_SHA256='0165ee4a2db012cc657381001e593e981f42aa5707acdd50658326790c9d0dc3'
            INSTALL_DIR="$RUNNER_TEMP/bin"
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "$RUNNER_TEMP/helm.tgz"
            printf '%s  %s\n' "$HELM_SHA256" "$RUNNER_TEMP/helm.tgz" | sha256sum --check --status
            tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP"
            install "$RUNNER_TEMP/linux-amd64/helm" "$INSTALL_DIR/helm"
            echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          fi
          helm version

      - name: Write runtime kubeconfig
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.PREVIEW_RUNTIME_KUBECONFIG }}
          path: ${{ runner.temp }}/preview-runtime.kubeconfig

      - name: Download source render artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.validate-target.outputs.artifact_name }}
          path: ${{ runner.temp }}/preview-artifact
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate-target.outputs.render_run_id }}

      - name: Verify artifact provenance, checksum, and closed object set
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/preview-artifact
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          HOSTNAME: ${{ needs.validate-target.outputs.hostname }}
          SOURCE_RUN_ID: ${{ needs.validate-target.outputs.render_run_id }}
        run: |
          python3 ./dev-tools/hosted/preview/validate-preview-artifact.py \
            "$ARTIFACT_DIR/preview-metadata.json" \
            "$ARTIFACT_DIR/preview-rendered-sanitized.yaml" \
            "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" "$PR_NUMBER" "$BASE_SHA" \
            "$HEAD_SHA" "$MERGE_SHA" "$IMAGE_TAG" "$HOSTNAME"

      - name: Revalidate open PR before privileged deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA"

      - name: Prune stale runtime namespaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./dev-tools/hosted/preview/prune-stale-preview-namespaces.sh --apply

      - name: Enforce priority-aware preview capacity
        id: allocate-capacity
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_MAX_ACTIVE: ${{ vars.PREVIEW_MAX_ACTIVE }}
        run: |
          bash ./dev-tools/hosted/preview/allocate-preview-capacity.sh \
            "${{ needs.validate-target.outputs.namespace }}" \
            "${PREVIEW_MAX_ACTIVE:-1}" \
            "${{ needs.validate-target.outputs.pr_number }}" \
            "${{ needs.validate-target.outputs.head_sha }}"

      - name: Allocate stable preview Telnet port
        id: allocate-telnet-port
        run: |
          set -euo pipefail
          port="$(bash ./dev-tools/hosted/preview/allocate-preview-telnet-port.sh \
            "${{ needs.validate-target.outputs.namespace }}" \
            "${{ needs.validate-target.outputs.pr_number }}")"
          [[ "$port" =~ ^32(00[0-9]|01[0-5])$ ]]
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Create and annotate exact preview runtime namespace
        env:
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          TELNET_PORT: ${{ steps.allocate-telnet-port.outputs.port }}
          ALLOCATION_TIMESTAMP: ${{ steps.allocate-capacity.outputs.allocation_timestamp }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_NAMESPACE" == "pr-${PR_NUMBER}" ]]
          [[ "$TELNET_PORT" =~ ^32(00[0-9]|01[0-5])$ ]]
          [[ "$ALLOCATION_TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^[:space:]]+Z$ ]]
          kubectl create namespace "$RUNTIME_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          bash ./dev-tools/hosted/preview/annotate-preview-namespace.sh \
            "$RUNTIME_NAMESPACE" "$PR_NUMBER" "$HEAD_SHA" "$IMAGE_TAG" \
            "$TELNET_PORT" "$ALLOCATION_TIMESTAMP"

      - name: Write requester kubeconfig
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.HOSTED_IDENTITY_REQUESTER_KUBECONFIG }}
          path: ${{ runner.temp }}/hosted-identity-requester.kubeconfig

      - name: Revalidate open PR before Active request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA"

      - name: Apply canonical Active request
        env:
          IDENTITY_NAME: pr-${{ needs.validate-target.outputs.pr_number }}
        run: |
          cat <<EOF | kubectl -n firemud-system apply -f -
          apiVersion: platform.firemud.dev/v1alpha1
          kind: HostedEnvironmentIdentity
          metadata:
            name: ${IDENTITY_NAME}
            namespace: firemud-system
          spec:
            desiredState: Active
          EOF

      - name: Restore preview runtime kubeconfig
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.PREVIEW_RUNTIME_KUBECONFIG }}
          path: ${{ runner.temp }}/preview-runtime.kubeconfig

      - name: Wait for all controller identity projections
        env:
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          IDENTITY_NAME: pr-${{ needs.validate-target.outputs.pr_number }}
        run: |
          bash ./dev-tools/hosted/preview/wait-for-hosted-identity.sh \
            --projections "$IDENTITY_NAME" "$RUNTIME_NAMESPACE" 900

      - name: Inject trusted allocated Telnet port
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/preview-artifact
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          TELNET_PORT: ${{ steps.allocate-telnet-port.outputs.port }}
        run: |
          set -euo pipefail
          python3 ./dev-tools/hosted/preview/validate-preview-artifact.py \
            inject "$ARTIFACT_DIR/preview-rendered-sanitized.yaml" \
            "$RUNNER_TEMP/preview-rendered-with-port.yaml" \
            "$RUNTIME_NAMESPACE" "$TELNET_PORT"

      - name: Wait for fixed-head runtime images
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./dev-tools/hosted/shared/wait-for-runtime-images.sh "${{ needs.validate-target.outputs.image_tag }}"

      - name: Ensure trusted runtime pull secret
        env:
          PREVIEW_GHCR_USERNAME: ${{ secrets.PREVIEW_GHCR_USERNAME }}
          PREVIEW_GHCR_TOKEN: ${{ secrets.PREVIEW_GHCR_TOKEN }}
        run: bash ./dev-tools/hosted/shared/ensure-ghcr-pull-secret.sh "${{ needs.validate-target.outputs.namespace }}"

      - name: Create canonical non-identity runtime credentials
        env:
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
        run: |
          set -euo pipefail
          umask 077
          credential_files_dir=""
          cleanup_credential_files() {
            if [[ -n "$credential_files_dir" && -d "$credential_files_dir" ]]; then
              rm -rf -- "$credential_files_dir"
            fi
          }
          trap cleanup_credential_files EXIT
          credential_files_dir="$(mktemp -d -- "${RUNNER_TEMP:?}/firemud-runtime-credentials.XXXXXX")"
          chmod 700 "$credential_files_dir"
          write_credential_file() {
            local file_name="$1"
            local value="$2"
            printf '%s' "$value" >"$credential_files_dir/$file_name"
            chmod 600 "$credential_files_dir/$file_name"
          }
          reject_existing_secret() {
            local secret_name="$1"
            local reason="$2"
            echo "::error::Existing Secret ${RUNTIME_NAMESPACE}/${secret_name} is invalid (${reason}). Recycle the disposable preview namespace before retrying; credentials were not changed." >&2
            exit 1
          }
          read_secret_if_present() {
            local secret_name="$1"
            if ! secret_json="$(kubectl -n "$RUNTIME_NAMESPACE" get secret "$secret_name" --ignore-not-found -o json)"; then
              echo "::error::Unable to read Secret ${RUNTIME_NAMESPACE}/${secret_name}; credentials were not changed." >&2
              exit 1
            fi
            [[ -n "$secret_json" ]]
          }
          reject_existing_configmap() {
            local configmap_name="$1"
            local reason="$2"
            echo "::error::Existing ConfigMap ${RUNTIME_NAMESPACE}/${configmap_name} is invalid (${reason}). Recycle the disposable preview namespace before retrying; credentials were not changed." >&2
            exit 1
          }
          read_configmap_if_present() {
            local configmap_name="$1"
            if ! configmap_json="$(kubectl -n "$RUNTIME_NAMESPACE" get configmap "$configmap_name" --ignore-not-found -o json)"; then
              echo "::error::Unable to read ConfigMap ${RUNTIME_NAMESPACE}/${configmap_name}; credentials were not changed." >&2
              exit 1
            fi
            [[ -n "$configmap_json" ]]
          }
          validate_secret_shape() {
            local secret_name="$1"
            local expected_keys_json="$2"
            jq -e \
              --arg name "$secret_name" \
              --arg namespace "$RUNTIME_NAMESPACE" \
              --argjson expected_keys "$expected_keys_json" '
                .apiVersion == "v1" and
                .kind == "Secret" and
                .metadata.name == $name and
                .metadata.namespace == $namespace and
                .type == "Opaque" and
                (.data | type == "object") and
                ((.data | keys | sort) == ($expected_keys | sort))
              ' <<<"$secret_json" >/dev/null ||
              reject_existing_secret "$secret_name" "expected exactly the canonical non-empty keys"
          }
          decode_secret_key() {
            local secret_name="$1"
            local key="$2"
            local encoded_value canonical_encoded_value
            if ! encoded_value="$(jq -er --arg key "$key" '.data[$key] | select(type == "string" and length > 0)' <<<"$secret_json")" ||
              ! decoded_secret_value="$(printf '%s' "$encoded_value" | base64 --decode 2>/dev/null)" ||
              [[ -z "$decoded_secret_value" ]]; then
              reject_existing_secret "$secret_name" "key ${key} is empty or malformed"
            fi
            canonical_encoded_value="$(printf '%s' "$decoded_secret_value" | base64 --wrap=0)"
            if [[ "$canonical_encoded_value" != "$encoded_value" ]]; then
              reject_existing_secret "$secret_name" "key ${key} is empty or malformed"
            fi
          }
          validate_configmap_shape() {
            local configmap_name="$1"
            local expected_keys_json="$2"
            jq -e \
              --arg name "$configmap_name" \
              --arg namespace "$RUNTIME_NAMESPACE" \
              --argjson expected_keys "$expected_keys_json" '
                .apiVersion == "v1" and
                .kind == "ConfigMap" and
                .metadata.name == $name and
                .metadata.namespace == $namespace and
                (.data | type == "object") and
                ((.data | keys | sort) == ($expected_keys | sort)) and
                ((.binaryData // {}) == {})
              ' <<<"$configmap_json" >/dev/null ||
              reject_existing_configmap "$configmap_name" "expected exactly the canonical data keys"
          }
          validate_diagnostic_jwks() {
            local expected_fingerprint="$1"
            local diagnostic_jwks
            if ! diagnostic_jwks="$(jq -er '.data["jwks.json"] | select(type == "string" and length > 0)' <<<"$configmap_json")" ||
              ! jq -e --arg fingerprint "$expected_fingerprint" '
                type == "object" and
                ((keys | sort) == ["firemudDiagnostic", "keys"]) and
                .keys == [] and
                (.firemudDiagnostic | type == "object") and
                ((.firemudDiagnostic | keys | sort) == ["purpose", "sha256"]) and
                .firemudDiagnostic.purpose == "shared-hmac-secret-path-fingerprint" and
                .firemudDiagnostic.sha256 == $fingerprint
              ' <<<"$diagnostic_jwks" >/dev/null; then
              reject_existing_configmap jwt-jwks "diagnostic content does not match the signing Secret"
            fi
          }

          firemud_secret_exists=false
          if read_secret_if_present firemud-secret; then
            firemud_secret_exists=true
            validate_secret_shape firemud-secret \
              '["FIREMUD_POSTGRES_USER","FIREMUD_POSTGRES_PASSWORD","ASSET_STORE_ACCESS_KEY","ASSET_STORE_SECRET_KEY"]'
            decode_secret_key firemud-secret FIREMUD_POSTGRES_USER
            postgres_user="$decoded_secret_value"
            if [[ "$postgres_user" != firemud ]]; then
              reject_existing_secret firemud-secret "PostgreSQL user is not canonical"
            fi
            decode_secret_key firemud-secret FIREMUD_POSTGRES_PASSWORD
            postgres_password="$decoded_secret_value"
            decode_secret_key firemud-secret ASSET_STORE_ACCESS_KEY
            asset_store_access_key="$decoded_secret_value"
            decode_secret_key firemud-secret ASSET_STORE_SECRET_KEY
            asset_store_secret_key="$decoded_secret_value"
            if [[ "$postgres_password" == firemud ||
              "$asset_store_access_key" == minio ||
              "$asset_store_secret_key" == minio123 ]]; then
              reject_existing_secret firemud-secret "legacy weak credential value"
            fi
          fi

          minio_secret_exists=false
          if read_secret_if_present minio-credentials; then
            minio_secret_exists=true
            validate_secret_shape minio-credentials '["accessKey","secretKey"]'
            decode_secret_key minio-credentials accessKey
            minio_access_key="$decoded_secret_value"
            decode_secret_key minio-credentials secretKey
            minio_secret_key="$decoded_secret_value"
            if [[ "$minio_access_key" == minio || "$minio_secret_key" == minio123 ]]; then
              reject_existing_secret minio-credentials "legacy weak credential value"
            fi
          fi

          if [[ "$firemud_secret_exists" == true && "$minio_secret_exists" == true ]] &&
            [[ "$asset_store_access_key" != "$minio_access_key" ||
              "$asset_store_secret_key" != "$minio_secret_key" ]]; then
            reject_existing_secret minio-credentials "MinIO credentials do not match the application Secret"
          fi

          jwt_signing_secret_exists=false
          if read_secret_if_present jwt-signing-keys; then
            jwt_signing_secret_exists=true
            validate_secret_shape jwt-signing-keys '["current.key"]'
            decode_secret_key jwt-signing-keys current.key
            signing_key="$decoded_secret_value"
            if [[ ! "$signing_key" =~ ^[0-9a-f]{64}$ ]]; then
              reject_existing_secret jwt-signing-keys "current.key is not canonical"
            fi
          fi

          jwt_jwks_exists=false
          if read_configmap_if_present jwt-jwks; then
            jwt_jwks_exists=true
            validate_configmap_shape jwt-jwks '["jwks.json"]'
            if [[ "$jwt_signing_secret_exists" != true ]]; then
              reject_existing_configmap jwt-jwks "signing Secret is absent and cannot be reconstructed"
            fi
          fi

          if [[ "$firemud_secret_exists" != true ]]; then
            postgres_user=firemud
            postgres_password="$(openssl rand -hex 32)"
            if [[ "$minio_secret_exists" == true ]]; then
              asset_store_access_key="$minio_access_key"
              asset_store_secret_key="$minio_secret_key"
            else
              asset_store_access_key="$(openssl rand -hex 16)"
              asset_store_secret_key="$(openssl rand -hex 32)"
            fi
          fi
          if [[ "$jwt_signing_secret_exists" != true ]]; then
            signing_key="$(openssl rand -hex 32)"
          fi
          signing_key_sha256="$(printf '%s' "$signing_key" | sha256sum | awk '{print $1}')"
          diagnostic_jwks="$(jq -nc --arg fingerprint "$signing_key_sha256" \
            '{keys:[],firemudDiagnostic:{purpose:"shared-hmac-secret-path-fingerprint",sha256:$fingerprint}}')"
          if [[ "$jwt_jwks_exists" == true ]]; then
            validate_diagnostic_jwks "$signing_key_sha256"
          fi

          if [[ "$firemud_secret_exists" != true ]]; then
            write_credential_file FIREMUD_POSTGRES_USER "$postgres_user"
            write_credential_file FIREMUD_POSTGRES_PASSWORD "$postgres_password"
            write_credential_file ASSET_STORE_ACCESS_KEY "$asset_store_access_key"
            write_credential_file ASSET_STORE_SECRET_KEY "$asset_store_secret_key"
          fi
          if [[ "$minio_secret_exists" != true ]]; then
            minio_access_key="$asset_store_access_key"
            minio_secret_key="$asset_store_secret_key"
            write_credential_file accessKey "$minio_access_key"
            write_credential_file secretKey "$minio_secret_key"
          fi
          if [[ "$jwt_signing_secret_exists" != true ]]; then
            write_credential_file current.key "$signing_key"
          fi
          if [[ "$jwt_jwks_exists" != true ]]; then
            write_credential_file jwks.json "$diagnostic_jwks"
          fi

          if [[ "$firemud_secret_exists" != true ]]; then
            kubectl -n "$RUNTIME_NAMESPACE" create secret generic firemud-secret \
              --from-file="FIREMUD_POSTGRES_USER=${credential_files_dir}/FIREMUD_POSTGRES_USER" \
              --from-file="FIREMUD_POSTGRES_PASSWORD=${credential_files_dir}/FIREMUD_POSTGRES_PASSWORD" \
              --from-file="ASSET_STORE_ACCESS_KEY=${credential_files_dir}/ASSET_STORE_ACCESS_KEY" \
              --from-file="ASSET_STORE_SECRET_KEY=${credential_files_dir}/ASSET_STORE_SECRET_KEY"
          fi
          if [[ "$minio_secret_exists" != true ]]; then
            kubectl -n "$RUNTIME_NAMESPACE" create secret generic minio-credentials \
              --from-file="accessKey=${credential_files_dir}/accessKey" \
              --from-file="secretKey=${credential_files_dir}/secretKey"
          fi
          if [[ "$jwt_signing_secret_exists" != true ]]; then
            kubectl -n "$RUNTIME_NAMESPACE" create secret generic jwt-signing-keys \
              --from-file="current.key=${credential_files_dir}/current.key"
          fi
          if [[ "$jwt_jwks_exists" != true ]]; then
            kubectl -n "$RUNTIME_NAMESPACE" create configmap jwt-jwks \
              --from-file="jwks.json=${credential_files_dir}/jwks.json"
          fi

          kubectl -n "$RUNTIME_NAMESPACE" create serviceaccount firemud-app --dry-run=client -o yaml | kubectl apply -f -

      - name: Validate trusted preview runtime target
        env:
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          ARTIFACT_PATH: ${{ runner.temp }}/preview-rendered-with-port.yaml
          TELNET_PORT: ${{ steps.allocate-telnet-port.outputs.port }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_NAMESPACE" == "pr-${PR_NUMBER}" ]]
          python3 ./dev-tools/hosted/preview/validate-preview-artifact.py \
            runtime-target "$ARTIFACT_PATH" "$RUNTIME_NAMESPACE" "$TELNET_PORT"

      - name: Final revalidate open PR before server dry-run and apply
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA"

      - name: Apply validated PR runtime artifact
        id: deploy-runtime-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          ARTIFACT_PATH: ${{ runner.temp }}/preview-rendered-with-port.yaml
          TELNET_PORT: ${{ steps.allocate-telnet-port.outputs.port }}
        run: |
          set -euo pipefail
          python3 ./dev-tools/hosted/preview/validate-preview-artifact.py \
            runtime-target "$ARTIFACT_PATH" "$RUNTIME_NAMESPACE" "$TELNET_PORT"
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA"
          kubectl apply --dry-run=server --server-side --field-manager=trusted-hosted-preview -n "$RUNTIME_NAMESPACE" -f "$ARTIFACT_PATH"
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA"
          kubectl apply --server-side --field-manager=trusted-hosted-preview -n "$RUNTIME_NAMESPACE" -f "$ARTIFACT_PATH"

      - name: Record exact deployed preview head
        if: ${{ steps.deploy-runtime-artifact.outcome == 'success' }}
        env:
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_NAMESPACE" == "pr-${PR_NUMBER}" ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          kubectl annotate namespace "$RUNTIME_NAMESPACE" \
            "firemud.dev/last-preview-head-sha=${HEAD_SHA}" \
            --overwrite >/dev/null

      - name: Wait for exact controller identity readiness
        run: |
          bash ./dev-tools/hosted/preview/wait-for-hosted-identity.sh \
            "pr-${{ needs.validate-target.outputs.pr_number }}" \
            "${{ needs.validate-target.outputs.head_sha }}" \
            "${{ needs.validate-target.outputs.namespace }}" 900

      - name: Wait for runtime rollouts before operator validation
        env:
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
        run: |
          set -euo pipefail
          for deployment in \
            postgres redis-coord redis-cache minio \
            account-service automation-scripting-service entity-management-service \
            game-design-service game-logic-service game-session-service \
            logging-admin-service social-groups-service spring-cloud-gateway \
            tcp-proxy-service world-management-service; do
            kubectl -n "$RUNTIME_NAMESPACE" rollout status "deployment/${deployment}" --timeout=120s
          done

      - name: Revalidate prepared preview runtime target
        env:
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          ARTIFACT_PATH: ${{ runner.temp }}/preview-rendered-with-port.yaml
          TELNET_PORT: ${{ steps.allocate-telnet-port.outputs.port }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_NAMESPACE" == "pr-${PR_NUMBER}" ]]
          python3 ./dev-tools/hosted/preview/validate-preview-artifact.py \
            runtime-target "$ARTIFACT_PATH" "$RUNTIME_NAMESPACE" "$TELNET_PORT"

  verify-runtime:
    name: Verify Hosted Preview Runtime
    runs-on:
      - self-hosted
      - preview
    needs: [validate-target, deploy-runtime]
    if: ${{ needs.validate-target.outputs.action == 'deploy' && needs.deploy-runtime.result == 'success' }}
    environment: pr-preview
    concurrency:
      group: preview-allocation-lifecycle
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # Check out the trusted default-branch verification implementation.
      pull-requests: read # Revalidate the pull-request state and exact head before publication.
      issues: write # GitHub's issue-comment API owns pull-request comments.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.33.4

      - name: Write runtime kubeconfig
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.PREVIEW_RUNTIME_KUBECONFIG }}
          path: ${{ runner.temp }}/preview-runtime.kubeconfig

      - name: Wait for exact controller identity projection
        run: |
          bash ./dev-tools/hosted/preview/wait-for-hosted-identity.sh \
            "pr-${{ needs.validate-target.outputs.pr_number }}" \
            "${{ needs.validate-target.outputs.head_sha }}" \
            "${{ needs.validate-target.outputs.namespace }}" 900

      - name: Wait for runtime rollouts
        env:
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
        run: |
          set -euo pipefail
          for deployment in \
            postgres redis-coord redis-cache minio \
            account-service automation-scripting-service entity-management-service \
            game-design-service game-logic-service game-session-service \
            logging-admin-service social-groups-service spring-cloud-gateway \
            tcp-proxy-service world-management-service; do
            kubectl -n "$RUNTIME_NAMESPACE" rollout status "deployment/${deployment}" --timeout=120s
          done

      - name: Read allocated TCP port
        id: runtime-port
        env:
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
        run: |
          set -euo pipefail
          port="$(kubectl -n "$RUNTIME_NAMESPACE" get service tcp-proxy-service -o jsonpath='{.spec.ports[?(@.port==2323)].nodePort}')"
          [[ "$port" =~ ^32(00[0-9]|01[0-5])$ ]]
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Publish trusted preview deployment state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.validate-target.outputs.hostname }}
        with:
          script: |
            const { publishPreviewComment } = require(
              `${process.env.GITHUB_WORKSPACE}/dev-tools/hosted/preview/publish-preview-comment.js`
            );
            await publishPreviewComment({
              github,
              context,
              core,
              mode: "deploying",
              markerPolicy: "preserve-reclaimed",
              statePolicy: "expected-open",
              telnetPort: "available",
              staleDescription: "trusted preview deployment state",
            });

      - name: Smoke hosted preview over TCP
        env:
          PREVIEW_BASE_URL: https://${{ needs.validate-target.outputs.hostname }}
          SMOKE_TELNET_HOST: ${{ needs.validate-target.outputs.hostname }}
          TCP_PORT: ${{ steps.runtime-port.outputs.port }}
        run: |
          : "${TCP_PORT:?runtime-port step must provide the allocated NodePort}"
          bash ./dev-tools/hosted/shared/hosted-login-look-smoke.sh

      - name: Publish trusted preview success
        if: ${{ success() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.validate-target.outputs.hostname }}
          PREVIEW_TELNET_PORT: ${{ steps.runtime-port.outputs.port }}
        with:
          script: |
            const { publishPreviewComment } = require(
              `${process.env.GITHUB_WORKSPACE}/dev-tools/hosted/preview/publish-preview-comment.js`
            );
            await publishPreviewComment({
              github,
              context,
              core,
              mode: "success",
              markerPolicy: "replace",
              statePolicy: "expected-open",
              staleDescription: "trusted preview success",
            });

  destroy-runtime:
    name: Delete Preview Runtime
    runs-on:
      - self-hosted
      - preview
    needs: validate-target
    if: ${{ needs.validate-target.outputs.action == 'destroy' }}
    environment: pr-preview
    concurrency:
      group: preview-allocation-lifecycle
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # Check out the trusted default-branch cleanup implementation.
      pull-requests: read # Revalidate the closed pull request before runtime deletion.
      issues: write # Publish the required closed-pull-request removal state.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.33.4
      - name: Write runtime kubeconfig
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.PREVIEW_RUNTIME_KUBECONFIG }}
          path: ${{ runner.temp }}/preview-runtime.kubeconfig
      - name: Revalidate preview cleanup target before runtime deletion
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          set -euo pipefail
          refuse_cleanup() {
            echo "::error::Refusing trusted preview cleanup for PR #${PR_NUMBER}: $1" >&2
            exit 1
          }
          if ! pull_request_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"; then
            refuse_cleanup "current pull request metadata is unavailable"
          fi
          current_state="$(jq -r '.state // empty' <<<"$pull_request_json")"
          current_head_repository="$(jq -r '.head.repo.full_name // empty' <<<"$pull_request_json")"
          current_head_sha="$(jq -r '.head.sha // empty' <<<"$pull_request_json")"
          [[ "$current_head_repository" == "$GITHUB_REPOSITORY" ]] || refuse_cleanup "head repository is not trusted (expected=${GITHUB_REPOSITORY}, current=${current_head_repository})"
          [[ "$current_head_sha" == "$EXPECTED_HEAD_SHA" ]] || refuse_cleanup "head is stale (expected=${EXPECTED_HEAD_SHA}, current=${current_head_sha})"
          [[ "$current_state" == closed ]] || refuse_cleanup "pull request is no longer closed (state=${current_state})"
      - name: Delete runtime and wait for NotFound
        run: |
          bash ./dev-tools/hosted/preview/prune-stale-preview-namespaces.sh \
            --delete-runtime "${{ needs.validate-target.outputs.namespace }}"

      - name: Publish trusted preview removal
        if: ${{ success() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.validate-target.outputs.hostname }}
        with:
          script: |
            const { publishPreviewComment } = require(
              `${process.env.GITHUB_WORKSPACE}/dev-tools/hosted/preview/publish-preview-comment.js`
            );
            await publishPreviewComment({
              github,
              context,
              core,
              mode: "removed",
              markerPolicy: "replace",
              statePolicy: "expected-closed",
              telnetPort: "unavailable",
              staleDescription: "trusted preview removal",
            });

  retire-identity:
    name: Retire Hosted Identity After Runtime Deletion
    runs-on:
      - self-hosted
      - preview
    needs: [validate-target, destroy-runtime]
    if: ${{ needs.validate-target.outputs.action == 'destroy' && needs.destroy-runtime.result == 'success' }}
    environment: pr-preview
    concurrency:
      group: preview-allocation-lifecycle
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # Check out the trusted default-branch retirement implementation.
      pull-requests: read # Revalidate the closed pull request before identity retirement.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.33.4
      - name: Write requester kubeconfig
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.HOSTED_IDENTITY_REQUESTER_KUBECONFIG }}
          path: ${{ runner.temp }}/hosted-identity-requester.kubeconfig
      - name: Revalidate preview cleanup target before identity retirement
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          set -euo pipefail
          refuse_cleanup() {
            echo "::error::Refusing trusted preview cleanup for PR #${PR_NUMBER}: $1" >&2
            exit 1
          }
          if ! pull_request_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"; then
            refuse_cleanup "current pull request metadata is unavailable"
          fi
          current_state="$(jq -r '.state // empty' <<<"$pull_request_json")"
          current_head_repository="$(jq -r '.head.repo.full_name // empty' <<<"$pull_request_json")"
          current_head_sha="$(jq -r '.head.sha // empty' <<<"$pull_request_json")"
          [[ "$current_head_repository" == "$GITHUB_REPOSITORY" ]] || refuse_cleanup "head repository is not trusted (expected=${GITHUB_REPOSITORY}, current=${current_head_repository})"
          [[ "$current_head_sha" == "$EXPECTED_HEAD_SHA" ]] || refuse_cleanup "head is stale (expected=${EXPECTED_HEAD_SHA}, current=${current_head_sha})"
          [[ "$current_state" == closed ]] || refuse_cleanup "pull request is no longer closed (state=${current_state})"
      - name: Apply canonical Retired request
        env:
          IDENTITY_NAME: pr-${{ needs.validate-target.outputs.pr_number }}
        run: |
          cat <<EOF | kubectl -n firemud-system apply -f -
          apiVersion: platform.firemud.dev/v1alpha1
          kind: HostedEnvironmentIdentity
          metadata:
            name: ${IDENTITY_NAME}
            namespace: firemud-system
          spec:
            desiredState: Retired
          EOF
      - name: Observe terminal retirement and delete request
        env:
          IDENTITY_NAME: pr-${{ needs.validate-target.outputs.pr_number }}
        run: |
          bash ./dev-tools/hosted/preview/wait-for-hosted-identity.sh \
            --retired "$IDENTITY_NAME" 600
          kubectl -n firemud-system delete hostedenvironmentidentity "$IDENTITY_NAME" \
            --wait=true --timeout=180s
