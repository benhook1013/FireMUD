name: Trusted Hosted Identity Request

on:
  workflow_run:
    workflows: [PR Preview Environment]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  actions: read # Inspect the completed source workflow and its artifacts.
  contents: read # Check out the trusted default-branch workflow implementation.

jobs:
  validate-target:
    name: Validate Trusted Preview Target
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.name == 'PR Preview Environment' && (github.event.workflow_run.event == 'pull_request_target' || github.event.workflow_run.event == 'repository_dispatch')) || (github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      actions: read # Inspect the completed source workflow and its artifacts.
      contents: read # Check out the trusted default-branch validation implementation.
      pull-requests: read # Read immutable pull-request target metadata.
    outputs:
      action: ${{ steps.target.outputs.action }}
      pr_number: ${{ steps.target.outputs.pr_number }}
      base_sha: ${{ steps.target.outputs.base_sha }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      merge_sha: ${{ steps.target.outputs.merge_sha }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      namespace: ${{ steps.target.outputs.namespace }}
      hostname: ${{ steps.target.outputs.hostname }}
      certificate_identity_mode: ${{ steps.certificate-identity.outputs.mode }}
      exposure_mode: ${{ steps.target.outputs.exposure_mode }}
      render_run_id: ${{ steps.target.outputs.render_run_id }}
      artifact_name: ${{ steps.target.outputs.artifact_name }}
      retire_identity: ${{ steps.target.outputs.retire_identity }}
      cleanup_state: ${{ steps.target.outputs.cleanup_state }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up canonical GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Resolve certificate identity mode
        id: certificate-identity
        uses: ./.github/actions/resolve-certificate-identity-mode
        with:
          values-file: k8s/helm/firemud/values-hosted-shared.example.yaml

      - name: Verify workflow source and immutable PR metadata
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/trusted-preview-source-artifact
        run: |
          set -euo pipefail
          emit_no_action() {
            echo "::notice::$1"
            {
              echo 'action=none'
              echo 'retire_identity=false'
              echo 'cleanup_state=none'
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          require_source_field() {
            local label="$1"
            local expected="$2"
            local actual="$3"
            [[ "$actual" == "$expected" ]] || {
              printf '::error title=Unexpected source run %s::Expected %q; actual %q.\n' \
                "$label" "$expected" "$actual" >&2
              exit 1
            }
          }
          normalize_sha() {
            local value="$1"
            [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
            printf '%s' "${value,,}"
          }
          download_source_artifact() {
            local artifact_name="$1"
            rm -rf -- "$ARTIFACT_DIRECTORY"
            mkdir -p -- "$ARTIFACT_DIRECTORY"
            gh run download "$SOURCE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" \
              --dir "$ARTIFACT_DIRECTORY" >/dev/null
          }
          require_exact_files() {
            local expected="$1"
            local actual
            actual="$(find "$ARTIFACT_DIRECTORY" -type f -printf '%P\n' | sort | paste -sd, -)"
            [[ "$actual" == "$expected" ]] || {
              echo "::error title=Unexpected preview artifact contents::Expected ${expected}; actual ${actual:-empty}." >&2
              exit 1
            }
          }
          SOURCE_RUN_ID=""
          SOURCE_EVENT=""
          PR_NUMBER=""
          ACTION=""
          EXPECTED_HEAD_SHA=""
          ARTIFACT_BASE_SHA=""
          ARTIFACT_MERGE_SHA=""
          ARTIFACT_NAME=""
          ARTIFACT_KIND=""
          RETIRE_IDENTITY=false
          CLEANUP_STATE=none
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            [[ -n "$WORKFLOW_RUN_ID" ]] || {
              echo "::error title=Missing workflow run id::Source render events require a workflow run id." >&2
              exit 1
            }
            SOURCE_RUN_ID="$WORKFLOW_RUN_ID"
            workflow_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
            require_source_field path '.github/workflows/preview.yml' "$(jq -r '.path // empty' <<<"$workflow_run_json")"
            require_source_field conclusion success "$(jq -r '.conclusion // empty' <<<"$workflow_run_json")"
            require_source_field repository "$GITHUB_REPOSITORY" \
              "$(jq -r '.repository.full_name // empty' <<<"$workflow_run_json")"
            require_source_field head "$WORKFLOW_RUN_HEAD_SHA" \
              "$(jq -r '.head_sha // empty' <<<"$workflow_run_json")"
            SOURCE_EVENT="$(jq -r '.event // empty' <<<"$workflow_run_json")"
            [[ "$SOURCE_EVENT" == pull_request_target || "$SOURCE_EVENT" == repository_dispatch ]] ||
              emit_no_action "Ignoring source run with unsupported event ${SOURCE_EVENT}."
            if [[ "$SOURCE_EVENT" == repository_dispatch ]]; then
              require_source_field head-branch "$DEFAULT_BRANCH" \
                "$(jq -r '.head_branch // empty' <<<"$workflow_run_json")"
            fi
            if ! artifacts_json="$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"; then
              emit_no_action "Ignoring source run because its artifacts could not be verified."
            fi
            canonical_artifacts="$(jq -c \
              '[.[].artifacts[] | select(.expired == false) | select(.name | test("^preview-(render|intent)-pr-[1-9][0-9]{0,50}-[0-9a-fA-F]{40}$"))]' \
              <<<"$artifacts_json")"
            [[ "$(jq 'length' <<<"$canonical_artifacts")" == 1 ]] ||
              emit_no_action "Ignoring source run without exactly one canonical preview artifact."
            ARTIFACT_NAME="$(jq -er '.[0].name' <<<"$canonical_artifacts")"
            if [[ "$ARTIFACT_NAME" == preview-render-pr-* ]]; then
              ARTIFACT_KIND=render
              ACTION=deploy
            else
              ARTIFACT_KIND=intent
              ACTION=destroy
            fi
            if [[ "$SOURCE_EVENT" == pull_request_target && "$ARTIFACT_KIND" != render ]]; then
              emit_no_action "Ignoring pull_request_target source without a render artifact."
            fi
            download_source_artifact "$ARTIFACT_NAME"
            if [[ "$ARTIFACT_KIND" == render ]]; then
              require_exact_files "preview-metadata.json,preview-rendered-sanitized.yaml"
              metadata_event="$(jq -r '.event // empty' "$ARTIFACT_DIRECTORY/preview-metadata.json")"
              [[ "$metadata_event" == "$SOURCE_EVENT" ]] ||
                emit_no_action "Ignoring render with metadata from a different source event."
              if [[ "$SOURCE_EVENT" == repository_dispatch ]]; then
                metadata_action="$(jq -r '.action // empty' "$ARTIFACT_DIRECTORY/preview-metadata.json")"
                [[ "$metadata_action" == deploy ]] ||
                  emit_no_action "Ignoring repository dispatch render without action=deploy metadata."
              fi
              PR_NUMBER="$(jq -er '.prNumber | select(type == "number" and floor == .)' "$ARTIFACT_DIRECTORY/preview-metadata.json")"
              EXPECTED_HEAD_SHA="$(jq -er '.headSha | select(type == "string")' "$ARTIFACT_DIRECTORY/preview-metadata.json")"
              ARTIFACT_BASE_SHA="$(jq -er '.baseSha | select(type == "string")' "$ARTIFACT_DIRECTORY/preview-metadata.json")"
              ARTIFACT_MERGE_SHA="$(jq -er '.mergeSha | select(type == "string")' "$ARTIFACT_DIRECTORY/preview-metadata.json")"
            else
              require_exact_files "preview-intent.json"
              intent_output="$(python3 ./dev-tools/hosted/preview/validate-preview-intent.py \
                "$ARTIFACT_DIRECTORY/preview-intent.json" "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID")" ||
                emit_no_action "Ignoring repository dispatch with an invalid destroy intent."
              PR_NUMBER="$(sed -n 's/^pr_number=//p' <<<"$intent_output")"
              EXPECTED_HEAD_SHA="$(sed -n 's/^head_sha=//p' <<<"$intent_output")"
              [[ -n "$PR_NUMBER" && -n "$EXPECTED_HEAD_SHA" ]] ||
                emit_no_action "Ignoring repository dispatch without a canonical destroy target."
            fi
          elif [[ "$EVENT_NAME" == pull_request_target ]]; then
            ACTION=destroy
            SOURCE_EVENT=pull_request_target
            PR_NUMBER="${{ github.event.pull_request.number }}"
            EXPECTED_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            RETIRE_IDENTITY=true
            CLEANUP_STATE=closed
          else
            echo "::error title=Unsupported lifecycle event::Cannot validate hosted identity request for event ${EVENT_NAME}." >&2
            exit 1
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error title=Invalid pull request number::Expected a positive decimal pull request number." >&2
            exit 1
          }
          [[ "$ACTION" == deploy || "$ACTION" == destroy ]] || {
            echo "::error title=Invalid lifecycle action::Expected deploy or destroy." >&2
            exit 1
          }
          pull_request_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          repository="$(jq -r '.head.repo.full_name // empty' <<<"$pull_request_json")"
          base_repository="$(jq -r '.base.repo.full_name // empty' <<<"$pull_request_json")"
          base_ref="$(jq -r '.base.ref // empty' <<<"$pull_request_json")"
          base_sha=""
          state="$(jq -r '.state // empty' <<<"$pull_request_json")"
          current_head_sha="$(jq -r '.head.sha // empty' <<<"$pull_request_json")"
          merge_sha="$(jq -r '.merge_commit_sha // empty' <<<"$pull_request_json")"
          if ! EXPECTED_HEAD_SHA="$(normalize_sha "$EXPECTED_HEAD_SHA")"; then
            emit_no_action "Ignoring lifecycle event with an invalid expected head SHA."
          fi
          if ! current_head_sha="$(normalize_sha "$current_head_sha")"; then
            emit_no_action "Ignoring pull request metadata with an invalid current head SHA."
          fi
          [[ "$repository" == "$GITHUB_REPOSITORY" ]] || emit_no_action \
            "Ignoring pull request metadata because its head repository is not trusted."
          [[ "$base_repository" == "$GITHUB_REPOSITORY" ]] || emit_no_action \
            "Ignoring pull request metadata because its base repository is not trusted."
          if [[ "$ACTION" == deploy ]]; then
            [[ "$base_ref" =~ ^[A-Za-z0-9._/-]+$ ]] || emit_no_action \
              "Ignoring lifecycle event with an invalid current base ref."
            if ! current_base_ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${base_ref}")"; then
              emit_no_action "Ignoring lifecycle event because the current base branch ref could not be read."
            fi
            if ! base_sha="$(jq -er '.object.sha | select(type == "string")' <<<"$current_base_ref_json")" ||
              ! base_sha="$(normalize_sha "$base_sha")"; then
              emit_no_action "Ignoring lifecycle event with an invalid current base branch ref SHA."
            fi
            [[ "$merge_sha" =~ ^[0-9a-fA-F]{40}$ ]] || emit_no_action \
              "Ignoring lifecycle event without the current pull-request test-merge SHA."
          else
            merge_sha="${merge_sha:-$current_head_sha}"
          fi
          [[ "$merge_sha" =~ ^[0-9a-fA-F]{40}$ ]] || emit_no_action \
            "Ignoring lifecycle event with an invalid current merge SHA."
          merge_sha="${merge_sha,,}"
          if [[ "$ACTION" == deploy ]]; then
            if ! merge_commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${merge_sha}")"; then
              emit_no_action "Ignoring lifecycle event because the current pull-request merge commit could not be read."
            fi
            jq -e \
              --arg merge_sha "$merge_sha" \
              --arg base_sha "$base_sha" \
              --arg head_sha "$current_head_sha" \
              '.sha == $merge_sha and (.parents | type) == "array" and (.parents | length) == 2 and .parents[0].sha == $base_sha and .parents[1].sha == $head_sha' \
              <<<"$merge_commit_json" >/dev/null || emit_no_action \
                "Ignoring lifecycle event whose merge commit parents are stale or do not match the current base and head."
          fi
          mergeable="$(jq -r 'if (.mergeable | type) == "boolean" then (.mergeable | tostring) else "invalid" end' <<<"$pull_request_json")"
          mergeable_state="$(jq -r 'if (.mergeable_state | type) == "string" then .mergeable_state else "invalid" end' <<<"$pull_request_json")"
          if [[ "$ACTION" == deploy ]]; then
            if [[ "$mergeable" == false || "$mergeable_state" == dirty || "$mergeable_state" == conflicting ]]; then
              emit_no_action "Ignoring lifecycle event because the current pull request is conflicting."
            fi
            [[ "$mergeable" == true && -n "$mergeable_state" && "$mergeable_state" != unknown && "$mergeable_state" != invalid ]] || emit_no_action \
              "Ignoring lifecycle event because pull-request mergeability is unavailable."
          fi
          if [[ "$EVENT_NAME" == workflow_run && "$ARTIFACT_KIND" == render ]]; then
            if ! ARTIFACT_BASE_SHA="$(normalize_sha "$ARTIFACT_BASE_SHA")"; then
              emit_no_action "Ignoring render artifact with an invalid base SHA."
            fi
            if ! ARTIFACT_MERGE_SHA="$(normalize_sha "$ARTIFACT_MERGE_SHA")"; then
              emit_no_action "Ignoring render artifact with an invalid merge SHA."
            fi
            [[ "$base_sha" == "$ARTIFACT_BASE_SHA" ]] || emit_no_action \
              "Ignoring render artifact bound to a stale or different pull-request base."
            [[ "$merge_sha" == "$ARTIFACT_MERGE_SHA" ]] || emit_no_action \
              "Ignoring render artifact bound to a stale or different pull-request merge."
          fi
          effective_image_tag="$current_head_sha"
          if [[ "$ACTION" == deploy ]]; then
            effective_image_tag="$(bash ./dev-tools/hosted/preview/resolve-preview-image-tag.sh \
              "$merge_sha" "$PR_NUMBER" "$base_sha")"
            expected_merge_image_tag="pr-merge-${merge_sha}"
            [[ "$effective_image_tag" == "$expected_merge_image_tag" || "$effective_image_tag" == "$base_sha" ]] ||
              emit_no_action "Ignoring lifecycle event with an image tag unrelated to the current PR merge or base."
            [[ "$effective_image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || emit_no_action \
              "Ignoring lifecycle event with an invalid trusted image tag."
          fi
          if [[ "$EVENT_NAME" == workflow_run && "$ACTION" == deploy ]]; then
            [[ "$state" == open ]] || emit_no_action \
              "Source render completed after PR closure; no preview activation is required."
            [[ "$repository" == "$GITHUB_REPOSITORY" ]] || emit_no_action \
              "Ignoring source render because the current PR head repository is not trusted."
            labels_json="$(jq -c '.labels // null' <<<"$pull_request_json")"
            label_metadata="$(python3 ./dev-tools/hosted/preview/preview-eligibility.py \
              --operation deploy --state "$state" --base-ref "$base_ref" \
              --author "$(jq -r '.user.login // empty' <<<"$pull_request_json")" \
              --labels-json "$labels_json")" || emit_no_action \
                "Refusing hosted preview lifecycle action: PR is not preview-eligible."
            [[ "$(sed -n 's/^reason=//p' <<<"$label_metadata")" != malformed-label-metadata ]] || emit_no_action \
              "Refusing hosted preview lifecycle action: PR label metadata is missing or malformed."
            [[ "$(sed -n 's/^eligible=//p' <<<"$label_metadata")" == true ]] || emit_no_action \
              "Refusing hosted preview lifecycle action: PR is not preview-eligible."
          elif [[ "$EVENT_NAME" == workflow_run && "$ACTION" == destroy ]]; then
            [[ "$state" == open ]] || emit_no_action \
              "Ignoring manual destroy because the target pull request is not open."
            [[ "$repository" == "$GITHUB_REPOSITORY" ]] || emit_no_action \
              "Ignoring manual destroy because the current PR head repository is not trusted."
            CLEANUP_STATE=open
          else
            [[ "$repository" == "$GITHUB_REPOSITORY" ]] || emit_no_action \
              "Ignoring closed pull request because its head repository is not trusted."
            [[ "$state" == closed ]] || emit_no_action \
              "Ignoring closed pull request because it has been reopened."
          fi
          [[ "$current_head_sha" == "$EXPECTED_HEAD_SHA" ]] || emit_no_action \
            "Ignoring stale lifecycle event for an earlier PR head."
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            expected_artifact_name="preview-${ARTIFACT_KIND}-pr-${PR_NUMBER}-${EXPECTED_HEAD_SHA}"
            [[ "$ARTIFACT_NAME" == "$expected_artifact_name" ]] || emit_no_action \
              "Ignoring source artifact whose name is not bound to its canonical PR head."
          fi
          if [[ "$ACTION" == deploy ]]; then
            metadata_pr_number="$(jq -er '.prNumber | select(type == "number" and floor == .)' "$ARTIFACT_DIRECTORY/preview-metadata.json")"
            metadata_head_sha="$(jq -er '.headSha | select(type == "string")' "$ARTIFACT_DIRECTORY/preview-metadata.json")"
            [[ "$metadata_pr_number" == "$PR_NUMBER" ]] || emit_no_action \
              "Ignoring render artifact whose PR number is not the canonical target."
            [[ "$(normalize_sha "$metadata_head_sha")" == "$EXPECTED_HEAD_SHA" ]] || emit_no_action \
              "Ignoring render artifact whose head SHA is stale or mismatched."
            python3 ./dev-tools/hosted/preview/validate-preview-artifact.py \
              "$ARTIFACT_DIRECTORY/preview-metadata.json" \
              "$ARTIFACT_DIRECTORY/preview-rendered-sanitized.yaml" \
              "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" "$PR_NUMBER" "$base_sha" \
              "$current_head_sha" "$merge_sha" "$effective_image_tag" \
              "pr-${PR_NUMBER}.preview.firedevops.net" \
              "${{ steps.certificate-identity.outputs.mode }}"
            exposure_mode="$(python3 ./dev-tools/hosted/preview/validate-preview-artifact.py \
              exposure-mode "$ARTIFACT_DIRECTORY/preview-rendered-sanitized.yaml" \
              "${{ steps.certificate-identity.outputs.mode }}")"
            case "$exposure_mode" in
              private|public) ;;
              *)
                echo "::error title=Invalid preview exposure mode::Expected private or public; actual ${exposure_mode:-empty}." >&2
                exit 1
                ;;
            esac
            if [[ "$exposure_mode" == private && "${{ steps.certificate-identity.outputs.mode }}" != hosted-controller ]]; then
              echo "::error title=Unsupported private preview identity::Private bridge proof requires hosted-controller identity." >&2
              exit 1
            fi
          elif [[ "$ACTION" == destroy && "$EVENT_NAME" == workflow_run ]]; then
            [[ "$ARTIFACT_KIND" == intent ]] || emit_no_action \
              "Ignoring repository dispatch destroy without a canonical destroy intent artifact."
          fi
          {
            echo "action=${ACTION}"
            echo "pr_number=${PR_NUMBER}"
            echo "base_sha=${base_sha}"
            echo "head_sha=${current_head_sha}"
            echo "merge_sha=${merge_sha,,}"
            echo "image_tag=${effective_image_tag}"
            echo "namespace=pr-${PR_NUMBER}"
            echo "hostname=pr-${PR_NUMBER}.preview.firedevops.net"
            if [[ "$ACTION" == deploy ]]; then
              echo "exposure_mode=${exposure_mode}"
            fi
            echo "render_run_id=${SOURCE_RUN_ID}"
            echo "artifact_name=${ARTIFACT_NAME}"
            echo "retire_identity=${RETIRE_IDENTITY}"
            echo "cleanup_state=${CLEANUP_STATE}"
          } >> "$GITHUB_OUTPUT"

  prepare-runtime:
    name: Prepare Validated Preview Inputs
    timeout-minutes: 45
    runs-on:
      - self-hosted
      - preview
      - linux
      - x64
    needs: validate-target
    if: ${{ needs.validate-target.outputs.action == 'deploy' }}
    environment: trusted-hosted-cluster
    permissions:
      actions: read # Download the validated source workflow artifact.
      contents: read # Check out the trusted default-branch preparation implementation.
      pull-requests: read # Revalidate the current pull-request target before preparation.
      issues: write # Publish the required preparation failure state.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up canonical GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Download and validate source render artifact
        uses: ./.github/actions/download-validated-preview-artifact
        with:
          artifact-directory: ${{ runner.temp }}/preview-artifact
          artifact-name: ${{ needs.validate-target.outputs.artifact_name }}
          source-run-id: ${{ needs.validate-target.outputs.render_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pr-number: ${{ needs.validate-target.outputs.pr_number }}
          base-sha: ${{ needs.validate-target.outputs.base_sha }}
          head-sha: ${{ needs.validate-target.outputs.head_sha }}
          merge-sha: ${{ needs.validate-target.outputs.merge_sha }}
          image-tag: ${{ needs.validate-target.outputs.image_tag }}
          preview-hostname: ${{ needs.validate-target.outputs.hostname }}
          certificate-identity-mode: ${{ needs.validate-target.outputs.certificate_identity_mode }}

      - name: Revalidate exact PR source binding before image wait
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/preview/revalidate-preview-source-binding.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA" "$EXPECTED_MERGE_SHA"

      - name: Revalidate open PR before waiting for runtime images
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA"

      - name: Wait for tested PR merge runtime images
        if: ${{ needs.validate-target.outputs.image_tag != needs.validate-target.outputs.base_sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./dev-tools/hosted/shared/wait-for-runtime-images.sh \
            "${{ needs.validate-target.outputs.merge_sha }}" \
            "${{ needs.validate-target.outputs.base_sha }}" \
            "${{ needs.validate-target.outputs.head_sha }}"

      - name: Wait for immutable base runtime images
        if: ${{ needs.validate-target.outputs.image_tag == needs.validate-target.outputs.base_sha }}
        env:
          PREVIEW_GHCR_USERNAME: ${{ secrets.TRUSTED_HOSTED_PREVIEW_GHCR_USERNAME }}
          PREVIEW_GHCR_TOKEN: ${{ secrets.TRUSTED_HOSTED_PREVIEW_GHCR_TOKEN }}
        run: |
          set -euo pipefail
          docker_config="$(mktemp -d -- "$RUNNER_TEMP/preview-base-docker-config.XXXXXX")"
          chmod 700 "$docker_config"
          cleanup_docker_config() {
            rm -rf -- "$docker_config"
          }
          trap cleanup_docker_config EXIT
          export DOCKER_CONFIG="$docker_config"
          printf '%s' "$PREVIEW_GHCR_TOKEN" | docker login ghcr.io \
            --username "$PREVIEW_GHCR_USERNAME" --password-stdin
          bash ./dev-tools/hosted/preview/wait-for-base-images.sh \
            "${{ needs.validate-target.outputs.base_sha }}"

      - name: Publish trusted preview preparation failure
        if: ${{ !cancelled() && failure() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          PREVIEW_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          PREVIEW_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.validate-target.outputs.hostname }}
          PREVIEW_EXPOSURE_MODE: ${{ needs.validate-target.outputs.exposure_mode }}
        with:
          script: |
            const { publishPreviewComment } = require(
              `${process.env.GITHUB_WORKSPACE}/dev-tools/hosted/preview/publish-preview-comment.js`
            );
            await publishPreviewComment({
              github,
              context,
              core,
              mode: "failure",
              markerPolicy: "replace",
              statePolicy: "expected-open",
              telnetPort: "unavailable",
              failureStage: "prepare-runtime",
              staleDescription: "trusted preview preparation failure",
            });

  deploy-runtime:
    name: Prepare Validated Preview Runtime
    # Keep the shared lifecycle lock around allocation, runtime reset, identity
    # projection, and deployment; the pre-apply projection wait is bounded to
    # 15 minutes.
    timeout-minutes: 45
    runs-on:
      - self-hosted
      - preview
      - linux
      - x64
    needs: [validate-target, prepare-runtime]
    if: ${{ needs.validate-target.outputs.action == 'deploy' && needs.prepare-runtime.result == 'success' }}
    outputs:
      runtime_namespace_uid: ${{ steps.record-runtime-namespace-uid.outputs.uid }}
      allocation_status: ${{ steps.allocate-capacity.outputs.allocation_status }}
    environment: trusted-hosted-cluster
    concurrency:
      group: preview-allocation-lifecycle
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read # Download the validated source workflow artifact.
      contents: read # Check out the trusted default-branch deployment implementation.
      pull-requests: read # Revalidate the current pull-request target before deployment.
      issues: write # Publish the required deploy failure state.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up canonical GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Set up kubectl
        uses: ./.github/actions/setup-kubectl

      - name: Download and validate source render artifact
        uses: ./.github/actions/download-validated-preview-artifact
        with:
          artifact-directory: ${{ runner.temp }}/preview-artifact
          artifact-name: ${{ needs.validate-target.outputs.artifact_name }}
          source-run-id: ${{ needs.validate-target.outputs.render_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pr-number: ${{ needs.validate-target.outputs.pr_number }}
          base-sha: ${{ needs.validate-target.outputs.base_sha }}
          head-sha: ${{ needs.validate-target.outputs.head_sha }}
          merge-sha: ${{ needs.validate-target.outputs.merge_sha }}
          image-tag: ${{ needs.validate-target.outputs.image_tag }}
          preview-hostname: ${{ needs.validate-target.outputs.hostname }}
          certificate-identity-mode: ${{ needs.validate-target.outputs.certificate_identity_mode }}

      - name: Write trusted namespace-manager kubeconfig
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.TRUSTED_HOSTED_PREVIEW_NAMESPACE_MANAGER_KUBECONFIG }}
          path: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
          export-to-github-env: 'false'

      - name: Validate kubectl client/server skew
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
        run: bash ./dev-tools/hosted/shared/check-kubectl-version-skew.sh

      - name: Revalidate open PR before privileged deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA"

      - name: Revalidate exact PR source binding before privileged mutations
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          EXPECTED_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/preview/revalidate-preview-source-binding.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA" "$EXPECTED_MERGE_SHA" \
            "before privileged runtime mutation"

      - name: Prune stale runtime namespaces
        env:
          GH_TOKEN: ${{ github.token }}
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
        run: bash ./dev-tools/hosted/preview/prune-stale-preview-namespaces.sh --apply

      - name: Revalidate exact PR source binding before capacity reclaim
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/preview/revalidate-preview-source-binding.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA" "$EXPECTED_MERGE_SHA" \
            "before capacity reclaim"

      - name: Enforce priority-aware preview capacity
        id: allocate-capacity
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_MAX_ACTIVE: ${{ vars.PREVIEW_MAX_ACTIVE }}
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
        run: |
          set +e
          bash ./dev-tools/hosted/preview/allocate-preview-capacity.sh \
            "${{ needs.validate-target.outputs.namespace }}" \
            "${PREVIEW_MAX_ACTIVE:-2}" \
            "${{ needs.validate-target.outputs.pr_number }}" \
            "${{ needs.validate-target.outputs.head_sha }}" \
            "${{ needs.validate-target.outputs.base_sha }}" \
            "${{ needs.validate-target.outputs.merge_sha }}"
          allocation_status=$?
          set -e
          if [[ "$allocation_status" -eq 75 ]] &&
            grep -Fqx 'allocation_status=unavailable' "$GITHUB_OUTPUT"; then
            exit 0
          fi
          if [[ "$allocation_status" -ne 0 ]]; then
            exit "$allocation_status"
          fi
          echo "allocation_status=allocated" >> "$GITHUB_OUTPUT"

      - name: Publish trusted preview unavailable capacity
        id: publish-capacity-unavailable
        if: ${{ steps.allocate-capacity.outputs.allocation_status == 'unavailable' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          PREVIEW_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          PREVIEW_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.validate-target.outputs.hostname }}
          PREVIEW_EXPOSURE_MODE: ${{ needs.validate-target.outputs.exposure_mode }}
        with:
          script: |
            const { publishPreviewComment } = require(
              `${process.env.GITHUB_WORKSPACE}/dev-tools/hosted/preview/publish-preview-comment.js`
            );
            await publishPreviewComment({
              github,
              context,
              core,
              mode: "unavailable",
              markerPolicy: "replace",
              statePolicy: "expected-open",
              telnetPort: "unavailable",
              failureStage: "capacity",
              staleDescription: "trusted preview capacity unavailable",
            });

      - name: Allocate stable preview Telnet port
        id: allocate-telnet-port
        if: ${{ needs.validate-target.outputs.exposure_mode == 'public' && steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
        run: |
          set -euo pipefail
          port="$(bash ./dev-tools/hosted/preview/allocate-preview-telnet-port.sh \
            "${{ needs.validate-target.outputs.namespace }}" \
            "${{ needs.validate-target.outputs.pr_number }}")"
          [[ "$port" =~ ^32(00[0-9]|01[0-5])$ ]] || {
            echo "::error title=Invalid allocated Telnet port::Expected a port from 32000 through 32015; actual value was ${port:-empty}." >&2
            exit 1
          }
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Revalidate exact PR target before clean runtime redeploy
        if: ${{ steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA"
          bash ./dev-tools/hosted/preview/revalidate-preview-source-binding.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA" "$EXPECTED_MERGE_SHA" \
            "before clean runtime redeploy"

      - name: Delete exact preview runtime namespace before recreate
        if: ${{ steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_NAMESPACE" == "pr-${PR_NUMBER}" ]] || {
            echo "::error title=Invalid preview runtime namespace::Expected pr-${PR_NUMBER}." >&2
            exit 1
          }
          bash ./dev-tools/hosted/shared/delete-hosted-namespace.sh \
            "$RUNTIME_NAMESPACE" "$RUNTIME_NAMESPACE"

      - name: Create and annotate exact preview runtime namespace
        if: ${{ steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          EXPOSURE_MODE: ${{ needs.validate-target.outputs.exposure_mode }}
          ALLOCATED_TELNET_PORT: ${{ steps.allocate-telnet-port.outputs.port }}
          ALLOCATION_TIMESTAMP: ${{ steps.allocate-capacity.outputs.allocation_timestamp }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_NAMESPACE" == "pr-${PR_NUMBER}" ]] || {
            echo "::error title=Invalid preview runtime namespace::Expected pr-${PR_NUMBER}." >&2
            exit 1
          }
          TELNET_PORT="$(bash ./dev-tools/hosted/preview/resolve-preview-telnet-port.sh \
            "$EXPOSURE_MODE" "$ALLOCATED_TELNET_PORT")"
          [[ "$ALLOCATION_TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^[:space:]]+Z$ ]] || {
            echo "::error title=Invalid allocation timestamp::Expected a UTC timestamp ending in Z without whitespace." >&2
            exit 1
          }
          kubectl create namespace "$RUNTIME_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          bash ./dev-tools/hosted/preview/annotate-preview-namespace.sh \
            "$RUNTIME_NAMESPACE" "$PR_NUMBER" "$BASE_SHA" "$HEAD_SHA" "$MERGE_SHA" "$IMAGE_TAG" \
            "$EXPOSURE_MODE" "$TELNET_PORT" "$ALLOCATION_TIMESTAMP"

      - name: Bind scoped runtime and certificate roles
        if: ${{ steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
        run: bash ./dev-tools/hosted/trust-bootstrap/bind-runtime-roles.sh "$RUNTIME_NAMESPACE"

      - name: Write runtime kubeconfig
        if: ${{ steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.TRUSTED_HOSTED_PREVIEW_RUNTIME_KUBECONFIG }}
          path: ${{ runner.temp }}/preview-runtime.kubeconfig
          export-to-github-env: 'false'

      - name: Write standalone certificate-writer kubeconfig
        if: ${{ needs.validate-target.outputs.certificate_identity_mode == 'standalone' && steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.TRUSTED_HOSTED_STANDALONE_CERTIFICATE_KUBECONFIG }}
          path: ${{ runner.temp }}/standalone-certificate-writer.kubeconfig
          export-to-github-env: 'false'

      - name: Write requester kubeconfig
        if: ${{ needs.validate-target.outputs.certificate_identity_mode == 'hosted-controller' && steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.TRUSTED_HOSTED_IDENTITY_REQUESTER_KUBECONFIG }}
          path: ${{ runner.temp }}/hosted-identity-requester.kubeconfig
          export-to-github-env: 'false'

      - name: Revalidate open PR before Active request
        if: ${{ needs.validate-target.outputs.certificate_identity_mode == 'hosted-controller' && steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA"
          bash ./dev-tools/hosted/preview/revalidate-preview-source-binding.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA" "$EXPECTED_MERGE_SHA" \
            "before the identity request"

      - name: Apply canonical Active request
        if: ${{ needs.validate-target.outputs.certificate_identity_mode == 'hosted-controller' && steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          IDENTITY_NAME: pr-${{ needs.validate-target.outputs.pr_number }}
          KUBECONFIG: ${{ runner.temp }}/hosted-identity-requester.kubeconfig
        run: bash ./dev-tools/hosted/shared/request-hosted-identity.sh "$IDENTITY_NAME" Active

      - name: Remove requester kubeconfig
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/hosted-identity-requester.kubeconfig"

      - name: Wait for all controller identity projections
        if: ${{ needs.validate-target.outputs.certificate_identity_mode == 'hosted-controller' && steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-runtime.kubeconfig
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          IDENTITY_NAME: pr-${{ needs.validate-target.outputs.pr_number }}
        run: |
          bash ./dev-tools/hosted/preview/wait-for-hosted-identity.sh \
            --projections "$IDENTITY_NAME" "$RUNTIME_NAMESPACE" 900

      - name: Prepare standalone gRPC TLS secret
        if: ${{ needs.validate-target.outputs.certificate_identity_mode == 'standalone' && steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-runtime.kubeconfig
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/shared/ensure-grpc-tls-secret.sh "$RUNTIME_NAMESPACE"

      - name: Prepare standalone transport certificates
        if: ${{ needs.validate-target.outputs.certificate_identity_mode == 'standalone' && steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/standalone-certificate-writer.kubeconfig
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/preview/ensure-standalone-transport-certificates.sh "$RUNTIME_NAMESPACE"

      - name: Wait for standalone transport Secret projections
        if: ${{ needs.validate-target.outputs.certificate_identity_mode == 'standalone' && steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-runtime.kubeconfig
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/preview/ensure-standalone-transport-certificates.sh \
            --wait "$RUNTIME_NAMESPACE"

      - name: Inject trusted allocated Telnet port
        if: ${{ steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/preview-artifact
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          EXPOSURE_MODE: ${{ needs.validate-target.outputs.exposure_mode }}
          ALLOCATED_TELNET_PORT: ${{ steps.allocate-telnet-port.outputs.port }}
        run: |
          set -euo pipefail
          TELNET_PORT="$(bash ./dev-tools/hosted/preview/resolve-preview-telnet-port.sh \
            "$EXPOSURE_MODE" "$ALLOCATED_TELNET_PORT")"
          python3 ./dev-tools/hosted/preview/validate-preview-artifact.py \
            inject "$ARTIFACT_DIR/preview-rendered-sanitized.yaml" \
            "$RUNNER_TEMP/preview-rendered-with-port.yaml" \
            "$RUNTIME_NAMESPACE" "$TELNET_PORT" \
            "${{ needs.validate-target.outputs.certificate_identity_mode }}" \
            "${{ needs.validate-target.outputs.exposure_mode }}"

      - name: Ensure trusted runtime pull secret
        if: ${{ steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-runtime.kubeconfig
          PREVIEW_GHCR_USERNAME: ${{ secrets.TRUSTED_HOSTED_PREVIEW_GHCR_USERNAME }}
          PREVIEW_GHCR_TOKEN: ${{ secrets.TRUSTED_HOSTED_PREVIEW_GHCR_TOKEN }}
        run: bash ./dev-tools/hosted/shared/ensure-ghcr-pull-secret.sh "${{ needs.validate-target.outputs.namespace }}"

      - name: Create canonical non-identity runtime credentials
        if: ${{ steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-runtime.kubeconfig
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
        run: bash ./dev-tools/hosted/preview/provision-runtime-credentials.sh

      - name: Apply validated PR runtime artifact
        id: deploy-runtime-artifact
        if: ${{ steps.allocate-capacity.outputs.allocation_status == 'allocated' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          ARTIFACT_PATH: ${{ runner.temp }}/preview-rendered-with-port.yaml
          EXPOSURE_MODE: ${{ needs.validate-target.outputs.exposure_mode }}
          ALLOCATED_TELNET_PORT: ${{ steps.allocate-telnet-port.outputs.port }}
          KUBECONFIG: ${{ runner.temp }}/preview-runtime.kubeconfig
        run: |
          set -euo pipefail
          TELNET_PORT="$(bash ./dev-tools/hosted/preview/resolve-preview-telnet-port.sh \
            "$EXPOSURE_MODE" "$ALLOCATED_TELNET_PORT")"
          python3 ./dev-tools/hosted/preview/validate-preview-artifact.py \
            runtime-target "$ARTIFACT_PATH" "$RUNTIME_NAMESPACE" "$TELNET_PORT" \
            "${{ needs.validate-target.outputs.certificate_identity_mode }}" \
            "${{ needs.validate-target.outputs.exposure_mode }}"
          bash ./dev-tools/hosted/preview/revalidate-preview-source-binding.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA" "$EXPECTED_MERGE_SHA"
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA"
          kubectl apply --dry-run=server --server-side --field-manager=trusted-hosted-preview -n "$RUNTIME_NAMESPACE" -f "$ARTIFACT_PATH"
          bash ./dev-tools/hosted/preview/revalidate-preview-source-binding.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA" "$EXPECTED_MERGE_SHA"
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA"
          kubectl apply --server-side --field-manager=trusted-hosted-preview -n "$RUNTIME_NAMESPACE" -f "$ARTIFACT_PATH"

      - name: Record exact deployed preview tuple
        if: ${{ steps.allocate-capacity.outputs.allocation_status == 'allocated' && steps.deploy-runtime-artifact.outcome == 'success' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_NAMESPACE" == "pr-${PR_NUMBER}" ]] || {
            echo "::error title=Invalid preview runtime namespace::Expected pr-${PR_NUMBER}." >&2
            exit 1
          }
          for sha_name in BASE_SHA HEAD_SHA MERGE_SHA; do
            sha_value="${!sha_name}"
            sha_label="${sha_name%_SHA}"
            sha_label="${sha_label,,}"
            [[ "$sha_value" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error title=Invalid preview ${sha_label} SHA::Expected exactly 40 lowercase hexadecimal characters." >&2
              exit 1
            }
          done
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "::error title=Invalid preview image tag::Expected a canonical immutable image tag." >&2
            exit 1
          }
          kubectl annotate namespace "$RUNTIME_NAMESPACE" \
            "firemud.dev/last-preview-base-sha=${BASE_SHA}" \
            "firemud.dev/last-preview-head-sha=${HEAD_SHA}" \
            "firemud.dev/last-preview-merge-sha=${MERGE_SHA}" \
            "firemud.dev/last-preview-image-tag=${IMAGE_TAG}" \
            --overwrite >/dev/null

      - name: Record exact deployed runtime Namespace UID
        id: record-runtime-namespace-uid
        if: ${{ steps.allocate-capacity.outputs.allocation_status == 'allocated' && steps.deploy-runtime-artifact.outcome == 'success' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          EXPECTED_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_NAMESPACE" == "pr-${PR_NUMBER}" ]] || {
            echo "::error title=Invalid preview runtime namespace::Expected pr-${PR_NUMBER}." >&2
            exit 1
          }
          for sha_name in EXPECTED_BASE_SHA EXPECTED_HEAD_SHA EXPECTED_MERGE_SHA; do
            sha_value="${!sha_name}"
            [[ "$sha_value" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error title=Invalid preview ${sha_name,,} SHA::Expected exactly 40 lowercase hexadecimal characters." >&2
              exit 1
            }
          done
          [[ "$EXPECTED_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "::error title=Invalid preview image tag::Expected a canonical immutable image tag." >&2
            exit 1
          }
          namespace_json="$(kubectl get namespace "$RUNTIME_NAMESPACE" --ignore-not-found -o json)"
          [[ -n "$namespace_json" ]] || {
            echo "::error title=Missing deployed preview runtime namespace::Expected ${RUNTIME_NAMESPACE}." >&2
            exit 1
          }
          if ! runtime_uid="$(jq -er \
            --arg expected_namespace "$RUNTIME_NAMESPACE" \
            --arg expected_pr_number "$PR_NUMBER" \
            --arg expected_base_sha "$EXPECTED_BASE_SHA" \
            --arg expected_head_sha "$EXPECTED_HEAD_SHA" \
            --arg expected_merge_sha "$EXPECTED_MERGE_SHA" \
            --arg expected_image_tag "$EXPECTED_IMAGE_TAG" \
            '(
              .metadata as $metadata
              | ($metadata.labels // {}) as $labels
              | ($metadata.annotations // {}) as $annotations
              | select($metadata.name == $expected_namespace)
              | select($metadata.uid | type == "string" and length > 0)
              | select($labels["firemud.dev/preview"] == "true")
              | select($labels["firemud.dev/pr-number"] == $expected_pr_number)
              | select($annotations["firemud.dev/requested-preview-base-sha"] == $expected_base_sha)
              | select($annotations["firemud.dev/requested-preview-head-sha"] == $expected_head_sha)
              | select($annotations["firemud.dev/requested-preview-merge-sha"] == $expected_merge_sha)
              | select($annotations["firemud.dev/requested-preview-image-tag"] == $expected_image_tag)
              | select($annotations["firemud.dev/last-preview-base-sha"] == $expected_base_sha)
              | select($annotations["firemud.dev/last-preview-head-sha"] == $expected_head_sha)
              | select($annotations["firemud.dev/last-preview-merge-sha"] == $expected_merge_sha)
              | select($annotations["firemud.dev/last-preview-image-tag"] == $expected_image_tag)
              | $metadata.uid
            )' <<<"$namespace_json")"; then
            echo "::error title=Invalid deployed preview runtime ownership::Expected canonical preview ownership and requested/deployed head annotations for ${RUNTIME_NAMESPACE}." >&2
            exit 1
          fi
          [[ "$runtime_uid" =~ ^[^[:space:]]+$ ]] || {
            echo "::error title=Invalid deployed preview runtime Namespace UID::Expected a non-empty Namespace UID." >&2
            exit 1
          }
          echo "uid=$runtime_uid" >> "$GITHUB_OUTPUT"

      - name: Publish trusted preview deployment failure
        if: ${{ !cancelled() && failure() && (steps.allocate-capacity.outputs.allocation_status != 'unavailable' || steps.publish-capacity-unavailable.outcome == 'failure') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          PREVIEW_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          PREVIEW_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.validate-target.outputs.hostname }}
          PREVIEW_EXPOSURE_MODE: ${{ needs.validate-target.outputs.exposure_mode }}
        with:
          script: |
            const { publishPreviewComment } = require(
              `${process.env.GITHUB_WORKSPACE}/dev-tools/hosted/preview/publish-preview-comment.js`
            );
            await publishPreviewComment({
              github,
              context,
              core,
              mode: "failure",
              markerPolicy: "replace",
              statePolicy: "expected-open",
              telnetPort: "unavailable",
              failureStage: "deploy-runtime",
              staleDescription: "trusted preview deployment failure",
            });

      - name: Remove runtime kubeconfig
        if: ${{ always() }}
        run: |
          rm -f -- \
            "$RUNNER_TEMP/preview-namespace-manager.kubeconfig" \
            "$RUNNER_TEMP/preview-runtime.kubeconfig" \
            "$RUNNER_TEMP/standalone-certificate-writer.kubeconfig"

  verify-runtime:
    name: Verify Hosted Preview Runtime
    timeout-minutes: 60
    runs-on:
      - self-hosted
      - preview
      - linux
      - x64
    needs: [validate-target, deploy-runtime]
    if: ${{ needs.validate-target.outputs.action == 'deploy' && needs.deploy-runtime.result == 'success' && needs.deploy-runtime.outputs.allocation_status == 'allocated' }}
    environment: trusted-hosted-cluster
    concurrency:
      group: preview-allocation-lifecycle
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # Check out the trusted default-branch verification implementation.
      pull-requests: read # Revalidate the pull-request state and exact head before publication.
      issues: write # GitHub's issue-comment API owns pull-request comments.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up canonical GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Set up canonical Python dependencies
        uses: ./.github/actions/setup-python

      - name: Set up kubectl
        uses: ./.github/actions/setup-kubectl

      - name: Write runtime kubeconfig
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.TRUSTED_HOSTED_PREVIEW_RUNTIME_KUBECONFIG }}
          path: ${{ runner.temp }}/preview-runtime.kubeconfig

      - name: Write trusted namespace-manager kubeconfig
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.TRUSTED_HOSTED_PREVIEW_NAMESPACE_MANAGER_KUBECONFIG }}
          path: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
          export-to-github-env: 'false'

      - name: Revalidate open PR before runtime verification
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA"

      - name: Capture exact runtime Namespace UID before verification
        id: capture-runtime-namespace
        env:
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          EXPECTED_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID: ${{ needs.deploy-runtime.outputs.runtime_namespace_uid }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_NAMESPACE" == "pr-${PR_NUMBER}" ]] || {
            echo "::error title=Invalid preview runtime namespace::Expected pr-${PR_NUMBER}." >&2
            exit 1
          }
          for sha_name in EXPECTED_BASE_SHA EXPECTED_HEAD_SHA EXPECTED_MERGE_SHA; do
            sha_value="${!sha_name}"
            [[ "$sha_value" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error title=Invalid preview ${sha_name,,} SHA::Expected exactly 40 lowercase hexadecimal characters." >&2
              exit 1
            }
          done
          [[ "$EXPECTED_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "::error title=Invalid preview image tag::Expected a canonical immutable image tag." >&2
            exit 1
          }
          [[ -n "$EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID" ]] || {
            echo "::error title=Missing deployed preview runtime Namespace UID::The deploy job did not publish its post-apply Namespace UID." >&2
            exit 1
          }
          namespace_json="$(kubectl get namespace "$RUNTIME_NAMESPACE" --ignore-not-found -o json)"
          [[ -n "$namespace_json" ]] || {
            echo "::error title=Missing preview runtime namespace::Expected ${RUNTIME_NAMESPACE}." >&2
            exit 1
          }
          if ! runtime_uid="$(jq -er \
            --arg expected_namespace "$RUNTIME_NAMESPACE" \
            --arg expected_pr_number "$PR_NUMBER" \
            --arg expected_base_sha "$EXPECTED_BASE_SHA" \
            --arg expected_head_sha "$EXPECTED_HEAD_SHA" \
            --arg expected_merge_sha "$EXPECTED_MERGE_SHA" \
            --arg expected_image_tag "$EXPECTED_IMAGE_TAG" \
            '(
              .metadata as $metadata
              | ($metadata.labels // {}) as $labels
              | ($metadata.annotations // {}) as $annotations
              | select($metadata.name == $expected_namespace)
              | select($metadata.uid | type == "string" and length > 0)
              | select($labels["firemud.dev/preview"] == "true")
              | select($labels["firemud.dev/pr-number"] == $expected_pr_number)
              | select($annotations["firemud.dev/requested-preview-base-sha"] == $expected_base_sha)
              | select($annotations["firemud.dev/requested-preview-head-sha"] == $expected_head_sha)
              | select($annotations["firemud.dev/requested-preview-merge-sha"] == $expected_merge_sha)
              | select($annotations["firemud.dev/requested-preview-image-tag"] == $expected_image_tag)
              | select($annotations["firemud.dev/last-preview-base-sha"] == $expected_base_sha)
              | select($annotations["firemud.dev/last-preview-head-sha"] == $expected_head_sha)
              | select($annotations["firemud.dev/last-preview-merge-sha"] == $expected_merge_sha)
              | select($annotations["firemud.dev/last-preview-image-tag"] == $expected_image_tag)
              | $metadata.uid
            )' <<<"$namespace_json")"; then
            echo "::error title=Invalid preview runtime namespace ownership::Expected canonical preview ownership and head annotations for ${RUNTIME_NAMESPACE}." >&2
            exit 1
          fi
          [[ "$runtime_uid" =~ ^[^[:space:]]+$ ]] || {
            echo "::error title=Invalid preview runtime namespace UID::Expected a non-empty Namespace UID." >&2
            exit 1
          }
          [[ "$runtime_uid" == "$EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID" ]] || {
            echo "::error title=Preview runtime Namespace UID does not match deploy::Expected ${EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID}; observed ${runtime_uid}." >&2
            exit 1
          }
          echo "uid=$runtime_uid" >> "$GITHUB_OUTPUT"

      - name: Wait for exact controller identity projection
        if: ${{ needs.validate-target.outputs.certificate_identity_mode == 'hosted-controller' }}
        run: |
          bash ./dev-tools/hosted/preview/wait-for-hosted-identity.sh \
            "pr-${{ needs.validate-target.outputs.pr_number }}" \
            "${{ needs.validate-target.outputs.head_sha }}" \
            "${{ needs.validate-target.outputs.namespace }}" 900 \
            "${{ needs.validate-target.outputs.exposure_mode }}" \
            "${{ needs.validate-target.outputs.base_sha }}" \
            "${{ needs.validate-target.outputs.merge_sha }}" \
            "${{ needs.validate-target.outputs.image_tag }}"

      - name: Wait for runtime rollouts
        env:
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/shared/wait-for-hosted-runtime-rollouts.sh \
            "$RUNTIME_NAMESPACE" 120

      - name: Read allocated TCP port
        id: runtime-port
        if: ${{ needs.validate-target.outputs.exposure_mode == 'public' }}
        env:
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
        run: |
          set -euo pipefail
          port="$(kubectl -n "$RUNTIME_NAMESPACE" get service tcp-proxy-service -o jsonpath='{.spec.ports[?(@.port==2323)].nodePort}')"
          [[ "$port" =~ ^32(00[0-9]|01[0-5])$ ]] || {
            echo "::error title=Invalid runtime Telnet port::Expected a port from 32000 through 32015; actual value was ${port:-empty}." >&2
            exit 1
          }
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Revalidate open PR after runtime waits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA"

      - name: Revalidate exact PR source binding after runtime waits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/preview/revalidate-preview-source-binding.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA" "$EXPECTED_MERGE_SHA"

      - name: Publish trusted preview deployment state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          PREVIEW_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          PREVIEW_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.validate-target.outputs.hostname }}
          PREVIEW_EXPOSURE_MODE: ${{ needs.validate-target.outputs.exposure_mode }}
        with:
          script: |
            const { publishPreviewComment } = require(
              `${process.env.GITHUB_WORKSPACE}/dev-tools/hosted/preview/publish-preview-comment.js`
            );
            await publishPreviewComment({
              github,
              context,
              core,
              mode: "deploying",
              markerPolicy: "preserve-reclaimed",
              statePolicy: "expected-open",
              telnetPort: process.env.PREVIEW_EXPOSURE_MODE === "public" ? "available" : "unavailable",
              staleDescription: "trusted preview deployment state",
            });

      - name: Smoke hosted preview over TCP
        if: ${{ needs.validate-target.outputs.exposure_mode == 'public' }}
        env:
          PREVIEW_BASE_URL: https://${{ needs.validate-target.outputs.hostname }}
          SMOKE_TELNET_HOST: ${{ needs.validate-target.outputs.hostname }}
          TCP_PORT: ${{ steps.runtime-port.outputs.port }}
        run: |
          : "${TCP_PORT:?runtime-port step must provide the allocated NodePort}"
          bash ./dev-tools/hosted/shared/hosted-login-look-smoke.sh

      - name: Revalidate exact source binding and runtime Namespace UID before success publication
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          EXPECTED_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID: ${{ needs.deploy-runtime.outputs.runtime_namespace_uid }}
          CAPTURED_RUNTIME_NAMESPACE_UID: ${{ steps.capture-runtime-namespace.outputs.uid }}
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/preview/revalidate-preview-source-binding.sh \
            "$PR_NUMBER" "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA" "$EXPECTED_MERGE_SHA" \
            "before success publication"
          [[ "$RUNTIME_NAMESPACE" == "pr-${PR_NUMBER}" ]] || {
            echo "::error title=Invalid preview runtime namespace::Expected pr-${PR_NUMBER}." >&2
            exit 1
          }
          [[ -n "$EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID" ]] || {
            echo "::error title=Missing deployed preview runtime Namespace UID::The deploy job did not publish its post-apply Namespace UID." >&2
            exit 1
          }
          [[ "$CAPTURED_RUNTIME_NAMESPACE_UID" == "$EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID" ]] || {
            echo "::error title=Preview runtime Namespace UID handoff changed::Expected ${EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID}; captured ${CAPTURED_RUNTIME_NAMESPACE_UID:-empty}." >&2
            exit 1
          }
          namespace_json="$(kubectl get namespace "$RUNTIME_NAMESPACE" --ignore-not-found -o json)"
          [[ -n "$namespace_json" ]] || {
            echo "::error title=Preview runtime namespace UID fence failed::Namespace ${RUNTIME_NAMESPACE} is absent." >&2
            exit 1
          }
          if ! observed_uid="$(jq -er \
            --arg expected_namespace "$RUNTIME_NAMESPACE" \
            --arg expected_pr_number "$PR_NUMBER" \
            --arg expected_base_sha "$EXPECTED_BASE_SHA" \
            --arg expected_head_sha "$EXPECTED_HEAD_SHA" \
            --arg expected_merge_sha "$EXPECTED_MERGE_SHA" \
            --arg expected_image_tag "${EXPECTED_IMAGE_TAG:-}" \
            '(
              .metadata as $metadata
              | ($metadata.labels // {}) as $labels
              | ($metadata.annotations // {}) as $annotations
              | select($metadata.name == $expected_namespace)
              | select($metadata.uid | type == "string" and length > 0)
              | select($labels["firemud.dev/preview"] == "true")
              | select($labels["firemud.dev/pr-number"] == $expected_pr_number)
              | select($annotations["firemud.dev/requested-preview-base-sha"] == $expected_base_sha)
              | select($annotations["firemud.dev/requested-preview-head-sha"] == $expected_head_sha)
              | select($annotations["firemud.dev/requested-preview-merge-sha"] == $expected_merge_sha)
              | select($annotations["firemud.dev/requested-preview-image-tag"] == $expected_image_tag)
              | select($annotations["firemud.dev/last-preview-base-sha"] == $expected_base_sha)
              | select($annotations["firemud.dev/last-preview-head-sha"] == $expected_head_sha)
              | select($annotations["firemud.dev/last-preview-merge-sha"] == $expected_merge_sha)
              | select($annotations["firemud.dev/last-preview-image-tag"] == $expected_image_tag)
              | $metadata.uid
            )' <<<"$namespace_json")"; then
            echo "::error title=Preview runtime namespace UID fence failed::Namespace ${RUNTIME_NAMESPACE} is absent or no longer has canonical ownership and head annotations." >&2
            exit 1
          fi
          [[ "$observed_uid" == "$EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID" ]] || {
            echo "::error title=Preview runtime namespace UID changed::Expected ${EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID}; observed ${observed_uid}." >&2
            exit 1
          }

      - name: Record proof-complete preview tuple
        if: ${{ success() }}
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          EXPECTED_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID: ${{ needs.deploy-runtime.outputs.runtime_namespace_uid }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_NAMESPACE" == "pr-${PR_NUMBER}" ]] || {
            echo "::error title=Invalid preview runtime namespace::Expected pr-${PR_NUMBER}." >&2
            exit 1
          }
          for sha_name in EXPECTED_BASE_SHA EXPECTED_HEAD_SHA EXPECTED_MERGE_SHA; do
            sha_value="${!sha_name}"
            [[ "$sha_value" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error title=Invalid preview ${sha_name,,} SHA::Expected exactly 40 lowercase hexadecimal characters." >&2
              exit 1
            }
          done
          [[ "$EXPECTED_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "::error title=Invalid preview image tag::Expected a canonical immutable image tag." >&2
            exit 1
          }
          [[ -n "$EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID" ]] || {
            echo "::error title=Missing deployed preview runtime Namespace UID::The deploy job did not publish its post-apply Namespace UID." >&2
            exit 1
          }
          namespace_json="$(kubectl get namespace "$RUNTIME_NAMESPACE" --ignore-not-found -o json)"
          [[ -n "$namespace_json" ]] || {
            echo "::error title=Missing preview runtime namespace proof target::Expected ${RUNTIME_NAMESPACE}." >&2
            exit 1
          }
          if ! namespace_identity="$(jq -er \
            --arg expected_namespace "$RUNTIME_NAMESPACE" \
            --arg expected_pr_number "$PR_NUMBER" \
            --arg expected_base_sha "$EXPECTED_BASE_SHA" \
            --arg expected_head_sha "$EXPECTED_HEAD_SHA" \
            --arg expected_merge_sha "$EXPECTED_MERGE_SHA" \
            --arg expected_image_tag "$EXPECTED_IMAGE_TAG" \
            --arg expected_namespace_uid "$EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID" \
            '(
              .metadata as $metadata
              | ($metadata.labels // {}) as $labels
              | ($metadata.annotations // {}) as $annotations
              | select($metadata.name == $expected_namespace)
              | select($metadata.uid == $expected_namespace_uid)
              | select($metadata.resourceVersion | type == "string" and length > 0)
              | select($labels["firemud.dev/preview"] == "true")
              | select($labels["firemud.dev/pr-number"] == $expected_pr_number)
              | select($annotations["firemud.dev/requested-preview-base-sha"] == $expected_base_sha)
              | select($annotations["firemud.dev/requested-preview-head-sha"] == $expected_head_sha)
              | select($annotations["firemud.dev/requested-preview-merge-sha"] == $expected_merge_sha)
              | select($annotations["firemud.dev/requested-preview-image-tag"] == $expected_image_tag)
              | select($annotations["firemud.dev/last-preview-base-sha"] == $expected_base_sha)
              | select($annotations["firemud.dev/last-preview-head-sha"] == $expected_head_sha)
              | select($annotations["firemud.dev/last-preview-merge-sha"] == $expected_merge_sha)
              | select($annotations["firemud.dev/last-preview-image-tag"] == $expected_image_tag)
              | [ $metadata.uid, $metadata.resourceVersion ]
              | join("|")
            )' <<<"$namespace_json")"; then
            echo "::error title=Preview runtime proof fence failed::Namespace ${RUNTIME_NAMESPACE} no longer has the exact deployed tuple and Namespace UID." >&2
            exit 1
          fi
          IFS='|' read -r namespace_uid namespace_resource_version <<<"$namespace_identity"
          kubectl annotate namespace "$RUNTIME_NAMESPACE" \
            "firemud.dev/proof-preview-base-sha=${EXPECTED_BASE_SHA}" \
            "firemud.dev/proof-preview-head-sha=${EXPECTED_HEAD_SHA}" \
            "firemud.dev/proof-preview-merge-sha=${EXPECTED_MERGE_SHA}" \
            "firemud.dev/proof-preview-image-tag=${EXPECTED_IMAGE_TAG}" \
            "firemud.dev/proof-preview-namespace-uid=${namespace_uid}" \
            --overwrite \
            --resource-version "$namespace_resource_version" >/dev/null

      - name: Publish trusted preview success
        if: ${{ success() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          PREVIEW_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          PREVIEW_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.validate-target.outputs.hostname }}
          PREVIEW_EXPOSURE_MODE: ${{ needs.validate-target.outputs.exposure_mode }}
          PREVIEW_TELNET_PORT: ${{ steps.runtime-port.outputs.port }}
        with:
          script: |
            const { publishPreviewComment } = require(
              `${process.env.GITHUB_WORKSPACE}/dev-tools/hosted/preview/publish-preview-comment.js`
            );
            await publishPreviewComment({
              github,
              context,
              core,
              mode: "success",
              markerPolicy: "replace",
              statePolicy: "expected-open",
              staleDescription: "trusted preview success",
            });

      - name: Publish trusted preview verification failure
        if: ${{ !cancelled() && failure() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          PREVIEW_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          PREVIEW_MERGE_SHA: ${{ needs.validate-target.outputs.merge_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.validate-target.outputs.hostname }}
          PREVIEW_EXPOSURE_MODE: ${{ needs.validate-target.outputs.exposure_mode }}
          RUNTIME_NAMESPACE: ${{ needs.validate-target.outputs.namespace }}
          EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID: ${{ needs.deploy-runtime.outputs.runtime_namespace_uid }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const { publishPreviewComment } = require(
              `${process.env.GITHUB_WORKSPACE}/dev-tools/hosted/preview/publish-preview-comment.js`
            );
            let namespaceJson = "";
            let kubectlError = null;
            try {
              namespaceJson = execFileSync(
                "kubectl",
                [
                  "get",
                  "namespace",
                  process.env.RUNTIME_NAMESPACE,
                  "--ignore-not-found",
                  "-o",
                  "json",
                ],
                { encoding: "utf8" },
              );
            } catch (error) {
              kubectlError = error;
            }
            if (kubectlError) {
              core.warning(
                `Unable to compare the current preview Namespace UID before failure publication; preserving failure reporting: ${kubectlError.message}`,
              );
            } else if (namespaceJson.trim()) {
              let observedUid = "";
              try {
                const namespace = JSON.parse(namespaceJson);
                observedUid =
                  typeof namespace?.metadata?.uid === "string"
                    ? namespace.metadata.uid
                    : "";
              } catch (error) {
                core.warning(
                  `Current preview Namespace JSON was malformed before failure publication; preserving failure reporting: ${error.message}`,
                );
              }
              if (
                observedUid &&
                process.env.EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID &&
                observedUid !== process.env.EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID
              ) {
                core.notice(
                  `Skipping stale preview verification failure publication because current Namespace UID ${observedUid} differs from this deploy's UID ${process.env.EXPECTED_DEPLOYED_RUNTIME_NAMESPACE_UID}.`,
                );
                return;
              }
            }
            await publishPreviewComment({
              github,
              context,
              core,
              mode: "failure",
              markerPolicy: "replace",
              statePolicy: "expected-open",
              telnetPort: "unavailable",
              failureStage: "verify-runtime",
              staleDescription: "trusted preview verification failure",
            });

      - name: Remove runtime kubeconfig
        if: ${{ always() }}
        run: |
          rm -f -- \
            "$RUNNER_TEMP/preview-runtime.kubeconfig" \
            "$RUNNER_TEMP/preview-namespace-manager.kubeconfig"

  destroy-runtime:
    name: Delete Preview Runtime
    timeout-minutes: 60
    runs-on:
      - self-hosted
      - preview
      - linux
      - x64
    needs: validate-target
    # Close cleanup is mode-independent: a retained identity may have been created
    # before the default-branch certificate identity mode changed.
    if: ${{ needs.validate-target.outputs.action == 'destroy' }}
    environment: trusted-hosted-cluster
    concurrency:
      group: preview-allocation-lifecycle
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # Check out the trusted default-branch cleanup implementation.
      pull-requests: read # Revalidate the closed pull request before runtime deletion.
      issues: write # Publish the required closed-pull-request removal state.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up canonical GitHub CLI
        uses: ./.github/actions/setup-gh
      - name: Set up canonical Python dependencies
        uses: ./.github/actions/setup-python
        with:
          requirements: yaml
      - name: Set up kubectl
        uses: ./.github/actions/setup-kubectl
      - name: Write trusted namespace-manager kubeconfig
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.TRUSTED_HOSTED_PREVIEW_NAMESPACE_MANAGER_KUBECONFIG }}
          path: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
          export-to-github-env: 'false'

      - name: Validate kubectl client/server skew
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
        run: bash ./dev-tools/hosted/shared/check-kubectl-version-skew.sh

      - name: Revalidate preview cleanup target before runtime deletion
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          if [[ "${{ needs.validate-target.outputs.cleanup_state }}" == open ]]; then
            bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
              --open-cleanup "$PR_NUMBER" "$EXPECTED_HEAD_SHA"
          else
            bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
              --cleanup "$PR_NUMBER" "$EXPECTED_HEAD_SHA"
          fi
      - name: Delete runtime and wait for NotFound
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
        run: |
          bash ./dev-tools/hosted/preview/prune-stale-preview-namespaces.sh \
            --delete-runtime "${{ needs.validate-target.outputs.namespace }}"

      - name: Publish trusted preview removal
        if: ${{ success() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.validate-target.outputs.hostname }}
          PREVIEW_STATE_POLICY: ${{ needs.validate-target.outputs.cleanup_state == 'open' && 'expected-open' || 'expected-closed' }}
        with:
          script: |
            const { publishPreviewComment } = require(
              `${process.env.GITHUB_WORKSPACE}/dev-tools/hosted/preview/publish-preview-comment.js`
            );
            await publishPreviewComment({
              github,
              context,
              core,
              mode: "removed",
              markerPolicy: "replace",
              statePolicy: process.env.PREVIEW_STATE_POLICY,
              telnetPort: "unavailable",
              staleDescription: "trusted preview removal",
            });

      - name: Publish trusted preview removal failure
        if: ${{ !cancelled() && failure() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.validate-target.outputs.hostname }}
          PREVIEW_STATE_POLICY: ${{ needs.validate-target.outputs.cleanup_state == 'open' && 'expected-open' || 'expected-closed' }}
        with:
          script: |
            const { publishPreviewComment } = require(
              `${process.env.GITHUB_WORKSPACE}/dev-tools/hosted/preview/publish-preview-comment.js`
            );
            await publishPreviewComment({
              github,
              context,
              core,
              mode: "failure",
              markerPolicy: "replace",
              statePolicy: process.env.PREVIEW_STATE_POLICY,
              telnetPort: "unavailable",
              failureStage: "destroy-runtime",
              staleDescription: "trusted preview removal failure",
            });

      - name: Remove runtime kubeconfig
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/preview-namespace-manager.kubeconfig"

  retire-identity:
    name: Retire Hosted Identity After Runtime Deletion
    timeout-minutes: 60
    runs-on:
      - self-hosted
      - preview
      - linux
      - x64
    needs: [validate-target, destroy-runtime]
    if: ${{ needs.validate-target.outputs.action == 'destroy' && needs.validate-target.outputs.retire_identity == 'true' && needs.destroy-runtime.result == 'success' }}
    environment: trusted-hosted-cluster
    concurrency:
      # destroy-runtime releases this lifecycle lock; retire-identity reacquires it and rechecks identity before retirement.
      group: preview-allocation-lifecycle
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # Check out the trusted default-branch retirement implementation.
      pull-requests: read # Revalidate the closed pull request before identity retirement.
      issues: write # Publish a retirement failure on the closed pull request.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up canonical GitHub CLI
        uses: ./.github/actions/setup-gh
      - name: Set up canonical Python dependencies
        uses: ./.github/actions/setup-python
      - name: Set up kubectl
        uses: ./.github/actions/setup-kubectl
      - name: Check Hosted identity requester credentials
        env:
          REQUESTER_KUBECONFIG: ${{ secrets.TRUSTED_HOSTED_IDENTITY_REQUESTER_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "$REQUESTER_KUBECONFIG" ]]; then
            echo "::error title=Missing Hosted identity requester credentials::Cannot retire hosted identity without the trusted requester kubeconfig." >&2
            exit 1
          fi
      - name: Write requester kubeconfig
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.TRUSTED_HOSTED_IDENTITY_REQUESTER_KUBECONFIG }}
          path: ${{ runner.temp }}/hosted-identity-requester.kubeconfig
          export-to-github-env: 'false'
      - name: Validate kubectl client/server skew
        env:
          KUBECONFIG: ${{ runner.temp }}/hosted-identity-requester.kubeconfig
        run: bash ./dev-tools/hosted/shared/check-kubectl-version-skew.sh
      - name: Discover HostedEnvironmentIdentity API
        id: identity-api
        env:
          KUBECONFIG: ${{ runner.temp }}/hosted-identity-requester.kubeconfig
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/shared/request-hosted-identity.sh --discover-api \
            >> "$GITHUB_OUTPUT"
      - name: Revalidate preview cleanup target before identity retirement
        if: ${{ steps.identity-api.outputs.served == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          bash ./dev-tools/hosted/preview/revalidate-preview-deploy.sh \
            --cleanup "$PR_NUMBER" "$EXPECTED_HEAD_SHA"

      - name: Check HostedEnvironmentIdentity existence before retirement
        id: identity-existence
        if: ${{ steps.identity-api.outputs.served == 'true' }}
        env:
          IDENTITY_NAME: pr-${{ needs.validate-target.outputs.pr_number }}
          KUBECONFIG: ${{ runner.temp }}/hosted-identity-requester.kubeconfig
        run: |
          set -euo pipefail
          identity_json="$(kubectl -n firemud-system get hostedenvironmentidentity "$IDENTITY_NAME" \
            --ignore-not-found -o json)"
          if [[ -z "$identity_json" ]]; then
            echo "HostedEnvironmentIdentity/${IDENTITY_NAME} is absent; no retirement is required."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e \
            --arg identity_name "$IDENTITY_NAME" \
            '(.apiVersion == "platform.firemud.dev/v1alpha1") and
             (.kind == "HostedEnvironmentIdentity") and
             (.metadata.namespace == "firemud-system") and
             (.metadata.name == $identity_name)' \
            <<<"$identity_json" >/dev/null || {
              echo "HostedEnvironmentIdentity/${IDENTITY_NAME} lookup returned an unexpected object; refusing retirement." >&2
              exit 1
            }
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Apply canonical Retired request
        if: ${{ steps.identity-api.outputs.served == 'true' && steps.identity-existence.outputs.exists == 'true' }}
        env:
          IDENTITY_NAME: pr-${{ needs.validate-target.outputs.pr_number }}
          KUBECONFIG: ${{ runner.temp }}/hosted-identity-requester.kubeconfig
        run: bash ./dev-tools/hosted/shared/request-hosted-identity.sh "$IDENTITY_NAME" Retired
      - name: Observe terminal retirement and delete request
        if: ${{ steps.identity-api.outputs.served == 'true' && steps.identity-existence.outputs.exists == 'true' }}
        env:
          IDENTITY_NAME: pr-${{ needs.validate-target.outputs.pr_number }}
          KUBECONFIG: ${{ runner.temp }}/hosted-identity-requester.kubeconfig
        run: |
          bash ./dev-tools/hosted/preview/wait-for-hosted-identity.sh \
            --retired "$IDENTITY_NAME" 600
          kubectl -n firemud-system delete hostedenvironmentidentity "$IDENTITY_NAME" \
            --wait=true --timeout=180s

      - name: Publish trusted identity retirement failure
        if: ${{ !cancelled() && failure() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_PR_NUMBER: ${{ needs.validate-target.outputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
          PREVIEW_IMAGE_TAG: ${{ needs.validate-target.outputs.image_tag }}
          PREVIEW_HOSTNAME: ${{ needs.validate-target.outputs.hostname }}
        with:
          script: |
            const { publishPreviewComment } = require(
              `${process.env.GITHUB_WORKSPACE}/dev-tools/hosted/preview/publish-preview-comment.js`
            );
            await publishPreviewComment({
              github,
              context,
              core,
              mode: "failure",
              markerPolicy: "replace",
              statePolicy: "expected-closed",
              telnetPort: "unavailable",
              failureStage: "retire-identity",
              staleDescription: "trusted identity retirement failure",
            });

      - name: Remove requester kubeconfig
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/hosted-identity-requester.kubeconfig"
