name: Manual Backup Verification

on:
  workflow_dispatch:
    inputs:
      restore:
        description: 'Run restore test as well'
        required: false
        default: 'false'
      namespace:
        description: 'Namespace for restore test'
        required: false
        default: 'restore-test'
      backup_name:
        description: 'Backup name to restore (defaults to latest)'
        required: false
        default: ''
      restore_environment:
        description: 'Environment identity for external credential validation'
        required: false
        default: 'staging'
      expected_pg_dump_bucket:
        description: 'Expected backup bucket for validation'
        required: false
        default: ''
      pg_dump_bucket:
        description: 'Observed backup bucket bound in the restored environment'
        required: false
        default: ''
      pg_dump_endpoint:
        description: 'Observed backup endpoint bound in the restored environment'
        required: false
        default: ''
      expected_asset_store_bucket:
        description: 'Expected asset bucket for validation'
        required: false
        default: ''
      asset_store_bucket:
        description: 'Observed asset bucket bound in the restored environment'
        required: false
        default: ''
      expected_asset_store_endpoint:
        description: 'Expected asset endpoint for validation'
        required: false
        default: ''
      asset_store_endpoint:
        description: 'Observed asset endpoint bound in the restored environment'
        required: false
        default: ''
      expected_smtp_host:
        description: 'Expected SMTP host for validation'
        required: false
        default: ''
      smtp_host:
        description: 'Observed SMTP host bound in the restored environment'
        required: false
        default: ''
      smtp_port:
        description: 'Observed SMTP port bound in the restored environment'
        required: false
        default: ''
      expected_operator_cert_fingerprint:
        description: 'Expected operator certificate fingerprint for validation'
        required: false
        default: ''
      operator_cert_fingerprint:
        description: 'Observed operator certificate fingerprint for validation'
        required: false
        default: ''
      external_credential_evidence_ref:
        description: 'Required: in-repo recovery record with external credential validation evidence'
        required: false
        default: ''
      sanitization_evidence_ref:
        description: 'Required for staging restores: in-repo sanitization evidence path'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up canonical Python
        uses: ./.github/actions/setup-python

      - name: Set up kubectl
        uses: ./.github/actions/setup-kubectl

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: Install Velero CLI
        env:
          VELERO_VERSION: ${{ steps.workflow-tool-versions.outputs.velero-version }}
          VELERO_SHA256: ${{ steps.workflow-tool-versions.outputs.velero-linux-amd64-sha256 }}
        run: |
          [[ "$(uname -s)/$(uname -m)" == "Linux/x86_64" ]] || { echo "Unsupported Velero platform" >&2; exit 1; }
          archive="velero-v${VELERO_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://github.com/vmware-tanzu/velero/releases/download/v${VELERO_VERSION}/${archive}" -o "$archive"
          echo "${VELERO_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive"
          sudo install -m 0755 "velero-v${VELERO_VERSION}-linux-amd64/velero" /usr/local/bin/velero

      - name: Verify backups
        run: dev-tools/backups/verify-backups.sh

      - name: Create restore namespace
        if: ${{ inputs.restore == 'true' }}
        run: |
          kubectl create namespace "${{ inputs.namespace }}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Run restore test
        if: ${{ inputs.restore == 'true' }}
        env:
          FIREMUD_K8S_NAMESPACE: ${{ inputs.namespace }}
        run: |
          BACKUP="${{ inputs.backup_name }}"
          if [ -z "$BACKUP" ]; then
            BACKUP=$(velero backup get -n ${{ inputs.namespace }} --no-headers | awk 'END{print $1}')
          fi
          dev-tools/restores/restore-cluster.sh "$BACKUP"

      - name: Validate external credential bindings
        if: ${{ inputs.restore == 'true' }}
        env:
          PG_DUMP_BUCKET: ${{ inputs.pg_dump_bucket }}
          PG_DUMP_ENDPOINT: ${{ inputs.pg_dump_endpoint }}
          ASSET_STORE_BUCKET: ${{ inputs.asset_store_bucket }}
          ASSET_STORE_ENDPOINT: ${{ inputs.asset_store_endpoint }}
          SMTP_HOST: ${{ inputs.smtp_host }}
          SMTP_PORT: ${{ inputs.smtp_port }}
          OPERATOR_CERT_FINGERPRINT: ${{ inputs.operator_cert_fingerprint }}
          EXPECTED_PG_DUMP_BUCKET: ${{ inputs.expected_pg_dump_bucket }}
          EXPECTED_ASSET_STORE_BUCKET: ${{ inputs.expected_asset_store_bucket }}
          EXPECTED_ASSET_STORE_ENDPOINT: ${{ inputs.expected_asset_store_endpoint }}
          EXPECTED_SMTP_HOST: ${{ inputs.expected_smtp_host }}
          EXPECTED_OPERATOR_CERT_FINGERPRINT: ${{ inputs.expected_operator_cert_fingerprint }}
          EXTERNAL_CREDENTIAL_EVIDENCE_REF: ${{ inputs.external_credential_evidence_ref }}
          SANITIZATION_EVIDENCE_REF: ${{ inputs.sanitization_evidence_ref }}
        run: |
          dev-tools/restores/validate-external-credentials.sh "${{ inputs.restore_environment }}"
