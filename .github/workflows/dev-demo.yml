name: Develop Dev Demo Environment

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      action:
        description: Dev-demo operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy
      image_tag:
        description: Image tag to deploy; defaults to the target SHA
        required: false
        default: ""
        type: string
      head_sha:
        description: Head SHA to align the environment with
        required: false
        default: ""
        type: string
      hostname:
        description: Fixed dev-demo hostname
        required: false
        default: dev.preview.firedevops.net
        type: string
      telnet_port:
        description: Fixed dev-demo TCP NodePort
        required: false
        default: "32016"
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: dev-demo-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  dev-demo-plan:
    name: Dev Demo Plan
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.derive.outputs.action }}
      namespace: ${{ steps.derive.outputs.namespace }}
      release_name: ${{ steps.derive.outputs.release_name }}
      hostname: ${{ steps.derive.outputs.hostname }}
      image_tag: ${{ steps.derive.outputs.image_tag }}
      head_sha: ${{ steps.derive.outputs.head_sha }}
      telnet_port: ${{ steps.derive.outputs.telnet_port }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Derive dev-demo target
        id: derive
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ACTION="deploy"
            HEAD_SHA="${{ github.sha }}"
            HOSTNAME="dev.preview.firedevops.net"
            TELNET_PORT="32016"
            IMAGE_TAG=""
          else
            ACTION="${{ inputs.action }}"
            HEAD_SHA="${{ inputs.head_sha }}"
            HOSTNAME="${{ inputs.hostname }}"
            TELNET_PORT="${{ inputs.telnet_port }}"
            IMAGE_TAG="${{ inputs.image_tag }}"
          fi
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="${GITHUB_SHA}"
          fi
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="${HEAD_SHA}"
          fi
          {
            echo "action=${ACTION}"
            echo "namespace=dev"
            echo "release_name=dev"
            echo "hostname=${HOSTNAME}"
            echo "image_tag=${IMAGE_TAG}"
            echo "head_sha=${HEAD_SHA}"
            echo "telnet_port=${TELNET_PORT}"
          } >> "$GITHUB_OUTPUT"

      - name: Show derived dev-demo target
        run: |
          cat <<EOF
          action=${{ steps.derive.outputs.action }}
          namespace=${{ steps.derive.outputs.namespace }}
          release_name=${{ steps.derive.outputs.release_name }}
          hostname=${{ steps.derive.outputs.hostname }}
          image_tag=${{ steps.derive.outputs.image_tag }}
          head_sha=${{ steps.derive.outputs.head_sha }}
          telnet_port=${{ steps.derive.outputs.telnet_port }}
          EOF

  dev-demo-deploy:
    name: Deploy Dev Demo Release
    runs-on:
      - self-hosted
      - preview
    needs: dev-demo-plan
    if: ${{ needs.dev-demo-plan.outputs.action == 'deploy' }}
    environment: dev-demo-cluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.33.4

      - name: Set up Helm
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.20.1"
            INSTALL_DIR="$HOME/.local/bin"
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
            tar -xzf /tmp/helm.tgz -C /tmp
            install /tmp/linux-amd64/helm "$INSTALL_DIR/helm"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          helm version

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
          PREVIEW_KUBECONFIG_LOCAL_SERVER: https://127.0.0.1:6443
        run: |
          KUBECONFIG_PATH="$(bash ./dev-tools/hosted/shared/write-kubeconfig.sh)"
          bash ./dev-tools/hosted/shared/persist-runner-kubeconfig.sh "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Verify cluster access
        id: cluster-access
        run: |
          set +e
          kubectl get namespace kube-system >/dev/null
          namespace_status=$?
          kubectl auth can-i list namespaces --all-namespaces >/dev/null
          namespace_list_status=$?
          set -e

          if [ "$namespace_status" -eq 0 ] && [ "$namespace_list_status" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Dev-demo cluster access unavailable; skipping hosted deploy for this run."
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "DEV_DEMO_STAGE=cluster-access" >> "$GITHUB_ENV"

      - name: Reset dev-demo namespace for clean deploy
        if: ${{ steps.cluster-access.outputs.available == 'true' }}
        run: |
          bash ./dev-tools/hosted/shared/delete-hosted-namespace.sh \
            "${{ needs.dev-demo-plan.outputs.namespace }}" \
            "${{ needs.dev-demo-plan.outputs.release_name }}"

      - name: Ensure dev-demo namespace exists
        if: ${{ steps.cluster-access.outputs.available == 'true' }}
        run: |
          bash ./dev-tools/hosted/dev-demo/ensure-dev-demo-namespace.sh \
            "${{ needs.dev-demo-plan.outputs.namespace }}"

      - name: Ensure GHCR pull secret exists
        if: ${{ steps.cluster-access.outputs.available == 'true' }}
        env:
          PREVIEW_GHCR_USERNAME: ${{ secrets.PREVIEW_GHCR_USERNAME }}
          PREVIEW_GHCR_TOKEN: ${{ secrets.PREVIEW_GHCR_TOKEN }}
        run: |
          bash ./dev-tools/hosted/shared/ensure-ghcr-pull-secret.sh "${{ needs.dev-demo-plan.outputs.namespace }}"

      - name: Wait for develop runtime images
        if: ${{ steps.cluster-access.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "DEV_DEMO_STAGE=wait-for-images" >> "$GITHUB_ENV"
          bash ./dev-tools/hosted/shared/wait-for-runtime-images.sh "${{ needs.dev-demo-plan.outputs.image_tag }}"

      - name: Ensure dev-demo gRPC TLS secret exists
        if: ${{ steps.cluster-access.outputs.available == 'true' }}
        run: |
          bash ./dev-tools/hosted/shared/ensure-grpc-tls-secret.sh "${{ needs.dev-demo-plan.outputs.namespace }}"

      - name: Render dev-demo values
        if: ${{ steps.cluster-access.outputs.available == 'true' }}
        run: |
          python3 ./dev-tools/hosted/dev-demo/render-dev-demo-values.py \
            k8s/helm/firemud/values-hosted-shared.example.yaml \
            /tmp/dev-demo-values.yaml \
            "${{ needs.dev-demo-plan.outputs.namespace }}" \
            "${{ needs.dev-demo-plan.outputs.release_name }}" \
            "${{ needs.dev-demo-plan.outputs.hostname }}" \
            "${{ needs.dev-demo-plan.outputs.image_tag }}" \
            "${{ needs.dev-demo-plan.outputs.telnet_port }}"

      - name: Validate dev-demo chart render
        if: ${{ steps.cluster-access.outputs.available == 'true' }}
        run: |
          helm template "${{ needs.dev-demo-plan.outputs.release_name }}" k8s/helm/firemud \
            -f /tmp/dev-demo-values.yaml \
            --namespace "${{ needs.dev-demo-plan.outputs.namespace }}" \
            >/tmp/dev-demo-rendered.yaml
          kubectl apply --dry-run=server -n "${{ needs.dev-demo-plan.outputs.namespace }}" -f /tmp/dev-demo-rendered.yaml
          wc -l /tmp/dev-demo-rendered.yaml

      - name: Upload rendered dev-demo artifacts
        if: ${{ steps.cluster-access.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dev-demo-render-${{ needs.dev-demo-plan.outputs.release_name }}
          path: |
            /tmp/dev-demo-values.yaml
            /tmp/dev-demo-rendered.yaml

      - name: Record reconciled dev-demo target
        if: ${{ steps.cluster-access.outputs.available == 'true' }}
        run: |
          bash ./dev-tools/hosted/dev-demo/annotate-dev-demo-namespace.sh \
            "${{ needs.dev-demo-plan.outputs.namespace }}" \
            "${{ needs.dev-demo-plan.outputs.head_sha }}" \
            "${{ needs.dev-demo-plan.outputs.image_tag }}" \
            "${{ needs.dev-demo-plan.outputs.telnet_port }}"

      - name: Summarize dev-demo target
        if: ${{ steps.cluster-access.outputs.available == 'true' }}
        run: |
          bash ./dev-tools/hosted/dev-demo/write-dev-demo-summary.sh \
            target \
            "${{ needs.dev-demo-plan.outputs.head_sha }}" \
            "${{ needs.dev-demo-plan.outputs.image_tag }}" \
            "${{ needs.dev-demo-plan.outputs.hostname }}" \
            "${{ needs.dev-demo-plan.outputs.telnet_port }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy dev-demo release
        if: ${{ steps.cluster-access.outputs.available == 'true' }}
        id: deploy-release
        continue-on-error: true
        run: |
          echo "DEV_DEMO_STAGE=deploy" >> "$GITHUB_ENV"
          helm upgrade --install "${{ needs.dev-demo-plan.outputs.release_name }}" k8s/helm/firemud \
            -f /tmp/dev-demo-values.yaml \
            --namespace "${{ needs.dev-demo-plan.outputs.namespace }}" \
            --wait \
            --timeout 15m

      - name: Show deployed dev-demo services
        if: ${{ always() && steps.cluster-access.outputs.available == 'true' }}
        run: |
          kubectl -n "${{ needs.dev-demo-plan.outputs.namespace }}" get pods,svc,ingress

      - name: Show dev-demo rollout diagnostics
        if: ${{ always() && steps.cluster-access.outputs.available == 'true' && steps.deploy-release.outcome == 'failure' }}
        run: |
          bash ./dev-tools/hosted/shared/show-rollout-diagnostics.sh \
            "${{ needs.dev-demo-plan.outputs.namespace }}" \
            "${DEV_DEMO_STAGE:-unknown}" \
            "Dev-demo"

      - name: Fail if dev-demo rollout did not complete
        if: ${{ always() && steps.cluster-access.outputs.available == 'true' && steps.deploy-release.outcome == 'failure' }}
        run: |
          echo "Dev-demo rollout failed during helm upgrade/install."
          exit 1

      - name: Export demo smoke defaults
        if: ${{ steps.cluster-access.outputs.available == 'true' && steps.deploy-release.outcome == 'success' }}
        run: |
          source ./dev-tools/smoke/demo-smoke-defaults.sh
          {
            echo "DEMO_SMOKE_EMAIL=${DEMO_SMOKE_EMAIL}"
            echo "DEMO_SMOKE_PASSWORD=${DEMO_SMOKE_PASSWORD}"
            echo "DEMO_SMOKE_USERNAME=${DEMO_SMOKE_USERNAME}"
            echo "DEMO_SMOKE_WORLD=${DEMO_SMOKE_WORLD}"
          } >> "$GITHUB_ENV"

      - name: Create dev-demo smoke account
        if: ${{ steps.cluster-access.outputs.available == 'true' && steps.deploy-release.outcome == 'success' }}
        env:
          PREVIEW_NAMESPACE: ${{ needs.dev-demo-plan.outputs.namespace }}
          PREVIEW_TENANT_ID: "1"
        run: |
          echo "DEV_DEMO_STAGE=bootstrap" >> "$GITHUB_ENV"
          BOOTSTRAP_SCRIPT=/tmp/dev-demo-bootstrap.py
          cat >"${BOOTSTRAP_SCRIPT}" <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          tenant_id = 1
          game_template_id = 1
          bootstrap_mode = os.environ["BOOTSTRAP_MODE"]
          email = os.environ["DEMO_SMOKE_EMAIL"]
          password = os.environ["DEMO_SMOKE_PASSWORD"]
          username = os.environ["DEMO_SMOKE_USERNAME"]
          control_plane_request_id = f"dev-demo-smoke-bootstrap-{int(time.time())}"

          def readiness_ok(url):
            try:
              with urllib.request.urlopen(url, timeout=10) as response:
                body = response.read().decode("utf-8", errors="ignore")
                return response.status < 500 and "\"status\":\"UP\"" in body.replace(" ", "")
            except OSError:
              return False

          def wait_for_ready(name, url, timeout_seconds=60):
            deadline = time.time() + timeout_seconds
            while time.time() < deadline:
              if readiness_ok(url):
                return
              time.sleep(2)
            raise SystemExit(f"{name} readiness did not report UP at {url}")

          def post_json(url, payload):
            request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
            )
            try:
              with urllib.request.urlopen(request, timeout=30) as response:
                return response.status, response.read().decode("utf-8", errors="ignore")
            except urllib.error.HTTPError as exc:
              return exc.code, exc.read().decode("utf-8", errors="ignore")
            except urllib.error.URLError as exc:
              return 503, str(exc)

          def sanitize_error_body(body):
            if not body:
              return "redacted response body"
            try:
              payload = json.loads(body)
            except json.JSONDecodeError:
              return "redacted non-json response body"
            error = payload.get("error")
            if isinstance(error, dict):
              code = error.get("code")
              message = error.get("message")
              if code and message:
                return f"{code}: {message}"
              if code:
                return str(code)
              if message:
                return str(message)
            return "redacted response body"

          def public_account_url(path):
            return f"{gateway_base_url}/api/account{path}"

          def bootstrap_session(account_id, timeout_seconds=120):
            deadline = time.time() + timeout_seconds
            attempt = 1
            last_status = None
            last_body = None
            while time.time() < deadline:
              status, session_body = post_json(
                "http://game-session-service:8080/sessions",
                {
                  "tenantId": tenant_id,
                  "gameTemplateId": game_template_id,
                  "controlPlaneRequestId": control_plane_request_id,
                  "ownerAccountId": account_id,
                },
              )
              print(f"Session bootstrap attempt {attempt} returned {status}")
              if status < 400:
                return status, session_body
              last_status = status
              last_body = session_body
              if status < 500:
                break
              attempt += 1
              time.sleep(2)
            raise SystemExit(
              "Dev-demo smoke session bootstrap failed with status "
              f"{last_status}: {sanitize_error_body(last_body)}"
            )

          def ensure_demo_account():
            status, body = post_json(
              public_account_url("/accounts"),
              {
                "tenantId": tenant_id,
                "username": username,
                "email": email,
                "password": password,
              },
            )
            print(f"Demo account creation attempt returned {status}")
            if status < 400 or status == 409:
              return True
            if status >= 500:
              print(
                "Demo account creation returned a transient error; "
                "will retry account creation on the next unauthorized bootstrap attempt"
              )
              return False
            raise SystemExit(
              "Dev-demo account creation failed with status "
              f"{status}: {sanitize_error_body(body)}"
            )

          def issue_player_bootstrap(timeout_seconds=120):
            deadline = time.time() + timeout_seconds
            attempt = 1
            last_status = None
            last_body = None
            account_create_confirmed = False
            while time.time() < deadline:
              status, bootstrap_body = post_json(
                public_account_url("/auth/player-bootstrap"),
                {
                  "accountIdentifier": email,
                  "secret": password,
                },
              )
              print(f"Player bootstrap attempt {attempt} returned {status}")
              if status < 400:
                return status, bootstrap_body
              last_status = status
              last_body = bootstrap_body
              if status == 401:
                if not account_create_confirmed:
                  account_create_confirmed = ensure_demo_account()
                attempt += 1
                time.sleep(2)
                continue
              if status >= 500:
                attempt += 1
                time.sleep(2)
                continue
              break
            raise SystemExit(
              "Player bootstrap failed with status "
              f"{last_status}: {sanitize_error_body(last_body)}"
            )

          gateway_base_url = ""
          if bootstrap_mode == "account":
            gateway_base_url = os.environ["BOOTSTRAP_GATEWAY_BASE_URL"]
            wait_for_ready(
              "spring-cloud-gateway",
              f"{gateway_base_url}/actuator/health/readiness",
            )
            status, bootstrap_body = issue_player_bootstrap()
            if status >= 400:
              raise SystemExit(
                "Player bootstrap failed with status "
                f"{status}: {sanitize_error_body(bootstrap_body)}"
              )
            bootstrap_payload = json.loads(bootstrap_body or "{}")
            account_id = (((bootstrap_payload.get("data") or {}).get("accountId")))
            if not account_id:
              raise SystemExit("Dev-demo bootstrap response did not include account id")
            with open(os.environ["BOOTSTRAP_ACCOUNT_ID_FILE"], "w", encoding="utf-8") as account_file:
              account_file.write(account_id)
            raise SystemExit(0)

          if bootstrap_mode != "session":
            raise SystemExit(f"Unsupported dev-demo bootstrap mode: {bootstrap_mode}")

          try:
            with open("/tmp/account-id", encoding="utf-8") as account_file:
              account_id = account_file.read().strip()
          except OSError as exc:
            raise SystemExit(f"Dev-demo bootstrap account id could not be read: {exc}")
          if not account_id:
            raise SystemExit("Dev-demo bootstrap account id was empty")

          wait_for_ready("account-service", "http://account-service:8080/actuator/health/readiness")
          wait_for_ready("entity-management-service", "http://entity-management-service:8080/actuator/health/readiness")
          wait_for_ready("game-design-service", "http://game-design-service:8080/actuator/health/readiness")
          wait_for_ready("game-logic-service", "http://game-logic-service:8080/actuator/health/readiness")
          wait_for_ready("world-management-service", "http://world-management-service:8080/actuator/health/readiness")
          wait_for_ready("game-session-service", "http://game-session-service:8080/actuator/health/readiness")
          wait_for_ready("spring-cloud-gateway", "http://spring-cloud-gateway/actuator/health/readiness")

          status, session_body = bootstrap_session(account_id)
          PY
          BOOTSTRAP_POD_LOG=/tmp/dev-demo-bootstrap-pod.log
          BOOTSTRAP_SECRET_DIR=
          BOOTSTRAP_ACCOUNT_ID_FILE=/tmp/dev-demo-account-id
          BOOTSTRAP_PORT_FORWARD_LOG=/tmp/dev-demo-gateway-port-forward.log
          BOOTSTRAP_PORT_FORWARD_PID=
          cleanup_bootstrap_port_forward() {
            if [[ -z "${BOOTSTRAP_PORT_FORWARD_PID:-}" ]]; then
              return 0
            fi
            kill "${BOOTSTRAP_PORT_FORWARD_PID}" >/dev/null 2>&1 || true
            wait "${BOOTSTRAP_PORT_FORWARD_PID}" >/dev/null 2>&1 || true
            BOOTSTRAP_PORT_FORWARD_PID=
          }
          cleanup_bootstrap_account_id_file() {
            if [[ -z "${BOOTSTRAP_ACCOUNT_ID_FILE:-}" ]]; then
              return 0
            fi
            if rm -f "${BOOTSTRAP_ACCOUNT_ID_FILE}"; then
              BOOTSTRAP_ACCOUNT_ID_FILE=
              return 0
            fi
            echo "::error::Failed to remove dev-demo bootstrap account id file" >&2
            return 1
          }
          cleanup_bootstrap_temp_dir() {
            if [[ -z "${BOOTSTRAP_SECRET_DIR}" ]]; then
              return 0
            fi
            if rm -rf "${BOOTSTRAP_SECRET_DIR}"; then
              BOOTSTRAP_SECRET_DIR=
              return 0
            fi
            echo "::error::Failed to remove dev-demo bootstrap credential files" >&2
            return 1
          }
          cleanup_bootstrap_secret() {
            local attempt
            for attempt in 1 2 3; do
              if kubectl -n "${PREVIEW_NAMESPACE}" delete secret dev-demo-bootstrap-env --ignore-not-found >/dev/null \
                && ! kubectl -n "${PREVIEW_NAMESPACE}" get secret dev-demo-bootstrap-env >/dev/null 2>&1; then
                return 0
              fi
              sleep "${attempt}"
            done
            echo "::error::Failed to remove dev-demo bootstrap credentials" >&2
            return 1
          }
          cleanup_bootstrap_resources() {
            local status=$?
            set +e
            cleanup_bootstrap_port_forward
            kubectl -n "${PREVIEW_NAMESPACE}" delete pod dev-demo-bootstrap --ignore-not-found >/dev/null 2>&1
            kubectl -n "${PREVIEW_NAMESPACE}" delete configmap dev-demo-bootstrap-script --ignore-not-found >/dev/null 2>&1
            if ! cleanup_bootstrap_account_id_file; then
              status=1
            fi
            if ! cleanup_bootstrap_temp_dir; then
              status=1
            fi
            if ! cleanup_bootstrap_secret; then
              status=1
            fi
            trap - EXIT INT TERM
            exit "${status}"
          }
          trap cleanup_bootstrap_resources EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          for credential in DEMO_SMOKE_EMAIL DEMO_SMOKE_PASSWORD DEMO_SMOKE_USERNAME; do
            if [[ -z "${!credential:-}" ]]; then
              echo "::error::${credential} is empty; refusing to create dev-demo bootstrap credentials" >&2
              exit 1
            fi
          done
          BOOTSTRAP_SECRET_DIR="$(mktemp -d)"
          BOOTSTRAP_GATEWAY_PORT=18080
          kubectl -n "${PREVIEW_NAMESPACE}" port-forward \
            --address 127.0.0.1 \
            service/spring-cloud-gateway \
            "${BOOTSTRAP_GATEWAY_PORT}:80" \
            >"${BOOTSTRAP_PORT_FORWARD_LOG}" 2>&1 &
          BOOTSTRAP_PORT_FORWARD_PID=$!
          if ! BOOTSTRAP_MODE=account \
            BOOTSTRAP_GATEWAY_BASE_URL="http://127.0.0.1:${BOOTSTRAP_GATEWAY_PORT}" \
            BOOTSTRAP_ACCOUNT_ID_FILE="${BOOTSTRAP_ACCOUNT_ID_FILE}" \
            python3 "${BOOTSTRAP_SCRIPT}"; then
            echo "Dev-demo Gateway port-forward account bootstrap failed."
            cat "${BOOTSTRAP_PORT_FORWARD_LOG}" || true
            exit 1
          fi
          cleanup_bootstrap_port_forward
          if [[ ! -s "${BOOTSTRAP_ACCOUNT_ID_FILE}" ]]; then
            echo "::error::Dev-demo bootstrap did not write an account id" >&2
            exit 1
          fi
          kubectl -n "${PREVIEW_NAMESPACE}" create configmap dev-demo-bootstrap-script \
            --from-file=bootstrap.py="${BOOTSTRAP_SCRIPT}" \
            --from-file=account-id="${BOOTSTRAP_ACCOUNT_ID_FILE}" \
            --dry-run=client -o yaml | kubectl apply -f -
          (
            umask 077
            printf '%s' "${DEMO_SMOKE_EMAIL}" >"${BOOTSTRAP_SECRET_DIR}/email"
            printf '%s' "${DEMO_SMOKE_PASSWORD}" >"${BOOTSTRAP_SECRET_DIR}/password"
            printf '%s' "${DEMO_SMOKE_USERNAME}" >"${BOOTSTRAP_SECRET_DIR}/username"
          )
          if ! cleanup_bootstrap_secret; then
            exit 1
          fi
          kubectl -n "${PREVIEW_NAMESPACE}" create secret generic dev-demo-bootstrap-env \
            --from-file=DEMO_SMOKE_EMAIL="${BOOTSTRAP_SECRET_DIR}/email" \
            --from-file=DEMO_SMOKE_PASSWORD="${BOOTSTRAP_SECRET_DIR}/password" \
            --from-file=DEMO_SMOKE_USERNAME="${BOOTSTRAP_SECRET_DIR}/username"
          if ! cleanup_bootstrap_temp_dir; then
            exit 1
          fi
          kubectl -n "${PREVIEW_NAMESPACE}" delete pod dev-demo-bootstrap --ignore-not-found >/dev/null 2>&1 || true
          cat <<'EOF' | kubectl -n "${PREVIEW_NAMESPACE}" apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: dev-demo-bootstrap
          spec:
            restartPolicy: Never
            terminationGracePeriodSeconds: 0
            containers:
              - name: dev-demo-bootstrap
                image: python:3.12-alpine
                command: ["python", "/tmp/bootstrap.py"]
                env:
                  - name: BOOTSTRAP_MODE
                    value: session
                envFrom:
                  - secretRef:
                      name: dev-demo-bootstrap-env
                volumeMounts:
                  - name: bootstrap-script
                    mountPath: /tmp
            volumes:
              - name: bootstrap-script
                configMap:
                  name: dev-demo-bootstrap-script
          EOF
          if ! kubectl -n "${PREVIEW_NAMESPACE}" wait --for=condition=Ready pod/dev-demo-bootstrap --timeout=90s >/dev/null 2>&1; then
            :
          fi
          if ! kubectl -n "${PREVIEW_NAMESPACE}" wait --for=jsonpath='{.status.phase}'=Succeeded pod/dev-demo-bootstrap --timeout=120s >/dev/null 2>&1; then
            echo "Dev-demo bootstrap pod did not succeed."
            kubectl -n "${PREVIEW_NAMESPACE}" logs dev-demo-bootstrap || true
            kubectl -n "${PREVIEW_NAMESPACE}" describe pod dev-demo-bootstrap || true
            exit 1
          fi
          kubectl -n "${PREVIEW_NAMESPACE}" logs dev-demo-bootstrap | tee "${BOOTSTRAP_POD_LOG}"
          kubectl -n "${PREVIEW_NAMESPACE}" delete pod dev-demo-bootstrap --ignore-not-found >/dev/null 2>&1 || true
          kubectl -n "${PREVIEW_NAMESPACE}" delete configmap dev-demo-bootstrap-script --ignore-not-found >/dev/null 2>&1 || true
          cleanup_bootstrap_secret

      - name: Smoke dev-demo over TCP
        if: ${{ !cancelled() && steps.cluster-access.outputs.available == 'true' && steps.deploy-release.outcome == 'success' }}
        env:
          PREVIEW_BASE_URL: https://${{ needs.dev-demo-plan.outputs.hostname }}
          SMOKE_TELNET_HOST: ${{ needs.dev-demo-plan.outputs.hostname }}
          TCP_PORT: ${{ needs.dev-demo-plan.outputs.telnet_port }}
          SMOKE_TARGET_LABEL: dev-demo
        run: |
          echo "DEV_DEMO_STAGE=smoke" >> "$GITHUB_ENV"
          set -o pipefail
          SMOKE_TRANSCRIPT=/tmp/dev-demo-hosted-tcp-smoke.log
          if ! bash ./dev-tools/hosted/shared/hosted-login-look-smoke.sh 2>&1 | tee "${SMOKE_TRANSCRIPT}"; then
            echo "=== Dev-demo TCP smoke transcript ==="
            cat "${SMOKE_TRANSCRIPT}"
            exit 1
          fi

      - name: Summarize dev-demo access
        if: ${{ steps.cluster-access.outputs.available == 'true' && steps.deploy-release.outcome == 'success' }}
        run: |
          bash ./dev-tools/hosted/dev-demo/write-dev-demo-summary.sh \
            success \
            "${{ needs.dev-demo-plan.outputs.head_sha }}" \
            "${{ needs.dev-demo-plan.outputs.image_tag }}" \
            "${{ needs.dev-demo-plan.outputs.hostname }}" \
            "${{ needs.dev-demo-plan.outputs.telnet_port }}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "- Demo login username: ${DEMO_SMOKE_USERNAME}"
            echo "- Demo login email: ${DEMO_SMOKE_EMAIL}"
            echo "- Demo login password: repository smoke default (not printed)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize dev-demo unavailability
        if: ${{ steps.cluster-access.outputs.available != 'true' }}
        run: |
          bash ./dev-tools/hosted/dev-demo/write-dev-demo-summary.sh \
            unavailable \
            "${{ needs.dev-demo-plan.outputs.head_sha }}" \
            "${{ needs.dev-demo-plan.outputs.image_tag }}" \
            "${{ needs.dev-demo-plan.outputs.hostname }}" \
            "${{ needs.dev-demo-plan.outputs.telnet_port }}" \
            "cluster-access" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize dev-demo failure
        if: ${{ always() && failure() && steps.cluster-access.outputs.available == 'true' }}
        run: |
          bash ./dev-tools/hosted/dev-demo/write-dev-demo-summary.sh \
            failure \
            "${{ needs.dev-demo-plan.outputs.head_sha }}" \
            "${{ needs.dev-demo-plan.outputs.image_tag }}" \
            "${{ needs.dev-demo-plan.outputs.hostname }}" \
            "${{ needs.dev-demo-plan.outputs.telnet_port }}" \
            "${DEV_DEMO_STAGE:-unknown}" >> "$GITHUB_STEP_SUMMARY"

  dev-demo-destroy:
    name: Destroy Dev Demo Release
    runs-on:
      - self-hosted
      - preview
    needs: dev-demo-plan
    if: ${{ needs.dev-demo-plan.outputs.action == 'destroy' }}
    environment: dev-demo-cluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.33.4

      - name: Set up Helm
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.20.1"
            INSTALL_DIR="$HOME/.local/bin"
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
            tar -xzf /tmp/helm.tgz -C /tmp
            install /tmp/linux-amd64/helm "$INSTALL_DIR/helm"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          helm version

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
          PREVIEW_KUBECONFIG_LOCAL_SERVER: https://127.0.0.1:6443
        run: |
          KUBECONFIG_PATH="$(bash ./dev-tools/hosted/shared/write-kubeconfig.sh)"
          bash ./dev-tools/hosted/shared/persist-runner-kubeconfig.sh "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Delete dev-demo namespace and release
        run: |
          bash ./dev-tools/hosted/shared/delete-hosted-namespace.sh \
            "${{ needs.dev-demo-plan.outputs.namespace }}" \
            "${{ needs.dev-demo-plan.outputs.release_name }}"

      - name: Summarize dev-demo destroy
        run: |
          bash ./dev-tools/hosted/dev-demo/write-dev-demo-summary.sh \
            destroyed \
            "${{ needs.dev-demo-plan.outputs.head_sha }}" \
            "${{ needs.dev-demo-plan.outputs.image_tag }}" \
            "${{ needs.dev-demo-plan.outputs.hostname }}" \
            "${{ needs.dev-demo-plan.outputs.telnet_port }}" >> "$GITHUB_STEP_SUMMARY"
