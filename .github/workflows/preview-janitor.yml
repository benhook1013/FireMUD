name: Preview Namespace Janitor

on:
  schedule:
    - cron: "17 3 * * *"
  repository_dispatch:
    types: [preview-janitor]

permissions:
  contents: read
  pull-requests: read

jobs:
  prune-stale-preview-namespaces:
    name: Prune Stale Preview Namespaces
    timeout-minutes: 60
    runs-on:
      - self-hosted
      - preview
      - linux
      - x64
    environment: trusted-hosted-cluster
    concurrency:
      group: preview-allocation-lifecycle
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up canonical GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Resolve certificate identity mode
        id: certificate-identity
        uses: ./.github/actions/resolve-certificate-identity-mode
        with:
          values-file: k8s/helm/firemud/values-hosted-shared.example.yaml

      - name: Set up kubectl
        uses: ./.github/actions/setup-kubectl

      - name: Set up Helm
        uses: ./.github/actions/setup-helm

      - name: Write trusted namespace-manager kubeconfig
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.TRUSTED_HOSTED_PREVIEW_NAMESPACE_MANAGER_KUBECONFIG }}
          path: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
          export-to-github-env: 'false'

      - name: Check hosted identity requester credentials
        id: requester-credentials
        if: ${{ steps.certificate-identity.outputs.mode == 'hosted-controller' }}
        env:
          REQUESTER_KUBECONFIG: ${{ secrets.TRUSTED_HOSTED_IDENTITY_REQUESTER_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "$REQUESTER_KUBECONFIG" ]]; then
            echo "Hosted identity requester credentials are unavailable; skipping identity retirement."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write hosted identity requester kubeconfig
        if: ${{ steps.certificate-identity.outputs.mode == 'hosted-controller' && steps.requester-credentials.outputs.available == 'true' }}
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.TRUSTED_HOSTED_IDENTITY_REQUESTER_KUBECONFIG }}
          path: ${{ runner.temp }}/hosted-identity-requester.kubeconfig
          export-to-github-env: 'false'

      - name: Verify preview cluster access
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
        run: |
          kubectl get namespace kube-system >/dev/null
          kubectl auth can-i list namespaces --all-namespaces
          bash ./dev-tools/hosted/shared/check-kubectl-version-skew.sh

      - name: Prune stale preview namespaces
        env:
          KUBECONFIG: ${{ runner.temp }}/preview-namespace-manager.kubeconfig
          GH_TOKEN: ${{ github.token }}
          HOSTED_IDENTITY_MODE: ${{ steps.certificate-identity.outputs.mode }}
          HOSTED_IDENTITY_REQUESTER_KUBECONFIG: ${{ runner.temp }}/hosted-identity-requester.kubeconfig
          HOSTED_IDENTITY_REQUESTER_CREDENTIALS_AVAILABLE: ${{ steps.requester-credentials.outputs.available }}
        run: |
          set -euo pipefail
          case "$HOSTED_IDENTITY_MODE" in
            hosted-controller)
              if [[ "$HOSTED_IDENTITY_REQUESTER_CREDENTIALS_AVAILABLE" == true ]]; then
                bash ./dev-tools/hosted/preview/prune-stale-preview-namespaces.sh \
                  --apply --retire-terminal-identities
              else
                bash ./dev-tools/hosted/preview/prune-stale-preview-namespaces.sh --apply
              fi
              ;;
            standalone)
              bash ./dev-tools/hosted/preview/prune-stale-preview-namespaces.sh --apply
              ;;
            *)
              echo "unsupported certificate identity mode: ${HOSTED_IDENTITY_MODE}" >&2
              exit 1
              ;;
          esac

      - name: Remove hosted identity requester kubeconfig
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/hosted-identity-requester.kubeconfig"

      - name: Remove preview runtime kubeconfig
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/preview-namespace-manager.kubeconfig"
