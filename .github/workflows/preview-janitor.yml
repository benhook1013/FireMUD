name: Preview Namespace Janitor

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  prune-stale-preview-namespaces:
    name: Prune Stale Preview Namespaces
    runs-on:
      - self-hosted
      - preview
    environment: pr-preview
    concurrency:
      group: preview-allocation-lifecycle
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.33.4

      - name: Set up Helm
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.20.1"
            INSTALL_DIR="$HOME/.local/bin"
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
            tar -xzf /tmp/helm.tgz -C /tmp
            install /tmp/linux-amd64/helm "$INSTALL_DIR/helm"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          helm version

      - name: Write preview kubeconfig
        uses: ./.github/actions/write-kubeconfig
        with:
          content: ${{ secrets.PREVIEW_RUNTIME_KUBECONFIG }}
          path: ${{ runner.temp }}/preview-runtime.kubeconfig

      - name: Verify preview cluster access
        run: |
          kubectl get namespace kube-system >/dev/null
          kubectl auth can-i list namespaces --all-namespaces

      - name: Prune stale preview namespaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./dev-tools/hosted/preview/prune-stale-preview-namespaces.sh --apply
