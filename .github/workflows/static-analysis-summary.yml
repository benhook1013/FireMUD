name: Static Analysis Summary

on:
  workflow_run:
    workflows:
      - License Checks
      - CodeQL Analysis
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: static-analysis-summary-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  publish-summary:
    name: Static Analysis Summary
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: 💬 Publish Static Analysis Summary Comment
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequests = context.payload.workflow_run.pull_requests || [];
            if (pullRequests.length === 0) {
              core.info("No pull request is attached to this workflow run.");
              return;
            }

            const pullRequest = pullRequests[0];
            const issueNumber = pullRequest.number;
            const headSha = context.payload.workflow_run.head_sha;
            const detailChecks = [
              ["CodeQL analysis (java)", "CodeQL Analysis (java)"],
              ["CodeQL analysis (javascript-typescript)", "CodeQL Analysis (javascript-typescript)"],
            ];
            const gateChecks = [
              ["CodeQL gate", "CodeQL Gate"],
              ["License gate", "License Gate"],
            ];
            const terminalConclusions = new Set([
              "success",
              "failure",
              "cancelled",
              "timed_out",
              "action_required",
              "neutral",
              "skipped",
            ]);

            const statusIcon = (value) => {
              if (value === "success") return "✅";
              if (value === "failure") return "❌";
              if (value === "cancelled") return "⚪";
              if (value === "pending" || value === "in_progress" || value === "queued") return "⏳";
              return "⏭️";
            };

            const normalizeStatus = (checkRun) => {
              if (!checkRun) return "pending";
              if (checkRun.status !== "completed") return checkRun.status;
              return checkRun.conclusion ?? "pending";
            };

            const statusPriority = (value) => {
              switch (value) {
                case "in_progress":
                  return 7;
                case "queued":
                  return 6;
                case "pending":
                  return 5;
                case "success":
                  return 4;
                case "failure":
                case "timed_out":
                case "action_required":
                  return 3;
                case "neutral":
                case "skipped":
                  return 2;
                case "cancelled":
                  return 1;
                default:
                  return 0;
              }
            };

            const loadChecks = async () => {
              const { data } = await github.rest.checks.listForRef({
                ...context.repo,
                ref: headSha,
                per_page: 100,
              });
              return data.check_runs;
            };

            const resolveStatuses = (checkRuns) =>
              [...gateChecks, ...detailChecks].map(([label, checkName]) => {
                const candidates = checkRuns
                  .filter((checkRun) => checkRun.name === checkName)
                  .map((checkRun) => ({
                    checkRun,
                    status: normalizeStatus(checkRun),
                  }))
                  .sort((a, b) => {
                    const priorityDiff = statusPriority(b.status) - statusPriority(a.status);
                    if (priorityDiff !== 0) {
                      return priorityDiff;
                    }
                    return b.checkRun.id - a.checkRun.id;
                  });
                return [label, candidates[0]?.status ?? "pending"];
              });

            let checks = resolveStatuses(await loadChecks());
            for (let attempt = 0; attempt < 30; attempt += 1) {
              const allCompleted = checks.every(([, result]) => terminalConclusions.has(result));
              if (allCompleted) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
              checks = resolveStatuses(await loadChecks());
            }

            const gateResults = checks.slice(0, gateChecks.length);
            const detailResults = checks.slice(gateChecks.length);

            const failedChecks = gateResults.filter(([, result]) =>
              ["failure", "timed_out", "action_required"].includes(result)
            );
            const pendingChecks = gateResults.filter(([, result]) =>
              ["pending", "in_progress", "queued"].includes(result)
            );

            let headline = "✅ Static analysis checks passed";
            if (failedChecks.length > 0) {
              headline = "❌ Static analysis checks failed";
            } else if (pendingChecks.length > 0) {
              headline = "⏳ Static analysis checks are still running";
            }

            const body = [
              "### Static Analysis Summary",
              headline,
              "",
              ...gateResults.map(([name, result]) => `- ${statusIcon(result)} ${name}: \`${result}\``),
              "",
              "CodeQL breakdown",
              "",
              ...detailResults.map(([name, result]) => `- ${statusIcon(result)} ${name}: \`${result}\``),
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: issueNumber,
            });

            const existing = comments.find((comment) =>
              comment.body.startsWith("### Static Analysis Summary")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body,
              });
            }
