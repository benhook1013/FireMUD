name: Static Analysis Summary

on:
  workflow_run:
    workflows:
      - License Checks
      - CodeQL Analysis
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: static-analysis-summary-${{ github.event.workflow_run.head_branch || github.ref }}
  # Serialize the CodeQL and license completion events so a pending summary
  # cannot race a terminal summary into creating two comments.
  cancel-in-progress: false

jobs:
  publish-summary:
    name: Static Analysis Summary
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: 💬 Publish Static Analysis Summary Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pullRequests = context.payload.workflow_run.pull_requests || [];
            if (pullRequests.length === 0) {
              core.info("No pull request is attached to this workflow run.");
              return;
            }

            const pullRequest = pullRequests[0];
            const issueNumber = pullRequest.number;
            const headSha = context.payload.workflow_run.head_sha;
            const { data: currentPullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: issueNumber,
            });
            if (currentPullRequest.head?.sha !== headSha) {
              core.info("The source run belongs to a superseded pull-request head.");
              return;
            }
            const baseSha = currentPullRequest.base?.sha;
            if (!baseSha) {
              throw new Error("The current pull-request base SHA is unavailable.");
            }
            const sourceWorkflowPath = context.payload.workflow_run.path;
            const sourceWorkflowName = ({
              ".github/workflows/codeql.yml": "CodeQL Analysis",
              ".github/workflows/license-scan.yml": "License Checks",
            })[sourceWorkflowPath];
            const expectedSourceTitle = `${sourceWorkflowName} pr-${issueNumber} base-${baseSha} head-${headSha}`;
            if (
              currentPullRequest.state !== "open" ||
              !sourceWorkflowName ||
              context.payload.workflow_run.name !== expectedSourceTitle ||
              context.payload.workflow_run.display_title !== expectedSourceTitle
            ) {
              core.info("The source run is not bound to the current open pull-request base and head.");
              return;
            }
            const detailChecks = [
              ["CodeQL analysis (java)", "CodeQL Analysis (java)", "codeql"],
              ["CodeQL analysis (javascript-typescript)", "CodeQL Analysis (javascript-typescript)", "codeql"],
            ];
            const gateChecks = [
              ["CodeQL gate", "CodeQL Gate", "codeql"],
              ["License gate", "License Gate", "license"],
            ];
            const terminalConclusions = new Set([
              "success",
              "failure",
              "cancelled",
              "timed_out",
              "action_required",
              "neutral",
              "skipped",
            ]);

            const statusIcon = (value) => {
              if (value === "success") return "✅";
              if (value === "failure") return "❌";
              if (value === "cancelled") return "⚪";
              if (value === "pending" || value === "in_progress" || value === "queued") return "⏳";
              return "⏭️";
            };

            const parseTimestamp = (value) => {
              const parsed = Date.parse(value || "");
              return Number.isNaN(parsed) ? -1 : parsed;
            };

            const numericIdentity = (value) => {
              const parsed = Number(value);
              return Number.isFinite(parsed) ? parsed : -1;
            };

            const compareWorkflowRuns = (left, right) => {
              const createdAtDiff = parseTimestamp(left?.created_at) - parseTimestamp(right?.created_at);
              if (createdAtDiff !== 0) return createdAtDiff;
              const attemptDiff = numericIdentity(left?.run_attempt) - numericIdentity(right?.run_attempt);
              if (attemptDiff !== 0) return attemptDiff;
              return numericIdentity(left?.id) - numericIdentity(right?.id);
            };

            const selectLatestWorkflowRun = (workflowRuns) => {
              const candidates = (Array.isArray(workflowRuns) ? workflowRuns : []).filter(
                (workflowRun) =>
                  workflowRun?.event === "pull_request" &&
                  workflowRun?.head_sha === headSha
              );
              return candidates.reduce(
                (latest, candidate) =>
                  !latest || compareWorkflowRuns(candidate, latest) > 0 ? candidate : latest,
                null
              );
            };

            const workflowRunFor = async (workflowId) => {
              const workflowName = workflowId === "codeql.yml" ? "CodeQL Analysis" : "License Checks";
              const expectedTitle = `${workflowName} pr-${issueNumber} base-${baseSha} head-${headSha}`;
              const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo,
                workflow_id: workflowId,
                event: "pull_request",
                head_sha: headSha,
                per_page: 100,
              });
              return selectLatestWorkflowRun(
                workflowRuns.filter((workflowRun) => workflowRun?.display_title === expectedTitle)
              );
            };

            const checkRunWorkflowId = (checkRun) => {
              const match = String(checkRun?.details_url || "").match(/\/actions\/runs\/(\d+)(?:\/|$)/);
              return match?.[1] || null;
            };

            const compareCheckRuns = (left, right) => {
              const leftTimestamp = Math.max(
                parseTimestamp(left?.completed_at),
                parseTimestamp(left?.started_at),
                parseTimestamp(left?.created_at)
              );
              const rightTimestamp = Math.max(
                parseTimestamp(right?.completed_at),
                parseTimestamp(right?.started_at),
                parseTimestamp(right?.created_at)
              );
              if (leftTimestamp !== rightTimestamp) return leftTimestamp - rightTimestamp;
              return numericIdentity(left?.id) - numericIdentity(right?.id);
            };

            const selectLatestCheckRun = (checkRuns, checkName, workflowRun) => {
              if (!workflowRun?.id) return null;
              const workflowRunId = String(workflowRun.id);
              const candidates = (Array.isArray(checkRuns) ? checkRuns : []).filter(
                (checkRun) =>
                  checkRun?.name === checkName &&
                  checkRunWorkflowId(checkRun) === workflowRunId
              );
              return candidates.reduce(
                (latest, candidate) =>
                  !latest || compareCheckRuns(candidate, latest) > 0 ? candidate : latest,
                null
              );
            };

            const normalizeStatus = (checkRun, checkName, workflowRun) => {
              if (!checkRun) {
                if (
                  checkName.startsWith("CodeQL Analysis (") &&
                  workflowRun?.status === "completed"
                ) {
                  return "skipped";
                }
                if (workflowRun?.status === "completed") {
                  return workflowRun.conclusion ?? "pending";
                }
                if (workflowRun?.status) return workflowRun.status;
                return "pending";
              }
              if (checkRun.status !== "completed") return checkRun.status;
              return checkRun.conclusion ?? "pending";
            };

            const loadChecks = async () => {
              return github.paginate(github.rest.checks.listForRef, {
                ...context.repo,
                ref: headSha,
                per_page: 100,
              });
            };

            const resolveStatuses = (checkRuns, workflowRuns) =>
              [...gateChecks, ...detailChecks].map(([label, checkName, workflowKey]) => {
                const isCodeQlAnalysis = checkName.startsWith("CodeQL Analysis (");
                const emptyMatrixCodeQlCheck =
                  "CodeQL Analysis ($" + "{{ matrix.language }})";
                const workflowRun = workflowRuns?.[workflowKey] || null;
                const selectedCheckRun = selectLatestCheckRun(
                  checkRuns,
                  checkName,
                  workflowRun
                ) || (isCodeQlAnalysis
                  ? selectLatestCheckRun(checkRuns, emptyMatrixCodeQlCheck, workflowRun)
                  : null);
                return [label, normalizeStatus(selectedCheckRun, checkName, workflowRun)];
              });

            let workflowRuns = {
              codeql: await workflowRunFor("codeql.yml"),
              license: await workflowRunFor("license-scan.yml"),
            };
            let checks = resolveStatuses(await loadChecks(), workflowRuns);
            for (let attempt = 0; attempt < 30; attempt += 1) {
              const allCompleted = checks.every(([, result]) => terminalConclusions.has(result));
              if (allCompleted) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
              workflowRuns = {
                codeql: await workflowRunFor("codeql.yml"),
                license: await workflowRunFor("license-scan.yml"),
              };
              checks = resolveStatuses(await loadChecks(), workflowRuns);
            }

            const gateResults = checks.slice(0, gateChecks.length);
            const detailResults = checks.slice(gateChecks.length);

            const failedChecks = gateResults.filter(([, result]) =>
              ["failure", "cancelled", "timed_out", "action_required"].includes(result)
            );
            const pendingChecks = gateResults.filter(([, result]) =>
              ["pending", "in_progress", "queued"].includes(result)
            );

            let headline = "✅ Static analysis checks passed";
            if (failedChecks.length > 0) {
              headline = "❌ Static analysis checks failed";
            } else if (pendingChecks.length > 0) {
              headline = "⏳ Static analysis checks are still running";
            }

            const body = [
              "### Static Analysis Summary",
              headline,
              "",
              ...gateResults.map(([name, result]) => `- ${statusIcon(result)} ${name}: \`${result}\``),
              "",
              "CodeQL breakdown",
              "",
              ...detailResults.map(([name, result]) => `- ${statusIcon(result)} ${name}: \`${result}\``),
            ].join("\n");

            const { data: finalPullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: issueNumber,
            });
            if (
              finalPullRequest.state !== "open" ||
              finalPullRequest.head?.sha !== headSha ||
              finalPullRequest.base?.sha !== baseSha
            ) {
              core.info("The pull-request base or head changed while static analysis was being summarized.");
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const summaryComments = comments.filter((comment) =>
              comment.user?.login === "github-actions[bot]" &&
              comment.body?.startsWith("### Static Analysis Summary")
            );
            const commentTimestamp = (comment) => {
              const parsed = Date.parse(comment.created_at || "");
              return Number.isNaN(parsed) ? Number.MAX_SAFE_INTEGER : parsed;
            };
            const existing = summaryComments.reduce((oldest, comment) => {
              if (!oldest) return comment;
              const oldestTimestamp = commentTimestamp(oldest);
              const candidateTimestamp = commentTimestamp(comment);
              if (candidateTimestamp !== oldestTimestamp) {
                return candidateTimestamp < oldestTimestamp ? comment : oldest;
              }
              return Number(comment.id) < Number(oldest.id) ? comment : oldest;
            }, null);

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body,
              });
            }

            for (const comment of summaryComments) {
              if (comment.id === existing?.id) continue;
              try {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                });
              } catch (error) {
                if (error?.status !== 404) throw error;
              }
            }
