name: Preview Reconciler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: preview-reconciler-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  reconcile-previews:
    name: Reconcile Open PR Previews
    timeout-minutes: 60
    runs-on:
      - self-hosted
      - preview
    environment: pr-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.33.4

      - name: Write preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
          PREVIEW_KUBECONFIG_LOCAL_SERVER: https://127.0.0.1:6443
        run: |
          KUBECONFIG_PATH="$(bash ./dev-tools/hosted/shared/write-kubeconfig.sh)"
          bash ./dev-tools/hosted/shared/persist-runner-kubeconfig.sh "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Verify preview cluster access
        run: |
          kubectl get namespace kube-system >/dev/null
          kubectl auth can-i list namespaces --all-namespaces

      - name: Ensure GitHub CLI is available
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          GH_VERSION="2.76.2"
          INSTALL_DIR="$HOME/.local/bin"
          mkdir -p "$INSTALL_DIR"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o /tmp/gh.tgz
          tar -xzf /tmp/gh.tgz -C /tmp
          install "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" "$INSTALL_DIR/gh"
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          gh --version

      - name: Dispatch preview deploys for drifted PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_MAX_ACTIVE: ${{ vars.PREVIEW_MAX_ACTIVE }}
        run: |
          set -euo pipefail
          preview_workflow_name="PR Preview Environment"
          eligibility_script="./dev-tools/hosted/preview/preview-eligibility.py"
          max_active="${PREVIEW_MAX_ACTIVE:-1}"

          parse_namespace_heads() {
            jq -er '
              def annotation($annotations; $name):
                ($annotations[$name] // "")
                | if type != "string" then
                    error("namespace head annotation is not a string")
                  elif test("[|\\r\\n]") then
                    error("namespace head annotation contains an unsafe delimiter")
                  else
                    .
                  end;
              if type != "object" or (.metadata | type) != "object" then
                error("namespace snapshot is not an object with metadata")
              elif ((.metadata.annotations // {}) | type) != "object" then
                error("namespace annotations are not an object")
              else
                (.metadata.annotations // {}) as $annotations
                | [
                    annotation($annotations; "firemud.dev/last-preview-head-sha"),
                    annotation($annotations; "firemud.dev/requested-preview-head-sha")
                  ]
                | join("|")
              end
            ' <<<"$1"
          }

          active_count="$(kubectl get namespaces -l firemud.dev/preview=true -o name | sed '/^$/d' | wc -l)"
          available_slots=$((max_active - active_count))
          dispatch_sent=false
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[] | [(if (.labels | map(.name) | any(. == "preview:priority")) then 0 else 1 end), .number, .head.ref, .head.sha, .user.login, .base.ref, .state, (.labels | map(.name) | any(. == "preview:priority")), (.labels | map({name: .name}) | tojson | @base64)] | @tsv' \
            | sort -t $'\t' -k1,1n -k2,2n |
          while IFS=$'\t' read -r _ pr_number head_ref head_sha pr_author pr_base_ref pr_state is_priority labels_json_base64; do
            if ! labels_json="$(printf '%s' "$labels_json_base64" | base64 --decode 2>/dev/null)" ||
              [[ -z "$labels_json" ]] ||
              ! jq -e 'type == "array"' <<<"$labels_json" >/dev/null; then
              echo "Skipping PR #${pr_number}: label metadata could not be decoded as a JSON array." >&2
              continue
            fi
            eligibility_output="$(
              python3 "$eligibility_script" \
                --operation deploy \
                --state "$pr_state" \
                --base-ref "$pr_base_ref" \
                --author "$pr_author" \
                --labels-json "$labels_json"
            )"
            eligible="$(sed -n 's/^eligible=//p' <<<"$eligibility_output")"
            reason="$(sed -n 's/^reason=//p' <<<"$eligibility_output")"
            if [[ "$eligible" != "true" ]]; then
              echo "Skipping preview reconcile for PR #${pr_number}: not preview-eligible (reason=${reason}, author=${pr_author}, base=${pr_base_ref})"
              continue
            fi

            namespace="pr-${pr_number}"
            desired_image_tag="${head_sha}"
            namespace_exists=false
            current_head_sha=""
            requested_head_sha=""
            if ! namespace_json="$(
              kubectl get namespace "${namespace}" --ignore-not-found -o json
            )"; then
              echo "Unable to inspect namespace ${namespace}; refusing preview reconcile." >&2
              exit 1
            fi
            if [[ -n "${namespace_json}" ]]; then
              namespace_exists=true
              if ! namespace_heads="$(parse_namespace_heads "${namespace_json}")"; then
                echo "Skipping PR #${pr_number}: unable to parse namespace ${namespace} snapshot." >&2
                continue
              fi
              IFS='|' read -r current_head_sha requested_head_sha <<<"${namespace_heads}"
            fi

            if [[ "${current_head_sha}" == "${head_sha}" ]]; then
              if [[ "${requested_head_sha}" != "${head_sha}" ]]; then
                if ! fresh_namespace_json="$(
                  kubectl get namespace "${namespace}" --ignore-not-found -o json
                )"; then
                  echo "Unable to recheck namespace ${namespace} before annotation repair." >&2
                  exit 1
                fi
                if [[ -z "${fresh_namespace_json}" ]]; then
                  namespace_exists=false
                elif ! fresh_namespace_heads="$(parse_namespace_heads "${fresh_namespace_json}")"; then
                  echo "Skipping PR #${pr_number}: unable to parse namespace ${namespace} recheck." >&2
                  continue
                else
                  IFS='|' read -r fresh_head_sha fresh_requested_head_sha <<<"${fresh_namespace_heads}"
                  if [[ "${fresh_head_sha}" != "${head_sha}" ]]; then
                    echo "Skipping preview repair for PR #${pr_number}: deployed head changed during annotation repair check."
                    continue
                  elif [[ "${fresh_requested_head_sha}" == "${head_sha}" ]]; then
                    echo "Preview ${namespace} already aligned to ${head_sha}"
                    continue
                  elif [[ "${fresh_requested_head_sha}" != "${requested_head_sha}" ]]; then
                    echo "Skipping preview repair for PR #${pr_number}: requested head changed during annotation repair check."
                    continue
                  else
                    if ! kubectl annotate namespace "${namespace}" \
                      "firemud.dev/requested-preview-head-sha=${head_sha}" \
                      --overwrite >/dev/null; then
                      if ! annotation_failure_namespace_json="$(
                        kubectl get namespace "${namespace}" --ignore-not-found -o json
                      )"; then
                        echo "Unable to recheck namespace ${namespace} after annotation failure; refusing preview reconcile." >&2
                        exit 1
                      fi
                      if [[ -n "${annotation_failure_namespace_json}" ]]; then
                        echo "Unable to annotate namespace ${namespace}; namespace still exists, refusing preview reconcile." >&2
                        exit 1
                      fi
                      echo "Namespace ${namespace} was deleted during requested-head repair; continuing."
                      continue
                    fi
                    if [[ -z "${requested_head_sha}" ]]; then
                      echo "Repaired missing requested head for aligned preview ${namespace}"
                    else
                      echo "Repaired stale requested head for aligned preview ${namespace}"
                    fi
                    continue
                  fi
                fi
              else
                echo "Preview ${namespace} already aligned to ${head_sha}"
                continue
              fi
            fi

            if [[ "$dispatch_sent" == "true" ]]; then
              echo "Skipping PR #${pr_number}: another preview repair was already dispatched this cycle."
              continue
            fi

            if [[ "$namespace_exists" != "true" ]]; then
              if [[ "$is_priority" != "true" && "$available_slots" -le 0 ]]; then
                echo "Skipping ordinary PR #${pr_number}: preview capacity is full."
                continue
              fi
            fi

            active_preview_run_id="$(
              gh run list \
                --workflow "${preview_workflow_name}" \
                --branch "${head_ref}" \
                --limit 20 \
                --json databaseId,status \
                --jq 'first(.[] | select(.status == "queued" or .status == "in_progress") | .databaseId) // empty'
            )"

            if [[ -n "${active_preview_run_id}" ]]; then
              echo "Skipping dispatch for PR #${pr_number}: preview run ${active_preview_run_id} is already queued or in progress."
              continue
            fi

            echo "Dispatching preview deploy for PR #${pr_number} (${head_sha}) on ref ${head_ref}"
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/preview.yml/dispatches" \
              -f ref="${head_ref}" \
              -f 'inputs[action]=deploy' \
              -f "inputs[pr_number]=${pr_number}" \
              -f "inputs[image_tag]=${desired_image_tag}" \
              -f "inputs[head_sha]=${head_sha}" \
              -f 'inputs[preview_domain]=preview.firedevops.net'
            dispatch_sent=true
          done
