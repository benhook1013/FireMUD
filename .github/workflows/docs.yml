name: Publish Documentation

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'
      - name: Cache link check results
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .lychee_cache
          key: lychee-${{ runner.os }}-${{ hashFiles('**/*.md') }}
      - name: Check links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        env:
          LYCHEE_CACHE: true
        with:
          # Keep docs publishing resilient to third-party outages. Full external
          # link validation remains in CI via `./gradlew lintMarkdown linkCheck -PfullCheck`.
          args: --no-progress --verbose --scheme file --exclude-path './**/node_modules/**' --exclude-path './**/build/**' --exclude-path './**/.gradle/**' './**/*.md'
          fail: true
          jobSummary: true
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install MkDocs
        run: python3 -m pip install --disable-pip-version-check mkdocs mkdocs-material
      - name: Build documentation
        run: |
          python3 dev-tools/docs/build_pages_site.py
          python3 -m mkdocs build --clean
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./build/public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
