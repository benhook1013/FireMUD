name: Publish Documentation

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          requirements: docs
      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions
      - name: Cache link check results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ steps.workflow-tool-versions.outputs.lychee-version }}-${{ steps.workflow-tool-versions.outputs.lychee-linux-x86-64-musl-sha256 }}-${{ hashFiles('**/*.md') }}
      - name: Check links
        # Keep docs publishing resilient to third-party outages. Full external
        # link validation remains in CI via `./gradlew lintMarkdown linkCheck -PfullCheck`.
        run: bash ./dev-tools/docs/link-check.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build documentation
        run: |
          python3 dev-tools/docs/build_pages_site.py
          python3 -m mkdocs build --clean
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./build/public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
