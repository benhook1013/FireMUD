name: Publish Documentation

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache link check results
        uses: actions/cache@v5
        with:
          path: .lychee_cache
          key: lychee-${{ runner.os }}-${{ hashFiles('**/*.md') }}
      - name: Check links
        uses: lycheeverse/lychee-action@v2.8.0
        env:
          LYCHEE_CACHE: true
        with:
          # Keep docs publishing resilient to third-party outages. Full external
          # link validation remains in CI via `./gradlew lintMarkdown linkCheck -PfullCheck`.
          args: --no-progress --verbose --scheme file --exclude-path './**/node_modules/**' --exclude-path './**/build/**' --exclude-path './**/.gradle/**' './**/*.md'
          fail: true
          jobSummary: true
      - uses: actions/configure-pages@v5
      - name: Build documentation
        run: |
          mkdir -p public/design
          cp -r design/* public/design/
          cp README.md public/index.md
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
