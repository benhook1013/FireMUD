      pull-requests: write
    needs: [buf-check, docker-lint, shellcheck, python-script-validation, dev-tool-contract-checks, dev-tools-readme-contract, yaml-lint, metrics-cardinality-check, flyway-migration-sanity-checks, grpc-transport-config-sanity-checks, workflow-lint, helm-lint, helm-render-validation, helm-transaction-proof, docs-check, frontend-checks, build-and-test, validation-gate]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: 💬 Publish Validation Summary Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const statusIcon = (result) => {
              if (result === "success") return "✅";
              if (result === "failure") return "❌";
              if (result === "cancelled") return "⚪";
              if (["pending", "in_progress", "queued"].includes(result)) return "⏳";
              return "⏭️";
            };

            const validationChecks = [
              ["Validation gate", "${{ needs.validation-gate.result }}"],
              ["Buf generation", "${{ needs.buf-check.result }}"],
              ["Dockerfile lint", "${{ needs.docker-lint.result }}"],
              ["ShellCheck", "${{ needs.shellcheck.result }}"],
              ["Python script validation", "${{ needs.python-script-validation.result }}"],
              ["Dev tool contract checks", "${{ needs.dev-tool-contract-checks.result }}"],
              ["Dev Tools README contract", "${{ needs.dev-tools-readme-contract.result }}"],
              ["YAML lint", "${{ needs.yaml-lint.result }}"],
              ["Metrics cardinality policy check", "${{ needs.metrics-cardinality-check.result }}"],
              ["Flyway migration sanity checks", "${{ needs.flyway-migration-sanity-checks.result }}"],
              ["gRPC transport configuration sanity checks", "${{ needs.grpc-transport-config-sanity-checks.result }}"],
              ["GitHub workflow lint", "${{ needs.workflow-lint.result }}"],
              ["Helm chart lint", "${{ needs.helm-lint.result }}"],
              ["Helm render validation", "${{ needs.helm-render-validation.result }}"],
              ["Helm transaction proof", "${{ needs.helm-transaction-proof.result }}"],
              ["Validate Documentation", "${{ needs.docs-check.result }}"],
              ["Frontend checks", "${{ needs.frontend-checks.result }}"],
              ["Service build/test matrix", "${{ needs.build-and-test.result }}"],
            ];

            const failedChecks = validationChecks.filter(([, result]) =>
              ["failure", "cancelled", "timed_out", "action_required"].includes(result)
            );
            const pendingChecks = validationChecks.filter(([, result]) =>
              ["pending", "in_progress", "queued"].includes(result)
            );

            const headline = failedChecks.length > 0
              ? "❌ One or more validation checks failed"
              : pendingChecks.length > 0
              ? "⏳ Validation checks are still running"
              : "✅ All validation checks passed";

            const body = [
              "### Validation Summary",
              "<!-- firemud-validation-summary -->",
              headline,
              "",
              ...validationChecks.map(([name, result]) => `- ${statusIcon(result)} ${name}: \`${result}\``),
              "",
              "Coverage reports and failure logs are available in the workflow artifacts."
            ].join("\n");

            await core.summary
              .addRaw(headline, true)
              .addList(validationChecks.map(([name, result]) => `${statusIcon(result)} ${name}: ${result}`))
              .write();

            const expectedHeadSha = context.payload.pull_request.head.sha;
            const expectedBaseRef = context.payload.pull_request.base.ref;
            const expectedBaseSha = context.payload.pull_request.base.sha;
            const { data: currentPullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            if (
              currentPullRequest.state !== "open" ||
              currentPullRequest.head.sha !== expectedHeadSha ||
              currentPullRequest.base.ref !== expectedBaseRef ||
              currentPullRequest.base.sha !== expectedBaseSha
            ) {
              core.info(
                `Skipping stale validation summary for ${expectedBaseRef}@${expectedBaseSha}...${expectedHeadSha}; ` +
                `current PR state/base/head is ${currentPullRequest.state}/${currentPullRequest.base.ref}@${currentPullRequest.base.sha}/${currentPullRequest.head.sha}`
              );
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const summaryComments = comments.filter(comment =>
              comment.user?.login === "github-actions[bot]" &&
              (comment.body?.startsWith("### Validation Summary") ||
                comment.body?.includes("<!-- firemud-validation-summary -->"))
            );
            const commentTimestamp = (comment) => {
              const parsed = Date.parse(comment.created_at || "");
              return Number.isNaN(parsed) ? Number.MAX_SAFE_INTEGER : parsed;
            };
            const existing = summaryComments.reduce((oldest, comment) => {
              if (!oldest) return comment;
              const oldestTimestamp = commentTimestamp(oldest);
              const candidateTimestamp = commentTimestamp(comment);
              if (candidateTimestamp !== oldestTimestamp) {
                return candidateTimestamp < oldestTimestamp ? comment : oldest;
              }
              return Number(comment.id) < Number(oldest.id) ? comment : oldest;
            }, null);

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

            for (const comment of summaryComments) {
              if (comment.id === existing?.id) continue;
              try {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                });
              } catch (error) {
                if (error?.status !== 404) throw error;
              }
            }

  validation-gate:
    name: Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      checks: read # Preserve a prior successful required context on metadata-only edits.
      contents: read # Check out the shared required-gate composite action.
      actions: read # Inspect the matching required-gate job's preservation step.
    needs: [changes, buf-check, docker-lint, shellcheck, python-script-validation, dev-tool-contract-checks, dev-tools-readme-contract, yaml-lint, metrics-cardinality-check, flyway-migration-sanity-checks, grpc-transport-config-sanity-checks, workflow-lint, helm-lint, helm-render-validation, helm-transaction-proof, docs-check, frontend-checks, build-and-test]
    if: ${{ always() }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Check out required-gate action
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Preserve successful required gate on metadata-only edit
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: ./.github/actions/preserve-required-gate
        with:
          gate-name: Validation Gate
          workflow-name: CI — Validation
          workflow-file: ci.yml
          workflow-path: .github/workflows/ci.yml

      - name: Enforce validation success
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
        env:
          DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend_changed }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python_changed }}
          DESIGN_DOCS_CHANGED: ${{ needs.changes.outputs.design_docs_changed }}
          VALIDATION_PYTHON_CHANGED: ${{ needs.changes.outputs.validation_python_changed }}
          LIGHTWEIGHT_ONLY: ${{ needs.changes.outputs.lightweight_only }}
          AFFECTED_MODULES: ${{ needs.changes.outputs.affected_modules }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUF_CHECK: ${{ needs.buf-check.result }}
          DOCKER_LINT: ${{ needs.docker-lint.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          PYTHON_SCRIPT_VALIDATION: ${{ needs.python-script-validation.result }}
          DEV_TOOL_CONTRACT_CHECKS: ${{ needs.dev-tool-contract-checks.result }}
          DEV_TOOLS_README_CONTRACT: ${{ needs.dev-tools-readme-contract.result }}
          YAML_LINT: ${{ needs.yaml-lint.result }}
          METRICS_CARDINALITY_CHECK: ${{ needs.metrics-cardinality-check.result }}
          FLYWAY_MIGRATION_SANITY_CHECKS: ${{ needs.flyway-migration-sanity-checks.result }}
          GRPC_TRANSPORT_CONFIG_SANITY_CHECKS: ${{ needs.grpc-transport-config-sanity-checks.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          HELM_LINT: ${{ needs.helm-lint.result }}
          HELM_RENDER_VALIDATION: ${{ needs.helm-render-validation.result }}
          HELM_TRANSACTION_PROOF: ${{ needs.helm-transaction-proof.result }}
          DOCS_CHECK: ${{ needs.docs-check.result }}
          FRONTEND_CHECKS: ${{ needs.frontend-checks.result }}
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
        run: |
          is_acceptable_optional_result() {
            local result="$1"
            [ "$result" = "success" ] || [ "$result" = "skipped" ]
          }

          failed=0

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection did not succeed: $CHANGES_RESULT" >&2
            failed=1
          fi

          for check in \
            "Buf Generation:$BUF_CHECK" \
            "Dockerfile Lint:$DOCKER_LINT" \
            "ShellCheck:$SHELLCHECK" \
            "YAML Lint:$YAML_LINT" \
            "Metrics Cardinality Policy Check:$METRICS_CARDINALITY_CHECK" \
            "Flyway Migration Sanity Checks:$FLYWAY_MIGRATION_SANITY_CHECKS" \
            "gRPC Transport Configuration Sanity Checks:$GRPC_TRANSPORT_CONFIG_SANITY_CHECKS" \
            "GitHub Workflow Lint:$WORKFLOW_LINT" \
            "Helm Chart Lint:$HELM_LINT" \
            "Helm Render Validation:$HELM_RENDER_VALIDATION" \
            "Helm Transaction Proof:$HELM_TRANSACTION_PROOF"
          do
            name="${check%%:*}"
            result="${check#*:}"
            echo "$name => $result"
            if [ "$LIGHTWEIGHT_ONLY" = "true" ]; then
              if ! is_acceptable_optional_result "$result"; then
                failed=1
              fi
            else
              if [ "$result" != "success" ]; then
                failed=1
              fi
            fi
          done

          echo "Python Script Validation => $PYTHON_SCRIPT_VALIDATION"
          if [ "$LIGHTWEIGHT_ONLY" != "true" ] || [ "$PYTHON_CHANGED" = "true" ]; then
            if [ "$PYTHON_SCRIPT_VALIDATION" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$PYTHON_SCRIPT_VALIDATION"; then
              failed=1
            fi
          fi

          echo "Dev Tool Contract Checks => $DEV_TOOL_CONTRACT_CHECKS"
          if [ "$LIGHTWEIGHT_ONLY" != "true" ] || [ "$DESIGN_DOCS_CHANGED" = "true" ] || [ "$VALIDATION_PYTHON_CHANGED" = "true" ]; then
            if [ "$DEV_TOOL_CONTRACT_CHECKS" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$DEV_TOOL_CONTRACT_CHECKS"; then
              failed=1
            fi
          fi

          echo "Dev Tools README Contract => $DEV_TOOLS_README_CONTRACT"
          if [ "$LIGHTWEIGHT_ONLY" = "true" ] || [ "$DEV_TOOLS_README_CONTRACT" != "skipped" ]; then
            if [ "$DEV_TOOLS_README_CONTRACT" != "success" ]; then
              failed=1
            fi
          fi

          echo "Validate Documentation => $DOCS_CHECK"
          if [ "$DOCS_CHANGED" = "true" ]; then
            if [ "$DOCS_CHECK" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$DOCS_CHECK"; then
              failed=1
            fi
          fi

          echo "Frontend Checks => $FRONTEND_CHECKS"
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            if [ "$FRONTEND_CHECKS" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$FRONTEND_CHECKS"; then
              failed=1
            fi
          fi

          echo "Build and Test Matrix => $BUILD_AND_TEST"
          if [ "$AFFECTED_MODULES" != "[]" ]; then
            if [ "$BUILD_AND_TEST" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$BUILD_AND_TEST"; then
              failed=1
            fi
          fi

          if [ "$failed" -ne 0 ]; then
            echo "Validation Gate failed because one or more required validation jobs did not succeed." >&2
            exit 1
          fi
