            } else {
              if (!["push", "workflow_dispatch"].includes(eventName) || nativeHeadSha !== testedSourceSha ||
                  typeof refName !== "string" || !refName) {
                throw new Error("Non-pull-request runs must test their native workflow head and ref.");
              }
              expectedRunTitle = `CI — Validation ${refName}`;
            }
            const run = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId })).data;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (run.id !== runId || run.head_sha !== nativeHeadSha ||
                run.run_attempt !== runAttempt || run.path !== ".github/workflows/ci.yml" ||
                run.name !== expectedRunTitle || run.event !== eventName ||
                run.repository?.full_name !== repository ||
                run.display_title !== expectedRunTitle) {
              throw new Error("Current workflow run identity does not match the event source.");
            }
            let apiPullRequests = [];
            if (isPullRequest) {
              if (!Array.isArray(run.pull_requests) || run.pull_requests.length > 1) {
                throw new Error("Current workflow pull-request association is unavailable or ambiguous.");
              }
              apiPullRequests = run.pull_requests.map(association => ({
                number: association.number,
                base_sha: association.base?.sha,
                head_sha: association.head?.sha,
              }));
              if (apiPullRequests.length === 1 &&
                  (apiPullRequests[0].number !== pullRequest.number ||
                   apiPullRequests[0].base_sha !== pullRequest.base_sha ||
                   apiPullRequests[0].head_sha !== pullRequest.head_sha)) {
                throw new Error("Current workflow pull-request association does not match the event.");
              }
            }
            async function listCompletePages(request, params, rowsKey, description) {
              const items = [];
              let totalCount;
              for (let page = 1; page <= 100; page += 1) {
                const { data } = await request({ ...context.repo, ...params, page, per_page: 100 });
                const count = data?.total_count;
                const rows = data?.[rowsKey];
                if (!Number.isSafeInteger(count) || count < 0 || !Array.isArray(rows) ||
                    (totalCount !== undefined && totalCount !== count) || items.length > count) {
                  throw new Error(`Invalid ${description} pagination metadata.`);
                }
                totalCount = count;
                const expected = Math.min(100, count - items.length);
                if (rows.length !== expected) throw new Error(`Incomplete ${description} page ${page}.`);
                items.push(...rows);
                if (items.length === totalCount) return { total_count: totalCount, items };
              }
              throw new Error(`Exceeded the ${description} pagination bound.`);
            }
            const attempts = [];
            for (let attempt = 1; attempt <= runAttempt; attempt += 1) {
              const params = { run_id: runId, attempt_number: attempt };
              const snapshot = await listCompletePages(
                request => github.rest.actions.listJobsForWorkflowRunAttempt(request),
                params,
                "jobs",
                `attempt ${attempt} job`,
              );
              attempts.push({
                attempt,
                total_count: snapshot.total_count,
                jobs: snapshot.items.map(job => ({
                  id: job.id, run_id: job.run_id, head_sha: job.head_sha, name: job.name,
                  status: job.status, conclusion: job.conclusion,
                  started_at: job.started_at, completed_at: job.completed_at,
                })),
              });
            }
            const artifactSnapshot = await listCompletePages(
              request => github.rest.actions.listWorkflowRunArtifacts(request),
              { run_id: runId },
              "artifacts",
              "workflow artifact",
            );
            const artifacts = artifactSnapshot.items;
            fs.mkdirSync(require("node:path").dirname(process.env.CI_PROVENANCE_PATH), { recursive: true });
            fs.writeFileSync(process.env.CI_PROVENANCE_PATH, JSON.stringify({
              run: {
                id: run.id, head_sha: run.head_sha, tested_source_sha: testedSourceSha,
                event: run.event, event_name: eventName,
                pull_request: pullRequest, api_pull_requests: apiPullRequests,
                display_title: run.display_title, api_name: run.name,
                repository: run.repository?.full_name,
                run_attempt: run.run_attempt, path: run.path, name: "CI — Validation",
              },
              attempts,
              artifacts: {
                total_count: artifactSnapshot.total_count,
                items: artifacts.map(artifact => ({
                  id: artifact.id, name: artifact.name, expired: artifact.expired,
                  size_in_bytes: artifact.size_in_bytes, created_at: artifact.created_at,
                  workflow_run: artifact.workflow_run,
                })),
              },
            }));

      - name: Select Game Session artifacts from latest effective job outcomes
        id: selection
        env:
          PROVENANCE_PATH: services/game-session-service/build/slow-service-ci-partition-provenance.json
          SELECTION_PATH: services/game-session-service/build/slow-service-ci-partition-selection.json
        run: |
          python3 dev-tools/validation/slow_service_ci_test_partition.py select-artifacts \
            --module game-session-service \
            --run-id "$GITHUB_RUN_ID" \
            --source-revision "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --provenance-json "$PROVENANCE_PATH" \
            --selection-json "$SELECTION_PATH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download both effective Game Session partition artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.selection.outputs.artifact_ids }}
          path: services/game-session-service/build/slow-service-ci-partition-inputs
          merge-multiple: false

      - name: Verify complete Game Session partition and report union
        run: |
          python3 dev-tools/validation/slow_service_ci_test_partition.py verify-aggregate \
            --module game-session-service \
            --input-dir services/game-session-service/build/slow-service-ci-partition-inputs \
            --selection-json services/game-session-service/build/slow-service-ci-partition-selection.json \
            --run-id "$GITHUB_RUN_ID" \
            --source-revision "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: ⚙️ Set Up Java for Game Session Coverage Aggregation
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: ⚙️ Set Up Gradle for Game Session Coverage Aggregation
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Merge complete Game Session JaCoCo coverage
        run: ./gradlew --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2500m -Dfile.encoding=UTF-8' :game-session-service:jacocoTestReport -PfullCheck -PslowServiceCiCoverageAggregate=game-session-service

      - name: 📤 Upload Complete Game Session Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-game-session-service-complete-report-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: services/game-session-service/build/reports/jacoco/test/
          if-no-files-found: error
          retention-days: 14

  # Final gating and PR reporting
  validation-gate:
    name: Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      checks: read # Preserve a prior successful required context on metadata-only edits.
      contents: read # Check out the shared required-gate composite action.
      actions: read # Inspect the matching required-gate job's preservation step.
      statuses: write # Publish acknowledged supplementary metadata gate barriers.
      pull-requests: read # Re-read the current PR tuple before status publication.
    env:
      ACCOUNT_MODULE_AFFECTED: ${{ contains(fromJSON(needs.changes.outputs.affected_modules || '[]'), 'account-service') }}
      ACCOUNT_COVERAGE_AGGREGATE: ${{ needs.account-coverage-aggregate.result }}
      GAME_SESSION_MODULE_AFFECTED: ${{ contains(fromJSON(needs.changes.outputs.affected_modules || '[]'), 'game-session-service') }}
      GAME_SESSION_COVERAGE_AGGREGATE: ${{ needs.game-session-coverage-aggregate.result }}
    needs: [changes, postgres-runtime-upgrade-proof, buf-check, docker-lint, shellcheck, python-script-validation, dev-tool-contract-checks, dev-tools-readme-contract, yaml-lint, metrics-cardinality-check, flyway-migration-sanity-checks, grpc-transport-config-sanity-checks, workflow-lint, helm-lint, helm-render-validation, helm-transaction-proof, docs-check, frontend-checks, build-and-test, account-coverage-aggregate, game-session-coverage-aggregate]
    if: ${{ always() }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out required-gate action
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Preserve successful required gate on metadata-only edit
        id: preserved_gate
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: ./.github/actions/preserve-required-gate
        with:
          gate-name: Validation Gate
          workflow-name: CI — Validation
          workflow-file: ci.yml
          workflow-path: .github/workflows/ci.yml

      - name: Publish pending required gate status
        id: publish-pending-status
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: ./.github/actions/publish-required-gate-status
        with:
          assessment: ${{ steps.preserved_gate.outputs.assessment }}
          gate-name: Validation Gate
          workflow-name: CI — Validation
          workflow-file: ci.yml
          workflow-path: .github/workflows/ci.yml

      - name: Report dependency-deferred required gate
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        env:
          PUBLISHER_OUTCOME: ${{ steps.publish-pending-status.outcome }}
          ASSESSMENT: ${{ steps.preserved_gate.outputs.assessment }}
          PUBLICATION: ${{ steps.publish-pending-status.outputs.publication }}
        run: |
          case "$PUBLISHER_OUTCOME/$ASSESSMENT/$PUBLICATION" in
            success/dependency-deferred/pending-acknowledged|success/success/unchanged|success/success/success-acknowledged|success/success/pending-acknowledged)
              ;;
            *)
              echo "Required-gate assessment or status acknowledgment is unavailable; dependency-deferred failure." >&2
              exit 1
              ;;
          esac

      - name: Enforce validation success
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
        env:
          DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend_changed }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python_changed }}
          DESIGN_DOCS_CHANGED: ${{ needs.changes.outputs.design_docs_changed }}
          VALIDATION_PYTHON_CHANGED: ${{ needs.changes.outputs.validation_python_changed }}
          POSTGRES_RUNTIME_PROOF_CHANGED: ${{ needs.changes.outputs.postgres_runtime_proof_changed }}
          POSTGRES_RUNTIME_UPGRADE_PROOF: ${{ needs.postgres-runtime-upgrade-proof.result }}
          LIGHTWEIGHT_ONLY: ${{ needs.changes.outputs.lightweight_only }}
          AFFECTED_MODULES: ${{ needs.changes.outputs.affected_modules }}
          ACCOUNT_MODULE_AFFECTED: ${{ env.ACCOUNT_MODULE_AFFECTED }}
          ACCOUNT_COVERAGE_AGGREGATE: ${{ needs.account-coverage-aggregate.result }}
          GAME_SESSION_MODULE_AFFECTED: ${{ env.GAME_SESSION_MODULE_AFFECTED }}
          GAME_SESSION_COVERAGE_AGGREGATE: ${{ needs.game-session-coverage-aggregate.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUF_CHECK: ${{ needs.buf-check.result }}
          DOCKER_LINT: ${{ needs.docker-lint.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          PYTHON_SCRIPT_VALIDATION: ${{ needs.python-script-validation.result }}
          DEV_TOOL_CONTRACT_CHECKS: ${{ needs.dev-tool-contract-checks.result }}
          DEV_TOOLS_README_CONTRACT: ${{ needs.dev-tools-readme-contract.result }}
          YAML_LINT: ${{ needs.yaml-lint.result }}
          METRICS_CARDINALITY_CHECK: ${{ needs.metrics-cardinality-check.result }}
          FLYWAY_MIGRATION_SANITY_CHECKS: ${{ needs.flyway-migration-sanity-checks.result }}
          GRPC_TRANSPORT_CONFIG_SANITY_CHECKS: ${{ needs.grpc-transport-config-sanity-checks.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          HELM_LINT: ${{ needs.helm-lint.result }}
          HELM_RENDER_VALIDATION: ${{ needs.helm-render-validation.result }}
          HELM_TRANSACTION_PROOF: ${{ needs.helm-transaction-proof.result }}
          DOCS_CHECK: ${{ needs.docs-check.result }}
          FRONTEND_CHECKS: ${{ needs.frontend-checks.result }}
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
        run: |
          is_acceptable_optional_result() {
            local result="$1"
            [ "$result" = "success" ] || [ "$result" = "skipped" ]
          }

          failed=0

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection did not succeed: $CHANGES_RESULT" >&2
            failed=1
          fi

          echo "PostgreSQL Runtime Upgrade Proof => $POSTGRES_RUNTIME_UPGRADE_PROOF (changed=$POSTGRES_RUNTIME_PROOF_CHANGED)"
          if [ "$POSTGRES_RUNTIME_PROOF_CHANGED" = "true" ]; then
            if [ "$POSTGRES_RUNTIME_UPGRADE_PROOF" != "success" ]; then
              failed=1
            fi
          elif [ "$POSTGRES_RUNTIME_UPGRADE_PROOF" != "success" ] && [ "$POSTGRES_RUNTIME_UPGRADE_PROOF" != "skipped" ]; then
            failed=1
          fi

          for check in \
            "Buf Generation:$BUF_CHECK" \
            "Dockerfile Lint:$DOCKER_LINT" \
            "ShellCheck:$SHELLCHECK" \
            "YAML Lint:$YAML_LINT" \
            "Metrics Cardinality Policy Check:$METRICS_CARDINALITY_CHECK" \
            "Flyway Migration Sanity Checks:$FLYWAY_MIGRATION_SANITY_CHECKS" \
            "gRPC Transport Configuration Sanity Checks:$GRPC_TRANSPORT_CONFIG_SANITY_CHECKS" \
            "GitHub Workflow Lint:$WORKFLOW_LINT" \
            "Helm Chart Lint:$HELM_LINT" \
            "Helm Render Validation:$HELM_RENDER_VALIDATION" \
            "Helm Transaction Proof:$HELM_TRANSACTION_PROOF"
          do
            name="${check%%:*}"
            result="${check#*:}"
            echo "$name => $result"
            if [ "$LIGHTWEIGHT_ONLY" = "true" ]; then
              if ! is_acceptable_optional_result "$result"; then
                failed=1
              fi
            else
              if [ "$result" != "success" ]; then
                failed=1
              fi
            fi
          done

          echo "Python Script Validation => $PYTHON_SCRIPT_VALIDATION"
          if [ "$LIGHTWEIGHT_ONLY" != "true" ] || [ "$PYTHON_CHANGED" = "true" ]; then
            if [ "$PYTHON_SCRIPT_VALIDATION" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$PYTHON_SCRIPT_VALIDATION"; then
              failed=1
            fi
          fi

          echo "Dev Tool Contract Checks => $DEV_TOOL_CONTRACT_CHECKS"
          if [ "$LIGHTWEIGHT_ONLY" != "true" ] || [ "$DESIGN_DOCS_CHANGED" = "true" ] || [ "$VALIDATION_PYTHON_CHANGED" = "true" ]; then
            if [ "$DEV_TOOL_CONTRACT_CHECKS" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$DEV_TOOL_CONTRACT_CHECKS"; then
              failed=1
            fi
          fi

          echo "Dev Tools README Contract => $DEV_TOOLS_README_CONTRACT"
          if [ "$LIGHTWEIGHT_ONLY" = "true" ] || [ "$DEV_TOOLS_README_CONTRACT" != "skipped" ]; then
            if [ "$DEV_TOOLS_README_CONTRACT" != "success" ]; then
              failed=1
            fi
          fi

          echo "Validate Documentation => $DOCS_CHECK"
          if [ "$DOCS_CHANGED" = "true" ]; then
            if [ "$DOCS_CHECK" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$DOCS_CHECK"; then
              failed=1
            fi
          fi

          echo "Frontend Checks => $FRONTEND_CHECKS"
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            if [ "$FRONTEND_CHECKS" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$FRONTEND_CHECKS"; then
              failed=1
            fi
          fi

          echo "Build and Test Matrix => $BUILD_AND_TEST"
          if [ "$AFFECTED_MODULES" != "[]" ]; then
            if [ "$BUILD_AND_TEST" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$BUILD_AND_TEST"; then
              failed=1
            fi
          fi

          echo "Account Coverage Aggregate => $ACCOUNT_COVERAGE_AGGREGATE (account-affected=$ACCOUNT_MODULE_AFFECTED)"
          if [ "$ACCOUNT_MODULE_AFFECTED" = "true" ]; then
            if [ "$ACCOUNT_COVERAGE_AGGREGATE" != "success" ]; then
              failed=1
            fi
          elif [ "$ACCOUNT_COVERAGE_AGGREGATE" != "skipped" ]; then
            failed=1
          fi

          echo "Game Session Coverage Aggregate => $GAME_SESSION_COVERAGE_AGGREGATE (game-session-affected=$GAME_SESSION_MODULE_AFFECTED)"
          if [ "$GAME_SESSION_MODULE_AFFECTED" = "true" ]; then
            if [ "$GAME_SESSION_COVERAGE_AGGREGATE" != "success" ]; then
              failed=1
            fi
          elif [ "$GAME_SESSION_COVERAGE_AGGREGATE" != "skipped" ]; then
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "Validation Gate failed because one or more required validation jobs did not succeed." >&2
            exit 1
          fi
