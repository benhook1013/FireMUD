  flyway-migration-sanity-checks:
    name: Flyway Migration Sanity Checks
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch exact Flyway parent
        env:
          FLYWAY_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.flyway_base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FLYWAY_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$FLYWAY_BASE_SHA" == "0000000000000000000000000000000000000000" && "$FLYWAY_EVENT_NAME" != "workflow_dispatch" ]]; then
            exit 0
          fi
          if [[ ! "$FLYWAY_BASE_SHA" =~ ^[[:xdigit:]]{40}$ || "$FLYWAY_BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "Flyway parent requires a full nonzero immutable 40-character SHA" >&2
            exit 1
          fi
          if ! git cat-file -e "${FLYWAY_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$FLYWAY_BASE_SHA"
          fi
          resolved_sha="$(git rev-parse --verify "${FLYWAY_BASE_SHA}^{commit}")"
          if [[ "${resolved_sha,,}" != "${FLYWAY_BASE_SHA,,}" ]]; then
            echo "Flyway base SHA did not resolve to the requested commit" >&2
            exit 1
          fi

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: 🧪 Check Flyway Migration Versions
        env:
          FIREMUD_FLYWAY_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.flyway_base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./gradlew checkFlywayVersions

