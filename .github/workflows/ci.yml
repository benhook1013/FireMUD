name: CI — Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      flyway_base_sha:
        description: Full immutable commit SHA of the receiving parent to compare Flyway history against
        required: true
        type: string

run-name: CI — Validation ${{ github.event_name == 'pull_request' && format('pr-{0} base-{1} head-{2}', github.event.pull_request.number, github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && format('metadata-{0}', github.run_id) || 'required' }}
  cancel-in-progress: true

jobs:
  # Change detection and shared inputs
  changes:
    name: Detect CI-Relevant Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
    outputs:
      run_all: ${{ steps.compute.outputs.run_all }}
      affected_services: ${{ steps.compute.outputs.affected_services }}
      affected_modules: ${{ steps.compute.outputs.affected_modules }}
      module_check_matrix: ${{ steps.compute.outputs.module_check_matrix }}
      other_module_check_matrix: ${{ steps.compute.outputs.other_module_check_matrix }}
      account_module_check_matrix: ${{ steps.compute.outputs.account_module_check_matrix }}
      game_session_module_check_matrix: ${{ steps.compute.outputs.game_session_module_check_matrix }}
      world_module_check_matrix: ${{ steps.compute.outputs.world_module_check_matrix }}
      bootable_modules: ${{ steps.compute.outputs.bootable_modules }}
      docs_changed: ${{ steps.compute.outputs.docs_changed }}
      frontend_changed: ${{ steps.compute.outputs.frontend_changed }}
      python_changed: ${{ steps.compute.outputs.python_changed }}
      design_docs_changed: ${{ steps.compute.outputs.design_docs_changed }}
      validation_python_changed: ${{ steps.compute.outputs.validation_python_changed }}
      postgres_runtime_proof_changed: ${{ steps.compute.outputs.postgres_runtime_proof_changed }}
      lightweight_only: ${{ steps.compute.outputs.lightweight_only }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out change classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Compute affected jobs
        id: compute
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("node:fs");
            const classifierPath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/classify-change-scope.cjs`;
            const completeModules = [
              "common-data-runtime",
              "common-platform-core",
              "common-redis-contracts",
              "common-saga",
              "common-temporal",
              "common-security",
              "common-test-support",
              "common-web-support",
              "account-service",
              "automation-scripting-service",
              "entity-management-service",
              "game-design-service",
              "game-logic-service",
              "game-session-service",
              "logging-admin-service",
              "social-groups-service",
              "spring-cloud-gateway",
              "tcp-proxy-service",
              "world-management-service",
              "recovery-controller-service",
              "hosted-environment-identity-controller",
              "load-testing",
            ];
            const completeBootableModules = [
              "account-service",
              "automation-scripting-service",
              "entity-management-service",
              "game-design-service",
              "game-logic-service",
              "game-session-service",
              "logging-admin-service",
              "social-groups-service",
              "spring-cloud-gateway",
              "tcp-proxy-service",
              "world-management-service",
              "recovery-controller-service",
              "hosted-environment-identity-controller",
            ];
            // Bind the changed paths to the event commits. The PR-number file list
            // follows the live comparison, even when its file count stays the same.
            const readEventFiles = async () => {
              const eventPr = context.payload?.pull_request;
              const base = eventPr?.base?.sha;
              const head = eventPr?.head?.sha;
              const validSha = sha => typeof sha === "string" && /^[0-9a-f]{40}$/.test(sha) &&
                sha !== "0".repeat(40);
              if (!validSha(base) || !validSha(head) || base === head ||
                  !Number.isInteger(eventPr.changed_files) || eventPr.changed_files <= 0 ||
                  eventPr.changed_files >= 300) {
                return null;
              }
              try {
                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo,
                  basehead: base + "..." + head,
                  per_page: 100,
                });
                const mergeBase = comparison?.merge_base_commit?.sha;
                const entries = comparison?.files;
                const validPath = path => typeof path === "string" && path.length > 0;
                if (comparison?.base_commit?.sha !== base || !validSha(mergeBase) || mergeBase === head ||
                    !((comparison.status === "ahead" && mergeBase === base) ||
                      (comparison.status === "diverged" && mergeBase !== base)) ||
                    !Array.isArray(entries) || entries.length !== eventPr.changed_files ||
                    !entries.every(entry => entry && validPath(entry.filename) &&
                      ["added", "removed", "modified", "renamed"].includes(entry.status) &&
                      (entry.status !== "renamed" || validPath(entry.previous_filename)) &&
                      (entry.previous_filename === undefined || validPath(entry.previous_filename))) ||
                    new Set(entries.map(entry => entry.filename)).size !== entries.length) {
                  return null;
                }
                return entries.flatMap(entry => entry.previous_filename === undefined
                  ? [entry.filename] : [entry.filename, entry.previous_filename]);
              } catch {
                return null;
              }
            };
            let outputs;
            if (fs.existsSync(classifierPath)) {
              const { classifyChangeScope, classifyGithubChangeScope, ALL_MODULES } = require(classifierPath);
              const isPullRequest = context.eventName === "pull_request";
              const eventFiles = isPullRequest ? await readEventFiles() : null;
              const scope = isPullRequest
                ? (eventFiles && typeof classifyChangeScope === "function" ? classifyChangeScope(eventFiles) : null)
                : await classifyGithubChangeScope(github, context);
              if (scope) {
                const moduleScopeAvailable =
                  Array.isArray(scope.affectedModules) && Array.isArray(scope.bootableModules) &&
                  Array.isArray(ALL_MODULES) && completeModules.every(module => ALL_MODULES.includes(module));
                // Older classifiers can retain their lightweight decision only for
                // verified paths this workflow recognizes as lightweight.
                const knownDoc = path => path === "mkdocs.yml" ||
                  /^[A-Za-z0-9_][A-Za-z0-9_.-]*\.md$/.test(path) ||
                  path === "dev-tools/README.md" ||
                  (/^(?:design\/|docs\/)[A-Za-z0-9_./-]+\.md$/.test(path) && !path.split("/").includes("..")) ||
                  (/^services\/([a-z0-9-]+)\/README\.md$/.test(path) &&
                    Array.isArray(ALL_MODULES) && ALL_MODULES.includes(path.split("/")[1]));
                const knownValidationPython = path =>
                  /^dev-tools\/validation\/[A-Za-z0-9_./-]+\.py$/.test(path) &&
                  !path.split("/").includes("..") &&
                  path !== "dev-tools/validation/gradle-run-supervisor.py";
                const lightweightFallback = !moduleScopeAvailable && scope.lightweightOnly === true &&
                  scope.runAll !== true && eventFiles !== null &&
                  eventFiles.every(path => knownDoc(path) || knownValidationPython(path));
                if (moduleScopeAvailable || lightweightFallback) {
                  const fallbackPython = lightweightFallback && eventFiles.some(knownValidationPython);
                  const fallbackDesignDocs = lightweightFallback &&
                    eventFiles.some(path => knownDoc(path) && path.startsWith("design/"));
                  // This is the only PostgreSQL proof path in the legacy lightweight allowlist.
                  const postgresRuntimeProof = lightweightFallback
                    ? eventFiles.includes("dev-tools/validation/test_validate_preview_artifact.py")
                    : (scope.postgresRuntimeProofChanged ?? true);
                  const affectedModules = lightweightFallback ? [] : scope.affectedModules;
                  const bootableModules = lightweightFallback ? [] : scope.bootableModules;
                  outputs = {
                    run_all: scope.runAll === true,
                    affected_services: scope.affectedServices,
                    affected_modules: affectedModules,
                    bootable_modules: bootableModules,
                    docs_changed: scope.docsChanged,
                    frontend_changed: scope.frontendChanged,
                    python_changed: scope.pythonChanged || fallbackPython,
                    design_docs_changed: scope.designDocsChanged || fallbackDesignDocs,
                    validation_python_changed: scope.validationPythonChanged || fallbackPython,
                    postgres_runtime_proof_changed: postgresRuntimeProof,
                    lightweight_only: scope.lightweightOnly === true && !scope.runAll &&
                      affectedModules.length === 0 && bootableModules.length === 0,
                  };
                }
              }
            }
            if (!outputs) {
              core.warning("Exact change scope is unavailable; using complete validation scope.");
              outputs = {
                run_all: true,
                affected_services: [
                  "account-service",
                  "automation-scripting-service",
                  "entity-management-service",
                  "game-design-service",
                  "game-logic-service",
                  "game-session-service",
                  "logging-admin-service",
                  "social-groups-service",
                  "spring-cloud-gateway",
                  "tcp-proxy-service",
                  "world-management-service",
                ],
                affected_modules: completeModules,
                bootable_modules: completeBootableModules,
                docs_changed: true,
                frontend_changed: true,
                python_changed: true,
                design_docs_changed: true,
                validation_python_changed: true,
                postgres_runtime_proof_changed: true,
                lightweight_only: false,
              };
            }
            const slowServicePartitionCounts = { "account-service": 4, "game-session-service": 4, "world-management-service": 2 };
            outputs.module_check_matrix = outputs.affected_modules.flatMap((module) =>
              slowServicePartitionCounts[module]
                ? Array.from({ length: slowServicePartitionCounts[module] }, (_, index) =>
                    ({ module, partition: String(index + 1), "java-version": 25 }))
                : [{ module, partition: "full", "java-version": 25 }]
            );
            outputs.other_module_check_matrix = outputs.module_check_matrix.filter(row => !slowServicePartitionCounts[row.module]);
            outputs.account_module_check_matrix = outputs.module_check_matrix.filter(row => row.module === "account-service");
            outputs.game_session_module_check_matrix = outputs.module_check_matrix.filter(row => row.module === "game-session-service");
            outputs.world_module_check_matrix = outputs.module_check_matrix.filter(row => row.module === "world-management-service");
            for (const [name, value] of Object.entries(outputs)) {
              core.setOutput(
                name,
                Array.isArray(value) ? JSON.stringify(value) : String(value)
              );
            }

  postgres-runtime-upgrade-proof:
    name: PostgreSQL Runtime Upgrade Proof
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.postgres_runtime_proof_changed == 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out validation candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up canonical Python dependencies
        uses: ./.github/actions/setup-python
        with:
          requirements: yaml

      - name: Prove PostgreSQL 16 to 18 logical restore on isolated Docker volumes
        env:
          FIREMUD_POSTGRES_RUNTIME_DOCKER_PROOF: required
        run: bash ./dev-tools/tests/postgres-runtime-upgrade-contract.sh

  # Static generation, lint, and policy checks
  buf-check:
    name: Buf Generation
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: 🧰 Install Buf CLI
        id: install-buf
        env:
          BUF_VERSION: ${{ steps.workflow-tool-versions.outputs.buf-version }}
          BUF_SHA256: ${{ steps.workflow-tool-versions.outputs.buf-linux-x86-64-sha256 }}
        run: |
          [[ "$(uname -s)/$(uname -m)" == "Linux/x86_64" ]] || { echo "Unsupported Buf platform" >&2; exit 1; }
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" \
            -o /tmp/buf
          echo "${BUF_SHA256}  /tmp/buf" | sha256sum --check --status
          sudo install -m 0755 /tmp/buf /usr/local/bin/buf
          buf --version

      - name: 💾 Cache Buf modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/buf
          key: buf-mod-${{ runner.os }}-${{ hashFiles('protos/buf.yaml', 'protos/**/*.proto', 'config/protobuf/buf.gen.yaml', 'config/protobuf/buf.work.yaml') }}
          restore-keys: buf-mod-${{ runner.os }}-

      - name: ⚙️ Generate Protobufs
        working-directory: protos
        env:
          BUF_WORKSPACE_CONFIG: ../config/protobuf/buf.work.yaml
        run: buf generate --template ../config/protobuf/buf.gen.yaml

      - name: Set up Java for remote generator compatibility proof
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle for remote generator compatibility proof
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Set up Python for Gradle recovery
        uses: ./.github/actions/setup-python
        with:
          requirements: none

      - name: Compile the actual Buf-generated Java sources
        run: |
          test -n "$(find protos/gen/java -name '*.java' -print -quit)"
          bash ./dev-tools/validation/run-gradle-with-dependency-recovery.sh --runner ./gradlew -- compileBufGeneratedJava

  docker-lint:
    name: Dockerfile Lint
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐳 Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
          config: config/hadolint/hadolint.yaml

  shellcheck:
    name: ShellCheck
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: 📦 Install ShellCheck
        env:
          SHELLCHECK_VERSION: ${{ steps.workflow-tool-versions.outputs.shellcheck-version }}
          SHELLCHECK_SHA256: ${{ steps.workflow-tool-versions.outputs.shellcheck-linux-x86-64-sha256 }}
        run: |
          set -euo pipefail
          [[ "$(uname -s)/$(uname -m)" == "Linux/x86_64" ]] || { echo "Unsupported ShellCheck platform" >&2; exit 1; }
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${SHELLCHECK_SHA256}  /tmp/${archive}" | sha256sum --check --status
          extract_dir="${RUNNER_TEMP:?}/shellcheck"
          mkdir -p "$extract_dir"
          tar -xJf "/tmp/${archive}" -C "$extract_dir"
          sudo install -m 0755 "$extract_dir/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: 🐚 Lint tracked shell scripts
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          if [ "${#shell_files[@]}" -eq 0 ]; then
            echo "No tracked shell scripts found."
            exit 0
          fi
          shellcheck "${shell_files[@]}"

  python-script-validation:
    name: Python Script Validation
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (needs.changes.outputs.lightweight_only != 'true' || needs.changes.outputs.python_changed == 'true') }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set Up Python
        uses: ./.github/actions/setup-python
        with:
          requirements: ci

      - name: 🧪 Validate tracked Python scripts
        run: |
          mapfile -t python_files < <(git ls-files '*.py')
          if [ "${#python_files[@]}" -eq 0 ]; then
            echo "No tracked Python scripts found."
            exit 0
          fi
          python3 -m py_compile "${python_files[@]}"
          ruff check --force-exclude "${python_files[@]}"

      - name: 🧪 Exercise Flyway checker fixtures
        if: ${{ needs.changes.outputs.validation_python_changed == 'true' }}
        run: python3 dev-tools/validation/check-flyway-versions.py --self-test

  dev-tool-contract-checks:
    name: Dev Tool Contract Checks
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (needs.changes.outputs.lightweight_only != 'true' || needs.changes.outputs.design_docs_changed == 'true' || needs.changes.outputs.validation_python_changed == 'true') }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load workflow tool versions
        id: workflow-tool-versions
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/load-workflow-tool-versions

      - name: 🧰 Set up kubectl
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-kubectl

      - name: Set up canonical GitHub CLI
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-gh

      - name: 🐍 Set Up Python
        uses: ./.github/actions/setup-python
        with:
          requirements: ${{ (needs.changes.outputs.lightweight_only == 'true' && needs.changes.outputs.design_docs_changed == 'true' && needs.changes.outputs.validation_python_changed != 'true') && 'yaml' || 'ci' }}

      - name: Run installation inventory offline vectors
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: python3 dev-tools/deploy/test-runtime-installation-inventory.py

      - name: Set up Node for Python Markdown contracts
        if: ${{ needs.changes.outputs.lightweight_only != 'true' || needs.changes.outputs.validation_python_changed == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: config/openapi/package-lock.json

      - name: Install pinned Markdown contract dependencies
        if: ${{ needs.changes.outputs.lightweight_only != 'true' || needs.changes.outputs.validation_python_changed == 'true' }}
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix config/openapi

      - name: 📦 Install cloc
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        env:
          CLOC_VERSION: ${{ steps.workflow-tool-versions.outputs.cloc-version }}
          CLOC_SHA256: ${{ steps.workflow-tool-versions.outputs.cloc-source-sha256 }}
        run: |
          set -euo pipefail
          archive="cloc-${CLOC_VERSION}.pl"
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/AlDanial/cloc/releases/download/v${CLOC_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${CLOC_SHA256}  /tmp/${archive}" | sha256sum --check --status
          sudo install -m 0755 "/tmp/${archive}" /usr/local/bin/cloc
          cloc --version

      - name: Set up Helm
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-helm

      - name: Set up Java for Gradle task-graph contracts
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle for task-graph contracts
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: 🧪 Validate dev tool contracts
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: |
          set -x
          TIMEFORMAT='bash ./dev-tools/tests/cloc-report-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/cloc-report-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/ci-lightweight-scope-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/ci-lightweight-scope-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/protected-pod-admission-workflow-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/protected-pod-admission-workflow-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/gradle-dependency-recovery-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/gradle-dependency-recovery-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/workflow-version-authority-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/workflow-version-authority-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/workflow-tool-updater-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/workflow-tool-updater-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/publisher-checksum-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/publisher-checksum-contract.sh
