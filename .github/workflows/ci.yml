name: CI — Build and Security

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3am UTC

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buf-check:
    name: Buf Breaking and Generation
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🧰 Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.30.0'

      - name: 🛠️ Fetch Base Branch for Buf Breaking
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}

      - name: ⚠️ Buf Breaking
        if: github.event_name == 'pull_request'
        run: |
          buf breaking --against origin/${{ github.event.pull_request.base.ref }}

      - name: ⚙️ Generate Protobufs
        run: buf generate

  build-and-test:
    name: Build and Test (${{ matrix.service }})
    needs: buf-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java-version: [21]
        node-version: [20]
        service:
          - account-service
          - automation-scripting-service
          - entity-management-service
          - game-design-service
          - game-logic-service
          - game-session-service
          - logging-admin-service
          - social-groups-service
          - spring-cloud-gateway
          - tcp-proxy-service
          - world-management-service

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: 💾 Cache Node Modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: node-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      - name: 📦 Install Frontend Dependencies
        run: |
          cd web-client
          npm ci
        
      - name: 🛠 Run Frontend Lint
        run: |
          cd web-client
          npm run lint
          npm run format -- -c

      - name: ♿ Run Accessibility Audit
        run: |
          cd web-client
          npm run accessibility

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🎨 Apply Spotless Formatting
        run: |
          echo "::group::Run Spotless"
          ./gradlew spotlessApply
          echo "::endgroup::"

      - name: 🧹 Fix Markdown Lint
        run: |
          echo "::group::Lint Markdown"
          ./gradlew lintMarkdownFix
          echo "::endgroup::"

      - name: 🧪 Run Unit Tests
        id: checks
        run: |
          echo "::group::Run Tests"
          ./gradlew :${{ matrix.service }}:check
          echo "::endgroup::"

      - name: 📈 Parse Coverage %
        id: coverage
        run: |
          COVERAGE_FILE=services/${{ matrix.service }}/build/reports/jacoco/test/jacocoTestReport.xml
          if [ -f "$COVERAGE_FILE" ]; then
            COVERAGE_LINE=$(grep -A 1 "<counter type=\"LINE\"" "$COVERAGE_FILE" | tail -n 1 || true)
            MISSED=$(echo "$COVERAGE_LINE" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p')
            COVERED=$(echo "$COVERAGE_LINE" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p')
            TOTAL=$((MISSED + COVERED))
            if [ "$TOTAL" -gt 0 ]; then
              PERCENT=$((100 * COVERED / TOTAL))
            else
              PERCENT=0
            fi
          else
            echo "Coverage file not found" >&2
            PERCENT=0
          fi
          echo "percent=$PERCENT" >> $GITHUB_OUTPUT
          echo "### 📊 Code coverage: **$PERCENT%**" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}-report-${{ github.sha }}
          path: services/${{ matrix.service }}/build/reports/jacoco/test/

      - name: 📤 Upload Test Logs if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/build/reports/tests/test/

      - name: 💬 Upload Build Summary Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const coverage = Number("${{ steps.coverage.outputs.percent }}");
            const testPassed = "${{ steps.checks.outcome }}" === "success";

            const summaryLines = [
              `### 🧪 Build Summary`,
              testPassed ? "✅ All tests passed" : "❌ Some tests failed (see logs)",
              "🧼 Lint + format steps completed",
              `📊 Code coverage: **${coverage}%**`,
              ""
            ];

            const body = summaryLines.join('\n');

            core.summary.addHeading("🧪 Build Summary");
            core.summary.addRaw(body).write();

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(comment =>
              comment.body.startsWith('### 🧪 Build Summary')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: 💾 Cache Trivy DB
        uses: actions/cache@v3
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/package-lock.json') }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: 🛡️ Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.1

      - name: 🔍 Run Trivy and Save Report
        if: always()
        continue-on-error: false
        run: |
          echo "::group::Run Trivy"
          trivy fs --config .trivy.yaml . | tee trivy-report.txt
          echo "::endgroup::"

      - name: 📤 Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report.txt

      - name: 💬 Upload Trivy Report as PR Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = 'trivy-report.txt';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'Trivy report not available.';

            const hasVulnerabilities =
              /Total:\s+[1-9]/.test(report) || /CRITICAL|HIGH/.test(report);

            const summary = hasVulnerabilities
              ? "❌ Critical/High vulnerabilities detected"
              : "✅ No critical/high vulnerabilities found";

            const body = `### 🔍 Trivy Security Scan Report\n**${summary}**\n\n\`\`\n${report}\n\`\``;

            core.summary.addHeading("🔍 Trivy Security Scan");
            core.summary.addRaw(summary).write();

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(comment =>
              comment.body.startsWith('### 🔍 Trivy Security Scan Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

