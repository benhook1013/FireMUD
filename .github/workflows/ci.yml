name: CI — Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

run-name: CI — Validation ${{ github.event_name == 'pull_request' && format('pr-{0} base-{1} head-{2}', github.event.pull_request.number, github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && format('metadata-{0}', github.run_id) || 'required' }}
  cancel-in-progress: true

jobs:
  # Change detection and shared inputs
  changes:
    name: Detect CI-Relevant Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Classify the complete pull-request file list.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
    outputs:
      run_all: ${{ steps.compute.outputs.run_all }}
      affected_services: ${{ steps.compute.outputs.affected_services }}
      affected_modules: ${{ steps.compute.outputs.affected_modules }}
      bootable_modules: ${{ steps.compute.outputs.bootable_modules }}
      docs_changed: ${{ steps.compute.outputs.docs_changed }}
      frontend_changed: ${{ steps.compute.outputs.frontend_changed }}
      python_changed: ${{ steps.compute.outputs.python_changed }}
      design_docs_changed: ${{ steps.compute.outputs.design_docs_changed }}
      validation_python_changed: ${{ steps.compute.outputs.validation_python_changed }}
      lightweight_only: ${{ steps.compute.outputs.lightweight_only }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Check out change classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Compute affected jobs
        id: compute
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("node:fs");
            const classifierPath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/classify-change-scope.cjs`;
            const completeModules = [
              "common-data-runtime",
              "common-platform-core",
              "common-redis-contracts",
              "common-saga",
              "common-temporal",
              "common-security",
              "common-test-support",
              "common-web-support",
              "account-service",
              "automation-scripting-service",
              "entity-management-service",
              "game-design-service",
              "game-logic-service",
              "game-session-service",
              "logging-admin-service",
              "social-groups-service",
              "spring-cloud-gateway",
              "tcp-proxy-service",
              "world-management-service",
              "hosted-environment-identity-controller",
              "load-testing",
            ];
            const completeBootableModules = [
              "account-service",
              "automation-scripting-service",
              "entity-management-service",
              "game-design-service",
              "game-logic-service",
              "game-session-service",
              "logging-admin-service",
              "social-groups-service",
              "spring-cloud-gateway",
              "tcp-proxy-service",
              "world-management-service",
              "hosted-environment-identity-controller",
            ];
            let outputs;
            if (fs.existsSync(classifierPath)) {
              const { classifyGithubChangeScope } = require(classifierPath);
              const scope = await classifyGithubChangeScope(github, context);
              const moduleScopeAvailable =
                Array.isArray(scope.affectedModules) && Array.isArray(scope.bootableModules);
              outputs = {
                run_all: scope.runAll || !moduleScopeAvailable,
                affected_services: scope.affectedServices,
                affected_modules: moduleScopeAvailable ? scope.affectedModules : completeModules,
                bootable_modules: moduleScopeAvailable ? scope.bootableModules : completeBootableModules,
                docs_changed: scope.docsChanged,
                frontend_changed: scope.frontendChanged,
                python_changed: scope.pythonChanged,
                design_docs_changed: scope.designDocsChanged,
                validation_python_changed: scope.validationPythonChanged,
                lightweight_only: scope.lightweightOnly,
              };
            } else {
              core.warning("Base revision predates the change classifier; using complete validation scope.");
              outputs = {
                run_all: true,
                affected_services: [
                  "account-service",
                  "automation-scripting-service",
                  "entity-management-service",
                  "game-design-service",
                  "game-logic-service",
                  "game-session-service",
                  "logging-admin-service",
                  "social-groups-service",
                  "spring-cloud-gateway",
                  "tcp-proxy-service",
                  "world-management-service",
                ],
                affected_modules: completeModules,
                bootable_modules: completeBootableModules,
                docs_changed: true,
                frontend_changed: true,
                python_changed: true,
                design_docs_changed: true,
                validation_python_changed: true,
                lightweight_only: false,
              };
            }
            for (const [name, value] of Object.entries(outputs)) {
              core.setOutput(
                name,
                Array.isArray(value) ? JSON.stringify(value) : String(value)
              );
            }

  # Static generation, lint, and policy checks
  buf-check:
    name: Buf Generation
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: 🧰 Install Buf CLI
        id: install-buf
        env:
          BUF_VERSION: ${{ steps.workflow-tool-versions.outputs.buf-version }}
          BUF_SHA256: ${{ steps.workflow-tool-versions.outputs.buf-linux-x86-64-sha256 }}
        run: |
          [[ "$(uname -s)/$(uname -m)" == "Linux/x86_64" ]] || { echo "Unsupported Buf platform" >&2; exit 1; }
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" \
            -o /tmp/buf
          echo "${BUF_SHA256}  /tmp/buf" | sha256sum --check --status
          sudo install -m 0755 /tmp/buf /usr/local/bin/buf
          buf --version

      - name: 💾 Cache Buf modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/buf
          key: buf-mod-${{ runner.os }}-${{ hashFiles('protos/buf.yaml', 'protos/**/*.proto', 'config/protobuf/buf.gen.yaml', 'config/protobuf/buf.work.yaml') }}
          restore-keys: buf-mod-${{ runner.os }}-

      - name: ⚙️ Generate Protobufs
        working-directory: protos
        env:
          BUF_WORKSPACE_CONFIG: ../config/protobuf/buf.work.yaml
        run: buf generate --template ../config/protobuf/buf.gen.yaml

  docker-lint:
    name: Dockerfile Lint
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐳 Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
          config: config/hadolint/hadolint.yaml

  shellcheck:
    name: ShellCheck
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: 📦 Install ShellCheck
        env:
          SHELLCHECK_VERSION: ${{ steps.workflow-tool-versions.outputs.shellcheck-version }}
          SHELLCHECK_SHA256: ${{ steps.workflow-tool-versions.outputs.shellcheck-linux-x86-64-sha256 }}
        run: |
          set -euo pipefail
          [[ "$(uname -s)/$(uname -m)" == "Linux/x86_64" ]] || { echo "Unsupported ShellCheck platform" >&2; exit 1; }
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${SHELLCHECK_SHA256}  /tmp/${archive}" | sha256sum --check --status
          extract_dir="${RUNNER_TEMP:?}/shellcheck"
          mkdir -p "$extract_dir"
          tar -xJf "/tmp/${archive}" -C "$extract_dir"
          sudo install -m 0755 "$extract_dir/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: 🐚 Lint tracked shell scripts
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          if [ "${#shell_files[@]}" -eq 0 ]; then
            echo "No tracked shell scripts found."
            exit 0
          fi
          shellcheck "${shell_files[@]}"

  python-script-validation:
    name: Python Script Validation
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (needs.changes.outputs.lightweight_only != 'true' || needs.changes.outputs.python_changed == 'true') }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set Up Python
        uses: ./.github/actions/setup-python
        with:
          requirements: ci

      - name: 🧪 Validate tracked Python scripts
        run: |
          mapfile -t python_files < <(git ls-files '*.py')
          if [ "${#python_files[@]}" -eq 0 ]; then
            echo "No tracked Python scripts found."
            exit 0
          fi
          python3 -m py_compile "${python_files[@]}"
          ruff check --force-exclude "${python_files[@]}"

  dev-tool-contract-checks:
    name: Dev Tool Contract Checks
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (needs.changes.outputs.lightweight_only != 'true' || needs.changes.outputs.design_docs_changed == 'true' || needs.changes.outputs.validation_python_changed == 'true') }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load workflow tool versions
        id: workflow-tool-versions
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/load-workflow-tool-versions

      - name: 🧰 Set up kubectl
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-kubectl

      - name: Set up canonical GitHub CLI
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-gh

      - name: 🐍 Set Up Python
        uses: ./.github/actions/setup-python
        with:
          requirements: ${{ (needs.changes.outputs.lightweight_only == 'true' && needs.changes.outputs.design_docs_changed == 'true' && needs.changes.outputs.validation_python_changed != 'true') && 'yaml' || 'ci' }}

      - name: 📦 Install cloc
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        env:
          CLOC_VERSION: ${{ steps.workflow-tool-versions.outputs.cloc-version }}
          CLOC_SHA256: ${{ steps.workflow-tool-versions.outputs.cloc-source-sha256 }}
        run: |
          set -euo pipefail
          archive="cloc-${CLOC_VERSION}.pl"
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/AlDanial/cloc/releases/download/v${CLOC_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${CLOC_SHA256}  /tmp/${archive}" | sha256sum --check --status
          sudo install -m 0755 "/tmp/${archive}" /usr/local/bin/cloc
          cloc --version

      - name: Set up Helm
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-helm

      - name: 🧪 Validate dev tool contracts
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: |
          bash ./dev-tools/tests/cloc-report-contract.sh
          bash ./dev-tools/tests/ci-lightweight-scope-contract.sh
          bash ./dev-tools/tests/workflow-version-authority-contract.sh
          bash ./dev-tools/tests/workflow-tool-updater-contract.sh
          bash ./dev-tools/tests/jacoco-combined-report-contract.sh
          bash ./dev-tools/tests/pr-review-controller-contract.sh
          bash ./dev-tools/tests/testcontainers-disabled-contract.sh
          bash ./dev-tools/tests/pr-retarget-workflow-contract.sh
          bash ./dev-tools/tests/static-analysis-summary-contract.sh
          bash ./dev-tools/tests/ci-validation-summary-contract.sh
          bash ./dev-tools/tests/security-summary-contract.sh
          bash ./dev-tools/tests/pr-runtime-image-publication-contract.sh
          bash ./dev-tools/tests/pr-required-gate-context-contract.sh
          bash ./dev-tools/tests/dev-demo-workflow-contract.sh
          bash ./dev-tools/tests/erd-workflow-contract.sh
          bash ./dev-tools/tests/smoke-transport-contract.sh
          bash ./dev-tools/tests/reset-service-db-contract.sh
          bash ./dev-tools/tests/preview-eligibility-contract.sh
          bash ./dev-tools/tests/preview-priority-contract.sh
          bash ./dev-tools/tests/gameplay-bridge-network-policy-contract.sh
          bash ./dev-tools/tests/hosted-gateway-bridge-contract.sh
          bash ./dev-tools/tests/preview-runner-isolation-contract.sh
          bash ./dev-tools/tests/preview-standalone-transport-certificates-contract.sh
          bash ./dev-tools/tests/preview-ca-recovery-contract.sh
          bash ./dev-tools/tests/trust-bootstrap-rbac-contract.sh
          bash ./dev-tools/tests/trust-bootstrap-issuance-contract.sh
          bash ./dev-tools/tests/trust-bootstrap-live-proof-contract.sh
          bash ./dev-tools/tests/trust-bootstrap-provision-contract.sh
          bash ./dev-tools/tests/hosted-identity-controller-manifest-contract.sh
          bash ./dev-tools/tests/hosted-identity-controller-workflow-contract.sh
          bash ./dev-tools/tests/worktree-topology-contract.sh
          bash ./dev-tools/tests/dev-tools-readme-contract.sh
          bash ./dev-tools/tests/preflight-contract.sh
          bash ./dev-tools/tests/verify-backups-velero-contract.sh
          bash ./dev-tools/tests/verify-backups-cronjob-contract.sh
          bash ./dev-tools/tests/backup-verifier-image-contract.sh
          bash ./dev-tools/tests/kubectl-version-skew-contract.sh
          bash ./dev-tools/tests/helm-transaction-proof-contract.sh
          bash ./dev-tools/tests/preview-image-tag-contract.sh
          bash ./dev-tools/tests/preview-merge-image-tag-contract.sh
          bash ./dev-tools/tests/overlay-preflight-contract.sh
          bash ./dev-tools/tests/validate-external-credentials-contract.sh
          bash ./dev-tools/tests/observability-validator-contract.sh
          bash ./dev-tools/tests/secret-compliance-contract.sh
          bash ./dev-tools/tests/ensure-local-compose-env-contract.sh
          bash ./dev-tools/tests/smoke-image-env-contract.sh
          bash ./dev-tools/tests/gradle-proof-tooling-contract.sh
          bash ./dev-tools/tests/minio-pr-smoke-bootstrap-contract.sh
          bash ./dev-tools/tests/architecture-doc-contracts.sh
          bash ./dev-tools/tests/lint-yaml-contract.sh
          python3 -m unittest discover -s dev-tools/validation -p 'test_*.py'
          python3 -m unittest discover -s dev-tools/tests -p 'test_*.py'

      - name: 🧪 Validate architecture document contracts
        if: ${{ needs.changes.outputs.lightweight_only == 'true' && needs.changes.outputs.design_docs_changed == 'true' }}
        run: bash ./dev-tools/tests/architecture-doc-contracts.sh

      - name: 🧪 Validate non-runtime Python contracts
        if: ${{ needs.changes.outputs.lightweight_only == 'true' && needs.changes.outputs.validation_python_changed == 'true' }}
        run: python3 -m unittest discover -s dev-tools/validation -p 'test_*.py'

  dev-tools-readme-contract:
    name: Dev Tools README Contract
    needs: [changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only == 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🐍 Set Up Python
        uses: ./.github/actions/setup-python
        with:
          requirements: none

      - name: 🧭 Validate documented dev-tool paths and links
        run: bash ./dev-tools/tests/dev-tools-readme-contract.sh

  yaml-lint:
    name: YAML Lint
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set Up Python
        uses: ./.github/actions/setup-python
        with:
          requirements: ci

      - name: 🧪 Lint tracked YAML
        run: bash ./dev-tools/validation/lint-yaml.sh

  metrics-cardinality-check:
    name: Metrics Cardinality Policy Check
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set Up Python
        uses: ./.github/actions/setup-python

      - name: 📏 Validate metric label policy
        run: python3 dev-tools/observability/check-metrics-cardinality.py

  flyway-migration-sanity-checks:
    name: Flyway Migration Sanity Checks
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: 🧪 Check Flyway Migration Versions
        run: ./gradlew checkFlywayVersions

  grpc-transport-config-sanity-checks:
    name: gRPC Transport Configuration Sanity Checks
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: 🧪 Check gRPC Transport Configuration
        run: ./gradlew checkGrpcTransportConfig checkGrpcPublicMethods

  workflow-lint:
    name: GitHub Workflow Lint
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: ⚙️ Set Up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: false

      - name: 🧪 Validate GitHub Actions Workflows
        env:
          ACTIONLINT_VERSION: ${{ steps.workflow-tool-versions.outputs.actionlint-version }}
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          "$(go env GOPATH)/bin/actionlint" -config-file .github/actionlint.yaml

  helm-lint:
    name: Helm Chart Lint
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: ./.github/actions/setup-helm

      - name: Set up canonical Python dependencies
        uses: ./.github/actions/setup-python
        with:
          requirements: yaml

      - name: 🧪 Lint tracked Helm charts
        run: bash ./dev-tools/validation/validate-helm.sh lint

  helm-render-validation:
    name: Helm Render Validation
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: ./.github/actions/setup-helm

      - name: Set up canonical Python dependencies
        uses: ./.github/actions/setup-python
        with:
          requirements: yaml

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: Set up kubeconform
        env:
          KUBECONFORM_VERSION: ${{ steps.workflow-tool-versions.outputs.kubeconform-version }}
          KUBECONFORM_SHA256: ${{ steps.workflow-tool-versions.outputs.kubeconform-linux-amd64-sha256 }}
        run: |
          [[ "$(uname -s)/$(uname -m)" == "Linux/x86_64" ]] || { echo "Unsupported kubeconform platform" >&2; exit 1; }
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 --connect-timeout 10 --max-time 60 "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tgz
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum --check --status
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: 🧪 Validate rendered Helm manifests
        run: bash ./dev-tools/validation/validate-helm.sh render

      - name: 🧪 Validate opt-in tenant migration Jobs
        run: bash ./dev-tools/tests/helm-tenant-association-migration-contract.sh

      - name: 🧪 Validate hosted Telnet TLS contract
        run: bash ./dev-tools/tests/hosted-telnet-tls-contract.sh

  helm-transaction-proof:
    name: Helm Transaction Proof
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      K3S_IMAGE: rancher/k3s:v1.34.5-k3s1@sha256:998f4db28a13143ada759690b554c5d8c1814ac03f77c1bdd78bbd73875a1379
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: ./.github/actions/setup-kubectl

      - name: Set up Helm
        uses: ./.github/actions/setup-helm

      - name: Set up canonical Python dependencies
        uses: ./.github/actions/setup-python
        with:
          requirements: yaml

      - name: Pull pinned disposable k3s server image
        run: |
          set -euo pipefail
          pull_succeeded=false
          for attempt in 1 2 3; do
            if timeout 120s docker pull "$K3S_IMAGE"; then
              pull_succeeded=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done
          if [[ "$pull_succeeded" != true ]]; then
            echo "Unable to pull $K3S_IMAGE after three attempts" >&2
            exit 1
          fi

      - name: Start pinned disposable k3s server
        run: |
          docker run --pull=never --detach --privileged \
            --name firemud-helm-proof \
            --publish 6443:6443 \
            "$K3S_IMAGE" \
            server --disable=traefik --disable=servicelb --disable=metrics-server --write-kubeconfig-mode=644

      - name: Wait for disposable k3s startup
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if docker logs firemud-helm-proof 2>&1 | grep -F 'k3s is up and running' >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              docker logs firemud-helm-proof
              exit 1
            fi
            sleep 2
          done
          docker cp firemud-helm-proof:/etc/rancher/k3s/k3s.yaml "$RUNNER_TEMP/helm-proof.kubeconfig"
          chmod 0600 "$RUNNER_TEMP/helm-proof.kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/helm-proof.kubeconfig" >> "$GITHUB_ENV"

      - name: Run Helm lifecycle proof
        run: bash ./dev-tools/validation/helm-transaction-proof.sh

      - name: Remove disposable k3s server
        if: ${{ always() }}
        run: docker rm --force firemud-helm-proof >/dev/null 2>&1 || true

  # Docs and frontend validation
  docs-check:
    name: Validate Documentation
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (github.event_name != 'pull_request' || needs.changes.outputs.docs_changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set Up Python
        uses: ./.github/actions/setup-python
        with:
          requirements: docs

      - name: 🔎 Validate Observability Contracts
        run: python3 dev-tools/observability/validate-observability-contract.py

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: config/openapi/package-lock.json

      - name: 📦 Install documentation dependencies
        run: |
          npm ci --prefix config/openapi

      - name: 🧹 Lint Markdown and links
        run: |
          config/openapi/node_modules/.bin/markdownlint-cli2 --config config/markdownlint/.markdownlint-cli2.jsonc '**/*.md'
          CHECK_EXTERNAL_LINKS=${{ github.event_name == 'pull_request' && '0' || '1' }} bash ./dev-tools/docs/link-check.sh

      - name: 🏗️ Build documentation site
        run: |
          python3 dev-tools/docs/build_pages_site.py
          # Strict mode remains deferred until the legacy anchor-warning backlog is removed.
          python3 -m mkdocs build --clean

  frontend-checks:
    name: Frontend Checks
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (github.event_name != 'pull_request' || needs.changes.outputs.frontend_changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: Set up canonical Python
        uses: ./.github/actions/setup-python

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            web-client/package-lock.json
            config/openapi/package-lock.json

      - name: 💾 Cache OpenAPI Dependencies
        id: cache-openapi
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: config/openapi/node_modules
          key: openapi-node-${{ hashFiles('.node-version', 'config/openapi/package-lock.json') }}

      - name: 📦 Install OpenAPI Dependencies
        if: steps.cache-openapi.outputs.cache-hit != 'true'
        run: npm --prefix config/openapi ci

      - name: 📑 Lint OpenAPI Specs
        run: npm --prefix config/openapi run openapi:lint

      - name: 💾 Cache Web Client Dependencies
        id: cache-web-client
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web-client/node_modules
          key: web-client-node-${{ hashFiles('.node-version', 'web-client/package-lock.json') }}

      - name: 📦 Install Frontend Dependencies
        if: steps.cache-web-client.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web-client

      - name: 🛠 Run Frontend Lint and Format Check
        run: |
          npm run lint
          npm run format -- -c
          npm run test
        working-directory: web-client

      - name: Install pinned Chrome for Testing and ChromeDriver
        env:
          CHROME_FOR_TESTING_VERSION: ${{ steps.workflow-tool-versions.outputs.chrome-for-testing-version }}
          CHROME_FOR_TESTING_SHA256: ${{ steps.workflow-tool-versions.outputs.chrome-for-testing-linux-x86-64-sha256 }}
          CHROMEDRIVER_VERSION: ${{ steps.workflow-tool-versions.outputs.chromedriver-version }}
          CHROMEDRIVER_SHA256: ${{ steps.workflow-tool-versions.outputs.chromedriver-linux-x86-64-sha256 }}
        run: |
          set -euo pipefail
          [[ "$(uname -s)/$(uname -m)" == "Linux/x86_64" ]] || { echo "Unsupported Chrome for Testing platform" >&2; exit 1; }
          [[ "$CHROME_FOR_TESTING_VERSION" == "$CHROMEDRIVER_VERSION" ]] || { echo "Chrome and ChromeDriver versions differ" >&2; exit 1; }
          chrome_archive="${RUNNER_TEMP:?}/chrome-linux64-${CHROME_FOR_TESTING_VERSION}.zip"
          driver_archive="${RUNNER_TEMP:?}/chromedriver-linux64-${CHROMEDRIVER_VERSION}.zip"
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 120 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FOR_TESTING_VERSION}/linux64/chrome-linux64.zip" \
            -o "$chrome_archive"
          echo "${CHROME_FOR_TESTING_SHA256}  ${chrome_archive}" | sha256sum --check --status
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip" \
            -o "$driver_archive"
          echo "${CHROMEDRIVER_SHA256}  ${driver_archive}" | sha256sum --check --status
          chrome_dir="${RUNNER_TEMP}/chrome-for-testing-${CHROME_FOR_TESTING_VERSION}"
          driver_dir="${RUNNER_TEMP}/chromedriver-for-testing-${CHROMEDRIVER_VERSION}"
          mkdir -p "$chrome_dir" "$driver_dir"
          unzip -q "$chrome_archive" -d "$chrome_dir"
          unzip -q "$driver_archive" -d "$driver_dir"
          chrome_path="$chrome_dir/chrome-linux64/chrome"
          chromedriver_path="$driver_dir/chromedriver-linux64/chromedriver"
          chrome_bin_dir="${RUNNER_TEMP}/pinned-chrome-bin"
          mkdir -p "$chrome_bin_dir"
          ln -s "$chrome_path" "$chrome_bin_dir/google-chrome"
          export PATH="$chrome_bin_dir:$PATH"
          echo "$chrome_bin_dir" >> "$GITHUB_PATH"
          {
            echo "CHROMEDRIVER_PATH=$chromedriver_path"
            echo "CHROME_PATH=$chrome_path"
            echo "CHROME_BIN_DIR=$chrome_bin_dir"
          } >> "$GITHUB_ENV"
          [[ "$(command -v google-chrome)" == "$chrome_bin_dir/google-chrome" ]] || { echo "Pinned Chrome wrapper was not selected" >&2; exit 1; }
          [[ "$(google-chrome --product-version)" == "$CHROME_FOR_TESTING_VERSION" ]] || { echo "Pinned Chrome version mismatch" >&2; exit 1; }
          [[ "$("$chromedriver_path" --version | awk '{print $2}')" == "$CHROMEDRIVER_VERSION" ]] || { echo "Pinned ChromeDriver version mismatch" >&2; exit 1; }

      - name: ♿ Run Accessibility Audit
        run: |
          cd web-client
          npm run build
          npx serve dist -l 5000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx wait-on http://localhost:5000/index.html
          [[ "$(command -v google-chrome)" == "$CHROME_BIN_DIR/google-chrome" ]]
          [[ "$("$CHROME_PATH" --product-version)" == "${{ steps.workflow-tool-versions.outputs.chrome-for-testing-version }}" ]]
          npx axe http://localhost:5000/index.html --chromedriver-path "$CHROMEDRIVER_PATH" --chrome-path "$CHROME_PATH" --chrome-options="--no-sandbox" --exit

  # Gradle module validation matrix
  build-and-test:
    name: Build and Test (${{ matrix.module }})
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.affected_modules != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java-version: [21]
        module: ${{ fromJSON(needs.changes.outputs.affected_modules) }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: ⚙️ Set Up Python for Combined Coverage Verification
        if: ${{ matrix.module == 'common-saga' }}
        uses: ./.github/actions/setup-python
        with:
          requirements: none

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Run Game Design retained Game Session association PostgreSQL component proof
        if: ${{ matrix.module == 'game-design-service' }}
        run: |
          ./gradlew :game-design-service:integrationTest \
            --tests integration.net.firedevops.firemud.gamedesign.repository.GameSessionTenantAssociationRepositoryIntegrationTest \
            -PfullCheck --no-build-cache --no-configuration-cache
          bash dev-tools/validation/inspect-test-results.sh \
            --strict \
            --require-suite integration.net.firedevops.firemud.gamedesign.repository.GameSessionTenantAssociationRepositoryIntegrationTest \
            --require-case 'integration.net.firedevops.firemud.gamedesign.repository.GameSessionTenantAssociationRepositoryIntegrationTest#appliesAuditedAssociationForFreshAndRetainedGameSources()' \
            --require-case 'integration.net.firedevops.firemud.gamedesign.repository.GameSessionTenantAssociationRepositoryIntegrationTest#concurrentExactFirstWritersReturnOneImmutableReceipt()' \
            --require-case 'integration.net.firedevops.firemud.gamedesign.repository.GameSessionTenantAssociationRepositoryIntegrationTest#ownerRollbackLeavesNoClaimAndLostAcknowledgementRetryReadsExactReceipt()' \
            --require-case 'integration.net.firedevops.firemud.gamedesign.repository.GameSessionTenantAssociationRepositoryIntegrationTest#databaseRejectsAssociationUpdatesDeletesTruncatesAndContradictorySourceInsert()' \
            game-design-service

      - name: Run Game Session authored-world intake PostgreSQL component proof
        if: ${{ matrix.module == 'game-session-service' }}
        run: |
          ./gradlew :game-session-service:integrationTest \
            --tests integration.net.firedevops.firemud.gamesession.repository.GameSessionAuthoredWorldSourceRepositoryIntegrationTest \
            -PfullCheck --no-build-cache --no-configuration-cache
          bash dev-tools/validation/inspect-test-results.sh \
            --strict \
            --require-suite integration.net.firedevops.firemud.gamesession.repository.GameSessionAuthoredWorldSourceRepositoryIntegrationTest \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionAuthoredWorldSourceRepositoryIntegrationTest#registersAdditionalWorldsAndReplaysExactReceiptWithoutMutation()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionAuthoredWorldSourceRepositoryIntegrationTest#requiresOwnerTransactionRollsBackClaimsAndReadsOnlyCommittedRows()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionAuthoredWorldSourceRepositoryIntegrationTest#concurrentExactIntakeRetriesReturnOneReceiptAndSlugRaceHasOneWinner()' \
            game-session-service

      - name: Run Game Session retained tenant snapshot and association PostgreSQL component proof
        if: ${{ matrix.module == 'game-session-service' }}
        run: |
          ./gradlew :game-session-service:integrationTest \
            --tests integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantSnapshotRepositoryIntegrationTest \
            --tests integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest \
            -PfullCheck --no-build-cache --no-configuration-cache
          bash dev-tools/validation/inspect-test-results.sh \
            --strict \
            --require-suite integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantSnapshotRepositoryIntegrationTest \
            --require-suite integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantSnapshotRepositoryIntegrationTest#capturesExactOrderedTenantProjectionAndStableDigestUnderReadCommittedOwnerTransaction()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantSnapshotRepositoryIntegrationTest#capturesRawAndCanonicalOwnersAndBindsCanonicalOwnerChangesToSnapshotDigest()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantSnapshotRepositoryIntegrationTest#captureUsesNowaitToRejectAnExistingWriterThenSucceedsAfterRollback()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantSnapshotRepositoryIntegrationTest#shareFenceBlocksConcurrentInsertUpdateDeleteAcrossEverySourceFamilyAndReleasesAfterCommitOrRollback()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest#exactRetryReturnsHistoricalReceiptWithoutRecapturingChangedSource()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest#lostAcknowledgementExactRetryReturnsSameOriginalOperationAndBytesWithoutMutation()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest#rollbackLeavesNoAssociationClaimAndNewAttemptSucceeds()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest#concurrentExactFirstWritersReturnSameImmutableReceipt()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest#retainedKeyLookupReturnsHistoricalUuidOnlyForExactNamespaceAndKey()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest#retainedKeyLookupRejectsMalformedAndContradictoryPersistedRows()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest#serviceReturnsExactCommittedAssociationAfterOwnerTransaction()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest#serviceRecoversPostCommitReadFailureWithoutRewritingHistoricalAssociation()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest#syntheticDemoFixtureRegistersSnapshotAndResolvesItsDeclaredCanonicalTenant()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest#syntheticDemoFixtureReusesHistoricalReceiptAfterMutableSourceChanges()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest#syntheticDemoFixtureDoesNotInventUnknownOrContradictoryTenantMappings()' \
            --require-case 'integration.net.firedevops.firemud.gamesession.repository.GameSessionRetainedTenantAssociationRepositoryIntegrationTest#syntheticDefaultPointerTargetsRemainValidAcrossRepeatedFixtureBaselines()' \
            game-session-service

      - name: Upload Game Session retained tenant UUID PostgreSQL proof results
        if: ${{ always() && matrix.module == 'game-session-service' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: game-session-retained-tenant-uuid-postgresql-proof-${{ github.sha }}
          path: services/game-session-service/build/test-results/integrationTest/TEST-*GameSessionRetainedTenantAssociationRepositoryIntegrationTest.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Run Account issuer readback and acknowledgment socket mTLS component proof
        if: ${{ matrix.module == 'game-session-service' }}
        run: |
          ./gradlew :game-session-service:crossServiceTest \
            --tests crossservice.net.firedevops.firemud.gamesession.AccountIssuerAuthorityGrpcMtlsCrossServiceTest \
            -PfullCheck --no-build-cache --no-configuration-cache
          bash dev-tools/validation/inspect-test-results.sh \
            --strict \
            --require-suite crossservice.net.firedevops.firemud.gamesession.AccountIssuerAuthorityGrpcMtlsCrossServiceTest \
            --require-case 'crossservice.net.firedevops.firemud.gamesession.AccountIssuerAuthorityGrpcMtlsCrossServiceTest#exactWorkloadIdentitiesCarryCurrentAndHistoricalReadbacksOverSocketMtls()' \
            --require-case 'crossservice.net.firedevops.firemud.gamesession.AccountIssuerAuthorityGrpcMtlsCrossServiceTest#exactWorkloadIdentitiesCarryZeroAndPositiveCaptureReceiptsOverSocketMtls()' \
            --require-case 'crossservice.net.firedevops.firemud.gamesession.AccountIssuerAuthorityGrpcMtlsCrossServiceTest#exactGameSessionPeerCarriesTheClosedInstallationAcknowledgmentOverSocketMtls()' \
            --require-case 'crossservice.net.firedevops.firemud.gamesession.AccountIssuerAuthorityGrpcMtlsCrossServiceTest#acknowledgment caller "wrong-service"' \
            --require-case 'crossservice.net.firedevops.firemud.gamesession.AccountIssuerAuthorityGrpcMtlsCrossServiceTest#acknowledgment caller "wrong-namespace"' \
            --require-case 'crossservice.net.firedevops.firemud.gamesession.AccountIssuerAuthorityGrpcMtlsCrossServiceTest#capture caller "wrong-service"' \
