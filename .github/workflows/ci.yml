name: CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Wrapper
        run: gradle wrapper --gradle-version 8.5 --distribution-type bin
      - name: Build and Test
        run: ./gradlew build
