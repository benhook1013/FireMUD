  frontend-checks:
    name: Frontend Checks
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (github.event_name != 'pull_request' || needs.changes.outputs.frontend_changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: Set up canonical Python
        uses: ./.github/actions/setup-python

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            web-client/package-lock.json
            config/openapi/package-lock.json

      - name: 💾 Cache OpenAPI Dependencies
        id: cache-openapi
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: config/openapi/node_modules
          key: openapi-node-${{ hashFiles('.node-version', 'config/openapi/package-lock.json') }}

      - name: 📦 Install OpenAPI Dependencies
        if: steps.cache-openapi.outputs.cache-hit != 'true'
        run: npm --prefix config/openapi ci

      - name: 📑 Lint OpenAPI Specs
        run: npm --prefix config/openapi run openapi:lint

      - name: 💾 Cache Web Client Dependencies
        id: cache-web-client
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web-client/node_modules
          key: web-client-node-${{ hashFiles('.node-version', 'web-client/package-lock.json') }}

      - name: 📦 Install Frontend Dependencies
        if: steps.cache-web-client.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web-client

      - name: 🛠 Run Frontend Lint and Format Check
        run: |
          npm run lint
          npm run format -- -c
        working-directory: web-client

      - name: Install pinned Chrome for Testing and ChromeDriver
        env:
          CHROME_FOR_TESTING_VERSION: ${{ steps.workflow-tool-versions.outputs.chrome-for-testing-version }}
          CHROME_FOR_TESTING_SHA256: ${{ steps.workflow-tool-versions.outputs.chrome-for-testing-linux-x86-64-sha256 }}
          CHROMEDRIVER_VERSION: ${{ steps.workflow-tool-versions.outputs.chromedriver-version }}
          CHROMEDRIVER_SHA256: ${{ steps.workflow-tool-versions.outputs.chromedriver-linux-x86-64-sha256 }}
        run: |
          set -euo pipefail
          [[ "$(uname -s)/$(uname -m)" == "Linux/x86_64" ]] || { echo "Unsupported Chrome for Testing platform" >&2; exit 1; }
          [[ "$CHROME_FOR_TESTING_VERSION" == "$CHROMEDRIVER_VERSION" ]] || { echo "Chrome and ChromeDriver versions differ" >&2; exit 1; }
          chrome_archive="${RUNNER_TEMP:?}/chrome-linux64-${CHROME_FOR_TESTING_VERSION}.zip"
          driver_archive="${RUNNER_TEMP:?}/chromedriver-linux64-${CHROMEDRIVER_VERSION}.zip"
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 120 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FOR_TESTING_VERSION}/linux64/chrome-linux64.zip" \
            -o "$chrome_archive"
          echo "${CHROME_FOR_TESTING_SHA256}  ${chrome_archive}" | sha256sum --check --status
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip" \
            -o "$driver_archive"
          echo "${CHROMEDRIVER_SHA256}  ${driver_archive}" | sha256sum --check --status
          chrome_dir="${RUNNER_TEMP}/chrome-for-testing-${CHROME_FOR_TESTING_VERSION}"
          driver_dir="${RUNNER_TEMP}/chromedriver-for-testing-${CHROMEDRIVER_VERSION}"
          mkdir -p "$chrome_dir" "$driver_dir"
          unzip -q "$chrome_archive" -d "$chrome_dir"
          unzip -q "$driver_archive" -d "$driver_dir"
          chrome_path="$chrome_dir/chrome-linux64/chrome"
          chromedriver_path="$driver_dir/chromedriver-linux64/chromedriver"
          chrome_bin_dir="${RUNNER_TEMP}/pinned-chrome-bin"
          mkdir -p "$chrome_bin_dir"
          ln -s "$chrome_path" "$chrome_bin_dir/google-chrome"
          export PATH="$chrome_bin_dir:$PATH"
          echo "$chrome_bin_dir" >> "$GITHUB_PATH"
          {
            echo "CHROMEDRIVER_PATH=$chromedriver_path"
            echo "CHROME_PATH=$chrome_path"
            echo "CHROME_BIN_DIR=$chrome_bin_dir"
          } >> "$GITHUB_ENV"
          [[ "$(command -v google-chrome)" == "$chrome_bin_dir/google-chrome" ]] || { echo "Pinned Chrome wrapper was not selected" >&2; exit 1; }
          [[ "$(google-chrome --product-version)" == "$CHROME_FOR_TESTING_VERSION" ]] || { echo "Pinned Chrome version mismatch" >&2; exit 1; }
          [[ "$("$chromedriver_path" --version | awk '{print $2}')" == "$CHROMEDRIVER_VERSION" ]] || { echo "Pinned ChromeDriver version mismatch" >&2; exit 1; }

      - name: ♿ Run Accessibility Audit
        run: |
          cd web-client
          npm run build
          npx serve dist -l 5000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx wait-on http://localhost:5000/index.html
          [[ "$(command -v google-chrome)" == "$CHROME_BIN_DIR/google-chrome" ]]
          [[ "$("$CHROME_PATH" --product-version)" == "${{ steps.workflow-tool-versions.outputs.chrome-for-testing-version }}" ]]
          npx axe http://localhost:5000/index.html --chromedriver-path "$CHROMEDRIVER_PATH" --chrome-path "$CHROME_PATH" --chrome-options="--no-sandbox" --exit

  # Gradle module validation matrix
  build-and-test:
    name: Build and Test (${{ matrix.module }})
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.affected_modules != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Account needs 40 minutes for full checks; World, Game Session and Game Design retain 30 minutes including post-job cleanup.
    timeout-minutes: ${{ matrix.module == 'account-service' && 40 || (matrix.module == 'world-management-service' || matrix.module == 'game-session-service' || matrix.module == 'game-design-service') && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        java-version: [21]
        module: ${{ fromJSON(needs.changes.outputs.affected_modules) }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: ⚙️ Set Up Python for Combined Coverage Verification
        if: ${{ matrix.module == 'common-saga' }}
        uses: ./.github/actions/setup-python
        with:
          requirements: none

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      # Cached negative Spring Boot 4.1.1 resolution requires metadata revalidation (CI 37847761035).
      - name: 🧪 Run Gradle Checks
        id: checks
        run: |
          echo "::group::Run Module Validation"
          bash ./.github/scripts/run-gradle-module-checks.sh '${{ matrix.module }}'
          echo "::endgroup::"

      - name: 📦 Build Runtime JAR
        if: ${{ contains(fromJSON(needs.changes.outputs.bootable_modules), matrix.module) }}
        run: ./gradlew --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2500m -Dfile.encoding=UTF-8' :${{ matrix.module }}:bootJar -PfullCheck

      - name: 📈 Parse Coverage %
        id: coverage
        env:
          MODULE_DIR: ${{ matrix.module == 'load-testing' && 'dev-tools/load-testing' || format('services/{0}', matrix.module) }}
        run: |
          COVERAGE_FILE="$MODULE_DIR/build/reports/jacoco/test/jacocoTestReport.xml"
          if [ -f "$COVERAGE_FILE" ]; then
            COVERAGE_LINE=$(grep -A 1 "<counter type=\"LINE\"" "$COVERAGE_FILE" | tail -n 1 || true)
            MISSED=$(echo "$COVERAGE_LINE" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p')
            COVERED=$(echo "$COVERAGE_LINE" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p')
            TOTAL=$((MISSED + COVERED))
            if [ "$TOTAL" -gt 0 ]; then
              PERCENT=$((100 * COVERED / TOTAL))
            else
              PERCENT=0
            fi
          else
            echo "Coverage file not found" >&2
            PERCENT=0
          fi
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"

      - name: 🔎 Verify Combined Unit and Integration Coverage
        if: ${{ matrix.module == 'common-saga' }}
        run: |
          python3 dev-tools/validation/validate-jacoco-combined-report.py \
            --report services/common-saga/build/reports/jacoco/test/jacocoTestReport.xml \
            --require-covered-class net/firedevops/firemud/common/saga/SagaRunner \
            --require-covered-class net/firedevops/firemud/common/saga/persistence/SagaInstanceRepository \
            --require-covered-method net/firedevops/firemud/common/saga/persistence/SagaInstanceRepository#findAll

      - name: 📤 Upload Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-${{ matrix.module }}-report-${{ github.sha }}
          path: ${{ matrix.module == 'load-testing' && 'dev-tools/load-testing/build/reports/jacoco/test/' || format('services/{0}/build/reports/jacoco/test/', matrix.module) }}

      - name: ☂️ Upload Coverage to Codecov
        continue-on-error: true
        # Optional coverage upload must leave time for required proof artifacts.
        timeout-minutes: 2
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          handle_no_reports_found: true
          disable_search: true
          files: ${{ matrix.module == 'load-testing' && 'dev-tools/load-testing/build/reports/jacoco/test/jacocoTestReport.xml' || format('services/{0}/build/reports/jacoco/test/jacocoTestReport.xml', matrix.module) }}
          flags: ${{ matrix.module }}
          name: ${{ matrix.module }}-jacoco
          verbose: true

      - name: 📤 Upload Test Logs if Failed
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-logs-${{ matrix.module }}-${{ github.sha }}
          path: ${{ matrix.module == 'load-testing' && 'dev-tools/load-testing/build/reports/tests/' || format('services/{0}/build/reports/tests/', matrix.module) }}

      - name: 📤 Upload JUnit Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: junit-${{ matrix.module }}-results-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ matrix.module == 'load-testing' && 'dev-tools/load-testing/build/test-results/**/*.xml' || format('services/{0}/build/test-results/**/*.xml', matrix.module) }}
          if-no-files-found: warn
          retention-days: 14

  # Final gating and PR reporting
  validation-gate:
    name: Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      checks: read # Preserve a prior successful required context on metadata-only edits.
      contents: read # Check out the shared required-gate composite action.
      actions: read # Inspect the matching required-gate job's preservation step.
      statuses: write # Publish acknowledged supplementary metadata gate barriers.
      pull-requests: read # Re-read the current PR tuple before status publication.
    needs: [changes, postgres-runtime-upgrade-proof, buf-check, docker-lint, shellcheck, python-script-validation, dev-tool-contract-checks, dev-tools-readme-contract, yaml-lint, metrics-cardinality-check, flyway-migration-sanity-checks, grpc-transport-config-sanity-checks, workflow-lint, helm-lint, helm-render-validation, helm-transaction-proof, docs-check, frontend-checks, build-and-test]
    if: ${{ always() }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out required-gate action
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Preserve successful required gate on metadata-only edit
        id: preserved_gate
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: ./.github/actions/preserve-required-gate
        with:
          gate-name: Validation Gate
          workflow-name: CI — Validation
          workflow-file: ci.yml
          workflow-path: .github/workflows/ci.yml

      - name: Publish pending required gate status
        id: publish-pending-status
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: ./.github/actions/publish-required-gate-status
        with:
          assessment: ${{ steps.preserved_gate.outputs.assessment }}
          gate-name: Validation Gate
          workflow-name: CI — Validation
          workflow-file: ci.yml
          workflow-path: .github/workflows/ci.yml

      - name: Report dependency-deferred required gate
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        env:
          PUBLISHER_OUTCOME: ${{ steps.publish-pending-status.outcome }}
          ASSESSMENT: ${{ steps.preserved_gate.outputs.assessment }}
          PUBLICATION: ${{ steps.publish-pending-status.outputs.publication }}
        run: |
          case "$PUBLISHER_OUTCOME/$ASSESSMENT/$PUBLICATION" in
            success/dependency-deferred/pending-acknowledged|success/success/unchanged|success/success/success-acknowledged|success/success/pending-acknowledged)
              ;;
            *)
              echo "Required-gate assessment or status acknowledgment is unavailable; dependency-deferred failure." >&2
              exit 1
              ;;
          esac

      - name: Enforce validation success
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
        env:
          DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend_changed }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python_changed }}
          DESIGN_DOCS_CHANGED: ${{ needs.changes.outputs.design_docs_changed }}
          VALIDATION_PYTHON_CHANGED: ${{ needs.changes.outputs.validation_python_changed }}
          POSTGRES_RUNTIME_PROOF_CHANGED: ${{ needs.changes.outputs.postgres_runtime_proof_changed }}
          POSTGRES_RUNTIME_UPGRADE_PROOF: ${{ needs.postgres-runtime-upgrade-proof.result }}
          LIGHTWEIGHT_ONLY: ${{ needs.changes.outputs.lightweight_only }}
          AFFECTED_MODULES: ${{ needs.changes.outputs.affected_modules }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUF_CHECK: ${{ needs.buf-check.result }}
          DOCKER_LINT: ${{ needs.docker-lint.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          PYTHON_SCRIPT_VALIDATION: ${{ needs.python-script-validation.result }}
          DEV_TOOL_CONTRACT_CHECKS: ${{ needs.dev-tool-contract-checks.result }}
          DEV_TOOLS_README_CONTRACT: ${{ needs.dev-tools-readme-contract.result }}
          YAML_LINT: ${{ needs.yaml-lint.result }}
          METRICS_CARDINALITY_CHECK: ${{ needs.metrics-cardinality-check.result }}
          FLYWAY_MIGRATION_SANITY_CHECKS: ${{ needs.flyway-migration-sanity-checks.result }}
          GRPC_TRANSPORT_CONFIG_SANITY_CHECKS: ${{ needs.grpc-transport-config-sanity-checks.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          HELM_LINT: ${{ needs.helm-lint.result }}
          HELM_RENDER_VALIDATION: ${{ needs.helm-render-validation.result }}
          HELM_TRANSACTION_PROOF: ${{ needs.helm-transaction-proof.result }}
          DOCS_CHECK: ${{ needs.docs-check.result }}
          FRONTEND_CHECKS: ${{ needs.frontend-checks.result }}
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
        run: |
          is_acceptable_optional_result() {
            local result="$1"
            [ "$result" = "success" ] || [ "$result" = "skipped" ]
          }

          failed=0

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection did not succeed: $CHANGES_RESULT" >&2
            failed=1
          fi

          echo "PostgreSQL Runtime Upgrade Proof => $POSTGRES_RUNTIME_UPGRADE_PROOF (changed=$POSTGRES_RUNTIME_PROOF_CHANGED)"
          if [ "$POSTGRES_RUNTIME_PROOF_CHANGED" = "true" ]; then
            if [ "$POSTGRES_RUNTIME_UPGRADE_PROOF" != "success" ]; then
              failed=1
            fi
          elif [ "$POSTGRES_RUNTIME_UPGRADE_PROOF" != "success" ] && [ "$POSTGRES_RUNTIME_UPGRADE_PROOF" != "skipped" ]; then
            failed=1
          fi

          for check in \
            "Buf Generation:$BUF_CHECK" \
            "Dockerfile Lint:$DOCKER_LINT" \
            "ShellCheck:$SHELLCHECK" \
            "YAML Lint:$YAML_LINT" \
            "Metrics Cardinality Policy Check:$METRICS_CARDINALITY_CHECK" \
            "Flyway Migration Sanity Checks:$FLYWAY_MIGRATION_SANITY_CHECKS" \
            "gRPC Transport Configuration Sanity Checks:$GRPC_TRANSPORT_CONFIG_SANITY_CHECKS" \
            "GitHub Workflow Lint:$WORKFLOW_LINT" \
            "Helm Chart Lint:$HELM_LINT" \
            "Helm Render Validation:$HELM_RENDER_VALIDATION" \
            "Helm Transaction Proof:$HELM_TRANSACTION_PROOF"
          do
            name="${check%%:*}"
            result="${check#*:}"
            echo "$name => $result"
            if [ "$LIGHTWEIGHT_ONLY" = "true" ]; then
              if ! is_acceptable_optional_result "$result"; then
                failed=1
              fi
            else
              if [ "$result" != "success" ]; then
                failed=1
              fi
            fi
          done

          echo "Python Script Validation => $PYTHON_SCRIPT_VALIDATION"
          if [ "$LIGHTWEIGHT_ONLY" != "true" ] || [ "$PYTHON_CHANGED" = "true" ]; then
            if [ "$PYTHON_SCRIPT_VALIDATION" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$PYTHON_SCRIPT_VALIDATION"; then
              failed=1
            fi
          fi

          echo "Dev Tool Contract Checks => $DEV_TOOL_CONTRACT_CHECKS"
          if [ "$LIGHTWEIGHT_ONLY" != "true" ] || [ "$DESIGN_DOCS_CHANGED" = "true" ] || [ "$VALIDATION_PYTHON_CHANGED" = "true" ]; then
            if [ "$DEV_TOOL_CONTRACT_CHECKS" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$DEV_TOOL_CONTRACT_CHECKS"; then
              failed=1
            fi
          fi

          echo "Dev Tools README Contract => $DEV_TOOLS_README_CONTRACT"
          if [ "$LIGHTWEIGHT_ONLY" = "true" ] || [ "$DEV_TOOLS_README_CONTRACT" != "skipped" ]; then
            if [ "$DEV_TOOLS_README_CONTRACT" != "success" ]; then
              failed=1
            fi
          fi

          echo "Validate Documentation => $DOCS_CHECK"
          if [ "$DOCS_CHANGED" = "true" ]; then
            if [ "$DOCS_CHECK" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$DOCS_CHECK"; then
              failed=1
            fi
          fi

          echo "Frontend Checks => $FRONTEND_CHECKS"
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            if [ "$FRONTEND_CHECKS" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$FRONTEND_CHECKS"; then
              failed=1
            fi
          fi

          echo "Build and Test Matrix => $BUILD_AND_TEST"
          if [ "$AFFECTED_MODULES" != "[]" ]; then
            if [ "$BUILD_AND_TEST" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$BUILD_AND_TEST"; then
              failed=1
            fi
          fi

          if [ "$failed" -ne 0 ]; then
            echo "Validation Gate failed because one or more required validation jobs did not succeed." >&2
            exit 1
          fi
