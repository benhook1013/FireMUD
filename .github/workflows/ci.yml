name: CI — Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      flyway_base_sha:
        description: Full immutable commit SHA of the receiving parent to compare Flyway history against
        required: true
        type: string

run-name: CI — Validation ${{ github.event_name == 'pull_request' && format('pr-{0} base-{1} head-{2}', github.event.pull_request.number, github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && format('metadata-{0}', github.run_id) || 'required' }}
  cancel-in-progress: true

jobs:
  # Change detection and shared inputs
  changes:
    name: Detect CI-Relevant Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Classify the complete pull-request file list.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
    outputs:
      run_all: ${{ steps.compute.outputs.run_all }}
      affected_services: ${{ steps.compute.outputs.affected_services }}
      affected_modules: ${{ steps.compute.outputs.affected_modules }}
      module_check_matrix: ${{ steps.compute.outputs.module_check_matrix }}
      bootable_modules: ${{ steps.compute.outputs.bootable_modules }}
      docs_changed: ${{ steps.compute.outputs.docs_changed }}
      frontend_changed: ${{ steps.compute.outputs.frontend_changed }}
      python_changed: ${{ steps.compute.outputs.python_changed }}
      design_docs_changed: ${{ steps.compute.outputs.design_docs_changed }}
      validation_python_changed: ${{ steps.compute.outputs.validation_python_changed }}
      postgres_runtime_proof_changed: ${{ steps.compute.outputs.postgres_runtime_proof_changed }}
      lightweight_only: ${{ steps.compute.outputs.lightweight_only }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out change classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Compute affected jobs
        id: compute
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("node:fs");
            const classifierPath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/classify-change-scope.cjs`;
            const completeModules = [
              "common-data-runtime",
              "common-platform-core",
              "common-saga",
              "common-temporal",
              "common-security",
              "common-test-support",
              "common-web-support",
              "account-service",
              "automation-scripting-service",
              "entity-management-service",
              "game-design-service",
              "game-logic-service",
              "game-session-service",
              "logging-admin-service",
              "social-groups-service",
              "spring-cloud-gateway",
              "tcp-proxy-service",
              "world-management-service",
              "hosted-environment-identity-controller",
              "load-testing",
            ];
            const completeBootableModules = [
              "account-service",
              "automation-scripting-service",
              "entity-management-service",
              "game-design-service",
              "game-logic-service",
              "game-session-service",
              "logging-admin-service",
              "social-groups-service",
              "spring-cloud-gateway",
              "tcp-proxy-service",
              "world-management-service",
              "hosted-environment-identity-controller",
            ];
            let outputs;
            if (fs.existsSync(classifierPath)) {
              const { classifyGithubChangeScope } = require(classifierPath);
              const scope = await classifyGithubChangeScope(github, context);
              const moduleScopeAvailable =
                Array.isArray(scope.affectedModules) && Array.isArray(scope.bootableModules);
              outputs = {
                run_all: scope.runAll || !moduleScopeAvailable,
                affected_services: scope.affectedServices,
                affected_modules: moduleScopeAvailable ? scope.affectedModules : completeModules,
                bootable_modules: moduleScopeAvailable ? scope.bootableModules : completeBootableModules,
                docs_changed: scope.docsChanged,
                frontend_changed: scope.frontendChanged,
                python_changed: scope.pythonChanged,
                design_docs_changed: scope.designDocsChanged,
                validation_python_changed: scope.validationPythonChanged,
                postgres_runtime_proof_changed:
                  scope.postgresRuntimeProofChanged === undefined ? true : scope.postgresRuntimeProofChanged,
                lightweight_only: scope.lightweightOnly,
              };
            } else {
              core.warning("Base revision predates the change classifier; using complete validation scope.");
              outputs = {
                run_all: true,
                affected_services: [
                  "account-service",
                  "automation-scripting-service",
                  "entity-management-service",
                  "game-design-service",
                  "game-logic-service",
                  "game-session-service",
                  "logging-admin-service",
                  "social-groups-service",
                  "spring-cloud-gateway",
                  "tcp-proxy-service",
                  "world-management-service",
                ],
                affected_modules: completeModules,
                bootable_modules: completeBootableModules,
                docs_changed: true,
                frontend_changed: true,
                python_changed: true,
                design_docs_changed: true,
                validation_python_changed: true,
                postgres_runtime_proof_changed: true,
                lightweight_only: false,
              };
            }
            const partitionedSlowServices = new Set(["account-service", "game-session-service"]);
            outputs.module_check_matrix = outputs.affected_modules.flatMap((module) =>
              partitionedSlowServices.has(module)
                ? [
                    { module, partition: "1", "java-version": 21 },
                    { module, partition: "2", "java-version": 21 },
                  ]
                : [{ module, partition: "full", "java-version": 21 }]
            );
            for (const [name, value] of Object.entries(outputs)) {
              core.setOutput(
                name,
                Array.isArray(value) ? JSON.stringify(value) : String(value)
              );
            }

  postgres-runtime-upgrade-proof:
    name: PostgreSQL Runtime Upgrade Proof
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.postgres_runtime_proof_changed == 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out validation candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up canonical Python dependencies
        uses: ./.github/actions/setup-python
        with:
          requirements: yaml

      - name: Prove PostgreSQL 16 to 18 logical restore on isolated Docker volumes
        env:
          FIREMUD_POSTGRES_RUNTIME_DOCKER_PROOF: required
        run: bash ./dev-tools/tests/postgres-runtime-upgrade-contract.sh

  # Static generation, lint, and policy checks
  buf-check:
    name: Buf Generation
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: 🧰 Install Buf CLI
        id: install-buf
        env:
          BUF_VERSION: ${{ steps.workflow-tool-versions.outputs.buf-version }}
          BUF_SHA256: ${{ steps.workflow-tool-versions.outputs.buf-linux-x86-64-sha256 }}
        run: |
          [[ "$(uname -s)/$(uname -m)" == "Linux/x86_64" ]] || { echo "Unsupported Buf platform" >&2; exit 1; }
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" \
            -o /tmp/buf
          echo "${BUF_SHA256}  /tmp/buf" | sha256sum --check --status
          sudo install -m 0755 /tmp/buf /usr/local/bin/buf
          buf --version

      - name: 💾 Cache Buf modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/buf
          key: buf-mod-${{ runner.os }}-${{ hashFiles('protos/buf.yaml', 'protos/**/*.proto', 'config/protobuf/buf.gen.yaml', 'config/protobuf/buf.work.yaml') }}
          restore-keys: buf-mod-${{ runner.os }}-

      - name: ⚙️ Generate Protobufs
        working-directory: protos
        env:
          BUF_WORKSPACE_CONFIG: ../config/protobuf/buf.work.yaml
        run: buf generate --template ../config/protobuf/buf.gen.yaml

      - name: Set up Java for remote generator compatibility proof
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle for remote generator compatibility proof
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Compile the actual Buf-generated Java sources
        run: |
          test -n "$(find protos/gen/java -name '*.java' -print -quit)"
          ./gradlew compileBufGeneratedJava

  docker-lint:
    name: Dockerfile Lint
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐳 Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
          config: config/hadolint/hadolint.yaml

  shellcheck:
    name: ShellCheck
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: 📦 Install ShellCheck
        env:
          SHELLCHECK_VERSION: ${{ steps.workflow-tool-versions.outputs.shellcheck-version }}
          SHELLCHECK_SHA256: ${{ steps.workflow-tool-versions.outputs.shellcheck-linux-x86-64-sha256 }}
        run: |
          set -euo pipefail
          [[ "$(uname -s)/$(uname -m)" == "Linux/x86_64" ]] || { echo "Unsupported ShellCheck platform" >&2; exit 1; }
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${SHELLCHECK_SHA256}  /tmp/${archive}" | sha256sum --check --status
          extract_dir="${RUNNER_TEMP:?}/shellcheck"
          mkdir -p "$extract_dir"
          tar -xJf "/tmp/${archive}" -C "$extract_dir"
          sudo install -m 0755 "$extract_dir/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: 🐚 Lint tracked shell scripts
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          if [ "${#shell_files[@]}" -eq 0 ]; then
            echo "No tracked shell scripts found."
            exit 0
          fi
          shellcheck "${shell_files[@]}"

  python-script-validation:
    name: Python Script Validation
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (needs.changes.outputs.lightweight_only != 'true' || needs.changes.outputs.python_changed == 'true') }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set Up Python
        uses: ./.github/actions/setup-python
        with:
          requirements: ci

      - name: 🧪 Validate tracked Python scripts
        run: |
          mapfile -t python_files < <(git ls-files '*.py')
          if [ "${#python_files[@]}" -eq 0 ]; then
            echo "No tracked Python scripts found."
            exit 0
          fi
          python3 -m py_compile "${python_files[@]}"
          ruff check --force-exclude "${python_files[@]}"

  dev-tool-contract-checks:
    name: Dev Tool Contract Checks
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (needs.changes.outputs.lightweight_only != 'true' || needs.changes.outputs.design_docs_changed == 'true' || needs.changes.outputs.validation_python_changed == 'true') }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load workflow tool versions
        id: workflow-tool-versions
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/load-workflow-tool-versions

      - name: 🧰 Set up kubectl
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-kubectl

      - name: Set up canonical GitHub CLI
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-gh

      - name: 🐍 Set Up Python
        uses: ./.github/actions/setup-python
        with:
          requirements: ${{ (needs.changes.outputs.lightweight_only == 'true' && needs.changes.outputs.design_docs_changed == 'true' && needs.changes.outputs.validation_python_changed != 'true') && 'yaml' || 'ci' }}

      - name: Set up Node for Python Markdown contracts
        if: ${{ needs.changes.outputs.lightweight_only != 'true' || needs.changes.outputs.validation_python_changed == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: config/openapi/package-lock.json

      - name: Install pinned Markdown contract dependencies
        if: ${{ needs.changes.outputs.lightweight_only != 'true' || needs.changes.outputs.validation_python_changed == 'true' }}
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix config/openapi

      - name: 📦 Install cloc
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        env:
          CLOC_VERSION: ${{ steps.workflow-tool-versions.outputs.cloc-version }}
          CLOC_SHA256: ${{ steps.workflow-tool-versions.outputs.cloc-source-sha256 }}
        run: |
          set -euo pipefail
          archive="cloc-${CLOC_VERSION}.pl"
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/AlDanial/cloc/releases/download/v${CLOC_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${CLOC_SHA256}  /tmp/${archive}" | sha256sum --check --status
          sudo install -m 0755 "/tmp/${archive}" /usr/local/bin/cloc
          cloc --version

      - name: Set up Helm
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-helm

      - name: 🧪 Validate dev tool contracts
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: |
          set -x
          TIMEFORMAT='bash ./dev-tools/tests/cloc-report-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/cloc-report-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/ci-lightweight-scope-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/ci-lightweight-scope-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/gradle-dependency-recovery-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/gradle-dependency-recovery-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/workflow-version-authority-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/workflow-version-authority-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/workflow-tool-updater-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/workflow-tool-updater-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/publisher-checksum-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/publisher-checksum-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/jacoco-combined-report-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/jacoco-combined-report-contract.sh
          TIMEFORMAT="python3 -m unittest discover -s dev-tools/tests -p 'test_slow_service_ci_partition.py': real=%3R user=%3U sys=%3S"
          time python3 -m unittest discover -s dev-tools/tests -p 'test_slow_service_ci_partition.py'
          TIMEFORMAT='bash ./dev-tools/tests/gradle-proof-tooling-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/gradle-proof-tooling-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/testcontainers-disabled-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/testcontainers-disabled-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/pr-retarget-workflow-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/pr-retarget-workflow-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/static-analysis-summary-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/static-analysis-summary-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/ci-validation-summary-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/ci-validation-summary-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/security-summary-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/security-summary-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/pr-runtime-image-publication-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/pr-runtime-image-publication-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/runtime-base-image-apt-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/runtime-base-image-apt-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/pr-required-gate-context-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/pr-required-gate-context-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/dev-demo-workflow-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/dev-demo-workflow-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/erd-workflow-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/erd-workflow-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/smoke-transport-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/smoke-transport-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/reset-service-db-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/reset-service-db-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/preview-eligibility-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/preview-eligibility-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/preview-priority-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/preview-priority-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/gameplay-bridge-network-policy-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/gameplay-bridge-network-policy-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/hosted-gateway-bridge-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/hosted-gateway-bridge-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/postgres-runtime-upgrade-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/postgres-runtime-upgrade-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/preview-runner-isolation-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/preview-runner-isolation-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/preview-standalone-transport-certificates-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/preview-standalone-transport-certificates-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/preview-ca-recovery-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/preview-ca-recovery-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/trust-bootstrap-rbac-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/trust-bootstrap-rbac-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/trust-bootstrap-issuance-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/trust-bootstrap-issuance-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/trust-bootstrap-live-proof-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/trust-bootstrap-live-proof-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/trust-bootstrap-provision-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/trust-bootstrap-provision-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/account-jwt-bootstrap-fixture-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/account-jwt-bootstrap-fixture-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/game-session-factory-qualification-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/game-session-factory-qualification-contract.sh
          TIMEFORMAT='preview-cleanup-proof-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/preview-cleanup-proof-contract.sh
          TIMEFORMAT='bash ./dev-tools/tests/hosted-identity-controller-manifest-contract.sh: real=%3R user=%3U sys=%3S'
          time bash ./dev-tools/tests/hosted-identity-controller-manifest-contract.sh
