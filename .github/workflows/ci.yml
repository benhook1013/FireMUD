name: CI — Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required' }}
  cancel-in-progress: true

jobs:
  # Change detection and shared inputs
  changes:
    name: Detect CI-Relevant Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Classify the complete pull-request file list.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
    outputs:
      run_all: ${{ steps.compute.outputs.run_all }}
      affected_services: ${{ steps.compute.outputs.affected_services }}
      docs_changed: ${{ steps.compute.outputs.docs_changed }}
      frontend_changed: ${{ steps.compute.outputs.frontend_changed }}
      python_changed: ${{ steps.compute.outputs.python_changed }}
      design_docs_changed: ${{ steps.compute.outputs.design_docs_changed }}
      validation_python_changed: ${{ steps.compute.outputs.validation_python_changed }}
      lightweight_only: ${{ steps.compute.outputs.lightweight_only }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Check out change classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Compute affected jobs
        id: compute
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("node:fs");
            const classifierPath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/classify-change-scope.cjs`;
            let outputs;
            if (fs.existsSync(classifierPath)) {
              const { classifyGithubChangeScope } = require(classifierPath);
              const scope = await classifyGithubChangeScope(github, context);
              outputs = {
                run_all: scope.runAll,
                affected_services: scope.affectedServices,
                docs_changed: scope.docsChanged,
                frontend_changed: scope.frontendChanged,
                python_changed: scope.pythonChanged,
                design_docs_changed: scope.designDocsChanged,
                validation_python_changed: scope.validationPythonChanged,
                lightweight_only: scope.lightweightOnly,
              };
            } else {
              core.warning("Base revision predates the change classifier; using complete validation scope.");
              outputs = {
                run_all: true,
                affected_services: [
                  "account-service",
                  "automation-scripting-service",
                  "entity-management-service",
                  "game-design-service",
                  "game-logic-service",
                  "game-session-service",
                  "logging-admin-service",
                  "social-groups-service",
                  "spring-cloud-gateway",
                  "tcp-proxy-service",
                  "world-management-service",
                ],
                docs_changed: true,
                frontend_changed: true,
                python_changed: true,
                design_docs_changed: true,
                validation_python_changed: true,
                lightweight_only: false,
              };
            }
            for (const [name, value] of Object.entries(outputs)) {
              core.setOutput(
                name,
                Array.isArray(value) ? JSON.stringify(value) : String(value)
              );
            }

  # Static generation, lint, and policy checks
  buf-check:
    name: Buf Generation
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🧰 Install Buf CLI
        env:
          BUF_VERSION: '1.30.0'
        run: |
          sudo curl -sSL \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-$(uname -s)-$(uname -m)" \
            -o /usr/local/bin/buf
          sudo chmod +x /usr/local/bin/buf
          buf --version

      - name: 💾 Cache Buf modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/buf
          key: buf-mod-${{ runner.os }}-${{ hashFiles('protos/buf.yaml', 'protos/**/*.proto', 'config/protobuf/buf.gen.yaml', 'config/protobuf/buf.work.yaml') }}
          restore-keys: buf-mod-${{ runner.os }}-

      - name: ⚙️ Generate Protobufs
        working-directory: protos
        env:
          BUF_WORKSPACE_CONFIG: ../config/protobuf/buf.work.yaml
        run: buf generate --template ../config/protobuf/buf.gen.yaml

  docker-lint:
    name: Dockerfile Lint
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐳 Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
          config: config/hadolint/hadolint.yaml

  shellcheck:
    name: ShellCheck
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 📦 Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: 🐚 Lint tracked shell scripts
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          if [ "${#shell_files[@]}" -eq 0 ]; then
            echo "No tracked shell scripts found."
            exit 0
          fi
          shellcheck "${shell_files[@]}"

  python-script-validation:
    name: Python Script Validation
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (needs.changes.outputs.lightweight_only != 'true' || needs.changes.outputs.python_changed == 'true') }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: 📦 Install Ruff
        run: python3 -m pip install --disable-pip-version-check ruff==0.16.0

      - name: 🧪 Validate tracked Python scripts
        run: |
          mapfile -t python_files < <(git ls-files '*.py')
          if [ "${#python_files[@]}" -eq 0 ]; then
            echo "No tracked Python scripts found."
            exit 0
          fi
          python3 -m py_compile "${python_files[@]}"
          ruff check --force-exclude "${python_files[@]}"

  dev-tool-contract-checks:
    name: Dev Tool Contract Checks
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (needs.changes.outputs.lightweight_only != 'true' || needs.changes.outputs.design_docs_changed == 'true' || needs.changes.outputs.validation_python_changed == 'true') }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🧰 Set up kubectl
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5

      - name: 🐍 Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: 📦 Install cloc
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc

      - name: 📦 Install Python script dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: 🧪 Validate dev tool contracts
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: |
          bash ./dev-tools/tests/cloc-report-contract.sh
          bash ./dev-tools/tests/ci-lightweight-scope-contract.sh
          bash ./dev-tools/tests/coderabbit-review-contract.sh
          bash ./dev-tools/tests/pr-retarget-workflow-contract.sh
          bash ./dev-tools/tests/static-analysis-summary-contract.sh
          bash ./dev-tools/tests/pr-required-gate-context-contract.sh
          bash ./dev-tools/tests/dev-demo-workflow-contract.sh
          bash ./dev-tools/tests/erd-workflow-contract.sh
          bash ./dev-tools/tests/smoke-transport-contract.sh
          bash ./dev-tools/tests/reset-service-db-contract.sh
          bash ./dev-tools/tests/preview-eligibility-contract.sh
          bash ./dev-tools/tests/preview-priority-contract.sh
          bash ./dev-tools/tests/worktree-topology-contract.sh
          bash ./dev-tools/tests/preflight-contract.sh
          bash ./dev-tools/tests/verify-backups-velero-contract.sh
          bash ./dev-tools/tests/overlay-preflight-contract.sh
          bash ./dev-tools/tests/validate-external-credentials-contract.sh
          bash ./dev-tools/tests/observability-validator-contract.sh
          bash ./dev-tools/tests/secret-compliance-contract.sh
          bash ./dev-tools/tests/ensure-local-compose-env-contract.sh
          bash ./dev-tools/tests/smoke-image-env-contract.sh
          bash ./dev-tools/tests/architecture-doc-contracts.sh
          bash ./dev-tools/tests/lint-yaml-contract.sh
          python3 -m unittest discover -s dev-tools/validation -p 'test_*.py'

      - name: 🧪 Validate architecture document contracts
        if: ${{ needs.changes.outputs.lightweight_only == 'true' && needs.changes.outputs.design_docs_changed == 'true' }}
        run: bash ./dev-tools/tests/architecture-doc-contracts.sh

      - name: 🧪 Validate non-runtime Python contracts
        if: ${{ needs.changes.outputs.lightweight_only == 'true' && needs.changes.outputs.validation_python_changed == 'true' }}
        run: python3 -m unittest discover -s dev-tools/validation -p 'test_*.py'

  yaml-lint:
    name: YAML Lint
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: 📦 Install yamllint
        run: python3 -m pip install --disable-pip-version-check yamllint

      - name: 🧪 Lint tracked YAML
        run: bash ./dev-tools/validation/lint-yaml.sh

  metrics-cardinality-check:
    name: Metrics Cardinality Policy Check
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: 📏 Validate metric label policy
        run: python3 dev-tools/observability/check-metrics-cardinality.py

  flyway-migration-sanity-checks:
    name: Flyway Migration Sanity Checks
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.20.0'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: 🧪 Check Flyway Migration Versions
        run: ./gradlew checkFlywayVersions

  grpc-transport-config-sanity-checks:
    name: gRPC Transport Configuration Sanity Checks
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.20.0'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: 🧪 Check gRPC Transport Configuration
        run: ./gradlew checkGrpcTransportConfig checkGrpcPublicMethods

  workflow-lint:
    name: GitHub Workflow Lint
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Set Up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: false

      - name: 🧪 Validate GitHub Actions Workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          "$(go env GOPATH)/bin/actionlint" -config-file .github/actionlint.yaml

  helm-lint:
    name: Helm Chart Lint
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.20.1"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
            tar -xzf /tmp/helm.tgz -C /tmp
            sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          fi
          helm version

      - name: 🧪 Lint tracked Helm charts
        run: bash ./dev-tools/validation/validate-helm.sh lint

  helm-render-validation:
    name: Helm Render Validation
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.20.1"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
            tar -xzf /tmp/helm.tgz -C /tmp
            sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          fi
          helm version

      - name: Set up kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.7"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tgz
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: 🧪 Validate rendered Helm manifests
        run: bash ./dev-tools/validation/validate-helm.sh render

  # Docs and frontend validation
  docs-check:
    name: Validate Documentation
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (github.event_name != 'pull_request' || needs.changes.outputs.docs_changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: 🔎 Validate Observability Contracts
        run: python3 dev-tools/observability/validate-observability-contract.py

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: config/openapi/package-lock.json

      - name: 📦 Install documentation dependencies
        run: |
          npm ci --prefix config/openapi
          python3 -m pip install --disable-pip-version-check mkdocs==1.6.1 mkdocs-material==9.6.5

      - name: 🧹 Lint Markdown and links
        run: |
          config/openapi/node_modules/.bin/markdownlint-cli2 --config config/markdownlint/.markdownlint-cli2.jsonc '**/*.md'
          CHECK_EXTERNAL_LINKS=${{ github.event_name == 'pull_request' && '0' || '1' }} bash ./dev-tools/docs/link-check.sh

      - name: 🏗️ Build documentation site
        run: |
          python3 dev-tools/docs/build_pages_site.py
          # Strict mode remains deferred until the legacy anchor-warning backlog is removed.
          python3 -m mkdocs build --clean

  frontend-checks:
    name: Frontend Checks
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (github.event_name != 'pull_request' || needs.changes.outputs.frontend_changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web-client/package-lock.json
            config/openapi/package-lock.json

      - name: 💾 Cache OpenAPI Dependencies
        id: cache-openapi
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: config/openapi/node_modules
          key: openapi-node-${{ hashFiles('config/openapi/package-lock.json') }}

      - name: 📦 Install OpenAPI Dependencies
        if: steps.cache-openapi.outputs.cache-hit != 'true'
        run: npm --prefix config/openapi ci

      - name: 📑 Lint OpenAPI Specs
        run: npm --prefix config/openapi run openapi:lint

      - name: 💾 Cache Web Client Dependencies
        id: cache-web-client
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web-client/node_modules
          key: web-client-node-${{ hashFiles('web-client/package-lock.json') }}

      - name: 📦 Install Frontend Dependencies
        if: steps.cache-web-client.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web-client

      - name: 🛠 Run Frontend Lint and Format Check
        run: |
          npm run lint
          npm run format -- -c
        working-directory: web-client

      - name: Cache Chrome .deb
        id: cache-chrome
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./google-chrome-stable_current_amd64.deb
          key: chrome-deb-v1

      - name: Install wget & Download Chrome .deb (if not cached)
        if: steps.cache-chrome.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y wget
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

      - name: Install Chrome
        run: sudo apt install -y --allow-downgrades ./google-chrome-stable_current_amd64.deb

      - name: Install ChromeDriver for axe
        run: |
          CHROME_VERSION="$(google-chrome --product-version)"
          CHROME_BUILD="${CHROME_VERSION%.*}"
          DRIVER_ZIP_URL=$(
            curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/latest-patch-versions-per-build-with-downloads.json \
              | CHROME_BUILD="$CHROME_BUILD" python3 -c "import json, os, sys; data = json.load(sys.stdin); build = os.environ['CHROME_BUILD']; print(next(item['url'] for item in data['builds'][build]['downloads']['chromedriver'] if item['platform'] == 'linux64'))"
          )
          DRIVER_DIR=/tmp/chromedriver-for-testing
          curl -fsSL "$DRIVER_ZIP_URL" -o /tmp/chromedriver-linux64.zip
          rm -rf "$DRIVER_DIR"
          mkdir -p "$DRIVER_DIR"
          unzip -q /tmp/chromedriver-linux64.zip -d "$DRIVER_DIR"
          echo "CHROMEDRIVER_PATH=$DRIVER_DIR/chromedriver-linux64/chromedriver" >> "$GITHUB_ENV"

      - name: ♿ Run Accessibility Audit
        run: |
          cd web-client
          npm run build
          npx serve dist -l 5000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx wait-on http://localhost:5000/index.html
          npx axe http://localhost:5000/index.html --chromedriver-path "$CHROMEDRIVER_PATH" --chrome-options="--no-sandbox" --exit

  # Service validation matrix
  build-and-test:
    name: Build and Test (${{ matrix.service }})
    needs: [changes, buf-check, docker-lint, shellcheck, python-script-validation, dev-tool-contract-checks, yaml-lint, metrics-cardinality-check, flyway-migration-sanity-checks, grpc-transport-config-sanity-checks, workflow-lint, helm-lint, helm-render-validation]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.affected_services != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java-version: [21]
        service: ${{ fromJSON(needs.changes.outputs.affected_services) }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: 🧪 Run Gradle Checks
        id: checks
        run: |
          echo "::group::Run Service Validation"
          ./gradlew :${{ matrix.service }}:check :${{ matrix.service }}:bootJar -PfullCheck
          echo "::endgroup::"

      - name: 📈 Parse Coverage %
        id: coverage
        run: |
          COVERAGE_FILE=services/${{ matrix.service }}/build/reports/jacoco/test/jacocoTestReport.xml
          if [ -f "$COVERAGE_FILE" ]; then
            COVERAGE_LINE=$(grep -A 1 "<counter type=\"LINE\"" "$COVERAGE_FILE" | tail -n 1 || true)
            MISSED=$(echo "$COVERAGE_LINE" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p')
            COVERED=$(echo "$COVERAGE_LINE" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p')
            TOTAL=$((MISSED + COVERED))
            if [ "$TOTAL" -gt 0 ]; then
              PERCENT=$((100 * COVERED / TOTAL))
            else
              PERCENT=0
            fi
          else
            echo "Coverage file not found" >&2
            PERCENT=0
          fi
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-${{ matrix.service }}-report-${{ github.sha }}
          path: services/${{ matrix.service }}/build/reports/jacoco/test/

      - name: ☂️ Upload Coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe
        with:
          use_oidc: true
          fail_ci_if_error: false
          handle_no_reports_found: true
          disable_search: true
          files: services/${{ matrix.service }}/build/reports/jacoco/test/jacocoTestReport.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-jacoco
          verbose: true

      - name: 📤 Upload Test Logs if Failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-logs-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/build/reports/tests/

  # Final gating and PR reporting
  validation-summary:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'PR Metadata Edit (Validation Summary)' || 'Validation Summary' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs: [buf-check, docker-lint, shellcheck, python-script-validation, dev-tool-contract-checks, yaml-lint, metrics-cardinality-check, flyway-migration-sanity-checks, grpc-transport-config-sanity-checks, workflow-lint, helm-lint, helm-render-validation, docs-check, frontend-checks, build-and-test, validation-gate]
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: 💬 Publish Validation Summary Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const statusIcon = (result) => {
              if (result === "success") return "✅";
              if (result === "failure") return "❌";
              if (result === "cancelled") return "⚪";
              if (["pending", "in_progress", "queued"].includes(result)) return "⏳";
              return "⏭️";
            };

            const validationChecks = [
              ["Validation gate", "${{ needs.validation-gate.result }}"],
              ["Buf generation", "${{ needs.buf-check.result }}"],
              ["Dockerfile lint", "${{ needs.docker-lint.result }}"],
              ["ShellCheck", "${{ needs.shellcheck.result }}"],
              ["Python script validation", "${{ needs.python-script-validation.result }}"],
              ["Dev tool contract checks", "${{ needs.dev-tool-contract-checks.result }}"],
              ["YAML lint", "${{ needs.yaml-lint.result }}"],
              ["Metrics cardinality policy check", "${{ needs.metrics-cardinality-check.result }}"],
              ["Flyway migration sanity checks", "${{ needs.flyway-migration-sanity-checks.result }}"],
              ["gRPC transport configuration sanity checks", "${{ needs.grpc-transport-config-sanity-checks.result }}"],
              ["GitHub workflow lint", "${{ needs.workflow-lint.result }}"],
              ["Helm chart lint", "${{ needs.helm-lint.result }}"],
              ["Helm render validation", "${{ needs.helm-render-validation.result }}"],
              ["Validate Documentation", "${{ needs.docs-check.result }}"],
              ["Frontend checks", "${{ needs.frontend-checks.result }}"],
              ["Service build/test matrix", "${{ needs.build-and-test.result }}"],
            ];

            const failedChecks = validationChecks.filter(([, result]) =>
              ["failure", "cancelled", "timed_out", "action_required"].includes(result)
            );
            const pendingChecks = validationChecks.filter(([, result]) =>
              ["pending", "in_progress", "queued"].includes(result)
            );

            const headline = failedChecks.length > 0
              ? "❌ One or more validation checks failed"
              : pendingChecks.length > 0
              ? "⏳ Validation checks are still running"
              : "✅ All validation checks passed";

            const body = [
              "### Validation Summary",
              headline,
              "",
              ...validationChecks.map(([name, result]) => `- ${statusIcon(result)} ${name}: \`${result}\``),
              "",
              "Coverage reports and failure logs are available in the workflow artifacts."
            ].join("\n");

            await core.summary
              .addRaw(headline, true)
              .addList(validationChecks.map(([name, result]) => `${statusIcon(result)} ${name}: ${result}`))
              .write();

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const summaryComments = comments.filter(comment =>
              comment.body.startsWith("### Validation Summary")
            );
            const existing = summaryComments[0];

            if (summaryComments.length > 1) {
              for (const comment of summaryComments.slice(1)) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                });
              }
            }

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

  validation-gate:
    name: Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      checks: read # Preserve a prior successful required context on metadata-only edits.
      contents: read # Check out the shared required-gate composite action.
    needs: [changes, buf-check, docker-lint, shellcheck, python-script-validation, dev-tool-contract-checks, yaml-lint, metrics-cardinality-check, flyway-migration-sanity-checks, grpc-transport-config-sanity-checks, workflow-lint, helm-lint, helm-render-validation, docs-check, frontend-checks, build-and-test]
    if: ${{ always() }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Check out required-gate action
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Preserve successful required gate on metadata-only edit
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: ./.github/actions/preserve-required-gate
        with:
          gate-name: Validation Gate

      - name: Enforce validation success
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
        env:
          DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend_changed }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python_changed }}
          DESIGN_DOCS_CHANGED: ${{ needs.changes.outputs.design_docs_changed }}
          VALIDATION_PYTHON_CHANGED: ${{ needs.changes.outputs.validation_python_changed }}
          LIGHTWEIGHT_ONLY: ${{ needs.changes.outputs.lightweight_only }}
          AFFECTED_SERVICES: ${{ needs.changes.outputs.affected_services }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUF_CHECK: ${{ needs.buf-check.result }}
          DOCKER_LINT: ${{ needs.docker-lint.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          PYTHON_SCRIPT_VALIDATION: ${{ needs.python-script-validation.result }}
          DEV_TOOL_CONTRACT_CHECKS: ${{ needs.dev-tool-contract-checks.result }}
          YAML_LINT: ${{ needs.yaml-lint.result }}
          METRICS_CARDINALITY_CHECK: ${{ needs.metrics-cardinality-check.result }}
          FLYWAY_MIGRATION_SANITY_CHECKS: ${{ needs.flyway-migration-sanity-checks.result }}
          GRPC_TRANSPORT_CONFIG_SANITY_CHECKS: ${{ needs.grpc-transport-config-sanity-checks.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          HELM_LINT: ${{ needs.helm-lint.result }}
          HELM_RENDER_VALIDATION: ${{ needs.helm-render-validation.result }}
          DOCS_CHECK: ${{ needs.docs-check.result }}
          FRONTEND_CHECKS: ${{ needs.frontend-checks.result }}
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
        run: |
          is_acceptable_optional_result() {
            local result="$1"
            [ "$result" = "success" ] || [ "$result" = "skipped" ]
          }

          failed=0

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection did not succeed: $CHANGES_RESULT" >&2
            failed=1
          fi

          for check in \
            "Buf Generation:$BUF_CHECK" \
            "Dockerfile Lint:$DOCKER_LINT" \
            "ShellCheck:$SHELLCHECK" \
            "YAML Lint:$YAML_LINT" \
            "Metrics Cardinality Policy Check:$METRICS_CARDINALITY_CHECK" \
            "Flyway Migration Sanity Checks:$FLYWAY_MIGRATION_SANITY_CHECKS" \
            "gRPC Transport Configuration Sanity Checks:$GRPC_TRANSPORT_CONFIG_SANITY_CHECKS" \
            "GitHub Workflow Lint:$WORKFLOW_LINT" \
            "Helm Chart Lint:$HELM_LINT" \
            "Helm Render Validation:$HELM_RENDER_VALIDATION"
          do
            name="${check%%:*}"
            result="${check#*:}"
            echo "$name => $result"
            if [ "$LIGHTWEIGHT_ONLY" = "true" ]; then
              if ! is_acceptable_optional_result "$result"; then
                failed=1
              fi
            else
              if [ "$result" != "success" ]; then
                failed=1
              fi
            fi
          done

          echo "Python Script Validation => $PYTHON_SCRIPT_VALIDATION"
          if [ "$LIGHTWEIGHT_ONLY" != "true" ] || [ "$PYTHON_CHANGED" = "true" ]; then
            if [ "$PYTHON_SCRIPT_VALIDATION" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$PYTHON_SCRIPT_VALIDATION"; then
              failed=1
            fi
          fi

          echo "Dev Tool Contract Checks => $DEV_TOOL_CONTRACT_CHECKS"
          if [ "$LIGHTWEIGHT_ONLY" != "true" ] || [ "$DESIGN_DOCS_CHANGED" = "true" ] || [ "$VALIDATION_PYTHON_CHANGED" = "true" ]; then
            if [ "$DEV_TOOL_CONTRACT_CHECKS" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$DEV_TOOL_CONTRACT_CHECKS"; then
              failed=1
            fi
          fi

          echo "Validate Documentation => $DOCS_CHECK"
          if [ "$DOCS_CHANGED" = "true" ]; then
            if [ "$DOCS_CHECK" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$DOCS_CHECK"; then
              failed=1
            fi
          fi

          echo "Frontend Checks => $FRONTEND_CHECKS"
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            if [ "$FRONTEND_CHECKS" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$FRONTEND_CHECKS"; then
              failed=1
            fi
          fi

          echo "Build and Test Matrix => $BUILD_AND_TEST"
          if [ "$AFFECTED_SERVICES" != "[]" ]; then
            if [ "$BUILD_AND_TEST" != "success" ]; then
              failed=1
            fi
          else
            if ! is_acceptable_optional_result "$BUILD_AND_TEST"; then
              failed=1
            fi
          fi

          if [ "$failed" -ne 0 ]; then
            echo "Validation Gate failed because one or more required validation jobs did not succeed." >&2
            exit 1
          fi
