name: CI — Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI-Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      run_all: ${{ steps.compute.outputs.run_all }}
      affected_services: ${{ steps.compute.outputs.affected_services }}
      docs_changed: ${{ steps.compute.outputs.docs_changed }}
      frontend_changed: ${{ steps.compute.outputs.frontend_changed }}
    steps:
      - name: Compute affected jobs
        id: compute
        uses: actions/github-script@v8
        with:
          script: |
            const allServices = [
              "account-service",
              "automation-scripting-service",
              "entity-management-service",
              "game-design-service",
              "game-logic-service",
              "game-session-service",
              "logging-admin-service",
              "social-groups-service",
              "spring-cloud-gateway",
              "tcp-proxy-service",
              "world-management-service",
            ];

            if (context.eventName !== "pull_request") {
              core.setOutput("run_all", "true");
              core.setOutput("affected_services", JSON.stringify(allServices));
              core.setOutput("docs_changed", "true");
              core.setOutput("frontend_changed", "true");
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
              (response) => response.data.map((file) => file.filename)
            );

            const sharedPrefixes = [
              "buildSrc/",
              "gradle/",
              "protos/",
              "config/checkstyle/",
              "config/protobuf/",
              "config/security/",
              "config/spotbugs/",
              "services/common-data-runtime/",
              "services/common-library/",
              "services/common-platform-core/",
              "services/common-saga/",
              "services/common-security/",
              "services/common-test-support/",
              "services/common-web-support/",
            ];
            const sharedFiles = new Set([
              "build.gradle.kts",
              "settings.gradle.kts",
              "gradle.properties",
              ".github/workflows/ci.yml",
            ]);

            const docsPredicate = (file) =>
              file === "AGENTS.md" ||
              file === "mkdocs.yml" ||
              file.startsWith("design/") ||
              file.startsWith("dev-tools/docs/") ||
              file.endsWith(".md");

            const frontendPredicate = (file) =>
              file.startsWith("web-client/") ||
              file.startsWith("config/openapi/");

            const runAll = files.some(
              (file) =>
                sharedFiles.has(file) ||
                sharedPrefixes.some((prefix) => file.startsWith(prefix))
            );

            const affected = new Set();
            if (runAll) {
              allServices.forEach((service) => affected.add(service));
            } else {
              for (const file of files) {
                for (const service of allServices) {
                  if (file.startsWith(`services/${service}/`)) {
                    affected.add(service);
                  }
                }
              }
            }

            const docsChanged = runAll || files.some((file) => docsPredicate(file));
            const frontendChanged = runAll || files.some((file) => frontendPredicate(file));

            core.setOutput("run_all", runAll ? "true" : "false");
            core.setOutput("affected_services", JSON.stringify([...affected]));
            core.setOutput("docs_changed", docsChanged ? "true" : "false");
            core.setOutput("frontend_changed", frontendChanged ? "true" : "false");

  buf-check:
    name: Buf Generation
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🧰 Install Buf CLI
        env:
          BUF_VERSION: '1.30.0'
        run: |
          sudo curl -sSL \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-$(uname -s)-$(uname -m)" \
            -o /usr/local/bin/buf
          sudo chmod +x /usr/local/bin/buf
          buf --version

      - name: 💾 Cache Buf modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/buf
          key: buf-mod-${{ runner.os }}-${{ hashFiles('protos/buf.yaml', 'protos/**/*.proto', 'config/protobuf/buf.gen.yaml', 'config/protobuf/buf.work.yaml') }}
          restore-keys: buf-mod-${{ runner.os }}-

      - name: ⚙️ Generate Protobufs
        working-directory: protos
        env:
          BUF_WORKSPACE_CONFIG: ../config/protobuf/buf.work.yaml
        run: buf generate --template ../config/protobuf/buf.gen.yaml

  docker-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: 🐳 Run Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          recursive: true
          config: config/hadolint/hadolint.yaml

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: dev-tools

  docs-check:
    name: Lint Docs and Links
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: 🐍 Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🔎 Validate Observability Contracts
        run: python3 dev-tools/observability/validate-observability-contract.py

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 🧹 Lint Docs and Links
        run: |
          echo "::group::Lint Markdown and Links"
          ./gradlew lintMarkdown linkCheck -PfullCheck
          echo "::endgroup::"

  frontend-checks:
    name: Frontend Checks
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web-client/package-lock.json
            config/openapi/package-lock.json

      - name: 💾 Cache OpenAPI Dependencies
        id: cache-openapi
        uses: actions/cache@v5
        with:
          path: config/openapi/node_modules
          key: openapi-node-${{ hashFiles('config/openapi/package-lock.json') }}

      - name: 📦 Install OpenAPI Dependencies
        if: steps.cache-openapi.outputs.cache-hit != 'true'
        run: npm --prefix config/openapi ci

      - name: 📑 Lint OpenAPI Specs
        run: npm --prefix config/openapi run openapi:lint

      - name: 💾 Cache Web Client Dependencies
        id: cache-web-client
        uses: actions/cache@v5
        with:
          path: web-client/node_modules
          key: web-client-node-${{ hashFiles('web-client/package-lock.json') }}

      - name: 📦 Install Frontend Dependencies
        if: steps.cache-web-client.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web-client

      - name: 🛠 Run Frontend Lint and Format Check
        run: |
          npm run lint
          npm run format -- -c
        working-directory: web-client

      - name: Cache Chrome .deb
        id: cache-chrome
        uses: actions/cache@v5
        with:
          path: ./google-chrome-stable_current_amd64.deb
          key: chrome-deb-v1

      - name: Install wget & Download Chrome .deb (if not cached)
        if: steps.cache-chrome.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y wget
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

      - name: Install Chrome
        run: sudo apt install -y --allow-downgrades ./google-chrome-stable_current_amd64.deb

      - name: Install ChromeDriver for axe
        run: |
          CHROME_VERSION=$(google-chrome --product-version)
          DRIVER_ZIP_URL="https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
          DRIVER_DIR=/tmp/chromedriver-for-testing
          curl -fsSL "$DRIVER_ZIP_URL" -o /tmp/chromedriver-linux64.zip
          rm -rf "$DRIVER_DIR"
          mkdir -p "$DRIVER_DIR"
          unzip -q /tmp/chromedriver-linux64.zip -d "$DRIVER_DIR"
          echo "CHROMEDRIVER_PATH=$DRIVER_DIR/chromedriver-linux64/chromedriver" >> $GITHUB_ENV

      - name: ♿ Run Accessibility Audit
        run: |
          cd web-client
          npm run build
          npx serve dist -l 5000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx wait-on http://localhost:5000/index.html
          npx axe http://localhost:5000/index.html --chromedriver-path "$CHROMEDRIVER_PATH" --chrome-options="--no-sandbox" --exit

  build-and-test:
    name: Build and Test (${{ matrix.service }})
    needs: [changes, buf-check, docker-lint, shellcheck]
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        needs.changes.outputs.run_all == 'true' ||
        contains(needs.changes.outputs.affected_services, format('"{0}"', matrix.service))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java-version: [21]
        service:
          - account-service
          - automation-scripting-service
          - entity-management-service
          - game-design-service
          - game-logic-service
          - game-session-service
          - logging-admin-service
          - social-groups-service
          - spring-cloud-gateway
          - tcp-proxy-service
          - world-management-service

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 🧪 Run Gradle Checks
        id: checks
        run: |
          echo "::group::Run Tests"
          ./gradlew :${{ matrix.service }}:check -PfullCheck
          echo "::endgroup::"

      - name: 📈 Parse Coverage %
        id: coverage
        run: |
          COVERAGE_FILE=services/${{ matrix.service }}/build/reports/jacoco/test/jacocoTestReport.xml
          if [ -f "$COVERAGE_FILE" ]; then
            COVERAGE_LINE=$(grep -A 1 "<counter type=\"LINE\"" "$COVERAGE_FILE" | tail -n 1 || true)
            MISSED=$(echo "$COVERAGE_LINE" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p')
            COVERED=$(echo "$COVERAGE_LINE" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p')
            TOTAL=$((MISSED + COVERED))
            if [ "$TOTAL" -gt 0 ]; then
              PERCENT=$((100 * COVERED / TOTAL))
            else
              PERCENT=0
            fi
          else
            echo "Coverage file not found" >&2
            PERCENT=0
          fi
          echo "percent=$PERCENT" >> $GITHUB_OUTPUT

      - name: 📤 Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-${{ matrix.service }}-report-${{ github.sha }}
          path: services/${{ matrix.service }}/build/reports/jacoco/test/

      - name: 📤 Upload Test Logs if Failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/build/reports/tests/test/

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [buf-check, docker-lint, shellcheck, docs-check, frontend-checks, build-and-test, validation-gate]
    if: github.event_name == 'pull_request' && always()
    steps:
      - name: 💬 Publish Validation Summary Comment
        uses: actions/github-script@v8
        with:
          script: |
            const statusIcon = (result) => {
              if (result === "success") return "✅";
              if (result === "failure") return "❌";
              if (result === "cancelled") return "⚪";
              return "⏭️";
            };

            const validationChecks = [
              ["Validation gate", "${{ needs.validation-gate.result }}"],
              ["Buf generation", "${{ needs.buf-check.result }}"],
              ["Dockerfile lint", "${{ needs.docker-lint.result }}"],
              ["ShellCheck", "${{ needs.shellcheck.result }}"],
              ["Docs and links", "${{ needs.docs-check.result }}"],
              ["Frontend checks", "${{ needs.frontend-checks.result }}"],
              ["Service build/test matrix", "${{ needs.build-and-test.result }}"],
            ];

            const failedChecks = validationChecks.filter(([, result]) =>
              ["failure", "cancelled", "timed_out", "action_required"].includes(result)
            );
            const pendingChecks = validationChecks.filter(([, result]) =>
              ["pending", "in_progress", "queued"].includes(result)
            );

            const headline = failedChecks.length > 0
              ? "❌ One or more validation checks failed"
              : pendingChecks.length > 0
              ? "🟡 Validation checks are still running"
              : "✅ All validation checks passed";

            const body = [
              "### Validation Summary",
              headline,
              "",
              ...validationChecks.map(([name, result]) => `- ${statusIcon(result)} ${name}: \`${result}\``),
              "",
              "Coverage reports and failure logs are available in the workflow artifacts."
            ].join("\n");

            await core.summary
              .addRaw(headline, true)
              .addList(validationChecks.map(([name, result]) => `${statusIcon(result)} ${name}: ${result}`))
              .write();

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(comment =>
              comment.body.startsWith("### Validation Summary")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

  validation-gate:
    name: Validation Gate
    runs-on: ubuntu-latest
    needs: [buf-check, docker-lint, shellcheck, docs-check, frontend-checks, build-and-test]
    if: always()
    steps:
      - name: Enforce validation success
        env:
          BUF_CHECK: ${{ needs.buf-check.result }}
          DOCKER_LINT: ${{ needs.docker-lint.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          DOCS_CHECK: ${{ needs.docs-check.result }}
          FRONTEND_CHECKS: ${{ needs.frontend-checks.result }}
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
        run: |
          failed=0
          for check in \
            "Buf Generation:$BUF_CHECK" \
            "Dockerfile Lint:$DOCKER_LINT" \
            "ShellCheck:$SHELLCHECK" \
            "Lint Docs and Links:$DOCS_CHECK" \
            "Frontend Checks:$FRONTEND_CHECKS" \
            "Build and Test Matrix:$BUILD_AND_TEST"
          do
            name="${check%%:*}"
            result="${check#*:}"
            echo "$name => $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Validation Gate failed because one or more required validation jobs did not succeed." >&2
            exit 1
          fi
