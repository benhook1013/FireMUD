  helm-transaction-proof:
    name: Helm Transaction Proof
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      K3S_IMAGE: rancher/k3s:v1.34.12-k3s1@sha256:4ea0adb6b0ffedab0c58ffe5c99a49f2f7be871f38636c8baa2692899648d8c5
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: ./.github/actions/setup-kubectl

      - name: Set up Helm
        uses: ./.github/actions/setup-helm

      - name: Set up canonical Python dependencies
        uses: ./.github/actions/setup-python
        with:
          requirements: yaml

      - name: Pull pinned disposable k3s server image
        run: |
          set -euo pipefail
          pull_succeeded=false
          for attempt in 1 2 3; do
            if timeout 120s docker pull "$K3S_IMAGE"; then
              pull_succeeded=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done
          if [[ "$pull_succeeded" != true ]]; then
            echo "Unable to pull $K3S_IMAGE after three attempts" >&2
            exit 1
          fi

      - name: Start pinned disposable k3s server
        run: |
          docker run --pull=never --detach --privileged \
            --name firemud-helm-proof \
            --publish 6443:6443 \
            "$K3S_IMAGE" \
            server --disable=traefik --disable=servicelb --disable=metrics-server --write-kubeconfig-mode=644

      - name: Wait for disposable k3s startup
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if docker logs firemud-helm-proof 2>&1 | grep -F 'k3s is up and running' >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              docker logs firemud-helm-proof
              exit 1
            fi
            sleep 2
          done
          docker cp firemud-helm-proof:/etc/rancher/k3s/k3s.yaml "$RUNNER_TEMP/helm-proof.kubeconfig"
          chmod 0600 "$RUNNER_TEMP/helm-proof.kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/helm-proof.kubeconfig" >> "$GITHUB_ENV"

      - name: Run Helm lifecycle proof
        run: bash ./dev-tools/validation/helm-transaction-proof.sh

      - name: Remove disposable k3s server
        if: ${{ always() }}
        run: docker rm --force firemud-helm-proof >/dev/null 2>&1 || true

