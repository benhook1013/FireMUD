name: CI — Build and Security

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3am UTC

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buf-check:
    name: Buf Breaking and Generation
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🧰 Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.30.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Cache Buf modules
        uses: actions/cache@v3
        with:
          path: ~/.cache/buf
          key: buf-mod-${{ runner.os }}-${{ hashFiles('protos/buf.yaml', 'protos/**/*.proto') }}
          restore-keys: buf-mod-${{ runner.os }}-

      - name: 🛠️ Fetch Base Commit for Buf Breaking
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: ⚠️ Buf Breaking
        if: github.event_name == 'pull_request'
        working-directory: protos
        run: |
          buf breaking --against "../.git#ref=${{ github.event.pull_request.base.sha }},subdir=protos"

      - name: ⚙️ Generate Protobufs
        working-directory: protos
        run: buf generate --template ../config/protobuf/buf.gen.yaml

  docker-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: 🐳 Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          recursive: true
          config: config/hadolint/hadolint.yaml

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3
      - uses: ludeeus/action-shellcheck@2
        with:
          scandir: dev-tools

  build-and-test:
    name: Build and Test (${{ matrix.service }})
    needs: [buf-check, docker-lint, shellcheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java-version: [21]
        node-version: [20]
        service:
          - account-service
          - automation-scripting-service
          - entity-management-service
          - game-design-service
          - game-logic-service
          - game-session-service
          - logging-admin-service
          - social-groups-service
          - spring-cloud-gateway
          - tcp-proxy-service
          - world-management-service

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: gradle

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-client/package-lock.json
            config/openapi/package-lock.json

      - name: 📦 Install Root Dependencies
        run: npm --prefix config/openapi ci

      - name: 📑 Lint OpenAPI Specs
        run: npm --prefix config/openapi run openapi:lint

      - name: 📦 Install Frontend Dependencies
        run: npm ci
        working-directory: web-client

      - name: 🛠 Run Frontend Lint
        run: |
          npm run lint
          npm run format -- -c
        working-directory: web-client

      - name: Cache Chrome .deb
        id: cache-chrome
        uses: actions/cache@v3
        with:
          path: ./google-chrome-stable_current_amd64.deb
          key: chrome-deb-v1

      - name: Install wget & Download Chrome .deb (if not cached)
        if: steps.cache-chrome.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y wget
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

      - name: Install Chrome
        run: sudo apt install -y --allow-downgrades ./google-chrome-stable_current_amd64.deb

      - name: ♿ Run Accessibility Audit
        run: |
          cd web-client
          npm run accessibility

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🎨 Apply Spotless Formatting
        run: |
          echo "::group::Run Spotless"
          ./gradlew spotlessCheck
          echo "::endgroup::"

      - name: 🧹 Fix Markdown Lint
        run: |
          echo "::group::Lint Markdown"
          ./gradlew lintMarkdown
          echo "::endgroup::"

      - name: 🧪 Run Unit Tests
        id: checks
        run: |
          echo "::group::Run Tests"
          ./gradlew :${{ matrix.service }}:check
          echo "::endgroup::"

      - name: 📈 Parse Coverage %
        id: coverage
        run: |
          COVERAGE_FILE=services/${{ matrix.service }}/build/reports/jacoco/test/jacocoTestReport.xml
          if [ -f "$COVERAGE_FILE" ]; then
            COVERAGE_LINE=$(grep -A 1 "<counter type=\"LINE\"" "$COVERAGE_FILE" | tail -n 1 || true)
            MISSED=$(echo "$COVERAGE_LINE" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p')
            COVERED=$(echo "$COVERAGE_LINE" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p')
            TOTAL=$((MISSED + COVERED))
            if [ "$TOTAL" -gt 0 ]; then
              PERCENT=$((100 * COVERED / TOTAL))
            else
              PERCENT=0
            fi
          else
            echo "Coverage file not found" >&2
            PERCENT=0
          fi
          echo "percent=$PERCENT" >> $GITHUB_OUTPUT
          echo "### 📊 Code coverage: **$PERCENT%**" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}-report-${{ github.sha }}
          path: services/${{ matrix.service }}/build/reports/jacoco/test/

      - name: 📤 Upload Test Logs if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/build/reports/tests/test/

      - name: 💬 Upload Build Summary Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const coverage = Number("${{ steps.coverage.outputs.percent }}");
            const testPassed = "${{ steps.checks.outcome }}" === "success";

            const summaryLines = [
              `### 🧪 Build Summary`,
              testPassed ? "✅ All tests passed" : "❌ Some tests failed (see logs)",
              "🧼 Lint + format steps completed",
              `📊 Code coverage: **${coverage}%**`,
              ""
            ];

            const body = summaryLines.join('\n');

            core.summary.addHeading("🧪 Build Summary");
            core.summary.addRaw(body).write();

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(comment =>
              comment.body.startsWith('### 🧪 Build Summary')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: [buf-check, docker-lint, shellcheck]
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: 💾 Cache Trivy DB
        uses: actions/cache@v3
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/package-lock.json') }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: 🛡️ Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.1

      - name: 🔍 Run Trivy and Save Report
        if: always()
        continue-on-error: false
        run: |
          echo "::group::Run Trivy"
          trivy fs --config config/security/trivy.yaml . | tee trivy-report.txt
          echo "::endgroup::"

      - name: 📤 Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report.txt

      - name: 💬 Upload Trivy Report as PR Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = 'trivy-report.txt';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'Trivy report not available.';

            const hasVulnerabilities =
              /Total:\s+[1-9]/.test(report) || /CRITICAL|HIGH/.test(report);

            const summary = hasVulnerabilities
              ? "❌ Critical/High vulnerabilities detected"
              : "✅ No critical/high vulnerabilities found";

            const body = `### 🔍 Trivy Security Scan Report\n**${summary}**\n\n\`\`\n${report}\n\`\``;

            core.summary.addHeading("🔍 Trivy Security Scan");
            core.summary.addRaw(summary).write();

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(comment =>
              comment.body.startsWith('### 🔍 Trivy Security Scan Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
            });
            }

  generate-erd:
    name: Generate ERD Diagrams
    runs-on: ubuntu-latest
    needs: [build-and-test, trivy-scan]
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🖼️ Generate ERD diagrams
        run: ./dev-tools/generate-erd.sh

      - name: 📤 Upload ERD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: erd-${{ github.sha }}
          path: design/erd
