name: CI — Build and Security

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3am UTC

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buf-check:
    name: Buf Generation
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🧰 Install Buf CLI
        env:
          BUF_VERSION: '1.30.0'
        run: |
          sudo curl -sSL \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-$(uname -s)-$(uname -m)" \
            -o /usr/local/bin/buf
          sudo chmod +x /usr/local/bin/buf
          buf --version

      - name: 💾 Cache Buf modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/buf
          key: buf-mod-${{ runner.os }}-${{ hashFiles('protos/buf.yaml', 'protos/**/*.proto', 'config/protobuf/buf.gen.yaml', 'config/protobuf/buf.work.yaml') }}
          restore-keys: buf-mod-${{ runner.os }}-

      - name: ⚙️ Generate Protobufs
        working-directory: protos
        env:
          BUF_WORKSPACE_CONFIG: ../config/protobuf/buf.work.yaml
        run: buf generate --template ../config/protobuf/buf.gen.yaml

  docker-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: 🐳 Run Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          recursive: true
          config: config/hadolint/hadolint.yaml

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: dev-tools

  docs-check:
    name: Lint Docs and Links
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: 🐍 Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🔎 Validate Observability Contracts
        run: python3 dev-tools/observability/validate-observability-contract.py

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: 🧹 Lint Docs and Links
        run: |
          echo "::group::Lint Markdown and Links"
          ./gradlew lintMarkdown linkCheck -PfullCheck
          echo "::endgroup::"

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web-client/package-lock.json
            config/openapi/package-lock.json

      - name: 💾 Cache OpenAPI Dependencies
        id: cache-openapi
        uses: actions/cache@v5
        with:
          path: config/openapi/node_modules
          key: openapi-node-${{ hashFiles('config/openapi/package-lock.json') }}

      - name: 📦 Install OpenAPI Dependencies
        if: steps.cache-openapi.outputs.cache-hit != 'true'
        run: npm --prefix config/openapi ci

      - name: 📑 Lint OpenAPI Specs
        run: npm --prefix config/openapi run openapi:lint

      - name: 💾 Cache Web Client Dependencies
        id: cache-web-client
        uses: actions/cache@v5
        with:
          path: web-client/node_modules
          key: web-client-node-${{ hashFiles('web-client/package-lock.json') }}

      - name: 📦 Install Frontend Dependencies
        if: steps.cache-web-client.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web-client

      - name: 🛠 Run Frontend Lint and Format Check
        run: |
          npm run lint
          npm run format -- -c
        working-directory: web-client

      - name: Cache Chrome .deb
        id: cache-chrome
        uses: actions/cache@v5
        with:
          path: ./google-chrome-stable_current_amd64.deb
          key: chrome-deb-v1

      - name: Install wget & Download Chrome .deb (if not cached)
        if: steps.cache-chrome.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y wget
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

      - name: Install Chrome
        run: sudo apt install -y --allow-downgrades ./google-chrome-stable_current_amd64.deb

      - name: Install ChromeDriver for axe
        run: |
          CHROME_VERSION=$(google-chrome --product-version)
          DRIVER_ZIP_URL="https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
          DRIVER_DIR=/tmp/chromedriver-for-testing
          curl -fsSL "$DRIVER_ZIP_URL" -o /tmp/chromedriver-linux64.zip
          rm -rf "$DRIVER_DIR"
          mkdir -p "$DRIVER_DIR"
          unzip -q /tmp/chromedriver-linux64.zip -d "$DRIVER_DIR"
          echo "CHROMEDRIVER_PATH=$DRIVER_DIR/chromedriver-linux64/chromedriver" >> $GITHUB_ENV

      - name: ♿ Run Accessibility Audit
        run: |
          cd web-client
          npm run build
          npx serve dist -l 5000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx wait-on http://localhost:5000/index.html
          npx axe http://localhost:5000/index.html --chromedriver-path "$CHROMEDRIVER_PATH" --chrome-options="--no-sandbox" --exit

  build-and-test:
    name: Build and Test (${{ matrix.service }})
    needs: [buf-check, docker-lint, shellcheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java-version: [21]
        service:
          - account-service
          - automation-scripting-service
          - entity-management-service
          - game-design-service
          - game-logic-service
          - game-session-service
          - logging-admin-service
          - social-groups-service
          - spring-cloud-gateway
          - tcp-proxy-service
          - world-management-service

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: 🧪 Run Gradle Checks
        id: checks
        run: |
          echo "::group::Run Tests"
          ./gradlew :${{ matrix.service }}:check -PfullCheck
          echo "::endgroup::"

      - name: 📈 Parse Coverage %
        id: coverage
        run: |
          COVERAGE_FILE=services/${{ matrix.service }}/build/reports/jacoco/test/jacocoTestReport.xml
          if [ -f "$COVERAGE_FILE" ]; then
            COVERAGE_LINE=$(grep -A 1 "<counter type=\"LINE\"" "$COVERAGE_FILE" | tail -n 1 || true)
            MISSED=$(echo "$COVERAGE_LINE" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p')
            COVERED=$(echo "$COVERAGE_LINE" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p')
            TOTAL=$((MISSED + COVERED))
            if [ "$TOTAL" -gt 0 ]; then
              PERCENT=$((100 * COVERED / TOTAL))
            else
              PERCENT=0
            fi
          else
            echo "Coverage file not found" >&2
            PERCENT=0
          fi
          echo "percent=$PERCENT" >> $GITHUB_OUTPUT

      - name: 📤 Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-${{ matrix.service }}-report-${{ github.sha }}
          path: services/${{ matrix.service }}/build/reports/jacoco/test/

      - name: 📤 Upload Test Logs if Failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/build/reports/tests/test/

      - name: 💬 Upload Build Summary Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        with:
          script: |
            const coverage = Number("${{ steps.coverage.outputs.percent }}");
            const testPassed = "${{ steps.checks.outcome }}" === "success";

            const commentLines = [
              `### 🧪 Build Summary`,
              testPassed ? "✅ All tests passed" : "❌ Some tests failed (see logs)",
              "🧼 Lint + format steps completed",
              `📊 Code coverage: **${coverage}%**`,
              ""
            ];

            const body = commentLines.join('\n');

            await core.summary
              .addRaw(testPassed ? "✅ All tests passed" : "❌ Some tests failed (see logs)", true)
              .addRaw("🧼 Lint + format steps completed", true)
              .addRaw(`📊 Code coverage: ${coverage}%`, true)
              .write();

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(comment =>
              comment.body.startsWith('### 🧪 Build Summary')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

  smoke-core:
    name: Core Smoke Tests
    needs: [build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: 📝 Create CI .env placeholder
        run: touch .env

      - name: Generate Dev Certificates
        run: ./dev-tools/generate-dev-certs.sh dev-tools/certs

      - name: 🚀 Start Dev Stack (devUp)
        run: ./gradlew devUp

      - name: 🧪 Telnet LOGIN + LOOK (TCP Proxy)
        run: |
          cd services/tcp-proxy-service
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}: running Telnet LOGIN + LOOK smoke test..."
            if bash ./telnet-login-look-smoke.sh; then
              echo "Telnet smoke test succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Telnet smoke test attempt ${attempt} failed; waiting before retry..."
            sleep 10
          done
          echo "Telnet LOGIN + LOOK smoke test failed after 3 attempts."
          exit 1

      - name: 📜 Dump Docker Compose Logs on Failure
        if: failure()
        run: |
          if [ -f docker/docker-compose.yml ]; then
            docker compose -f docker/docker-compose.yml logs || true
          fi

      - name: 🧹 Stop Dev Stack (devDown)
        if: always()
        run: ./gradlew devDown

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: [buf-check, docker-lint, shellcheck]
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            config/openapi/package-lock.json
            web-client/package-lock.json

      - name: 💾 Cache OpenAPI Dependencies
        id: cache-openapi
        uses: actions/cache@v5
        with:
          path: config/openapi/node_modules
          key: openapi-node-modules-${{ runner.os }}-${{ hashFiles('config/openapi/package-lock.json') }}
          restore-keys: openapi-node-modules-${{ runner.os }}-

      - name: 📦 Install OpenAPI Dependencies
        if: steps.cache-openapi.outputs.cache-hit != 'true'
        run: npm --prefix config/openapi ci

      - name: 💾 Cache Web Client Dependencies
        id: cache-web-client
        uses: actions/cache@v5
        with:
          path: web-client/node_modules
          key: web-client-node-modules-${{ runner.os }}-${{ hashFiles('web-client/package-lock.json') }}
          restore-keys: web-client-node-modules-${{ runner.os }}-

      - name: 📦 Install Web Client Dependencies
        if: steps.cache-web-client.outputs.cache-hit != 'true'
        run: npm --prefix web-client ci

      - name: 💾 Cache Trivy DB
        uses: actions/cache@v5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/package-lock.json') }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: 🛡️ Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.5

      - name: 🔍 Run Trivy and Save Report
        if: always()
        continue-on-error: false
        run: |
          echo "::group::Run Trivy"
          trivy fs --config config/security/trivy.yaml . | tee trivy-report.txt
          echo "::endgroup::"

      - name: 📤 Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report.txt

      - name: 💬 Upload Trivy Report as PR Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'trivy-report.txt';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'Trivy report not available.';

            const hasVulnerabilities =
              /Total:\s+[1-9]/.test(report) || /CRITICAL|HIGH/.test(report);

            const summary = hasVulnerabilities
              ? "❌ Critical/High vulnerabilities detected"
              : "✅ No critical/high vulnerabilities found";

            const body = `### 🔍 Trivy Security Scan Report\n**${summary}**\n\n\`\`\`\n${report}\n\`\`\``;

            await core.summary
              .addRaw(summary, true)
              .write();

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(comment =>
              comment.body.startsWith('### 🔍 Trivy Security Scan Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
            });
            }

  generate-erd:
    name: Generate ERD Diagrams
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: 🖼️ Generate ERD diagrams
        run: ./dev-tools/docs/generate-erd.sh

      - name: 📤 Upload ERD artifacts
        uses: actions/upload-artifact@v7
        with:
          name: erd-${{ github.sha }}
          path: design/erd
