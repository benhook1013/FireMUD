  frontend-checks:
    name: Frontend Checks
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && (github.event_name != 'pull_request' || needs.changes.outputs.frontend_changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: Set up canonical Python
        uses: ./.github/actions/setup-python

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            web-client/package-lock.json
            config/openapi/package-lock.json

      - name: 💾 Cache OpenAPI Dependencies
        id: cache-openapi
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: config/openapi/node_modules
          key: openapi-node-${{ hashFiles('.node-version', 'config/openapi/package-lock.json') }}

      - name: 📦 Install OpenAPI Dependencies
        if: steps.cache-openapi.outputs.cache-hit != 'true'
        run: npm --prefix config/openapi ci

      - name: 📑 Lint OpenAPI Specs
        run: npm --prefix config/openapi run openapi:lint

      - name: 💾 Cache Web Client Dependencies
        id: cache-web-client
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web-client/node_modules
          key: web-client-node-${{ hashFiles('.node-version', 'web-client/package-lock.json') }}

      - name: 📦 Install Frontend Dependencies
        if: steps.cache-web-client.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web-client

      - name: 🛠 Run Frontend Lint and Format Check
        run: |
          npm run lint
          npm run format -- -c
        working-directory: web-client

      - name: Install pinned Chrome for Testing and ChromeDriver
        env:
          CHROME_FOR_TESTING_VERSION: ${{ steps.workflow-tool-versions.outputs.chrome-for-testing-version }}
          CHROME_FOR_TESTING_SHA256: ${{ steps.workflow-tool-versions.outputs.chrome-for-testing-linux-x86-64-sha256 }}
          CHROMEDRIVER_VERSION: ${{ steps.workflow-tool-versions.outputs.chromedriver-version }}
          CHROMEDRIVER_SHA256: ${{ steps.workflow-tool-versions.outputs.chromedriver-linux-x86-64-sha256 }}
        run: |
          set -euo pipefail
          [[ "$(uname -s)/$(uname -m)" == "Linux/x86_64" ]] || { echo "Unsupported Chrome for Testing platform" >&2; exit 1; }
          [[ "$CHROME_FOR_TESTING_VERSION" == "$CHROMEDRIVER_VERSION" ]] || { echo "Chrome and ChromeDriver versions differ" >&2; exit 1; }
          chrome_archive="${RUNNER_TEMP:?}/chrome-linux64-${CHROME_FOR_TESTING_VERSION}.zip"
          driver_archive="${RUNNER_TEMP:?}/chromedriver-linux64-${CHROMEDRIVER_VERSION}.zip"
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 120 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FOR_TESTING_VERSION}/linux64/chrome-linux64.zip" \
            -o "$chrome_archive"
          echo "${CHROME_FOR_TESTING_SHA256}  ${chrome_archive}" | sha256sum --check --status
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip" \
            -o "$driver_archive"
          echo "${CHROMEDRIVER_SHA256}  ${driver_archive}" | sha256sum --check --status
          chrome_dir="${RUNNER_TEMP}/chrome-for-testing-${CHROME_FOR_TESTING_VERSION}"
          driver_dir="${RUNNER_TEMP}/chromedriver-for-testing-${CHROMEDRIVER_VERSION}"
          mkdir -p "$chrome_dir" "$driver_dir"
          unzip -q "$chrome_archive" -d "$chrome_dir"
          unzip -q "$driver_archive" -d "$driver_dir"
          chrome_path="$chrome_dir/chrome-linux64/chrome"
          chromedriver_path="$driver_dir/chromedriver-linux64/chromedriver"
          chrome_bin_dir="${RUNNER_TEMP}/pinned-chrome-bin"
          mkdir -p "$chrome_bin_dir"
          ln -s "$chrome_path" "$chrome_bin_dir/google-chrome"
          export PATH="$chrome_bin_dir:$PATH"
          echo "$chrome_bin_dir" >> "$GITHUB_PATH"
          {
            echo "CHROMEDRIVER_PATH=$chromedriver_path"
            echo "CHROME_PATH=$chrome_path"
            echo "CHROME_BIN_DIR=$chrome_bin_dir"
          } >> "$GITHUB_ENV"
          [[ "$(command -v google-chrome)" == "$chrome_bin_dir/google-chrome" ]] || { echo "Pinned Chrome wrapper was not selected" >&2; exit 1; }
          [[ "$(google-chrome --product-version)" == "$CHROME_FOR_TESTING_VERSION" ]] || { echo "Pinned Chrome version mismatch" >&2; exit 1; }
          [[ "$("$chromedriver_path" --version | awk '{print $2}')" == "$CHROMEDRIVER_VERSION" ]] || { echo "Pinned ChromeDriver version mismatch" >&2; exit 1; }

      - name: ♿ Run Accessibility Audit
        run: |
          cd web-client
          npm run build
          npx serve dist -l 5000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx wait-on http://localhost:5000/index.html
          [[ "$(command -v google-chrome)" == "$CHROME_BIN_DIR/google-chrome" ]]
          [[ "$("$CHROME_PATH" --product-version)" == "${{ steps.workflow-tool-versions.outputs.chrome-for-testing-version }}" ]]
          npx axe http://localhost:5000/index.html --chromedriver-path "$CHROMEDRIVER_PATH" --chrome-path "$CHROME_PATH" --chrome-options="--no-sandbox" --exit

  # Gradle module validation matrix
  build-and-test:
    name: Build and Test (${{ matrix.module }} / ${{ matrix.partition }})
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.affected_modules != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Allow 90 minutes for the full Game Session native issuer suites; retain Account 60, World 40 and Game Design 30.
    timeout-minutes: ${{ matrix.module == 'game-session-service' && 90 || matrix.module == 'account-service' && 60 || matrix.module == 'world-management-service' && 40 || matrix.module == 'game-design-service' && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.module_check_matrix) }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: ⚙️ Set Up Python for Combined Coverage Verification
        if: ${{ matrix.module == 'common-saga' }}
        uses: ./.github/actions/setup-python
        with:
          requirements: none

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      # Cached negative Spring Boot 4.1.1 resolution requires metadata revalidation (CI 37847761035).
      - name: 🧪 Run Gradle Checks
        id: checks
        run: |
          echo "::group::Run Module Validation"
          bash ./.github/scripts/run-gradle-module-checks.sh '${{ matrix.module }}' '${{ matrix.partition }}'
          echo "::endgroup::"

      - name: 📦 Build Runtime JAR
        if: ${{ contains(fromJSON(needs.changes.outputs.bootable_modules), matrix.module) && (matrix.module != 'account-service' && matrix.module != 'game-session-service' || matrix.partition == '1') }}
        run: ./gradlew --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2500m -Dfile.encoding=UTF-8' :${{ matrix.module }}:bootJar -PfullCheck

      - name: 📈 Parse Coverage %
        id: coverage
        env:
          MODULE_DIR: ${{ matrix.module == 'load-testing' && 'dev-tools/load-testing' || format('services/{0}', matrix.module) }}
        run: |
          COVERAGE_FILE="$MODULE_DIR/build/reports/jacoco/test/jacocoTestReport.xml"
          if [ -f "$COVERAGE_FILE" ]; then
            COVERAGE_LINE=$(grep -A 1 "<counter type=\"LINE\"" "$COVERAGE_FILE" | tail -n 1 || true)
            MISSED=$(echo "$COVERAGE_LINE" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p')
            COVERED=$(echo "$COVERAGE_LINE" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p')
            TOTAL=$((MISSED + COVERED))
            if [ "$TOTAL" -gt 0 ]; then
              PERCENT=$((100 * COVERED / TOTAL))
            else
              PERCENT=0
            fi
          else
            echo "Coverage file not found" >&2
            PERCENT=0
          fi
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"

      - name: 🔎 Verify Combined Unit and Integration Coverage
        if: ${{ matrix.module == 'common-saga' && matrix.partition == 'full' }}
        run: |
          python3 dev-tools/validation/validate-jacoco-combined-report.py \
            --report services/common-saga/build/reports/jacoco/test/jacocoTestReport.xml \
            --require-covered-class net/firedevops/firemud/common/saga/SagaRunner \
            --require-covered-class net/firedevops/firemud/common/saga/persistence/SagaInstanceRepository \
            --require-covered-method net/firedevops/firemud/common/saga/persistence/SagaInstanceRepository#findAll

      - name: 📤 Upload Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-${{ matrix.module }}-${{ matrix.partition }}-report-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ matrix.module == 'load-testing' && 'dev-tools/load-testing/build/reports/jacoco/test/' || format('services/{0}/build/reports/jacoco/test/', matrix.module) }}

      - name: ☂️ Upload Coverage to Codecov
        continue-on-error: true
        # Optional coverage upload must leave time for required proof artifacts.
        timeout-minutes: 2
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          handle_no_reports_found: true
          disable_search: true
          files: ${{ matrix.module == 'load-testing' && 'dev-tools/load-testing/build/reports/jacoco/test/jacocoTestReport.xml' || format('services/{0}/build/reports/jacoco/test/jacocoTestReport.xml', matrix.module) }}
          flags: ${{ matrix.module }}
          name: ${{ matrix.module }}-${{ matrix.partition }}-jacoco
          verbose: true

      - name: 📤 Upload Test Logs if Failed
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-logs-${{ matrix.module }}-${{ matrix.partition }}-${{ github.sha }}
          path: ${{ matrix.module == 'load-testing' && 'dev-tools/load-testing/build/reports/tests/' || format('services/{0}/build/reports/tests/', matrix.module) }}

      - name: 📤 Upload JUnit Test Results
        if: ${{ always() && matrix.module != 'account-service' && matrix.module != 'game-session-service' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: junit-${{ matrix.module }}-${{ matrix.partition }}-results-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ matrix.module == 'load-testing' && 'dev-tools/load-testing/build/test-results/**/*.xml' || format('services/{0}/build/test-results/**/*.xml', matrix.module) }}
          if-no-files-found: warn
          retention-days: 14

      - name: 📤 Upload Slow-Service Partition Reports and Execution Data
        if: ${{ always() && (matrix.module == 'account-service' || matrix.module == 'game-session-service') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: slow-service-ci-partition-${{ github.run_id }}-${{ github.sha }}-attempt-${{ github.run_attempt }}-${{ matrix.module }}-partition-${{ matrix.partition }}
          path: |
            services/${{ matrix.module }}/build/slow-service-ci-partition/${{ matrix.module }}/partition-${{ matrix.partition }}/
            services/${{ matrix.module }}/build/jacoco/*.exec
            services/${{ matrix.module }}/build/reports/jacoco/test/
            services/${{ matrix.module }}/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Gradle Task Profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gradle-profile-${{ matrix.module }}-${{ matrix.partition }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            build/reports/profile/
            build/reports/compile-failure/${{ matrix.module }}/
          if-no-files-found: warn
          retention-days: 14

  account-coverage-aggregate:
    name: Account Coverage Aggregate
    needs: [changes, build-and-test]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && contains(fromJSON(needs.changes.outputs.affected_modules || '[]'), 'account-service') && needs.build-and-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out Account source for complete coverage aggregation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: 🐍 Set Up Python
        uses: ./.github/actions/setup-python
        with:
          requirements: none

      - name: Capture Account partition job and artifact provenance
        id: provenance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF_NAME: ${{ github.ref_name }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_NATIVE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_PROVENANCE_PATH: services/account-service/build/slow-service-ci-partition-provenance.json
        with:
          script: |
            const fs = require("node:fs");
            const runId = Number(process.env.CI_RUN_ID);
            const runAttempt = Number(process.env.CI_RUN_ATTEMPT);
            const eventName = process.env.CI_EVENT_NAME;
            const refName = process.env.CI_REF_NAME;
            const testedSourceSha = process.env.CI_SOURCE_SHA;
            const nativeHeadSha = process.env.CI_NATIVE_HEAD_SHA;
            const shaPattern = /^[0-9a-f]{40}$/;
            const isPullRequest = eventName === "pull_request";
            if (context.eventName !== eventName || context.sha !== testedSourceSha ||
                !shaPattern.test(testedSourceSha || "") ||
                !shaPattern.test(nativeHeadSha || "")) {
              throw new Error("Workflow event or tested/native source identity is malformed.");
            }
            let pullRequest = null;
            let expectedRunTitle = null;
            if (isPullRequest) {
              const eventPullRequest = context.payload?.pull_request;
              const number = eventPullRequest?.number;
              const baseSha = eventPullRequest?.base?.sha;
              const headSha = eventPullRequest?.head?.sha;
              if (!Number.isSafeInteger(number) || number <= 0 || !shaPattern.test(baseSha || "") ||
                  !shaPattern.test(headSha || "") || headSha !== nativeHeadSha) {
                throw new Error("Trusted pull-request event identity does not match the native head.");
              }
              expectedRunTitle = `CI — Validation pr-${number} base-${baseSha} head-${headSha}`;
              pullRequest = { number, base_sha: baseSha, head_sha: headSha };
            } else {
              if (!["push", "workflow_dispatch"].includes(eventName) || nativeHeadSha !== testedSourceSha ||
                  typeof refName !== "string" || !refName) {
                throw new Error("Non-pull-request runs must test their native workflow head and ref.");
              }
              expectedRunTitle = `CI — Validation ${refName}`;
            }
            const run = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId })).data;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (run.id !== runId || run.head_sha !== nativeHeadSha ||
                run.run_attempt !== runAttempt || run.path !== ".github/workflows/ci.yml" ||
                run.name !== expectedRunTitle || run.event !== eventName ||
                run.repository?.full_name !== repository ||
                run.display_title !== expectedRunTitle) {
              throw new Error("Current workflow run identity does not match the event source.");
            }
            let apiPullRequests = [];
            if (isPullRequest) {
              if (!Array.isArray(run.pull_requests) || run.pull_requests.length > 1) {
                throw new Error("Current workflow pull-request association is unavailable or ambiguous.");
              }
              apiPullRequests = run.pull_requests.map(association => ({
                number: association.number,
                base_sha: association.base?.sha,
                head_sha: association.head?.sha,
              }));
              if (apiPullRequests.length === 1 &&
                  (apiPullRequests[0].number !== pullRequest.number ||
                   apiPullRequests[0].base_sha !== pullRequest.base_sha ||
                   apiPullRequests[0].head_sha !== pullRequest.head_sha)) {
                throw new Error("Current workflow pull-request association does not match the event.");
              }
            }
            async function listCompletePages(request, params, rowsKey, description) {
              const items = [];
              let totalCount;
              for (let page = 1; page <= 100; page += 1) {
                const { data } = await request({ ...context.repo, ...params, page, per_page: 100 });
                const count = data?.total_count;
                const rows = data?.[rowsKey];
                if (!Number.isSafeInteger(count) || count < 0 || !Array.isArray(rows) ||
                    (totalCount !== undefined && totalCount !== count) || items.length > count) {
                  throw new Error(`Invalid ${description} pagination metadata.`);
                }
                totalCount = count;
                const expected = Math.min(100, count - items.length);
                if (rows.length !== expected) throw new Error(`Incomplete ${description} page ${page}.`);
                items.push(...rows);
                if (items.length === totalCount) return { total_count: totalCount, items };
              }
              throw new Error(`Exceeded the ${description} pagination bound.`);
            }
            const attempts = [];
            for (let attempt = 1; attempt <= runAttempt; attempt += 1) {
              const params = { run_id: runId, attempt_number: attempt };
              const snapshot = await listCompletePages(
                request => github.rest.actions.listJobsForWorkflowRunAttempt(request),
                params,
                "jobs",
                `attempt ${attempt} job`,
              );
              attempts.push({
                attempt,
                total_count: snapshot.total_count,
                jobs: snapshot.items.map(job => ({
                  id: job.id, run_id: job.run_id, head_sha: job.head_sha, name: job.name,
                  status: job.status, conclusion: job.conclusion,
                  started_at: job.started_at, completed_at: job.completed_at,
                })),
              });
            }
            const artifactSnapshot = await listCompletePages(
              request => github.rest.actions.listWorkflowRunArtifacts(request),
              { run_id: runId },
              "artifacts",
              "workflow artifact",
            );
            const artifacts = artifactSnapshot.items;
            fs.mkdirSync(require("node:path").dirname(process.env.CI_PROVENANCE_PATH), { recursive: true });
            fs.writeFileSync(process.env.CI_PROVENANCE_PATH, JSON.stringify({
              run: {
                id: run.id, head_sha: run.head_sha, tested_source_sha: testedSourceSha,
                event: run.event, event_name: eventName,
                pull_request: pullRequest, api_pull_requests: apiPullRequests,
                display_title: run.display_title, api_name: run.name,
                repository: run.repository?.full_name,
                run_attempt: run.run_attempt, path: run.path, name: "CI — Validation",
              },
              attempts,
              artifacts: {
                total_count: artifactSnapshot.total_count,
                items: artifacts.map(artifact => ({
                  id: artifact.id, name: artifact.name, expired: artifact.expired,
                  size_in_bytes: artifact.size_in_bytes, created_at: artifact.created_at,
                  workflow_run: artifact.workflow_run,
                })),
              },
            }));

      - name: Select Account artifacts from latest effective job outcomes
        id: selection
        env:
          PROVENANCE_PATH: services/account-service/build/slow-service-ci-partition-provenance.json
          SELECTION_PATH: services/account-service/build/slow-service-ci-partition-selection.json
        run: |
          python3 dev-tools/validation/slow_service_ci_test_partition.py select-artifacts \
            --module account-service \
            --run-id "$GITHUB_RUN_ID" \
            --source-revision "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --provenance-json "$PROVENANCE_PATH" \
            --selection-json "$SELECTION_PATH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download both effective Account partition artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.selection.outputs.artifact_ids }}
          path: services/account-service/build/slow-service-ci-partition-inputs
          merge-multiple: false

      - name: Verify complete Account partition and report union
        run: |
          python3 dev-tools/validation/slow_service_ci_test_partition.py verify-aggregate \
            --module account-service \
            --input-dir services/account-service/build/slow-service-ci-partition-inputs \
            --selection-json services/account-service/build/slow-service-ci-partition-selection.json \
            --run-id "$GITHUB_RUN_ID" \
            --source-revision "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: ⚙️ Set Up Java for Account Coverage Aggregation
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: ⚙️ Set Up Gradle for Account Coverage Aggregation
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Merge complete Account JaCoCo coverage
        run: ./gradlew --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2500m -Dfile.encoding=UTF-8' :account-service:jacocoTestReport -PfullCheck -PslowServiceCiCoverageAggregate=account-service

      - name: 📤 Upload Complete Account Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-account-service-complete-report-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: services/account-service/build/reports/jacoco/test/
          if-no-files-found: error
          retention-days: 14

