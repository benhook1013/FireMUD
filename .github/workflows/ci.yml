name: CI — Build and Security

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3am UTC

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (Java ${{ matrix.java-version }}, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        java-version: [21]
        node-version: [20]

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: 💾 Cache Node Modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: node-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      - name: ⚙️ Set Up Gradle
        uses: gradle/gradle-build-action@v2

      - name: 🎨 Apply Spotless Formatting
        run: |
          echo "::group::Run Spotless"
          ./gradlew spotlessApply
          echo "::endgroup::"
      - name: 🧹 Fix Markdown Lint
        run: |
          echo "::group::Lint Markdown"
          ./gradlew lintMarkdownFix
          echo "::endgroup::"

      - name: 🧪 Run Unit Tests
        id: checks
        run: |
          echo "::group::Run Tests"
          ./gradlew check
          echo "::endgroup::"
      - name: 📈 Parse Coverage %
        id: coverage
        run: |
          COVERAGE_FILE=build/reports/jacoco/test/jacocoTestReport.xml
          if [ -f "$COVERAGE_FILE" ]; then
            COVERAGE_LINE=$(grep -A 1 "<counter type=\"LINE\"" "$COVERAGE_FILE" | tail -n 1 || true)
            MISSED=$(echo "$COVERAGE_LINE" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p')
            COVERED=$(echo "$COVERAGE_LINE" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p')
            TOTAL=$((MISSED + COVERED))
            if [ "$TOTAL" -gt 0 ]; then
              PERCENT=$((100 * COVERED / TOTAL))
            else
              PERCENT=0
            fi
          else
            echo "Coverage file not found" >&2
            PERCENT=0
          fi
          echo "percent=$PERCENT" >> $GITHUB_OUTPUT
          echo "### 📊 Code coverage: **$PERCENT%**" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report-${{ github.sha }}
          path: build/reports/jacoco/test/

      - name: 📤 Upload Test Logs if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.sha }}
          path: build/reports/tests/test/


      - name: 💬 Upload Build Summary Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const coverage = Number("${{ steps.coverage.outputs.percent }}");
            const testPassed = "${{ steps.checks.outcome }}" === "success";

            const summaryLines = [
              `### 🧪 Build Summary`,
              testPassed ? "✅ All tests passed" : "❌ Some tests failed (see logs)",
              "🧼 Lint + format steps completed",
              `📊 Code coverage: **${coverage}%**`,
              ""
            ];

            const body = summaryLines.join('\n');

            core.summary.addHeading("🧪 Build Summary");
            core.summary.addRaw(body).write();

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(comment =>
              comment.body.startsWith('### 🧪 Build Summary')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3
      - name: 💾 Cache Trivy DB
        uses: actions/cache@v3
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/package-lock.json') }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: 🛡️ Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.1
      - name: 🔍 Run Trivy and Save Report
        if: always()
        continue-on-error: false
        run: |
          echo "::group::Run Trivy"
          trivy fs --config .trivy.yaml . | tee trivy-report.txt
          echo "::endgroup::"
      - name: 📤 Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report.txt
      - name: 💬 Upload Trivy Report as PR Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = 'trivy-report.txt';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'Trivy report not available.';

            const hasVulnerabilities =
              /Total:\s+[1-9]/.test(report) || /CRITICAL|HIGH/.test(report);

            const summary = hasVulnerabilities
              ? "❌ Critical/High vulnerabilities detected"
              : "✅ No critical/high vulnerabilities found";

            const body = `### 🔍 Trivy Security Scan Report\n**${summary}**\n\n\`\`\n${report}\n\`\``;

            core.summary.addHeading("🔍 Trivy Security Scan");
            core.summary.addRaw(summary).write();

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(comment =>
              comment.body.startsWith('### 🔍 Trivy Security Scan Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

