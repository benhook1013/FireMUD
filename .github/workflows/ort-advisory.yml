name: Weekly ORT Advisory Scan

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sundays at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  ORT_DOCKER_IMAGE: ghcr.io/oss-review-toolkit/ort:89.2.0

concurrency:
  group: ort-advisory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ort-advisory:
    name: Weekly ORT Advisory Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Use HTTPS for Git
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            config/openapi/package-lock.json
            web-client/package-lock.json

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Run ORT advisory scan
        id: ort
        continue-on-error: true
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1
        with:
          image: ${{ env.ORT_DOCKER_IMAGE }}
          ort-cli-args: '-P ort.analyzer.enabledPackageManagers=Gradle,NPM'
          run: 'cache-dependencies,labels,analyzer,evaluator,advisor,reporter,upload-results'
          fail-on: 'violations'
          report-formats: 'CycloneDx,WebApp'
          ort-cli-report-args: '-O CycloneDX=output.file.formats=json,xml'

      - name: Upload ORT advisory results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ort-advisory-result-${{ github.sha }}
          path: ${{ steps.ort.outputs.results-path }}
