name: Dependabot Auto Merge

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  dependabot-auto-merge:
    name: Dependabot Auto Merge
    runs-on: ubuntu-latest
    steps:
      - name: Check repository auto-merge setting
        id: repo-settings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auto_merge_allowed="$(
            gh api graphql -f query='
              query {
                repository(owner: "benhook1013", name: "FireMUD") {
                  autoMergeAllowed
                }
              }
            ' --jq '.data.repository.autoMergeAllowed'
          )"

          echo "auto_merge_allowed=${auto_merge_allowed}" >> "$GITHUB_OUTPUT"

          if [ "$auto_merge_allowed" != "true" ]; then
            echo "::notice title=Dependabot auto-merge skipped::Repository auto-merge is disabled, so this workflow will not call gh pr merge --auto."
          fi

      - name: Enable auto-merge for open Dependabot PRs
        if: steps.repo-settings.outputs.auto_merge_allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list \
            --repo benhook1013/FireMUD \
            --state open \
            --search 'author:app/dependabot sort:updated-desc' \
            --json url,isDraft \
            --jq '.[] | select(.isDraft == false) | .url' \
          | while IFS= read -r pr_url; do
              if [ -n "$pr_url" ]; then
                gh pr merge --auto --merge "$pr_url" || true
              fi
            done
