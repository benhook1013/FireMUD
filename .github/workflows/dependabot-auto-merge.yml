name: Dependabot Auto-Merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for Dependabot PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            // Only auto-merge into main and non-draft PRs
            if (pr.base.ref !== 'main' || pr.draft) {
              core.info(`Skipping PR #${pr.number} (base=${pr.base.ref}, draft=${pr.draft})`);
              return;
            }

            try {
              await github.graphql(
                `mutation($prId: ID!) {
                  enablePullRequestAutoMerge(
                    input: { pullRequestId: $prId, mergeMethod: MERGE }
                  ) {
                    pullRequest { number }
                  }
                }`,
                { prId: pr.node_id }
              );
              core.info(`Enabled auto-merge for Dependabot PR #${pr.number}`);
            } catch (error) {
              core.warning(`Failed to enable auto-merge for PR #${pr.number}: ${error.message}`);
            }
