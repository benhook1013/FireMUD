name: Security Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Security-Relevant Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Classify the complete pull-request file list.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
    outputs:
      lightweight_only: ${{ steps.compute.outputs.lightweight_only }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Check out change classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Compute security scope
        id: compute
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("node:fs");
            const classifierPath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/classify-change-scope.cjs`;
            if (fs.existsSync(classifierPath)) {
              const { classifyGithubChangeScope } = require(classifierPath);
              const scope = await classifyGithubChangeScope(github, context);
              core.setOutput("lightweight_only", String(scope.lightweightOnly));
            } else {
              core.warning("Base revision predates the change classifier; running the complete security scope.");
              core.setOutput("lightweight_only", "false");
            }

  trivy-scan:
    name: Trivy Filesystem Scan
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.lightweight_only != 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            config/openapi/package-lock.json
            web-client/package-lock.json

      - name: 💾 Cache OpenAPI Dependencies
        id: cache-openapi
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: config/openapi/node_modules
          key: openapi-node-modules-${{ runner.os }}-${{ hashFiles('config/openapi/package-lock.json') }}
          restore-keys: openapi-node-modules-${{ runner.os }}-

      - name: 📦 Install OpenAPI Dependencies
        if: steps.cache-openapi.outputs.cache-hit != 'true'
        run: npm --prefix config/openapi ci

      - name: 💾 Cache Web Client Dependencies
        id: cache-web-client
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web-client/node_modules
          key: web-client-node-modules-${{ runner.os }}-${{ hashFiles('web-client/package-lock.json') }}
          restore-keys: web-client-node-modules-${{ runner.os }}-

      - name: 📦 Install Web Client Dependencies
        if: steps.cache-web-client.outputs.cache-hit != 'true'
        run: npm --prefix web-client ci

      - name: 💾 Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/package-lock.json') }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: 🛡️ Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trivy --version

      - name: 🔍 Run Trivy and Save Report
        run: |
          echo "::group::Run Trivy"
          trivy fs --config config/security/trivy.yaml . | tee trivy-report.txt
          echo "::endgroup::"

      - name: 📤 Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report.txt

  secret-compliance:
    name: Secret Compliance Validation
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
    uses: ./.github/workflows/validate-secret-compliance.yml
    with:
      enforcement_mode: ${{ github.event_name == 'pull_request' && 'strict' || 'advisory' }}
      warning_window_days: 14

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      checks: read # Preserve a prior successful required context on metadata-only edits.
      contents: read # Check out the shared required-gate composite action.
    needs: [changes, trivy-scan, secret-compliance]
    if: ${{ always() }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Check out required-gate action
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Preserve successful required gate on metadata-only edit
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null }}
        uses: ./.github/actions/preserve-required-gate
        with:
          gate-name: Security Gate

      - name: Enforce security success
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LIGHTWEIGHT_ONLY: ${{ needs.changes.outputs.lightweight_only }}
          TRIVY_SCAN: ${{ needs.trivy-scan.result }}
          SECRET_COMPLIANCE: ${{ needs.secret-compliance.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Security change detection did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          echo "Trivy Filesystem Scan => $TRIVY_SCAN"
          echo "Secret Compliance Validation => $SECRET_COMPLIANCE"
          if [ "$LIGHTWEIGHT_ONLY" = "true" ]; then
            if [ "$TRIVY_SCAN" != "skipped" ] && [ "$TRIVY_SCAN" != "success" ]; then
              echo "Security Gate received an unexpected Trivy result for the lightweight path." >&2
              exit 1
            fi
            if [ "$SECRET_COMPLIANCE" != "success" ]; then
              echo "Security Gate failed because secret compliance validation did not succeed." >&2
              exit 1
            fi
            exit 0
          fi
          if [ "$TRIVY_SCAN" != "success" ]; then
            echo "Security Gate failed because the filesystem Trivy scan did not succeed." >&2
            exit 1
          fi
          if [ "$SECRET_COMPLIANCE" != "success" ]; then
            echo "Security Gate failed because secret compliance validation did not succeed." >&2
            exit 1
          fi

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Publishes the consolidated security result on the PR.
    needs: [changes, trivy-scan, secret-compliance, security-gate]
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: 💬 Publish Security Summary Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const failureResults = ["failure", "cancelled", "timed_out", "action_required"];
            const statusIcon = (value) => {
              if (value === "success") return "✅";
              if (value === "cancelled") return "⚪";
              if (failureResults.includes(value)) return "❌";
              return "⏭️";
            };

            const checks = [
              ["Security gate", "${{ needs.security-gate.result }}"],
              ["Trivy filesystem scan", "${{ needs.trivy-scan.result }}"],
              ["Secret compliance validation", "${{ needs.secret-compliance.result }}"],
            ];

            const failedChecks = checks.filter(([, result]) => failureResults.includes(result));
            const headline = failedChecks.length === 0
              ? "✅ Security checks passed or were intentionally skipped"
              : "❌ Security checks failed";

            const body = [
              "### Security Summary",
              headline,
              "",
              ...checks.map(([name, result]) => `- ${statusIcon(result)} ${name}: \`${result}\``),
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const summaryComments = comments.filter(comment =>
              comment.body.startsWith("### Security Summary")
            );
            const existing = summaryComments[0];

            if (summaryComments.length > 1) {
              for (const comment of summaryComments.slice(1)) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                });
              }
            }

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }
