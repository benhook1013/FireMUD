name: Release Notes

on:
  push:
    tags:
      - 'v*.*.*'

env:
  ORT_DOCKER_IMAGE: ghcr.io/oss-review-toolkit/ort:89.2.0

jobs:
  generate-release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: ⚙️ Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            config/openapi/package-lock.json
            web-client/package-lock.json

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: 📅 Resolve release dates
        id: release_dates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published_at="$(gh release view "${{ github.ref_name }}" --json publishedAt --jq .publishedAt 2>/dev/null || true)"
          if [ -n "$published_at" ] && [ "$published_at" != "null" ]; then
            release_date="$(printf '%s' "$published_at" | cut -dT -f1)"
          else
            release_date="$(date -u +%F)"
          fi
          printf 'release_date=%s\n' "$release_date" >> "$GITHUB_OUTPUT"

      - name: 📄 Generate release NOTICE
        run: |
          python3 dev-tools/release/generate_notice.py \
            --template NOTICE.template.md \
            --release-date "${{ steps.release_dates.outputs.release_date }}" \
            --output build/release-assets/NOTICE.md

      - name: 📚 Generate release license notices
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1
        with:
          image: ${{ env.ORT_DOCKER_IMAGE }}
          ort-cli-args: '-P ort.analyzer.enabledPackageManagers=Gradle,NPM'
          run: 'cache-dependencies,labels,analyzer,evaluator,reporter,upload-results'
          fail-on: policy-violation
          report-formats: 'PlainTextTemplate,CycloneDx'
          ort-cli-report-args: '-O PlainTextTemplate=template.id=NOTICE_DEFAULT,NOTICE_SUMMARY -O CycloneDX=output.file.formats=json,xml'

      - name: 🗂️ Assemble /licenses directory
        run: |
          python3 dev-tools/release/assemble_licenses_dir.py \
            --ort-results "${{ steps.ort.outputs.results-path }}" \
            --output-dir build/release-assets/licenses

      - name: 🧳 Archive release artifacts
        run: |
          cd build/release-assets
          zip -r "firemud-${{ github.ref_name }}-licenses.zip" licenses
          zip -r "firemud-${{ github.ref_name }}-release-compliance.zip" NOTICE.md licenses

      - name: 📝 Create GitHub Release with Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "Release ${{ github.ref_name }}"
          else
            gh release create "${{ github.ref_name }}" \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes
          fi

      - name: 📦 Upload release NOTICE asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            build/release-assets/NOTICE.md#NOTICE.md \
            --clobber

      - name: 📦 Upload release /licenses asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "build/release-assets/firemud-${{ github.ref_name }}-licenses.zip#firemud-${{ github.ref_name }}-licenses.zip" \
            --clobber

      - name: 📦 Upload release compliance bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "build/release-assets/firemud-${{ github.ref_name }}-release-compliance.zip#firemud-${{ github.ref_name }}-release-compliance.zip" \
            --clobber
