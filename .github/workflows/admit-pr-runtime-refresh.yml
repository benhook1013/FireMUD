name: Admit PR Runtime Refresh

on:
  repository_dispatch:
    types: [pr-runtime-base-refresh-request]

permissions: {}

jobs:
  dispatch:
    name: Admit Exact Runtime Tuple
    if: ${{ github.event.action == 'pr-runtime-base-refresh-request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    # Both trusted callbacks reserve the same tuple before observing or dispatching.
    concurrency:
      group: admit-pr-runtime-refresh-${{ github.event.client_payload.pr_number }}-${{ github.event.client_payload.base_sha }}-${{ github.event.client_payload.head_sha }}-${{ github.event.client_payload.merge_sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out the trusted admission workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Revalidate and admit the current tuple
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          BASE_REF: ${{ github.event.client_payload.base_ref }}
          BASE_SHA: ${{ github.event.client_payload.base_sha }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          MERGE_SHA: ${{ github.event.client_payload.merge_sha }}
        with:
          script: |
            const admit = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/admit-pr-runtime-refresh.cjs`);
            await admit({ github, context, core, input: {
              pr_number: process.env.PR_NUMBER,
              base_ref: process.env.BASE_REF,
              base_sha: process.env.BASE_SHA,
              head_sha: process.env.HEAD_SHA,
              merge_sha: process.env.MERGE_SHA,
            } });
