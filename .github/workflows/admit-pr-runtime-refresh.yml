name: Admit PR Runtime Refresh

on:
  repository_dispatch:
    types: [pr-runtime-base-refresh-request]

permissions: {}

jobs:
  dispatch:
    name: Admit Exact Runtime Tuple
    if: ${{ github.event.action == 'pr-runtime-base-refresh-request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    # Keep ordinary and preview-only intent in one non-replacing tuple queue.
    concurrency:
      group: admit-pr-runtime-refresh-${{ github.event.client_payload.pr_number }}-${{ github.event.client_payload.base_sha }}-${{ github.event.client_payload.head_sha }}-${{ github.event.client_payload.merge_sha }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out the trusted admission workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Revalidate and admit the current tuple
        id: admit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const admit = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/admit-pr-runtime-refresh.cjs`);
            await admit({github, context, core, input: context.payload.client_payload});

      - name: Runtime refresh unsent claim ${{ steps.admit.outputs.unsent_claim }}
        if: ${{ success() && steps.admit.outputs.unsent_claim != '' }}
        run: echo 'The verified preview claim owner stopped before invoking dispatch.'

      - name: Runtime refresh rejected claim ${{ steps.admit.outputs.rejected_claim }}
        if: ${{ success() && steps.admit.outputs.rejected_claim != '' }}
        run: echo 'GitHub definitively rejected the verified claim at dispatch validation.'

      - name: Runtime refresh pre-send-unavailable claim ${{ steps.admit.outputs['pre-send-unavailable_claim'] }}
        if: ${{ success() && steps.admit.outputs['pre-send-unavailable_claim'] != '' }}
        run: echo 'The verified claim owner could not recheck the exact comparison and stopped before invoking dispatch.'
