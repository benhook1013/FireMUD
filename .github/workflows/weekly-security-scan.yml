name: Weekly Security Scan

on:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Trivy container and dependency scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/my-org/my-service:latest
          exit-code: '1'
