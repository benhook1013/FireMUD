name: Weekly Security Scan

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sundays at 03:00 UTC
  workflow_dispatch:      # Enables manual trigger from GitHub Actions UI

jobs:
  trivy-scan:
    name: Trivy Scan for ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - automation-scripting-service
          - entity-management-service
          - game-design-service
          - game-logic-service
          - game-session-service
          - logging-admin-service
          - social-groups-service
          - spring-cloud-gateway
          - tcp-proxy-service
          - world-management-service
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: 💾 Cache Trivy DB
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/package-lock.json') }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: 🛡️ Trivy container and dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/benhook1013/${{ matrix.service }}:latest
          format: 'table'
          output: 'trivy-report.txt'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
