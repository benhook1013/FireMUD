      TESTCONTAINERS_CHECKS_DISABLE: 'false'
    steps:
    - name: Set isolated proof directories
      shell: bash
      run: |-
        set -euo pipefail
        printf 'PROOF_DIR=%s/genuine-retention-proof\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        printf 'SOURCE_DIRECTORY=%s/historical-source\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        printf 'MIGRATION_SOURCE_DIRECTORY=%s/migration-source\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        printf 'FIREMUD_RETAINED_POSITIVE_MIGRATION_DIRECTORY=%s/migration-source/services/account-service/src/main/resources/db/migration\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        mkdir "$RUNNER_TEMP/genuine-retention-proof"
    - name: Harden runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
      with:
        egress-policy: audit
    - name: Check out pinned genuine historical witness
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ce9ef1d817093bf11076d4aff30e6b996778b12e
        path: historical-source
        fetch-depth: 2
        persist-credentials: false
    - name: Check out pinned current migration source separately
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 123a4b9e82aa3ddbd15ebc3aa64f9470c2902b23
        path: migration-source
        sparse-checkout: services/account-service/src/main/resources/db/migration
        persist-credentials: false
    - name: Set up repository-pinned Python for isolated checkout
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version-file: historical-source/.python-version
    - name: Set up Java 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
      with:
        distribution: temurin
        java-version: '25'
    - name: Set up Gradle without caching or scan publication
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      with:
        cache-disabled: true
        build-scan-publish: false
    - name: Verify both immutable sources and Docker
      shell: bash
      run: |
        set -euo pipefail
        test ! -e "$SOURCE_DIRECTORY/services/account-service/build/test-results/integrationTest"
        cat > "$RUNNER_TEMP/verify-provenance.py" <<'PROOF_VERIFY_PROVENANCE_PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess
        import sys

        # Immutable expected manifest is embedded by the workflow renderer, not read from test output.
        EXPECTED = json.loads(os.environ['PROVENANCE_EXPECTED'])
        SOURCE = Path(os.environ['SOURCE_DIRECTORY']).resolve()
        MIGRATIONS = Path(os.environ['MIGRATION_SOURCE_DIRECTORY']).resolve()
        OUT = Path(os.environ['PROOF_DIR'])


        def git(root, *args, raw=False):
            data = subprocess.check_output(['git', '-C', str(root), *args])
            return data if raw else data.decode().strip()


        def sha(data):
            return hashlib.sha256(data).hexdigest()


        def check():
            expected = EXPECTED
            source_sha = os.environ['SOURCE_SHA']
            assert source_sha != '0' * 40, 'Parent must publish and pin the immutable witness source commit'
            assert git(SOURCE, 'rev-parse', 'HEAD') == source_sha
            assert git(SOURCE, 'rev-parse', 'HEAD^{tree}') == expected['candidate_tree']
            assert git(SOURCE, 'show', '-s', '--format=%P', 'HEAD') == expected['historical_commit']
            assert git(SOURCE, 'rev-parse', expected['historical_commit'] + '^{tree}') == expected['historical_tree']
            changed = git(SOURCE, 'diff-tree', '--no-commit-id', '--name-only', '-r', expected['historical_commit'], 'HEAD').splitlines()
            assert changed == expected['changed_paths'], ('unexpected historical source changes', changed)
            assert not git(SOURCE, 'status', '--porcelain', '--untracked-files=no'), 'tracked historical source changed'
            observed_source = []
            for item in expected['source_files']:
                path = item['path']
                data = (SOURCE / path).read_bytes()
                blob = git(SOURCE, 'rev-parse', 'HEAD:' + path)
                assert blob == item['postimage_blob'] == git(SOURCE, 'hash-object', path)
                assert sha(data) == item['postimage_sha256']
                old = git(SOURCE, 'show', expected['historical_commit'] + ':' + path, raw=True)
                assert sha(old) == item['preimage_sha256']
                assert git(SOURCE, 'rev-parse', expected['historical_commit'] + ':' + path) == item['preimage_blob']
                observed_source.append({'path': path, 'blob': blob, 'sha256': sha(data)})
            witness = (SOURCE / expected['changed_paths'][0]).read_text()
            old = git(SOURCE, 'show', expected['historical_commit'] + ':' + expected['changed_paths'][0], raw=True).decode()
            method = old.index('  void paymentRequiredSdkCreateCannotCommitUntilProviderConfirmsFirstInvoice()')
            body = old[old.index('    Fixture f = fixture("1032");', method):old.index('\n  }', method)]
            assert sha(body.encode()) == expected['producer_body_sha256'] and body in witness
            migration = expected['migrations']
            assert git(MIGRATIONS, 'rev-parse', 'HEAD') == migration['head']
            assert git(MIGRATIONS, 'rev-parse', 'HEAD^{tree}') == migration['tree']
            assert not git(MIGRATIONS, 'status', '--porcelain', '--untracked-files=no'), 'tracked migration source changed'
            relative_root = 'services/account-service/src/main/resources/db/migration/'
            directory = MIGRATIONS / relative_root
            assert directory == Path(os.environ['FIREMUD_RETAINED_POSITIVE_MIGRATION_DIRECTORY']).resolve()
            inventory = sorted(p.relative_to(directory).as_posix() for p in directory.rglob('*') if p.is_file())
            assert inventory == [item['relative_path'] for item in migration['files']]
            assert len(inventory) == 157
            digest = hashlib.sha256()
            observed_migrations = []
            for item in migration['files']:
                path = directory / item['relative_path']
                assert not path.is_symlink()
                data = path.read_bytes()
                assert sha(data) == item['sha256']
                assert git(MIGRATIONS, 'rev-parse', 'HEAD:' + item['path']) == item['git_blob']
                assert git(MIGRATIONS, 'hash-object', item['path']) == item['git_blob']
                digest.update(item['relative_path'].encode() + b'\0' + data + b'\0')
                observed_migrations.append({'path': item['path'], 'blob': item['git_blob'], 'sha256': sha(data)})
            assert digest.hexdigest() == migration['aggregate_sha256']
            old_inventory = git(SOURCE, 'ls-tree', '-r', '--name-only', expected['historical_commit'], '--', relative_root).splitlines()
            assert len(old_inventory) == 150
            for path in old_inventory:
                assert git(SOURCE, 'show', expected['historical_commit'] + ':' + path, raw=True) == (MIGRATIONS / path).read_bytes()
            return {'historical_commit': expected['historical_commit'], 'historical_tree': expected['historical_tree'],
                    'source_commit': source_sha, 'source_tree': expected['candidate_tree'],
                    'source_files': observed_source, 'migration_commit': migration['head'], 'migration_tree': migration['tree'],
                    'migration_files': observed_migrations, 'migration_aggregate_sha256': digest.hexdigest(),
                    'historical_migration_continuity': 150, 'producer_body_sha256': expected['producer_body_sha256']}


        if __name__ == '__main__':
            phase = sys.argv[1]
            assert phase in ('before', 'after')
            result = check()
            result['nonce'] = os.environ['GITHUB_RUN_ID'] + ':' + os.environ['GITHUB_RUN_ATTEMPT']
            (OUT / ('provenance-' + phase + '.json')).write_text(json.dumps(result, indent=2) + '\n')
            print('Verified historical source, genuine producer, all 157 current migrations and 150 unchanged predecessors: ' + phase)
        PROOF_VERIFY_PROVENANCE_PY
        cat > "$RUNNER_TEMP/capture-log.py" <<'PROOF_CAPTURE_LOG_PY'
        """Drain stdout without applying file-size limits to Gradle or dependency downloads."""
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import sys

        out = Path(os.environ['PROOF_DIR'])
        digest = hashlib.sha256()
        tail = bytearray()
        window = b''
        count = 0
        bad_task = False
        pattern = rb'^> Task :account-service:integrationTest (?:FROM-CACHE|UP-TO-DATE|SKIPPED|NO-SOURCE)'
        while True:
            block = sys.stdin.buffer.read(65536)
            if not block:
                break
            digest.update(block)
            count += len(block)
            window = window[-4096:] + block
            bad_task |= re.search(pattern, window, re.M) is not None
            tail.extend(block)
            del tail[:-262144]
        (out / 'gradle-tail.txt').write_bytes(tail)
        (out / 'gradle-log.json').write_text(json.dumps({'sha256': digest.hexdigest(), 'bytes': count,
            'retained_tail_bytes': len(tail), 'tail_limit_bytes': 262144,
            'cached_or_skipped_integration_task': bad_task, 'capture_complete': True}, indent=2) + '\n')
        PROOF_CAPTURE_LOG_PY
        cat > "$RUNNER_TEMP/collect-proof.py" <<'PROOF_COLLECT_PROOF_PY'
        import hashlib
        import importlib.util
        import json
        import os
        from pathlib import Path
        import sys
        import xml.etree.ElementTree as ET

        out = Path(os.environ['PROOF_DIR'])
        source = Path(os.environ['SOURCE_DIRECTORY'])
        nonce = os.environ['GITHUB_RUN_ID'] + ':' + os.environ['GITHUB_RUN_ATTEMPT']
        expected_pair = ['net.firedevops.firemud.accountservice.repository.AccountHostingSubscriptionDispatchPostgresIntegrationTest',
                         'genuineOldOwnerSurvivesV1046AndRefusesV1046Point1WithoutEvidenceRewrite']
        issues = []
        records = []
        originals = []
        compact = ET.Element('testsuite', name='genuine-retained-positive-physical-proof')
        sha = lambda data: hashlib.sha256(data).hexdigest()
        try:
            spec = importlib.util.spec_from_file_location('provenance', Path(__file__).with_name('verify-provenance.py'))
            module = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(module)
            after = module.check()
            after['nonce'] = nonce
            (out / 'provenance-after.json').write_text(json.dumps(after, indent=2) + '\n')
            before = json.loads((out / 'provenance-before.json').read_text())
            if before != after:
                issues.append('before/after source or migration provenance differs')
        except Exception as exc:
            issues.append('provenance failed: ' + str(exc)[:2048])
        result_dir = source / 'services/account-service/build/test-results/integrationTest'
        xmls = sorted(result_dir.glob('*.xml'))
        if len(xmls) != 1:
            issues.append('expected exactly one fresh JUnit XML file')
        for path in xmls:
            raw = path.read_bytes()
            originals.append({'file': path.name, 'sha256': sha(raw), 'bytes': len(raw)})
            try:
                tree = ET.fromstring(raw)
                if tree.tag != 'testsuite' or tree.get('tests') != '1':
                    issues.append('unexpected JUnit suite or test count')
                for key in ('failures', 'errors', 'skipped'):
                    if tree.get(key, '0') != '0':
                        issues.append('JUnit suite reports ' + key)
            except ET.ParseError:
                issues.append('invalid JUnit XML')
                continue
            for case in tree.iter('testcase'):
                name = case.get('name', '')
                method = name[:-2] if name.endswith('()') else name
                record = {'classname': case.get('classname'), 'method': method,
                          'skipped': case.find('skipped') is not None,
                          'failed': case.find('failure') is not None or case.find('error') is not None,
                          'seconds': case.get('time')}
                records.append(record)
                copied = ET.SubElement(compact, 'testcase', **case.attrib)
                for child in case:
                    if child.tag in ('failure', 'error', 'skipped'):
                        leaf = ET.SubElement(copied, child.tag, **{k: v[:4096] for k, v in child.attrib.items()})
                        leaf.text = (child.text or '')[:65536]
            # Retain exact original XML when small. Never silently call compact XML the original.
            if len(raw) <= 512 * 1024:
                (out / 'junit-original.xml').write_bytes(raw)
        if [[r['classname'], r['method']] for r in records] != [expected_pair]:
            issues.append('expected exactly the selected genuine method once, with no extras')
        if any(r['skipped'] or r['failed'] for r in records):
            issues.append('skipped, failed, aborted, or errored testcase')
        for marker in ('integration-started.txt', 'integration-completed.txt'):
            if not (out / marker).is_file() or (out / marker).read_text().strip() != nonce:
                issues.append('missing or stale task marker: ' + marker)
        try:
            events = [json.loads(line) for line in (out / 'test-events.jsonl').read_text().splitlines()]
        except Exception:
            events = []
        expected_events = [{'classname': expected_pair[0], 'method': expected_pair[1], 'phase': phase, 'nonce': nonce}
                           for phase in ('started', 'SUCCESS')]
        if events != expected_events:
            issues.append('expected exactly ordered fresh started and SUCCESS events for the selected method')
        for status in ('gradle-exit.txt', 'capture-exit.txt'):
            if not (out / status).is_file() or (out / status).read_text().strip() != '0':
                issues.append('missing or unsuccessful ' + status)
        try:
            log = json.loads((out / 'gradle-log.json').read_text())
            if not log.get('capture_complete') or log.get('cached_or_skipped_integration_task'):
                issues.append('incomplete log or cached/skipped integration task')
        except Exception:
            log = None
            issues.append('missing or invalid bounded log capture')
        compact.set('tests', str(len(records)))
        compact.set('failures', str(sum(r['failed'] for r in records)))
        compact.set('skipped', str(sum(r['skipped'] for r in records)))
        ET.ElementTree(compact).write(out / 'junit-compact.xml', encoding='utf-8', xml_declaration=True)
        summary = {'passed': not issues, 'issues': issues, 'requested_pairs': [expected_pair], 'cases': records,
                   'original_junit': originals, 'original_xml_retained': (out / 'junit-original.xml').is_file(),
                   'compact_xml_system_output_omitted': True, 'failure_text_limit': 65536, 'gradle_log': log,
                   'workflow_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                   'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'nonce': nonce,
                   'scope': 'controlled genuine historical ACTIVE, preservation to V1046, and atomic V1046.1 refusal only',
                   'not_proven': ['production Stripe', 'current owner execution', 'runtime registration',
                                  'finite retention policy', 'cleanup or erasure', 'backup/restore', 'admission']}
        (out / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
        files = sorted(p for p in out.iterdir() if p.is_file() and p.name != 'sha256sums.txt')
        assert files and all(not p.is_symlink() for p in files)
        (out / 'sha256sums.txt').write_text(''.join(sha(p.read_bytes()) + '  ' + p.name + '\n' for p in files))
        assert sum(p.stat().st_size for p in out.iterdir()) <= 2 * 1024 * 1024, 'proof exceeds 2 MiB'
        print(json.dumps(summary, indent=2))
        raise SystemExit(1 if issues else 0)
        PROOF_COLLECT_PROOF_PY
        cat > "$RUNNER_TEMP/genuine-retention.init.gradle" <<'PROOF_GENUINE_RETENTION_INIT_GRADLE'
        import org.gradle.api.tasks.testing.Test
        import groovy.json.JsonOutput

        def workspace = System.getenv('SOURCE_DIRECTORY')
        if (!workspace) {
            throw new GradleException('Proof requires SOURCE_DIRECTORY identity')
        }
        def proofRoot = new File(workspace).canonicalFile
        def isProofBuild = {
            gradle.rootProject.rootDir.canonicalFile == proofRoot
        }

        gradle.projectsEvaluated {
            if (!isProofBuild()) { return }
            def service = gradle.rootProject.findProject(':account-service')
            if (service == null) {
                throw new GradleException('Verified proof build lacks :account-service')
            }
            def target = service.tasks.named('integrationTest', Test).get()
            target.filter.failOnNoMatchingTests = true
            target.outputs.upToDateWhen { false }
            target.outputs.cacheIf { false }
            target.maxParallelForks = 1
            target.reports.junitXml.outputPerTestCase = true
            target.reports.junitXml.includeSystemOutLog = false
            target.reports.junitXml.includeSystemErrLog = false
            target.systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
            def event = { descriptor, phase ->
                def method = descriptor.name.replaceFirst(/\(\)$/, '')
                def entry = [classname: descriptor.className, method: method, phase: phase,
                    nonce: System.getenv('GITHUB_RUN_ID') + ':' + System.getenv('GITHUB_RUN_ATTEMPT')]
                new File(System.getenv('PROOF_DIR'), 'test-events.jsonl').append(JsonOutput.toJson(entry) + '\n')
            }
            target.beforeTest { descriptor -> event(descriptor, 'started') }
            target.afterTest { descriptor, result -> event(descriptor, result.resultType.toString()) }
            target.doFirst {
                new File(System.getenv('PROOF_DIR'), 'integration-started.txt').text = System.getenv('GITHUB_RUN_ID') + ':' + System.getenv('GITHUB_RUN_ATTEMPT') + '\n'
            }
            target.doLast {
                new File(System.getenv('PROOF_DIR'), 'integration-completed.txt').text = System.getenv('GITHUB_RUN_ID') + ':' + System.getenv('GITHUB_RUN_ATTEMPT') + '\n'
            }
        }
        gradle.taskGraph.whenReady { graph ->
            if (!isProofBuild()) { return }
            if (gradle.rootProject.findProject(':account-service') == null) {
                throw new GradleException('Verified proof build lacks :account-service')
            }
            def tests = graph.allTasks.findAll { it instanceof Test }
            if (tests.collect { it.path } != [':account-service:integrationTest']) {
                throw new GradleException('Proof requires exactly one integration Test task: ' + tests.collect { it.path })
            }
        }
        PROOF_GENUINE_RETENTION_INIT_GRADLE
        python3 "$RUNNER_TEMP/verify-provenance.py" before
        java -version 2> "$PROOF_DIR/java-version.txt"
        docker version --format '{{.Server.Version}}' > "$PROOF_DIR/docker-version.txt"
        docker info --format '{{.OSType}}' > "$PROOF_DIR/docker-os.txt"
        test "$(cat "$PROOF_DIR/docker-os.txt")" = linux
    - name: Run only the genuine historical physical method
      shell: bash
      working-directory: ${{ github.workspace }}/historical-source
      run: |
        set -euo pipefail
        # Stream-hash all output and retain only a bounded tail. Never set a process-wide file cap.
        set +e
        timeout --signal=TERM --kill-after=30s 15m \
          bash dev-tools/validation/run-gradle-with-dependency-recovery.sh --runner ./gradlew -- \
          --no-daemon --no-build-cache --no-configuration-cache --no-scan --rerun-tasks \
          --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2500m -Dfile.encoding=UTF-8' \
          --console=plain -I "$RUNNER_TEMP/genuine-retention.init.gradle" \
          :account-service:integrationTest -PfullCheck \
          --tests 'net.firedevops.firemud.accountservice.repository.AccountHostingSubscriptionDispatchPostgresIntegrationTest.genuineOldOwnerSurvivesV1046AndRefusesV1046Point1WithoutEvidenceRewrite' \
          2>&1 | python3 "$RUNNER_TEMP/capture-log.py"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf '%s\n' "${statuses[0]}" > "$PROOF_DIR/gradle-exit.txt"
        printf '%s\n' "${statuses[1]}" > "$PROOF_DIR/capture-exit.txt"
        tail -n 60 "$PROOF_DIR/gradle-tail.txt"
        test "${statuses[1]}" = 0
        exit "${statuses[0]}"
    - name: Require fresh non-skipped XML and events; reverify both sources
      if: ${{ always() }}
      shell: bash
      run: python3 "$RUNNER_TEMP/collect-proof.py"
    - name: Enforce compact artifact size
      id: bound
      if: ${{ always() }}
      shell: bash
      run: |
        python3 - <<'PYBOUND'
        import os
        from pathlib import Path
        p = Path(os.environ['PROOF_DIR'])
        files = list(p.glob('*'))
        assert files and all(f.is_file() and not f.is_symlink() for f in files), 'missing or unsupported proof files'
        assert sum(f.stat().st_size for f in files) <= 2 * 1024 * 1024, 'proof exceeds 2 MiB'
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('ok=true\n')
        PYBOUND
    - name: Upload compact physical qualification evidence
      if: ${{ always() && steps.bound.outputs.ok == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: genuine-retention-physical-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/genuine-retention-proof/
        if-no-files-found: error
        retention-days: 7
