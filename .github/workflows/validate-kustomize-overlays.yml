name: Validate Kustomize Overlays

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "k8s/**"
      - "design/operations/deployments/production/attestations/**"
      - "design/operations/deployments/production/backup-readiness/**"
      - "dev-tools/deploy/validate-kustomize-overlays.sh"
      - "dev-tools/deploy/preflight.py"
      - ".github/workflows/validate-kustomize-overlays.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: validate-kustomize-overlays-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required' }}
  cancel-in-progress: true

jobs:
  validate-overlays:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'PR Metadata Edit (validate-overlays)' || 'validate-overlays' }}
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up canonical Python dependencies
        uses: ./.github/actions/setup-python
        with:
          requirements: yaml

      - name: 🧰 Set up kubectl
        uses: ./.github/actions/setup-kubectl

      - name: 🐳 Set up Docker
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: 🔐 Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Validate overlays and image availability
        run: bash dev-tools/deploy/validate-kustomize-overlays.sh
