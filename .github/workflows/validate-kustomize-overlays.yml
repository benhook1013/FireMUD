name: Validate Kustomize Overlays

on:
  pull_request:
    paths:
      - "k8s/**"
      - "design/operations/deployments/production/attestations/**"
      - "design/operations/deployments/production/backup-readiness/**"
      - "dev-tools/deploy/validate-kustomize-overlays.sh"
      - "dev-tools/deploy/preflight.py"
      - ".github/workflows/validate-kustomize-overlays.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: validate-kustomize-overlays-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  validate-overlays:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: 🧰 Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5

      - name: 🐳 Set up Docker
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: 🔐 Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'

      - name: 🏗️ Build service jars for overlay validation
        run: ./gradlew -PincludeLoadTesting=false :account-service:bootJar :automation-scripting-service:bootJar :entity-management-service:bootJar :game-design-service:bootJar :game-logic-service:bootJar :game-session-service:bootJar :logging-admin-service:bootJar :social-groups-service:bootJar :spring-cloud-gateway:bootJar :tcp-proxy-service:bootJar :world-management-service:bootJar

      - name: 🏗️ Build PR images for overlay validation
        run: |
          docker build \
            -f docker/base.Dockerfile \
            -t ghcr.io/benhook1013/firemud-base:latest \
            .

          services="account-service automation-scripting-service entity-management-service game-design-service game-logic-service game-session-service logging-admin-service social-groups-service spring-cloud-gateway tcp-proxy-service world-management-service"
          for service in $services; do
            docker build \
              --build-context repo_root=. \
              --build-arg BASE_IMAGE=ghcr.io/benhook1013/firemud-base:latest \
              -t "ghcr.io/benhook1013/${service}:latest" \
              -f "./services/${service}/Dockerfile" \
              "./services/${service}/build/libs"
          done

      - name: ✅ Validate overlays and image availability
        run: bash dev-tools/deploy/validate-kustomize-overlays.sh
