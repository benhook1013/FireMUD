name: Validate Kustomize Overlays

on:
  pull_request:
    paths:
      - "k8s/**"
      - "design/operations/deployments/production/attestations/**"
      - "design/operations/deployments/production/backup-readiness/**"
      - "dev-tools/ci/validate-kustomize-overlays.sh"
      - "dev-tools/deploy/preflight.sh"
      - ".github/workflows/validate-kustomize-overlays.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate-overlays:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🧰 Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Validate overlays and image availability
        run: dev-tools/ci/validate-kustomize-overlays.sh
