                      const snapshotKey = `marker:${matching.id}:${matching.run_attempt}:${identityKey(currentIdentity)}`;
                      if (incompleteRefreshKey !== snapshotKey) {
                        incompleteRefreshKey = snapshotKey;
                        incompleteRefreshObservedAt = Date.now();
                      }
                      if (Date.now() - incompleteRefreshObservedAt < completedSnapshotTimeoutMs) {
                        await new Promise((resolve) => setTimeout(resolve, sleepMs));
                        continue smokeGatePolling;
                      }
                    }
                  }
                  if (markerProof === true || (markers.length === 1 && markers[0].status === "completed" &&
                      markers[0].conclusion === "success")) {
                    let knownPlayVerified = markerProof === true;
                    try {
                      if (!knownPlayVerified) knownPlayVerified = await verifyKnownPlayFailure(
                        matching, fullSmokeJob, currentIdentity, matching.event === "repository_dispatch");
                    } catch (error) {
                      if (error instanceof TerminalGitHubRequestError) throw error;
                      if (isTransientGitHubFailure(error)) {
                        core.warning(`Canonical PLAY transition proof is temporarily unavailable: ${error?.message ?? String(error)}`);
                        await new Promise((resolve) => setTimeout(resolve, sleepMs));
                        continue smokeGatePolling;
                      }
                      core.warning(`Canonical PLAY transition exception proof is unavailable: ${error?.message ?? String(error)}`);
                    }
                    if (knownPlayVerified === "attempt-superseded") {
                      await new Promise((resolve) => setTimeout(resolve, sleepMs));
                      continue smokeGatePolling;
                    }
                    if (knownPlayVerified === "snapshot-pending") {
                      const snapshotKey = `successful:${matching.id}:${matching.run_attempt}:${identityKey(currentIdentity)}`;
                      if (incompleteRefreshKey !== snapshotKey) {
                        incompleteRefreshKey = snapshotKey;
                        incompleteRefreshObservedAt = Date.now();
                      }
                      if (Date.now() - incompleteRefreshObservedAt >= completedSnapshotTimeoutMs) {
                        core.setFailed("Terminal canonical refresh did not expose complete smoke-job proof within the snapshot convergence allowance.");
                        return;
                      }
                      await new Promise((resolve) => setTimeout(resolve, sleepMs));
                      continue smokeGatePolling;
                    }
                    if (knownPlayVerified !== true) {
                      core.setFailed("Canonical PLAY transition exception could not be verified; runtime qualification remains blocked.");
                      return;
                    }
                    const needsLiveTuple = matching.event === "repository_dispatch";
                    const freshIdentity = await resolveCurrentIdentity("Stopping stale canonical transition PLAY exception", requireCurrentIdentity || needsLiveTuple);
                    const comparableFreshIdentity = needsLiveTuple && freshIdentity
                      ? {...freshIdentity, sourceEvent: currentIdentity.sourceEvent}
                      : freshIdentity;
                    if (freshIdentity?.obsolete) return;
                    if (!freshIdentity || identityKey(comparableFreshIdentity) !== identityKey(currentIdentity)) {
                      if (needsLiveTuple) requireCurrentIdentity = true;
                      currentIdentity = freshIdentity;
                      continue smokeGatePolling;
                    }
                    if (!freshIdentity.canonicalPlayEligible) {
                      core.setFailed("Canonical PLAY transition exception label is absent or no longer eligible.");
                      return;
                    }
                    if (!await isCurrentCanonicalAttempt(matching)) {
                      await new Promise((resolve) => setTimeout(resolve, sleepMs));
                      continue smokeGatePolling;
                    }
                    if (!await isCurrentCanonicalAttempt(matching)) {
                      await new Promise((resolve) => setTimeout(resolve, sleepMs));
                      continue smokeGatePolling;
                    }
                    // Native event proof also needs a fresh label after the attempt GET.
                    const finalIdentity = await resolveCurrentIdentity(
                      "Stopping stale canonical transition PLAY exception", requireCurrentIdentity || needsLiveTuple);
                    const comparableFinalIdentity = needsLiveTuple && finalIdentity
                      ? {...finalIdentity, sourceEvent: currentIdentity.sourceEvent}
                      : finalIdentity;
                    if (finalIdentity?.obsolete) return;
                    if (!finalIdentity || identityKey(comparableFinalIdentity) !== identityKey(currentIdentity)) {
                      if (finalIdentity) {
                        if (needsLiveTuple) requireCurrentIdentity = true;
                        currentIdentity = finalIdentity;
                      }
                      continue smokeGatePolling;
                    }
                    if (!finalIdentity.canonicalPlayEligible) {
                      core.setFailed("Canonical PLAY transition exception label is absent or no longer eligible.");
                      return;
                    }
                    core.setOutput("known_play_exception", "true");
                    core.warning("Canonical PLAY transition exception accepted: LOGIN succeeded, direct backend PLAY failed ERROR ENTITLEMENT_UNAVAILABLE. No runtime qualification or image publication.");
                    await core.summary.addHeading("Canonical PLAY transition exception accepted")
                      .addRaw("Known PLAY failed: ERROR ENTITLEMENT_UNAVAILABLE after LOGIN. Held-admission qualification and authenticated cleanup passed. CI passed under exception; no runtime qualification, image export, or publication.")
                      .write();
                    return;
                  }
                  if (!canonicalProducerVerified && (markers.length !== 1 ||
                      markers[0].status !== "completed" || markers[0].conclusion !== "skipped")) {
                    core.setFailed("Runtime smoke proof is missing its unambiguous transition-exception disposition.");
                    return;
                  }
                  if (typedRuntimeProof && !canonicalProducerVerified) {
                    if (!await isCurrentCanonicalAttempt(matching)) {
                      await new Promise((resolve) => setTimeout(resolve, sleepMs));
                      continue smokeGatePolling;
                    }
                    core.setFailed(
                      "Typed ordinary runtime smoke lacks canonical native job, authenticated cleanup, or terminal-guard proof."
                    );
                    return;
                  }
                }

                if (fullSmokeJob?.conclusion !== "success") {
                  if (await isCurrentPullRequestObsolete("Stopping obsolete failed full-smoke gate for")) {
                    return;
                  }
                  core.setFailed(
                    `Runtime images run ${matching.id} succeeded, but PR Full-Stack Smoke job did not complete successfully: ` +
                    `job=${fullSmokeJob?.status ?? "missing"}/${fullSmokeJob?.conclusion ?? "unknown"}`
                  );
                  return;
                }
                if (!canonicalProducerVerified && fullSmokeStep?.conclusion !== "success") {
                  if (await isCurrentPullRequestObsolete("Stopping obsolete skipped full-smoke gate for")) {
                    return;
                  }
                  core.setFailed(
                    `Runtime images run ${matching.id} succeeded, but its credential-free full-stack smoke step did not pass: ` +
                    `step=${fullSmokeStep?.status ?? "missing"}/${fullSmokeStep?.conclusion ?? "unknown"}`
                  );
                  return;
                }
                const finalIdentity = await fenceCompletedRuntimeIdentity("Stopping stale smoke gate before accepting full-stack proof");
                if (finalIdentity?.obsolete) {
                  return;
                }
                if (!finalIdentity || identityKey(finalIdentity) !== identityKey(currentIdentity)) {
                  currentIdentity = finalIdentity;
                  core.info(
                    `Runtime images run ${matching.id} was not accepted because the current PR identity changed after its smoke snapshot; waiting for a fresh exact run.`
                  );
                  continue smokeGatePolling;
                }
                if (typedRuntimeProof) {
                  if (!await isCurrentCanonicalAttempt(matching)) {
                    await new Promise((resolve) => setTimeout(resolve, sleepMs));
                    continue smokeGatePolling;
                  }
                  if (Date.now() - started >= timeoutMs) break smokeGatePolling;
                  const fencedIdentity = await fenceCompletedRuntimeIdentity("Stopping stale smoke gate before accepting full-stack proof");
                  if (fencedIdentity?.obsolete) return;
                  if (!fencedIdentity || identityKey(fencedIdentity) !== identityKey(currentIdentity)) {
                    currentIdentity = fencedIdentity;
                    core.info(`Runtime images run ${matching.id} was not accepted because its PR identity changed during the attempt lookup.`);
                    continue smokeGatePolling;
                  }
                  if (Date.now() - started >= timeoutMs) break smokeGatePolling;
                  // The final provider observation qualifies the selected attempt.
                  if (!await isCurrentCanonicalAttempt(matching)) {
                    await new Promise((resolve) => setTimeout(resolve, sleepMs));
                    continue smokeGatePolling;
                  }
                  if (Date.now() - started >= timeoutMs) break smokeGatePolling;
                }
                return;
              }

              core.info(
                `No exact ${currentIdentity.sourceEvent} runtime-images/full-smoke run found yet for PR #${prNumber} ` +
                `base ${currentIdentity.baseSha} head ${currentIdentity.headSha} merge ${currentIdentity.mergeSha}; waiting...`
              );
              await new Promise((resolve) => setTimeout(resolve, sleepMs));
            }

            try {
              if (await isCurrentPullRequestObsolete("Stopping obsolete timed-out smoke gate for")) {
                return;
              }
            } catch (error) {
              core.warning(`Timed-out smoke gate could not re-check current PR identity: ${error.message}`);
            }
            const timeoutIdentity = currentIdentity
              ? `base ${currentIdentity.baseSha} head ${currentIdentity.headSha} merge ${currentIdentity.mergeSha}`
              : `event base ${eventBaseSha} head ${headSha} merge ${eventMergeSha}`;
            core.setFailed(
              `Timed out waiting for the exact runtime-images/full-smoke run for PR #${prNumber} ${timeoutIdentity}. ` +
              `Diagnostic: ${identityDiagnostic}`
            );
