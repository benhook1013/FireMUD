name: Smoke Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3am UTC

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-core:
    name: Core Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SMOKE_TIMEOUT_SECONDS: 20
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: 📝 Create CI .env placeholder
        run: touch .env

      - name: Generate Dev Certificates
        run: ./dev-tools/generate-dev-certs.sh dev-tools/certs

      - name: 🚀 Start Dev Stack (devUp)
        run: ./gradlew devUp

      - name: 📦 Install WebSocket smoke dependency
        run: python3 -m pip install --disable-pip-version-check websocket-client

      - name: 🧪 Direct WebSocket LOGIN + LOOK (Game Session)
        run: |
          cd services/game-session-service
          bash ./websocket-login-look-smoke.sh

      - name: 🧪 Telnet LOGIN + LOOK (TCP Proxy)
        run: |
          cd services/tcp-proxy-service
          bash ./telnet-login-look-smoke.sh

      - name: 📜 Dump Docker Compose Logs on Failure
        if: failure()
        run: |
          if [ -f docker/docker-compose.yml ]; then
            docker compose -f docker/docker-compose.yml logs || true
          fi

      - name: 🧹 Stop Dev Stack (devDown)
        if: always()
        run: ./gradlew devDown

  smoke-core-hetzner:
    name: Core Smoke Tests (Hetzner)
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ci-smoke
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 25
    env:
      SMOKE_TIMEOUT_SECONDS: 20
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: 🔎 Show runner resources
        run: |
          uname -a
          echo
          free -h || true
          echo
          df -h || true

      - name: 🔎 Verify Docker tooling
        run: |
          docker version
          docker compose version

      - name: 🧹 Clean up any stale smoke stack before run
        run: |
          docker compose -f docker/docker-compose.yml down -v --remove-orphans || true

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: 📝 Create CI .env placeholder
        run: touch .env

      - name: Generate Dev Certificates
        run: ./dev-tools/generate-dev-certs.sh dev-tools/certs

      - name: 🚀 Start Dev Stack (devUp)
        run: ./gradlew devUp

      - name: 📦 Install WebSocket smoke dependency
        run: python3 -m pip install --disable-pip-version-check websocket-client

      - name: 🧪 Direct WebSocket LOGIN + LOOK (Game Session)
        run: |
          cd services/game-session-service
          bash ./websocket-login-look-smoke.sh

      - name: 🧪 Telnet LOGIN + LOOK (TCP Proxy)
        run: |
          cd services/tcp-proxy-service
          bash ./telnet-login-look-smoke.sh

      - name: 📜 Dump Docker Compose Logs on Failure
        if: failure()
        run: |
          if [ -f docker/docker-compose.yml ]; then
            docker compose -f docker/docker-compose.yml logs || true
          fi

      - name: 🧹 Stop Dev Stack (devDown)
        if: always()
        run: ./gradlew devDown

      - name: 🧹 Clean up Docker leftovers
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml down -v --remove-orphans || true

  smoke-gate:
    name: Smoke Gate
    runs-on: ubuntu-latest
    needs: [smoke-core]
    if: always()
    steps:
      - name: Enforce successful smoke tests
        run: |
          if [ "${{ needs.smoke-core.result }}" != "success" ]; then
            echo "Smoke tests did not complete successfully: ${{ needs.smoke-core.result }}"
            exit 1
          fi

  smoke-summary:
    name: Smoke Summary
    runs-on: ubuntu-latest
    needs: [smoke-core, smoke-core-hetzner, smoke-gate]
    if: github.event_name == 'pull_request' && always()
    steps:
      - name: 💬 Publish Smoke Summary Comment
        uses: actions/github-script@v8
        with:
          script: |
            const result = "${{ needs.smoke-core.result }}";
            const hetznerResult = "${{ needs.smoke-core-hetzner.result }}";
            const statusIcon = (value) => {
              if (value === "success") return "✅";
              if (value === "failure") return "❌";
              if (value === "cancelled") return "⚪";
              return "⏭️";
            };

            const headline = result === "success"
              ? "✅ Smoke tests passed"
              : "❌ Smoke tests failed";

            const body = [
              "### Smoke Summary",
              headline,
              "",
              `- ${statusIcon(result)} Core Smoke Tests: \`${result}\``,
              `- ${statusIcon(hetznerResult)} Core Smoke Tests (Hetzner): \`${hetznerResult}\``,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(comment =>
              comment.body.startsWith("### Smoke Summary")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }
