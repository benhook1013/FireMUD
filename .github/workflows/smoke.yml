name: PR Smoke Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

run-name: PR Smoke Gate ${{ github.event_name == 'pull_request' && format('pr-{0} base-{1} head-{2}', github.event.pull_request.number, github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ format('pr-{0}-controller', github.event.pull_request.number) }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && format('metadata-{0}', github.run_id) || 'required' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Smoke-Relevant Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    outputs:
      run_smoke_full: ${{ steps.compute.outputs.run_smoke_full }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Compute smoke scope
        id: compute
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fileEntries = await github.paginate(
              github.rest.pulls.listFiles,
              {
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
              (response) => response.data
            );

            const expectedFileCount = context.payload.pull_request.changed_files;
            const fileListComplete =
              Number.isInteger(expectedFileCount) && expectedFileCount === fileEntries.length;
            const fileEntriesValid = fileEntries.every((file) =>
              file &&
              typeof file === "object" &&
              typeof file.filename === "string" &&
              file.filename.length > 0 &&
              (file.previous_filename === undefined ||
                (typeof file.previous_filename === "string" && file.previous_filename.length > 0))
            );
            const files = fileEntriesValid
              ? fileEntries.flatMap((file) =>
                  [file.filename, file.previous_filename].filter(Boolean)
                )
              : [];

            if (!fileListComplete || !fileEntriesValid) {
              core.warning("PR file-list detection was incomplete; requiring full-stack smoke.");
              core.setOutput("run_smoke_full", "true");
              return;
            }

            const docsOnlyPredicate = (file) =>
              file === "AGENTS.md" ||
              file === "mkdocs.yml" ||
              file.startsWith("design/") ||
              file.startsWith("dev-tools/docs/") ||
              file.endsWith(".md");

            const frontendOnlyPredicate = (file) =>
              file.startsWith("web-client/") ||
              file.startsWith("config/openapi/");

            const fullRelevantPrefixes = [
              "buildSrc/",
              "gradle/",
              "protos/",
              "docker/",
              "services/",
              ".github/actions/load-workflow-tool-versions/",
              ".github/actions/setup-python/",
              "dev-tools/smoke/",
              "dev-tools/minio/",
            ];
            const fullRelevantFiles = new Set([
              "build.gradle.kts",
              "settings.gradle.kts",
              "gradle.properties",
              "gradlew",
              "gradlew.bat",
              ".dockerignore",
              ".python-version",
              ".github/actions/load-workflow-tool-versions/action.yml",
              ".github/workflows/smoke.yml",
              ".github/workflows/smoke-full.yml",
              ".github/workflows/runtime-images.yml",
              ".github/workflows/publish-pr-runtime-images.yml",
              "config/workflow-tool-versions.env",
              "config/python/smoke-requirements.txt",
              "config/python/smoke-requirements.in",
              "dev-tools/build-compose-service-jars.sh",
              "dev-tools/validation/run-gradle-with-dependency-recovery.sh",
              "dev-tools/validation/run-locked-gradle.sh",
              "dev-tools/validation/gradle-run-supervisor.py",
              "dev-tools/build-local-smoke-images.sh",
              "dev-tools/backups/verify-backups.sh",
              "dev-tools/backups/pg-dump-s3-selection.shlib",
              "dev-tools/backups/smoke-backup-verifier-image.sh",
              "dev-tools/certs/generate-dev-certs.sh",
              "dev-tools/verify-compose-health.sh",
              "dev-tools/verify-fresh-bootstrap.sh",
              "dev-tools/verify-restart-state.sh",
              "dev-tools/verify-smoke-images.sh",
            ]);

            const nonDocFiles = files.filter((file) => !docsOnlyPredicate(file));
            const nonDocsAreFrontendOnly =
              nonDocFiles.length > 0 && nonDocFiles.every((file) => frontendOnlyPredicate(file));

            if (nonDocFiles.length === 0 || nonDocsAreFrontendOnly) {
              core.setOutput("run_smoke_full", "false");
              return;
            }

            const runSmokeFull = nonDocFiles.some(
              (file) =>
                fullRelevantFiles.has(file) ||
                fullRelevantPrefixes.some(
                  (prefix) =>
                    file.startsWith(prefix) &&
                    !file.startsWith("services/hosted-environment-identity-controller/")
                )
            );
            core.setOutput("run_smoke_full", runSmokeFull ? "true" : "false");

  smoke-summary-pending:
    name: Smoke Summary (Pending)
    runs-on: ubuntu-latest
    permissions:
      # This job publishes the initial pending state; Smoke Summary publishes the terminal state.
      contents: read
      pull-requests: write
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: 💬 Publish Pending Smoke Summary Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_SMOKE_FULL: ${{ needs.changes.outputs.run_smoke_full }}
        with:
          script: |
            const rawChangesResult = process.env.CHANGES_RESULT || "";
            const changesStatus = ["success", "failure", "cancelled"].includes(rawChangesResult)
              ? rawChangesResult
              : "unavailable";
            const changesHealthy = changesStatus === "success";
            const fullEnabled = process.env.RUN_SMOKE_FULL === "true";
            const smokeGateStatus = fullEnabled ? "pending" : "not-required";
            const fullResult = !changesHealthy
              ? `not-evaluated (${changesStatus} changes detection)`
              : fullEnabled
                ? "tracked-by-smoke-gate"
                : "skipped (run_smoke_full=false)";
            const statusIcon = (value) => {
              if (value === "success") return "✅";
              if (value === "failure" || value.startsWith("failure (")) return "❌";
              if (value === "cancelled") return "⚪";
              if (value === "pending") return "⏳";
              if (value === "unavailable") return "⚠️";
              if (value.startsWith("not-evaluated")) return "⚠️";
              return "⏭️";
            };

            let headline = "⏭️ Runtime smoke is not required";
            if (!changesHealthy) {
              headline = `⚠️ Smoke scope detection ${changesStatus}; Smoke Gate is still authoritative`;
            } else if (fullEnabled) {
              headline = "⏳ Full-stack smoke runs in Build Runtime Images and is tracked by Smoke Gate";
            }

            const body = [
              "<!-- firemud-smoke-summary -->",
              "### Smoke Summary",
              headline,
              "",
              `- ${statusIcon(changesStatus)} Changes detection: \`${changesStatus}\``,
              `- ${statusIcon(smokeGateStatus)} Smoke Gate: \`${smokeGateStatus}\``,
              `- ${statusIcon(fullResult)} PR Full-Stack Smoke: \`${fullResult}\``,
            ].join("\n");

            const expectedHeadSha = context.payload.pull_request.head.sha;
            const expectedBaseRef = context.payload.pull_request.base.ref;
            const expectedBaseSha = context.payload.pull_request.base.sha;
            const { data: currentPullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            if (
              currentPullRequest.state !== "open" ||
              currentPullRequest.head.sha !== expectedHeadSha ||
              currentPullRequest.base.ref !== expectedBaseRef ||
              currentPullRequest.base.sha !== expectedBaseSha
            ) {
              core.info(
                `Skipping stale smoke summary for ${expectedBaseRef}@${expectedBaseSha}...${expectedHeadSha}; ` +
                `current PR state/base/head is ${currentPullRequest.state}/${currentPullRequest.base.ref}@${currentPullRequest.base.sha}/${currentPullRequest.head.sha}`
              );
              return;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                ...context.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );

            const isBotAuthored = (comment) => comment.user?.login === "github-actions[bot]";
            const isWorkflowComment = (comment) => {
              const body = comment.body ?? "";
              return isBotAuthored(comment) && body.includes("<!-- firemud-smoke-summary -->");
            };
            const isLegacyWorkflowComment = (comment) => {
              const body = comment.body ?? "";
              return isBotAuthored(comment) && body.startsWith("### Smoke Summary");
            };
            const summaryComments = [];
            const seenCommentIds = new Set();
            for (const comment of comments) {
              if ((!isWorkflowComment(comment) && !isLegacyWorkflowComment(comment)) || seenCommentIds.has(comment.id)) {
                continue;
              }
              seenCommentIds.add(comment.id);
              summaryComments.push(comment);
            }
            const commentTimestamp = (comment) => {
              const parsed = Date.parse(comment.created_at || "");
              return Number.isNaN(parsed) ? Number.MAX_SAFE_INTEGER : parsed;
            };
            const existing = summaryComments.reduce((oldest, comment) => {
              if (!oldest) return comment;
              const oldestTimestamp = commentTimestamp(oldest);
              const candidateTimestamp = commentTimestamp(comment);
              if (candidateTimestamp !== oldestTimestamp) {
                return candidateTimestamp < oldestTimestamp ? comment : oldest;
              }
              return Number(comment.id) < Number(oldest.id) ? comment : oldest;
            }, null);

            const deleteCommentIfPresent = async (comment) => {
              try {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            if (existing && existing.body !== body) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else if (!existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

            for (const comment of summaryComments) {
              if (String(comment.id) === String(existing?.id)) continue;
              await deleteCommentIfPresent(comment);
            }

  smoke-summary:
    name: ${{ github.event.action == 'edited' && github.event.changes.base.ref == null && 'PR Metadata Edit (Smoke Summary)' || 'Smoke Summary' }}
    runs-on: ubuntu-latest
    permissions:
      # This job updates the canonical comment to the terminal Smoke Gate result.
      contents: read
      pull-requests: write
    needs: [changes, smoke-gate, smoke-summary-pending]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: 💬 Publish Smoke Summary Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_SMOKE_FULL: ${{ needs.changes.outputs.run_smoke_full }}
          SMOKE_GATE_RESULT: ${{ needs.smoke-gate.result }}
          KNOWN_PLAY_EXCEPTION: ${{ needs.smoke-gate.outputs.known_play_exception }}
        with:
          script: |
            const rawChangesResult = process.env.CHANGES_RESULT || "";
            const changesStatus = ["success", "failure", "cancelled"].includes(rawChangesResult)
              ? rawChangesResult
              : "unavailable";
            const changesHealthy = changesStatus === "success";
            const fullEnabled = process.env.RUN_SMOKE_FULL === "true";
            const rawSmokeGateResult = process.env.SMOKE_GATE_RESULT || "";
            const smokeGateStatus = ["success", "failure", "cancelled", "skipped"].includes(rawSmokeGateResult)
              ? rawSmokeGateResult
              : "unavailable";
            const knownPlayException = process.env.KNOWN_PLAY_EXCEPTION === "true" && smokeGateStatus === "success";
            const fullResult = knownPlayException
              ? "failure (known PLAY exception accepted; no runtime qualification or publication)"
              : !changesHealthy
              ? `not-evaluated (${changesStatus} changes detection)`
              : fullEnabled
                ? smokeGateStatus
                : "skipped (run_smoke_full=false)";
            const statusIcon = (value) => {
              if (value === "success") return "✅";
              if (value === "failure" || value.startsWith("failure (")) return "❌";
              if (value === "cancelled") return "⚪";
              if (value === "skipped") return "⏭️";
              if (value === "unavailable") return "⚠️";
              if (value.startsWith("not-evaluated")) return "⚠️";
              return "⏭️";
            };

            let headline = "⏭️ Runtime smoke is not required";
            if (!changesHealthy) {
              headline = `${statusIcon(smokeGateStatus)} Smoke Gate completed with ${smokeGateStatus}; scope detection was ${changesStatus}`;
            } else if (knownPlayException) {
              headline = "⚠️ Known PLAY failed: ERROR ENTITLEMENT_UNAVAILABLE after LOGIN. Canonical PLAY transition exception accepted; no runtime qualification or publication.";
            } else if (fullEnabled) {
              headline = `${statusIcon(smokeGateStatus)} Full-stack smoke completed with Smoke Gate: ${smokeGateStatus}`;
            }

            const body = [
              "<!-- firemud-smoke-summary -->",
              "### Smoke Summary",
              headline,
              "",
              `- ${statusIcon(changesStatus)} Changes detection: \`${changesStatus}\``,
              `- ${statusIcon(smokeGateStatus)} Smoke Gate: \`${smokeGateStatus}\``,
              `- ${statusIcon(fullResult)} PR Full-Stack Smoke: \`${fullResult}\``,
            ].join("\n");

            const expectedHeadSha = context.payload.pull_request.head.sha;
            const expectedBaseRef = context.payload.pull_request.base.ref;
            const expectedBaseSha = context.payload.pull_request.base.sha;
            const { data: currentPullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            if (
              currentPullRequest.state !== "open" ||
              currentPullRequest.head.sha !== expectedHeadSha ||
              currentPullRequest.base.ref !== expectedBaseRef ||
              currentPullRequest.base.sha !== expectedBaseSha
            ) {
              core.info(
                `Skipping stale smoke summary for ${expectedBaseRef}@${expectedBaseSha}...${expectedHeadSha}; ` +
                `current PR state/base/head is ${currentPullRequest.state}/${currentPullRequest.base.ref}@${currentPullRequest.base.sha}/${currentPullRequest.head.sha}`
              );
              return;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                ...context.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );

            const isBotAuthored = (comment) => comment.user?.login === "github-actions[bot]";
            const isWorkflowComment = (comment) => {
              const body = comment.body ?? "";
              return isBotAuthored(comment) && body.includes("<!-- firemud-smoke-summary -->");
            };
            const isLegacyWorkflowComment = (comment) => {
              const body = comment.body ?? "";
              return isBotAuthored(comment) && body.startsWith("### Smoke Summary");
            };
            const summaryComments = [];
            const seenCommentIds = new Set();
            for (const comment of comments) {
              if ((!isWorkflowComment(comment) && !isLegacyWorkflowComment(comment)) || seenCommentIds.has(comment.id)) {
                continue;
              }
              seenCommentIds.add(comment.id);
              summaryComments.push(comment);
            }
            const commentTimestamp = (comment) => {
              const parsed = Date.parse(comment.created_at || "");
              return Number.isNaN(parsed) ? Number.MAX_SAFE_INTEGER : parsed;
            };
            const existing = summaryComments.reduce((oldest, comment) => {
              if (!oldest) return comment;
              const oldestTimestamp = commentTimestamp(oldest);
              const candidateTimestamp = commentTimestamp(comment);
              if (candidateTimestamp !== oldestTimestamp) {
                return candidateTimestamp < oldestTimestamp ? comment : oldest;
              }
              return Number(comment.id) < Number(oldest.id) ? comment : oldest;
            }, null);

            const deleteCommentIfPresent = async (comment) => {
              try {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            if (existing && existing.body !== body) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else if (!existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

            for (const comment of summaryComments) {
              if (String(comment.id) === String(existing?.id)) continue;
              await deleteCommentIfPresent(comment);
            }

  smoke-gate:
    outputs:
      known_play_exception: ${{ steps.track-runtime-smoke.outputs.known_play_exception }}
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'PR Metadata Edit (Smoke Gate)' || 'Smoke Gate' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read the immutable runtime workflow definition and current base ref.
      actions: read # Inspect matching runtime-image workflow and job results.
      pull-requests: read # Re-read the current PR head and base before accepting smoke.
    needs: [changes]
    # Metadata-only edits skip under a non-required name; the earlier result stands.
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    timeout-minutes: 95
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Classify smoke gate execution
        id: smoke_gate_context
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          if [ "$CHANGES_RESULT" = "success" ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail when smoke dependencies did not succeed
        if: ${{ steps.smoke_gate_context.outputs.execute != 'true' }}
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "Smoke change detection did not succeed: changes=$CHANGES_RESULT" >&2
          exit 1

      - name: Record skipped runtime smoke
        if: ${{ steps.smoke_gate_context.outputs.execute == 'true' && needs.changes.outputs.run_smoke_full != 'true' }}
        run: echo "No runtime-stack smoke proof is required for this change."

      - name: Track full-stack smoke result from Build Runtime Images
        id: track-runtime-smoke
        if: ${{ steps.smoke_gate_context.outputs.execute == 'true' && needs.changes.outputs.run_smoke_full == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.pull_request.head.sha;
            const baseRef = context.payload.pull_request.base.ref;
            const eventBaseSha = context.payload.pull_request.base.sha;
            const eventMergeSha = context.sha;
            const prNumber = String(context.payload.pull_request.number);
            const started = Date.now();
            // Contract-checked against pr-local-smoke; bounded overhead covers metadata,
            // runner scheduling and API convergence, not unbounded queue delays.
            const producerTimeoutMinutes = 45;
            const prerequisiteAndQueueAllowanceMinutes = 45;
            const timeoutMs = (producerTimeoutMinutes + prerequisiteAndQueueAllowanceMinutes) * 60 * 1000;
            const cancelledReplacementTimeoutMs = 5 * 60 * 1000;
            const sleepMs = 30000;
            const snapshotSleepMs = 15000;
            const pullRequestCheckInterval = 2;
            const retryableStatuses = new Set([408, 425, 429, 500, 502, 503, 504]);
            let pollIteration = 0;
            let retryPrimary = null;
            let identityDiagnostic = "current PR identity has not been resolved";

            class TerminalGitHubRequestError extends Error {}

            function isTransientOptionalGitHubError(error) {
              const status = error?.status ?? error?.response?.status;
              const code = error?.code ?? error?.cause?.code;
              return !(error instanceof TerminalGitHubRequestError) && (retryableStatuses.has(status) ||
                (status == null && [
                  "ECONNRESET", "ETIMEDOUT", "ECONNREFUSED", "EHOSTUNREACH", "ENETUNREACH",
                  "ENOTFOUND", "EAI_AGAIN", "UND_ERR_CONNECT_TIMEOUT", "UND_ERR_SOCKET",
                ].includes(code)));
            }

            function canResumeAfterOptionalGitHubError(error, primary) {
              // Missing optional refresh evidence permits only fresh selection of a
              // retained pending exact producer, never acceptance of missing proof.
              const status = error?.status ?? error?.response?.status;
              return isTransientOptionalGitHubError(error) ||
                (status === 404 && ["pull_request", "repository_dispatch"].includes(primary?.event) &&
                  primary.status !== "completed");
            }

            async function withTransientGitHubRetry(label, operation) {
              const maxAttempts = 4;
              let retryDelayMs = 1000;
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  return await operation();
                } catch (error) {
                  const status = error?.status ?? error?.response?.status;
                  const headers = error?.response?.headers ?? {};
                  const reset = String(headers["x-ratelimit-reset"] ?? "");
                  const resetSeconds = Number(reset);
                  const quotaExhausted = status === 403 &&
                    String(headers["x-ratelimit-remaining"]) === "0" &&
                    /^[0-9]+$/.test(reset) && Number.isSafeInteger(resetSeconds) && resetSeconds > 0;
                  const delayMs = quotaExhausted
                    ? Math.max(1000, resetSeconds * 1000 - Date.now() + 1000)
                    : retryDelayMs;
                  const remainingMs = timeoutMs - (Date.now() - started);
                  const retryable = quotaExhausted || status == null || retryableStatuses.has(status);
                  if (!retryable || attempt === maxAttempts || delayMs >= remainingMs) {
                    if (status === 403) {
                      throw new TerminalGitHubRequestError(`${label}: ${error.message ?? "GitHub refused the request"}`, { cause: error });
                    }
                    throw error;
                  }
                  core.warning(
                    `${label} failed transiently (status=${status ?? "network"}); retrying in ${delayMs}ms`
                  );
                  await new Promise((resolve) => setTimeout(resolve, delayMs));
                  retryDelayMs *= 2;
                }
              }
              throw new Error(`${label} retry loop exited unexpectedly`);
            }

            // Current producer definition; the contract test reports fingerprint upkeep.
            const canonicalRuntimeWorkflowSha256 = "cb3117e121f317cadf31968ef3a41bb32368deddc4c584cc72ef982095133e2e";
            // The previous archive format does not change this definition's independently valid smoke proof.
            const canonicalMergeOnlyArtifactRuntimeWorkflowSha256 = "004af984d2aa7ab023758cbc38c6c20f92976b8f07040c9a4965bda6616d5dd5";
            const outgoingTrustedRefreshRuntimeWorkflowSha256 = new Set([
              "1993dbcd405b657d171339ca7aaf21ff8757098289a8f9121ddc433a00df803e",
              "877a1a1656f6b625c9c2cbece0cf55d8657de320ceae45f3e6c50301a850b30b",
              "2a769961890119fc91a83b2987537122704f6624035d1572b446569d5f9d11a1",
            ]);
            // Trusted refreshes can still execute the previous successful default-branch definition.
            const canonicalPreviousTrustedRefreshRuntimeWorkflowSha256 = "ea6ade0f69718573aeac4e4b5a1e9050e53e1e3cef3426b8791f182d8d49e112";
            // Retain the exact fail-red producer still executed by trusted base refreshes.
            const canonicalLegacyRuntimeWorkflowSha256 = "db0acb4e51630b729eb92362ea3e748f3f96b06d8ef5ca466a718ded67725804";
            // Include held-admission proof, authenticated cleanup, and their executed inputs.
            const canonicalPlayClassifierSha256 = {
              "dev-tools/verify-smoke-images.sh": "559e0713cc86ab533cc23214e56ece2e7cf4e069d1bb7541a1e09bff36ad4c67",
