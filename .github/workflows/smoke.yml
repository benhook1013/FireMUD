name: PR Smoke Gate

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

run-name: PR Smoke Gate ${{ github.event_name == 'pull_request' && format('pr-{0} base-{1} head-{2}', github.event.pull_request.number, github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ format('pr-{0}-controller', github.event.pull_request.number) }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Smoke-Relevant Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    outputs:
      run_smoke_full: ${{ steps.compute.outputs.run_smoke_full }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Compute smoke scope
        id: compute
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fileEntries = await github.paginate(
              github.rest.pulls.listFiles,
              {
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
              (response) => response.data
            );

            const expectedFileCount = context.payload.pull_request.changed_files;
            const fileListComplete =
              Number.isInteger(expectedFileCount) && expectedFileCount === fileEntries.length;
            const fileEntriesValid = fileEntries.every((file) =>
              file &&
              typeof file === "object" &&
              typeof file.filename === "string" &&
              file.filename.length > 0 &&
              (file.previous_filename === undefined ||
                (typeof file.previous_filename === "string" && file.previous_filename.length > 0))
            );
            const files = fileEntriesValid
              ? fileEntries.flatMap((file) =>
                  [file.filename, file.previous_filename].filter(Boolean)
                )
              : [];

            if (!fileListComplete || !fileEntriesValid) {
              core.warning("PR file-list detection was incomplete; requiring full-stack smoke.");
              core.setOutput("run_smoke_full", "true");
              return;
            }

            const docsOnlyPredicate = (file) =>
              file === "AGENTS.md" ||
              file === "mkdocs.yml" ||
              file.startsWith("design/") ||
              file.startsWith("dev-tools/docs/") ||
              file.endsWith(".md");

            const frontendOnlyPredicate = (file) =>
              file.startsWith("web-client/") ||
              file.startsWith("config/openapi/");

            const fullRelevantPrefixes = [
              "buildSrc/",
              "gradle/",
              "protos/",
              "docker/",
              "services/",
              ".github/actions/load-workflow-tool-versions/",
              ".github/actions/setup-python/",
              "dev-tools/smoke/",
            ];
            const fullRelevantFiles = new Set([
              "build.gradle.kts",
              "settings.gradle.kts",
              "gradle.properties",
              "gradlew",
              "gradlew.bat",
              ".dockerignore",
              ".python-version",
              ".github/actions/load-workflow-tool-versions/action.yml",
              ".github/workflows/smoke.yml",
              ".github/workflows/smoke-full.yml",
              ".github/workflows/runtime-images.yml",
              ".github/workflows/publish-pr-runtime-images.yml",
              "config/workflow-tool-versions.env",
              "config/python/smoke-requirements.txt",
              "config/python/smoke-requirements.in",
              "dev-tools/build-compose-service-jars.sh",
              "dev-tools/build-local-smoke-images.sh",
              "dev-tools/backups/verify-backups.sh",
              "dev-tools/backups/pg-dump-s3-selection.shlib",
              "dev-tools/backups/smoke-backup-verifier-image.sh",
              "dev-tools/certs/generate-dev-certs.sh",
              "dev-tools/verify-compose-health.sh",
              "dev-tools/verify-fresh-bootstrap.sh",
              "dev-tools/verify-restart-state.sh",
              "dev-tools/verify-smoke-images.sh",
            ]);

            const nonDocFiles = files.filter((file) => !docsOnlyPredicate(file));
            const nonDocsAreFrontendOnly =
              nonDocFiles.length > 0 && nonDocFiles.every((file) => frontendOnlyPredicate(file));

            if (nonDocFiles.length === 0 || nonDocsAreFrontendOnly) {
              core.setOutput("run_smoke_full", "false");
              return;
            }

            const runSmokeFull = nonDocFiles.some(
              (file) =>
                fullRelevantFiles.has(file) ||
                fullRelevantPrefixes.some(
                  (prefix) =>
                    file.startsWith(prefix) &&
                    !file.startsWith("services/hosted-environment-identity-controller/")
                )
            );
            core.setOutput("run_smoke_full", runSmokeFull ? "true" : "false");

  smoke-summary-pending:
    name: Smoke Summary (Pending)
    runs-on: ubuntu-latest
    permissions:
      # This job publishes the initial pending state; Smoke Summary publishes the terminal state.
      contents: read
      pull-requests: write
    needs: [changes]
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: 💬 Publish Pending Smoke Summary Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_SMOKE_FULL: ${{ needs.changes.outputs.run_smoke_full }}
        with:
          script: |
            const rawChangesResult = process.env.CHANGES_RESULT || "";
            const changesStatus = ["success", "failure", "cancelled"].includes(rawChangesResult)
              ? rawChangesResult
              : "unavailable";
            const changesHealthy = changesStatus === "success";
            const fullEnabled = process.env.RUN_SMOKE_FULL === "true";
            const smokeGateStatus = fullEnabled ? "pending" : "not-required";
            const fullResult = !changesHealthy
              ? `not-evaluated (${changesStatus} changes detection)`
              : fullEnabled
                ? "tracked-by-smoke-gate"
                : "skipped (run_smoke_full=false)";
            const statusIcon = (value) => {
              if (value === "success") return "✅";
              if (value === "failure") return "❌";
              if (value === "cancelled") return "⚪";
              if (value === "pending") return "⏳";
              if (value === "unavailable") return "⚠️";
              if (value.startsWith("not-evaluated")) return "⚠️";
              return "⏭️";
            };

            let headline = "⏭️ Runtime smoke is not required";
            if (!changesHealthy) {
              headline = `⚠️ Smoke scope detection ${changesStatus}; Smoke Gate is still authoritative`;
            } else if (fullEnabled) {
              headline = "⏳ Full-stack smoke runs in Build Runtime Images and is tracked by Smoke Gate";
            }

            const body = [
              "<!-- firemud-smoke-summary -->",
              "### Smoke Summary",
              headline,
              "",
              `- ${statusIcon(changesStatus)} Changes detection: \`${changesStatus}\``,
              `- ${statusIcon(smokeGateStatus)} Smoke Gate: \`${smokeGateStatus}\``,
              `- ${statusIcon(fullResult)} PR Full-Stack Smoke: \`${fullResult}\``,
            ].join("\n");

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                ...context.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );

            const isBotAuthored = (comment) => comment.user?.login === "github-actions[bot]";
            const isWorkflowComment = (comment) => {
              const body = comment.body ?? "";
              return isBotAuthored(comment) && body.includes("<!-- firemud-smoke-summary -->");
            };
            const isLegacyWorkflowComment = (comment) => {
              const body = comment.body ?? "";
              return isBotAuthored(comment) && body.startsWith("### Smoke Summary");
            };
            const summaryComments = [];
            const seenCommentIds = new Set();
            for (const comment of comments) {
              if ((!isWorkflowComment(comment) && !isLegacyWorkflowComment(comment)) || seenCommentIds.has(comment.id)) {
                continue;
              }
              seenCommentIds.add(comment.id);
              summaryComments.push(comment);
            }
            const commentTimestamp = (comment) => {
              const parsed = Date.parse(comment.created_at || "");
              return Number.isNaN(parsed) ? Number.MAX_SAFE_INTEGER : parsed;
            };
            const existing = summaryComments.reduce((oldest, comment) => {
              if (!oldest) return comment;
              const oldestTimestamp = commentTimestamp(oldest);
              const candidateTimestamp = commentTimestamp(comment);
              if (candidateTimestamp !== oldestTimestamp) {
                return candidateTimestamp < oldestTimestamp ? comment : oldest;
              }
              return Number(comment.id) < Number(oldest.id) ? comment : oldest;
            }, null);

            const deleteCommentIfPresent = async (comment) => {
              try {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

            for (const comment of summaryComments) {
              if (String(comment.id) === String(existing?.id)) continue;
              await deleteCommentIfPresent(comment);
            }

  smoke-summary:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'PR Metadata Edit (Smoke Summary)' || 'Smoke Summary' }}
    runs-on: ubuntu-latest
    permissions:
      # This job updates the canonical comment to the terminal Smoke Gate result.
      contents: read
      pull-requests: write
    needs: [changes, smoke-gate, smoke-summary-pending]
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: 💬 Publish Smoke Summary Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_SMOKE_FULL: ${{ needs.changes.outputs.run_smoke_full }}
          SMOKE_GATE_RESULT: ${{ needs.smoke-gate.result }}
        with:
          script: |
            const rawChangesResult = process.env.CHANGES_RESULT || "";
            const changesStatus = ["success", "failure", "cancelled"].includes(rawChangesResult)
              ? rawChangesResult
              : "unavailable";
            const changesHealthy = changesStatus === "success";
            const fullEnabled = process.env.RUN_SMOKE_FULL === "true";
            const rawSmokeGateResult = process.env.SMOKE_GATE_RESULT || "";
            const smokeGateStatus = ["success", "failure", "cancelled", "skipped"].includes(rawSmokeGateResult)
              ? rawSmokeGateResult
              : "unavailable";
            const fullResult = !changesHealthy
              ? `not-evaluated (${changesStatus} changes detection)`
              : fullEnabled
                ? smokeGateStatus
                : "skipped (run_smoke_full=false)";
            const statusIcon = (value) => {
              if (value === "success") return "✅";
              if (value === "failure") return "❌";
              if (value === "cancelled") return "⚪";
              if (value === "skipped") return "⏭️";
              if (value === "unavailable") return "⚠️";
              if (value.startsWith("not-evaluated")) return "⚠️";
              return "⏭️";
            };

            let headline = "⏭️ Runtime smoke is not required";
            if (!changesHealthy) {
              headline = `${statusIcon(smokeGateStatus)} Smoke Gate completed with ${smokeGateStatus}; scope detection was ${changesStatus}`;
            } else if (fullEnabled) {
              headline = `${statusIcon(smokeGateStatus)} Full-stack smoke completed with Smoke Gate: ${smokeGateStatus}`;
            }

            const body = [
              "<!-- firemud-smoke-summary -->",
              "### Smoke Summary",
              headline,
              "",
              `- ${statusIcon(changesStatus)} Changes detection: \`${changesStatus}\``,
              `- ${statusIcon(smokeGateStatus)} Smoke Gate: \`${smokeGateStatus}\``,
              `- ${statusIcon(fullResult)} PR Full-Stack Smoke: \`${fullResult}\``,
            ].join("\n");

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                ...context.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );

            const isBotAuthored = (comment) => comment.user?.login === "github-actions[bot]";
            const isWorkflowComment = (comment) => {
              const body = comment.body ?? "";
              return isBotAuthored(comment) && body.includes("<!-- firemud-smoke-summary -->");
            };
            const isLegacyWorkflowComment = (comment) => {
              const body = comment.body ?? "";
              return isBotAuthored(comment) && body.startsWith("### Smoke Summary");
            };
            const summaryComments = [];
            const seenCommentIds = new Set();
            for (const comment of comments) {
              if ((!isWorkflowComment(comment) && !isLegacyWorkflowComment(comment)) || seenCommentIds.has(comment.id)) {
                continue;
              }
              seenCommentIds.add(comment.id);
              summaryComments.push(comment);
            }
            const commentTimestamp = (comment) => {
              const parsed = Date.parse(comment.created_at || "");
              return Number.isNaN(parsed) ? Number.MAX_SAFE_INTEGER : parsed;
            };
            const existing = summaryComments.reduce((oldest, comment) => {
              if (!oldest) return comment;
              const oldestTimestamp = commentTimestamp(oldest);
              const candidateTimestamp = commentTimestamp(comment);
              if (candidateTimestamp !== oldestTimestamp) {
                return candidateTimestamp < oldestTimestamp ? comment : oldest;
              }
              return Number(comment.id) < Number(oldest.id) ? comment : oldest;
            }, null);

            const deleteCommentIfPresent = async (comment) => {
              try {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

            for (const comment of summaryComments) {
              if (String(comment.id) === String(existing?.id)) continue;
              await deleteCommentIfPresent(comment);
            }

  smoke-gate:
    name: ${{ github.event.action == 'edited' && github.event.changes.base.ref == null && 'PR Metadata Edit (Smoke Gate)' || 'Smoke Gate' }}
    runs-on: ubuntu-latest
    permissions:
      checks: read # Preserve a prior successful required context on metadata-only edits.
      contents: read # Check out the shared required-gate composite action.
      actions: read # Inspect matching runtime-image workflow and job results.
      pull-requests: read # Re-read the current PR head and base before accepting smoke.
    needs: [changes]
    if: ${{ always() && github.event_name == 'pull_request' }}
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Classify smoke gate execution
        id: smoke_gate_context
        env:
          SMOKE_GATE_REQUIRED: ${{ github.event.action != 'edited' || github.event.changes.base.ref != null }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "required=$SMOKE_GATE_REQUIRED" >> "$GITHUB_OUTPUT"
          if [ "$SMOKE_GATE_REQUIRED" = "true" ] && [ "$CHANGES_RESULT" = "success" ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out required-gate action
        if: ${{ steps.smoke_gate_context.outputs.required != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Preserve successful required gate on metadata-only edit
        if: ${{ steps.smoke_gate_context.outputs.required != 'true' }}
        uses: ./.github/actions/preserve-required-gate
        with:
          gate-name: Smoke Gate
          workflow-name: PR Smoke Gate
          workflow-file: smoke.yml
          workflow-path: .github/workflows/smoke.yml

      - name: Fail when smoke dependencies did not succeed
        if: ${{ steps.smoke_gate_context.outputs.required == 'true' && steps.smoke_gate_context.outputs.execute != 'true' }}
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "Smoke change detection did not succeed: changes=$CHANGES_RESULT" >&2
          exit 1

      - name: Record skipped runtime smoke
        if: ${{ steps.smoke_gate_context.outputs.execute == 'true' && needs.changes.outputs.run_smoke_full != 'true' }}
        run: echo "No runtime-stack smoke proof is required for this change."

      - name: Track full-stack smoke result from Build Runtime Images
        if: ${{ steps.smoke_gate_context.outputs.execute == 'true' && needs.changes.outputs.run_smoke_full == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.pull_request.head.sha;
            const baseRef = context.payload.pull_request.base.ref;
            const eventBaseSha = context.payload.pull_request.base.sha;
            const eventMergeSha = context.sha;
            const prNumber = String(context.payload.pull_request.number);
            const started = Date.now();
            const timeoutMs = 25 * 60 * 1000;
            const sleepMs = 15000;
            const pullRequestCheckInterval = 4;
            const retryableStatuses = new Set([408, 425, 429, 500, 502, 503, 504]);
            let pollIteration = 0;
            let identityDiagnostic = "current PR identity has not been resolved";

            async function withTransientGitHubRetry(label, operation) {
              const maxAttempts = 4;
              let retryDelayMs = 1000;
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  return await operation();
                } catch (error) {
                  const status = error?.status ?? error?.response?.status;
                  const retryable = status == null || retryableStatuses.has(status);
                  if (!retryable || attempt === maxAttempts) {
                    throw error;
                  }
                  core.warning(
                    `${label} failed transiently (status=${status ?? "network"}); retrying in ${retryDelayMs}ms`
                  );
                  await new Promise((resolve) => setTimeout(resolve, retryDelayMs));
                  retryDelayMs *= 2;
                }
              }
              throw new Error(`${label} retry loop exited unexpectedly`);
            }

            function isObsoletePullRequest(pullRequest) {
              return (
                pullRequest.state !== "open" ||
                pullRequest.head.sha !== headSha ||
                pullRequest.base.ref !== baseRef
              );
            }

            function logObsoletePullRequest(label, pullRequest) {
              core.info(
                `${label} ${baseRef}@${eventBaseSha}...${headSha}; current PR state/base/head is ${pullRequest.state}/${pullRequest.base.ref}/${pullRequest.head.sha}`
              );
            }

            function identityKey(identity) {
              return `${identity.baseRef}@${identity.baseSha}...${identity.headSha}#${identity.mergeSha}`;
            }

            async function resolveCurrentIdentity(label) {
              let currentPullRequest;
              try {
                ({ data: currentPullRequest } = await withTransientGitHubRetry(
                  "current pull request lookup",
                  () => github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: Number(prNumber),
                  })
                ));
              } catch (error) {
                identityDiagnostic = `${label} could not resolve the current pull request: ${error.message}`;
                core.warning(identityDiagnostic);
                return null;
              }
              if (isObsoletePullRequest(currentPullRequest)) {
                logObsoletePullRequest(label, currentPullRequest);
                return { obsolete: true };
              }

              try {
                if (
                  !/^[0-9a-f]{40}$/.test(eventBaseSha ?? "") ||
                  !/^[0-9a-f]{40}$/.test(eventMergeSha ?? "")
                ) {
                  throw new Error("GitHub supplied an invalid event base or test-merge SHA");
                }

                const { data: mergeCommit } = await withTransientGitHubRetry(
                  "event test-merge lookup",
                  () => github.rest.repos.getCommit({
                    owner,
                    repo,
                    ref: eventMergeSha,
                  })
                );
                const parents = mergeCommit.parents ?? [];
                if (
                  mergeCommit.sha !== eventMergeSha ||
                  parents.length !== 2 ||
                  parents[0]?.sha !== eventBaseSha ||
                  parents[1]?.sha !== headSha
                ) {
                  throw new Error(
                    `event test merge parents are not [${eventBaseSha}, ${headSha}]`
                  );
                }

                identityDiagnostic = `resolved tested identity ${baseRef}@${eventBaseSha}...${headSha}#${eventMergeSha}`;
                return {
                  baseRef,
                  baseSha: eventBaseSha,
                  headSha,
                  mergeSha: eventMergeSha,
                };
              } catch (error) {
                identityDiagnostic = `${label} could not verify the event's exact test merge: ${error.message}`;
                core.warning(identityDiagnostic);
                return null;
              }
            }

            async function isCurrentPullRequestObsolete(label) {
              const { data: currentPullRequest } = await withTransientGitHubRetry(
                "current pull request lookup",
                () => github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: Number(prNumber),
                })
              );
              if (!isObsoletePullRequest(currentPullRequest)) {
                return false;
              }
              logObsoletePullRequest(label, currentPullRequest);
              return true;
            }

            let currentIdentity = null;
            smokeGatePolling: while (Date.now() - started < timeoutMs) {
              if (pollIteration % pullRequestCheckInterval === 0 || !currentIdentity) {
                const resolvedIdentity = await resolveCurrentIdentity(
                  "Stopping obsolete smoke gate for"
                );
                if (resolvedIdentity?.obsolete) {
                  return;
                }
                currentIdentity = resolvedIdentity;
              }
              if (!currentIdentity) {
                core.info(`Waiting for a current PR identity before selecting runtime smoke: ${identityDiagnostic}`);
                await new Promise((resolve) => setTimeout(resolve, sleepMs));
                continue;
              }
              pollIteration += 1;

              const expectedDisplayTitle =
                `Build Runtime Images secure-pr-artifact pr-${prNumber} ` +
                `base-${currentIdentity.baseSha} head-${currentIdentity.headSha} ` +
                `merge-${currentIdentity.mergeSha} mode-required`;
              const workflowRunQuery = {
                owner,
                repo,
                workflow_id: "runtime-images.yml",
                event: "pull_request",
                per_page: 100,
                head_sha: currentIdentity.headSha,
              };
              let matching = null;
              await withTransientGitHubRetry(
                "runtime-images workflow lookup",
                async () => {
                  workflowRunPages: for await (const response of github.paginate.iterator(
                    github.rest.actions.listWorkflowRuns,
                    workflowRunQuery
                  )) {
                    const runs = response.data ?? [];
                    for (const run of runs) {
                      if (
                        run.event !== "pull_request" ||
                        run.head_sha !== currentIdentity.headSha ||
                        run.display_title !== expectedDisplayTitle
                      ) {
                        continue;
                      }
                      const pullRequests = run.pull_requests ?? [];
                      if (
                        pullRequests.length > 0 &&
                        !pullRequests.some((pullRequest) =>
                          String(pullRequest.number) === prNumber &&
                          pullRequest.head?.sha === currentIdentity.headSha
                        )
                      ) {
                        continue;
                      }
                      matching = run;
                      break workflowRunPages;
                    }
                  }
                }
              );
              if (matching) {
                core.info(`Found runtime-images run ${matching.id} with status=${matching.status} conclusion=${matching.conclusion}`);
                if (matching.status !== "completed") {
                  await new Promise((resolve) => setTimeout(resolve, sleepMs));
                  continue;
                }
                if (matching.conclusion !== "success") {
                  if (await isCurrentPullRequestObsolete("Stopping obsolete failed smoke gate for")) {
                    return;
                  }
                  core.setFailed(
                    `Runtime images run ${matching.id} did not complete successfully: run=${matching.conclusion}`
                  );
                  return;
                }

                const latestIdentity = await resolveCurrentIdentity(
                  "Stopping stale completed smoke gate for"
                );
                if (latestIdentity?.obsolete) {
                  return;
                }
                if (!latestIdentity || identityKey(latestIdentity) !== identityKey(currentIdentity)) {
                  currentIdentity = latestIdentity;
                  core.info(
                    `Runtime images run ${matching.id} was not accepted because the current PR identity changed or is unavailable; waiting for a fresh exact run.`
                  );
                  continue;
                }

                let fullSmokeJob = null;
                let fullSmokeStep = null;
                async function failNonTerminalSnapshot(reason) {
                  if (await isCurrentPullRequestObsolete("Stopping obsolete stale-snapshot smoke gate for")) {
                    return;
                  }
                  core.setFailed(
                    `Runtime images run ${matching.id} did not expose a terminal PR Full-Stack Smoke job and smoke step ` +
                    `${reason}: ` +
                    `job=${fullSmokeJob?.status ?? "missing"}/${fullSmokeJob?.conclusion ?? "unknown"}, ` +
                    `step=${fullSmokeStep?.status ?? "missing"}/${fullSmokeStep?.conclusion ?? "unknown"}`
                  );
                }
                const maxCompletedJobSnapshotRetries = 8;
                for (
                  let completedJobSnapshotAttempt = 0;
                  completedJobSnapshotAttempt <= maxCompletedJobSnapshotRetries;
                  completedJobSnapshotAttempt += 1
                ) {
                  const remainingBeforeJobLookupMs = timeoutMs - (Date.now() - started);
                  if (remainingBeforeJobLookupMs <= 0) {
                    await failNonTerminalSnapshot("before the workflow deadline");
                    return;
                  }
                  const jobs = await withTransientGitHubRetry(
                    "runtime-images job lookup",
                    () => github.paginate(
                      github.rest.actions.listJobsForWorkflowRun,
                      {
                        owner,
                        repo,
                        run_id: matching.id,
                        per_page: 100,
                      }
                    )
                  );
                  if (await isCurrentPullRequestObsolete("Stopping obsolete completed smoke gate for")) {
                    return;
                  }
                  fullSmokeJob = jobs.find(
                    (job) => job.name === "PR Full-Stack Smoke"
                  ) ?? null;
                  fullSmokeStep = fullSmokeJob?.steps?.find(
                    (step) => step.name === "Run credential-free full-stack smoke"
                  ) ?? null;
                  if (fullSmokeJob?.status === "completed") {
                    if (fullSmokeStep?.status === "completed") {
                      break;
                    }
                  }
                  if (completedJobSnapshotAttempt < maxCompletedJobSnapshotRetries) {
                    const remainingBeforeSnapshotSleepMs = timeoutMs - (Date.now() - started);
                    if (remainingBeforeSnapshotSleepMs <= 0) {
                      await failNonTerminalSnapshot("before the workflow deadline");
                      return;
                    }
                    core.info(
                      `Runtime images run ${matching.id} succeeded but its PR Full-Stack Smoke job/step snapshot is not terminal yet: ` +
                      `job=${fullSmokeJob?.status ?? "missing"}/${fullSmokeJob?.conclusion ?? "unknown"}, ` +
                      `step=${fullSmokeStep?.status ?? "missing"}/${fullSmokeStep?.conclusion ?? "unknown"}; ` +
                      `retrying ${completedJobSnapshotAttempt + 1}/${maxCompletedJobSnapshotRetries}`
                    );
                    await new Promise((resolve) => setTimeout(
                      resolve,
                      Math.min(sleepMs, remainingBeforeSnapshotSleepMs)
                    ));
                    continue;
                  }
                  const snapshotRetrySummary = maxCompletedJobSnapshotRetries === 0
                    ? "before the remaining workflow deadline allowed a retry"
                    : `after ${maxCompletedJobSnapshotRetries} retries`;
                  await failNonTerminalSnapshot(snapshotRetrySummary);
                  return;
                }

                if (fullSmokeJob?.conclusion !== "success") {
                  if (await isCurrentPullRequestObsolete("Stopping obsolete failed full-smoke gate for")) {
                    return;
                  }
                  core.setFailed(
                    `Runtime images run ${matching.id} succeeded, but PR Full-Stack Smoke job did not complete successfully: ` +
                    `job=${fullSmokeJob?.status ?? "missing"}/${fullSmokeJob?.conclusion ?? "unknown"}`
                  );
                  return;
                }
                if (fullSmokeStep?.conclusion !== "success") {
                  if (await isCurrentPullRequestObsolete("Stopping obsolete skipped full-smoke gate for")) {
                    return;
                  }
                  core.setFailed(
                    `Runtime images run ${matching.id} succeeded, but its credential-free full-stack smoke step did not pass: ` +
                    `step=${fullSmokeStep?.status ?? "missing"}/${fullSmokeStep?.conclusion ?? "unknown"}`
                  );
                  return;
                }
                const finalIdentity = await resolveCurrentIdentity(
                  "Stopping stale smoke gate before accepting full-stack proof"
                );
                if (finalIdentity?.obsolete) {
                  return;
                }
                if (!finalIdentity || identityKey(finalIdentity) !== identityKey(currentIdentity)) {
                  currentIdentity = finalIdentity;
                  core.info(
                    `Runtime images run ${matching.id} was not accepted because the current PR identity changed after its smoke snapshot; waiting for a fresh exact run.`
                  );
                  continue smokeGatePolling;
                }
                return;
              }

              core.info(
                `No exact event-tuple runtime-images/full-smoke run found yet for PR #${prNumber} ` +
                `base ${currentIdentity.baseSha} head ${currentIdentity.headSha} merge ${currentIdentity.mergeSha}; waiting...`
              );
              await new Promise((resolve) => setTimeout(resolve, sleepMs));
            }

            try {
              if (await isCurrentPullRequestObsolete("Stopping obsolete timed-out smoke gate for")) {
                return;
              }
            } catch (error) {
              core.warning(`Timed-out smoke gate could not re-check current PR identity: ${error.message}`);
            }
            const timeoutIdentity = currentIdentity
              ? `base ${currentIdentity.baseSha} head ${currentIdentity.headSha} merge ${currentIdentity.mergeSha}`
              : `event base ${eventBaseSha} head ${headSha} merge ${eventMergeSha}`;
            core.setFailed(
              `Timed out waiting for the exact event-tuple runtime-images/full-smoke run for PR #${prNumber} ${timeoutIdentity}. ` +
              `Diagnostic: ${identityDiagnostic}`
            );
