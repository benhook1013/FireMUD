name: Smoke Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3am UTC

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Smoke-Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      run_smoke_lite: ${{ steps.compute.outputs.run_smoke_lite }}
      run_smoke_full: ${{ steps.compute.outputs.run_smoke_full }}
    steps:
      - name: Compute smoke scope
        id: compute
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("run_smoke_lite", "false");
              core.setOutput("run_smoke_full", "true");
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
              (response) => response.data.map((file) => file.filename)
            );

            const docsOnlyPredicate = (file) =>
              file === "AGENTS.md" ||
              file === "mkdocs.yml" ||
              file.startsWith("design/") ||
              file.startsWith("dev-tools/docs/") ||
              file.endsWith(".md");

            const frontendOnlyPredicate = (file) =>
              file.startsWith("web-client/") ||
              file.startsWith("config/openapi/");

            const liteRelevantPrefixes = [
              "buildSrc/",
              "gradle/",
              "protos/",
              "config/checkstyle/",
              "config/protobuf/",
              "config/security/",
              "config/spotbugs/",
              "docker/",
              "services/",
            ];
            const liteRelevantFiles = new Set([
              "build.gradle.kts",
              "settings.gradle.kts",
              "gradle.properties",
              ".github/workflows/smoke.yml",
            ]);

            const fullRelevantPrefixes = [
              "buildSrc/",
              "gradle/",
              "protos/",
              "docker/",
              "services/account-service/",
              "services/common-data-runtime/",
              "services/common-library/",
              "services/common-platform-core/",
              "services/common-saga/",
              "services/common-security/",
              "services/common-test-support/",
              "services/common-web-support/",
              "services/entity-management-service/",
              "services/game-logic-service/",
              "services/game-session-service/",
              "services/social-groups-service/",
              "services/spring-cloud-gateway/",
              "services/tcp-proxy-service/",
              "services/world-management-service/",
            ];
            const fullRelevantFiles = new Set([
              "build.gradle.kts",
              "settings.gradle.kts",
              "gradle.properties",
              ".github/workflows/smoke.yml",
            ]);

            const nonDocFiles = files.filter((file) => !docsOnlyPredicate(file));
            const nonDocsAreFrontendOnly =
              nonDocFiles.length > 0 && nonDocFiles.every((file) => frontendOnlyPredicate(file));

            if (nonDocFiles.length === 0 || nonDocsAreFrontendOnly) {
              core.setOutput("run_smoke_lite", "false");
              core.setOutput("run_smoke_full", "false");
              return;
            }

            const runSmokeLite = nonDocFiles.some(
              (file) =>
                liteRelevantFiles.has(file) ||
                liteRelevantPrefixes.some((prefix) => file.startsWith(prefix))
            );
            const runSmokeFull = nonDocFiles.some(
              (file) =>
                fullRelevantFiles.has(file) ||
                fullRelevantPrefixes.some((prefix) => file.startsWith(prefix))
            );

            core.setOutput("run_smoke_lite", runSmokeLite ? "true" : "false");
            core.setOutput("run_smoke_full", runSmokeFull ? "true" : "false");

  smoke-lite:
    name: Smoke Tests (Lite)
    needs: [changes]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.run_smoke_lite == 'true' && needs.changes.outputs.run_smoke_full != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 🧪 Run Lite Smoke Integration Checks
        run: |
          ./gradlew \
            :account-service:integrationTest --tests 'net.firedevops.firemud.accountservice.AccountApplicationIntegrationTest' \
            :game-session-service:integrationTest --tests 'net.firedevops.firemud.gamesession.GameSessionApplicationIntegrationTest' --tests 'net.firedevops.firemud.gamesession.GameSessionLoginIntegrationTest' --tests 'net.firedevops.firemud.gamesession.websocket.GameSessionWebSocketHandlerIntegrationTest' \
            :tcp-proxy-service:integrationTest --tests 'net.firedevops.firemud.tcpproxy.TcpProxyServiceApplicationIntegrationTest'

  smoke-full:
    name: Smoke Tests (Full Stack)
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_smoke_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SMOKE_TIMEOUT_SECONDS: 20
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 📝 Create CI .env placeholder
        run: touch .env

      - name: Generate Dev Certificates
        run: ./dev-tools/generate-dev-certs.sh dev-tools/certs

      - name: 🚀 Start Dev Stack (devUp)
        run: ./gradlew devUp

      - name: 📦 Install WebSocket smoke dependency
        run: python3 -m pip install --disable-pip-version-check websocket-client

      - name: 🧪 Direct WebSocket LOGIN + LOOK (Game Session)
        run: |
          cd services/game-session-service
          bash ./websocket-login-look-smoke.sh

      - name: 🧪 Telnet LOGIN + LOOK (TCP Proxy)
        run: |
          cd services/tcp-proxy-service
          bash ./telnet-login-look-smoke.sh

      - name: 📜 Dump Docker Compose Logs on Failure
        if: failure()
        run: |
          if [ -f docker/docker-compose.yml ]; then
            docker compose -f docker/docker-compose.yml logs || true
          fi

      - name: 🧹 Stop Dev Stack (devDown)
        if: always()
        run: ./gradlew devDown

  smoke-gate:
    name: Smoke Gate
    runs-on: ubuntu-latest
    needs: [changes, smoke-lite, smoke-full]
    if: always()
    steps:
      - name: Enforce successful smoke tests
        run: |
          if [ "${{ needs.changes.outputs.run_smoke_lite }}" = "true" ] && [ "${{ needs.changes.outputs.run_smoke_full }}" != "true" ] && [ "${{ needs.smoke-lite.result }}" != "success" ]; then
            echo "Lite smoke tests did not complete successfully: ${{ needs.smoke-lite.result }}"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.run_smoke_full }}" = "true" ] && [ "${{ needs.smoke-full.result }}" != "success" ]; then
            echo "Full smoke tests did not complete successfully: ${{ needs.smoke-full.result }}"
            exit 1
          fi

  smoke-summary:
    name: Smoke Summary
    runs-on: ubuntu-latest
    needs: [changes, smoke-lite, smoke-full, smoke-gate]
    if: ${{ github.event_name == 'pull_request' && always() }}
    steps:
      - name: 💬 Publish Smoke Summary Comment
        uses: actions/github-script@v8
        with:
          script: |
            const liteEnabled = "${{ needs.changes.outputs.run_smoke_lite }}" === "true";
            const fullEnabled = "${{ needs.changes.outputs.run_smoke_full }}" === "true";
            const liteResult = liteEnabled && !fullEnabled ? "${{ needs.smoke-lite.result }}" : "skipped";
            const fullResult = fullEnabled ? "${{ needs.smoke-full.result }}" : "skipped";
            const statusIcon = (value) => {
              if (value === "success") return "✅";
              if (value === "failure") return "❌";
              if (value === "cancelled") return "⚪";
              return "⏭️";
            };

            let headline = "✅ Smoke tests passed";
            if (
              ["failure", "cancelled", "timed_out"].includes(liteResult) ||
              ["failure", "cancelled", "timed_out"].includes(fullResult)
            ) {
              headline = "❌ Smoke tests failed";
            } else if (!liteEnabled && !fullEnabled) {
              headline = "⏭️ Smoke tests skipped";
            }

            const body = [
              "### Smoke Summary",
              headline,
              "",
              `- ${statusIcon(liteResult)} Smoke Tests (Lite): \`${liteResult}\``,
              `- ${statusIcon(fullResult)} Smoke Tests (Full Stack): \`${fullResult}\``,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(comment =>
              comment.body.startsWith("### Smoke Summary")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }
