name: Smoke Tests

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ format('pr-{0}-controller', github.event.pull_request.number) }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Smoke-Relevant Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    outputs:
      run_smoke_full: ${{ steps.compute.outputs.run_smoke_full }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Compute smoke scope
        id: compute
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
              (response) => response.data.map((file) => file.filename)
            );

            const docsOnlyPredicate = (file) =>
              file === "AGENTS.md" ||
              file === "mkdocs.yml" ||
              file.startsWith("design/") ||
              file.startsWith("dev-tools/docs/") ||
              file.endsWith(".md");

            const frontendOnlyPredicate = (file) =>
              file.startsWith("web-client/") ||
              file.startsWith("config/openapi/");

            const fullRelevantPrefixes = [
              "buildSrc/",
              "gradle/",
              "protos/",
              "docker/",
              "services/account-service/",
              "services/automation-scripting-service/",
              "services/common-library/",
              "services/common-data-runtime/",
              "services/common-platform-core/",
              "services/common-saga/",
              "services/common-security/",
              "services/common-test-support/",
              "services/common-web-support/",
              "services/entity-management-service/",
              "services/game-design-service/",
              "services/game-logic-service/",
              "services/game-session-service/",
              "services/logging-admin-service/",
              "services/social-groups-service/",
              "services/spring-cloud-gateway/",
              "services/tcp-proxy-service/",
              "services/world-management-service/",
            ];
            const fullRelevantFiles = new Set([
              "build.gradle.kts",
              "settings.gradle.kts",
              "gradle.properties",
              ".github/workflows/smoke.yml",
              ".github/workflows/smoke-full.yml",
              ".github/workflows/runtime-images.yml",
              ".github/workflows/publish-pr-runtime-images.yml",
              "dev-tools/build-compose-service-jars.sh",
              "dev-tools/build-local-smoke-images.sh",
              "dev-tools/certs/generate-dev-certs.sh",
              "dev-tools/verify-compose-health.sh",
              "dev-tools/verify-fresh-bootstrap.sh",
              "dev-tools/verify-restart-state.sh",
              "dev-tools/verify-smoke-images.sh",
            ]);

            const nonDocFiles = files.filter((file) => !docsOnlyPredicate(file));
            const nonDocsAreFrontendOnly =
              nonDocFiles.length > 0 && nonDocFiles.every((file) => frontendOnlyPredicate(file));

            if (nonDocFiles.length === 0 || nonDocsAreFrontendOnly) {
              core.setOutput("run_smoke_full", "false");
              return;
            }

            const runSmokeFull = nonDocFiles.some(
              (file) =>
                fullRelevantFiles.has(file) ||
                fullRelevantPrefixes.some((prefix) => file.startsWith(prefix))
            );
            core.setOutput("run_smoke_full", runSmokeFull ? "true" : "false");

  smoke-summary:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'PR Metadata Edit (Smoke Summary)' || 'Smoke Summary' }}
    runs-on: ubuntu-latest
    permissions:
      # Only this job publishes or updates the pull request smoke summary comment.
      contents: read
      pull-requests: write
    needs: [changes]
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: 💬 Publish Smoke Summary Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_SMOKE_FULL: ${{ needs.changes.outputs.run_smoke_full }}
        with:
          script: |
            const rawChangesResult = process.env.CHANGES_RESULT || "";
            const changesStatus = ["success", "failure", "cancelled"].includes(rawChangesResult)
              ? rawChangesResult
              : "unavailable";
            const changesHealthy = changesStatus === "success";
            const fullEnabled = process.env.RUN_SMOKE_FULL === "true";
            const fullResult = !changesHealthy
              ? `not-evaluated (${changesStatus} changes detection)`
              : fullEnabled
                ? "tracked-by-smoke-gate"
                : "skipped (run_smoke_full=false)";
            const statusIcon = (value) => {
              if (value === "success") return "✅";
              if (value === "failure") return "❌";
              if (value === "cancelled") return "⚪";
              if (value === "tracked-by-smoke-gate") return "⏳";
              if (value === "unavailable") return "⚠️";
              if (value.startsWith("not-evaluated")) return "⚠️";
              return "⏭️";
            };

            let headline = "⏭️ Runtime smoke is not required";
            if (!changesHealthy) {
              headline = `⚠️ Smoke scope detection ${changesStatus}; Smoke Gate remains authoritative`;
            } else if (fullEnabled) {
              headline = "⏳ Full-stack smoke is tracked by Smoke Gate";
            }

            const body = [
              "### Smoke Summary",
              headline,
              "",
              `- ${statusIcon(changesStatus)} Changes detection: \`${changesStatus}\``,
              `- ${statusIcon(fullResult)} Smoke Tests (Full Stack): \`${fullResult}\``,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const summaryComments = comments.filter(comment =>
              comment.body.startsWith("### Smoke Summary")
            );
            const existing = summaryComments[0];

            if (summaryComments.length > 1) {
              for (const comment of summaryComments.slice(1)) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                });
              }
            }

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

  smoke-gate:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'PR Metadata Edit (Smoke Gate)' || 'Smoke Gate' }}
    runs-on: ubuntu-latest
    permissions:
      # This job reads workflow and job results for the matching runtime-image run.
      contents: read
      actions: read
    needs: [changes]
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    timeout-minutes: 30
    steps:
      - name: Fail when smoke dependencies did not succeed
        if: ${{ needs.changes.result != 'success' }}
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "Smoke change detection did not succeed: changes=$CHANGES_RESULT" >&2
          exit 1

      - name: Harden runner
        if: ${{ needs.changes.result == 'success' }}
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Record skipped runtime smoke
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_smoke_full != 'true' }}
        run: echo "No runtime-stack smoke proof is required for this change."

      - name: Wait for full smoke dispatch result
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_smoke_full == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.pull_request.head.sha;
            const baseSha = context.payload.pull_request.base.sha;
            const mergeSha = context.sha;
            const prNumber = String(context.payload.pull_request.number);
            const expectedDisplayTitle = `Build Runtime Images secure-pr-artifact pr-${prNumber} base-${baseSha} head-${headSha} merge-${mergeSha} mode-required`;
            const started = Date.now();
            const timeoutMs = 25 * 60 * 1000;
            const sleepMs = 15000;

            while (Date.now() - started < timeoutMs) {
              const { data: currentPullRequest } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: Number(prNumber),
              });
              if (currentPullRequest.state !== "open" || currentPullRequest.head.sha !== headSha) {
                core.info(
                  `Stopping obsolete smoke gate for head ${headSha}; current PR state/head is ${currentPullRequest.state}/${currentPullRequest.head.sha}`
                );
                return;
              }

              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner,
                  repo,
                  workflow_id: "runtime-images.yml",
                  event: "pull_request",
                  head_sha: headSha,
                  per_page: 100,
                }
              );

              const matching = runs.find((run) => {
                if (
                  run.event !== "pull_request" ||
                  run.head_sha !== headSha ||
                  run.display_title !== expectedDisplayTitle
                ) {
                  return false;
                }
                const pullRequests = run.pull_requests ?? [];
                return pullRequests.length === 0 || pullRequests.some((pullRequest) =>
                  String(pullRequest.number) === prNumber &&
                  pullRequest.base?.sha === baseSha &&
                  pullRequest.head?.sha === headSha
                );
              });
              if (matching) {
                core.info(`Found runtime-images run ${matching.id} with status=${matching.status} conclusion=${matching.conclusion}`);
                if (matching.status !== "completed") {
                  await new Promise((resolve) => setTimeout(resolve, sleepMs));
                  continue;
                }

                const jobs = await github.paginate(
                  github.rest.actions.listJobsForWorkflowRun,
                  {
                    owner,
                    repo,
                    run_id: matching.id,
                    per_page: 100,
                  }
                );
                const fullSmokeJob = jobs.find(
                  (job) => job.name === "Smoke Tests (Full Stack) / Smoke Tests (Full Stack)"
                );
                if (!fullSmokeJob) {
                  core.setFailed(`Runtime images run ${matching.id} did not expose the required Smoke Tests (Full Stack) job`);
                  return;
                }

                if (matching.conclusion !== "success" || fullSmokeJob.status !== "completed" || fullSmokeJob.conclusion !== "success") {
                  core.setFailed(
                    `Runtime images/full smoke run ${matching.id} did not complete successfully: run=${matching.conclusion}, full-smoke=${fullSmokeJob.status}/${fullSmokeJob.conclusion}`
                  );
                }
                return;
              }

              core.info(`No runtime-images/full-smoke run found yet for PR #${prNumber} base ${baseSha} head ${headSha} merge ${mergeSha}; waiting...`);
              await new Promise((resolve) => setTimeout(resolve, sleepMs));
            }

            core.setFailed(`Timed out waiting for runtime-images/full-smoke run for PR #${prNumber} base ${baseSha} head ${headSha} merge ${mergeSha}`);
