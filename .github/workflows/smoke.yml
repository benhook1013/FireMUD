name: Smoke Tests

on:
  pull_request:
    branches: [main, develop]
  workflow_run:
    workflows: ["Build Runtime Images"]
    types: [completed]

permissions:
  contents: read
  packages: read
  pull-requests: write

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Smoke-Relevant Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    outputs:
      run_smoke_lite: ${{ steps.compute.outputs.run_smoke_lite }}
    steps:
      - name: Compute smoke scope
        id: compute
        uses: actions/github-script@v8
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
              (response) => response.data.map((file) => file.filename)
            );

            const docsOnlyPredicate = (file) =>
              file === "AGENTS.md" ||
              file === "mkdocs.yml" ||
              file.startsWith("design/") ||
              file.startsWith("dev-tools/docs/") ||
              file.endsWith(".md");

            const frontendOnlyPredicate = (file) =>
              file.startsWith("web-client/") ||
              file.startsWith("config/openapi/");

            const liteRelevantPrefixes = [
              "buildSrc/",
              "gradle/",
              "protos/",
              "config/checkstyle/",
              "config/protobuf/",
              "config/security/",
              "config/spotbugs/",
              "docker/",
              "services/",
            ];
            const liteRelevantFiles = new Set([
              "build.gradle.kts",
              "settings.gradle.kts",
              "gradle.properties",
              ".github/workflows/smoke.yml",
            ]);

            const fullRelevantPrefixes = [
              "buildSrc/",
              "gradle/",
              "protos/",
              "docker/",
              "services/account-service/",
              "services/common-data-runtime/",
              "services/common-library/",
              "services/common-platform-core/",
              "services/common-saga/",
              "services/common-security/",
              "services/common-test-support/",
              "services/common-web-support/",
              "services/entity-management-service/",
              "services/game-logic-service/",
              "services/game-session-service/",
              "services/social-groups-service/",
              "services/spring-cloud-gateway/",
              "services/tcp-proxy-service/",
              "services/world-management-service/",
            ];
            const fullRelevantFiles = new Set([
              "build.gradle.kts",
              "settings.gradle.kts",
              "gradle.properties",
              ".github/workflows/smoke.yml",
            ]);

            const nonDocFiles = files.filter((file) => !docsOnlyPredicate(file));
            const nonDocsAreFrontendOnly =
              nonDocFiles.length > 0 && nonDocFiles.every((file) => frontendOnlyPredicate(file));

            if (nonDocFiles.length === 0 || nonDocsAreFrontendOnly) {
              core.setOutput("run_smoke_lite", "false");
              return;
            }

            const runSmokeLite = nonDocFiles.some(
              (file) =>
                liteRelevantFiles.has(file) ||
                liteRelevantPrefixes.some((prefix) => file.startsWith(prefix))
            );
            core.setOutput("run_smoke_lite", runSmokeLite ? "true" : "false");

  smoke-lite:
    name: Smoke Tests (Lite)
    needs: [changes]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.run_smoke_lite == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: 🧪 Run Lite Smoke Integration Checks
        run: |
          ./gradlew \
            :account-service:integrationTest --tests 'net.firedevops.firemud.accountservice.AccountApplicationIntegrationTest' \
            :game-session-service:integrationTest --tests 'net.firedevops.firemud.gamesession.GameSessionApplicationIntegrationTest' --tests 'net.firedevops.firemud.gamesession.GameSessionLoginIntegrationTest' --tests 'net.firedevops.firemud.gamesession.websocket.GameSessionWebSocketHandlerIntegrationTest' \
            :tcp-proxy-service:integrationTest --tests 'net.firedevops.firemud.tcpproxy.TcpProxyServiceApplicationIntegrationTest'

  smoke-full-context:
    name: Derive Smoke Runtime Context
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    outputs:
      head_sha: ${{ steps.meta.outputs.head_sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      pr_number: ${{ steps.meta.outputs.pr_number }}
      should_comment: ${{ steps.meta.outputs.should_comment }}
    steps:
      - name: Derive smoke context
        id: meta
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          IMAGE_TAG="${HEAD_SHA}"
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number || '' }}"
          SHOULD_COMMENT="false"
          if [ -n "$PR_NUMBER" ]; then
            SHOULD_COMMENT="true"
          fi
          {
            echo "head_sha=${HEAD_SHA}"
            echo "image_tag=${IMAGE_TAG}"
            echo "pr_number=${PR_NUMBER}"
            echo "should_comment=${SHOULD_COMMENT}"
          } >> "$GITHUB_OUTPUT"

  smoke-full:
    name: Smoke Tests (Full Stack)
    needs: [smoke-full-context]
    if: ${{ needs.smoke-full-context.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SMOKE_TIMEOUT_SECONDS: 20
      SMOKE_IMAGE_TAG: ${{ needs.smoke-full-context.outputs.image_tag }}
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.smoke-full-context.outputs.head_sha }}

      - name: 📝 Create CI .env placeholder
        run: touch .env

      - name: Generate Dev Certificates
        run: ./dev-tools/generate-dev-certs.sh dev-tools/certs

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Start Smoke Stack
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.override.yml \
            -f docker/docker-compose.smoke-images.override.yml \
            up \
            -d \
            --wait \
            --wait-timeout 180 \
            postgres \
            redis-coord \
            redis-cache \
            account-service \
            entity-management-service \
            gateway \
            game-logic-service \
            game-session-service \
            tcp-proxy-service \
            world-management-service

      - name: 📦 Install WebSocket smoke dependency
        run: python3 -m pip install --disable-pip-version-check websocket-client

      - name: 🧪 Direct WebSocket LOGIN + LOOK (Game Session)
        run: |
          cd services/game-session-service
          bash ./websocket-login-look-smoke.sh

      - name: 🧪 Telnet LOGIN + LOOK (TCP Proxy)
        run: |
          cd services/tcp-proxy-service
          bash ./telnet-login-look-smoke.sh

      - name: 📜 Dump Docker Compose Logs on Failure
        if: failure()
        run: |
          if [ -f docker/docker-compose.yml ]; then
            docker compose \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.override.yml \
              -f docker/docker-compose.smoke-images.override.yml \
              logs || true
          fi

      - name: 🧹 Stop Smoke Stack
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.override.yml \
            -f docker/docker-compose.smoke-images.override.yml \
            down

  smoke-summary:
    name: Smoke Summary
    runs-on: ubuntu-latest
    needs: [changes, smoke-lite, smoke-full-context, smoke-full]
    if: ${{ always() && ((github.event_name == 'pull_request') || (github.event_name == 'workflow_run' && needs.smoke-full-context.outputs.should_comment == 'true')) }}
    steps:
      - name: 💬 Publish Smoke Summary Comment
        uses: actions/github-script@v8
        with:
          script: |
            const eventName = "${{ github.event_name }}";
            const liteEnabled = eventName === "pull_request" && "${{ needs.changes.outputs.run_smoke_lite }}" === "true";
            const fullEnabled = eventName === "workflow_run";
            const liteResult = liteEnabled ? "${{ needs.smoke-lite.result }}" : "skipped";
            const fullResult = fullEnabled ? "${{ needs.smoke-full.result }}" : "skipped";
            const statusIcon = (value) => {
              if (value === "success") return "✅";
              if (value === "failure") return "❌";
              if (value === "cancelled") return "⚪";
              return "⏭️";
            };

            let headline = "✅ Smoke tests passed";
            if (
              ["failure", "cancelled", "timed_out"].includes(liteResult) ||
              ["failure", "cancelled", "timed_out"].includes(fullResult)
            ) {
              headline = "❌ Smoke tests failed";
            } else if (!liteEnabled && !fullEnabled) {
              headline = "⏭️ Smoke tests skipped";
            }

            const body = [
              "### Smoke Summary",
              headline,
              "",
              `- ${statusIcon(liteResult)} Smoke Tests (Lite): \`${liteResult}\``,
              `- ${statusIcon(fullResult)} Smoke Tests (Full Stack): \`${fullResult}\``,
            ].join("\n");

            const issueNumber = eventName === "pull_request"
              ? context.issue.number
              : Number("${{ needs.smoke-full-context.outputs.pr_number }}");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: issueNumber
            });

            const existing = comments.find(comment =>
              comment.body.startsWith("### Smoke Summary")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body
              });
            }
