                    owner,
                    repo,
                    pull_number: Number(prNumber),
                  })
                ));
              } catch (error) {
                if (error instanceof TerminalGitHubRequestError) throw error;
                identityDiagnostic = `${label} could not resolve the current pull request: ${error.message}`;
                core.warning(identityDiagnostic);
                return null;
              }
              if (isObsoletePullRequest(currentPullRequest)) {
                logObsoletePullRequest(label, currentPullRequest);
                return { obsolete: true };
              }

              try {
                // Edited events can omit a usable test-merge SHA. Only immutable
                // ordered parents authorize event proof; otherwise require the
                // independently verified current tuple's trusted refresh.
                const validEventTuple = /^[0-9a-f]{40}$/.test(eventBaseSha ?? "") &&
                  /^[0-9a-f]{40}$/.test(eventMergeSha ?? "");
                const mergeCommit = validEventTuple
                  ? await immutableCommit(eventMergeSha, "event test-merge lookup")
                  : null;
                const parents = mergeCommit?.parents ?? [];
                if (
                  mergeCommit?.sha === eventMergeSha &&
                  parents.length === 2 &&
                  parents[0]?.sha === eventBaseSha &&
                  parents[1]?.sha === headSha
                ) {
                  identityDiagnostic = `resolved tested event identity ${baseRef}@${eventBaseSha}...${headSha}#${eventMergeSha}`;
                  return {
                    baseRef,
                    baseSha: eventBaseSha,
                    headSha,
                    mergeSha: eventMergeSha,
                    sourceEvent: "pull_request",
                  };
                }

                core.info(
                  `Event test merge parents are not [${eventBaseSha}, ${headSha}]; checking for an exact trusted current-base smoke refresh.`
                );
                const { data: currentBaseRefData } = await withTransientGitHubRetry(
                  "current base ref lookup",
                  () => github.rest.git.getRef({
                    owner,
                    repo,
                    ref: `heads/${baseRef}`,
                  })
                );
                const currentBaseSha = currentBaseRefData.object?.sha;
                const currentMergeSha = currentPullRequest.merge_commit_sha;
                if (
                  !/^[0-9a-f]{40}$/.test(currentBaseSha ?? "") ||
                  !/^[0-9a-f]{40}$/.test(currentMergeSha ?? "")
                ) {
                  throw new Error("GitHub returned an invalid current base or test-merge SHA");
                }
                const currentMergeCommit = await immutableCommit(currentMergeSha, "current test-merge lookup");
                const currentParents = currentMergeCommit.parents ?? [];
                if (
                  currentMergeCommit.sha !== currentMergeSha ||
                  currentParents.length !== 2 ||
                  currentParents[0]?.sha !== currentBaseSha ||
                  currentParents[1]?.sha !== headSha
                ) {
                  throw new Error(
                    `current test merge parents are not [${currentBaseSha}, ${headSha}]`
                  );
                }

                identityDiagnostic = `resolved trusted current-base identity ${baseRef}@${currentBaseSha}...${headSha}#${currentMergeSha}`;
                return {
                  baseRef,
                  baseSha: currentBaseSha,
                  headSha,
                  mergeSha: currentMergeSha,
                  sourceEvent: "repository_dispatch",
                };
              } catch (error) {
                if (error instanceof TerminalGitHubRequestError) throw error;
                identityDiagnostic = `${label} could not verify the event or trusted current-base test merge: ${error.message}`;
                core.warning(identityDiagnostic);
                return null;
              }
            }

            async function isCurrentPullRequestObsolete(label) {
              const { data: currentPullRequest } = await withTransientGitHubRetry(
                "current pull request lookup",
                () => github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: Number(prNumber),
                })
              );
              if (!isObsoletePullRequest(currentPullRequest)) {
                return false;
              }
              logObsoletePullRequest(label, currentPullRequest);
              return true;
            }

            let currentIdentity = null;
            let cancelledRunId = null;
            let cancelledRunObservedAt = null;
            smokeGatePolling: while (Date.now() - started < timeoutMs) {
              if (pollIteration % pullRequestCheckInterval === 0 || !currentIdentity) {
                const resolvedIdentity = await resolveCurrentIdentity(
                  "Stopping obsolete smoke gate for"
                );
                if (resolvedIdentity?.obsolete) {
                  return;
                }
                currentIdentity = resolvedIdentity;
              }
              if (!currentIdentity) {
                core.info(`Waiting for a current PR identity before selecting runtime smoke: ${identityDiagnostic}`);
                await new Promise((resolve) => setTimeout(resolve, sleepMs));
                continue;
              }
              pollIteration += 1;

              const expectedDisplayTitle =
                `Build Runtime Images secure-pr-artifact pr-${prNumber} ` +
                `base-${currentIdentity.baseSha} head-${currentIdentity.headSha} ` +
                `merge-${currentIdentity.mergeSha} mode-required`;
              const selection = {
                retryPrimary: retryPrimary?.identity === identityKey(currentIdentity) ? retryPrimary : null,
              };
              retryPrimary = null;
              async function retryExactSelection(message, { requirePendingPrimary = true } = {}) {
                const remainingMs = timeoutMs - (Date.now() - started);
                if (remainingMs <= 0 || (requirePendingPrimary && !selection.pendingPrimary)) return false;
                core.warning(message);
                retryPrimary = selection.pendingPrimary ? {
                  id: selection.pendingPrimary.id,
                  run_attempt: selection.pendingPrimary.run_attempt,
                  identity: identityKey(currentIdentity),
                } : null;
                await new Promise((resolve) => setTimeout(resolve, Math.min(sleepMs, remainingMs)));
                return true;
              }
              let matching = await findMatchingRuntimeImagesRun(
                currentIdentity.sourceEvent,
                expectedDisplayTitle,
                currentIdentity,
                selection
              );
              if (
                currentIdentity.sourceEvent === "pull_request" &&
                cancelledRunId !== null &&
                (matching?.id !== cancelledRunId ||
                  matching.status !== "completed" ||
                  matching.conclusion !== "cancelled")
              ) {
                cancelledRunId = null;
                cancelledRunObservedAt = null;
              }
              if (
                currentIdentity.sourceEvent === "pull_request" &&
                matching?.status === "completed" &&
                matching.conclusion === "cancelled"
              ) {
                if (cancelledRunId !== matching.id) {
                  cancelledRunId = matching.id;
                  cancelledRunObservedAt = Date.now();
                }
                const replacement = await findMatchingRuntimeImagesRun(
                  "repository_dispatch",
                  expectedDisplayTitle,
                  currentIdentity,
                  selection
                );
                if (!replacement) {
                  if (Date.now() - cancelledRunObservedAt >= cancelledReplacementTimeoutMs) {
                    if (await isCurrentPullRequestObsolete("Stopping obsolete cancelled-run smoke gate for")) {
                      return;
                    }
                    core.setFailed(
                      `Cancelled runtime-images run ${cancelledRunId} has no exact repository_dispatch replacement ` +
                      `after ${cancelledReplacementTimeoutMs / 60000} minutes`
                    );
                    return;
                  }
                  core.info(
                    `Exact pull_request runtime-images run ${matching.id} was cancelled; waiting for an exact repository_dispatch replacement.`
                  );
                  await new Promise((resolve) => setTimeout(resolve, sleepMs));
                  continue;
                }
                core.info(
                  `Exact pull_request runtime-images run ${matching.id} was cancelled; checking exact repository_dispatch replacement ${replacement.id}.`
                );
                matching = replacement;
              }
              // A queued native run can share a tuple with a completed trusted refresh.
              // It must not hide already verified smoke proof or cause a second dispatch.
              if (!isRetryPrimary(selection, matching) && currentIdentity.sourceEvent === "pull_request" &&
                  matching?.event === "pull_request" && matching.status !== "completed") {
                let replacement;
                const refreshSelection = { retryPrimary: selection.retryPrimary };
                try {
                  replacement = await findMatchingRuntimeImagesRun(
                    "repository_dispatch", expectedDisplayTitle, currentIdentity, refreshSelection
                  );
                } catch (error) {
                  if (!canResumeAfterOptionalGitHubError(error, matching)) throw error;
                  core.warning("Trusted refresh inventory is unavailable; retain the native wait.");
                }
                try {
                  if (replacement && await verifyCompletedCanonicalRuntime(replacement, currentIdentity)) {
                    core.info("A completed verified exact trusted refresh supersedes the pending native wait.");
                    selection.pendingPrimary = matching;
                    selection.pendingRefresh = refreshSelection.pendingPrimary;
                    matching = replacement;
                  }
                } catch (error) {
                  if (error instanceof TerminalGitHubRequestError) throw error;
                  core.info("Trusted refresh proof is unavailable; retain the native wait.");
                }
              }
              if (matching) {
                core.info(`Found runtime-images run ${matching.id} with status=${matching.status} conclusion=${matching.conclusion}`);
                if (matching.status !== "completed") {
                  await new Promise((resolve) => setTimeout(resolve, sleepMs));
                  continue;
                }
                if (matching.conclusion !== "success") {
                  if (await isCurrentPullRequestObsolete("Stopping obsolete failed smoke gate for")) {
                    return;
                  }
                  if (matching.conclusion === "failure" && repositoryName === "benhook1013/FireMUD" &&
                      ["pull_request", "repository_dispatch"].includes(matching.event)) {
                    let knownPlayVerified = false;
                    try {
                      const jobs = await withTransientGitHubRetry("canonical transition PLAY failure jobs lookup", () =>
                        github.paginate("GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs", {
                          owner, repo, run_id: matching.id, attempt_number: matching.run_attempt, per_page: 100,
                        })
                      );
                      const candidate = jobs.find((job) => job.name === canonicalSmokeJobName);
                      knownPlayVerified = Boolean(candidate) &&
                        await verifyKnownPlayFailure(matching, candidate, currentIdentity);
                    } catch (error) {
                      if (error instanceof TerminalGitHubRequestError) throw error;
                      core.warning(`Canonical PLAY transition exception proof is unavailable: ${error?.message ?? String(error)}`);
                    }
                    if (knownPlayVerified) {
                      const freshIdentity = await resolveCurrentIdentity("Stopping stale canonical transition PLAY exception");
                      if (freshIdentity?.obsolete) return;
                      if (!freshIdentity || identityKey(freshIdentity) !== identityKey(currentIdentity)) {
                        currentIdentity = freshIdentity;
                        continue smokeGatePolling;
                      }
                      core.setOutput("known_play_exception", "true");
                      core.warning("Canonical PLAY transition exception accepted: LOGIN succeeded, direct backend PLAY failed ERROR ENTITLEMENT_UNAVAILABLE. No runtime qualification or image publication.");
                      await core.summary.addHeading("Canonical PLAY transition exception accepted")
                        .addRaw("Known PLAY failed: ERROR ENTITLEMENT_UNAVAILABLE after LOGIN. Held-admission qualification and authenticated cleanup passed. No runtime qualification, image export, or publication.")
                        .write();
                      return;
                    }
                  }
                  core.setFailed(
                    `Runtime images run ${matching.id} did not complete successfully: run=${matching.conclusion}`
                  );
                  return;
                }

                const latestIdentity = await resolveCurrentIdentity(
                  "Stopping stale completed smoke gate for"
                );
                if (latestIdentity?.obsolete) {
                  return;
                }
                if (!latestIdentity || identityKey(latestIdentity) !== identityKey(currentIdentity)) {
                  currentIdentity = latestIdentity;
                  core.info(
                    `Runtime images run ${matching.id} was not accepted because the current PR identity changed or is unavailable; waiting for a fresh exact run.`
                  );
                  continue;
                }

                let fullSmokeJob = null;
                let fullSmokeStep = null;
                let canonicalProducerVerified = false;
                async function failNonTerminalSnapshot(reason) {
                  if (await isCurrentPullRequestObsolete("Stopping obsolete stale-snapshot smoke gate for")) {
                    return;
                  }
                  core.setFailed(
                    `Runtime images run ${matching.id} did not expose a terminal PR Full-Stack Smoke job and smoke step ` +
                    `${reason}: ` +
                    `job=${fullSmokeJob?.status ?? "missing"}/${fullSmokeJob?.conclusion ?? "unknown"}, ` +
                    `step=${fullSmokeStep?.status ?? "missing"}/${fullSmokeStep?.conclusion ?? "unknown"}`
                  );
                }
                const maxCompletedJobSnapshotRetries = 8;
                for (
                  let completedJobSnapshotAttempt = 0;
                  completedJobSnapshotAttempt <= maxCompletedJobSnapshotRetries;
                  completedJobSnapshotAttempt += 1
                ) {
                  const remainingBeforeJobLookupMs = timeoutMs - (Date.now() - started);
                  if (remainingBeforeJobLookupMs <= 0) {
                    await failNonTerminalSnapshot("before the workflow deadline");
                    return;
                  }
                  let jobs;
                  try {
                    jobs = await withTransientGitHubRetry(
                      "runtime-images job lookup",
                      () => github.paginate(
                        "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
                        {
                          owner,
                          repo,
                          run_id: matching.id,
                          attempt_number: matching.run_attempt,
                          per_page: 100,
                        }
                      )
                    );
                  } catch (error) {
                    // Re-read the pending comparison on the next bounded poll. No
                    // partial evidence from this alternative carries into that poll.
                    if (canResumeAfterOptionalGitHubError(error, selection.pendingPrimary) && await retryExactSelection(
                      `Runtime alternative ${matching.id} jobs are temporarily unavailable; retry exact primary selection.`
                    )) continue smokeGatePolling;
                    throw error;
                  }
                  if (await isCurrentPullRequestObsolete("Stopping obsolete completed smoke gate for")) {
                    return;
                  }
                  const producerJobs = jobs.filter((job) =>
                    job.name === "PR Full-Stack Smoke" || job.name === canonicalSmokeJobName
                  );
                  if (producerJobs.length > 1) {
                    await failNonTerminalSnapshot("with ambiguous producer jobs");
                    return;
                  }
                  fullSmokeJob = producerJobs[0] ?? null;
                  fullSmokeStep = fullSmokeJob?.steps?.find(
                    (step) => step.name === "Run credential-free full-stack smoke"
                  ) ?? null;
                  if (fullSmokeJob?.status === "completed") {
                    // Known terminal smoke failure/skipping cannot be replaced by job success.
                    if (fullSmokeStep?.status === "completed") {
                      break;
                    }
                    if (fullSmokeJob.name === canonicalSmokeJobName &&
                        fullSmokeJob.conclusion === "success") {
                      try {
                        canonicalProducerVerified = await verifyCanonicalSmokeProducer(
                          matching, fullSmokeJob, currentIdentity
                        );
                      } catch (error) {
                        if (error instanceof TerminalGitHubRequestError) throw error;
                        core.warning(`Canonical smoke producer proof is unavailable: ${error.message}`);
                      }
                      if (canonicalProducerVerified) break;
                    }
                  }
                  if (completedJobSnapshotAttempt < maxCompletedJobSnapshotRetries) {
                    const remainingBeforeSnapshotSleepMs = timeoutMs - (Date.now() - started);
                    if (remainingBeforeSnapshotSleepMs <= 0) {
                      await failNonTerminalSnapshot("before the workflow deadline");
                      return;
                    }
                    core.info(
                      `Runtime images run ${matching.id} succeeded but its PR Full-Stack Smoke job/step snapshot is not terminal yet: ` +
                      `job=${fullSmokeJob?.status ?? "missing"}/${fullSmokeJob?.conclusion ?? "unknown"}, ` +
                      `step=${fullSmokeStep?.status ?? "missing"}/${fullSmokeStep?.conclusion ?? "unknown"}; ` +
                      `retrying ${completedJobSnapshotAttempt + 1}/${maxCompletedJobSnapshotRetries}`
                    );
                    await new Promise((resolve) => setTimeout(
                      resolve,
                      Math.min(snapshotSleepMs, remainingBeforeSnapshotSleepMs)
                    ));
                    continue;
                  }
                  if (await retryExactSelection(
                    `Runtime alternative ${matching.id} never exposed a complete smoke snapshot; retry exact primary selection.`
                  )) continue smokeGatePolling;
                  // With no pending primary, only the same run's provably newer attempt warrants reselection.
                  const { data: latestSnapshotAttempt } = await withTransientGitHubRetry(
                    "runtime attempt lookup after incomplete smoke snapshot",
                    () => github.rest.actions.getWorkflowRun({ owner, repo, run_id: matching.id })
                  );
                  if (positiveInteger(matching.run_attempt) && latestSnapshotAttempt.id === matching.id &&
                      positiveInteger(latestSnapshotAttempt.run_attempt) &&
                      latestSnapshotAttempt.run_attempt > matching.run_attempt) {
                    core.info("Runtime attempt superseded the incomplete smoke snapshot; resume exact selection.");
                    await new Promise((resolve) => setTimeout(resolve, sleepMs));
                    continue smokeGatePolling;
                  }
                  const snapshotRetrySummary = maxCompletedJobSnapshotRetries === 0
                    ? "before the remaining workflow deadline allowed a retry"
                    : `after ${maxCompletedJobSnapshotRetries} retries`;
                  await failNonTerminalSnapshot(snapshotRetrySummary);
                  return;
                }

                // A continued probe has API conclusion=success even when its native
                // outcome failed. The immutable marker distinguishes that exception.
                if (fullSmokeJob?.name === canonicalSmokeJobName) {
                  const markers = (fullSmokeJob.steps ?? []).filter((step) =>
                    step.name === "Known canonical transition PLAY failure with successful authenticated cleanup"
                  );
                  if (markers.length === 1 && markers[0].status === "completed" &&
                      markers[0].conclusion === "success") {
                    let knownPlayVerified = false;
                    try {
                      knownPlayVerified = await verifyKnownPlayFailure(matching, fullSmokeJob, currentIdentity);
                    } catch (error) {
                      if (error instanceof TerminalGitHubRequestError) throw error;
                      core.warning(`Canonical PLAY transition exception proof is unavailable: ${error?.message ?? String(error)}`);
                    }
                    if (!knownPlayVerified) {
                      core.setFailed("Canonical PLAY transition exception could not be verified; runtime qualification remains blocked.");
                      return;
                    }
                    const freshIdentity = await resolveCurrentIdentity("Stopping stale canonical transition PLAY exception");
                    if (freshIdentity?.obsolete) return;
                    if (!freshIdentity || identityKey(freshIdentity) !== identityKey(currentIdentity)) {
                      currentIdentity = freshIdentity;
                      continue smokeGatePolling;
                    }
                    core.setOutput("known_play_exception", "true");
                    core.warning("Canonical PLAY transition exception accepted: LOGIN succeeded, direct backend PLAY failed ERROR ENTITLEMENT_UNAVAILABLE. No runtime qualification or image publication.");
                    await core.summary.addHeading("Canonical PLAY transition exception accepted")
                      .addRaw("Known PLAY failed: ERROR ENTITLEMENT_UNAVAILABLE after LOGIN. Held-admission qualification and authenticated cleanup passed. CI passed under exception; no runtime qualification, image export, or publication.")
                      .write();
                    return;
                  }
                  if (!canonicalProducerVerified && (markers.length !== 1 ||
                      markers[0].status !== "completed" || markers[0].conclusion !== "skipped")) {
                    core.setFailed("Runtime smoke proof is missing its unambiguous transition-exception disposition.");
                    return;
                  }
                }

                if (fullSmokeJob?.conclusion !== "success") {
                  if (await isCurrentPullRequestObsolete("Stopping obsolete failed full-smoke gate for")) {
                    return;
                  }
                  core.setFailed(
                    `Runtime images run ${matching.id} succeeded, but PR Full-Stack Smoke job did not complete successfully: ` +
                    `job=${fullSmokeJob?.status ?? "missing"}/${fullSmokeJob?.conclusion ?? "unknown"}`
                  );
                  return;
                }
                if (!canonicalProducerVerified && fullSmokeStep?.conclusion !== "success") {
                  if (await isCurrentPullRequestObsolete("Stopping obsolete skipped full-smoke gate for")) {
                    return;
                  }
                  core.setFailed(
                    `Runtime images run ${matching.id} succeeded, but its credential-free full-stack smoke step did not pass: ` +
                    `step=${fullSmokeStep?.status ?? "missing"}/${fullSmokeStep?.conclusion ?? "unknown"}`
                  );
                  return;
                }
                const finalIdentity = await resolveCurrentIdentity(
                  "Stopping stale smoke gate before accepting full-stack proof"
                );
                if (finalIdentity?.obsolete) {
                  return;
                }
                if (!finalIdentity || identityKey(finalIdentity) !== identityKey(currentIdentity)) {
                  currentIdentity = finalIdentity;
                  core.info(
                    `Runtime images run ${matching.id} was not accepted because the current PR identity changed after its smoke snapshot; waiting for a fresh exact run.`
                  );
                  continue smokeGatePolling;
                }
                // Job proof belongs to the selected immutable attempt, never the latest
                // attempt's jobs. Recheck after mutable PR identity before accepting it.
                let currentAttempt;
                try {
                  ({ data: currentAttempt } = await withTransientGitHubRetry(
                    "final successful runtime attempt lookup",
                    () => github.rest.actions.getWorkflowRun({ owner, repo, run_id: matching.id })
                  ));
                } catch (error) {
                  if (canResumeAfterOptionalGitHubError(error, selection.pendingPrimary) && await retryExactSelection(
                    `Runtime run ${matching.id} final attempt is temporarily unavailable; retry exact selection.`,
                    { requirePendingPrimary: false }
                  )) continue smokeGatePolling;
                  throw error;
                }
                if (!positiveInteger(matching.run_attempt) || currentAttempt.id !== matching.id ||
                    currentAttempt.run_attempt !== matching.run_attempt ||
                    currentAttempt.status !== "completed" || currentAttempt.conclusion !== "success") {
                  core.info("Runtime attempt changed before smoke proof acceptance; resume exact selection.");
                  await new Promise((resolve) => setTimeout(resolve, sleepMs));
                  continue smokeGatePolling;
                }
                if (currentIdentity.sourceEvent === "repository_dispatch") {
                  // A trusted refresh follows the live base, unlike immutable event proof.
                  const acceptanceIdentity = await resolveCurrentIdentity(
                    "Stopping stale current-base smoke gate after the final run lookup"
                  );
                  if (acceptanceIdentity?.obsolete) return;
                  if (!acceptanceIdentity || identityKey(acceptanceIdentity) !== identityKey(currentIdentity)) {
                    currentIdentity = acceptanceIdentity;
                    core.info("Current-base identity changed after the final runtime attempt lookup; resume exact selection.");
                    continue smokeGatePolling;
                  }
                  let acceptanceAttempt;
                  try {
                    ({ data: acceptanceAttempt } = await withTransientGitHubRetry(
                      "current-base runtime attempt lookup after live identity validation",
                      () => github.rest.actions.getWorkflowRun({ owner, repo, run_id: matching.id })
                    ));
                  } catch (error) {
                    if (canResumeAfterOptionalGitHubError(error, selection.pendingPrimary) && await retryExactSelection(
                      `Runtime run ${matching.id} final current-base attempt is temporarily unavailable; retry exact selection.`,
                      { requirePendingPrimary: false }
                    )) continue smokeGatePolling;
                    throw error;
                  }
                  if (acceptanceAttempt.id !== matching.id ||
                      acceptanceAttempt.run_attempt !== matching.run_attempt ||
                      acceptanceAttempt.status !== "completed" || acceptanceAttempt.conclusion !== "success") {
                    core.info("Runtime attempt changed after current-base identity validation; resume exact selection.");
                    await new Promise((resolve) => setTimeout(resolve, sleepMs));
                    continue smokeGatePolling;
                  }
                  const confirmedIdentity = await resolveCurrentIdentity(
                    "Stopping stale current-base smoke gate after the final attempt lookup"
                  );
                  if (confirmedIdentity?.obsolete) return;
                  if (!confirmedIdentity || identityKey(confirmedIdentity) !== identityKey(currentIdentity)) {
                    currentIdentity = confirmedIdentity;
                    core.info("Current-base identity changed after the final runtime attempt lookup; resume exact selection.");
                    continue smokeGatePolling;
                  }
                  // A rerun can start during that last live tuple lookup. This final
                  // attempt fence does not make the separate GitHub reads atomic.
                  let confirmedAttempt;
                  try {
                    ({ data: confirmedAttempt } = await withTransientGitHubRetry(
                      "current-base runtime attempt lookup after final live tuple validation",
                      () => github.rest.actions.getWorkflowRun({ owner, repo, run_id: matching.id })
                    ));
                  } catch (error) {
                    if (canResumeAfterOptionalGitHubError(error, selection.pendingPrimary) && await retryExactSelection(
                      `Runtime run ${matching.id} confirmed current-base attempt is temporarily unavailable; retry exact selection.`,
                      { requirePendingPrimary: false }
                    )) continue smokeGatePolling;
                    throw error;
                  }
                  if (confirmedAttempt.id !== matching.id || confirmedAttempt.run_attempt !== matching.run_attempt ||
                      confirmedAttempt.status !== "completed" || confirmedAttempt.conclusion !== "success") {
                    core.info("Runtime attempt changed during final live tuple validation; resume exact selection.");
                    await new Promise((resolve) => setTimeout(resolve, sleepMs));
                    continue smokeGatePolling;
                  }
                }
                const pendingOrderingFences = [selection.pendingPrimary, selection.pendingRefresh].filter(Boolean);
                for (const pending of pendingOrderingFences) {
                  // A fresh ordering read fences each older-success fallback. A
                  // terminal or replaced primary must qualify through its own proof.
                  let freshPrimary;
                  try {
                    freshPrimary = await findMatchingRuntimeImagesRun(
                      pending.event, expectedDisplayTitle, currentIdentity,
                      { allowCompletedFallback: false, fallbackFence: matching }
                    );
                  } catch (error) {
                    if (canResumeAfterOptionalGitHubError(error, pending) && await retryExactSelection(
                      "Runtime candidate ordering is unavailable; retry exact primary selection."
                    )) continue smokeGatePolling;
                    throw error;
                  }
                  if (freshPrimary?.id !== pending.id ||
                      freshPrimary.run_attempt !== pending.run_attempt ||
                      freshPrimary.status === "completed") {
                    if (await retryExactSelection(
                      "Runtime candidate ordering changed before accepting older success; retry exact primary selection."
                    )) continue smokeGatePolling;
                    break smokeGatePolling;
                  }
                }
                if (pendingOrderingFences.length > 0) {
                  // Observe each pending attempt again, checking the native primary
                  // after the optional trusted refresh. Changed or terminal runs
                  // must be evaluated through exact selection, never older proof.
                  for (const pending of [...pendingOrderingFences].reverse()) {
                    let finalPending;
                    try {
                      ({ data: finalPending } = await withTransientGitHubRetry(
                        "pending attempt before final fallback proof",
                        () => github.rest.actions.getWorkflowRun({ owner, repo, run_id: pending.id })
                      ));
                    } catch (error) {
                      if (canResumeAfterOptionalGitHubError(error, pending) && await retryExactSelection(
                        "Pending runtime attempt is unavailable before fallback proof; retry exact selection."
                      )) continue smokeGatePolling;
                      throw error;
                    }
                    if (finalPending.id !== pending.id || finalPending.run_attempt !== pending.run_attempt ||
                        !["requested", "queued", "waiting", "pending", "in_progress"].includes(finalPending.status) ||
                        (finalPending.conclusion != null && finalPending.conclusion !== "")) {
                      if (await retryExactSelection(
                        "Pending runtime attempt changed before fallback proof; retry exact primary selection."
                      )) continue smokeGatePolling;
                      break smokeGatePolling;
                    }
                  }
                  // This must be the last awaited validation on the fallback
                  // path. A selected rerun can start during any preceding read.
                  // Pending observations have the cutoff above; separate GitHub
                  // reads are not an atomic snapshot across attempts.
                  let finalSelected;
                  try {
                    ({ data: finalSelected } = await withTransientGitHubRetry(
                      "successful fallback attempt after final ordering",
                      () => github.rest.actions.getWorkflowRun({ owner, repo, run_id: matching.id })
                    ));
                  } catch (error) {
                    if (canResumeAfterOptionalGitHubError(error, pendingOrderingFences[0]) && await retryExactSelection(
                      "Successful fallback attempt is unavailable after ordering; retry exact selection."
                    )) continue smokeGatePolling;
                    throw error;
                  }
                  if (finalSelected.id !== matching.id || finalSelected.run_attempt !== matching.run_attempt ||
                      finalSelected.status !== "completed" || finalSelected.conclusion !== "success") {
                    if (await retryExactSelection(
                      "Successful fallback attempt changed during ordering; retry exact selection."
                    )) continue smokeGatePolling;
                    break smokeGatePolling;
                  }
                }
                return;
              }

              core.info(
                `No exact ${currentIdentity.sourceEvent} runtime-images/full-smoke run found yet for PR #${prNumber} ` +
                `base ${currentIdentity.baseSha} head ${currentIdentity.headSha} merge ${currentIdentity.mergeSha}; waiting...`
              );
              await new Promise((resolve) => setTimeout(resolve, sleepMs));
            }

            try {
              if (await isCurrentPullRequestObsolete("Stopping obsolete timed-out smoke gate for")) {
                return;
              }
            } catch (error) {
              core.warning(`Timed-out smoke gate could not re-check current PR identity: ${error.message}`);
            }
            const timeoutIdentity = currentIdentity
              ? `base ${currentIdentity.baseSha} head ${currentIdentity.headSha} merge ${currentIdentity.mergeSha}`
              : `event base ${eventBaseSha} head ${headSha} merge ${eventMergeSha}`;
            core.setFailed(
              `Timed out waiting for the exact runtime-images/full-smoke run for PR #${prNumber} ${timeoutIdentity}. ` +
              `Diagnostic: ${identityDiagnostic}`
            );
