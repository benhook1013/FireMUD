name: Smoke Tests

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ format('pr-{0}-controller', github.event.pull_request.number) }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Smoke-Relevant Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    outputs:
      run_smoke_lite: ${{ steps.compute.outputs.run_smoke_lite }}
      run_smoke_full: ${{ steps.compute.outputs.run_smoke_full }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Compute smoke scope
        id: compute
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
              (response) => response.data.map((file) => file.filename)
            );

            const docsOnlyPredicate = (file) =>
              file === "AGENTS.md" ||
              file === "mkdocs.yml" ||
              file.startsWith("design/") ||
              file.startsWith("dev-tools/docs/") ||
              file.endsWith(".md");

            const frontendOnlyPredicate = (file) =>
              file.startsWith("web-client/") ||
              file.startsWith("config/openapi/");

            const liteRelevantPrefixes = [
              "buildSrc/",
              "gradle/",
              "protos/",
              "config/checkstyle/",
              "config/protobuf/",
              "config/security/",
              "config/spotbugs/",
              "docker/",
              "services/",
            ];
            const liteRelevantFiles = new Set([
              "build.gradle.kts",
              "settings.gradle.kts",
              "gradle.properties",
              ".github/workflows/smoke.yml",
            ]);

            const fullRelevantPrefixes = [
              "buildSrc/",
              "gradle/",
              "protos/",
              "docker/",
              "services/account-service/",
              "services/automation-scripting-service/",
              "services/common-library/",
              "services/common-data-runtime/",
              "services/common-platform-core/",
              "services/common-saga/",
              "services/common-security/",
              "services/common-test-support/",
              "services/common-web-support/",
              "services/entity-management-service/",
              "services/game-design-service/",
              "services/game-logic-service/",
              "services/game-session-service/",
              "services/logging-admin-service/",
              "services/social-groups-service/",
              "services/spring-cloud-gateway/",
              "services/tcp-proxy-service/",
              "services/world-management-service/",
            ];
            const fullRelevantFiles = new Set([
              "build.gradle.kts",
              "settings.gradle.kts",
              "gradle.properties",
              ".github/workflows/smoke.yml",
              ".github/workflows/smoke-full.yml",
              ".github/workflows/runtime-images.yml",
              "dev-tools/build-compose-service-jars.sh",
              "dev-tools/certs/generate-dev-certs.sh",
              "dev-tools/verify-compose-health.sh",
              "dev-tools/verify-fresh-bootstrap.sh",
              "dev-tools/verify-restart-state.sh",
              "dev-tools/verify-smoke-images.sh",
            ]);

            const nonDocFiles = files.filter((file) => !docsOnlyPredicate(file));
            const nonDocsAreFrontendOnly =
              nonDocFiles.length > 0 && nonDocFiles.every((file) => frontendOnlyPredicate(file));

            if (nonDocFiles.length === 0 || nonDocsAreFrontendOnly) {
              core.setOutput("run_smoke_lite", "false");
              core.setOutput("run_smoke_full", "false");
              return;
            }

            const runSmokeLite = nonDocFiles.some(
              (file) =>
                liteRelevantFiles.has(file) ||
                liteRelevantPrefixes.some((prefix) => file.startsWith(prefix))
            );
            const runSmokeFull = nonDocFiles.some(
              (file) =>
                fullRelevantFiles.has(file) ||
                fullRelevantPrefixes.some((prefix) => file.startsWith(prefix))
            );
            core.setOutput("run_smoke_lite", runSmokeLite ? "true" : "false");
            core.setOutput("run_smoke_full", runSmokeFull ? "true" : "false");

  smoke-lite:
    name: Smoke Tests (Lite)
    needs: [changes]
    if: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.changes.outputs.run_smoke_lite == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: 🧪 Run Lite Smoke Integration Checks
        run: |
          ./gradlew \
            :account-service:integrationTest --tests 'net.firedevops.firemud.accountservice.AccountApplicationIntegrationTest' \
            :game-session-service:integrationTest --tests 'net.firedevops.firemud.gamesession.GameSessionApplicationIntegrationTest' --tests 'net.firedevops.firemud.gamesession.GameSessionLoginIntegrationTest' --tests 'net.firedevops.firemud.gamesession.websocket.GameSessionWebSocketHandlerIntegrationTest' \
            :tcp-proxy-service:integrationTest --tests 'net.firedevops.firemud.tcpproxy.TcpProxyServiceApplicationIntegrationTest'

  smoke-summary:
    name: Smoke Summary
    runs-on: ubuntu-latest
    permissions:
      # Only this job publishes or updates the pull request smoke summary comment.
      contents: read
      pull-requests: write
    needs: [changes, smoke-lite]
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: 💬 Publish Smoke Summary Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const liteEnabled = "${{ needs.changes.outputs.run_smoke_lite }}" === "true";
            const fullEnabled = "${{ needs.changes.outputs.run_smoke_full }}" === "true";
            const liteResult = liteEnabled ? "${{ needs.smoke-lite.result }}" : "skipped";
            const fullResult = fullEnabled ? "tracked-by-smoke-gate" : "skipped";
            const statusIcon = (value) => {
              if (value === "success") return "✅";
              if (value === "failure") return "❌";
              if (value === "cancelled") return "⚪";
              if (value === "tracked-by-smoke-gate") return "⏳";
              return "⏭️";
            };

            let headline = "✅ Smoke tests passed";
            if (["failure", "cancelled", "timed_out"].includes(liteResult)) {
              headline = "❌ Smoke tests failed";
            } else if (fullEnabled) {
              headline = "⏳ Full smoke is tracked by Smoke Gate";
            } else if (!liteEnabled) {
              headline = "⏭️ Smoke tests skipped";
            }

            const body = [
              "### Smoke Summary",
              headline,
              "",
              `- ${statusIcon(liteResult)} Smoke Tests (Lite): \`${liteResult}\``,
              `- ${statusIcon(fullResult)} Smoke Tests (Full Stack): \`${fullResult}\``,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });

            const summaryComments = comments.filter(comment =>
              comment.body.startsWith("### Smoke Summary")
            );
            const existing = summaryComments[0];

            if (summaryComments.length > 1) {
              for (const comment of summaryComments.slice(1)) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                });
              }
            }

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

  smoke-gate:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'PR Metadata Edit (Smoke Gate)' || 'Smoke Gate' }}
    runs-on: ubuntu-latest
    needs: [changes, smoke-lite]
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    timeout-minutes: 30
    steps:
      - name: Fail when smoke dependencies did not succeed
        if: ${{ needs.changes.result != 'success' || (needs.changes.outputs.run_smoke_lite == 'true' && needs.smoke-lite.result != 'success') }}
        run: |
          echo "Smoke dependencies did not succeed: changes=${{ needs.changes.result }}, smoke-lite=${{ needs.smoke-lite.result }}" >&2
          exit 1

      - name: Harden runner
        if: ${{ needs.changes.result == 'success' && (needs.changes.outputs.run_smoke_lite != 'true' || needs.smoke-lite.result == 'success') }}
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Verify lite smoke result
        if: ${{ needs.changes.result == 'success' && needs.smoke-lite.result == 'success' && needs.changes.outputs.run_smoke_lite == 'true' && needs.changes.outputs.run_smoke_full != 'true' }}
        run: |
          if [ "${{ needs.smoke-lite.result }}" != "success" ]; then
            echo "Lite smoke did not succeed: ${{ needs.smoke-lite.result }}" >&2
            exit 1
          fi

      - name: Wait for full smoke dispatch result
        if: ${{ needs.changes.result == 'success' && (needs.changes.outputs.run_smoke_lite != 'true' || needs.smoke-lite.result == 'success') && needs.changes.outputs.run_smoke_full == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.pull_request.head.sha;
            const prNumber = String(context.payload.pull_request.number);
            const started = Date.now();
            const timeoutMs = 25 * 60 * 1000;
            const sleepMs = 15000;

            while (Date.now() - started < timeoutMs) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner,
                  repo,
                  workflow_id: "runtime-images.yml",
                  event: "pull_request",
                  per_page: 100,
                }
              );

              const matching = runs.find((run) => run.head_sha === headSha);
              if (matching) {
                core.info(`Found runtime-images run ${matching.id} with status=${matching.status} conclusion=${matching.conclusion}`);
                if (matching.status !== "completed") {
                  await new Promise((resolve) => setTimeout(resolve, sleepMs));
                  continue;
                }

                if (matching.conclusion !== "success") {
                  core.setFailed(`Runtime images/full smoke run ${matching.id} finished with ${matching.conclusion}`);
                }
                return;
              }

              core.info(`No runtime-images/full-smoke run found yet for PR #${prNumber} sha ${headSha}; waiting...`);
              await new Promise((resolve) => setTimeout(resolve, sleepMs));
            }

            core.setFailed(`Timed out waiting for runtime-images/full-smoke run for PR #${prNumber} sha ${headSha}`);
