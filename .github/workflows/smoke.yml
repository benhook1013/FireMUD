name: Smoke Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3am UTC

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-core:
    name: Core Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: 📝 Create CI .env placeholder
        run: touch .env

      - name: Generate Dev Certificates
        run: ./dev-tools/generate-dev-certs.sh dev-tools/certs

      - name: 🚀 Start Dev Stack (devUp)
        run: ./gradlew devUp

      - name: 🧪 Telnet LOGIN + LOOK (TCP Proxy)
        run: |
          cd services/tcp-proxy-service
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}: running Telnet LOGIN + LOOK smoke test..."
            if bash ./telnet-login-look-smoke.sh; then
              echo "Telnet smoke test succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Telnet smoke test attempt ${attempt} failed; waiting before retry..."
            sleep 10
          done
          echo "Telnet LOGIN + LOOK smoke test failed after 3 attempts."
          exit 1

      - name: 📜 Dump Docker Compose Logs on Failure
        if: failure()
        run: |
          if [ -f docker/docker-compose.yml ]; then
            docker compose -f docker/docker-compose.yml logs || true
          fi

      - name: 🧹 Stop Dev Stack (devDown)
        if: always()
        run: ./gradlew devDown
