name: Refresh Gradle Daemon JDK

on:
  pull_request:
    paths:
      - '.github/workflows/refresh-gradle-daemon-jvm.yml'
      - 'dev-tools/maintenance/refresh-gradle-daemon-jvm.py'
      - 'dev-tools/maintenance/test_refresh_gradle_daemon_jvm.py'
      - 'dev-tools/validation/run-locked-gradle.sh'
      - 'dev-tools/validation/gradle-run-supervisor.py'
      - 'gradle/gradle-daemon-jvm.properties'
      - 'gradle/wrapper/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-gradle-daemon-jvm-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: false

jobs:
  generator-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out the PR candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up repository Python
        uses: ./.github/actions/setup-python
        with:
          requirements: none

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Test the criteria guard
        run: python3 -m unittest discover -s dev-tools/maintenance -p test_refresh_gradle_daemon_jvm.py

      - name: Prove the real generator without publishing
        run: python3 dev-tools/maintenance/refresh-gradle-daemon-jvm.py --check-only

  refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check publishing setup
        env:
          APP_CLIENT_ID: ${{ vars.DEPENDENCY_MAINTENANCE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DEPENDENCY_MAINTENANCE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo 'Configure DEPENDENCY_MAINTENANCE_APP_CLIENT_ID and DEPENDENCY_MAINTENANCE_APP_PRIVATE_KEY before JDK maintenance can run.' >&2
            exit 1
          fi

      - name: Preserve an open maintenance PR during review
        id: pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:codex/gradle-daemon-jdk-refresh`,
              per_page: 100,
            });
            core.setOutput('open', String(pulls.length > 0));
            if (pulls.length > 0) {
              core.summary.addRaw('An open daemon JDK maintenance PR is awaiting review or merge. Its head is preserved.').write();
            }

      - name: Check out develop
        if: steps.pending.outputs.open == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          persist-credentials: false

      - name: Set up repository Python
        if: steps.pending.outputs.open == 'false'
        uses: ./.github/actions/setup-python
        with:
          requirements: none

      - name: Set up Java
        if: steps.pending.outputs.open == 'false'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.pending.outputs.open == 'false'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Regenerate daemon JVM artifacts
        if: steps.pending.outputs.open == 'false'
        run: python3 dev-tools/maintenance/refresh-gradle-daemon-jvm.py

      - name: Create repository-scoped publishing token
        if: steps.pending.outputs.open == 'false'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPENDENCY_MAINTENANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_MAINTENANCE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Recheck the maintenance PR immediately before publication
        if: steps.pending.outputs.open == 'false'
        id: publication-check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:codex/gradle-daemon-jdk-refresh`,
              per_page: 100,
            });
            core.setOutput('open', String(pulls.length > 0));
            if (pulls.length > 0) {
              await core.summary.addRaw('A maintenance PR opened or reopened during generation. Publication is skipped to preserve its review head.').write();
            }

      # The API check and Git push are not atomic. A PR reopened after the check
      # can still receive the update; cancel this run before reopening a PR.
      - name: Propose the generated JDK patch artifacts
        if: steps.pending.outputs.open == 'false' && steps.publication-check.outputs.open == 'false'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: gradle/gradle-daemon-jvm.properties
          base: develop
          branch: codex/gradle-daemon-jdk-refresh
          commit-message: 'chore(deps): refresh Gradle daemon Java 21 artifacts'
          title: 'chore(deps): refresh Gradle daemon Java 21 artifacts'
          labels: dependencies
          body: |
            Regenerated by the repository Gradle wrapper from validated official Adoptium metadata with `updateDaemonJvm --jvm-version=21 --jvm-vendor=adoptium`.

            Java 21 and Adoptium remain fixed. Gradle serializes the six supported Linux/macOS/Windows x64/AArch64 download URLs; this update refreshes the JDK patch artifacts rather than editing the language version. The publishing App triggers ordinary pull-request checks, including the Smoke Gate. Review and human merge remain required.
