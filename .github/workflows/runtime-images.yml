name: Build Runtime Images

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'protos/**'
      - 'docker/**'
      - '.github/workflows/runtime-images.yml'
      - '.github/workflows/smoke.yml'
      - '.github/workflows/smoke-full.yml'
      - 'services/common-library/**'
      - 'services/common-data-runtime/**'
      - 'services/common-platform-core/**'
      - 'services/common-saga/**'
      - 'services/common-security/**'
      - 'services/common-test-support/**'
      - 'services/common-web-support/**'
      - 'services/account-service/**'
      - 'services/automation-scripting-service/**'
      - 'services/entity-management-service/**'
      - 'services/game-design-service/**'
      - 'services/game-logic-service/**'
      - 'services/game-session-service/**'
      - 'services/logging-admin-service/**'
      - 'services/social-groups-service/**'
      - 'services/spring-cloud-gateway/**'
      - 'services/tcp-proxy-service/**'
      - 'services/world-management-service/**'
  push:
    branches: [main, develop]
  workflow_dispatch:

run-name: Build Runtime Images ${{ github.event_name == 'pull_request' && format('pr-{0} base-{1} head-{2} merge-{3} mode-{4}', github.event.pull_request.number, github.event.pull_request.base.sha, github.event.pull_request.head.sha, github.sha, github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required') || github.ref_name }}

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: runtime-images-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required' }}
  cancel-in-progress: true

jobs:
  image-meta:
    name: Derive Runtime Image Metadata
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.meta.outputs.head_sha }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      base_image: ${{ steps.meta.outputs.base_image }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Derive image tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            CHECKOUT_REF="${GITHUB_SHA}"
          else
            HEAD_SHA="${GITHUB_SHA}"
            CHECKOUT_REF="${GITHUB_SHA}"
          fi

          IMAGE_TAG="${HEAD_SHA}"
          BASE_IMAGE="ghcr.io/benhook1013/firemud-base:${IMAGE_TAG}"

          {
            echo "head_sha=${HEAD_SHA}"
            echo "checkout_ref=${CHECKOUT_REF}"
            echo "image_tag=${IMAGE_TAG}"
            echo "base_image=${BASE_IMAGE}"
          } >> "$GITHUB_OUTPUT"

  build-base-image:
    name: Build Runtime Base Image
    needs: [image-meta]
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime base image
        id: build_base_image_first
        continue-on-error: true
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./docker/base.Dockerfile
          push: true
          tags: ${{ needs.image-meta.outputs.base_image }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache
            type=registry,ref=ghcr.io/benhook1013/firemud-base:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache,mode=max
            type=gha,mode=max

      - name: Retry build and push runtime base image
        if: ${{ steps.build_base_image_first.outcome == 'failure' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./docker/base.Dockerfile
          push: true
          tags: ${{ needs.image-meta.outputs.base_image }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache
            type=registry,ref=ghcr.io/benhook1013/firemud-base:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache,mode=max
            type=gha,mode=max

  build-runtime-images:
    name: Build Runtime Images (${{ matrix.service }})
    needs: [image-meta, build-base-image]
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - automation-scripting-service
          - entity-management-service
          - game-design-service
          - game-logic-service
          - game-session-service
          - logging-admin-service
          - social-groups-service
          - spring-cloud-gateway
          - tcp-proxy-service
          - world-management-service
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Build service JAR
        run: ./gradlew :${{ matrix.service }}:bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime service image
        id: build_runtime_image_first
        continue-on-error: true
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ./services/${{ matrix.service }}/build/libs
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          build-contexts: |
            repo_root=.
          build-args: |
            BASE_IMAGE=${{ needs.image-meta.outputs.base_image }}
          tags: ghcr.io/benhook1013/${{ matrix.service }}:${{ needs.image-meta.outputs.image_tag }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache,mode=max
            type=gha,mode=max

      - name: Retry build and push runtime service image
        if: ${{ steps.build_runtime_image_first.outcome == 'failure' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ./services/${{ matrix.service }}/build/libs
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          build-contexts: |
            repo_root=.
          build-args: |
            BASE_IMAGE=${{ needs.image-meta.outputs.base_image }}
          tags: ghcr.io/benhook1013/${{ matrix.service }}:${{ needs.image-meta.outputs.image_tag }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache,mode=max
            type=gha,mode=max

  smoke-full:
    name: Smoke Tests (Full Stack)
    needs: [image-meta, build-runtime-images]
    if: ${{ always() && needs.build-runtime-images.result == 'success' && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    uses: ./.github/workflows/smoke-full.yml
    with:
      action: full
      head_sha: ${{ needs.image-meta.outputs.head_sha }}
      checkout_ref: ${{ needs.image-meta.outputs.checkout_ref }}
      image_tag: ${{ needs.image-meta.outputs.image_tag }}
      pr_number: ${{ github.event_name == 'pull_request' && format('{0}', github.event.pull_request.number) || '' }}
    secrets: inherit
