name: Build Runtime Images

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'protos/**'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/runtime-images.yml'
      - '.github/workflows/publish-pr-runtime-images.yml'
      - '.github/workflows/smoke.yml'
      - '.github/workflows/smoke-full.yml'
      - 'services/**'
      - '.github/actions/load-workflow-tool-versions/**'
      - '.github/actions/setup-python/**'
      - '.python-version'
      - 'config/workflow-tool-versions.env'
      - 'config/python/smoke-requirements.txt'
      - 'config/python/smoke-requirements.in'
      - 'dev-tools/build-compose-service-jars.sh'
      - 'dev-tools/build-local-smoke-images.sh'
      - 'dev-tools/backups/verify-backups.sh'
      - 'dev-tools/backups/pg-dump-s3-selection.shlib'
      - 'dev-tools/backups/smoke-backup-verifier-image.sh'
      - 'docker/backup-verifier.Dockerfile'
      - 'dev-tools/certs/generate-dev-certs.sh'
      - 'dev-tools/hosted/controller/smoke-paused-controller-image.sh'
      - 'dev-tools/smoke/**'
      - 'dev-tools/verify-compose-health.sh'
      - 'dev-tools/verify-fresh-bootstrap.sh'
      - 'dev-tools/verify-restart-state.sh'
      - 'dev-tools/verify-smoke-images.sh'
  workflow_run:
    workflows: ["CI — Validation"]
    types: [completed]
    branches: [main, develop]
  repository_dispatch:
    types: [pr-runtime-base-refresh]
  workflow_dispatch:

run-name: Build Runtime Images ${{ (github.event_name == 'pull_request' || github.event_name == 'repository_dispatch') && format('secure-pr-artifact pr-{0} base-{1} head-{2} merge-{3} mode-{4}', github.event_name == 'pull_request' && github.event.pull_request.number || github.event.client_payload.pr_number, github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.client_payload.base_sha, github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.client_payload.head_sha, github.event_name == 'pull_request' && github.sha || github.event.client_payload.merge_sha, github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required') || github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && format('trusted-branch branch-{0} sha-{1}', github.event.workflow_run.head_branch, github.event.workflow_run.head_sha) || github.event_name == 'workflow_run' && format('base-refresh-only branch-{0} sha-{1} ci-{2}', github.event.workflow_run.head_branch, github.event.workflow_run.head_sha, github.event.workflow_run.conclusion) || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: runtime-images-${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'repository_dispatch') && format('pr-{0}', github.event_name == 'pull_request' && github.event.pull_request.number || github.event.client_payload.pr_number) || github.event_name == 'workflow_run' && format('branch-{0}', github.event.workflow_run.head_branch) || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required' }}
  cancel-in-progress: true

jobs:
  image-meta:
    name: Derive Runtime Image Metadata
    if: ${{ (github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null)) || (github.event_name == 'repository_dispatch' && github.event.action == 'pr-runtime-base-refresh') || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'develop')) }}
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.meta.outputs.pr_number }}
      base_ref: ${{ steps.meta.outputs.base_ref }}
      base_sha: ${{ steps.meta.outputs.base_sha }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      merge_sha: ${{ steps.meta.outputs.merge_sha }}
      head_branch: ${{ steps.meta.outputs.head_branch }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      candidate_tag: ${{ steps.meta.outputs.candidate_tag }}
      base_image: ${{ steps.meta.outputs.base_image }}
      runtime_smoke_required: ${{ steps.smoke_scope.outputs.runtime_smoke_required }}
      controller_smoke_required: ${{ steps.smoke_scope.outputs.controller_smoke_required }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Check out trusted workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up canonical GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Derive image tags
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.client_payload.head_sha || '' }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.pr_number || '' }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.client_payload.base_ref || '' }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.client_payload.base_sha || '' }}
          EVENT_MERGE_SHA: ${{ github.event.client_payload.merge_sha || '' }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"
          PR_NUMBER=""
          BASE_REF=""
          BASE_SHA=""
          MERGE_SHA=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_NUMBER="$EVENT_PR_NUMBER"
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            BASE_SHA="$EVENT_BASE_SHA"
            HEAD_SHA="$EVENT_HEAD_SHA"
            HEAD_BRANCH=""
            MERGE_SHA="${GITHUB_SHA}"
            CHECKOUT_REF="$MERGE_SHA"
            [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "PR merge SHA is not a lowercase 40-character commit SHA." >&2
              exit 1
            }
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "PR event base/head SHAs are not lowercase 40-character commit SHAs." >&2
              exit 1
            }
            merge_commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}")"
            jq -e \
              --arg base_sha "$BASE_SHA" \
              --arg head_sha "$HEAD_SHA" \
              --arg merge_sha "$MERGE_SHA" \
              '.sha == $merge_sha and (.parents | type) == "array" and (.parents | length) == 2 and .parents[0].sha == $base_sha and .parents[1].sha == $head_sha' \
              <<<"$merge_commit_json" >/dev/null || {
                echo "PR event merge commit does not have the event's exact base/head parents; refusing a stale PR artifact." >&2
                exit 1
              }
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            [[ "$EVENT_ACTION" == "pr-runtime-base-refresh" ]] || {
              echo "Runtime PR refresh requires the typed pr-runtime-base-refresh dispatch." >&2
              exit 1
            }
            [[ "$GITHUB_REF" == "refs/heads/${DEFAULT_BRANCH}" ]] || {
              echo "Runtime PR refresh must run from the repository default branch." >&2
              exit 1
            }
            PR_NUMBER="$EVENT_PR_NUMBER"
            BASE_REF="$EVENT_BASE_REF"
            BASE_SHA="$EVENT_BASE_SHA"
            MERGE_SHA="$EVENT_MERGE_SHA"
            HEAD_SHA="$EVENT_HEAD_SHA"
            HEAD_BRANCH=""
            CHECKOUT_REF="$MERGE_SHA"
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,50}$ ]] || {
              echo "Runtime PR refresh payload has an invalid pull request number." >&2
              exit 1
            }
            [[ "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || {
              echo "Runtime PR refresh payload has an invalid base ref." >&2
              exit 1
            }
            for sha_name in BASE_SHA HEAD_SHA MERGE_SHA; do
              sha_value="${!sha_name}"
              [[ "$sha_value" =~ ^[0-9a-f]{40}$ ]] || {
                echo "Runtime PR refresh payload has an invalid ${sha_name}." >&2
                exit 1
              }
            done

            current_base_ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_REF}")"
            jq -e \
              --arg base_sha "$BASE_SHA" \
              '.object.sha == $base_sha' \
              <<<"$current_base_ref_json" >/dev/null || {
                echo "Runtime PR refresh base SHA is not the current ${BASE_REF} branch ref." >&2
                exit 1
              }
            pull_request_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            if ! printf '%s' "$pull_request_json" | python3 dev-tools/hosted/preview/preview-eligibility.py \
              --revalidate-deploy \
              --expected-repository "$GITHUB_REPOSITORY" \
              --expected-head-sha "$HEAD_SHA" >/dev/null; then
              echo "Runtime PR refresh target is not currently preview-eligible; refusing artifact construction." >&2
              exit 1
            fi
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg base_ref "$BASE_REF" \
              --arg head_sha "$HEAD_SHA" \
              --arg merge_sha "$MERGE_SHA" \
              '(
                .state == "open" and
                .base.ref == $base_ref and
                .base.repo.full_name == $repository and
                .head.sha == $head_sha and
                .head.repo.full_name == $repository and
                (.mergeable | type) == "boolean" and
                .mergeable == true and
                (.mergeable_state | type) == "string" and
                .mergeable_state != "dirty" and
                .mergeable_state != "conflicting" and
                .mergeable_state != "unknown" and
                .merge_commit_sha == $merge_sha
              )' <<<"$pull_request_json" >/dev/null || {
                echo "Runtime PR refresh payload is stale, conflicted, fork-owned, closed, or has an invalid merge tuple." >&2
                exit 1
              }
            merge_commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}")"
            jq -e \
              --arg base_sha "$BASE_SHA" \
              --arg head_sha "$HEAD_SHA" \
              --arg merge_sha "$MERGE_SHA" \
              '.sha == $merge_sha and (.parents | type) == "array" and (.parents | length) == 2 and .parents[0].sha == $base_sha and .parents[1].sha == $head_sha' \
              <<<"$merge_commit_json" >/dev/null || {
                echo "Runtime PR refresh merge commit does not have the exact current base/head parents." >&2
                exit 1
              }
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            [[ "${{ github.event.workflow_run.event }}" == "push" ]] || {
              echo "Runtime branch publication requires a CI push workflow run." >&2
              exit 1
            }
            [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || {
              echo "Runtime branch publication requires a successful CI workflow run." >&2
              exit 1
            }
            HEAD_SHA="${EVENT_HEAD_SHA:-${{ github.event.workflow_run.head_sha }}}"
            HEAD_BRANCH="$EVENT_HEAD_BRANCH"
            CHECKOUT_REF="$HEAD_SHA"
          else
            HEAD_SHA="${GITHUB_SHA}"
            CHECKOUT_REF="${GITHUB_SHA}"
            HEAD_BRANCH="${GITHUB_REF_NAME}"
          fi

          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Runtime publication head SHA is not a lowercase 40-character commit SHA." >&2
            exit 1
          }
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "repository_dispatch" ]; then
            [[ "$HEAD_BRANCH" == main || "$HEAD_BRANCH" == develop ]] || {
              echo "Runtime branch publication is restricted to main or develop." >&2
              exit 1
            }
          fi

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "repository_dispatch" ]; then
            IMAGE_TAG="pr-merge-${MERGE_SHA}"
          else
            IMAGE_TAG="${HEAD_SHA}"
          fi
          CANDIDATE_TAG="candidate-${HEAD_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "repository_dispatch" ]; then
            BASE_IMAGE="ghcr.io/benhook1013/firemud-base:${MERGE_SHA}"
          else
            BASE_IMAGE="ghcr.io/benhook1013/firemud-base:${CANDIDATE_TAG}"
          fi

          {
            echo "pr_number=${PR_NUMBER}"
            echo "base_ref=${BASE_REF}"
            echo "base_sha=${BASE_SHA}"
            echo "head_sha=${HEAD_SHA}"
            echo "merge_sha=${MERGE_SHA}"
            echo "head_branch=${HEAD_BRANCH}"
            echo "checkout_ref=${CHECKOUT_REF}"
            echo "image_tag=${IMAGE_TAG}"
            echo "candidate_tag=${CANDIDATE_TAG}"
            echo "base_image=${BASE_IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify successful CI push for manual publication
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.meta.outputs.head_sha }}
          EXPECTED_BRANCH: ${{ steps.meta.outputs.head_branch }}
        run: |
          set -euo pipefail
          ci_runs="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&head_sha=${EXPECTED_SHA}&per_page=100")"
          jq -e \
            --arg expected_sha "$EXPECTED_SHA" \
            --arg expected_branch "$EXPECTED_BRANCH" \
            '[.[].workflow_runs[]?] | any(.[]; .head_sha == $expected_sha and .head_branch == $expected_branch and .event == "push" and .status == "completed" and .conclusion == "success")' \
            <<<"$ci_runs" >/dev/null || {
              echo "No successful CI push run exists for manual runtime publication ${EXPECTED_BRANCH}@${EXPECTED_SHA}." >&2
              exit 1
            }

      - name: Detect PR smoke scopes
        id: smoke_scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            let runtimeSmokeRequired = true;
            let controllerSmokeRequired = true;
            if (context.eventName === "pull_request" || context.eventName === "repository_dispatch") {
              try {
                const pullNumber = context.eventName === "pull_request"
                  ? context.payload.pull_request.number
                  : context.payload.client_payload.pr_number;
                const changedFiles = await github.paginate(
                  github.rest.pulls.listFiles,
                  {
                    ...context.repo,
                    pull_number: pullNumber,
                    per_page: 100,
                  },
                  (response) => response.data
                );
                const expectedFileCount = context.eventName === "pull_request"
                  ? context.payload.pull_request.changed_files
                  : (await github.rest.pulls.get({
                    ...context.repo,
                    pull_number: pullNumber,
                  })).data.changed_files;
                const validFileEntries = changedFiles.every((file) =>
                  file &&
                  typeof file.filename === "string" &&
                  file.filename.length > 0 &&
                  (file.previous_filename === undefined ||
                    (typeof file.previous_filename === "string" && file.previous_filename.length > 0))
                );
                if (!Number.isInteger(expectedFileCount) || changedFiles.length !== expectedFileCount || !validFileEntries) {
                  core.warning("PR smoke scope detection was incomplete; running both local smokes.");
                } else {
                  const paths = changedFiles.flatMap((file) =>
                    [file.filename, file.previous_filename].filter(Boolean)
                  );
                  const runtimePrefixes = [
                    "buildSrc/",
                    "docker/",
                    "dev-tools/smoke/",
                    "gradle/",
                    "protos/",
                    ".github/actions/load-workflow-tool-versions/",
                    ".github/actions/setup-python/",
                  ];
                  const workflowToolAuthorityPath = "config/workflow-tool-versions.env";
                  const runtimeFiles = new Set([
                    ".dockerignore",
                    ".github/workflows/publish-pr-runtime-images.yml",
                    ".github/workflows/runtime-images.yml",
                    ".github/workflows/smoke-full.yml",
                    ".github/workflows/smoke.yml",
                    ".github/actions/load-workflow-tool-versions/action.yml",
                    ".python-version",
                    "build.gradle.kts",
                    "config/python/smoke-requirements.txt",
                    "config/python/smoke-requirements.in",
                    "dev-tools/build-compose-service-jars.sh",
                    "dev-tools/build-local-smoke-images.sh",
                    "dev-tools/backups/verify-backups.sh",
                    "dev-tools/backups/pg-dump-s3-selection.shlib",
                    "dev-tools/backups/smoke-backup-verifier-image.sh",
                    "dev-tools/certs/generate-dev-certs.sh",
                    "dev-tools/verify-compose-health.sh",
                    "dev-tools/verify-fresh-bootstrap.sh",
                    "dev-tools/verify-restart-state.sh",
                    "dev-tools/verify-smoke-images.sh",
                    "gradle.properties",
                    "docker/backup-verifier.Dockerfile",
                    "gradlew",
                    "gradlew.bat",
                    "settings.gradle.kts",
                  ]);
                  const controllerPrefixes = [
                    "buildSrc/",
                    "gradle/",
                    "services/hosted-environment-identity-controller/",
                  ];
                  const controllerFiles = new Set([
                    ".dockerignore",
                    ".github/workflows/runtime-images.yml",
                    "build.gradle.kts",
                    "dev-tools/hosted/controller/smoke-paused-controller-image.sh",
                    "docker/base.Dockerfile",
                    "gradle.properties",
                    "gradlew",
                    "gradlew.bat",
                    "settings.gradle.kts",
                  ]);
                  const authorityChanged = paths.includes(workflowToolAuthorityPath);
                  const nonAuthorityPaths = paths.filter(
                    (path) => path !== workflowToolAuthorityPath
                  );
                  runtimeSmokeRequired = nonAuthorityPaths.some(
                    (path) =>
                      runtimeFiles.has(path) ||
                      runtimePrefixes.some((prefix) => path.startsWith(prefix)) ||
                      (path.startsWith("services/") &&
                        !path.startsWith(
                          "services/hosted-environment-identity-controller/"
                        ))
                  );
                  runtimeSmokeRequired = runtimeSmokeRequired || authorityChanged;
                  controllerSmokeRequired = paths.some(
                    (path) =>
                      controllerFiles.has(path) ||
                      controllerPrefixes.some((prefix) => path.startsWith(prefix))
                  );
                }
              } catch (error) {
                core.warning(
                  `PR smoke scope detection failed; running both local smokes: ${error.message}`
                );
              }
            }
            core.setOutput("runtime_smoke_required", String(runtimeSmokeRequired));
            core.setOutput("controller_smoke_required", String(controllerSmokeRequired));

  dispatch-pr-base-refreshes:
    name: Dispatch PR Base Refreshes
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.status == 'completed' && github.event.workflow_run.event == 'push' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'develop') && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Dispatch exact PR runtime refreshes and preview reconciles
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const baseBranch = workflowRun.head_branch;
            const baseSha = workflowRun.head_sha;
            const shaPattern = /^[0-9a-f]{40}$/;
            const runtimePrefixes = [
              "buildSrc/",
              "docker/",
              "dev-tools/smoke/",
              "gradle/",
              "protos/",
              ".github/actions/load-workflow-tool-versions/",
              ".github/actions/setup-python/",
            ];
            const runtimeFiles = new Set([
              ".dockerignore",
              ".github/workflows/publish-pr-runtime-images.yml",
              ".github/workflows/runtime-images.yml",
              ".github/workflows/smoke-full.yml",
              ".github/workflows/smoke.yml",
              ".github/actions/load-workflow-tool-versions/action.yml",
              ".python-version",
              "build.gradle.kts",
              "config/workflow-tool-versions.env",
              "config/python/smoke-requirements.txt",
              "config/python/smoke-requirements.in",
              "dev-tools/build-compose-service-jars.sh",
              "dev-tools/build-local-smoke-images.sh",
              "dev-tools/backups/verify-backups.sh",
              "dev-tools/backups/pg-dump-s3-selection.shlib",
              "dev-tools/backups/smoke-backup-verifier-image.sh",
              "dev-tools/certs/generate-dev-certs.sh",
              "dev-tools/hosted/controller/smoke-paused-controller-image.sh",
              "dev-tools/verify-compose-health.sh",
              "dev-tools/verify-fresh-bootstrap.sh",
              "dev-tools/verify-restart-state.sh",
              "dev-tools/verify-smoke-images.sh",
              "gradle.properties",
              "gradlew",
              "gradlew.bat",
              "settings.gradle.kts",
            ]);

            const waitForMergeRefresh = async () => {
              await new Promise((resolve) => setTimeout(resolve, 2000));
            };

            const hasRuntimeChange = async (pullRequest) => {
              const files = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  ...context.repo,
                  pull_number: pullRequest.number,
                  per_page: 100,
                },
                (response) => response.data
              );
              const expectedFileCount = pullRequest.changed_files;
              const validFileEntries = Number.isInteger(expectedFileCount) &&
                files.length === expectedFileCount &&
                files.every((file) =>
                  file &&
                  typeof file.filename === "string" &&
                  file.filename.length > 0 &&
                  (file.previous_filename === undefined ||
                    (typeof file.previous_filename === "string" && file.previous_filename.length > 0))
                );
              if (!validFileEntries) {
                core.warning(`PR #${pullRequest.number} changed-file metadata was incomplete; refreshing its runtime images.`);
                return true;
              }
              return files.flatMap((file) => [file.filename, file.previous_filename].filter(Boolean)).some((path) =>
                runtimeFiles.has(path) ||
                runtimePrefixes.some((prefix) => path.startsWith(prefix)) ||
                path.startsWith("services/")
              );
            };

            const dependencyBotAuthors = new Set([
              "app/dependabot",
              "dependabot[bot]",
              "app/renovate",
              "renovate[bot]",
            ]);

            const resolveExactMerge = async (number) => {
              for (let attempt = 1; attempt <= 5; attempt += 1) {
                const response = await github.rest.pulls.get({
                  ...context.repo,
                  pull_number: number,
                });
                const pullRequest = response.data;
                const currentHeadSha = pullRequest.head?.sha;
                const currentBaseRef = pullRequest.base?.ref;
                const headRepository = pullRequest.head?.repo?.full_name;
                const baseRepository = pullRequest.base?.repo?.full_name;
                const author = pullRequest.user?.login;
                const priority = (pullRequest.labels || []).some(
                  (label) => label?.name === "preview:priority"
                );
                if (pullRequest.state !== "open" ||
                  headRepository !== context.payload.repository.full_name ||
                  baseRepository !== context.payload.repository.full_name ||
                  currentBaseRef !== baseBranch ||
                  !shaPattern.test(currentHeadSha || "") ||
                  dependencyBotAuthors.has(author) ||
                  (!['main', 'develop'].includes(currentBaseRef) && !priority)) {
                  return null;
                }

                const mergeableState = typeof pullRequest.mergeable_state === "string"
                  ? pullRequest.mergeable_state
                  : pullRequest.mergeable_state === null ? "unknown" : "invalid";
                if (pullRequest.mergeable === false ||
                  mergeableState === "dirty" ||
                  mergeableState === "conflicting") {
                  core.warning(`Skipping PR #${number}: GitHub reports a merge conflict.`);
                  return null;
                }
                if (pullRequest.mergeable === null || mergeableState === "unknown") {
                  if (attempt < 5) {
                    await waitForMergeRefresh();
                    continue;
                  }
                  core.warning(`Skipping PR #${number}: GitHub did not produce a ready merge tuple.`);
                  return null;
                }
                if (pullRequest.mergeable !== true || mergeableState === "invalid") {
                  core.warning(`Skipping PR #${number}: GitHub returned invalid merge metadata.`);
                  return null;
                }

                const mergeSha = pullRequest.merge_commit_sha;
                if (!shaPattern.test(mergeSha || "")) {
                  if (attempt < 5) {
                    await waitForMergeRefresh();
                    continue;
                  }
                  core.warning(`Skipping PR #${number}: merge SHA is null or invalid.`);
                  return null;
                }

                try {
                  const commit = await github.rest.repos.getCommit({
                    ...context.repo,
                    ref: mergeSha,
                  });
                  const parents = commit.data.parents?.map((parent) => parent.sha) || [];
                  if (commit.data.sha !== mergeSha ||
                    parents.length !== 2 ||
                    parents[0] !== baseSha ||
                    parents[1] !== currentHeadSha) {
                    if (attempt < 5) {
                      await waitForMergeRefresh();
                      continue;
                    }
                    core.warning(`Skipping PR #${number}: merge commit parents do not match the current base/head.`);
                    return null;
                  }
                } catch (error) {
                  if (attempt < 5) {
                    await waitForMergeRefresh();
                    continue;
                  }
                  core.warning(`Skipping PR #${number}: exact merge commit could not be read (${error.message}).`);
                  return null;
                }

                return {
                  tuple: {
                    prNumber: String(number),
                    baseRef: baseBranch,
                    baseSha,
                    headSha: currentHeadSha,
                    mergeSha,
                  },
                  pullRequest,
                };
              }
              return null;
            };

            if (!shaPattern.test(baseSha) || !["main", "develop"].includes(baseBranch)) {
              core.setFailed("Successful CI push did not identify a supported lowercase base branch SHA.");
              return;
            }
            const currentBranch = await github.rest.git.getRef({
              ...context.repo,
              ref: `heads/${baseBranch}`,
            });
            if (currentBranch.data.object?.sha !== baseSha) {
              core.warning(`Skipping PR base refresh: ${baseBranch} advanced beyond the completed CI push ${baseSha}.`);
              return;
            }

            const pullRequests = await github.paginate(
              github.rest.pulls.list,
              {
                ...context.repo,
                state: "open",
                base: baseBranch,
                per_page: 100,
              },
              (response) => response.data
            );
            for (const listedPullRequest of pullRequests) {
              if (listedPullRequest.state !== "open" ||
                listedPullRequest.base?.ref !== baseBranch ||
                listedPullRequest.head?.repo?.full_name !== context.payload.repository.full_name ||
                listedPullRequest.base?.repo?.full_name !== context.payload.repository.full_name) {
                continue;
              }
              const resolved = await resolveExactMerge(listedPullRequest.number);
              if (!resolved) {
                continue;
              }
              const {tuple, pullRequest} = resolved;
              if (await hasRuntimeChange(pullRequest)) {
                core.info(`Dispatching PR runtime base refresh for #${tuple.prNumber} (${tuple.baseSha} / ${tuple.headSha} / ${tuple.mergeSha}).`);
                await github.rest.repos.createDispatchEvent({
                  ...context.repo,
                  event_type: "pr-runtime-base-refresh",
                  client_payload: {
                    pr_number: tuple.prNumber,
                    base_ref: tuple.baseRef,
                    base_sha: tuple.baseSha,
                    head_sha: tuple.headSha,
                    merge_sha: tuple.mergeSha,
                  },
                });
              } else {
                core.info(`Skipping PR runtime image refresh for #${tuple.prNumber}: no runtime-changing files.`);
              }
              core.info(`Dispatching preview deploy reconciliation for #${tuple.prNumber} (${tuple.baseSha} / ${tuple.headSha} / ${tuple.mergeSha}).`);
              await github.rest.repos.createDispatchEvent({
                ...context.repo,
                event_type: "preview-deploy",
                client_payload: {
                  action: "deploy",
                  pr_number: tuple.prNumber,
                  base_ref: tuple.baseRef,
                  base_sha: tuple.baseSha,
                  head_sha: tuple.headSha,
                  merge_sha: tuple.mergeSha,
                  preview_domain: "preview.firedevops.net",
                },
              });
            }

  build-base-image:
    name: Build Runtime Base Image
    needs: [image-meta]
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'repository_dispatch' && needs.image-meta.result == 'success' && (needs.image-meta.outputs.head_branch == 'main' || needs.image-meta.outputs.head_branch == 'develop') }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.select_base_image_digest.outputs.digest }}
    permissions:
      # This job publishes the shared runtime base image to GHCR.
      contents: read
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime base image
        id: build_base_image_first
        continue-on-error: true
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./docker/base.Dockerfile
          push: true
          tags: ${{ needs.image-meta.outputs.base_image }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache
            type=registry,ref=ghcr.io/benhook1013/firemud-base:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache,mode=max
            type=gha,mode=max

      - name: Retry build and push runtime base image
        id: build_base_image_retry
        if: ${{ steps.build_base_image_first.outcome == 'failure' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./docker/base.Dockerfile
          push: true
          tags: ${{ needs.image-meta.outputs.base_image }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache
            type=registry,ref=ghcr.io/benhook1013/firemud-base:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache,mode=max
            type=gha,mode=max

      - name: Select exact published runtime base digest
        id: select_base_image_digest
        if: ${{ !cancelled() }}
        env:
          FIRST_OUTCOME: ${{ steps.build_base_image_first.outcome }}
          FIRST_DIGEST: ${{ steps.build_base_image_first.outputs.digest }}
          RETRY_OUTCOME: ${{ steps.build_base_image_retry.outcome }}
          RETRY_DIGEST: ${{ steps.build_base_image_retry.outputs.digest }}
        run: |
          set -euo pipefail
          published_digests=()
          if [[ "$FIRST_OUTCOME" == "success" ]]; then
            published_digests+=("$FIRST_DIGEST")
          fi
          if [[ "$RETRY_OUTCOME" == "success" ]]; then
            published_digests+=("$RETRY_DIGEST")
          fi
          if ((${#published_digests[@]} != 1)); then
            echo "Expected exactly one successful runtime base-image publication digest." >&2
            exit 1
          fi
          base_image_digest="${published_digests[0]}"
          [[ "$base_image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Runtime base-image publisher returned an invalid sha256 digest." >&2
            exit 1
          }
          echo "digest=$base_image_digest" >> "$GITHUB_OUTPUT"

  build-runtime-images:
    name: Build Runtime Images (${{ matrix.service }})
    needs: [image-meta, build-base-image]
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'repository_dispatch' && needs.image-meta.result == 'success' && (needs.image-meta.outputs.head_branch == 'main' || needs.image-meta.outputs.head_branch == 'develop') }}
    runs-on: ubuntu-latest
    permissions:
      # This job publishes only unique staging service tags. Canonical aliases
      # are written by publish-runtime-images after the exact candidate passes smoke.
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - automation-scripting-service
          - entity-management-service
          - game-design-service
          - game-logic-service
          - game-session-service
          - logging-admin-service
          - social-groups-service
          - spring-cloud-gateway
          - tcp-proxy-service
          - world-management-service
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Build service JAR
        run: ./gradlew :${{ matrix.service }}:bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime service image
        id: build_runtime_image_first
        continue-on-error: true
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ./services/${{ matrix.service }}/build/libs
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          build-contexts: |
            repo_root=.
          build-args: |
            BASE_IMAGE=ghcr.io/benhook1013/firemud-base@${{ needs.build-base-image.outputs.digest }}
          tags: ghcr.io/benhook1013/${{ matrix.service }}:${{ needs.image-meta.outputs.candidate_tag }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache,mode=max
            type=gha,mode=max

      - name: Retry build and push runtime service image
        if: ${{ steps.build_runtime_image_first.outcome == 'failure' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ./services/${{ matrix.service }}/build/libs
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          build-contexts: |
            repo_root=.
          build-args: |
            BASE_IMAGE=ghcr.io/benhook1013/firemud-base@${{ needs.build-base-image.outputs.digest }}
          tags: ghcr.io/benhook1013/${{ matrix.service }}:${{ needs.image-meta.outputs.candidate_tag }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache,mode=max
            type=gha,mode=max

  build-backup-verifier:
    name: Build Backup Verifier Image
    needs: [image-meta]
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'repository_dispatch' && needs.image-meta.result == 'success' && (needs.image-meta.outputs.head_branch == 'develop' || needs.image-meta.outputs.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_id: ${{ steps.smoke.outputs.image_id }}
    permissions:
      contents: read
    env:
      BACKUP_VERIFIER_IMAGE: ghcr.io/benhook1013/backup-verifier:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout trusted branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: Build backup verifier image
        run: |
          docker build \
            --file docker/backup-verifier.Dockerfile \
            --tag "$BACKUP_VERIFIER_IMAGE" \
            .

      - name: Smoke backup verifier image
        id: smoke
        env:
          VELERO_VERSION: ${{ steps.workflow-tool-versions.outputs.velero-version }}
        run: |
          set -euo pipefail
          bash ./dev-tools/backups/smoke-backup-verifier-image.sh "$BACKUP_VERIFIER_IMAGE" "$VELERO_VERSION"
          image_id="$(docker image inspect --format '{{.Id}}' "$BACKUP_VERIFIER_IMAGE")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Backup verifier image did not return an exact image ID." >&2
            exit 1
          }
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Export exact verified backup verifier image artifact
        env:
          VERIFIED_IMAGE_ID: ${{ steps.smoke.outputs.image_id }}
        run: |
          set -euo pipefail
          current_image_id="$(docker image inspect --format '{{.Id}}' "$BACKUP_VERIFIER_IMAGE")"
          [[ "$current_image_id" == "$VERIFIED_IMAGE_ID" ]] || {
            echo "Backup verifier image changed after its smoke proof; refusing artifact export." >&2
            exit 1
          }
          docker save "$BACKUP_VERIFIER_IMAGE" | gzip -1 > "$RUNNER_TEMP/backup-verifier.tar.gz"

      - name: Upload exact verified backup verifier image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backup-verifier-${{ needs.image-meta.outputs.image_tag }}
          path: ${{ runner.temp }}/backup-verifier.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-backup-verifier:
    name: Publish Trusted Backup Verifier Image
    needs: [image-meta, build-backup-verifier]
    if: ${{ always() && github.event_name != 'pull_request' && github.event_name != 'repository_dispatch' && (needs.image-meta.outputs.head_branch == 'develop' || needs.image-meta.outputs.head_branch == 'main') && needs.image-meta.result == 'success' && needs.build-backup-verifier.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      BACKUP_VERIFIER_IMAGE_NAME: ghcr.io/benhook1013/backup-verifier
      BACKUP_VERIFIER_IMAGE: ghcr.io/benhook1013/backup-verifier:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout trusted publication commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Download exact verified backup verifier image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backup-verifier-${{ needs.image-meta.outputs.image_tag }}
          path: ${{ runner.temp }}/backup-verifier-artifact

      - name: Load and verify exact backup verifier image
        env:
          BACKUP_VERIFIER_ARCHIVE: ${{ runner.temp }}/backup-verifier-artifact/backup-verifier.tar.gz
          VERIFIED_IMAGE_ID: ${{ needs.build-backup-verifier.outputs.image_id }}
        run: |
          set -euo pipefail
          [[ -f "$BACKUP_VERIFIER_ARCHIVE" ]] || {
            echo "Verified backup verifier image artifact is missing." >&2
            exit 1
          }
          gzip -dc "$BACKUP_VERIFIER_ARCHIVE" | docker load
          loaded_image_id="$(docker image inspect --format '{{.Id}}' "$BACKUP_VERIFIER_IMAGE")"
          [[ "$loaded_image_id" == "$VERIFIED_IMAGE_ID" ]] || {
            echo "Loaded backup verifier image does not match the exact verified build image." >&2
            exit 1
          }

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact verified backup verifier image
        id: publish
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/shared/push-verified-image.sh "$BACKUP_VERIFIER_IMAGE"

      - name: Attest trusted backup verifier image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.BACKUP_VERIFIER_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  build-hosted-identity-controller:
    name: Build Trusted Hosted Identity Controller
    needs: [image-meta, build-base-image]
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'repository_dispatch' && (needs.image-meta.outputs.head_branch == 'develop' || needs.image-meta.outputs.head_branch == 'main') && needs.image-meta.result == 'success' && needs.build-base-image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image_id: ${{ steps.smoke.outputs.image_id }}
    permissions:
      contents: read
      packages: read
    env:
      CONTROLLER_IMAGE_NAME: ghcr.io/benhook1013/firemud-hosted-identity-controller
      CONTROLLER_IMAGE: ghcr.io/benhook1013/firemud-hosted-identity-controller:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout trusted branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build controller JAR and image locally
        run: |
          set -euo pipefail
          ./gradlew :hosted-environment-identity-controller:bootJar
          docker build \
            --file services/hosted-environment-identity-controller/Dockerfile \
            --build-arg BASE_IMAGE="ghcr.io/benhook1013/firemud-base@${{ needs.build-base-image.outputs.digest }}" \
            --tag "$CONTROLLER_IMAGE" \
            services/hosted-environment-identity-controller/build/libs

      - name: Smoke exact controller image
        id: smoke
        run: |
          set -euo pipefail
          smoked_image_id="$(bash ./dev-tools/hosted/controller/smoke-paused-controller-image.sh "$CONTROLLER_IMAGE")"
          local_image_id="$(docker image inspect --format '{{.Id}}' "$CONTROLLER_IMAGE")"
          [[ "$smoked_image_id" == "$local_image_id" ]] || {
            echo "Controller smoke did not execute the exact locally tagged image." >&2
            exit 1
          }
          echo "image_id=$local_image_id" >> "$GITHUB_OUTPUT"

      - name: Export exact verified controller image artifact
        env:
          VERIFIED_IMAGE_ID: ${{ steps.smoke.outputs.image_id }}
        run: |
          set -euo pipefail
          current_image_id="$(docker image inspect --format '{{.Id}}' "$CONTROLLER_IMAGE")"
          [[ "$current_image_id" == "$VERIFIED_IMAGE_ID" ]] || {
            echo "Controller image changed after its smoke proof; refusing artifact export." >&2
            exit 1
          }
          docker save "$CONTROLLER_IMAGE" | gzip -1 > "$RUNNER_TEMP/hosted-identity-controller.tar.gz"

      - name: Upload exact verified controller image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hosted-identity-controller-${{ needs.image-meta.outputs.image_tag }}
          path: ${{ runner.temp }}/hosted-identity-controller.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-hosted-identity-controller:
    name: Publish Trusted Hosted Identity Controller
    needs: [image-meta, build-base-image, build-hosted-identity-controller]
    if: ${{ always() && github.event_name != 'pull_request' && github.event_name != 'repository_dispatch' && (needs.image-meta.outputs.head_branch == 'develop' || needs.image-meta.outputs.head_branch == 'main') && needs.image-meta.result == 'success' && needs.build-base-image.result == 'success' && needs.build-hosted-identity-controller.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      CONTROLLER_IMAGE_NAME: ghcr.io/benhook1013/firemud-hosted-identity-controller
      CONTROLLER_IMAGE: ghcr.io/benhook1013/firemud-hosted-identity-controller:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout trusted publication commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Download exact verified controller image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hosted-identity-controller-${{ needs.image-meta.outputs.image_tag }}
          path: ${{ runner.temp }}/hosted-identity-controller-artifact

      - name: Load and verify exact controller image
        env:
          CONTROLLER_ARCHIVE: ${{ runner.temp }}/hosted-identity-controller-artifact/hosted-identity-controller.tar.gz
          VERIFIED_IMAGE_ID: ${{ needs.build-hosted-identity-controller.outputs.image_id }}
        run: |
          set -euo pipefail
          [[ -f "$CONTROLLER_ARCHIVE" ]] || {
            echo "Verified hosted identity controller image artifact is missing." >&2
            exit 1
          }
          gzip -dc "$CONTROLLER_ARCHIVE" | docker load
          loaded_image_id="$(docker image inspect --format '{{.Id}}' "$CONTROLLER_IMAGE")"
          [[ "$loaded_image_id" == "$VERIFIED_IMAGE_ID" ]] || {
            echo "Loaded controller image does not match the exact verified build image." >&2
            exit 1
          }

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact verified controller image
        id: publish
        env:
          VERIFIED_IMAGE_ID: ${{ needs.build-hosted-identity-controller.outputs.image_id }}
        run: |
          set -euo pipefail
          current_image_id="$(docker image inspect --format '{{.Id}}' "$CONTROLLER_IMAGE")"
          [[ "$current_image_id" == "$VERIFIED_IMAGE_ID" ]] || {
            echo "Controller image changed after its verification proof; refusing publication." >&2
            exit 1
          }
          bash ./dev-tools/hosted/shared/push-verified-image.sh "$CONTROLLER_IMAGE"

      - name: Attest trusted controller image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CONTROLLER_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  pr-local-smoke:
    name: PR Full-Stack Smoke
    needs: [image-meta]
    if: ${{ (github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null)) || github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # PR-controlled source receives no registry or repository write credential.
      contents: read
    env:
      COMPOSE_PROJECT_NAME: smoke-full-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_TIMEOUT_SECONDS: 20
      SMOKE_IMAGE_TAG: ${{ needs.image-meta.outputs.image_tag }}
      SMOKE_IMAGE_LOCAL_ONLY: 'true'
      BACKUP_VERIFIER_IMAGE: ghcr.io/benhook1013/backup-verifier:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout PR merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: Set up canonical Python
        if: ${{ needs.image-meta.outputs.runtime_smoke_required == 'true' }}
        uses: ./.github/actions/setup-python
        with:
          requirements: smoke

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: true

      - name: Build local PR runtime images
        env:
          MERGE_SHA: ${{ needs.image-meta.outputs.merge_sha }}
        run: |
          set -euo pipefail
          bash ./dev-tools/build-local-smoke-images.sh "$MERGE_SHA"
          for service in \
            account-service \
            automation-scripting-service \
            entity-management-service \
            game-design-service \
            game-logic-service \
            game-session-service \
            logging-admin-service \
            social-groups-service \
            spring-cloud-gateway \
            tcp-proxy-service \
            world-management-service; do
            docker tag \
              "ghcr.io/benhook1013/${service}:${MERGE_SHA}" \
              "ghcr.io/benhook1013/${service}:${SMOKE_IMAGE_TAG}"
          done

      - name: Build PR backup verifier image
        run: |
          docker build \
            --file docker/backup-verifier.Dockerfile \
            --tag "$BACKUP_VERIFIER_IMAGE" \
            .

      - name: Smoke PR backup verifier image
        env:
          VELERO_VERSION: ${{ steps.workflow-tool-versions.outputs.velero-version }}
        run: bash ./dev-tools/backups/smoke-backup-verifier-image.sh "$BACKUP_VERIFIER_IMAGE" "$VELERO_VERSION"

      - name: Run credential-free full-stack smoke
        if: ${{ needs.image-meta.outputs.runtime_smoke_required == 'true' }}
        run: bash ./dev-tools/verify-smoke-images.sh

      - name: Export fixed-tag preview image artifact
        run: |
          service_manifest=/tmp/pr-runtime-services.txt
          provenance=/tmp/pr-runtime-provenance.json
          : > "$service_manifest"
          images=()
          for service in \
            account-service \
            automation-scripting-service \
            entity-management-service \
            game-design-service \
            game-logic-service \
            game-session-service \
            logging-admin-service \
            social-groups-service \
            spring-cloud-gateway \
            tcp-proxy-service \
            world-management-service; do
            printf '%s\n' "$service" >> "$service_manifest"
            images+=("ghcr.io/benhook1013/${service}:${SMOKE_IMAGE_TAG}")
          done
          printf '%s\n' 'backup-verifier' >> "$service_manifest"
          images+=("$BACKUP_VERIFIER_IMAGE")
          PR_NUMBER="${{ needs.image-meta.outputs.pr_number }}" \
          BASE_SHA="${{ needs.image-meta.outputs.base_sha }}" \
          HEAD_SHA="${{ needs.image-meta.outputs.head_sha }}" \
          MERGE_SHA="${{ needs.image-meta.outputs.merge_sha }}" \
          IMAGE_TAG="${SMOKE_IMAGE_TAG}" \
          SOURCE_RUN_ID="${{ github.run_id }}" \
          REPOSITORY="${GITHUB_REPOSITORY}" \
          PROVENANCE_PATH="$provenance" \
          python3 - <<'PY'
          import json
          import os

          services = [
              "account-service",
              "automation-scripting-service",
              "entity-management-service",
              "game-design-service",
              "game-logic-service",
              "game-session-service",
              "logging-admin-service",
              "social-groups-service",
              "spring-cloud-gateway",
              "tcp-proxy-service",
              "world-management-service",
              "backup-verifier",
          ]
          provenance = {
              "repository": os.environ["REPOSITORY"],
              "prNumber": int(os.environ["PR_NUMBER"]),
              "baseSha": os.environ["BASE_SHA"],
              "headSha": os.environ["HEAD_SHA"],
              "mergeSha": os.environ["MERGE_SHA"],
              "imageTag": os.environ["IMAGE_TAG"],
              "sourceRunId": int(os.environ["SOURCE_RUN_ID"]),
              "services": services,
          }
          with open(os.environ["PROVENANCE_PATH"], "w", encoding="utf-8") as output:
              json.dump(provenance, output, separators=(",", ":"), sort_keys=True)
              output.write("\n")
          PY
          docker save "${images[@]}" | gzip -1 > /tmp/pr-runtime-images.tar.gz

      - name: Upload preview image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-runtime-images-${{ needs.image-meta.outputs.image_tag }}
          path: |
            /tmp/pr-runtime-images.tar.gz
            /tmp/pr-runtime-services.txt
            /tmp/pr-runtime-provenance.json
          if-no-files-found: error
          retention-days: 1

      - name: Summarize secure PR runtime artifact
        env:
          PR_NUMBER: ${{ needs.image-meta.outputs.pr_number }}
          BASE_SHA: ${{ needs.image-meta.outputs.base_sha }}
          HEAD_SHA: ${{ needs.image-meta.outputs.head_sha }}
          MERGE_SHA: ${{ needs.image-meta.outputs.merge_sha }}
          ARTIFACT_NAME: pr-runtime-images-${{ needs.image-meta.outputs.image_tag }}
        run: |
          {
            echo "### PR runtime images and applicable full-stack smoke"
            echo
            echo "- Pull request: #${PR_NUMBER}"
            echo "- Base SHA: \`${BASE_SHA}\`"
            echo "- PR head SHA: \`${HEAD_SHA}\`"
            echo "- Built PR merge SHA (full-stack smoke runs when required): \`${MERGE_SHA}\`"
            echo "- Merge-scoped publication tag: \`pr-merge-${MERGE_SHA}\`"
            echo "- Artifact: \`${ARTIFACT_NAME}\`"
            echo
            echo "This read-only PR workflow built the PR merge commit and runs full-stack smoke when required by change scope. The trusted default-branch publisher uploads only the exact merge-scoped artifact from this successful run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump Docker Compose logs on failure
        if: ${{ failure() && needs.image-meta.outputs.runtime_smoke_required == 'true' }}
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.override.yml \
            -f docker/docker-compose.smoke-images.override.yml \
            logs || true

      - name: Stop smoke stack
        if: ${{ always() && needs.image-meta.outputs.runtime_smoke_required == 'true' }}
        run: |
          source ./dev-tools/smoke/run-owned-compose.sh
          if ! stop_run_owned_compose_project \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.override.yml \
            -f docker/docker-compose.smoke-images.override.yml; then
            echo "Unable to prove or release the smoke Compose project; refusing unowned teardown." >&2
            exit 1
          fi

  pr-controller-smoke:
    name: PR Hosted Identity Controller Smoke
    needs: [image-meta]
    if: ${{ ((github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null)) || github.event_name == 'repository_dispatch') && needs.image-meta.outputs.controller_smoke_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # PR-controlled source receives no registry or repository write credential.
      contents: read
    env:
      BASE_IMAGE: ${{ needs.image-meta.outputs.base_image }}
      CONTROLLER_IMAGE: firemud-hosted-identity-controller-local:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout PR merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Build exact local runtime base image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: docker/base.Dockerfile
          push: false
          load: true
          tags: ${{ env.BASE_IMAGE }}
          cache-from: type=gha,scope=pr-controller-smoke
          cache-to: type=gha,mode=max,scope=pr-controller-smoke

      - name: Build controller image for credential-free local validation
        run: |
          set -euo pipefail
          ./gradlew :hosted-environment-identity-controller:bootJar
          docker build \
            --file services/hosted-environment-identity-controller/Dockerfile \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --tag "$CONTROLLER_IMAGE" \
            services/hosted-environment-identity-controller/build/libs

      - name: Smoke controller image entrypoint and paused health
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/controller/smoke-paused-controller-image.sh "$CONTROLLER_IMAGE" >/dev/null

  smoke-full:
    name: Published Runtime Full-Stack Smoke
    needs: [image-meta, build-runtime-images]
    if: ${{ always() && github.event_name != 'pull_request' && github.event_name != 'repository_dispatch' && needs.image-meta.result == 'success' && needs.build-runtime-images.result == 'success' }}
    permissions:
      # The trusted branch smoke workflow only pulls the staged candidate images.
      contents: read
      packages: read
    uses: ./.github/workflows/smoke-full.yml
    with:
      action: full
      head_sha: ${{ needs.image-meta.outputs.head_sha }}
      checkout_ref: ${{ needs.image-meta.outputs.checkout_ref }}
      image_tag: ${{ needs.image-meta.outputs.candidate_tag }}
    secrets: inherit

  publish-runtime-images:
    name: Promote Smoke-Tested Runtime Images
    needs: [image-meta, build-runtime-images, smoke-full]
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'repository_dispatch' && needs.image-meta.result == 'success' && needs.build-runtime-images.result == 'success' && needs.smoke-full.result == 'success' && (needs.image-meta.outputs.head_branch == 'main' || needs.image-meta.outputs.head_branch == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      HEAD_SHA: ${{ needs.image-meta.outputs.head_sha }}
      HEAD_BRANCH: ${{ needs.image-meta.outputs.head_branch }}
      CANDIDATE_TAG: ${{ needs.image-meta.outputs.candidate_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout trusted publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up canonical GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote smoke-tested service digests
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          services=(
            account-service
            automation-scripting-service
            entity-management-service
            game-design-service
            game-logic-service
            game-session-service
            logging-admin-service
            social-groups-service
            spring-cloud-gateway
            tcp-proxy-service
            world-management-service
          )

          declare -A registry_tokens=()
          registry_manifest_state() {
            local image="$1"
            local image_path="${image#ghcr.io/}"
            local repository_path="${image_path%:*}"
            local tag="${image_path##*:}"
            local manifest_url="https://ghcr.io/v2/${repository_path}/manifests/${tag}"
            local registry_token="${registry_tokens[$repository_path]:-}"
            local status

            [[ -n "${GHCR_USERNAME:-}" && -n "${GHCR_TOKEN:-}" ]] || {
              echo "GHCR credentials are unavailable for authenticated manifest preflight: $image" >&2
              return 1
            }
            if [[ -z "$registry_token" ]]; then
              if ! registry_token="$(curl --silent --show-error --location --fail \
                --connect-timeout 10 --max-time 30 \
                --user "${GHCR_USERNAME}:${GHCR_TOKEN}" \
                --get \
                --data-urlencode 'service=ghcr.io' \
                --data-urlencode "scope=repository:${repository_path}:pull" \
                --header 'Accept: application/json' \
                'https://ghcr.io/token' | jq -er '.token // .access_token // empty')"; then
                echo "GHCR bearer-token exchange failed for $image; refusing to infer absence." >&2
                return 1
              fi
              registry_tokens["$repository_path"]="$registry_token"
            fi
            # `docker manifest inspect "$image"` conflates a 404 with auth,
            # registry, and network failures, so it is never an absence check.
            if ! status="$(curl --silent --show-error --location --head \
              --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer ${registry_token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              --output /dev/null --write-out '%{http_code}' "$manifest_url")"; then
              echo "Authenticated OCI manifest HEAD failed for $image; refusing to infer absence." >&2
              return 1
            fi
            case "$status" in
              200) printf 'existing\n' ;;
              404) printf 'missing\n' ;;
              *)
                echo "Authenticated OCI manifest HEAD returned HTTP ${status} for $image; refusing to push." >&2
                return 1
                ;;
            esac
          }

          registry_digest() {
            local image="$1"
            local digest
            if ! digest="$(docker buildx imagetools inspect "$image" |
              awk '$1 == "Digest:" { print $2; exit }')"; then
              echo "Unable to inspect exact registry digest for $image; refusing to publish." >&2
              return 1
            fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Registry manifest for $image has no exact digest." >&2
              return 1
            }
            printf '%s\n' "$digest"
          }

          assert_current_branch_head() {
            local current_sha
            current_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_BRANCH}" \
              --jq '.object.sha')"
            [[ "$current_sha" == "$HEAD_SHA" ]] || {
              echo "Refusing canonical runtime publication: ${HEAD_BRANCH} moved from ${HEAD_SHA} to ${current_sha}." >&2
              exit 1
            }
          }

          promote_alias() {
            local source="$1" target="$2" fixed="$3"
            local source_digest existing_digest target_digest
            source_digest="$(registry_digest "$source")"
            local target_state
            if ! target_state="$(registry_manifest_state "$target")"; then
              echo "Immutable target preflight failed for $target; refusing to publish." >&2
              exit 1
            fi
            if [[ "$target_state" == missing ]]; then
              docker buildx imagetools create --tag "$target" "$source"
            else
              existing_digest="$(registry_digest "$target")"
              if [[ "$fixed" == true && "$existing_digest" != "$source_digest" ]]; then
                echo "Refusing to overwrite fixed runtime tag $target: existing digest $existing_digest differs from candidate $source_digest." >&2
                exit 1
              fi
              if [[ "$existing_digest" != "$source_digest" ]]; then
                docker buildx imagetools create --tag "$target" "$source"
              fi
            fi
            target_digest="$(registry_digest "$target")"
            [[ "$target_digest" == "$source_digest" ]] || {
              echo "Promoted runtime tag $target does not match candidate digest $source_digest (got $target_digest)." >&2
              exit 1
            }
          }

          for service in "${services[@]}"; do
            candidate="ghcr.io/benhook1013/${service}:${CANDIDATE_TAG}"
            sha_tag="ghcr.io/benhook1013/${service}:${HEAD_SHA}"
            branch_tag="ghcr.io/benhook1013/${service}:${HEAD_BRANCH}"

            assert_current_branch_head
            promote_alias "$candidate" "$sha_tag" true
            assert_current_branch_head
            promote_alias "$candidate" "$branch_tag" false
            if [[ "$HEAD_BRANCH" == develop ]]; then
              assert_current_branch_head
              promote_alias "$candidate" "ghcr.io/benhook1013/${service}:latest" false
            fi
          done
