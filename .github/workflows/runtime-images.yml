name: Build Runtime Images

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'protos/**'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/runtime-images.yml'
      - '.github/workflows/publish-pr-runtime-images.yml'
      - '.github/workflows/smoke.yml'
      - '.github/workflows/smoke-full.yml'
      - 'services/common-library/**'
      - 'services/common-data-runtime/**'
      - 'services/common-platform-core/**'
      - 'services/common-saga/**'
      - 'services/common-security/**'
      - 'services/common-test-support/**'
      - 'services/common-web-support/**'
      - 'services/account-service/**'
      - 'services/automation-scripting-service/**'
      - 'services/entity-management-service/**'
      - 'services/game-design-service/**'
      - 'services/game-logic-service/**'
      - 'services/game-session-service/**'
      - 'services/logging-admin-service/**'
      - 'services/social-groups-service/**'
      - 'services/spring-cloud-gateway/**'
      - 'services/tcp-proxy-service/**'
      - 'services/world-management-service/**'
      - 'services/hosted-environment-identity-controller/**'
      - '.github/actions/load-workflow-tool-versions/**'
      - '.github/actions/setup-python/**'
      - '.python-version'
      - 'config/workflow-tool-versions.env'
      - 'config/python/smoke-requirements.txt'
      - 'config/python/smoke-requirements.in'
      - 'dev-tools/build-compose-service-jars.sh'
      - 'dev-tools/build-local-smoke-images.sh'
      - 'dev-tools/backups/verify-backups.sh'
      - 'dev-tools/backups/pg-dump-s3-selection.shlib'
      - 'dev-tools/backups/smoke-backup-verifier-image.sh'
      - 'docker/backup-verifier.Dockerfile'
      - 'dev-tools/certs/generate-dev-certs.sh'
      - 'dev-tools/hosted/controller/smoke-paused-controller-image.sh'
      - 'dev-tools/smoke/**'
      - 'dev-tools/verify-compose-health.sh'
      - 'dev-tools/verify-fresh-bootstrap.sh'
      - 'dev-tools/verify-restart-state.sh'
      - 'dev-tools/verify-smoke-images.sh'
  push:
    branches: [main, develop]
  workflow_dispatch:

run-name: Build Runtime Images ${{ github.event_name == 'pull_request' && format('secure-pr-artifact pr-{0} base-{1} head-{2} merge-{3} mode-{4}', github.event.pull_request.number, github.event.pull_request.base.sha, github.event.pull_request.head.sha, github.sha, github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required') || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: runtime-images-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required' }}
  cancel-in-progress: true

jobs:
  image-meta:
    name: Derive Runtime Image Metadata
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref != null }}
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.meta.outputs.head_sha }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      base_image: ${{ steps.meta.outputs.base_image }}
      runtime_smoke_required: ${{ steps.smoke_scope.outputs.runtime_smoke_required }}
      controller_smoke_required: ${{ steps.smoke_scope.outputs.controller_smoke_required }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Derive image tags
        id: meta
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="$EVENT_HEAD_SHA"
            CHECKOUT_REF="${GITHUB_SHA}"
          else
            HEAD_SHA="${GITHUB_SHA}"
            CHECKOUT_REF="${GITHUB_SHA}"
          fi

          IMAGE_TAG="${HEAD_SHA}"
          BASE_IMAGE="ghcr.io/benhook1013/firemud-base:${IMAGE_TAG}"

          {
            echo "head_sha=${HEAD_SHA}"
            echo "checkout_ref=${CHECKOUT_REF}"
            echo "image_tag=${IMAGE_TAG}"
            echo "base_image=${BASE_IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Detect PR smoke scopes
        id: smoke_scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            let runtimeSmokeRequired = true;
            let controllerSmokeRequired = true;
            if (context.eventName === "pull_request") {
              try {
                const changedFiles = await github.paginate(
                  github.rest.pulls.listFiles,
                  {
                    ...context.repo,
                    pull_number: context.payload.pull_request.number,
                    per_page: 100,
                  },
                  (response) => response.data
                );
                const expectedFileCount = context.payload.pull_request.changed_files;
                if (!Number.isInteger(expectedFileCount) || changedFiles.length !== expectedFileCount) {
                  core.warning("PR smoke scope detection was incomplete; running both local smokes.");
                } else {
                  const paths = changedFiles.flatMap((file) =>
                    [file.filename, file.previous_filename].filter(Boolean)
                  );
                  const runtimePrefixes = [
                    "buildSrc/",
                    "docker/",
                    "dev-tools/smoke/",
                    "gradle/",
                    "protos/",
                    ".github/actions/setup-python/",
                  ];
                  const workflowToolAuthorityPath = "config/workflow-tool-versions.env";
                  const knownWorkflowToolKeys = new Set([
                    "KUBECTL_VERSION",
                    "KUBECTL_LINUX_AMD64_CHECKSUM_VERSION",
                    "KUBECTL_LINUX_AMD64_SHA256",
                    "HELM_VERSION",
                    "HELM_LINUX_AMD64_CHECKSUM_VERSION",
                    "HELM_LINUX_AMD64_SHA256",
                    "GH_VERSION",
                    "GH_LINUX_AMD64_CHECKSUM_VERSION",
                    "GH_LINUX_AMD64_SHA256",
                    "BUF_VERSION",
                    "BUF_LINUX_X86_64_CHECKSUM_VERSION",
                    "BUF_LINUX_X86_64_SHA256",
                    "KUBECONFORM_VERSION",
                    "KUBECONFORM_LINUX_AMD64_CHECKSUM_VERSION",
                    "KUBECONFORM_LINUX_AMD64_SHA256",
                    "VELERO_VERSION",
                    "VELERO_IMAGE_DIGEST",
                    "VELERO_LINUX_AMD64_CHECKSUM_VERSION",
                    "VELERO_LINUX_AMD64_SHA256",
                    "VELERO_CHART_VERSION",
                    "ACTIONLINT_VERSION",
                    "TRIVY_VERSION",
                    "TRIVY_LINUX_AMD64_CHECKSUM_VERSION",
                    "TRIVY_LINUX_AMD64_SHA256",
                    "LYCHEE_VERSION",
                    "LYCHEE_LINUX_X86_64_MUSL_CHECKSUM_VERSION",
                    "LYCHEE_LINUX_X86_64_MUSL_SHA256",
                    "ORT_VERSION",
                    "ORT_DIGEST",
                    "ZAP_VERSION",
                    "ZAP_DIGEST",
                  ]);
                  const readAuthorityContent = async (owner, repo, ref) => {
                    const response = await github.rest.repos.getContent({
                      owner,
                      repo,
                      path: workflowToolAuthorityPath,
                      ref,
                    });
                    const data = response.data;
                    if (
                      !data ||
                      data.type !== "file" ||
                      data.path !== workflowToolAuthorityPath ||
                      data.encoding !== "base64" ||
                      typeof data.content !== "string"
                    ) {
                      throw new Error("workflow tool authority response was not a complete file");
                    }
                    const encoded = data.content.replace(/\s/g, "");
                    if (
                      encoded.length === 0 ||
                      encoded.length % 4 !== 0 ||
                      !/^[A-Za-z0-9+/]*={0,2}$/.test(encoded)
                    ) {
                      throw new Error("workflow tool authority response had invalid base64 content");
                    }
                    const decoded = Buffer.from(encoded, "base64");
                    if (decoded.toString("base64") !== encoded) {
                      throw new Error("workflow tool authority response had non-canonical base64 content");
                    }
                    const content = decoded.toString("utf8");
                    if (!Buffer.from(content, "utf8").equals(decoded)) {
                      throw new Error("workflow tool authority response was not valid UTF-8");
                    }
                    return content;
                  };
                  const parseAuthority = (content, source) => {
                    if (typeof content !== "string" || content.length === 0) {
                      throw new Error(`${source} workflow tool authority was empty`);
                    }
                    const values = new Map();
                    for (const [index, line] of content.split(/\r\n|\n|\r/).entries()) {
                      const trimmedLine = line.trim();
                      if (trimmedLine === "" || trimmedLine.startsWith("#")) {
                        continue;
                      }
                      const match = line.match(/^([A-Z][A-Z0-9_]*)=(\S+)$/);
                      if (!match || !knownWorkflowToolKeys.has(match[1])) {
                        throw new Error(`${source} workflow tool authority has an unknown or malformed key on line ${index + 1}`);
                      }
                      if (values.has(match[1])) {
                        throw new Error(`${source} workflow tool authority has a duplicate key: ${match[1]}`);
                      }
                      values.set(match[1], match[2]);
                    }
                    if (values.size !== knownWorkflowToolKeys.size) {
                      throw new Error(`${source} workflow tool authority did not contain the complete known key set`);
                    }
                    return values;
                  };
                  const veleroAuthorityChanged = async () => {
                    try {
                      const pullRequest = context.payload.pull_request;
                      const baseSha = pullRequest?.base?.sha;
                      const headSha = pullRequest?.head?.sha;
                      const headFullName = pullRequest?.head?.repo?.full_name;
                      const baseFullName = context.payload.repository?.full_name;
                      const repositoryName = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
                      if (
                        typeof baseSha !== "string" ||
                        !/^[0-9a-f]{40}$/i.test(baseSha) ||
                        typeof headSha !== "string" ||
                        !/^[0-9a-f]{40}$/i.test(headSha) ||
                        typeof baseFullName !== "string" ||
                        !repositoryName.test(baseFullName) ||
                        typeof headFullName !== "string" ||
                        !repositoryName.test(headFullName)
                      ) {
                        throw new Error("pull request base or head repository identity was incomplete");
                      }
                      const [baseOwner, baseRepo] = baseFullName.split("/");
                      const [headOwner, headRepo] = headFullName.split("/");
                      const [baseContent, headContent] = await Promise.all([
                        readAuthorityContent(baseOwner, baseRepo, baseSha),
                        readAuthorityContent(headOwner, headRepo, headSha),
                      ]);
                      const baseValues = parseAuthority(baseContent, "base");
                      const headValues = parseAuthority(headContent, "head");
                      return [...knownWorkflowToolKeys].some(
                        (key) => key.startsWith("VELERO_") && baseValues.get(key) !== headValues.get(key)
                      );
                    } catch (error) {
                      core.warning(
                        `Workflow tool authority comparison was incomplete; running full-stack smoke: ${error.message}`
                      );
                      return true;
                    }
                  };
                  const runtimeFiles = new Set([
                    ".dockerignore",
                    ".github/workflows/publish-pr-runtime-images.yml",
                    ".github/workflows/runtime-images.yml",
                    ".github/workflows/smoke-full.yml",
                    ".github/workflows/smoke.yml",
                    ".github/actions/load-workflow-tool-versions/action.yml",
                    ".python-version",
                    "build.gradle.kts",
                    "config/python/smoke-requirements.txt",
                    "config/python/smoke-requirements.in",
                    "dev-tools/build-compose-service-jars.sh",
                    "dev-tools/build-local-smoke-images.sh",
                    "dev-tools/backups/verify-backups.sh",
                    "dev-tools/backups/pg-dump-s3-selection.shlib",
                    "dev-tools/backups/smoke-backup-verifier-image.sh",
                    "dev-tools/certs/generate-dev-certs.sh",
                    "dev-tools/verify-compose-health.sh",
                    "dev-tools/verify-fresh-bootstrap.sh",
                    "dev-tools/verify-restart-state.sh",
                    "dev-tools/verify-smoke-images.sh",
                    "gradle.properties",
                    "docker/backup-verifier.Dockerfile",
                    "gradlew",
                    "gradlew.bat",
                    "settings.gradle.kts",
                  ]);
                  const controllerPrefixes = [
                    "buildSrc/",
                    "gradle/",
                    "services/hosted-environment-identity-controller/",
                  ];
                  const controllerFiles = new Set([
                    ".dockerignore",
                    ".github/workflows/runtime-images.yml",
                    "build.gradle.kts",
                    "dev-tools/hosted/controller/smoke-paused-controller-image.sh",
                    "docker/base.Dockerfile",
                    "gradle.properties",
                    "gradlew",
                    "gradlew.bat",
                    "settings.gradle.kts",
                  ]);
                  const authorityChanged = paths.includes(workflowToolAuthorityPath);
                  const nonAuthorityPaths = paths.filter(
                    (path) => path !== workflowToolAuthorityPath
                  );
                  runtimeSmokeRequired = nonAuthorityPaths.some(
                    (path) =>
                      runtimeFiles.has(path) ||
                      runtimePrefixes.some((prefix) => path.startsWith(prefix)) ||
                      (path.startsWith("services/") &&
                        !path.startsWith(
                          "services/hosted-environment-identity-controller/"
                        ))
                  );
                  if (!runtimeSmokeRequired && authorityChanged) {
                    runtimeSmokeRequired = await veleroAuthorityChanged();
                  }
                  controllerSmokeRequired = paths.some(
                    (path) =>
                      controllerFiles.has(path) ||
                      controllerPrefixes.some((prefix) => path.startsWith(prefix))
                  );
                }
              } catch (error) {
                core.warning(
                  `PR smoke scope detection failed; running both local smokes: ${error.message}`
                );
              }
            }
            core.setOutput("runtime_smoke_required", String(runtimeSmokeRequired));
            core.setOutput("controller_smoke_required", String(controllerSmokeRequired));

  build-base-image:
    name: Build Runtime Base Image
    needs: [image-meta]
    if: ${{ github.event_name != 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.select_base_image_digest.outputs.digest }}
    permissions:
      # This job publishes the shared runtime base image to GHCR.
      contents: read
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime base image
        id: build_base_image_first
        continue-on-error: true
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./docker/base.Dockerfile
          push: true
          tags: ${{ needs.image-meta.outputs.base_image }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache
            type=registry,ref=ghcr.io/benhook1013/firemud-base:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache,mode=max
            type=gha,mode=max

      - name: Retry build and push runtime base image
        id: build_base_image_retry
        if: ${{ steps.build_base_image_first.outcome == 'failure' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./docker/base.Dockerfile
          push: true
          tags: ${{ needs.image-meta.outputs.base_image }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache
            type=registry,ref=ghcr.io/benhook1013/firemud-base:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache,mode=max
            type=gha,mode=max

      - name: Select exact published runtime base digest
        id: select_base_image_digest
        if: ${{ !cancelled() }}
        env:
          FIRST_OUTCOME: ${{ steps.build_base_image_first.outcome }}
          FIRST_DIGEST: ${{ steps.build_base_image_first.outputs.digest }}
          RETRY_OUTCOME: ${{ steps.build_base_image_retry.outcome }}
          RETRY_DIGEST: ${{ steps.build_base_image_retry.outputs.digest }}
        run: |
          set -euo pipefail
          published_digests=()
          if [[ "$FIRST_OUTCOME" == "success" ]]; then
            published_digests+=("$FIRST_DIGEST")
          fi
          if [[ "$RETRY_OUTCOME" == "success" ]]; then
            published_digests+=("$RETRY_DIGEST")
          fi
          if ((${#published_digests[@]} != 1)); then
            echo "Expected exactly one successful runtime base-image publication digest." >&2
            exit 1
          fi
          base_image_digest="${published_digests[0]}"
          [[ "$base_image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Runtime base-image publisher returned an invalid sha256 digest." >&2
            exit 1
          }
          echo "digest=$base_image_digest" >> "$GITHUB_OUTPUT"

  build-runtime-images:
    name: Build Runtime Images (${{ matrix.service }})
    needs: [image-meta, build-base-image]
    if: ${{ github.event_name != 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    runs-on: ubuntu-latest
    permissions:
      # This job publishes service runtime images to GHCR.
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - automation-scripting-service
          - entity-management-service
          - game-design-service
          - game-logic-service
          - game-session-service
          - logging-admin-service
          - social-groups-service
          - spring-cloud-gateway
          - tcp-proxy-service
          - world-management-service
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Build service JAR
        run: ./gradlew :${{ matrix.service }}:bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime service image
        id: build_runtime_image_first
        continue-on-error: true
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ./services/${{ matrix.service }}/build/libs
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          build-contexts: |
            repo_root=.
          build-args: |
            BASE_IMAGE=${{ needs.image-meta.outputs.base_image }}
          tags: ghcr.io/benhook1013/${{ matrix.service }}:${{ needs.image-meta.outputs.image_tag }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache,mode=max
            type=gha,mode=max

      - name: Retry build and push runtime service image
        if: ${{ steps.build_runtime_image_first.outcome == 'failure' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ./services/${{ matrix.service }}/build/libs
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          build-contexts: |
            repo_root=.
          build-args: |
            BASE_IMAGE=${{ needs.image-meta.outputs.base_image }}
          tags: ghcr.io/benhook1013/${{ matrix.service }}:${{ needs.image-meta.outputs.image_tag }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache,mode=max
            type=gha,mode=max

  build-backup-verifier:
    name: Build Backup Verifier Image
    needs: [image-meta]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && needs.image-meta.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_id: ${{ steps.smoke.outputs.image_id }}
    permissions:
      contents: read
    env:
      BACKUP_VERIFIER_IMAGE: ghcr.io/benhook1013/backup-verifier:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout trusted branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: Build backup verifier image
        run: |
          docker build \
            --file docker/backup-verifier.Dockerfile \
            --tag "$BACKUP_VERIFIER_IMAGE" \
            .

      - name: Smoke backup verifier image
        id: smoke
        env:
          VELERO_VERSION: ${{ steps.workflow-tool-versions.outputs.velero-version }}
        run: |
          set -euo pipefail
          bash ./dev-tools/backups/smoke-backup-verifier-image.sh "$BACKUP_VERIFIER_IMAGE" "$VELERO_VERSION"
          image_id="$(docker image inspect --format '{{.Id}}' "$BACKUP_VERIFIER_IMAGE")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Backup verifier image did not return an exact image ID." >&2
            exit 1
          }
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Export exact verified backup verifier image artifact
        env:
          VERIFIED_IMAGE_ID: ${{ steps.smoke.outputs.image_id }}
        run: |
          set -euo pipefail
          current_image_id="$(docker image inspect --format '{{.Id}}' "$BACKUP_VERIFIER_IMAGE")"
          [[ "$current_image_id" == "$VERIFIED_IMAGE_ID" ]] || {
            echo "Backup verifier image changed after its smoke proof; refusing artifact export." >&2
            exit 1
          }
          docker save "$BACKUP_VERIFIER_IMAGE" | gzip -1 > "$RUNNER_TEMP/backup-verifier.tar.gz"

      - name: Upload exact verified backup verifier image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backup-verifier-${{ needs.image-meta.outputs.image_tag }}
          path: ${{ runner.temp }}/backup-verifier.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-backup-verifier:
    name: Publish Trusted Backup Verifier Image
    needs: [image-meta, build-backup-verifier]
    if: ${{ always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && needs.image-meta.result == 'success' && needs.build-backup-verifier.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      BACKUP_VERIFIER_IMAGE_NAME: ghcr.io/benhook1013/backup-verifier
      BACKUP_VERIFIER_IMAGE: ghcr.io/benhook1013/backup-verifier:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout trusted publication commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Download exact verified backup verifier image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backup-verifier-${{ needs.image-meta.outputs.image_tag }}
          path: ${{ runner.temp }}/backup-verifier-artifact

      - name: Load and verify exact backup verifier image
        env:
          BACKUP_VERIFIER_ARCHIVE: ${{ runner.temp }}/backup-verifier-artifact/backup-verifier.tar.gz
          VERIFIED_IMAGE_ID: ${{ needs.build-backup-verifier.outputs.image_id }}
        run: |
          set -euo pipefail
          [[ -f "$BACKUP_VERIFIER_ARCHIVE" ]] || {
            echo "Verified backup verifier image artifact is missing." >&2
            exit 1
          }
          gzip -dc "$BACKUP_VERIFIER_ARCHIVE" | docker load
          loaded_image_id="$(docker image inspect --format '{{.Id}}' "$BACKUP_VERIFIER_IMAGE")"
          [[ "$loaded_image_id" == "$VERIFIED_IMAGE_ID" ]] || {
            echo "Loaded backup verifier image does not match the exact verified build image." >&2
            exit 1
          }

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact verified backup verifier image
        id: publish
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/shared/push-verified-image.sh "$BACKUP_VERIFIER_IMAGE"

      - name: Attest trusted backup verifier image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.BACKUP_VERIFIER_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  build-hosted-identity-controller:
    name: Build Trusted Hosted Identity Controller
    needs: [image-meta, build-base-image]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && needs.image-meta.result == 'success' && needs.build-base-image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image_id: ${{ steps.smoke.outputs.image_id }}
    permissions:
      contents: read
      packages: read
    env:
      CONTROLLER_IMAGE_NAME: ghcr.io/benhook1013/firemud-hosted-identity-controller
      CONTROLLER_IMAGE: ghcr.io/benhook1013/firemud-hosted-identity-controller:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout trusted branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build controller JAR and image locally
        run: |
          set -euo pipefail
          ./gradlew :hosted-environment-identity-controller:bootJar
          docker build \
            --file services/hosted-environment-identity-controller/Dockerfile \
            --build-arg BASE_IMAGE="ghcr.io/benhook1013/firemud-base@${{ needs.build-base-image.outputs.digest }}" \
            --tag "$CONTROLLER_IMAGE" \
            services/hosted-environment-identity-controller/build/libs

      - name: Smoke exact controller image
        id: smoke
        run: |
          set -euo pipefail
          smoked_image_id="$(bash ./dev-tools/hosted/controller/smoke-paused-controller-image.sh "$CONTROLLER_IMAGE")"
          local_image_id="$(docker image inspect --format '{{.Id}}' "$CONTROLLER_IMAGE")"
          [[ "$smoked_image_id" == "$local_image_id" ]] || {
            echo "Controller smoke did not execute the exact locally tagged image." >&2
            exit 1
          }
          echo "image_id=$local_image_id" >> "$GITHUB_OUTPUT"

      - name: Export exact verified controller image artifact
        env:
          VERIFIED_IMAGE_ID: ${{ steps.smoke.outputs.image_id }}
        run: |
          set -euo pipefail
          current_image_id="$(docker image inspect --format '{{.Id}}' "$CONTROLLER_IMAGE")"
          [[ "$current_image_id" == "$VERIFIED_IMAGE_ID" ]] || {
            echo "Controller image changed after its smoke proof; refusing artifact export." >&2
            exit 1
          }
          docker save "$CONTROLLER_IMAGE" | gzip -1 > "$RUNNER_TEMP/hosted-identity-controller.tar.gz"

      - name: Upload exact verified controller image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hosted-identity-controller-${{ needs.image-meta.outputs.image_tag }}
          path: ${{ runner.temp }}/hosted-identity-controller.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-hosted-identity-controller:
    name: Publish Trusted Hosted Identity Controller
    needs: [image-meta, build-base-image, build-hosted-identity-controller]
    if: ${{ always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && needs.image-meta.result == 'success' && needs.build-base-image.result == 'success' && needs.build-hosted-identity-controller.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      CONTROLLER_IMAGE_NAME: ghcr.io/benhook1013/firemud-hosted-identity-controller
      CONTROLLER_IMAGE: ghcr.io/benhook1013/firemud-hosted-identity-controller:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout trusted publication commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Download exact verified controller image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hosted-identity-controller-${{ needs.image-meta.outputs.image_tag }}
          path: ${{ runner.temp }}/hosted-identity-controller-artifact

      - name: Load and verify exact controller image
        env:
          CONTROLLER_ARCHIVE: ${{ runner.temp }}/hosted-identity-controller-artifact/hosted-identity-controller.tar.gz
          VERIFIED_IMAGE_ID: ${{ needs.build-hosted-identity-controller.outputs.image_id }}
        run: |
          set -euo pipefail
          [[ -f "$CONTROLLER_ARCHIVE" ]] || {
            echo "Verified hosted identity controller image artifact is missing." >&2
            exit 1
          }
          gzip -dc "$CONTROLLER_ARCHIVE" | docker load
          loaded_image_id="$(docker image inspect --format '{{.Id}}' "$CONTROLLER_IMAGE")"
          [[ "$loaded_image_id" == "$VERIFIED_IMAGE_ID" ]] || {
            echo "Loaded controller image does not match the exact verified build image." >&2
            exit 1
          }

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact verified controller image
        id: publish
        env:
          VERIFIED_IMAGE_ID: ${{ needs.build-hosted-identity-controller.outputs.image_id }}
        run: |
          set -euo pipefail
          current_image_id="$(docker image inspect --format '{{.Id}}' "$CONTROLLER_IMAGE")"
          [[ "$current_image_id" == "$VERIFIED_IMAGE_ID" ]] || {
            echo "Controller image changed after its verification proof; refusing publication." >&2
            exit 1
          }
          bash ./dev-tools/hosted/shared/push-verified-image.sh "$CONTROLLER_IMAGE"

      - name: Attest trusted controller image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CONTROLLER_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  pr-local-smoke:
    name: PR Full-Stack Smoke
    needs: [image-meta]
    if: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # PR-controlled source receives no registry or repository write credential.
      contents: read
    env:
      COMPOSE_PROJECT_NAME: smoke-full-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_TIMEOUT_SECONDS: 20
      SMOKE_IMAGE_TAG: ${{ needs.image-meta.outputs.image_tag }}
      SMOKE_IMAGE_LOCAL_ONLY: 'true'
      BACKUP_VERIFIER_IMAGE: ghcr.io/benhook1013/backup-verifier:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout PR merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: Set up canonical Python
        if: ${{ needs.image-meta.outputs.runtime_smoke_required == 'true' }}
        uses: ./.github/actions/setup-python
        with:
          requirements: smoke

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: true

      - name: Build local PR runtime images
        run: bash ./dev-tools/build-local-smoke-images.sh "${SMOKE_IMAGE_TAG}"

      - name: Build PR backup verifier image
        run: |
          docker build \
            --file docker/backup-verifier.Dockerfile \
            --tag "$BACKUP_VERIFIER_IMAGE" \
            .

      - name: Smoke PR backup verifier image
        env:
          VELERO_VERSION: ${{ steps.workflow-tool-versions.outputs.velero-version }}
        run: bash ./dev-tools/backups/smoke-backup-verifier-image.sh "$BACKUP_VERIFIER_IMAGE" "$VELERO_VERSION"

      - name: Run credential-free full-stack smoke
        if: ${{ needs.image-meta.outputs.runtime_smoke_required == 'true' }}
        run: bash ./dev-tools/verify-smoke-images.sh

      - name: Export fixed-tag preview image artifact
        run: |
          service_manifest=/tmp/pr-runtime-services.txt
          : > "$service_manifest"
          images=()
          for service in \
            account-service \
            automation-scripting-service \
            entity-management-service \
            game-design-service \
            game-logic-service \
            game-session-service \
            logging-admin-service \
            social-groups-service \
            spring-cloud-gateway \
            tcp-proxy-service \
            world-management-service; do
            printf '%s\n' "$service" >> "$service_manifest"
            images+=("ghcr.io/benhook1013/${service}:${SMOKE_IMAGE_TAG}")
          done
          printf '%s\n' 'backup-verifier' >> "$service_manifest"
          images+=("$BACKUP_VERIFIER_IMAGE")
          docker save "${images[@]}" | gzip -1 > /tmp/pr-runtime-images.tar.gz

      - name: Upload preview image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-runtime-images-${{ needs.image-meta.outputs.image_tag }}
          path: |
            /tmp/pr-runtime-images.tar.gz
            /tmp/pr-runtime-services.txt
          if-no-files-found: error
          retention-days: 1

      - name: Summarize secure PR runtime artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ needs.image-meta.outputs.head_sha }}
          MERGE_SHA: ${{ github.sha }}
          ARTIFACT_NAME: pr-runtime-images-${{ needs.image-meta.outputs.image_tag }}
        run: |
          {
            echo "### PR runtime images and applicable full-stack smoke"
            echo
            echo "- Pull request: #${PR_NUMBER}"
            echo "- Base SHA: \`${BASE_SHA}\`"
            echo "- PR head SHA and fixed publication tag: \`${HEAD_SHA}\`"
            echo "- Built PR merge SHA (full-stack smoke runs when required): \`${MERGE_SHA}\`"
            echo "- Artifact: \`${ARTIFACT_NAME}\`"
            echo
            echo "This read-only PR workflow built the PR merge commit and runs full-stack smoke when required by change scope. The trusted default-branch publisher uploads the preview service images in that successful artifact under the fixed PR head-SHA tag used by preview deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump Docker Compose logs on failure
        if: ${{ failure() && needs.image-meta.outputs.runtime_smoke_required == 'true' }}
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.override.yml \
            -f docker/docker-compose.smoke-images.override.yml \
            logs || true

      - name: Stop smoke stack
        if: ${{ always() && needs.image-meta.outputs.runtime_smoke_required == 'true' }}
        run: |
          source ./dev-tools/smoke/run-owned-compose.sh
          if ! stop_run_owned_compose_project \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.override.yml \
            -f docker/docker-compose.smoke-images.override.yml; then
            echo "Unable to prove or release the smoke Compose project; refusing unowned teardown." >&2
            exit 1
          fi

  pr-controller-smoke:
    name: PR Hosted Identity Controller Smoke
    needs: [image-meta]
    if: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null) && needs.image-meta.outputs.controller_smoke_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # PR-controlled source receives no registry or repository write credential.
      contents: read
    env:
      BASE_IMAGE: ${{ needs.image-meta.outputs.base_image }}
      CONTROLLER_IMAGE: firemud-hosted-identity-controller-local:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout PR merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Build exact local runtime base image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: docker/base.Dockerfile
          push: false
          load: true
          tags: ${{ env.BASE_IMAGE }}
          cache-from: type=gha,scope=pr-controller-smoke
          cache-to: type=gha,mode=max,scope=pr-controller-smoke

      - name: Build controller image for credential-free local validation
        run: |
          set -euo pipefail
          ./gradlew :hosted-environment-identity-controller:bootJar
          docker build \
            --file services/hosted-environment-identity-controller/Dockerfile \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --tag "$CONTROLLER_IMAGE" \
            services/hosted-environment-identity-controller/build/libs

      - name: Smoke controller image entrypoint and paused health
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/controller/smoke-paused-controller-image.sh "$CONTROLLER_IMAGE" >/dev/null

  smoke-full:
    name: Published Runtime Full-Stack Smoke
    needs: [image-meta, build-runtime-images]
    if: ${{ always() && github.event_name != 'pull_request' && needs.build-runtime-images.result == 'success' }}
    permissions:
      # The trusted branch smoke workflow only pulls fixed GHCR images.
      contents: read
      packages: read
    uses: ./.github/workflows/smoke-full.yml
    with:
      action: full
      head_sha: ${{ needs.image-meta.outputs.head_sha }}
      checkout_ref: ${{ needs.image-meta.outputs.checkout_ref }}
      image_tag: ${{ needs.image-meta.outputs.image_tag }}
    secrets: inherit
