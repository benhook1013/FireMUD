name: Build Runtime Images

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'protos/**'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/runtime-images.yml'
      - '.github/workflows/publish-pr-runtime-images.yml'
      - '.github/workflows/smoke.yml'
      - '.github/workflows/smoke-full.yml'
      - 'services/**'
      - '.github/actions/load-workflow-tool-versions/**'
      - '.github/actions/setup-python/**'
      - '.python-version'
      - 'config/workflow-tool-versions.env'
      - 'config/python/smoke-requirements.txt'
      - 'config/python/smoke-requirements.in'
      - 'dev-tools/build-compose-service-jars.sh'
      - 'dev-tools/build-local-smoke-images.sh'
      - 'dev-tools/backups/verify-backups.sh'
      - 'dev-tools/backups/pg-dump-s3-selection.shlib'
      - 'dev-tools/backups/smoke-backup-verifier-image.sh'
      - 'docker/backup-verifier.Dockerfile'
      - 'dev-tools/certs/generate-dev-certs.sh'
      - 'dev-tools/hosted/controller/smoke-paused-controller-image.sh'
      - 'dev-tools/smoke/**'
      - 'dev-tools/verify-compose-health.sh'
      - 'dev-tools/verify-fresh-bootstrap.sh'
      - 'dev-tools/verify-restart-state.sh'
      - 'dev-tools/verify-smoke-images.sh'
  workflow_run:
    workflows: ["CI — Validation"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:

run-name: Build Runtime Images ${{ github.event_name == 'pull_request' && format('secure-pr-artifact pr-{0} base-{1} head-{2} merge-{3} mode-{4}', github.event.pull_request.number, github.event.pull_request.base.sha, github.event.pull_request.head.sha, github.sha, github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required') || github.event_name == 'workflow_run' && format('trusted-branch branch-{0} sha-{1}', github.event.workflow_run.head_branch, github.event.workflow_run.head_sha) || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: runtime-images-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_run' && format('branch-{0}', github.event.workflow_run.head_branch) || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref == null && 'metadata' || 'required' }}
  cancel-in-progress: true

jobs:
  image-meta:
    name: Derive Runtime Image Metadata
    if: ${{ (github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref != null)) || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'develop')) }}
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.meta.outputs.head_sha }}
      head_branch: ${{ steps.meta.outputs.head_branch }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      candidate_tag: ${{ steps.meta.outputs.candidate_tag }}
      base_image: ${{ steps.meta.outputs.base_image }}
      runtime_smoke_required: ${{ steps.smoke_scope.outputs.runtime_smoke_required }}
      controller_smoke_required: ${{ steps.smoke_scope.outputs.controller_smoke_required }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Check out trusted workflow helpers
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up canonical GitHub CLI
        if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/setup-gh

      - name: Derive image tags
        id: meta
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="$EVENT_HEAD_SHA"
            HEAD_BRANCH=""
            CHECKOUT_REF="${GITHUB_SHA}"
            [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "PR merge SHA is not a lowercase 40-character commit SHA." >&2
              exit 1
            }
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            [[ "${{ github.event.workflow_run.event }}" == "push" ]] || {
              echo "Runtime branch publication requires a CI push workflow run." >&2
              exit 1
            }
            [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || {
              echo "Runtime branch publication requires a successful CI workflow run." >&2
              exit 1
            }
            HEAD_SHA="${EVENT_HEAD_SHA:-${{ github.event.workflow_run.head_sha }}}"
            HEAD_BRANCH="$EVENT_HEAD_BRANCH"
            CHECKOUT_REF="$HEAD_SHA"
          else
            HEAD_SHA="${GITHUB_SHA}"
            CHECKOUT_REF="${GITHUB_SHA}"
            HEAD_BRANCH="${GITHUB_REF_NAME}"
          fi

          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Runtime publication head SHA is not a lowercase 40-character commit SHA." >&2
            exit 1
          }
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            [[ "$HEAD_BRANCH" == main || "$HEAD_BRANCH" == develop ]] || {
              echo "Runtime branch publication is restricted to main or develop." >&2
              exit 1
            }
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="pr-merge-${GITHUB_SHA}"
          else
            IMAGE_TAG="${HEAD_SHA}"
          fi
          CANDIDATE_TAG="candidate-${HEAD_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_IMAGE="ghcr.io/benhook1013/firemud-base:${GITHUB_SHA}"
          else
            BASE_IMAGE="ghcr.io/benhook1013/firemud-base:${CANDIDATE_TAG}"
          fi

          {
            echo "head_sha=${HEAD_SHA}"
            echo "head_branch=${HEAD_BRANCH}"
            echo "checkout_ref=${CHECKOUT_REF}"
            echo "image_tag=${IMAGE_TAG}"
            echo "candidate_tag=${CANDIDATE_TAG}"
            echo "base_image=${BASE_IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify successful CI push for manual publication
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.meta.outputs.head_sha }}
          EXPECTED_BRANCH: ${{ steps.meta.outputs.head_branch }}
        run: |
          set -euo pipefail
          ci_runs="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&head_sha=${EXPECTED_SHA}&per_page=100")"
          jq -e \
            --arg expected_sha "$EXPECTED_SHA" \
            --arg expected_branch "$EXPECTED_BRANCH" \
            '[.[].workflow_runs[]?] | any(.[]; .head_sha == $expected_sha and .head_branch == $expected_branch and .event == "push" and .status == "completed" and .conclusion == "success")' \
            <<<"$ci_runs" >/dev/null || {
              echo "No successful CI push run exists for manual runtime publication ${EXPECTED_BRANCH}@${EXPECTED_SHA}." >&2
              exit 1
            }

      - name: Detect PR smoke scopes
        id: smoke_scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            let runtimeSmokeRequired = true;
            let controllerSmokeRequired = true;
            if (context.eventName === "pull_request") {
              try {
                const changedFiles = await github.paginate(
                  github.rest.pulls.listFiles,
                  {
                    ...context.repo,
                    pull_number: context.payload.pull_request.number,
                    per_page: 100,
                  },
                  (response) => response.data
                );
                const expectedFileCount = context.payload.pull_request.changed_files;
                if (!Number.isInteger(expectedFileCount) || changedFiles.length !== expectedFileCount) {
                  core.warning("PR smoke scope detection was incomplete; running both local smokes.");
                } else {
                  const paths = changedFiles.flatMap((file) =>
                    [file.filename, file.previous_filename].filter(Boolean)
                  );
                  const runtimePrefixes = [
                    "buildSrc/",
                    "docker/",
                    "dev-tools/smoke/",
                    "gradle/",
                    "protos/",
                    ".github/actions/setup-python/",
                  ];
                  const workflowToolAuthorityPath = "config/workflow-tool-versions.env";
                  const runtimeFiles = new Set([
                    ".dockerignore",
                    ".github/workflows/publish-pr-runtime-images.yml",
                    ".github/workflows/runtime-images.yml",
                    ".github/workflows/smoke-full.yml",
                    ".github/workflows/smoke.yml",
                    ".github/actions/load-workflow-tool-versions/action.yml",
                    ".python-version",
                    "build.gradle.kts",
                    "config/python/smoke-requirements.txt",
                    "config/python/smoke-requirements.in",
                    "dev-tools/build-compose-service-jars.sh",
                    "dev-tools/build-local-smoke-images.sh",
                    "dev-tools/backups/verify-backups.sh",
                    "dev-tools/backups/pg-dump-s3-selection.shlib",
                    "dev-tools/backups/smoke-backup-verifier-image.sh",
                    "dev-tools/certs/generate-dev-certs.sh",
                    "dev-tools/verify-compose-health.sh",
                    "dev-tools/verify-fresh-bootstrap.sh",
                    "dev-tools/verify-restart-state.sh",
                    "dev-tools/verify-smoke-images.sh",
                    "gradle.properties",
                    "docker/backup-verifier.Dockerfile",
                    "gradlew",
                    "gradlew.bat",
                    "settings.gradle.kts",
                  ]);
                  const controllerPrefixes = [
                    "buildSrc/",
                    "gradle/",
                    "services/hosted-environment-identity-controller/",
                  ];
                  const controllerFiles = new Set([
                    ".dockerignore",
                    ".github/workflows/runtime-images.yml",
                    "build.gradle.kts",
                    "dev-tools/hosted/controller/smoke-paused-controller-image.sh",
                    "docker/base.Dockerfile",
                    "gradle.properties",
                    "gradlew",
                    "gradlew.bat",
                    "settings.gradle.kts",
                  ]);
                  const authorityChanged = paths.includes(workflowToolAuthorityPath);
                  const nonAuthorityPaths = paths.filter(
                    (path) => path !== workflowToolAuthorityPath
                  );
                  runtimeSmokeRequired = nonAuthorityPaths.some(
                    (path) =>
                      runtimeFiles.has(path) ||
                      runtimePrefixes.some((prefix) => path.startsWith(prefix)) ||
                      (path.startsWith("services/") &&
                        !path.startsWith(
                          "services/hosted-environment-identity-controller/"
                        ))
                  );
                  runtimeSmokeRequired = runtimeSmokeRequired || authorityChanged;
                  controllerSmokeRequired = paths.some(
                    (path) =>
                      controllerFiles.has(path) ||
                      controllerPrefixes.some((prefix) => path.startsWith(prefix))
                  );
                }
              } catch (error) {
                core.warning(
                  `PR smoke scope detection failed; running both local smokes: ${error.message}`
                );
              }
            }
            core.setOutput("runtime_smoke_required", String(runtimeSmokeRequired));
            core.setOutput("controller_smoke_required", String(controllerSmokeRequired));

  build-base-image:
    name: Build Runtime Base Image
    needs: [image-meta]
    if: ${{ github.event_name != 'pull_request' && needs.image-meta.result == 'success' && (needs.image-meta.outputs.head_branch == 'main' || needs.image-meta.outputs.head_branch == 'develop') }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.select_base_image_digest.outputs.digest }}
    permissions:
      # This job publishes the shared runtime base image to GHCR.
      contents: read
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime base image
        id: build_base_image_first
        continue-on-error: true
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./docker/base.Dockerfile
          push: true
          tags: ${{ needs.image-meta.outputs.base_image }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache
            type=registry,ref=ghcr.io/benhook1013/firemud-base:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache,mode=max
            type=gha,mode=max

      - name: Retry build and push runtime base image
        id: build_base_image_retry
        if: ${{ steps.build_base_image_first.outcome == 'failure' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./docker/base.Dockerfile
          push: true
          tags: ${{ needs.image-meta.outputs.base_image }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache
            type=registry,ref=ghcr.io/benhook1013/firemud-base:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/firemud-base:buildcache,mode=max
            type=gha,mode=max

      - name: Select exact published runtime base digest
        id: select_base_image_digest
        if: ${{ !cancelled() }}
        env:
          FIRST_OUTCOME: ${{ steps.build_base_image_first.outcome }}
          FIRST_DIGEST: ${{ steps.build_base_image_first.outputs.digest }}
          RETRY_OUTCOME: ${{ steps.build_base_image_retry.outcome }}
          RETRY_DIGEST: ${{ steps.build_base_image_retry.outputs.digest }}
        run: |
          set -euo pipefail
          published_digests=()
          if [[ "$FIRST_OUTCOME" == "success" ]]; then
            published_digests+=("$FIRST_DIGEST")
          fi
          if [[ "$RETRY_OUTCOME" == "success" ]]; then
            published_digests+=("$RETRY_DIGEST")
          fi
          if ((${#published_digests[@]} != 1)); then
            echo "Expected exactly one successful runtime base-image publication digest." >&2
            exit 1
          fi
          base_image_digest="${published_digests[0]}"
          [[ "$base_image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Runtime base-image publisher returned an invalid sha256 digest." >&2
            exit 1
          }
          echo "digest=$base_image_digest" >> "$GITHUB_OUTPUT"

  build-runtime-images:
    name: Build Runtime Images (${{ matrix.service }})
    needs: [image-meta, build-base-image]
    if: ${{ github.event_name != 'pull_request' && needs.image-meta.result == 'success' && (needs.image-meta.outputs.head_branch == 'main' || needs.image-meta.outputs.head_branch == 'develop') }}
    runs-on: ubuntu-latest
    permissions:
      # This job publishes only unique staging service tags. Canonical aliases
      # are written by publish-runtime-images after the exact candidate passes smoke.
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - automation-scripting-service
          - entity-management-service
          - game-design-service
          - game-logic-service
          - game-session-service
          - logging-admin-service
          - social-groups-service
          - spring-cloud-gateway
          - tcp-proxy-service
          - world-management-service
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: ⬇️ Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: ⚙️ Set Up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: ⚙️ Set Up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Build service JAR
        run: ./gradlew :${{ matrix.service }}:bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime service image
        id: build_runtime_image_first
        continue-on-error: true
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ./services/${{ matrix.service }}/build/libs
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          build-contexts: |
            repo_root=.
          build-args: |
            BASE_IMAGE=ghcr.io/benhook1013/firemud-base@${{ needs.build-base-image.outputs.digest }}
          tags: ghcr.io/benhook1013/${{ matrix.service }}:${{ needs.image-meta.outputs.candidate_tag }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache,mode=max
            type=gha,mode=max

      - name: Retry build and push runtime service image
        if: ${{ steps.build_runtime_image_first.outcome == 'failure' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ./services/${{ matrix.service }}/build/libs
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          build-contexts: |
            repo_root=.
          build-args: |
            BASE_IMAGE=ghcr.io/benhook1013/firemud-base@${{ needs.build-base-image.outputs.digest }}
          tags: ghcr.io/benhook1013/${{ matrix.service }}:${{ needs.image-meta.outputs.candidate_tag }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache,mode=max
            type=gha,mode=max

  build-backup-verifier:
    name: Build Backup Verifier Image
    needs: [image-meta]
    if: ${{ github.event_name != 'pull_request' && needs.image-meta.result == 'success' && (needs.image-meta.outputs.head_branch == 'develop' || needs.image-meta.outputs.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_id: ${{ steps.smoke.outputs.image_id }}
    permissions:
      contents: read
    env:
      BACKUP_VERIFIER_IMAGE: ghcr.io/benhook1013/backup-verifier:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout trusted branch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Load workflow tool versions
        id: workflow-tool-versions
        uses: ./.github/actions/load-workflow-tool-versions

      - name: Build backup verifier image
        run: |
          docker build \
            --file docker/backup-verifier.Dockerfile \
            --tag "$BACKUP_VERIFIER_IMAGE" \
            .

      - name: Smoke backup verifier image
        id: smoke
        env:
          VELERO_VERSION: ${{ steps.workflow-tool-versions.outputs.velero-version }}
        run: |
          set -euo pipefail
          bash ./dev-tools/backups/smoke-backup-verifier-image.sh "$BACKUP_VERIFIER_IMAGE" "$VELERO_VERSION"
          image_id="$(docker image inspect --format '{{.Id}}' "$BACKUP_VERIFIER_IMAGE")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Backup verifier image did not return an exact image ID." >&2
            exit 1
          }
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Export exact verified backup verifier image artifact
        env:
          VERIFIED_IMAGE_ID: ${{ steps.smoke.outputs.image_id }}
        run: |
          set -euo pipefail
          current_image_id="$(docker image inspect --format '{{.Id}}' "$BACKUP_VERIFIER_IMAGE")"
          [[ "$current_image_id" == "$VERIFIED_IMAGE_ID" ]] || {
            echo "Backup verifier image changed after its smoke proof; refusing artifact export." >&2
            exit 1
          }
          docker save "$BACKUP_VERIFIER_IMAGE" | gzip -1 > "$RUNNER_TEMP/backup-verifier.tar.gz"

      - name: Upload exact verified backup verifier image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backup-verifier-${{ needs.image-meta.outputs.image_tag }}
          path: ${{ runner.temp }}/backup-verifier.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-backup-verifier:
    name: Publish Trusted Backup Verifier Image
    needs: [image-meta, build-backup-verifier]
    if: ${{ always() && github.event_name != 'pull_request' && (needs.image-meta.outputs.head_branch == 'develop' || needs.image-meta.outputs.head_branch == 'main') && needs.image-meta.result == 'success' && needs.build-backup-verifier.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      BACKUP_VERIFIER_IMAGE_NAME: ghcr.io/benhook1013/backup-verifier
      BACKUP_VERIFIER_IMAGE: ghcr.io/benhook1013/backup-verifier:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout trusted publication commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Download exact verified backup verifier image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backup-verifier-${{ needs.image-meta.outputs.image_tag }}
          path: ${{ runner.temp }}/backup-verifier-artifact

      - name: Load and verify exact backup verifier image
        env:
          BACKUP_VERIFIER_ARCHIVE: ${{ runner.temp }}/backup-verifier-artifact/backup-verifier.tar.gz
          VERIFIED_IMAGE_ID: ${{ needs.build-backup-verifier.outputs.image_id }}
        run: |
          set -euo pipefail
          [[ -f "$BACKUP_VERIFIER_ARCHIVE" ]] || {
            echo "Verified backup verifier image artifact is missing." >&2
            exit 1
          }
          gzip -dc "$BACKUP_VERIFIER_ARCHIVE" | docker load
          loaded_image_id="$(docker image inspect --format '{{.Id}}' "$BACKUP_VERIFIER_IMAGE")"
          [[ "$loaded_image_id" == "$VERIFIED_IMAGE_ID" ]] || {
            echo "Loaded backup verifier image does not match the exact verified build image." >&2
            exit 1
          }

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact verified backup verifier image
        id: publish
        run: |
          set -euo pipefail
          bash ./dev-tools/hosted/shared/push-verified-image.sh "$BACKUP_VERIFIER_IMAGE"

      - name: Attest trusted backup verifier image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.BACKUP_VERIFIER_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  build-hosted-identity-controller:
    name: Build Trusted Hosted Identity Controller
    needs: [image-meta, build-base-image]
    if: ${{ github.event_name != 'pull_request' && (needs.image-meta.outputs.head_branch == 'develop' || needs.image-meta.outputs.head_branch == 'main') && needs.image-meta.result == 'success' && needs.build-base-image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image_id: ${{ steps.smoke.outputs.image_id }}
    permissions:
      contents: read
      packages: read
    env:
      CONTROLLER_IMAGE_NAME: ghcr.io/benhook1013/firemud-hosted-identity-controller
      CONTROLLER_IMAGE: ghcr.io/benhook1013/firemud-hosted-identity-controller:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit

      - name: Checkout trusted branch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.image-meta.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
          cache-read-only: false

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build controller JAR and image locally
        run: |
          set -euo pipefail
          ./gradlew :hosted-environment-identity-controller:bootJar
          docker build \
            --file services/hosted-environment-identity-controller/Dockerfile \
            --build-arg BASE_IMAGE="ghcr.io/benhook1013/firemud-base@${{ needs.build-base-image.outputs.digest }}" \
            --tag "$CONTROLLER_IMAGE" \
            services/hosted-environment-identity-controller/build/libs

      - name: Smoke exact controller image
        id: smoke
        run: |
          set -euo pipefail
          smoked_image_id="$(bash ./dev-tools/hosted/controller/smoke-paused-controller-image.sh "$CONTROLLER_IMAGE")"
          local_image_id="$(docker image inspect --format '{{.Id}}' "$CONTROLLER_IMAGE")"
          [[ "$smoked_image_id" == "$local_image_id" ]] || {
            echo "Controller smoke did not execute the exact locally tagged image." >&2
            exit 1
          }
          echo "image_id=$local_image_id" >> "$GITHUB_OUTPUT"

      - name: Export exact verified controller image artifact
        env:
          VERIFIED_IMAGE_ID: ${{ steps.smoke.outputs.image_id }}
        run: |
          set -euo pipefail
          current_image_id="$(docker image inspect --format '{{.Id}}' "$CONTROLLER_IMAGE")"
          [[ "$current_image_id" == "$VERIFIED_IMAGE_ID" ]] || {
            echo "Controller image changed after its smoke proof; refusing artifact export." >&2
            exit 1
          }
          docker save "$CONTROLLER_IMAGE" | gzip -1 > "$RUNNER_TEMP/hosted-identity-controller.tar.gz"

      - name: Upload exact verified controller image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hosted-identity-controller-${{ needs.image-meta.outputs.image_tag }}
          path: ${{ runner.temp }}/hosted-identity-controller.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-hosted-identity-controller:
    name: Publish Trusted Hosted Identity Controller
    needs: [image-meta, build-base-image, build-hosted-identity-controller]
    if: ${{ always() && github.event_name != 'pull_request' && (needs.image-meta.outputs.head_branch == 'develop' || needs.image-meta.outputs.head_branch == 'main') && needs.image-meta.result == 'success' && needs.build-base-image.result == 'success' && needs.build-hosted-identity-controller.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      CONTROLLER_IMAGE_NAME: ghcr.io/benhook1013/firemud-hosted-identity-controller
      CONTROLLER_IMAGE: ghcr.io/benhook1013/firemud-hosted-identity-controller:${{ needs.image-meta.outputs.image_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
