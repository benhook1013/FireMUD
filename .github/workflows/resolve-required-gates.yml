name: Resolve Required Gates

on:
  workflow_run:
    workflows: ['CI — Validation', Security Gate, CodeQL Analysis, License Gate, PR Smoke Gate]
    types: [completed]

run-name: Resolve Required Gates workflow-${{ github.event.workflow_run.workflow_id }} head-${{ github.event.workflow_run.head_sha }} source-${{ github.event.workflow_run.id }}

permissions:
  contents: read

concurrency:
  group: required-gate-resolution-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve deferred metadata gate
    # Admit only attributable pull-request sources through the shared resolver.
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
      actions: write # Only rerun an attributable completed deferred gate job.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Check out trusted resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up canonical GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Preflight deferred gate resolution
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/actions/preserve-required-gate/resolve-deferred-gate.sh preflight

      - name: Admit deferred gate reruns
        id: admission
        if: ${{ steps.preflight.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/actions/preserve-required-gate/resolve-deferred-gate.sh admit

      - name: Confirm admitted deferred gate jobs ${{ steps.admission.outputs.accepted_job_ids }}
        if: ${{ steps.admission.outcome == 'success' }}
        # Native first-attempt step identity preserves acknowledged IDs even
        # while the target run still exposes a stale attempt-one snapshot.
        run: ':'
