name: Build Docker Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - account-service
          - automation-scripting-service
          - entity-management-service
          - game-design-service
          - game-logic-service
          - game-session-service
          - logging-admin-service
          - social-groups-service
          - spring-cloud-gateway
          - tcp-proxy-service
          - world-management-service
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/benhook1013/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/benhook1013/${{ matrix.service }}:latest
            ghcr.io/benhook1013/${{ matrix.service }}:${{ github.ref_name }}
          cache-from: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:latest
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/benhook1013/${{ matrix.service }}:buildcache,mode=max
            type=gha,mode=max
