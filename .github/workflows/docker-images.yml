name: Build and Publish Docker Images (disabled)

# Canonical service publication lives in runtime-images.yml. This compatibility
# workflow is intentionally inert so the historical workflow name cannot
# overwrite SHA, branch, or latest service aliases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: Legacy publisher disabled
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == '__disabled__' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Canonical runtime service publication is owned by Build Runtime Images."
