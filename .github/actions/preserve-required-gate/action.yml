name: Preserve Required Gate
description: Preserve a successful required check context for metadata-only pull request edits.
inputs:
  gate-name:
    description: Required check name to preserve.
    required: true
runs:
  using: composite
  steps:
    - name: Poll prior required gate
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REQUIRED_GATE_NAME: ${{ inputs.gate-name }}
      run: |
        set -euo pipefail

        if [[ "${GITHUB_EVENT_NAME:-}" != "pull_request" ]]; then
          echo "Required-gate preservation requires pull_request context; refusing to poll." >&2
          exit 1
        fi
        for required_variable in GH_TOKEN HEAD_SHA REQUIRED_GATE_NAME GITHUB_REPOSITORY GITHUB_RUN_ID; do
          if [[ -z "${!required_variable:-}" ]]; then
            echo "Required-gate preservation is missing ${required_variable}; refusing to poll." >&2
            exit 1
          fi
        done
        if [[ -z "${HEAD_SHA//[[:space:]]/}" ]]; then
          echo "Required-gate preservation requires a nonempty pull request head SHA; refusing to poll." >&2
          exit 1
        fi

        is_retryable_gh_failure() {
          local exit_status="$1"
          local error_text="${2,,}"
          if [[ "$error_text" =~ http[[:space:]]+5[0-9]{2} ]]; then
            return 0
          fi
          if [[ "$error_text" =~ http[[:space:]]+(403|429) ]] &&
            [[ "$error_text" =~ (rate[[:space:]-]*limit|abuse) ]]; then
            return 0
          fi
          if [[ "$exit_status" -ne 0 ]] &&
            [[ "$error_text" =~ (could[[:space:]]not[[:space:]]resolve|failed[[:space:]]to[[:space:]](connect|make[[:space:]]request)|error[[:space:]]connecting|unable[[:space:]]to[[:space:]]connect|connection[[:space:]](reset|refused|timed|closed)|network[[:space:]]is[[:space:]]unreachable|timed[[:space:]]out|timeout|temporary[[:space:]]failure|tls|eof) ]]; then
            return 0
          fi
          return 1
        }

        api_error_file="$(mktemp)"
        trap 'rm -f "$api_error_file"' EXIT
        max_attempts=80
        for attempt in $(seq 1 "${max_attempts}"); do
          prior_state=""
          : >"${api_error_file}"
          set +e
          prior_state="$(gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            -f check_name="${REQUIRED_GATE_NAME}" \
            -f filter=all \
            -f per_page=100 \
            --paginate \
            --slurp \
            2>"${api_error_file}" \
            | jq -r --arg run_id "${GITHUB_RUN_ID}" '
                [.[].check_runs[]?
                  | select(
                      .app.slug == "github-actions"
                      and ((.details_url // "") | contains("/actions/runs/\($run_id)/") | not)
                    )
                ] as $candidates
                | ($candidates
                    | map(select(
                        .status == "completed"
                        and .conclusion != null
                        and .conclusion != "cancelled"
                        and .conclusion != "skipped"
                        and .conclusion != "stale"
                      ))) as $authoritative
                | ($candidates
                    | map(select(
                        .status == "queued"
                        or .status == "in_progress"
                        or .status == "requested"
                        or .status == "waiting"
                        or .status == "pending"
                      ))) as $pending
                | if ($authoritative | length) > 0 then
                    ($authoritative
                      | sort_by(.completed_at // .started_at // .created_at)
                      | last
                      | ["completed", (.conclusion // "")])
                  elif ($pending | length) > 0 then
                    ($pending
                      | sort_by(.started_at // .created_at)
                      | last
                      | ["pending", (.status // "")])
                  else
                    ["none", ""]
                  end
                | @tsv' \
              2>>"${api_error_file}")"
          api_status=$?
          set -e
          if [[ "${api_status}" -ne 0 ]]; then
            api_error="$(<"${api_error_file}")"
            if ! is_retryable_gh_failure "${api_status}" "${api_error}"; then
              echo "Permanent GitHub API/configuration failure while checking the prior ${REQUIRED_GATE_NAME}; refusing to retry." >&2
              [[ -z "${api_error}" ]] || printf '%s\n' "${api_error}" >&2
              exit 1
            fi
            echo "Retryable GitHub API failure while checking the prior ${REQUIRED_GATE_NAME}; retrying attempt ${attempt}/${max_attempts}." >&2
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "Timed out waiting for the prior ${REQUIRED_GATE_NAME} on unchanged head ${HEAD_SHA}." >&2
              exit 1
            fi
            sleep 15
            continue
          fi

          prior_status=""
          prior_conclusion=""
          IFS=$'\t' read -r prior_status prior_conclusion <<< "${prior_state}"
          if [ "${prior_status}" = "completed" ]; then
            if [ "${prior_conclusion}" = "success" ]; then
              exit 0
            fi
            echo "Prior ${REQUIRED_GATE_NAME} for unchanged head ${HEAD_SHA} concluded ${prior_conclusion:-unknown}." >&2
            exit 1
          fi
          if [ "${prior_status}" = "none" ]; then
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "Timed out waiting for a prior ${REQUIRED_GATE_NAME} on unchanged head ${HEAD_SHA} to appear." >&2
              exit 1
            fi
            echo "No prior ${REQUIRED_GATE_NAME} is visible yet; retrying attempt ${attempt}/${max_attempts}." >&2
            sleep 15
            continue
          fi
          if [ "${prior_status}" != "pending" ]; then
            echo "Unexpected prior ${REQUIRED_GATE_NAME} selection state ${prior_status:-unknown}; refusing to preserve." >&2
            exit 1
          fi
          if [ "${attempt}" -eq "${max_attempts}" ]; then
            echo "Timed out waiting for the relevant prior ${REQUIRED_GATE_NAME} on unchanged head ${HEAD_SHA} to complete." >&2
            exit 1
          fi
          echo "Relevant prior ${REQUIRED_GATE_NAME} is still ${prior_conclusion:-finishing}; retrying attempt ${attempt}/${max_attempts}." >&2
          sleep 15
        done
        echo "Required-gate preservation exhausted its polling loop unexpectedly; refusing to preserve." >&2
        exit 1
