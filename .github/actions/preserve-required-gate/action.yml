name: Preserve Required Gate
description: Preserve a successful required check context for metadata-only pull request edits.
inputs:
  gate-name:
    description: Required check name to preserve.
    required: true
runs:
  using: composite
  steps:
    - name: Poll prior required gate
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REQUIRED_GATE_NAME: ${{ inputs.gate-name }}
      run: |
        set -euo pipefail

        for attempt in $(seq 1 80); do
          prior_state=""
          if ! prior_state="$(gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            -f check_name="${REQUIRED_GATE_NAME}" \
            -f filter=all \
            -f per_page=100 \
            --jq "[.check_runs[] | select(.app.slug == \"github-actions\" and (.details_url // \"\" | contains(\"/actions/runs/${GITHUB_RUN_ID}/\") | not))] | sort_by(.started_at // .created_at) | last | [(.status // \"\"), (.conclusion // \"\")] | @tsv")"; then
            echo "Transient GitHub API failure while checking the prior ${REQUIRED_GATE_NAME}; retrying attempt ${attempt}/80." >&2
            if [ "${attempt}" -eq 80 ]; then
              echo "Timed out waiting for the prior ${REQUIRED_GATE_NAME} on unchanged head ${HEAD_SHA}." >&2
              exit 1
            fi
            sleep 15
            continue
          fi

          prior_status=""
          prior_conclusion=""
          IFS=$'\t' read -r prior_status prior_conclusion <<< "${prior_state}"
          if [ "${prior_status}" = "completed" ]; then
            if [ "${prior_conclusion}" = "success" ]; then
              exit 0
            fi
            echo "Latest prior ${REQUIRED_GATE_NAME} for unchanged head ${HEAD_SHA} concluded ${prior_conclusion:-unknown}." >&2
            exit 1
          fi
          if [ "${attempt}" -eq 80 ]; then
            echo "Timed out waiting for the prior ${REQUIRED_GATE_NAME} on unchanged head ${HEAD_SHA}." >&2
            exit 1
          fi
          sleep 15
        done
