name: Preserve Required Gate
description: Preserve a successful required check context for metadata-only pull request edits.
inputs:
  gate-name:
    description: Required check name to preserve.
    required: true
  workflow-name:
    description: Exact workflow display name that owns the required gate.
    required: true
  workflow-file:
    description: Workflow filename used to resolve the owning workflow identity.
    required: true
  workflow-path:
    description: Exact workflow path returned by the Actions API.
    required: true
runs:
  using: composite
  steps:
    - name: Set up canonical GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Poll prior required gate
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REQUIRED_GATE_NAME: ${{ inputs.gate-name }}
        EXPECTED_WORKFLOW_NAME: ${{ inputs.workflow-name }}
        EXPECTED_WORKFLOW_FILE: ${{ inputs.workflow-file }}
        EXPECTED_WORKFLOW_PATH: ${{ inputs.workflow-path }}
      run: bash "$GITHUB_ACTION_PATH/poll-required-gate.sh"
