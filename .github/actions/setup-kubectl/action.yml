name: Set up kubectl
description: Install the repository-pinned kubectl release for FireMUD workflows.
runs:
  using: composite
  steps:
    - name: Load workflow tool versions
      id: versions
      uses: ./.github/actions/load-workflow-tool-versions

    - name: Install pinned kubectl
      shell: bash
      env:
        KUBECTL_VERSION: ${{ steps.versions.outputs.kubectl-version }}
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS:-}" != Linux || "${RUNNER_ARCH:-}" != X64 ]]; then
          echo "pinned kubectl installer requires a Linux X64 runner" >&2
          exit 1
        fi
        kubectl_version="${KUBECTL_VERSION:?}"
        kubectl_root="${RUNNER_TEMP:?}/firemud-kubectl"
        installation_directory="$kubectl_root/$kubectl_version"
        installed_binary="$installation_directory/kubectl"
        mkdir -p -- "$installation_directory"
        temporary_directory="$(mktemp -d "$kubectl_root/.tmp.XXXXXX")"
        cleanup() {
          if [[ -n "${temporary_directory:-}" && -d "$temporary_directory" ]]; then
            rm -rf -- "$temporary_directory"
          fi
        }
        trap cleanup EXIT
        temporary_binary="$temporary_directory/kubectl"
        temporary_checksum="$temporary_directory/kubectl.sha256"
        staged_binary="$temporary_directory/kubectl.staged"

        curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
          --connect-timeout 10 --max-time 60 \
          "https://dl.k8s.io/release/v${kubectl_version}/bin/linux/amd64/kubectl" \
          -o "$temporary_binary"
        curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
          --connect-timeout 10 --max-time 60 \
          "https://dl.k8s.io/release/v${kubectl_version}/bin/linux/amd64/kubectl.sha256" \
          -o "$temporary_checksum"
        dev-tools/maintenance/verify-publisher-checksum.sh \
          digest "$temporary_checksum" "$temporary_binary" kubectl
        install -m 0755 "$temporary_binary" "$staged_binary"
        mv -fT -- "$staged_binary" "$installed_binary"
        echo "$installation_directory" >> "$GITHUB_PATH"
