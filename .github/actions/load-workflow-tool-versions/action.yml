name: Load workflow tool versions
description: Validate and expose repository-pinned operational workflow tools.
outputs:
  kubectl-version: {value: '${{ steps.versions.outputs.kubectl-version }}'}
  helm-version: {value: '${{ steps.versions.outputs.helm-version }}'}
  helm-linux-amd64-sha256: {value: '${{ steps.versions.outputs.helm-linux-amd64-sha256 }}'}
  gh-version: {value: '${{ steps.versions.outputs.gh-version }}'}
  gh-linux-amd64-sha256: {value: '${{ steps.versions.outputs.gh-linux-amd64-sha256 }}'}
  buf-version: {value: '${{ steps.versions.outputs.buf-version }}'}
  buf-linux-x86-64-sha256: {value: '${{ steps.versions.outputs.buf-linux-x86-64-sha256 }}'}
  kubeconform-version: {value: '${{ steps.versions.outputs.kubeconform-version }}'}
  kubeconform-linux-amd64-sha256: {value: '${{ steps.versions.outputs.kubeconform-linux-amd64-sha256 }}'}
  velero-version: {value: '${{ steps.versions.outputs.velero-version }}'}
  velero-linux-amd64-sha256: {value: '${{ steps.versions.outputs.velero-linux-amd64-sha256 }}'}
  actionlint-version: {value: '${{ steps.versions.outputs.actionlint-version }}'}
  trivy-version: {value: '${{ steps.versions.outputs.trivy-version }}'}
  lychee-version: {value: '${{ steps.versions.outputs.lychee-version }}'}
  lychee-linux-x86-64-musl-sha256: {value: '${{ steps.versions.outputs.lychee-linux-x86-64-musl-sha256 }}'}
  ort-image: {value: '${{ steps.versions.outputs.ort-image }}'}
  zap-image: {value: '${{ steps.versions.outputs.zap-image }}'}
runs:
  using: composite
  steps:
    - name: Validate workflow tool authority
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        authority="${GITHUB_WORKSPACE:?}/config/workflow-tool-versions.env"
        [[ -f "$authority" ]] || { echo "::error title=Workflow tool authority unavailable::Checkout must run before loading workflow tool versions." >&2; exit 1; }
        if grep -Ev '^(#.*|[A-Z][A-Z0-9_]*=[A-Za-z0-9._:-]+|[[:space:]]*)$' "$authority"; then
          echo "::error title=Invalid workflow tool authority::Unexpected syntax in ${authority}." >&2; exit 1
        fi
        # shellcheck disable=SC1090
        source "$authority"
        version_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
        version_keys=(KUBECTL_VERSION HELM_VERSION GH_VERSION BUF_VERSION KUBECONFORM_VERSION VELERO_VERSION ACTIONLINT_VERSION TRIVY_VERSION LYCHEE_VERSION ORT_VERSION ZAP_VERSION)
        for key in "${version_keys[@]}"; do
          value="${!key:-}"
          [[ "$value" =~ $version_pattern ]] || { echo "::error title=Invalid workflow tool version::${key} must be an exact three-part version." >&2; exit 1; }
        done
        pairs=(HELM_VERSION:HELM_LINUX_AMD64_CHECKSUM_VERSION GH_VERSION:GH_LINUX_AMD64_CHECKSUM_VERSION BUF_VERSION:BUF_LINUX_X86_64_CHECKSUM_VERSION KUBECONFORM_VERSION:KUBECONFORM_LINUX_AMD64_CHECKSUM_VERSION VELERO_VERSION:VELERO_LINUX_AMD64_CHECKSUM_VERSION LYCHEE_VERSION:LYCHEE_LINUX_X86_64_MUSL_CHECKSUM_VERSION)
        for pair in "${pairs[@]}"; do
          version_key="${pair%%:*}"; checksum_version_key="${pair##*:}"
          [[ "${!version_key}" == "${!checksum_version_key:-}" ]] || { echo "::error title=Stale workflow tool checksum::${checksum_version_key} must match ${version_key}." >&2; exit 1; }
        done
        checksum_keys=(HELM_LINUX_AMD64_SHA256 GH_LINUX_AMD64_SHA256 BUF_LINUX_X86_64_SHA256 KUBECONFORM_LINUX_AMD64_SHA256 VELERO_LINUX_AMD64_SHA256 LYCHEE_LINUX_X86_64_MUSL_SHA256)
        for key in "${checksum_keys[@]}"; do
          [[ "${!key:-}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error title=Invalid workflow tool checksum::${key} must be a lowercase SHA-256." >&2; exit 1; }
        done
        for key in ORT_DIGEST ZAP_DIGEST; do
          [[ "${!key:-}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error title=Invalid workflow image digest::${key} must be a sha256 digest." >&2; exit 1; }
        done
        {
          echo "kubectl-version=${KUBECTL_VERSION}"
          echo "helm-version=${HELM_VERSION}"
          echo "helm-linux-amd64-sha256=${HELM_LINUX_AMD64_SHA256}"
          echo "gh-version=${GH_VERSION}"
          echo "gh-linux-amd64-sha256=${GH_LINUX_AMD64_SHA256}"
          echo "buf-version=${BUF_VERSION}"
          echo "buf-linux-x86-64-sha256=${BUF_LINUX_X86_64_SHA256}"
          echo "kubeconform-version=${KUBECONFORM_VERSION}"
          echo "kubeconform-linux-amd64-sha256=${KUBECONFORM_LINUX_AMD64_SHA256}"
          echo "velero-version=${VELERO_VERSION}"
          echo "velero-linux-amd64-sha256=${VELERO_LINUX_AMD64_SHA256}"
          echo "actionlint-version=${ACTIONLINT_VERSION}"
          echo "trivy-version=${TRIVY_VERSION}"
          echo "lychee-version=${LYCHEE_VERSION}"
          echo "lychee-linux-x86-64-musl-sha256=${LYCHEE_LINUX_X86_64_MUSL_SHA256}"
          echo "ort-image=ghcr.io/oss-review-toolkit/ort:${ORT_VERSION}@${ORT_DIGEST}"
          echo "zap-image=ghcr.io/zaproxy/zaproxy:${ZAP_VERSION}@${ZAP_DIGEST}"
        } >> "$GITHUB_OUTPUT"
