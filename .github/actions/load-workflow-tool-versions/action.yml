name: Load workflow tool versions
description: Validate and expose repository-pinned operational workflow tools.
outputs:
  kubectl-version:
    description: Pinned kubectl release version
    value: '${{ steps.versions.outputs.kubectl-version }}'
  kubectl-linux-amd64-sha256:
    description: SHA-256 checksum for the pinned Linux amd64 kubectl archive
    value: '${{ steps.versions.outputs.kubectl-linux-amd64-sha256 }}'
  helm-version:
    description: Pinned Helm release version
    value: '${{ steps.versions.outputs.helm-version }}'
  helm-linux-amd64-sha256:
    description: SHA-256 checksum for the pinned Linux amd64 Helm archive
    value: '${{ steps.versions.outputs.helm-linux-amd64-sha256 }}'
  gh-version:
    description: Pinned GitHub CLI release version
    value: '${{ steps.versions.outputs.gh-version }}'
  gh-linux-amd64-sha256:
    description: SHA-256 checksum for the pinned Linux amd64 GitHub CLI archive
    value: '${{ steps.versions.outputs.gh-linux-amd64-sha256 }}'
  buf-version:
    description: Pinned Buf release version
    value: '${{ steps.versions.outputs.buf-version }}'
  buf-linux-x86-64-sha256:
    description: SHA-256 checksum for the pinned Linux x86-64 Buf archive
    value: '${{ steps.versions.outputs.buf-linux-x86-64-sha256 }}'
  kubeconform-version:
    description: Pinned kubeconform release version
    value: '${{ steps.versions.outputs.kubeconform-version }}'
  kubeconform-linux-amd64-sha256:
    description: SHA-256 checksum for the pinned Linux amd64 kubeconform archive
    value: '${{ steps.versions.outputs.kubeconform-linux-amd64-sha256 }}'
  velero-version:
    description: Pinned Velero release version
    value: '${{ steps.versions.outputs.velero-version }}'
  velero-linux-amd64-sha256:
    description: SHA-256 checksum for the pinned Linux amd64 Velero archive
    value: '${{ steps.versions.outputs.velero-linux-amd64-sha256 }}'
  actionlint-version:
    description: Pinned actionlint release version
    value: '${{ steps.versions.outputs.actionlint-version }}'
  trivy-version:
    description: Pinned Trivy release version
    value: '${{ steps.versions.outputs.trivy-version }}'
  trivy-linux-amd64-sha256:
    description: SHA-256 checksum for the pinned Linux amd64 Trivy archive
    value: '${{ steps.versions.outputs.trivy-linux-amd64-sha256 }}'
  lychee-version:
    description: Pinned Lychee release version
    value: '${{ steps.versions.outputs.lychee-version }}'
  lychee-linux-x86-64-musl-sha256:
    description: SHA-256 checksum for the pinned x86-64 musl Lychee archive
    value: '${{ steps.versions.outputs.lychee-linux-x86-64-musl-sha256 }}'
  ort-image:
    description: Immutable ORT container image reference
    value: '${{ steps.versions.outputs.ort-image }}'
  zap-image:
    description: Immutable ZAP container image reference
    value: '${{ steps.versions.outputs.zap-image }}'
runs:
  using: composite
  steps:
    - name: Validate workflow tool authority
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        authority="${GITHUB_WORKSPACE:?}/config/workflow-tool-versions.env"
        [[ -f "$authority" ]] || { echo "::error title=Workflow tool authority unavailable::Checkout must run before loading workflow tool versions." >&2; exit 1; }
        if grep -Ev '^(#.*|[A-Z][A-Z0-9_]*=[A-Za-z0-9._:-]+|[[:space:]]*)$' "$authority"; then
          echo "::error title=Invalid workflow tool authority::Unexpected syntax in ${authority}." >&2; exit 1
        fi
        supported_keys=(
          KUBECTL_VERSION KUBECTL_LINUX_AMD64_CHECKSUM_VERSION KUBECTL_LINUX_AMD64_SHA256
          HELM_VERSION HELM_LINUX_AMD64_CHECKSUM_VERSION HELM_LINUX_AMD64_SHA256
          GH_VERSION GH_LINUX_AMD64_CHECKSUM_VERSION GH_LINUX_AMD64_SHA256
          BUF_VERSION BUF_LINUX_X86_64_CHECKSUM_VERSION BUF_LINUX_X86_64_SHA256
          KUBECONFORM_VERSION KUBECONFORM_LINUX_AMD64_CHECKSUM_VERSION KUBECONFORM_LINUX_AMD64_SHA256
          VELERO_VERSION VELERO_LINUX_AMD64_CHECKSUM_VERSION VELERO_LINUX_AMD64_SHA256 VELERO_IMAGE_DIGEST
          ACTIONLINT_VERSION
          TRIVY_VERSION TRIVY_LINUX_AMD64_CHECKSUM_VERSION TRIVY_LINUX_AMD64_SHA256
          LYCHEE_VERSION LYCHEE_LINUX_X86_64_MUSL_CHECKSUM_VERSION LYCHEE_LINUX_X86_64_MUSL_SHA256
          ORT_VERSION ORT_DIGEST
          ZAP_VERSION ZAP_DIGEST
        )
        declare -A seen_keys=()
        while IFS= read -r line || [[ -n "$line" ]]; do
          [[ -z "${line//[[:space:]]/}" || "$line" == \#* ]] && continue
          key="${line%%=*}"
          if [[ ! " ${supported_keys[*]} " == *" ${key} "* ]]; then
            echo "::error title=Unsupported workflow tool authority key::${key} is not supported." >&2; exit 1
          fi
          if [[ -n "${seen_keys[$key]+x}" ]]; then
            echo "::error title=Duplicate workflow tool authority key::${key} must be defined exactly once." >&2; exit 1
          fi
          seen_keys[$key]=1
        done < "$authority"
        for key in "${supported_keys[@]}"; do
          if [[ -z "${seen_keys[$key]+x}" ]]; then
            echo "::error title=Missing workflow tool authority key::${key} must be defined exactly once." >&2
            exit 1
          fi
        done
        # shellcheck disable=SC1090
        source "$authority"
        version_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
        version_keys=(KUBECTL_VERSION HELM_VERSION GH_VERSION BUF_VERSION KUBECONFORM_VERSION VELERO_VERSION ACTIONLINT_VERSION TRIVY_VERSION LYCHEE_VERSION ORT_VERSION ZAP_VERSION)
        for key in "${version_keys[@]}"; do
          value="${!key:-}"
          [[ "$value" =~ $version_pattern ]] || { echo "::error title=Invalid workflow tool version::${key} must be an exact three-part version." >&2; exit 1; }
        done
        pairs=(KUBECTL_VERSION:KUBECTL_LINUX_AMD64_CHECKSUM_VERSION HELM_VERSION:HELM_LINUX_AMD64_CHECKSUM_VERSION GH_VERSION:GH_LINUX_AMD64_CHECKSUM_VERSION BUF_VERSION:BUF_LINUX_X86_64_CHECKSUM_VERSION KUBECONFORM_VERSION:KUBECONFORM_LINUX_AMD64_CHECKSUM_VERSION VELERO_VERSION:VELERO_LINUX_AMD64_CHECKSUM_VERSION TRIVY_VERSION:TRIVY_LINUX_AMD64_CHECKSUM_VERSION LYCHEE_VERSION:LYCHEE_LINUX_X86_64_MUSL_CHECKSUM_VERSION)
        for pair in "${pairs[@]}"; do
          version_key="${pair%%:*}"; checksum_version_key="${pair##*:}"
          [[ "${!version_key}" == "${!checksum_version_key:-}" ]] || { echo "::error title=Stale workflow tool checksum::${checksum_version_key} must match ${version_key}." >&2; exit 1; }
        done
        checksum_keys=(KUBECTL_LINUX_AMD64_SHA256 HELM_LINUX_AMD64_SHA256 GH_LINUX_AMD64_SHA256 BUF_LINUX_X86_64_SHA256 KUBECONFORM_LINUX_AMD64_SHA256 VELERO_LINUX_AMD64_SHA256 TRIVY_LINUX_AMD64_SHA256 LYCHEE_LINUX_X86_64_MUSL_SHA256)
        for key in "${checksum_keys[@]}"; do
          [[ "${!key:-}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error title=Invalid workflow tool checksum::${key} must be a lowercase SHA-256." >&2; exit 1; }
        done
        for key in VELERO_IMAGE_DIGEST ORT_DIGEST ZAP_DIGEST; do
          [[ "${!key:-}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error title=Invalid workflow image digest::${key} must be a sha256 digest." >&2; exit 1; }
        done
        {
          echo "kubectl-version=${KUBECTL_VERSION}"
          echo "kubectl-linux-amd64-sha256=${KUBECTL_LINUX_AMD64_SHA256}"
          echo "helm-version=${HELM_VERSION}"
          echo "helm-linux-amd64-sha256=${HELM_LINUX_AMD64_SHA256}"
          echo "gh-version=${GH_VERSION}"
          echo "gh-linux-amd64-sha256=${GH_LINUX_AMD64_SHA256}"
          echo "buf-version=${BUF_VERSION}"
          echo "buf-linux-x86-64-sha256=${BUF_LINUX_X86_64_SHA256}"
          echo "kubeconform-version=${KUBECONFORM_VERSION}"
          echo "kubeconform-linux-amd64-sha256=${KUBECONFORM_LINUX_AMD64_SHA256}"
          echo "velero-version=${VELERO_VERSION}"
          echo "velero-linux-amd64-sha256=${VELERO_LINUX_AMD64_SHA256}"
          echo "actionlint-version=${ACTIONLINT_VERSION}"
          echo "trivy-version=${TRIVY_VERSION}"
          echo "trivy-linux-amd64-sha256=${TRIVY_LINUX_AMD64_SHA256}"
          echo "lychee-version=${LYCHEE_VERSION}"
          echo "lychee-linux-x86-64-musl-sha256=${LYCHEE_LINUX_X86_64_MUSL_SHA256}"
          echo "ort-image=ghcr.io/oss-review-toolkit/ort:${ORT_VERSION}@${ORT_DIGEST}"
          echo "zap-image=ghcr.io/zaproxy/zaproxy:${ZAP_VERSION}@${ZAP_DIGEST}"
        } >> "$GITHUB_OUTPUT"
