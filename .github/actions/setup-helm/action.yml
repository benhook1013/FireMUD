name: Set up Helm
description: Install and verify the pinned Helm release for FireMUD workflows.
runs:
  using: composite
  steps:
    - name: Install pinned Helm
      shell: bash
      run: |
        set -euo pipefail

        helm_version='v3.20.1'
        helm_sha256='0165ee4a2db012cc657381001e593e981f42aa5707acdd50658326790c9d0dc3'
        if [[ "${RUNNER_OS:-}" != Linux || "${RUNNER_ARCH:-}" != X64 ]]; then
          echo "pinned Helm installer requires a Linux X64 runner" >&2
          exit 1
        fi
        if command -v helm >/dev/null 2>&1; then
          installed_helm="$(command -v helm)"
          if installed_version="$(helm version --template '{{ .Version }}')" \
            && [[ "$installed_version" == "$helm_version" ]]; then
            echo "Using already-installed Helm ${helm_version} at ${installed_helm}."
            exit 0
          fi
        fi
        helm_root="${RUNNER_TEMP:?}/firemud-helm/${helm_version}"
        archive_path="${helm_root}/helm.tar.gz"
        extraction_dir="${helm_root}/extracted"
        install_dir="${helm_root}/bin"

        mkdir -p -- "$extraction_dir" "$install_dir"
        curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
          "https://get.helm.sh/helm-${helm_version}-linux-amd64.tar.gz" \
          -o "$archive_path"
        printf '%s  %s\n' "$helm_sha256" "$archive_path" \
          | sha256sum --check --status
        tar -xzf "$archive_path" -C "$extraction_dir"
        install -m 0755 "$extraction_dir/linux-amd64/helm" "$install_dir/helm"

        reported_version="$(
          "$install_dir/helm" version --template '{{ .Version }}'
        )"
        if [[ "$reported_version" != "$helm_version" ]]; then
          echo "::error title=Helm version mismatch::Expected ${helm_version}, but the installed Helm binary reported ${reported_version}." >&2
          exit 1
        fi
        echo "$install_dir" >> "$GITHUB_PATH"
