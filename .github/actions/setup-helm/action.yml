name: Set up Helm
description: Install and verify the pinned Helm release for FireMUD workflows.
runs:
  using: composite
  steps:
    - name: Load workflow tool versions
      id: versions
      uses: ./.github/actions/load-workflow-tool-versions

    - name: Validate supported runner
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS:-}" != Linux || "${RUNNER_ARCH:-}" != X64 ]]; then
          echo "pinned Helm installer requires a Linux X64 runner" >&2
          exit 1
        fi

    - name: Restore pinned Helm archive
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/firemud-helm/v${{ steps.versions.outputs.helm-version }}/helm.tar.gz
        key: firemud-helm-${{ runner.os }}-${{ runner.arch }}-v${{ steps.versions.outputs.helm-version }}

    - name: Install pinned Helm
      shell: bash
      env:
        HELM_VERSION: v${{ steps.versions.outputs.helm-version }}
      run: |
        set -euo pipefail

        helm_version="${HELM_VERSION:?}"
        helm_root="${RUNNER_TEMP:?}/firemud-helm/${helm_version}"
        archive_path="${helm_root}/helm.tar.gz"
        extraction_dir="${helm_root}/extracted"
        install_dir="${helm_root}/bin"
        checksum_path="${helm_root}/helm.tar.gz.sha256sum"
        expected_archive_name="helm-${helm_version}-linux-amd64.tar.gz"

        mkdir -p -- "$helm_root" "$install_dir"
        curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
          "https://get.helm.sh/${expected_archive_name}.sha256sum" \
          -o "$checksum_path"
        if [[ ! -f "$archive_path" ]] || ! dev-tools/maintenance/verify-publisher-checksum.sh \
          manifest "$checksum_path" "$archive_path" "$expected_archive_name"; then
          temporary_archive="$(mktemp -- "${helm_root}/helm.tar.gz.XXXXXX")"
          trap 'rm -f -- "$temporary_archive"' EXIT
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            "https://get.helm.sh/${expected_archive_name}" \
            -o "$temporary_archive"
          dev-tools/maintenance/verify-publisher-checksum.sh \
            manifest "$checksum_path" "$temporary_archive" "$expected_archive_name"
          mv -fT -- "$temporary_archive" "$archive_path"
          trap - EXIT
        fi
        # Revalidate the canonical archive after either cache restore or download before extraction.
        dev-tools/maintenance/verify-publisher-checksum.sh \
          manifest "$checksum_path" "$archive_path" "$expected_archive_name"
        rm -rf -- "$extraction_dir"
        mkdir -p -- "$extraction_dir"
        tar -xzf "$archive_path" -C "$extraction_dir" -- linux-amd64/helm
        install -m 0755 "$extraction_dir/linux-amd64/helm" "$install_dir/helm"

        reported_version="$(
          "$install_dir/helm" version --template '{{ .Version }}'
        )"
        if [[ "$reported_version" != "$helm_version" ]]; then
          echo "::error title=Helm version mismatch::Expected ${helm_version}, but the installed Helm binary reported ${reported_version}." >&2
          exit 1
        fi
        echo "$install_dir" >> "$GITHUB_PATH"
