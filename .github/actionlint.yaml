self-hosted-runner:
  labels:
    - preview

# GitHub Actions added concurrency.queue in May 2026. The repository-pinned
# actionlint release does not parse it, so suppress only that known parser lag
# only in workflows explicitly using this documented queue option.
paths:
  .github/workflows/admit-pr-runtime-refresh.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/static-analysis-summary.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/preview.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/preview-janitor.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/hosted-identity-request.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/runtime-images.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
      # Provider-supported job cache permissions validated by the runtime image contract.
      - 'unexpected key "cache-mode" for "job" section'
  .github/workflows/preview-cleanup-proof.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/game-session-factory-qualification.yml:
    # ubuntu-26.04 is an official GA GitHub-hosted label; remove this when the
    # pinned actionlint release recognizes it.
    ignore:
      - 'label "ubuntu-26\.04" is unknown.*'
