# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: true
language: "en-US"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    Summarize the change in concise release-note style for FireMUD contributors.
    Explicitly name the affected services, shared modules, workflows, or docs.
    Call out contract changes, schema or migration changes, environment or deployment changes, and any validation or testing gaps.
    Prefer factual technical language over generic praise.
  review_status: true
  auto_review:
    # Request full Hosted reviews through the supplied FireController connection.
    enabled: false
    auto_incremental_review: false
    drafts: false
    base_branches:
      - "develop"
      - "main"
    ignore_usernames:
      - "app/dependabot"
      - "app/renovate"
      - "dependabot"
      - "dependabot[bot]"
      - "renovate"
      - "renovate[bot]"
  tools:
    pmd:
      config_file: "ruleset.xml"
  path_instructions:
    - path: "**"
      instructions: |
        FireMUD is pre-v1. Focus on defects that break this PR's stated purpose, correctness, security, data integrity, or documented contracts.
        Still report worthwhile improvements that belong in this PR's purpose, especially small ones.
        For improvements outside the PR's purpose, outside v1 scope, or that would grow the PR materially (but not fixes or proof the PR needs to be correct), say so explicitly (for example "outside v1 scope" or "can be routed") so they can be routed instead of fixed here.
        Avoid speculative hardening, broad refactors, and style preferences unless they cause a real defect.
    - path: "services/**"
      instructions: |
        Prioritize bugs, regressions, missing tests, cross-service contract drift, and architecture mismatches over style nits.
        Flag changes that violate documented FireMUD invariants, especially gRPC application-error handling, ownership boundaries, and failure-mode expectations.
        For SQL-backed services, expect jOOQ + Flyway rather than ORM-oriented guidance.
    - path: "web-client/**"
      instructions: |
        Focus on behavioral regressions, accessibility, React correctness, and consistency with the existing app patterns.
        Avoid generic visual or stylistic advice unless it affects usability, maintainability, or documented repo conventions.
    - path: ".github/workflows/**"
      instructions: |
        Focus on workflow correctness, permissions scope, secret handling, cache correctness, duplication, and CI cost.
        Flag cases where a workflow becomes unnecessarily blocking or duplicates an existing validation path.
    - path: "design/**/*.md"
      instructions: |
        Review docs for canonical-current-state consistency.
        Flag obsolete transitional guidance, conflicts between architecture docs, broken repo links, or instructions that contradict AGENTS.md.
        Architecture owns technical target state; AGENTS.md owns only repository-wide AI authority, safety, and workflow routing.
    - path: "design/architecture/decisions/**"
      instructions: |
        Before challenging an ADR's status or human-review metadata, apply the Status-to-Review Mapping in design/architecture/decisions/README.md, the checked rows in design/project-management/design-alignment/consequential-decision-inventory.md, and the checks in dev-tools/validation/check-adr-review-status.py. Pre-formal ADRs 0001 through 0011 are the historical exception. Do not infer review evidence from ADR-local text alone.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
chat:
  auto_reply: true
