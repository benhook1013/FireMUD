# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: true
language: "en-US"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    Summarize the change in concise release-note style for FireMUD contributors.
    Explicitly name the affected services, shared modules, workflows, or docs.
    Call out contract changes, schema or migration changes, environment or deployment changes, and any validation or testing gaps.
    Prefer factual technical language over generic praise.
  review_status: true
  auto_review:
    enabled: true
    auto_incremental_review: false
    drafts: false
    base_branches:
      - "develop"
      - "main"
    ignore_usernames:
      - "app/dependabot"
      - "app/renovate"
      - "dependabot"
      - "dependabot[bot]"
      - "renovate"
      - "renovate[bot]"
  tools:
    pmd:
      config_file: "ruleset.xml"
  path_instructions:
    - path: "services/**"
      instructions: |
        Prioritize bugs, regressions, missing tests, cross-service contract drift, and architecture mismatches over style nits.
        Flag changes that violate documented FireMUD invariants, especially gRPC application-error handling, ownership boundaries, and failure-mode expectations.
        For SQL-backed services, expect jOOQ + Flyway rather than ORM-oriented guidance.
    - path: "web-client/**"
      instructions: |
        Focus on behavioral regressions, accessibility, React correctness, and consistency with the existing app patterns.
        Avoid generic visual or stylistic advice unless it affects usability, maintainability, or documented repo conventions.
    - path: ".github/workflows/**"
      instructions: |
        Focus on workflow correctness, permissions scope, secret handling, cache correctness, duplication, and CI cost.
        Flag cases where a workflow becomes unnecessarily blocking or duplicates an existing validation path.
    - path: "design/**/*.md"
      instructions: |
        Review docs for canonical-current-state consistency.
        Flag obsolete transitional guidance, conflicts between architecture docs, broken repo links, or instructions that contradict AGENTS.md.
        Architecture owns technical target state; AGENTS.md owns only repository-wide AI authority, safety, and workflow routing.
    - path: "design/architecture/decisions/**"
      instructions: |
        Before challenging an ADR's status or human-review metadata, apply the status-to-review mapping to every formal ADR: terminal statuses require checked queue provenance and completed matching metadata, while `Proposed - Pending Human Review` is the sole no-queue exception and must retain its exact pending metadata. Pre-formal ADRs 0001 through 0011 are the explicit historical exception. Check every checked provenance row that names the ADR in design/project-management/design-alignment/consequential-decision-inventory.md and the aggregation contract enforced by dev-tools/validation/check-adr-review-status.py. Compare aggregated review dates, terminal dispositions, and source keys with the ADR metadata; do not infer evidence from ADR-local text alone. Every checked non-alias row with an `accepted`, `revised`, `superseded`, or `withdrawn` disposition requires exact `[ADR NNNN]` provenance. A superseded scan alias is a historical replacement mapping, not a separate ADR decision: every link must be a replacement-decision Markdown link with a non-provenance label (`replacement ADR NNNN` or a decision key), and must not be arbitrary or exact `[ADR NNNN]` provenance.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
chat:
  auto_reply: true
